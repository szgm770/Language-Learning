name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Build and test exactly as GitHub Pages serves it.
      PAGES_BASE_PATH: /Language-Learning
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Content is valid
        run: pnpm content:build
      - name: Types
        run: pnpm typecheck
      - name: Unit and property tests
        run: pnpm test
      - name: Build static site
        run: pnpm build
      - name: Install browser
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Which files changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" > "$RUNNER_TEMP/changed.txt"
          else
            git diff --name-only HEAD^ HEAD > "$RUNNER_TEMP/changed.txt" || : > "$RUNNER_TEMP/changed.txt"
          fi
          cat "$RUNNER_TEMP/changed.txt"
          {
            echo 'E2E_CHANGED_FILES<<EOF'
            cat "$RUNNER_TEMP/changed.txt"
            echo 'EOF'
          } >> "$GITHUB_ENV"
      - name: End-to-end (phone only; only changed lessons are solved, offline included)
        run: pnpm --filter web e2e --project=phone
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: apps/web/test-results
