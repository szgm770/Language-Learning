name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Build and test exactly as GitHub Pages serves it.
      PAGES_BASE_PATH: /Language-Learning
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Content is valid
        run: pnpm content:build
      - name: Types
        run: pnpm typecheck
      - name: Unit and property tests
        run: pnpm test
      - name: Build static site
        run: pnpm build
      - name: Install browser
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: End-to-end (phone and desktop, including offline)
        run: pnpm --filter web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: apps/web/test-results
