          - { speaker: "noa", text: "This morning it was rainy, then it was sunny, and now it's windy!", translation: "הבוקר היה גשום, אחר כך היה שמשי, ועכשיו יש רוח!" }
          - { speaker: "noa", text: "Yes, I've got an umbrella. Always!", translation: "כן, יש לי מטרייה. תמיד!" }
