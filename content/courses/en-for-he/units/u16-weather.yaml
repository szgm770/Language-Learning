grammar:
  - id: comparatives
    title: { he: "השוואה: colder, more expensive", en: "Comparatives" }
    explanation: |
      בעברית מוסיפים "יותר": קר יותר, יקר יותר. באנגלית זה תלוי באורך המילה:

      - מילה קצרה (הברה אחת): מוסיפים **‎-er**: **cold → colder**, **warm → warmer**, **cheap → cheaper**.
      - מילה שנגמרת ב־y: **sunny → sunnier**, **windy → windier**.
      - מילה ארוכה: **more** לפניה: **more expensive**, **more beautiful**.
      - יוצאי דופן: **good → better**, **bad → worse**.

      ו"מ־" של ההשוואה הוא **than**: **London is colder than Tel Aviv.**

      כשהשניים שווים: **as … as**: **Today is as warm as yesterday.**
    examples:
      - { text: "Winter in London is colder than in Israel.", translation: "החורף בלונדון קר יותר מבישראל." }
      - { text: "The train is more expensive than the bus.", translation: "הרכבת יקרה יותר מהאוטובוס." }
      - { text: "Today isn't as sunny as yesterday.", translation: "היום לא שמשי כמו אתמול." }

