grammar:
  - id: present-perfect-continuous
    title: { he: "כבר… ועדיין: I've been working", en: "Present perfect continuous" }
    explanation: |
      בעברית "אני עובדת על זה כבר שלושה חודשים" (בהווה). באנגלית, כשפעולה **התחילה בעבר ונמשכת עד עכשיו** והדגש הוא על **המשך** שלה, משתמשים ב:
      **have / has been + ‎-ing**
      **I've been working on this project for three months.**

      הווה מושלם רגיל מול מתמשך:
      - **I've written five reports.** (תוצאה, כמה) → הדגש על מה שהושג.
      - **I've been writing reports all day.** (תהליך) → הדגש על הזמן והמאמץ.

      משתמשים במתמשך גם כשרואים תוצאה של פעולה שזה עתה הסתיימה: **You look tired. Have you been working late?**

      פעלי מצב (know, like, want, believe) לא מקבלים ‎-ing: **I've known her for years**, לא "I've been knowing".
    examples:
      - { text: "Noa has been leading the team since January.", translation: "נועה מובילה את הצוות מאז ינואר." }
      - { text: "How long have you been waiting?", translation: "כמה זמן אתה מחכה?" }
      - { text: "I've been thinking about your offer.", translation: "חשבתי על ההצעה שלך (ועדיין חושבת)." }

lessons:
  # ------------------------------------------------------------------ 1
  - id: u31-l1
    kind: new
    title: { he: "שיחת הערכה", en: "The performance review" }
    exercises:
      - id: u31-l1-01
        type: dialogue
        scene: "שיחת ההערכה השנתית של נועה עם מרים."
        lines:
          - { speaker: "miriam", text: "Noa, this is your performance review. Let's start with the good news: the client loves your work.", translation: "נועה, זו שיחת ההערכה שלך. בואי נתחיל בחדשות הטובות: הלקוח אוהב את העבודה שלך." }
          - { speaker: "noa", text: "Thank you. It's been a real challenge, but I've enjoyed it.", translation: "תודה. זה היה אתגר אמיתי, אבל נהניתי." }
          - { speaker: "miriam", text: "You've taken on a lot of responsibility this year. And I have some feedback.", translation: "לקחת על עצמך הרבה אחריות השנה. ויש לי קצת משוב." }
          - { speaker: "noa", text: "Of course. Go ahead.", translation: "בוודאי. בבקשה." }
          - { speaker: "miriam", text: "You try to do everything yourself. Sometimes you should let the team help.", translation: "את מנסה לעשות הכול לבד. לפעמים כדאי לך לתת לצוות לעזור." }
          - { speaker: "noa", text: "That's a fair point. To be honest, I've been feeling a bit overwhelmed lately.", translation: "נקודה הוגנת. למען האמת, אני מרגישה קצת מוצפת בזמן האחרון." }
      - { id: "u31-l1-02", type: "learn", lexeme: "performance-review" }
      - { id: "u31-l1-03", type: "learn", lexeme: "challenge" }
      - { id: "u31-l1-04", type: "learn", lexeme: "take-on" }
      - { id: "u31-l1-05", type: "learn", lexeme: "responsibility" }
      - { id: "u31-l1-06", type: "learn", lexeme: "feedback" }
