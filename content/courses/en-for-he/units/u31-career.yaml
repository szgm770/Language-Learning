  - id: u31-l5
    kind: reading
    title: { he: "הקידום שלא רציתי", en: "The promotion I didn't want" }
    exercises:
      - id: u31-l5-01
        type: reading
        kind: "מאמר דעה באתר קריירה"
        title: "Why I turned down a promotion"
        text: |
          Last year I was offered the job I had been working towards for ten years: head of department, with a 30 percent pay rise. I turned it down, and I've never regretted it.

          For months I had been feeling overwhelmed. I'd been answering emails at midnight and missing my children's football matches. The new role would have meant even more responsibility and even less time.

          Many ambitious people believe that a career only moves in one direction: up. But a career is not a ladder; it's more like a map. Sometimes the best opportunity is the one that lets you stay where you are and do your job well.

          I've been working four days a week since then. I'm less tired, my team is happier, and, to be honest, my work has never been better.
        translation: |
          בשנה שעברה הציעו לי את התפקיד שעבדתי לקראתו עשר שנים: ראש מחלקה, עם העלאה של 30 אחוז במשכורת. דחיתי אותו, ואף פעם לא התחרטתי.

          במשך חודשים הרגשתי מוצפת. עניתי למיילים בחצות ופספסתי את משחקי הכדורגל של הילדים שלי. התפקיד החדש היה אומר עוד יותר אחריות ועוד פחות זמן.

          הרבה אנשים שאפתנים מאמינים שקריירה זזה רק לכיוון אחד: למעלה. אבל קריירה היא לא סולם; היא יותר כמו מפה. לפעמים ההזדמנות הכי טובה היא זו שמאפשרת לך להישאר איפה שאת ולעשות את העבודה שלך טוב.

          מאז אני עובדת ארבעה ימים בשבוע. אני פחות עייפה, הצוות שלי מאושר יותר, ובכנות, העבודה שלי מעולם לא הייתה טובה יותר.
