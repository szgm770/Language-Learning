id: u31-career
cefr: B2
scene: work
title:
  he: מהלכים בקריירה
  en: Career moves
story: "הפרויקט הצליח, ונועה מקבלת שתי הצעות: קידום בלונדון, ותפקיד בכיר בתל אביב. בשיחת משוב עם מרים היא מגלה כמה עבדה, כמה התעייפה, ומה היא באמת רוצה."
canDo:
  - לנהל שיחת משוב מקצועית ולהגיב לביקורת
  - לדבר על שאיפות ועל הזדמנויות בקריירה
  - להשתמש בהווה מושלם מתמשך (I've been working…)
  - להבחין בין I've worked ל־I've been working

