grammar:
  - id: present-perfect-continuous
    title: { he: "כבר… ועדיין: I've been working", en: "Present perfect continuous" }
    explanation: |
      בעברית "אני עובדת על זה כבר שלושה חודשים" (בהווה). באנגלית, כשפעולה **התחילה בעבר ונמשכת עד עכשיו** והדגש הוא על **המשך** שלה, משתמשים ב:
      **have / has been + ‎-ing**
      **I've been working on this project for three months.**

      הווה מושלם רגיל מול מתמשך:
      - **I've written five reports.** (תוצאה, כמה) → הדגש על מה שהושג.
      - **I've been writing reports all day.** (תהליך) → הדגש על הזמן והמאמץ.

      משתמשים במתמשך גם כשרואים תוצאה של פעולה שזה עתה הסתיימה: **You look tired. Have you been working late?**

      פעלי מצב (know, like, want, believe) לא מקבלים ‎-ing: **I've known her for years**, לא "I've been knowing".
    examples:
      - { text: "Noa has been leading the team since January.", translation: "נועה מובילה את הצוות מאז ינואר." }
      - { text: "How long have you been waiting?", translation: "כמה זמן אתה מחכה?" }
      - { text: "I've been thinking about your offer.", translation: "חשבתי על ההצעה שלך (ועדיין חושבת)." }

