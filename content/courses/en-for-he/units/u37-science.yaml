          - { speaker: "ben", text: "Is there any treatment for sleep-deprived workers?", translation: "יש טיפול לעובדים חסרי שינה?" }
          - { speaker: "dr-stern", text: "The best treatment is simple: go to bed earlier. There are no side effects.", translation: "הטיפול הטוב ביותר פשוט: ללכת לישון מוקדם יותר. אין תופעות לוואי." }
