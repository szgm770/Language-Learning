  - { id: "evidence", text: "evidence", translation: "ראיות", pos: "noun", pronunciation: "אֶבִּידֶנְס" }
  - { id: "result-noun", text: "result", translation: "תוצאה", pos: "noun", pronunciation: "רִיזַאלְט" }
  - { id: "treatment", text: "treatment", translation: "טיפול", pos: "noun", pronunciation: "טְרִיטְמֶנְט" }
  - { id: "symptom", text: "symptom", translation: "סימפטום, תסמין", pos: "noun", pronunciation: "סִימְפְּטֶם" }
  - { id: "side-effect", text: "side effect", translation: "תופעת לוואי", pos: "noun", pronunciation: "סַיִיד אִיפֶקְט" }
  - { id: "recover", text: "recover", translation: "להחלים", pos: "verb", pronunciation: "רִיקַאבֶר" }
  - { id: "prevent", text: "prevent", translation: "למנוע", pos: "verb", pronunciation: "פְּרִיבֶנְט" }
  - { id: "claim", text: "claim", translation: "לטעון; טענה", pos: "verb", pronunciation: "קְלֵיים" }
  - { id: "suggest", text: "suggest", translation: "להציע", pos: "verb", pronunciation: "סַאג'ֶסְט", example: { text: "She suggested going for a walk.", translation: "היא הציעה ללכת לטייל." } }
  - { id: "advise", text: "advise", translation: "לייעץ", pos: "verb", pronunciation: "אַדְוַויז", example: { text: "The doctor advised him to rest.", translation: "הרופא יעץ לו לנוח." } }
  - { id: "recommend", text: "recommend", translation: "להמליץ", pos: "verb", pronunciation: "רֶקוֹמֶנְד" }
  - { id: "admit", text: "admit", translation: "להודות", pos: "verb", pronunciation: "אַדְמִיט", example: { text: "He admitted making a mistake.", translation: "הוא הודה שטעה." } }
  - { id: "deny", text: "deny", translation: "להכחיש", pos: "verb", pronunciation: "דִינַיי" }
  - { id: "insist", text: "insist", translation: "להתעקש", pos: "verb", pronunciation: "אִינְסִיסְט" }
  - { id: "sleep-deprived", text: "sleep-deprived", translation: "חסר שינה", pos: "adjective", pronunciation: "סְלִיפּ דִיפְּרַייבְד" }

grammar:
  - id: reporting-verbs
    title: { he: "פעלי דיווח", en: "Reporting verbs" }
    explanation: |
      במקום "He said: 'I'll rest'" אפשר לדווח בצורה קצרה וטבעית יותר עם **פועל דיווח**. כל פועל נושא תבנית משלו:

      - **suggest + V-ing**: *She suggested going for a walk.*
      - **advise / recommend / warn + אדם + to + V**: *The doctor advised him to rest.*
      - **admit / deny + V-ing**: *He admitted making a mistake. / She denied taking it.*
      - **insist on + V-ing**: *They insisted on paying.*
      - **claim + to + V**: *The company claims to be the best.*

      שימו לב: אחרי **suggest** לא אומרים "to":
      ✗ She suggested to go. ✓ She suggested going.
    examples:
      - { text: "Dr. Stern advised us to sleep eight hours.", translation: "ד\"ר שטרן יעץ לנו לישון שמונה שעות." }
      - { text: "He admitted working late every night.", translation: "הוא הודה שהוא עובד עד מאוחר כל לילה." }
      - { text: "She suggested taking a short break.", translation: "היא הציעה לקחת הפסקה קצרה." }

