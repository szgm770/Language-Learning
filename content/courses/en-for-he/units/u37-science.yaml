grammar:
  - id: reporting-verbs
    title: { he: "פעלי דיווח", en: "Reporting verbs" }
    explanation: |
      במקום "He said: 'I'll rest'" אפשר לדווח בצורה קצרה וטבעית יותר עם **פועל דיווח**. כל פועל נושא תבנית משלו:

      - **suggest + V-ing**: *She suggested going for a walk.*
      - **advise / recommend / warn + אדם + to + V**: *The doctor advised him to rest.*
      - **admit / deny + V-ing**: *He admitted making a mistake. / She denied taking it.*
      - **insist on + V-ing**: *They insisted on paying.*
      - **claim + to + V**: *The company claims to be the best.*

      שימו לב: אחרי **suggest** לא אומרים "to":
      ✗ She suggested to go. ✓ She suggested going.
    examples:
      - { text: "Dr. Stern advised us to sleep eight hours.", translation: "ד\"ר שטרן יעץ לנו לישון שמונה שעות." }
      - { text: "He admitted working late every night.", translation: "הוא הודה שהוא עובד עד מאוחר כל לילה." }
      - { text: "She suggested taking a short break.", translation: "היא הציעה לקחת הפסקה קצרה." }

