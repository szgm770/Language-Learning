      - id: u37-l1-01
        type: dialogue
        scene: "הרצאה בחברה. ד\"ר שטרן מציג מחקר חדש."
        lines:
          - { speaker: "dr-stern", text: "Our study followed two thousand people for five years.", translation: "המחקר שלנו עקב אחרי אלפיים איש במשך חמש שנים." }
          - { speaker: "dr-stern", text: "The results show clear evidence: people who sleep less than six hours get ill more often.", translation: "התוצאות מראות ראיות ברורות: אנשים שישנים פחות משש שעות חולים לעתים קרובות יותר." }
          - { speaker: "ben", text: "Is there any treatment for sleep-deprived workers?", translation: "יש טיפול לעובדים חסרי שינה?" }
          - { speaker: "dr-stern", text: "The best treatment is simple: go to bed earlier. There are no side effects.", translation: "הטיפול הטוב ביותר פשוט: ללכת לישון מוקדם יותר. אין תופעות לוואי." }
