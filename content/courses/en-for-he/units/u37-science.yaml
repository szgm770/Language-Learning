id: u37-science
cefr: B2
scene: health
title:
  he: בריאות ומדע
  en: Health and science
story: "ד\"ר שטרן מציג מחקר חדש על שינה ובריאות, ובן ונועה מדווחים עליו לצוות. הם לומדים לספר מה אחרים אמרו בלי לצטט מילה במילה."
canDo:
  - לדווח על דברי אחרים בעזרת פעלי דיווח (suggest, advise, admit, deny…)
  - לדבר על מחקרים, טיפול ובריאות
  - להבדיל בין עובדה, טענה והמלצה
  - לקרוא כתבה על מחקר רפואי

