  # ------------------------------------------------------------------ 5
  - id: u37-l5
    kind: reading
    title: { he: "כתבה: האם אפשר לישון פחות?", en: "Can we sleep less?" }
    exercises:
      - id: u37-l5-01
        type: reading
        kind: "כתבה מדעית"
        title: "Can we really sleep less?"
        text: |
          Some people claim to need only four hours of sleep. A new study suggests that this is almost always a mistake.

          Scientists followed a group of sleep-deprived workers for a year. Many admitted feeling tired, but most insisted that they were fine. The results, however, were clear: they made more mistakes, forgot more, and got ill more often.

          The researchers advised everyone to sleep between seven and nine hours, and recommended going to bed at the same time every night. They also warned people not to look at their phones in bed. None of the treatments has side effects, and the evidence is strong: good sleep can prevent many problems.
        translation: |
          יש אנשים הטוענים שהם צריכים רק ארבע שעות שינה. מחקר חדש מציע שזו כמעט תמיד טעות.

          מדענים עקבו אחרי קבוצת עובדים חסרי שינה במשך שנה. רבים הודו שהם מרגישים עייפים, אבל רובם התעקשו שהם בסדר. התוצאות, עם זאת, היו ברורות: הם עשו יותר טעויות, שכחו יותר, וחלו לעתים קרובות יותר.

          החוקרים יעצו לכולם לישון בין שבע לתשע שעות, והמליצו ללכת לישון באותה שעה בכל לילה. הם גם הזהירו אנשים לא להסתכל בטלפון במיטה. לאף אחד מהטיפולים אין תופעות לוואי, והראיות חזקות: שינה טובה יכולה למנוע בעיות רבות.
