    exercises:
      - id: u21-l5-01
        type: reading
        kind: "מייל"
        title: "Welcome to Project Bridge!"
        text: |
          Hi all,

          Thank you for a great kick-off meeting today. I'm very excited to work with all of you.

          A quick summary: our client is a large bank, and our goal is to build their new mobile app. The deadline for the first version is 31 March. David is responsible for the servers, Tamar is in charge of design, and Ben will manage the relationship with the client.

          Since half of the team works remotely, we'll have a short video meeting every morning at 9:30 London time (11:30 in Tel Aviv). Please share any problems early. It's always easier to fix them together.

          I look forward to working with you!

          Noa
        translation: |
          היי לכולם,

          תודה על פגישת פתיחה מעולה היום. אני מאוד מתרגשת לעבוד עם כולכם.

          סיכום קצר: הלקוח שלנו הוא בנק גדול, והמטרה שלנו היא לבנות את האפליקציה החדשה שלהם לנייד. הדדליין לגרסה הראשונה הוא 31 במרץ. דוד אחראי על השרתים, תמר אחראית על העיצוב, ובן ינהל את הקשר עם הלקוח.

          מכיוון שחצי מהצוות עובד מרחוק, תהיה לנו פגישת וידאו קצרה כל בוקר ב־9:30 שעון לונדון (11:30 בתל אביב). אנא שתפו בעיות מוקדם. תמיד קל יותר לפתור אותן ביחד.

          מצפה לעבוד איתכם!

          נועה
