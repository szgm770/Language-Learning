          - [role, תפקיד]
          - [remote, מרחוק]
          - [share, לשתף]
          - [background, רקע]
        lexemes: [colleague, role, remote, share, background]
      - { id: "u21-l2-08", type: "learn", lexeme: "welcome-aboard" }
      - { id: "u21-l2-09", type: "learn", lexeme: "look-forward-to" }
      - id: u21-l2-10
        type: multiple_choice
        prompt: "מה הרקע של תמר?"
        options: [עיצוב, הנדסה, שיווק]
        correct: 0
        lexemes: [background]
      - id: u21-l2-11
        type: dialogue_gap
        lines:
          - { speaker: "noa", text: "Welcome aboard, Tamar!", translation: "ברוכה הבאה לצוות, תמר!" }
          - { speaker: "tamar", text: "Thanks! I look forward to working with you all.", translation: "תודה! אני מצפה לעבוד עם כולכם." }
        gap: 1
        distractors: ["Thanks! I look forward to work with you all.", "Thanks! I look forward working you all."]
        lexemes: [welcome-aboard, look-forward-to]
      - id: u21-l2-12
        type: tip
        title: "look forward to + ‎-ing"
        text: |
          אחרי look forward to בא פועל עם ‎-ing, לא פועל רגיל: I look forward to meeting you.

          זו טעות נפוצה מאוד, גם אצל דוברי אנגלית מתקדמים. במייל רשמי זה משפט סיום מצוין.
      - id: u21-l2-13
        type: translate
        direction: to_target
        prompt: "מה התפקיד שלך בצוות?"
        answers: ["What's your role in the team?", "What is your role in the team?", "What's your role on the team?", "What is your role on the team?"]
        lexemes: [role, team]
      - id: u21-l2-14
        type: translate
        direction: to_source
        prompt: "Can you share your screen, please?"
        answers: ["אתה יכול לשתף את המסך, בבקשה?", "את יכולה לשתף את המסך, בבקשה?", "אפשר לשתף את המסך, בבקשה?", "תוכל לשתף את המסך שלך, בבקשה?", "תוכלי לשתף את המסך שלך, בבקשה?"]
        lexemes: [share]
      - id: u21-l2-15
        type: speak_repeat
        text: "I look forward to working with you."
        translation: "אני מצפה לעבוד איתך."
        lexemes: [look-forward-to]

