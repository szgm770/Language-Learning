          - [department, מחלקה]
          - [client, לקוח]
          - [goal, מטרה]
          - [deadline, מועד יעד]
        lexemes: [agenda, department, client, goal, deadline]
      - id: u21-l1-11
        type: multiple_choice
        prompt: "על מה דוד אחראי?"
        options: [על השרתים, על הקשר עם הלקוח, על סדר היום]
