          - { speaker: "noa", text: "Yes, perfect. Go ahead.", translation: "כן, מושלם. קדימה." }
          - { speaker: "miriam", text: "This is Tamar. Her background is in design, and her role is the user experience.", translation: "זו תמר. הרקע שלה בעיצוב, והתפקיד שלה הוא חוויית המשתמש." }
          - { speaker: "noa", text: "Welcome aboard, Tamar! Half of this team works remotely, so we'll meet a lot on video.", translation: "ברוכה הבאה לצוות, תמר! חצי מהצוות הזה עובד מרחוק, אז ניפגש הרבה בווידאו." }
          - { speaker: "tamar", text: "Thank you! I've worked remotely for two years, so I'm used to it.", translation: "תודה! אני עובדת מרחוק כבר שנתיים, אז אני רגילה לזה." }
