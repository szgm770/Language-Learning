grammar:
  - id: for-since
    title: { he: "כמה זמן: for ו־since", en: "Present perfect with for and since" }
    explanation: |
      בעברית אומרים "אני עובדת כאן שלוש שנים", בהווה. באנגלית, כשמשהו **התחיל בעבר ועדיין נמשך**, משתמשים בהווה מושלם:
      **I have worked here for three years.** (ולא "I work here for three years")

      ואיך אומרים "כבר" או "מאז"?
      - **for** + משך זמן: **for three years, for two months, for a long time**
      - **since** + נקודת התחלה: **since 2019, since January, since I was a child**

      השאלה: **How long have you worked here?** (כמה זמן אתה עובד כאן?)

      ההבדל מעבר פשוט: **I worked in Tel Aviv for five years.** (זה נגמר, אני כבר לא שם). **I have worked in London for a year.** (ואני עדיין כאן).

      עם know, be ו־live זה בולט במיוחד: **I've known Ben since last year.** (אני מכירה את בן מאז שנה שעברה.)
    examples:
      - { text: "David has been in the IT department since 2020.", translation: "דוד במחלקת ה־IT מאז 2020." }
      - { text: "How long have you known Miriam? For about ten years.", translation: "כמה זמן אתה מכיר את מרים? בערך עשר שנים." }
      - { text: "I lived in Haifa for two years, then I moved to Tel Aviv.", translation: "גרתי בחיפה שנתיים, ואז עברתי לתל אביב." }

