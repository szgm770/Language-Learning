      - id: u21-l2-11
        type: dialogue_gap
        lines:
          - { speaker: "noa", text: "Welcome aboard, Tamar!", translation: "ברוכה הבאה לצוות, תמר!" }
          - { speaker: "tamar", text: "Thanks! I look forward to working with you all.", translation: "תודה! אני מצפה לעבוד עם כולכם." }
        gap: 1
        distractors: ["Thanks! I look forward to work with you all.", "Thanks! I look forward working you all."]
        lexemes: [welcome-aboard, look-forward-to]
      - id: u21-l2-12
        type: tip
        title: "look forward to + ‎-ing"
        text: |
          אחרי look forward to בא פועל עם ‎-ing, לא פועל רגיל: I look forward to meeting you.

          זו טעות נפוצה מאוד, גם אצל דוברי אנגלית מתקדמים. במייל רשמי זה משפט סיום מצוין.
      - id: u21-l2-13
