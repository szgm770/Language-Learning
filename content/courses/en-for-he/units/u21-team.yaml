      - id: u21-l1-01
        type: dialogue
        scene: "הפגישה הראשונה של פרויקט ברידג'. חלק מהצוות בלונדון, חלק בתל אביב בווידאו."
        lines:
          - { speaker: "noa", text: "Good morning, everyone, and welcome to Project Bridge. I'm Noa, the team leader.", translation: "בוקר טוב לכולם, וברוכים הבאים לפרויקט ברידג'. אני נועה, ראש הצוות." }
          - { speaker: "noa", text: "First, let's look at the agenda. Then I'd like everyone to introduce themselves.", translation: "קודם, בואו נסתכל על סדר היום. אחר כך הייתי רוצה שכל אחד יציג את עצמו." }
          - { speaker: "david", text: "I'll start. I'm David, from the IT department. I'm responsible for the servers.", translation: "אני אתחיל. אני דוד, ממחלקת ה־IT. אני אחראי על השרתים." }
          - { speaker: "ben", text: "I'm Ben. I'm in charge of the relationship with the client.", translation: "אני בן. אני אחראי על הקשר עם הלקוח." }
          - { speaker: "noa", text: "Great. Our goal is simple: a new app for the client, and the deadline is March.", translation: "מעולה. המטרה שלנו פשוטה: אפליקציה חדשה ללקוח, והדדליין הוא מרץ." }
          - { speaker: "david", text: "March? That's soon!", translation: "מרץ? זה בקרוב!" }
      - { id: "u21-l1-02", type: "learn", lexeme: "agenda" }
      - { id: "u21-l1-03", type: "learn", lexeme: "introduce-yourself" }
      - { id: "u21-l1-04", type: "learn", lexeme: "department" }
      - { id: "u21-l1-05", type: "learn", lexeme: "responsible-for" }
      - { id: "u21-l1-06", type: "learn", lexeme: "in-charge-of" }
      - { id: "u21-l1-07", type: "learn", lexeme: "client" }
      - { id: "u21-l1-08", type: "learn", lexeme: "goal" }
      - { id: "u21-l1-09", type: "learn", lexeme: "deadline" }
      - id: u21-l1-10
        type: match_pairs
        pairs:
