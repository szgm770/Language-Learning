id: u02-from
cefr: A1
scene: globe
title:
  he: מאיפה אתם?
  en: Where are you from?
story: "פגישת צוות ראשונה: נועה, בן ומרים מכירים קצת יותר, ומחליפים מספרי טלפון."
canDo:
  - להגיד מאיפה אני ולשאול מאיפה אחרים
  - להגיד אילו שפות אני מדבר
  - לדבר על אדם אחר עם he ו־she
  - לספור מ־0 עד 10 ולהגיד מספר טלפון

