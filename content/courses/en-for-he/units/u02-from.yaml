grammar:
  - id: he-she-is
    title: { he: "He is, she is: הוא, היא", en: "He is, she is" }
    explanation: |
      כמו ב־I am ו־you are, גם עם "הוא" ו"היא" חייבים פועל. הפעם הוא **is**:

      - **He is from England** – הוא מאנגליה
      - **She is from Spain** – היא מספרד

      בדיבור מקצרים: **he's**, **she's**.

      שלילה: מוסיפים **not** אחרי is, ובדיבור **isn't**: **She isn't from France.**

      שאלה: מקדימים את is. **Is he from Israel?** ועונים **Yes, he is.** או **No, he isn't.**
    examples:
      - { text: "He's from London.", translation: "הוא מלונדון." }
      - { text: "Is she from Spain? Yes, she is.", translation: "היא מספרד? כן." }
      - { text: "She isn't from France.", translation: "היא לא מצרפת." }

