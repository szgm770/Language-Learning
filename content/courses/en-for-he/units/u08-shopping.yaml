id: u08-shopping
cefr: A1
scene: shopping
title:
  he: קניות
  en: Shopping
story: "נועה ורחל בחנות בגדים ברחוב אוקספורד. נועה צריכה ז'קט לפגישה, ורחל מחפשת נעליים."
