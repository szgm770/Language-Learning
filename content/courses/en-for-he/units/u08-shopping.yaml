grammar:
  - id: this-that
    title: { he: "זה, ההוא: this, that, these, those", en: "This, that, these, those" }
    explanation: |
      באנגלית בוחרים מילה לפי שני דברים: קרוב או רחוק, ואחד או כמה.

      - **this** – אחד, קרוב: **this shirt** (החולצה הזאת, שבידי)
      - **that** – אחד, רחוק: **that dress** (השמלה ההיא, שם)
      - **these** – כמה, קרובים: **these shoes**
      - **those** – כמה, רחוקים: **those jeans**

      ושימו לב: **jeans** ו־**shoes** הן תמיד ברבים, אז אומרים **these jeans are…**
    examples:
      - { text: "I like this shirt.", translation: "אני אוהבת את החולצה הזאת." }
      - { text: "Those shoes are expensive.", translation: "הנעליים ההן יקרות." }
  - id: adjective-order
    title: { he: "התואר לפני שם העצם", en: "Adjective before noun" }
    explanation: |
      בעברית אומרים "חולצה **כחולה**". באנגלית התואר בא **לפני** שם העצם: **a blue shirt**.

      והתואר לא משתנה ברבים: **blue shoes**, לא "blues shoes".

      **too** פירושו "מדי": **too big** = גדול מדי, **too expensive** = יקר מדי.
    examples:
      - { text: "a black jacket", translation: "ז'קט שחור" }
      - { text: "These red shoes are cheap.", translation: "הנעליים האדומות האלה זולות." }
      - { text: "This dress is too small.", translation: "השמלה הזאת קטנה מדי." }

