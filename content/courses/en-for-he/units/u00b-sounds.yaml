id: u00b-sounds
cefr: A0
scene: study
title:
  he: הצלילים של האנגלית
  en: The sounds of English
story: "באנגלית יש צלילים שאין בעברית, ולהפך. כאן לומדים לשמוע ולהגות את אלה שמבלבלים הכי הרבה דוברי עברית."
canDo:
  - להגות את ה־th באנגלית (think, this)
  - להבדיל בין w ל־v ובין r ל־l
  - להבדיל בין תנועות קצרות לארוכות (ship / sheep)
  - להבדיל בין sh, ch ו־j

vocabulary:
  - { id: "s-th-soft", text: "th (think)", translation: "ת' רפה: הלשון בין השיניים והאוויר יוצא בלי קול", pos: "noun", pronunciation: "ת'", example: { text: "think, three, thank you", translation: "לחשוב, שלוש, תודה" } }
  - { id: "s-th-voiced", text: "th (this)", translation: "ד' רפה: אותו מקום בפה, אבל עם קול", pos: "noun", pronunciation: "ד'", example: { text: "this, that, the", translation: "זה, ההוא, ה־" } }
  - { id: "s-w", text: "w", translation: "ו' מעוגלת: השפתיים מתעגלות כמו ב־u", pos: "noun", pronunciation: "וו", example: { text: "water, week, window", translation: "מים, שבוע, חלון" } }
  - { id: "s-v", text: "v", translation: "ו' רגילה: שפה תחתונה נוגעת בשיניים העליונות", pos: "noun", pronunciation: "ו", example: { text: "very, visit, five", translation: "מאוד, לבקר, חמש" } }
  - { id: "s-r", text: "r", translation: "ר' אנגלית: הלשון לא נוגעת בחך ולא מרטיטים", pos: "noun", pronunciation: "ר", example: { text: "red, right, run", translation: "אדום, ימין, לרוץ" } }
  - { id: "s-sh", text: "sh", translation: "ש' כמו בעברית", pos: "noun", pronunciation: "ש", example: { text: "ship, shop, fish", translation: "ספינה, חנות, דג" } }
  - { id: "s-ch", text: "ch", translation: "צ'", pos: "noun", pronunciation: "צ'", example: { text: "chair, cheese, teacher", translation: "כיסא, גבינה, מורה" } }
  - { id: "s-j", text: "j", translation: "ג'", pos: "noun", pronunciation: "ג'", example: { text: "job, juice, jacket", translation: "עבודה, מיץ, ז'קט" } }
  - { id: "s-long-ee", text: "ee / ea", translation: "אי ארוכה (שפתיים רחבות, הצליל מתמשך)", pos: "noun", pronunciation: "אִי", example: { text: "sheep, tea, see", translation: "כבשה, תה, לראות" } }
  - { id: "s-short-i", text: "i", translation: "אִ קצרה וחלשה", pos: "noun", pronunciation: "אִ", example: { text: "ship, sit, big", translation: "ספינה, לשבת, גדול" } }
  - { id: "s-short-a", text: "a (cat)", translation: "אֶ פתוחה: הפה נפתח לרווחה", pos: "noun", pronunciation: "אֶ", example: { text: "cat, hat, bag", translation: "חתול, כובע, תיק" } }
  - { id: "s-short-u", text: "u (cup)", translation: "אַ קצרה וקרובה לעברית 'אַ'", pos: "noun", pronunciation: "אַ", example: { text: "cup, bus, sun", translation: "כוס, אוטובוס, שמש" } }
  - { id: "s-silent-e", text: "silent e", translation: "e בסוף מילה לא נשמעת, אבל מארכת את התנועה שלפניה", pos: "noun", pronunciation: "-", example: { text: "name, like, home", translation: "שם, אוהב, בית" } }

lessons:
  - id: u00b-l1
    kind: new
    title: { he: "ה־th", en: "The th sound" }
    exercises:
      - id: u00b-l1-01
        type: tip
        title: הצליל הכי מפורסם באנגלית
        text: |
          ה־**th** לא קיים בעברית. מניחים את **קצה הלשון בין השיניים** ונושפים.
          יש שני סוגים: בלי קול כמו ב־**think**, ועם קול (הגרון רוטט) כמו ב־**this**.
          מי שאומר "סינק" או "דיס" יובן, אבל כדאי להתאמן.
      - { id: "u00b-l1-02", type: "learn", lexeme: "s-th-soft" }
      - { id: "u00b-l1-03", type: "learn", lexeme: "s-th-voiced" }
      - id: u00b-l1-04
        type: listening_choice
        audioText: "think"
        question: איזו מילה שמעתם?
        options: [think, sink, tink]
        correct: 0
        lexemes: [s-th-soft]
      - id: u00b-l1-05
        type: listening_choice
        audioText: "three"
        question: איזו מילה שמעתם?
        options: [three, tree, free]
        correct: 0
        lexemes: [s-th-soft]
      - id: u00b-l1-06
        type: listening_choice
        audioText: "thank you"
        question: איזו מילה שמעתם?
        options: [thank you, sank you, tank you]
        correct: 0
        lexemes: [s-th-soft]
      - id: u00b-l1-07
        type: listening_choice
        audioText: "this"
        question: איזו מילה שמעתם?
        options: [this, dis, zis]
        correct: 0
        lexemes: [s-th-voiced]
      - id: u00b-l1-08
        type: multiple_choice
        prompt: "איזו מילה מתחילה בצליל th רפה (בלי קול)?"
        options: [thumb, this, that]
        correct: 0
        lexemes: [s-th-soft, s-th-voiced]
      - id: u00b-l1-09
        type: multiple_choice
        prompt: "איזו מילה מתחילה בצליל th עם קול?"
        options: [that, thin, thank]
        correct: 0
        lexemes: [s-th-soft, s-th-voiced]
      - id: u00b-l1-10
        type: dictation
        text: "thank you"
        lexemes: [s-th-soft]
      - id: u00b-l1-11
        type: speak_repeat
        text: "Thank you. This is three."
        translation: "תודה. זה שלוש."
        lexemes: [s-th-soft, s-th-voiced]

