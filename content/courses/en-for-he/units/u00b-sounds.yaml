  - id: u00b-l3
    kind: new
    title: { he: "תנועות קצרות וארוכות", en: "Short and long vowels" }
    exercises:
      - id: u00b-l3-01
        type: tip
        title: ship או sheep?
        text: |
          בעברית "שִׁיר" ו"שִׁר" נשמעות כמעט אותו דבר, אבל באנגלית אורך התנועה **משנה את המילה**.
          **ship** (ספינה) עם אִ קצרה וחלשה, **sheep** (כבשה) עם אִי ארוכה ומתוחה.
          כך גם: sit / seat, live / leave, bit / beat.
      - { id: "u00b-l3-02", type: "learn", lexeme: "s-long-ee" }
      - { id: "u00b-l3-03", type: "learn", lexeme: "s-short-i" }
      - { id: "u00b-l3-04", type: "learn", lexeme: "s-short-a" }
      - { id: "u00b-l3-05", type: "learn", lexeme: "s-short-u" }
      - id: u00b-l3-06
        type: listening_choice
        audioText: "ship"
        question: איזו מילה שמעתם?
        options: [ship, sheep, shop]
        correct: 0
        lexemes: [s-short-i, s-long-ee]
      - id: u00b-l3-07
        type: listening_choice
        audioText: "seat"
        question: איזו מילה שמעתם?
        options: [seat, sit, set]
        correct: 0
