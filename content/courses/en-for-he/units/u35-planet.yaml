            any: ["\\bby 20\\d\\d\\b", "\\bin (twenty|ten|thirty) years\\b", "\\bin the future\\b"]
        model: "In twenty years, most cars will be running on electricity, and many families will be producing their own solar energy. By 2045 we will have reduced plastic waste, I hope, and cities will be greener. Climate change will remain a challenge, but I believe people will have learned to cooperate."
        lexemes: []
