grammar:
  - id: future-continuous-perfect
    title: { he: "עתיד ממושך ועתיד מושלם", en: "Future continuous and future perfect" }
    explanation: |
      **עתיד ממושך (Future continuous)** – מה יהיה **בתהליך** ברגע מסוים בעתיד:
      **will be + V-ing**
      - **This time next year, I'll be working in Haifa.** (בשנה הבאה בדיוק בזמן הזה אעבוד בחיפה)
      - **Don't call at eight. We'll be having dinner.**

      **עתיד מושלם (Future perfect)** – מה יהיה **כבר גמור** עד רגע מסוים בעתיד:
      **will have + V3**
      - **By 2030, the office will have reduced its waste by half.**
      - **By the time you arrive, I'll have finished.**

      טיפ: **by + זמן** או **by the time** מרמזים על עתיד מושלם. **this time tomorrow** מרמז על עתיד ממושך.
    examples:
      - { text: "This time next week, we'll be flying to Rome.", translation: "בשבוע הבא בדיוק בשעה הזאת נהיה באוויר בדרך לרומא." }
      - { text: "By Friday, I will have finished the report.", translation: "עד יום שישי אסיים את הדוח." }
      - { text: "By the time you get home, we'll have eaten.", translation: "עד שתגיע הביתה, כבר נאכל." }

