            any: ["\\bwill be \\w+ing\\b", "\\bwill have \\w+(ed|en)\\b", "\\bwill have (been|done|made|become|gone|got)\\b"]
          - label: "הזכרתם נושא סביבתי (energy, recycling, climate...)"
            any: ["\\benergy\\b", "\\brecycl", "\\bclimate\\b", "\\bsolar\\b", "\\bpollution\\b", "\\bplastic\\b"]
