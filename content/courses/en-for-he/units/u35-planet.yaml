  - id: u35-l5
    kind: reading
    title: { he: "מה יהיה ב-2040?", en: "What will 2040 look like?" }
    exercises:
      - id: u35-l5-01
        type: reading
        kind: "מאמר דעה"
        title: "Looking ahead to 2040"
        text: |
          Imagine it is the year 2040. By then, most cities will have banned cars that use fossil fuels, and millions of solar panels will be producing clean energy.

          People will be working from home more than ever, so cities will be quieter. Forests that were cut down in the past will be growing again, and some endangered species will have returned.

          But none of this will happen by itself. By the time today's children grow up, our generation will have made some very important decisions. If we act now, we will be able to say that we protected the planet. If we wait, the next generation will be paying the price.
        translation: |
          דמיינו שזו שנת 2040. עד אז, רוב הערים יאסרו על מכוניות שפועלות על דלק מאובנים, ומיליוני לוחות סולאריים יפיקו אנרגיה נקייה.

          אנשים יעבדו מהבית יותר מתמיד, ולכן הערים יהיו שקטות יותר. יערות שנכרתו בעבר יגדלו שוב, וכמה מינים בסכנת הכחדה יחזרו.

          אבל שום דבר מזה לא יקרה מעצמו. עד שילדי היום יגדלו, הדור שלנו כבר יקבל כמה החלטות חשובות מאוד. אם נפעל עכשיו, נוכל לומר שהגנו על הכוכב. אם נחכה, הדור הבא ישלם את המחיר.
      - id: u35-l5-02
        type: multiple_choice
        prompt: "מה יהיה בערים ב-2040?"
        options: [רוב הערים יאסרו מכוניות על דלק מאובנים, אין מכוניות בכלל, אין ערים]
