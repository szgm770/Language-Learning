          - { speaker: "ben", text: "And we could ban plastic cups in the kitchen.", translation: "ואפשר לאסור כוסות פלסטיק במטבח." }
          - { speaker: "eli", text: "What about energy? The bills are huge.", translation: "ומה לגבי אנרגיה? החשבונות ענקיים." }
          - { speaker: "noa", text: "Solar panels on the roof. It's renewable and sustainable.", translation: "לוחות סולאריים על הגג. זה מתחדש ובר־קיימא." }
