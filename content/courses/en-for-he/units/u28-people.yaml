    exercises:
      - id: u28-l5-01
        type: reading
        kind: "חיבור בבלוג"
        title: "The person who changed my life"
        text: |
          When I was twelve, I had an English teacher who changed my life. Her name was Mrs. Shapiro.

          I was a very shy child, and English was the subject which I hated most. Mrs. Shapiro was patient and kind. She never laughed at my mistakes. Instead, she gave me books about places where I wanted to travel: London, New York, Sydney.

          She was also honest. When my homework was lazy, she told me! But she always believed in me.

          Today I work in London and speak English every day. Last year I found her on social media and sent her a message: "Thank you. You're the teacher who made all this possible."

          She wrote back: "I always knew you could do it."
        translation: |
          כשהייתי בת שתים־עשרה, הייתה לי מורה לאנגלית ששינתה את חיי. קראו לה גברת שפירא.

          הייתי ילדה מאוד ביישנית, ואנגלית הייתה המקצוע ששנאתי הכי הרבה. גברת שפירא הייתה סבלנית וטובת לב. היא אף פעם לא צחקה על הטעויות שלי. במקום זה, היא נתנה לי ספרים על מקומות שרציתי לטייל בהם: לונדון, ניו יורק, סידני.

          היא גם הייתה כנה. כשעשיתי שיעורי בית בעצלנות, היא אמרה לי! אבל היא תמיד האמינה בי.

          היום אני עובדת בלונדון ומדברת אנגלית כל יום. בשנה שעברה מצאתי אותה ברשתות החברתיות ושלחתי לה הודעה: "תודה. את המורה שאפשרה את כל זה."

          היא ענתה: "תמיד ידעתי שתצליחי."
