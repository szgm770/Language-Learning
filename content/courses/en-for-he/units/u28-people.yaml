grammar:
  - id: relative-clauses
    title: { he: "משפטי זיקה: who, which, where", en: "Relative clauses" }
    explanation: |
      בעברית "ש־" עובד לכל דבר: האיש **ש**עזר, הספר **ש**קניתי, העיר **ש**גדלתי בה. באנגלית בוחרים לפי מה שמתארים:

      - **who** על אנשים: **She's the neighbour who helped me.**
      - **which** על דברים ובעלי חיים: **It's the app which we built.**
      - **that** אפשר גם לאנשים וגם לדברים, בעיקר בדיבור: **the man that called, the book that I read**.
      - **where** על מקומות: **That's the café where we met.**

      שימו לב: אין צורך לחזור על המילה. בעברית "העיר שגדלתי **בה**", באנגלית **the city where I grew up** (בלי "in it").

      ואם ה־who / which / that הוא המושא (ולא העושה), אפשר גם להשמיט: **the book (that) I read**.
    examples:
      - { text: "Mrs. Katz is the landlady who looks after everyone.", translation: "גברת כץ היא בעלת הבית שדואגת לכולם." }
      - { text: "This is the photo which my dad took.", translation: "זו התמונה שאבא שלי צילם." }
      - { text: "Haifa is the city where I grew up.", translation: "חיפה היא העיר שבה גדלתי." }

