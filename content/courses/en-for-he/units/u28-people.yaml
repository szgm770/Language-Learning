id: u28-people
cefr: B1
scene: family
title:
  he: אנשים בחיים שלי
  en: People in my life
story: "ההורים של נועה באים לבקר בלונדון. היא מכירה להם את בן, את תמר ואת גברת כץ, ומתארת לכל אחד את האנשים שהיא אוהבת: מי טוב לב, מי ביישן, ומי דומה למי."
canDo:
  - לתאר אופי של אנשים
  - להוסיף מידע עם who, which, that ו־where
  - לדבר על דמיון במשפחה ועל ילדות
  - להגיד עם מי אני מסתדר טוב

