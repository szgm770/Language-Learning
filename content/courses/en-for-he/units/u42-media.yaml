grammar:
- id: cleft
  title:
    he: משפטי הדגשה
    en: Cleft sentences
  explanation: 'כדי להדגיש חלק מהמשפט, מפצלים אותו לשניים:


    - "**What** + נושא + פועל + **is / was** + ההדגשה: *What I need **is** more time.* (במקום: I need more time.)"

    - "**It is / was** + ההדגשה + **who / that**: *It was Noa **who** found the mistake.*"

    - **The reason** (why)… **is that**: *The reason we checked **is that** the story seemed false.*

    - "**All** (that) + נושא + פועל + **is**: *All I want **is** the truth.*"

    - **What happened was that**…: *What happened **was that** the post went viral.*


    בעברית אפשר פשוט לשנות סדר או הטעמה; באנגלית דרוש מבנה מלא. המבנה מתאים לדיבור משכנע ולמסמכים, ומגיע הרבה בראיונות ובמבחנים.'
  examples:
  - text: What worries me is the lack of evidence.
    translation: מה שמדאיג אותי הוא היעדר ראיות.
  - text: It was the journalist who verified the story.
    translation: העיתונאי הוא שאימת את הסיפור.
  - text: All we need is a credible source.
    translation: כל מה שאנחנו צריכים הוא מקור אמין.
