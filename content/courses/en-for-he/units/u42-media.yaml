  - id: u42-l1-01
    type: dialogue
    scene: בוקר במשרד. מרים מראה לנועה פוסט.
    lines:
    - speaker: miriam
      text: Have you seen this? There's a viral post saying our company hides data.
      translation: ראית את זה? יש פוסט ויראלי שאומר שהחברה שלנו מסתירה נתונים.
    - speaker: noa
      text: That's a serious allegation. Where did it come from?
      translation: זו האשמה חמורה. מאיפה זה הגיע?
    - speaker: miriam
      text: An anonymous outlet. The headline is clickbait, but people are sharing it.
      translation: כלי תקשורת אנונימי. הכותרת היא פיתיון קליקים, אבל אנשים משתפים.
    - speaker: eli
      text: What worries me is that nobody tried to verify it.
      translation: מה שמדאיג אותי הוא שאף אחד לא ניסה לאמת את זה.
    - speaker: noa
      text: Then we'll fact-check it ourselves, and answer calmly. It was probably a rumour from the start.
      translation: אז נבדוק עובדות בעצמנו ונענה בשקט. כנראה שזו הייתה שמועה מההתחלה.
