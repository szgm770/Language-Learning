    he: איך מזהים חדשות כוזבות
    en: Spotting fake news
  exercises:
  - id: u42-l5-01
    type: reading
    kind: מאמר דעה
    title: How to spot misinformation
    text: 'We live in an age of information overload, and not everything we read online is true. What makes misinformation so powerful is that it often looks credible.


      First, check the source. Is it a known outlet, or an anonymous site? Be careful with clickbait headlines: they are designed to make you click, not to inform you. It is often the headline that is misleading, not the article itself.


      Second, look for bias. Does the writer present both sides, or only one? Reliable journalists welcome scrutiny and retract mistakes openly.


      Finally, verify before you share. All it takes is a few minutes of fact-checking to stop a rumour or a hoax from going viral. What matters most is not who is first, but who is right.

      '
    translation: 'אנחנו חיים בעידן של עומס מידע, ולא כל מה שאנחנו קוראים ברשת נכון. מה שהופך מידע שגוי לכל כך חזק הוא שהוא נראה לעיתים קרובות אמין.


      ראשית, בדקו את המקור. האם זה כלי תקשורת מוכר או אתר אנונימי? היזהרו מכותרות פיתיון קליקים: הן נועדו לגרום לכם ללחוץ, לא לידע אתכם. לעיתים קרובות הכותרת היא המטעה, לא הכתבה עצמה.


      שנית, חפשו הטיה. האם הכותב מציג את שני הצדדים או רק אחד? עיתונאים אמינים מקבלים בברכה בחינה מדוקדקת וחוזרים בהם מטעויות בגלוי.


      לבסוף, אמתו לפני ששיתפתם. כמה דקות של בדיקת עובדות מספיקות כדי למנוע משמועה או ממתיחה להפוך לוויראליות. מה שחשוב ביותר הוא לא מי הראשון, אלא מי צודק.

      '
