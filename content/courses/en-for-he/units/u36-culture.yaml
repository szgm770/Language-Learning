  # ------------------------------------------------------------------ 5
  - id: u36-l5
    kind: reading
    title: { he: "ללמוד מתרבויות אחרות", en: "Learning from other cultures" }
    exercises:
      - id: u36-l5-01
        type: reading
        kind: "מאמר"
        title: "Why customs matter"
        text: |
          Every culture has its own customs, and they often seem unusual to outsiders. In some countries, it is polite to arrive a little late; in others, arriving late is rude. In some places guests bring a gift, in others they bring nothing at all.

          Misunderstandings happen all the time. A traveller who sees someone shake their head might think, "They must disagree," when in fact the gesture means "yes" in that country.

          The best advice is simple: ask questions, and don't assume the worst. If someone behaves in a way that surprises you, they might simply be following a tradition you haven't learned yet. And remember: you can't have known everything, and nobody expects you to. What matters is that you try, and that you are willing to learn.
        translation: |
          לכל תרבות יש מנהגים משלה, ולעתים קרובות הם נראים יוצאי דופן לזרים. במדינות מסוימות מנומס להגיע קצת באיחור; באחרות איחור הוא גס רוח. במקומות מסוימים אורחים מביאים מתנה, באחרים לא מביאים כלום.

          אי־הבנות קורות כל הזמן. מטייל שרואה מישהו מזיז את הראש לצדדים עלול לחשוב "הם בטח לא מסכימים", ובפועל התנועה הזאת פירושה "כן" באותה מדינה.

          העצה הטובה ביותר פשוטה: שאלו שאלות, ואל תניחו את הגרוע ביותר. אם מישהו מתנהג בדרך שמפתיעה אתכם, ייתכן שהוא פשוט מקיים מסורת שעוד לא למדתם. וזכרו: לא יכולתם לדעת הכול, ואף אחד לא מצפה לזה. מה שחשוב הוא שאתם מנסים, ושאתם מוכנים ללמוד.
      - id: u36-l5-02
        type: multiple_choice
        prompt: "מה הכותב אומר על איחור?"
        options: [במקומות שונים זה מנומס או גס רוח, זה תמיד גס רוח, זה תמיד בסדר]
        correct: 0
        lexemes: [polite, rude]
      - id: u36-l5-03
        type: multiple_choice
        prompt: "מה קורה עם מי שמזיז את הראש?"
        options: [בחלק מהמדינות זה אומר כן, זה תמיד אומר לא, זה אומר שהוא כועס]
        correct: 0
        lexemes: [gesture, misunderstanding]
      - id: u36-l5-04
        type: multiple_choice
        prompt: "מה העצה העיקרית?"
        options: [לשאול שאלות ולא להניח את הגרוע ביותר, להישאר בבית, לנסוע רק למדינות מוכרות]
        correct: 0
        lexemes: [custom]
      - id: u36-l5-05
        type: fill_blank
        sentence: "A traveller might think, 'They ___ disagree.'"
        translation: "מטייל עלול לחשוב: 'הם בטח לא מסכימים'."
        answers: [must]
        options: [must, can't, would]
        lexemes: [must-be]
      - id: u36-l5-06
        type: fill_blank
        sentence: "You can't ___ known everything."
        translation: "לא יכולתם לדעת הכול."
        answers: [have]
        options: [have, be, had]
        lexemes: [cant-have]
      - id: u36-l5-07
        type: translate
        direction: to_target
        prompt: "ייתכן שהוא מקיים מסורת."
        answers: ["He might be following a tradition.", "He may be following a tradition.", "He could be following a tradition."]
        lexemes: [might-be, tradition]
      - id: u36-l5-08
        type: speak_repeat
