grammar:
  - id: modals-deduction
    title: { he: "ניחושים ומסקנות: must / might / can't", en: "Modals of deduction" }
    explanation: |
      כשיש לנו **ראיות** ואנחנו מסיקים מסקנה, משתמשים בפועלי מודל:

      | ביטחון | הווה | עבר |
      |---|---|---|
      | כמעט בטוח שכן | **must be** | **must have + V3** |
      | אולי | **might / could be** | **might have + V3** |
      | כמעט בטוח שלא | **can't be** | **can't have + V3** |

      - **He must be tired.** (בטח עייף – יש לי סימנים)
      - **She might be at home.** (אולי היא בבית)
      - **They can't have left. Their coats are here.** (לא ייתכן שהלכו – המעילים כאן)

      שימו לב: לשלילה בביטחון לא אומרים **mustn't be** אלא **can't be**.
    examples:
      - { text: "He must be hungry. He hasn't eaten all day.", translation: "הוא בטח רעב. הוא לא אכל כל היום." }
      - { text: "She can't have forgotten. I reminded her yesterday.", translation: "לא ייתכן ששכחה. הזכרתי לה אתמול." }
      - { text: "They might have taken the wrong road.", translation: "אולי הם נסעו בדרך הלא נכונה." }

