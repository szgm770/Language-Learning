      - id: u36-l1-01
        type: dialogue
        scene: "הכנות לביקור של מר סאטו מיפן, לקוח חשוב של החברה."
        lines:
          - { speaker: "noa", text: "Mr. Sato is coming on Thursday. He's our guest of honour.", translation: "מר סאטו מגיע ביום חמישי. הוא אורח הכבוד שלנו." }
          - { speaker: "ben", text: "I read about etiquette in Japan. A bow is polite, but a handshake is fine too.", translation: "קראתי על נימוסים ביפן. קידה זה מנומס, אבל גם לחיצת יד בסדר." }
          - { speaker: "noa", text: "And it's rude to show up late, so be on time.", translation: "וזה גס רוח להגיע באיחור, אז תהיו בזמן." }
          - { speaker: "eli", text: "I don't want to offend him by mistake.", translation: "אני לא רוצה לפגוע בו בטעות." }
          - { speaker: "noa", text: "Just be natural. He's probably nervous too.", translation: "תהיו טבעיים. הוא כנראה גם לחוץ." }
