grammar:
  - id: to-be-i-am
    title: { he: "I am – אני", en: "I am" }
    explanation: |
      בעברית אומרים "אני דנה" בלי שום פועל באמצע. באנגלית חייבים פועל: **am**.

      - **I am Dana** – אני דנה
      - **I am fine** – אני בסדר

      בדיבור מקצרים את **I am** ל־**I'm** (מבטאים: אַיים). שתי הצורות נכונות.

      שימו לב: **I** (אני) נכתבת תמיד באות גדולה, גם באמצע משפט.
    examples:
      - { text: I am Dana., translation: אני דנה. }
      - { text: I'm fine., translation: אני בסדר. }
  - id: my-name-is
    title: { he: "My name is – קוראים לי", en: "My name is" }
    explanation: |
      כדי להציג את עצמכם אומרים **My name is** ואחריו השם. מילה במילה: "השם שלי הוא".

      כדי לשאול מישהו לשמו: **What is your name?** (מה השם שלך?). בקיצור: **What's your name?**

      באנגלית **your** משמש לזכר, לנקבה ולרבים, כך שאין צורך לבחור.
    examples:
      - { text: My name is Yossi., translation: קוראים לי יוסי. }
      - { text: What's your name?, translation: איך קוראים לך? }

