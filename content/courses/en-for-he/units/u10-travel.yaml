id: u10-travel
cefr: A1
scene: travel
title:
  he: בדרכים
  en: Travel
story: "נועה טסה לבקר את מרים במדריד. בשדה התעופה ובמלון היא מסתדרת לבד באנגלית, ואחר כך מספרת לבן איך היה."
canDo:
  - "להסתדר בשדה התעופה: כרטיס, דרכון, שער"
  - לעשות צ'ק־אין במלון ולבקש עזרה
  - לבקש בנימוס עם I'd like
  - לספר איפה הייתי ואיך היה, עם was ו־were

vocabulary:
