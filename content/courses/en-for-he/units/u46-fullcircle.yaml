    title: A letter to my younger self
    text: 'Dear Noa,


      A year ago, you thought leading an office was impossible. Hindsight tells me otherwise. The path was long, albeit rewarding, and every setback taught me something.


      Whereas you feared failure, I now see that failure is part of any fulfilling career. Notwithstanding the stress, you built a team that thrives, thereby proving that confidence grows through action. Hence my advice: pursue what scares you.


      Remember your mentor, who believed in you wholeheartedly. Remember Ben, who trusted you with the handover. And remember your family, who waited for you at home.


      Nonetheless, keep one thing: never stop learning. The English you struggled with at the very beginning is now a bridge between two worlds.


      With love,

      Noa

      '
    translation: 'נועה היקרה,


      לפני שנה חשבת שניהול משרד הוא בלתי אפשרי. ראייה לאחור אומרת לי אחרת. הדרך הייתה ארוכה, אם כי מתגמלת, וכל מכשול לימד אותי משהו.


      בעוד שאת פחדת מכישלון, אני רואה עכשיו שכישלון הוא חלק מכל קריירה מספקת. למרות הלחץ, בנית צוות שמשגשג, ובכך הוכחת שביטחון גדל דרך מעשה. מכאן העצה שלי: רדפי אחרי מה שמפחיד אותך.


      זכרי את המנטור שלך, שהאמין בך בכל הלב. זכרי את בן, שסמך עליך בהעברת המקל. וזכרי את המשפחה שלך, שחיכתה לך בבית.


      ובכל זאת, שמרי דבר אחד: לעולם אל תפסיקי ללמוד. האנגלית שהתקשית בה בתחילת הדרך היא עכשיו גשר בין שני עולמות.


      באהבה,

      נועה

      '
