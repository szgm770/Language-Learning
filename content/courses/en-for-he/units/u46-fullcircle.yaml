grammar:
- id: concession
  title:
    he: ניגוד והסתייגות
    en: Concession and contrast
  explanation: 'ברמת C1 מביעים ניגוד בצורות עשירות יותר מ־but:


    - "**albeit** + תיאור (אם כי): *a good result, **albeit** a small one.*"

    - "**whereas / while** מנגדים שני דברים: *Tel Aviv is hot, **whereas** London is cool.*"

    - "**notwithstanding** + שם עצם (למרות): ***Notwithstanding** the delay, we finished.*"

    - "**much as / although / even though** + משפט: ***Much as** I respect him, I disagree.*"

    - "**However + תואר**: ***However** hard she tried, she couldn''t win.*"

    - "**nonetheless / nevertheless** (מילת קישור, אחריה פסיק): *It was late. **Nonetheless**, they continued.*"


    תוצאה: **hence** (לכן, ואחריו שם עצם), **thereby** (ובכך): *She trained the team, **thereby** improving results.*'
  examples:
  - text: It was a success, albeit a small one.
    translation: זו הייתה הצלחה, אם כי קטנה.
  - text: Notwithstanding the delay, the launch went well.
    translation: למרות העיכוב, ההשקה עברה יפה.
  - text: However hard she tried, she could not persuade him.
    translation: ככל שניסתה, היא לא הצליחה לשכנע אותו.
