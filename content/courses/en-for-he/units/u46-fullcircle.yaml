    lines:
    - speaker: cohen
      text: I would like to thank everyone. This office is my greatest success, albeit one that began with a little doubt.
      translation: ברצוני להודות לכולם. המשרד הזה הוא ההצלחה הגדולה ביותר שלי, אם כי כזו שהתחילה בקצת ספק.
    - speaker: ben
      text: Noa, you pursued this goal when others hesitated.
      translation: נועה, רדפת אחרי המטרה הזאת כשאחרים היססו.
    - speaker: noa
      text: Hindsight is wonderful. At the time, I was terrified.
      translation: ראייה לאחור היא נפלאה. באותו זמן פחדתי מאוד.
    - speaker: cohen
      text: Yet you were resilient, and you left a real legacy in London.
      translation: ובכל זאת היית חסונה, והשארת מורשת אמיתית בלונדון.
    - speaker: noa
      text: I had a wonderful mentor. Thank you, Mr. Cohen.
      translation: היה לי מנטור נפלא. תודה, מר כהן.
