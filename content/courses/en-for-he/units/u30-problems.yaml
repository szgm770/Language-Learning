    exercises:
      - { id: "u30-l4-01", type: "learn", lexeme: "warn" }
      - id: u30-l4-02
        type: dialogue
        scene: "יום שני בבוקר. בן לא היה זמין בסוף השבוע, ונועה מספרת לו."
