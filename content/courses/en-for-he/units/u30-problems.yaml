        answers: ["היא שאלה אם אני יכול לעזור לה.", "היא שאלה אם אני יכולה לעזור לה.", "היא שאלה אם אוכל לעזור לה."]
        lexemes: [asked-if, help]
      - id: u30-l3-13
        type: speak_repeat
