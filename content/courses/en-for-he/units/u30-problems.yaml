  # ------------------------------------------------------------------ 5
  - id: u30-l5
    kind: reading
    title: { he: "דוח תקלה", en: "Incident report" }
    exercises:
      - id: u30-l5-01
        type: reading
        kind: "דוח פנימי"
        title: "Incident report: app outage, Thursday 23:00–01:00"
        text: |
          What happened: At 23:00 on Thursday, the mobile app stopped working. Users could not log in for two hours.

          Why it happened: An old server could not deal with the number of users after a new update. In March, David warned the team that this server was too slow, but it was not replaced.

          What we did: David restarted the main system using the 18:00 backup. Tamar found that server three was the problem and restarted it at 00:55. Noa explained the situation to the client and told him that no data was lost.

          Next steps: The old server will be replaced this month. We will test every update on a copy of the system first.
        translation: |
          מה קרה: ב־23:00 ביום חמישי, האפליקציה לנייד הפסיקה לעבוד. משתמשים לא יכלו להתחבר במשך שעתיים.

          למה זה קרה: שרת ישן לא הצליח להתמודד עם מספר המשתמשים אחרי עדכון חדש. במרץ, דוד הזהיר את הצוות שהשרת הזה איטי מדי, אבל הוא לא הוחלף.

          מה עשינו: דוד הפעיל מחדש את המערכת הראשית בעזרת הגיבוי מ־18:00. תמר מצאה שהבעיה בשרת שלוש והפעילה אותו מחדש ב־00:55. נועה הסבירה את המצב ללקוח ואמרה לו שלא אבד מידע.

          הצעדים הבאים: השרת הישן יוחלף החודש. נבדוק כל עדכון קודם על עותק של המערכת.
      - id: u30-l5-02
        type: multiple_choice
        prompt: "כמה זמן משתמשים לא יכלו להתחבר?"
        options: [שעתיים, שעה, חצי יום]
        correct: 0
        lexemes: [down]
      - id: u30-l5-03
        type: multiple_choice
        prompt: "למה זה קרה?"
        options: [שרת ישן לא עמד בעומס אחרי עדכון, מישהו מחק את הגיבוי, הייתה הפסקת חשמל]
        correct: 0
        lexemes: [server]
      - id: u30-l5-04
        type: multiple_choice
        prompt: "על מה דוד הזהיר במרץ?"
        options: [שהשרת איטי מדי, שאין גיבוי, שהעדכון לא טוב]
        correct: 0
        lexemes: [warn]
      - id: u30-l5-05
        type: multiple_choice
        prompt: "מה יקרה החודש?"
        options: [השרת הישן יוחלף, הצוות יעבוד בלילות, הלקוח יעזוב]
        correct: 0
        lexemes: [passive]
      - id: u30-l5-06
        type: fill_blank
        sentence: "Noa told the client that no data ___ lost."
        translation: "נועה אמרה ללקוח שלא אבד מידע."
        answers: [was]
        options: [was, is, will]
        lexemes: [told, passive]
      - id: u30-l5-07
        type: fill_blank
        sentence: "David ___ the team that the server was too slow."
        translation: "דוד הזהיר את הצוות שהשרת איטי מדי."
        answers: [warned]
        options: [warned, said, asked]
        lexemes: [warn]
      - id: u30-l5-08
        type: word_bank
        prompt: "הוא הפעיל מחדש את המערכת בעזרת הגיבוי."
        answers: ["He restarted the system using the backup.", "He restarted the system with the backup."]
        distractors: [restart, by]
        lexemes: [restart, backup]
      - id: u30-l5-09
        type: translate
        direction: to_target
        prompt: "השרת הישן יוחלף."
        answers: ["The old server will be replaced."]
        lexemes: [server, passive]
      - id: u30-l5-10
        type: speak_repeat
