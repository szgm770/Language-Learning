id: u30-problems
cefr: B1
scene: tech
title:
  he: פותרים בעיות
  en: Problem solving
story: "יום חמישי, אחת־עשרה בלילה: השרתים של האפליקציה קורסים. נועה, דוד והלקוח בטלפונים. ביום שני נועה מספרת לבן מה כל אחד אמר, ואיך פתרו את המשבר."
canDo:
  - לתאר בעיה טכנית ומה עשו כדי לפתור אותה
  - "למסור מה מישהו אמר (דיבור עקיף: said, told, asked)"
  - לתת ולהבין הוראות צעד אחר צעד
  - לדבר על פתרונות במצב לחוץ

