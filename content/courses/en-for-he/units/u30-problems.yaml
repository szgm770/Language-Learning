      - { id: "u30-l2-03", type: "learn", lexeme: "explain" }
      - { id: "u30-l2-04", type: "learn", lexeme: "figure-out" }
      - { id: "u30-l2-05", type: "learn", lexeme: "sort-out" }
      - { id: "u30-l2-06", type: "learn", lexeme: "solution" }
      - id: u30-l2-07
        type: dialogue
        scene: "חצות. דוד מסביר לתמר בווידאו מה לעשות."
        lines:
          - { speaker: "tamar", text: "David, I'm online. Explain what I need to do, step by step.", translation: "דוד, אני מחוברת. תסביר מה אני צריכה לעשות, צעד אחר צעד." }
          - { speaker: "david", text: "First, open the control panel. Then click on 'Servers'.", translation: "קודם, פתחי את לוח הבקרה. אחר כך לחצי על 'שרתים'." }
          - { speaker: "tamar", text: "Done. There's a red light on server three.", translation: "בוצע. יש אור אדום על שרת שלוש." }
          - { speaker: "david", text: "That's the problem! I couldn't figure it out. Now restart it.", translation: "זו הבעיה! לא הצלחתי להבין את זה. עכשיו תפעילי אותו מחדש." }
          - { speaker: "tamar", text: "It's green now! I think we've found the solution.", translation: "הוא ירוק עכשיו! אני חושבת שמצאנו את הפתרון." }
          - { speaker: "david", text: "Brilliant. I knew we'd sort it out.", translation: "מבריק. ידעתי שנסדר את זה." }
      - id: u30-l2-08
        type: match_pairs
        pairs:
          - [instructions, הוראות]
          - [explain, להסביר]
          - [figure out, לפענח]
          - [sort out, לסדר]
          - [solution, פתרון]
        lexemes: [instructions, explain, figure-out, sort-out, solution]
      - id: u30-l2-09
        type: multiple_choice
        prompt: "איפה הייתה הבעיה?"
        options: [בשרת שלוש, בלוח הבקרה, בטלפון של תמר]
        correct: 0
        lexemes: [server]
      - id: u30-l2-10
        type: multiple_choice
        prompt: "מה תמר עשתה כדי לפתור?"
        options: [הפעילה מחדש את השרת, התקשרה ללקוח, מחקה את הגיבוי]
        correct: 0
        lexemes: [restart, solution]
      - id: u30-l2-11
        type: dialogue_gap
        lines:
          - { speaker: "noa", text: "Can you explain the problem to the client?", translation: "אתה יכול להסביר את הבעיה ללקוח?" }
          - { speaker: "ben", text: "Sure. I'll explain it to him in simple words.", translation: "בטח. אסביר לו את זה במילים פשוטות." }
        gap: 1
        distractors: ["Sure. I'll explain him it in simple words.", "Sure. I'll explain to him it simple."]
        lexemes: [explain]
      - id: u30-l2-12
        type: tip
        title: "explain it to me"
        text: |
          בעברית "תסביר לי". באנגלית לא אומרים explain me, אלא explain to me או explain it to me.

          Can you explain this to me? היא דרך מנומסת ונפוצה מאוד לבקש הסבר.
      - id: u30-l2-13
        type: translate
        direction: to_target
        prompt: "אל תדאגי, נסדר את זה."
        answers: ["Don't worry, we'll sort it out.", "Don't worry, we will sort it out.", "Don't worry. We'll sort it out."]
        lexemes: [sort-out]
      - id: u30-l2-14
        type: translate
        direction: to_source
        prompt: "I couldn't figure out the problem."
        answers: ["לא הצלחתי להבין את הבעיה.", "לא הצלחתי לפענח את הבעיה.", "לא הבנתי מה הבעיה."]
        lexemes: [figure-out, problem]
      - id: u30-l2-15
        type: speak_repeat
        text: "Explain what I need to do, step by step."
        translation: "תסביר מה אני צריכה לעשות, צעד אחר צעד."
        lexemes: [explain, step-by-step]

