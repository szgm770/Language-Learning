grammar:
  - id: reported-speech
    title: { he: "דיבור עקיף: He said that…", en: "Reported speech" }
    explanation: |
      בעברית מוסרים דברים בלי לשנות את הזמן: "דוד אמר: השרת לא עובד" → "דוד אמר שהשרת **לא עובד**". באנגלית, כשמוסרים אחרי **said** או **told**, בדרך כלל זזים **צעד אחד אחורה בזמן**:

      - "The server **is** down." → David said (that) the server **was** down.
      - "I **can** fix it." → He said he **could** fix it.
      - "We **will** call you." → They said they **would** call me.
      - "I **fixed** it." → She said she **had fixed** it.

      **said** בלי אדם, **told** עם אדם: **He said that…** / **He told me that…** (לא "He said me").

      שאלות ובקשות:
      - "Is it working?" → She **asked if** it was working.
      - "Please call me." → He **asked me to** call him.
    examples:
      - { text: "Noa said that she was very tired.", translation: "נועה אמרה שהיא מאוד עייפה." }
      - { text: "The client told us he would call back.", translation: "הלקוח אמר לנו שהוא יחזור אלינו." }
      - { text: "Ben asked if the app was working again.", translation: "בן שאל אם האפליקציה עובדת שוב." }

lessons:
  # ------------------------------------------------------------------ 1
  - id: u30-l1
    kind: new
    title: { he: "השרתים קרסו", en: "The servers are down" }
    exercises:
      - id: u30-l1-01
        type: dialogue
        scene: "יום חמישי, 23:05. הטלפון של נועה מצלצל."
        lines:
          - { speaker: "david", text: "Noa, sorry to call so late. It's urgent. The servers have crashed.", translation: "נועה, סליחה שאני מתקשר כל כך מאוחר. זה דחוף. השרתים קרסו." }
          - { speaker: "noa", text: "What? Is the app down?", translation: "מה? האפליקציה לא עובדת?" }
          - { speaker: "david", text: "Completely. Nobody can log in.", translation: "לגמרי. אף אחד לא מצליח להתחבר." }
          - { speaker: "noa", text: "OK, calm down. First of all, do we have a backup?", translation: "בסדר, תירגע. קודם כול, יש לנו גיבוי?" }
          - { speaker: "david", text: "Yes, from six o'clock. I'm trying to restart everything now.", translation: "כן, משש. אני מנסה להפעיל הכול מחדש עכשיו." }
          - { speaker: "noa", text: "Good. I'll deal with the client. Call me as soon as you know more.", translation: "טוב. אני אטפל בלקוח. תתקשר אליי ברגע שתדע יותר." }
      - { id: "u30-l1-02", type: "learn", lexeme: "urgent" }
      - { id: "u30-l1-03", type: "learn", lexeme: "server" }
      - { id: "u30-l1-04", type: "learn", lexeme: "crash" }
      - { id: "u30-l1-05", type: "learn", lexeme: "down" }
      - { id: "u30-l1-06", type: "learn", lexeme: "calm-down" }
      - { id: "u30-l1-07", type: "learn", lexeme: "first-of-all" }
      - { id: "u30-l1-08", type: "learn", lexeme: "backup" }
      - { id: "u30-l1-09", type: "learn", lexeme: "restart" }
      - { id: "u30-l1-13", type: "learn", lexeme: "deal-with" }
      - { id: "u30-l1-14", type: "learn", lexeme: "as-soon-as" }
      - id: u30-l1-10
        type: match_pairs
        pairs:
          - [urgent, דחוף]
          - [server, שרת]
          - [crash, לקרוס]
          - [backup, גיבוי]
          - [restart, להפעיל מחדש]
        lexemes: [urgent, server, crash, backup, restart]
      - id: u30-l1-11
        type: multiple_choice
        prompt: "מה הבעיה?"
        options: [השרתים קרסו ואף אחד לא מתחבר, הלקוח כועס, דוד איבד את הטלפון]
        correct: 0
        lexemes: [crash, down]
      - id: u30-l1-12
        type: multiple_choice
        prompt: "על מה נועה תטפל?"
        options: [בלקוח, בשרתים, בגיבוי]
        correct: 0
        lexemes: [deal-with]
      - id: u30-l1-15
        type: listening_choice
        audioText: "The website is down. Call me as soon as it's working again."
        question: מה היא מבקשת?
        options: [להתקשר ברגע שהאתר חוזר לעבוד, לתקן את האתר מחר, לבנות אתר חדש]
        correct: 0
        lexemes: [down, as-soon-as]
      - id: u30-l1-16
        type: word_bank
        prompt: "קודם כול, תירגע."
        answers: ["First of all, calm down."]
        distractors: [down, first]
        lexemes: [first-of-all, calm-down]
      - id: u30-l1-17
        type: speak_repeat
        text: "It's urgent. The servers have crashed."
        translation: "זה דחוף. השרתים קרסו."
        lexemes: [urgent, server, crash]

  # ------------------------------------------------------------------ 2
  - id: u30-l2
    kind: new
    title: { he: "צעד אחר צעד", en: "Step by step" }
    exercises:
      - { id: "u30-l2-01", type: "learn", lexeme: "instructions" }
