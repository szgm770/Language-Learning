grammar:
  - id: a-an-plurals
    title: { he: "יחיד ורבים: a, an", en: "a, an and plurals" }
    explanation: |
      בעברית אומרים "קפה, בבקשה". באנגלית, לפני דבר אחד שאפשר לספור, שמים **a**: **a coffee**, **a sandwich**.

      לפני מילה שמתחילה בתנועה (a, e, i, o, u) אומרים **an**, כדי שיהיה קל לבטא: **an orange juice**, **an egg**.

      רבים: ברוב המילים מוסיפים **s**: **two coffees**, **three cakes**. ואין a ברבים.

      ובקשה מנומסת: **Can I have a tea, please?** – אפשר לקבל תה, בבקשה?
    examples:
      - { text: "A sandwich and an orange juice, please.", translation: "כריך ומיץ תפוזים, בבקשה." }
      - { text: "Two coffees, please.", translation: "שני קפה, בבקשה." }
      - { text: "Can I have a bottle of water?", translation: "אפשר לקבל בקבוק מים?" }

