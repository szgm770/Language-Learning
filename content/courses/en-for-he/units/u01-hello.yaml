  - { id: "best", text: "best", translation: "הכי טוב", pos: "adjective", pronunciation: "בֶּסְט", example: { text: "She is my best friend.", translation: "היא החברה הכי טובה שלי." } }
  - { id: "world", text: "world", translation: "עולם", pos: "noun", pronunciation: "וֶורְלְד", example: { text: "The company works all over the world.", translation: "החברה עובדת בכל העולם." } }
  - { id: "young", text: "young", translation: "צעיר", pos: "adjective", pronunciation: "יָאנְג", example: { text: "My brother is young.", translation: "אחי צעיר." } }
  - { id: "understand", text: "understand", translation: "להבין", pos: "verb", pronunciation: "אַנְדֶרְסְטֶנְד", example: { text: "I understand your question.", translation: "אני מבין את השאלה שלך." } }
  - { id: "write", text: "write", translation: "לכתוב", pos: "verb", pronunciation: "רָאיט", example: { text: "I write my name here.", translation: "אני כותב את השם שלי כאן." } }
  - { id: "word", text: "word", translation: "מילה", pos: "noun", pronunciation: "וֶורְד", example: { text: "This word is new for me.", translation: "המילה הזאת חדשה לי." } }
  - { id: "listen", text: "listen", translation: "להקשיב", pos: "verb", pronunciation: "לִיסֶן", example: { text: "Please listen to the teacher.", translation: "בבקשה תקשיב למורה." } }
  - { id: "remember", text: "remember", translation: "לזכור", pos: "verb", pronunciation: "רִימֶמְבֶּר", example: { text: "I remember his phone number.", translation: "אני זוכר את מספר הטלפון שלו." } }
  - { id: "forget", text: "forget", translation: "לשכוח", pos: "verb", pronunciation: "פֶרְגֶט", example: { text: "I forget my keys every day.", translation: "אני שוכח את המפתחות כל יום." } }
grammar:
  - id: i-am-you-are
    title: { he: "אני, אתה: I am, you are", en: "I am, you are" }
    explanation: |
      בעברית אומרים "אני נועה" בלי שום מילה באמצע. באנגלית חייבים פועל, "להיות":

      - **I am Noa** – אני נועה
      - **You are Ben** – אתה בן

      בדיבור מקצרים: **I'm** במקום I am, ו־**you're** במקום you are. שתי הצורות נכונות.

      בשאלה הופכים את הסדר: **Are you Ben?** – אתה בן? ועונים בקצרה: **Yes, I am.** או **No, I'm not.**

      שימו לב: **I** (אני) נכתבת תמיד באות גדולה, גם באמצע משפט.
    examples:
      - { text: "I'm Noa.", translation: "אני נועה." }
      - { text: "You're Ben.", translation: "אתה בן." }
      - { text: "Are you Ben? Yes, I am.", translation: "אתה בן? כן." }
  - id: whats-your-name
    title: { he: "לשאול לשם: What's your name", en: "What's your name?" }
    explanation: |
      באנגלית לא שואלים "איך קוראים לך", אלא "מה השם שלך": **What's your name?**

      עונים: **My name is Noa.** (השם שלי הוא נועה), או פשוט **I'm Noa.**

      המילה **your** מתאימה לגבר, לאישה ולרבים. אין צורך לבחור כמו בעברית.
    examples:
      - { text: "What's your name?", translation: "איך קוראים לך?" }
      - { text: "My name is Ben.", translation: "קוראים לי בן." }

lessons:
  # ------------------------------------------------------------------ 1
  - id: u1-l1
    kind: new
    title: { he: "היי, אני נועה", en: "Hi, I'm Noa" }
    exercises:
      - id: u1-l1-01
        type: dialogue
        scene: היום הראשון של בן בעבודה. נועה מתקשרת להכיר אותו.
        lines:
          - { speaker: "noa", text: "Hi! I'm Noa.", translation: "היי! אני נועה." }
          - { speaker: "ben", text: "Hello, Noa. I'm Ben.", translation: "שלום, נועה. אני בן." }
          - { speaker: "noa", text: "Nice to meet you, Ben.", translation: "נעים להכיר, בן." }
          - { speaker: "ben", text: "Nice to meet you too!", translation: "גם לי נעים להכיר!" }
      - { id: "u1-l1-02", type: "learn", lexeme: "hello" }
      - { id: "u1-l1-03", type: "learn", lexeme: "hi" }
      - id: u1-l1-04
        type: multiple_choice
        prompt: איך אומרים "שלום" באנגלית?
        options: [Hello, Goodbye, Thank you]
        correct: 0
        lexemes: [hello]
      - { id: "u1-l1-05", type: "learn", lexeme: "im" }
      - id: u1-l1-06
        type: word_bank
        prompt: היי, אני בן.
        answers: ["Hi, I'm Ben.", "Hi, I am Ben."]
        distractors: [Noa, Hello]
        lexemes: [hi, im]
      - { id: "u1-l1-07", type: "learn", lexeme: "nice-to-meet-you" }
      - id: u1-l1-08
        type: listening_choice
        audioText: Nice to meet you
        question: מה שמעתם?
        options: [נעים להכיר, להתראות, היי]
        correct: 0
        lexemes: [nice-to-meet-you]
      - { id: "u1-l1-09", type: "learn", lexeme: "goodbye" }
      - { id: "u1-l1-10", type: "learn", lexeme: "bye" }
      - id: u1-l1-11
        type: match_pairs
        pairs:
          - [Hello, שלום]
          - [Goodbye, להתראות]
          - [Nice to meet you, נעים להכיר]
          - ["I'm", אני]
        lexemes: [hello, goodbye, nice-to-meet-you, im]
      - id: u1-l1-12
        type: dialogue_gap
        lines:
          - { speaker: "noa", text: "Hi! I'm Noa.", translation: "היי! אני נועה." }
          - { speaker: "ben", text: "Hello, Noa. I'm Ben.", translation: "שלום, נועה. אני בן." }
        gap: 1
        distractors: ["Goodbye, Noa.", "Nice to meet you, Noa. I'm Noa."]
        lexemes: [hello, im]
      - id: u1-l1-13
        type: translate
        direction: to_target
        prompt: להתראות!
        answers: ["Goodbye!", "Bye!", "Goodbye", "Bye"]
        lexemes: [goodbye]
      - id: u1-l1-14
        type: speak_repeat
        text: "Hi, I'm Noa. Nice to meet you!"
        translation: היי, אני נועה. נעים להכיר!
        lexemes: [hi, im, nice-to-meet-you]

  # ------------------------------------------------------------------ 2
  - id: u1-l2
    kind: new
    title: { he: "בוקר טוב, ותודה", en: "Good morning, and thank you" }
    exercises:
      - { id: "u1-l2-01", type: "learn", lexeme: "good-morning" }
      - { id: "u1-l2-02", type: "learn", lexeme: "good-afternoon" }
      - { id: "u1-l2-03", type: "learn", lexeme: "good-evening" }
      - id: u1-l2-04
