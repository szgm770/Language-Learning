id: u01-hello
cefr: A1
scene: hello
title:
  he: שלום, נעים להכיר
  en: Hello, nice to meet you
story: היום הראשון של בן בחברה. נועה מתל אביב פוגשת אותו בשיחת וידאו.
canDo:
  - לברך לשלום ולהיפרד, בכל שעה ביום
  - להציג את עצמי ולשאול איך קוראים למישהו
  - לשאול "מה שלומך?" ולענות
  - להגיד תודה ובבקשה

