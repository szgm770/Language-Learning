        answers: [evening]
        options: [evening, night, morning]
        lexemes: [good-evening]
      - { id: "u1-l2-08", type: "learn", lexeme: "thank-you" }
      - { id: "u1-l2-09", type: "learn", lexeme: "please" }
      - id: u1-l2-10
