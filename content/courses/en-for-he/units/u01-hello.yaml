          - { speaker: "ben", text: "Good morning, Noa!", translation: "בוקר טוב, נועה!" }
          - { speaker: "noa", text: "Good morning, Ben!", translation: "בוקר טוב, בן!" }
        gap: 1
        distractors: ["Good night, Ben!", "Goodbye, Ben!"]
        lexemes: [good-morning]
      - id: u1-l2-13
        type: translate
        direction: to_target
        prompt: תודה!
        answers: ["Thank you!", "Thanks!", "Thank you", "Thanks"]
        lexemes: [thank-you]
      - id: u1-l2-14
        type: dictation
        text: Good evening
        lexemes: [good-evening]
      - id: u1-l2-15
        type: speak_repeat
        text: "Good morning! Thank you!"
        translation: בוקר טוב! תודה!
        lexemes: [good-morning, thank-you]

  # ------------------------------------------------------------------ 3
