        text: |
          באנגלית Good night לא משמש לברכת שלום. אומרים אותו רק כשנפרדים בלילה או הולכים לישון.

          נכנסים לחדר בשמונה בערב? אומרים Good evening. יוצאים בחצות? אומרים Good night.
