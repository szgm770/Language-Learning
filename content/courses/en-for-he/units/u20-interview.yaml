grammar:
  - id: present-perfect
    title: { he: "הווה מושלם: I have worked", en: "Present perfect" }
    explanation: |
      בעברית יש עבר אחד. באנגלית יש עוד צורה, **הווה מושלם**, לדברים שקרו בעבר אבל **חשובים עכשיו**: ניסיון בחיים, משהו שכבר קרה או שעוד לא קרה.

      המבנה: **have / has + צורה שלישית של הפועל**
      - בפעלים רגילים הצורה השלישית זהה לעבר: **worked, lived, finished**
      - בפעלים יוצאי דופן יש צורה משלה: **be → been**, **do → done**, **see → seen**, **lead → led**

      דוגמאות:
      - ניסיון: **I have worked with big teams.** / **Have you ever been to Japan?**
      - **already** (כבר): **I've already sent the email.**
      - **yet** (עדיין לא, בסוף משפט): **I haven't finished yet.**

      שימו לב: כשאומרים **מתי** בדיוק (yesterday, last year), חוזרים לעבר הפשוט: **I went to Japan last year.**
    examples:
      - { text: "I've lived in London for one year.", translation: "אני גרה בלונדון כבר שנה." }
      - { text: "She has never led a team.", translation: "היא אף פעם לא ניהלה צוות." }
      - { text: "Have you finished the report yet? Yes, I've already finished it.", translation: "כבר סיימת את הדוח? כן, כבר סיימתי." }

