    kind: reading
    title: { he: "מכתב מקדים", en: "A cover letter" }
    exercises:
      - id: u20-l5-01
        type: reading
        kind: "מכתב מועמדות"
        title: "Application: Team Leader, Project Bridge"
        text: |
          Dear Ms. García,

          I would like to apply for the position of Team Leader on Project Bridge.

          I have worked as an engineer in our Tel Aviv office for six years, and I have lived in London for the past year. I have led five projects, and I have worked with teams in Israel, England and the USA.

          I am organized, I communicate well, and I enjoy helping people learn. I have never been a team leader, but I am ready for this challenge.

          Thank you for your time. I hope to hear from you soon.

          Best regards,
          Noa Levi
        translation: |
          גב' גרסיה היקרה,

          ברצוני להגיש מועמדות לתפקיד ראש צוות בפרויקט ברידג'.

          אני עובדת כמהנדסת במשרד שלנו בתל אביב כבר שש שנים, ואני גרה בלונדון בשנה האחרונה. הובלתי חמישה פרויקטים, ועבדתי עם צוותים בישראל, באנגליה ובארצות הברית.

          אני מאורגנת, מתקשרת היטב ונהנית לעזור לאנשים ללמוד. אף פעם לא הייתי ראש צוות, אבל אני מוכנה לאתגר הזה.

          תודה על זמנך. אני מקווה לשמוע ממך בקרוב.

          בברכה,
          נועה לוי
