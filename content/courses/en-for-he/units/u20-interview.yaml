  - { id: "project", text: "project", translation: "פרויקט", pos: "noun", pronunciation: "פְּרוֹג'ֶקְט" }
  - { id: "salary", text: "salary", translation: "משכורת", pos: "noun", pronunciation: "סֶלָרִי" }
