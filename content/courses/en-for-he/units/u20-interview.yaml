      - id: u20-l1-01
        type: dialogue
        scene: "בן מראה לנועה מודעת דרושים פנימית."
        lines:
          - { speaker: "ben", text: "Look, Noa. They need a team leader for the new project.", translation: "תראי, נועה. הם צריכים ראש צוות לפרויקט החדש." }
          - { speaker: "noa", text: "Between London and Tel Aviv? That's perfect for me!", translation: "בין לונדון לתל אביב? זה מושלם בשבילי!" }
          - { speaker: "ben", text: "You should apply. You have the skills and the experience.", translation: "כדאי שתגישי מועמדות. יש לך את הכישורים ואת הניסיון." }
          - { speaker: "noa", text: "But I've never been a team leader.", translation: "אבל אף פעם לא הייתי ראש צוות." }
          - { speaker: "ben", text: "So? You've led a lot of projects. Apply!", translation: "אז מה? הובלת הרבה פרויקטים. תגישי!" }
      - { id: "u20-l1-02", type: "learn", lexeme: "team" }
      - { id: "u20-l1-03", type: "learn", lexeme: "team-leader" }
      - { id: "u20-l1-04", type: "learn", lexeme: "project" }
      - { id: "u20-l1-05", type: "learn", lexeme: "apply" }
      - { id: "u20-l1-06", type: "learn", lexeme: "skills" }
      - { id: "u20-l1-07", type: "learn", lexeme: "experience" }
