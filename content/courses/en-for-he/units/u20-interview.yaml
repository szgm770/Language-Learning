  - { id: "ever", text: "ever", translation: "אי פעם", pos: "adverb", pronunciation: "אֶבֶר" }
  - { id: "already", text: "already", translation: "כבר", pos: "adverb", pronunciation: "אוֹלְרֶדִי" }
  - { id: "yet", text: "yet", translation: "עדיין (לא), כבר? (בשאלה)", pos: "adverb", pronunciation: "יֶט", example: { text: "I haven't finished yet.", translation: "עוד לא סיימתי." } }
  - { id: "been", text: "been", translation: "הייתי (בהווה מושלם, צורה שלישית של be)", pos: "verb", pronunciation: "בִּין", example: { text: "Have you ever been to Japan?", translation: "היית פעם ביפן?" } }
