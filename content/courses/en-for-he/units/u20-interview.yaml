  - { id: "weak", text: "weak", translation: "חלש", pos: "adjective", pronunciation: "וִויק" }
  - { id: "have-done", text: "have + done", translation: "הווה מושלם (עשיתי, עד עכשיו)", pos: "phrase", pronunciation: "הֶב דַאן", example: { text: "I have worked in London for a year.", translation: "אני עובדת בלונדון כבר שנה." } }
