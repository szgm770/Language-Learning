          - { speaker: "miriam", text: "Have you ever worked with teams in two countries?", translation: "עבדת פעם עם צוותים בשתי מדינות?" }
          - { speaker: "noa", text: "Yes, I have. This year I've worked with London and Tel Aviv every day.", translation: "כן. השנה עבדתי עם לונדון ותל אביב כל יום." }
