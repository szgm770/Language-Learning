id: u20-interview
cefr: A2
scene: work
title:
  he: הראיון
  en: The interview
story: "החברה מחפשת ראש צוות לפרויקט חדש בין תל אביב ללונדון. נועה מגישה מועמדות, מתכוננת עם בן, ומספרת בראיון על הניסיון שלה."
canDo:
  - לדבר על ניסיון ועל כישורים בראיון עבודה
  - "להשתמש בהווה מושלם: I have worked, I have never…"
  - לשאול Have you ever…?
  - להשתמש ב־already ו־yet

