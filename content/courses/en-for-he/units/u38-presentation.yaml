grammar:
  - id: linking-words
    title: { he: "מילות קישור ושפה רשמית", en: "Linking words and formal register" }
    explanation: |
      **מילות קישור** מחברות רעיונות ועוזרות לשומעים לעקוב אחרי הדברים:

      - **הוספה:** *furthermore, in addition, moreover* – ‏"בנוסף"
      - **ניגוד:** *however, nevertheless* – ‏"אבל / למרות זאת"
      - **תוצאה:** *consequently, as a result* – ‏"כתוצאה מכך"
      - **סיכום:** *in conclusion, to sum up* – ‏"לסיכום"

      במילות קישור פורמליות שמים בדרך כלל **פסיק** אחריהן:
      **The results were good. Nevertheless, we need more data.**

      **שפה רשמית** אומרת: משפטים שלמים, בלי קיצורים (**do not** במקום **don't**) ובקשות מנומסות:
      - **I would like to thank you all for coming.**
      - **On behalf of the company, welcome.**
    examples:
      - { text: "Sales rose by ten percent. Furthermore, costs fell.", translation: "המכירות עלו בעשרה אחוזים. יתרה מזאת, העלויות ירדו." }
      - { text: "The weather was bad. Nevertheless, the conference was a success.", translation: "מזג האוויר היה גרוע. למרות זאת, הכנס הצליח." }
      - { text: "In conclusion, we recommend a new approach.", translation: "לסיכום, אנו ממליצים על גישה חדשה." }

