  # ------------------------------------------------------------------ 5
  - id: u38-l5
    kind: reading
    title: { he: "איך לבנות הרצאה טובה", en: "How to give a great talk" }
    exercises:
      - id: u38-l5-01
        type: reading
        kind: "מדריך"
        title: "A simple guide to great presentations"
        text: |
          Good presentations are not about slides. They are about people.

          To begin with, know your audience. Consequently, you can choose examples that matter to them. Furthermore, keep your outline simple: an introduction, three key points, and a conclusion.

          Many speakers fill their slides with text. Nevertheless, research suggests that audiences remember pictures and stories much better than words. In addition, a short pause can be more powerful than another sentence.

          Finally, practise aloud. Even experienced speakers admit feeling nervous. In conclusion: prepare carefully, speak clearly, and smile.
        translation: |
          הרצאות טובות אינן עוסקות בשקופיות. הן עוסקות באנשים.

          קודם כול, הכירו את הקהל שלכם. כתוצאה מכך תוכלו לבחור דוגמאות שחשובות לו. יתרה מזאת, שמרו על מתווה פשוט: הקדמה, שלוש נקודות מרכזיות וסיכום.

          הרבה מרצים ממלאים את השקופיות בטקסט. עם זאת, מחקרים מצביעים על כך שהקהל זוכר תמונות וסיפורים הרבה יותר טוב ממילים. בנוסף, הפסקה קצרה יכולה להיות חזקה יותר ממשפט נוסף.

          לבסוף, התאמנו בקול. גם מרצים ותיקים מודים שהם מתרגשים. לסיכום: התכוננו בקפידה, דברו בבהירות, וחייכו.
      - id: u38-l5-02
        type: multiple_choice
        prompt: "על מה ההרצאה הטובה, לפי הכותב?"
        options: [על אנשים, על שקופיות, על נתונים]
        correct: 0
        lexemes: [audience]
      - id: u38-l5-03
        type: multiple_choice
        prompt: "מה הקהל זוכר טוב יותר?"
        options: [תמונות וסיפורים, טקסט, נתונים]
