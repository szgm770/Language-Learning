id: u38-presentation
cefr: B2
scene: news
title:
  he: ההרצאה
  en: The presentation
story: "נועה מוזמנת להרצות בכנס מקצועי. היא לומדת לבנות הרצאה, להשתמש בשפה רשמית ובמילות קישור, ולענות על שאלות מהקהל."
canDo:
  - לבנות הרצאה עם פתיחה, גוף וסיכום
  - להשתמש במילות קישור פורמליות (furthermore, nevertheless, consequently)
  - לדבר ולכתוב ברמה רשמית
  - לענות על שאלות מהקהל בנימוס

