id: v1-words
cefr: B1
scene: travel
title:
  he: נועה עוברת ללונדון
  en: Noa moves to London
story: 'נועה קיבלה את התפקיד בפרויקט ברידג׳. היא אורזת, נפרדת מאמא, ועוברת ללונדון: דירה חדשה, שכונה חדשה, וקהילה חדשה לקראת שבת הראשונה.'
canDo:
- לספר על מעבר דירה ועל אריזה
- לתאר דירה ושכונה חדשות
- להתכונן לשבת ראשונה בקהילה חדשה
vocabulary:
- id: practice
  text: practice
  translation: תרגול, אימון
  pos: noun
  example:
    text: Noa did some English practice on the plane.
    translation: נועה תרגלה קצת אנגלית במטוס.
- id: voice
  text: voice
  translation: קול
  pos: noun
  example:
    text: Her mother's voice was quiet on the phone.
    translation: הקול של אמא שלה היה שקט בטלפון.
- id: safe
  text: safe
  translation: בטוח
  pos: adjective
  example:
    text: Is it safe to walk here at night?
    translation: האם בטוח ללכת כאן בלילה?
- id: deep
  text: deep
  translation: עמוק
  pos: adjective
  example:
    text: Noa took a deep breath at the airport.
    translation: נועה נשמה נשימה עמוקה בשדה התעופה.
- id: popular
  text: popular
  translation: פופולרי
  pos: adjective
  example:
    text: Her new street is popular with young families.
    translation: הרחוב החדש שלה פופולרי בקרב משפחות צעירות.
- id: response
  text: response
  translation: תגובה, תשובה
  pos: noun
  example:
    text: She is waiting for a response from the landlord.
    translation: היא מחכה לתגובה מבעל הבית.
- id: respect
  text: respect
  translation: כבוד; לכבד
  pos: noun
  example:
    text: Rachel has great respect for her daughter.
    translation: לרחל יש כבוד רב לבת שלה.
- id: pain
  text: pain
  translation: כאב
  pos: noun
  example:
    text: Saying goodbye was a real pain for both of them.
    translation: הפרידה הייתה כאב אמיתי לשתיהן.
- id: river
  text: river
  translation: נהר
  pos: noun
  example:
    text: Ben's flat is next to the river.
    translation: הדירה של בן נמצאת ליד הנהר.
- id: speed
  text: speed
  translation: מהירות
  pos: noun
  example:
    text: The taxi drove at high speed to the airport.
    translation: המונית נסעה במהירות גבוהה לשדה התעופה.
- id: standard
  text: standard
  translation: סטנדרט, רמה
  pos: noun
  example:
    text: The flat is small, but the standard is high.
    translation: הדירה קטנה, אבל הרמה גבוהה.
- id: peace
  text: peace
  translation: שלום, שקט
  pos: noun
  example:
    text: Noa loves the peace of the morning.
    translation: נועה אוהבת את השקט של הבוקר.
- id: pressure
  text: pressure
  translation: לחץ
  pos: noun
  example:
    text: There is a lot of pressure at the new job.
    translation: יש הרבה לחץ בעבודה החדשה.
- id: focus
  text: focus
  translation: להתמקד; מיקוד
  pos: verb
  example:
    text: It's hard to focus with so many boxes.
    translation: קשה להתרכז עם כל כך הרבה ארגזים.
- id: particular
  text: particular
  translation: מסוים, מיוחד
  pos: adjective
  example:
    text: She is looking for a particular kind of kettle.
    translation: היא מחפשת סוג מסוים של קומקום.
- id: previous
  text: previous
  translation: קודם, קודם לכן
  pos: adjective
  example:
    text: The previous tenant left a plant.
    translation: הדייר הקודם השאיר עציץ.
- id: consider
  text: consider
  translation: לשקול, להתחשב
  pos: verb
  example:
    text: Ben, consider this flat your second home.
    translation: בן, תחשוב על הדירה הזאת כבית השני שלך.
- id: immediately
  text: immediately
  translation: מיד
  pos: adverb
  example:
    text: Noa called her mother immediately.
    translation: נועה התקשרה לאמא שלה מיד.
- id: sell
  text: sell
  translation: למכור
  pos: verb
  example:
    text: The shop on the corner doesn't sell kosher milk.
    translation: החנות בפינה לא מוכרת חלב כשר.
- id: ability
  text: ability
  translation: יכולת
  pos: noun
  example:
    text: Ben has the ability to fix anything.
    translation: לבן יש יכולת לתקן כל דבר.
- id: collection
  text: collection
  translation: אוסף
  pos: noun
  example:
    text: Mrs. Katz has a collection of old siddurim.
    translation: לגברת כץ יש אוסף של סידורים ישנים.
- id: opinion
  text: opinion
  translation: דעה
  pos: noun
  example:
    text: In my opinion, the market is the best place in the area.
    translation: לדעתי, השוק הוא המקום הכי טוב באזור.
- id: physical
  text: physical
  translation: גופני, פיזי
  pos: adjective
  example:
    text: Moving boxes is hard physical work.
    translation: להעביר ארגזים זו עבודה פיזית קשה.
- id: active
  text: active
  translation: פעיל
  pos: adjective
  example:
    text: The community here is very active.
    translation: הקהילה כאן פעילה מאוד.
- id: effort
  text: effort
  translation: מאמץ
  pos: noun
  example:
    text: Noa made an effort to learn the bus routes.
    translation: נועה התאמצה ללמוד את קווי האוטובוס.
- id: wear
  text: wear
  translation: ללבוש
  pos: verb
  example:
    text: You should wear a coat; London is cold.
    translation: כדאי ללבוש מעיל; בלונדון קר.
- id: details
  text: details
  translation: פרטים
  pos: noun
  example:
    text: Mrs. Katz wrote the details on a note.
    translation: גברת כץ כתבה את הפרטים על פתק.
- id: direct
  text: direct
  translation: ישיר
  pos: adjective
  example:
    text: There is a direct bus to the office.
    translation: יש אוטובוס ישיר למשרד.
- id: rich
  text: rich
  translation: עשיר
  pos: adjective
  example:
    text: The cake was rich and sweet.
    translation: העוגה הייתה עשירה ומתוקה.
- id: skin
  text: skin
  translation: עור
  pos: noun
  example:
    text: The cold wind is hard on her skin.
    translation: הרוח הקרה קשה לעור שלה.
- id: sweet
  text: sweet
  translation: מתוק
  pos: adjective
  example:
    text: Noa baked a sweet challah for Shabbat.
    translation: נועה אפתה חלה מתוקה לשבת.
- id: glad
  text: glad
  translation: שמח
  pos: adjective
  example:
    text: I'm glad you came to dinner.
    translation: אני שמחה שבאת לארוחה.
- id: overall
  text: overall
  translation: בסך הכול
  pos: adverb
  example:
    text: Overall, it was a wonderful first week.
    translation: בסך הכול, זה היה שבוע ראשון נפלא.
- id: carry
  text: carry
  translation: לשאת, לסחוב
  pos: verb
  example:
    text: Can you carry the candles for me?
    translation: אתה יכול לסחוב את הנרות בשבילי?
- id: reality
  text: reality
  translation: מציאות
  pos: noun
  example:
    text: The reality of living abroad is not always easy.
    translation: המציאות של חיים בחו״ל לא תמיד קלה.
- id: spot
  text: spot
  translation: מקום, כתם
  pos: noun
  example:
    text: She found a quiet spot by the window.
    translation: היא מצאה פינה שקטה ליד החלון.
- id: comment
  text: comment
  translation: הערה; להגיב
  pos: noun
  example:
    text: Mrs. Katz made a funny comment about the weather.
    translation: גברת כץ אמרה הערה מצחיקה על מזג האוויר.
- id: equipment
  text: equipment
  translation: ציוד
  pos: noun
  example:
    text: The kitchen has all the equipment she needs.
    translation: במטבח יש את כל הציוד שהיא צריכה.
- id: purpose
  text: purpose
  translation: מטרה
  pos: noun
  example:
    text: The purpose of the visit was to meet the community.
    translation: מטרת הביקור הייתה להכיר את הקהילה.
