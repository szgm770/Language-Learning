    en: Packing
  exercises:
  - id: v1-l1-d1
    type: dialogue
    scene: נועה אורזת בבית בתל אביב. אמא שלה, רחל, עוזרת.
    lines:
    - speaker: rachel
      text: Are you sure it's safe to live alone in London?
      translation: את בטוחה שזה בטוח לגור לבד בלונדון?
    - speaker: noa
      text: Mum, it's a popular area, and Ben lives near the river.
      translation: אמא, זה אזור פופולרי, ובן גר ליד הנהר.
    - speaker: rachel
      text: I respect your choice. But my heart is in pain.
      translation: אני מכבדת את הבחירה שלך. אבל הלב שלי כואב.
    - speaker: noa
      text: I'll call you every day. You'll hear my voice so often you'll get tired of it!
      translation: אתקשר אלייך כל יום. תשמעי את הקול שלי כל כך הרבה שתתעייפי ממנו!
