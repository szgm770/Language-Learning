id: v1-words
cefr: B1
scene: study
title:
  he: הרחבת אוצר מילים 1
  en: Word builder 1
story: עוד מילים חשובות בשימוש יומיומי, מקובצות בשיעורים קצרים. כל מילה מופיעה במשפט, ואחר כך מתרגלים אותה.
canDo:
- להבין ולהשתמש במילים נפוצות נוספות
- לזהות את המילים במשפטים אמיתיים
vocabulary:
- id: practice
  text: practice
  translation: תרגול, אימון
  pos: noun
  example:
    text: Practice makes perfect.
    translation: תרגול עושה מושלם.
- id: voice
  text: voice
  translation: קול
  pos: noun
  example:
    text: She has a beautiful voice.
    translation: יש לה קול יפה.
- id: safe
  text: safe
  translation: בטוח
  pos: adjective
  example:
    text: Is it safe to swim here?
    translation: האם בטוח לשחות כאן?
- id: deep
  text: deep
  translation: עמוק
  pos: adjective
  example:
    text: The lake is very deep.
    translation: האגם עמוק מאוד.
- id: popular
  text: popular
  translation: פופולרי
  pos: adjective
  example:
    text: This is a popular restaurant.
    translation: זו מסעדה פופולרית.
- id: response
  text: response
  translation: תגובה, תשובה
  pos: noun
  example:
    text: I am waiting for your response.
    translation: אני מחכה לתגובה שלך.
- id: respect
  text: respect
  translation: כבוד; לכבד
  pos: noun
  example:
    text: We show respect to our teachers.
    translation: אנחנו מראים כבוד למורים שלנו.
- id: pain
  text: pain
  translation: כאב
  pos: noun
  example:
    text: I have a pain in my back.
    translation: יש לי כאב בגב.
- id: river
  text: river
  translation: נהר
  pos: noun
  example:
    text: The river is wide and slow.
    translation: הנהר רחב ואיטי.
- id: speed
  text: speed
  translation: מהירות
  pos: noun
  example:
    text: The speed limit is fifty.
    translation: מגבלת המהירות היא חמישים.
- id: standard
  text: standard
  translation: סטנדרט, רמה
  pos: noun
  example:
    text: The hotel has a high standard.
    translation: למלון יש רמה גבוהה.
- id: peace
  text: peace
  translation: שלום, שקט
  pos: noun
  example:
    text: I need some peace and quiet.
    translation: אני צריך קצת שקט ושלווה.
- id: pressure
  text: pressure
  translation: לחץ
  pos: noun
  example:
    text: She works well under pressure.
    translation: היא עובדת טוב בלחץ.
- id: focus
  text: focus
  translation: להתמקד; מיקוד
  pos: verb
  example:
    text: It is hard to focus when it is noisy.
    translation: קשה להתרכז כשיש רעש.
- id: particular
  text: particular
  translation: מסוים, מיוחד
  pos: adjective
  example:
    text: Is there a particular reason?
    translation: האם יש סיבה מסוימת?
- id: previous
  text: previous
  translation: קודם, קודם לכן
  pos: adjective
  example:
    text: My previous job was in a school.
    translation: העבודה הקודמת שלי הייתה בבית ספר.
- id: consider
  text: consider
  translation: לשקול, להתחשב
  pos: verb
  example:
    text: Please consider my offer.
    translation: אנא שקלו את ההצעה שלי.
- id: immediately
  text: immediately
  translation: מיד
  pos: adverb
  example:
    text: Call me immediately.
    translation: התקשר אליי מיד.
- id: sell
  text: sell
  translation: למכור
  pos: verb
  example:
    text: They sell fresh bread every morning.
    translation: הם מוכרים לחם טרי כל בוקר.
- id: ability
  text: ability
  translation: יכולת
  pos: noun
  example:
    text: He has the ability to learn fast.
    translation: יש לו יכולת ללמוד מהר.
- id: collection
  text: collection
  translation: אוסף
  pos: noun
  example:
    text: She has a large collection of stamps.
    translation: יש לה אוסף גדול של בולים.
- id: opinion
  text: opinion
  translation: דעה
  pos: noun
  example:
    text: In my opinion, it is a good idea.
    translation: לדעתי, זה רעיון טוב.
- id: physical
  text: physical
  translation: גופני, פיזי
  pos: adjective
  example:
    text: Physical exercise is good for you.
    translation: פעילות גופנית טובה לך.
- id: active
  text: active
  translation: פעיל
  pos: adjective
  example:
    text: My grandmother is still very active.
    translation: סבתא שלי עדיין פעילה מאוד.
- id: effort
  text: effort
  translation: מאמץ
  pos: noun
  example:
    text: It took a lot of effort.
    translation: זה דרש הרבה מאמץ.
- id: wear
  text: wear
  translation: ללבוש
  pos: verb
  example:
    text: I usually wear a jacket in winter.
    translation: בדרך כלל אני לובש מעיל בחורף.
- id: details
  text: details
  translation: פרטים
  pos: noun
  example:
    text: Please send me the details.
    translation: אנא שלחו לי את הפרטים.
- id: direct
  text: direct
  translation: ישיר
  pos: adjective
  example:
    text: There is a direct train to the city.
    translation: יש רכבת ישירה לעיר.
- id: rich
  text: rich
  translation: עשיר
  pos: adjective
  example:
    text: The soup is rich and tasty.
    translation: המרק עשיר וטעים.
- id: skin
  text: skin
  translation: עור
  pos: noun
  example:
    text: Use cream to protect your skin.
    translation: השתמשו בקרם כדי להגן על העור.
- id: sweet
  text: sweet
  translation: מתוק
  pos: adjective
  example:
    text: The cake is too sweet for me.
    translation: העוגה מתוקה מדי בשבילי.
- id: glad
  text: glad
  translation: שמח
  pos: adjective
  example:
    text: I am glad you came.
    translation: אני שמח שבאת.
- id: overall
  text: overall
  translation: בסך הכול
  pos: adverb
  example:
    text: Overall, it was a great week.
    translation: בסך הכול זה היה שבוע נהדר.
- id: carry
  text: carry
  translation: לשאת, לסחוב
  pos: verb
  example:
    text: Can you carry this bag for me?
    translation: אפשר לשאת בשבילי את התיק הזה?
- id: reality
  text: reality
  translation: מציאות
  pos: noun
  example:
    text: The dream became a reality.
    translation: החלום הפך למציאות.
- id: spot
  text: spot
  translation: מקום, כתם
  pos: noun
  example:
    text: This is a lovely spot for a picnic.
    translation: זה מקום יפהפה לפיקניק.
- id: comment
  text: comment
  translation: הערה; להגיב
  pos: noun
  example:
    text: Thank you for your comment.
    translation: תודה על ההערה שלך.
- id: equipment
  text: equipment
  translation: ציוד
  pos: noun
  example:
    text: We bought new equipment for the office.
    translation: קנינו ציוד חדש למשרד.
- id: purpose
  text: purpose
  translation: מטרה
  pos: noun
  example:
    text: What is the purpose of this meeting?
    translation: מה מטרת הפגישה הזו?
