- id: u45-l5
  kind: reading
  title:
    he: פינת השפה
    en: Language corner
  exercises:
  - id: u45-l5-01
    type: reading
    kind: מדור שפה
    title: Why idioms matter
    text: 'Learning vocabulary is one thing; sounding natural is another. Native speakers use idioms constantly, often without noticing. If someone says, "We''re back to square one," they mean that all progress has been lost, and nobody is talking about a board game.


      Idioms are tricky because their meaning cannot be guessed from the words. Nobody literally bites a bullet. Nevertheless, once you get the hang of a few dozen common expressions, conversations become much easier to follow.


      Understatement is another feature of English humour. When a British person says, "It wasn''t the best day," they may well mean it was a disaster. Listening for tone is therefore as important as listening for words.


      Our advice? Don''t cut corners. Learn idioms in context, put off the temptation to translate them, and try to come up with your own examples.

      '
    translation: 'ללמוד אוצר מילים זה דבר אחד; להישמע טבעי זה דבר אחר. דוברי שפת אם משתמשים בביטויים כל הזמן, לעיתים בלי לשים לב. כשמישהו אומר "We''re back to square one", הוא מתכוון שכל ההתקדמות אבדה, ואף אחד לא מדבר על משחק לוח.


      ביטויים הם מורכבים כי אי אפשר לנחש את משמעותם מהמילים. איש אינו נושך כדור באמת. עם זאת, ברגע שקולטים כמה עשרות ביטויים נפוצים, קל הרבה יותר לעקוב אחרי שיחות.


      המעטה היא עוד מאפיין של ההומור האנגלי. כשבריטי אומר "It wasn''t the best day", הוא עשוי להתכוון שזה היה אסון. האזנה לטון חשובה לא פחות מהאזנה למילים.


      העצה שלנו? אל תעשו קיצורי דרך. למדו ביטויים בהקשר, דחו את הפיתוי לתרגם אותם, ונסו להעלות דוגמאות משלכם.

      '
