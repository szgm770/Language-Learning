grammar:
- id: idioms
  title:
    he: ביטויים ופעלים צירופיים
    en: Idioms and phrasal verbs
  explanation: '**ביטויים (idioms)** אי אפשר לתרגם מילה במילה. צריך ללמוד אותם כמו מילה אחת: *break the ice* אינו "לשבור קרח" אלא להפיג מבוכה בתחילת שיחה.


    **פעלים צירופיים (phrasal verbs)** הם פועל + מילית (put off, come up with):

    - "**נפרדים:** אפשר לשים מושא באמצע: *put the meeting **off*** (וגם *put off the meeting*). אם המושא הוא כינוי, חייבים באמצע: *put **it** off*."

    - "**בלתי נפרדים:** המושא תמיד אחרי: *come up with **an idea***, *look after **the kids***."


    **המעטה (understatement)** נפוצה באנגלית: *It''s not bad* = מצוין, *It was a bit of a surprise* = הפתעה גדולה. חשוב להבין את הטון, לא רק את המילים.'
  examples:
  - text: We need to put the meeting off until Sunday.
    translation: אנחנו צריכים לדחות את הפגישה ליום ראשון.
  - text: She came up with a brilliant idea.
    translation: היא העלתה רעיון מצוין.
  - text: Losing that deal was a blessing in disguise.
    translation: אובדן העסקה ההיא היה ברכה בתחפושת.
