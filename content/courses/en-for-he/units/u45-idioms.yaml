      translation: נועה, בהחלט. היא הלכה לאיבוד פעם בבניין של עצמה.
    - speaker: noa
      text: That was once in a blue moon! Anyway, losing the keys last week was a blessing in disguise.
      translation: זה קרה פעם בכמה שנים! בכל אופן, אובדן המפתחות בשבוע שעבר היה ברכה בתחפושת.
    - speaker: ben
      text: How so?
      translation: איך?
