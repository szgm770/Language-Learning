      text: 'My strategy: we ask in the village shop first.'
      translation: 'האסטרטגיה שלי: קודם שואלים בחנות של הכפר.'
    - speaker: saba
      text: I appreciate it, Ben. But maybe the family doesn't exist anymore.
      translation: אני מעריך את זה, בן. אבל אולי המשפחה כבר לא קיימת.
    - speaker: noa
      text: They're somewhere, Grandpa. I can feel it.
      translation: הם איפשהו, סבא. אני מרגישה את זה.
    - speaker: saba
      text: I've waited forever. One more hour is fine.
      translation: חיכיתי נצח. עוד שעה זה בסדר.
