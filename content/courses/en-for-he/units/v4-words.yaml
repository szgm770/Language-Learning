id: v4-words
cefr: B2
scene: nature
title:
  he: החווה בקנט
  en: The farm in Kent
story: נועה, בן וסבא שמעון נוסעים לקנט ומוצאים את משפחת לוי. הנכדה של מר לוי מגלה מה היה בספר שסבא שמר, ושני הסבים לומדים יחד, כמו פעם.
canDo:
- לדבר על טיול, דרכים ותוכניות
- לספר על פגישה מרגשת
- לדבר על לימוד, הוראה וחובות
vocabulary:
- id: appreciate
  text: appreciate
  translation: להעריך
  pos: verb
  example:
    text: I really appreciate your help.
    translation: אני באמת מעריך את העזרה שלך.
- id: dry
  text: dry
  translation: יבש; לייבש
  pos: adjective
  example:
    text: The path was dry after a week without rain.
    translation: השביל היה יבש אחרי שבוע בלי גשם.
- id: edge
  text: edge
  translation: קצה
  pos: noun
  example:
    text: The farm is at the edge of the village.
    translation: החווה בקצה הכפר.
- id: forever
  text: forever
  translation: לנצח
  pos: adverb
  example:
    text: Grandpa kept the book as if forever.
    translation: סבא שמר את הספר כאילו לנצח.
- id: injury
  text: injury
  translation: פציעה
  pos: noun
  example:
    text: Grandpa has an old knee injury.
    translation: לסבא יש פציעה ישנה בברך.
- id: iron
  text: iron
  translation: ברזל; לגהץ
  pos: noun
  example:
    text: The farm has a heavy iron gate.
    translation: לחווה יש שער ברזל כבד.
- id: magazine
  text: magazine
  translation: מגזין
  pos: noun
  example:
    text: Noa read a travel magazine on the train.
    translation: נועה קראה מגזין טיולים ברכבת.
- id: somewhere
  text: somewhere
  translation: איפשהו
  pos: adverb
  example:
    text: The family must be somewhere near here.
    translation: המשפחה צריכה להיות איפשהו כאן בסביבה.
- id: strategy
  text: strategy
  translation: אסטרטגיה
  pos: noun
  example:
    text: Ben's strategy worked.
    translation: האסטרטגיה של בן עבדה.
- id: exist
  text: exist
  translation: להתקיים, להיות קיים
  pos: verb
  example:
    text: Does the old bakery still exist?
    translation: המאפייה הישנה עדיין קיימת?
- id: mountain
  text: mountain
  translation: הר
  pos: noun
  example:
    text: Grandpa felt like he had climbed a mountain.
    translation: סבא הרגיש כאילו טיפס על הר.
- id: taste
  text: taste
  translation: טעם; לטעום
  pos: noun
  example:
    text: The cake had the taste of Mr. Levy's bakery.
    translation: לעוגה היה הטעם של המאפייה של מר לוי.
- id: victory
  text: victory
  translation: ניצחון
  pos: noun
  example:
    text: Finding the family was a small victory.
    translation: למצוא את המשפחה היה ניצחון קטן.
- id: assistant
  text: assistant
  translation: עוזר, עוזרת
  pos: noun
  example:
    text: Miriam's assistant made tea for everyone.
    translation: העוזרת של מרים הכינה תה לכולם.
- id: clothes
  text: clothes
  translation: בגדים
  pos: noun
  example:
    text: Grandpa wore his best clothes.
    translation: סבא לבש את הבגדים הכי טובים שלו.
- id: electric
  text: electric
  translation: חשמלי
  pos: adjective
  example:
    text: The farm has an old electric oven.
    translation: בחווה יש תנור חשמלי ישן.
- id: emergency
  text: emergency
  translation: מצב חירום
  pos: noun
  example:
    text: Keep this number for an emergency.
    translation: שמרו את המספר הזה למקרה חירום.
- id: entirely
  text: entirely
  translation: לגמרי
  pos: adverb
  example:
    text: The meeting was entirely unexpected.
    translation: הפגישה הייתה בלתי צפויה לחלוטין.
- id: festival
  text: festival
  translation: פסטיבל, חג
  pos: noun
  example:
    text: The family meets here for the festival of Sukkot.
    translation: המשפחה נפגשת כאן לחג הסוכות.
- id: massive
  text: massive
  translation: עצום
  pos: adjective
  example:
    text: There is a massive oak tree near the house.
    translation: יש עץ אלון ענק ליד הבית.
- id: plenty
  text: plenty
  translation: הרבה, מספיק
  pos: noun
  example:
    text: There is plenty of cake for everyone.
    translation: יש הרבה עוגה לכולם.
- id: proper
  text: proper
  translation: ראוי, מתאים
  pos: adjective
  example:
    text: They sat down for a proper lesson.
    translation: הם התיישבו לשיעור כמו שצריך.
- id: session
  text: session
  translation: מפגש, סבב
  pos: noun
  example:
    text: The learning session lasted two hours.
    translation: השיעור נמשך שעתיים.
- id: teaching
  text: teaching
  translation: הוראה
  pos: noun
  example:
    text: Mr. Levy loved teaching young people.
    translation: מר לוי אהב ללמד צעירים.
- id: transfer
  text: transfer
  translation: העברה; להעביר
  pos: noun
  example:
    text: Miriam wants to transfer the book to Grandpa.
    translation: מרים רוצה להעביר את הספר לסבא.
- id: zone
  text: zone
  translation: אזור
  pos: noun
  example:
    text: The farm is outside the London travel zone.
    translation: החווה נמצאת מחוץ לאזור הנסיעה של לונדון.
- id: advanced
  text: advanced
  translation: מתקדם
  pos: adjective
  example:
    text: Grandpa is learning an advanced text.
    translation: סבא לומד טקסט מתקדם.
- id: boat
  text: boat
  translation: סירה
  pos: noun
  example:
    text: Mr. Levy came to England by boat.
    translation: מר לוי הגיע לאנגליה בסירה.
- id: capacity
  text: capacity
  translation: קיבולת, יכולת
  pos: noun
  example:
    text: The small room has a capacity of ten people.
    translation: בחדר הקטן יש מקום לעשרה אנשים.
- id: duty
  text: duty
  translation: חובה, תפקיד
  pos: noun
  example:
    text: It is my duty to return the book.
    translation: זו חובתי להחזיר את הספר.
- id: mix
  text: mix
  translation: לערבב; תערובת
  pos: verb
  example:
    text: The day was a mix of tears and laughter.
    translation: היום היה שילוב של דמעות וצחוק.
- id: purchase
  text: purchase
  translation: רכישה; לרכוש
  pos: noun
  example:
    text: The new suit was a good purchase.
    translation: החליפה החדשה הייתה קנייה טובה.
- id: remove
  text: remove
  translation: להסיר
  pos: verb
  example:
    text: Please remove your bags from the seat.
    translation: בבקשה הורידו את התיקים מהמושב.
- id: steel
  text: steel
  translation: פלדה
  pos: noun
  example:
    text: The old bridge is made of steel.
    translation: הגשר הישן עשוי מפלדה.
- id: suit
  text: suit
  translation: חליפה; להתאים
  pos: noun
  example:
    text: Grandpa looked smart in his suit.
    translation: סבא נראה אלגנטי בחליפה שלו.
- id: mad
  text: mad
  translation: כועס, מטורף
  pos: adjective
  example:
    text: Noa thought her grandfather was mad to fly alone.
    translation: נועה חשבה שסבא שלה משוגע לטוס לבד.
