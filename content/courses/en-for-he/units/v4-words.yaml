id: v4-words
cefr: B2
scene: study
title:
  he: הרחבת אוצר מילים 4
  en: Word builder 4
story: עוד מילים חשובות בשימוש יומיומי, מקובצות בשיעורים קצרים. כל מילה מופיעה במשפט, ואחר כך מתרגלים אותה.
canDo:
- להבין ולהשתמש במילים נפוצות נוספות
- לזהות את המילים במשפטים אמיתיים
vocabulary:
- id: appreciate
  text: appreciate
  translation: להעריך
  pos: verb
  example:
    text: I really appreciate your help.
    translation: אני באמת מעריך את העזרה שלך.
- id: dry
  text: dry
  translation: יבש; לייבש
  pos: adjective
  example:
    text: The clothes are dry now.
    translation: הבגדים יבשים עכשיו.
- id: edge
  text: edge
  translation: קצה
  pos: noun
  example:
    text: Do not stand at the edge of the road.
    translation: אל תעמדו בקצה הכביש.
- id: forever
  text: forever
  translation: לנצח
  pos: adverb
  example:
    text: I will remember this day forever.
    translation: אזכור את היום הזה לנצח.
- id: injury
  text: injury
  translation: פציעה
  pos: noun
  example:
    text: He had a knee injury last year.
    translation: הייתה לו פציעה בברך בשנה שעברה.
- id: iron
  text: iron
  translation: ברזל; לגהץ
  pos: noun
  example:
    text: The gate is made of iron.
    translation: השער עשוי ברזל.
- id: magazine
  text: magazine
  translation: מגזין
  pos: noun
  example:
    text: I read a magazine on the train.
    translation: קראתי מגזין ברכבת.
- id: somewhere
  text: somewhere
  translation: איפשהו
  pos: adverb
  example:
    text: I left my keys somewhere in the house.
    translation: השארתי את המפתחות איפשהו בבית.
- id: strategy
  text: strategy
  translation: אסטרטגיה
  pos: noun
  example:
    text: We need a new strategy.
    translation: אנחנו צריכים אסטרטגיה חדשה.
- id: exist
  text: exist
  translation: להתקיים, להיות קיים
  pos: verb
  example:
    text: Dinosaurs no longer exist.
    translation: דינוזאורים כבר לא קיימים.
- id: mountain
  text: mountain
  translation: הר
  pos: noun
  example:
    text: We hiked up the mountain.
    translation: טיילנו במעלה ההר.
- id: taste
  text: taste
  translation: טעם; לטעום
  pos: noun
  example:
    text: I like the taste of lemon.
    translation: אני אוהב את הטעם של לימון.
- id: victory
  text: victory
  translation: ניצחון
  pos: noun
  example:
    text: The team celebrated its victory.
    translation: הקבוצה חגגה את הניצחון שלה.
- id: assistant
  text: assistant
  translation: עוזר, עוזרת
  pos: noun
  example:
    text: She is my personal assistant.
    translation: היא העוזרת האישית שלי.
- id: clothes
  text: clothes
  translation: בגדים
  pos: noun
  example:
    text: I need to buy new clothes.
    translation: אני צריך לקנות בגדים חדשים.
- id: electric
  text: electric
  translation: חשמלי
  pos: adjective
  example:
    text: He drives an electric car.
    translation: הוא נוהג במכונית חשמלית.
- id: emergency
  text: emergency
  translation: מצב חירום
  pos: noun
  example:
    text: Call this number in an emergency.
    translation: התקשרו למספר הזה במקרה חירום.
- id: entirely
  text: entirely
  translation: לגמרי
  pos: adverb
  example:
    text: I entirely agree with you.
    translation: אני מסכים איתך לגמרי.
- id: festival
  text: festival
  translation: פסטיבל, חג
  pos: noun
  example:
    text: The town has a music festival every summer.
    translation: בעיר יש פסטיבל מוזיקה בכל קיץ.
- id: massive
  text: massive
  translation: עצום
  pos: adjective
  example:
    text: They built a massive bridge.
    translation: הם בנו גשר עצום.
- id: plenty
  text: plenty
  translation: הרבה, מספיק
  pos: noun
  example:
    text: There is plenty of time.
    translation: יש מספיק זמן.
- id: proper
  text: proper
  translation: ראוי, מתאים
  pos: adjective
  example:
    text: You need proper shoes for hiking.
    translation: צריך נעליים מתאימות לטיולים.
- id: session
  text: session
  translation: מפגש, סבב
  pos: noun
  example:
    text: The training session starts at nine.
    translation: מפגש האימון מתחיל בתשע.
- id: teaching
  text: teaching
  translation: הוראה
  pos: noun
  example:
    text: She loves teaching children.
    translation: היא אוהבת ללמד ילדים.
- id: transfer
  text: transfer
  translation: העברה; להעביר
  pos: noun
  example:
    text: I made a bank transfer yesterday.
    translation: ביצעתי העברה בנקאית אתמול.
- id: zone
  text: zone
  translation: אזור
  pos: noun
  example:
    text: This is a quiet zone.
    translation: זה אזור שקט.
- id: advanced
  text: advanced
  translation: מתקדם
  pos: adjective
  example:
    text: He is in the advanced class.
    translation: הוא בכיתה המתקדמת.
- id: boat
  text: boat
  translation: סירה
  pos: noun
  example:
    text: We crossed the lake by boat.
    translation: חצינו את האגם בסירה.
- id: capacity
  text: capacity
  translation: קיבולת, יכולת
  pos: noun
  example:
    text: The hall has a capacity of two hundred people.
    translation: באולם יש מקום לכמאתיים איש.
- id: duty
  text: duty
  translation: חובה, תפקיד
  pos: noun
  example:
    text: It is my duty to help.
    translation: זו חובתי לעזור.
- id: mix
  text: mix
  translation: לערבב; תערובת
  pos: verb
  example:
    text: Mix the flour and the eggs.
    translation: ערבבו את הקמח והביצים.
- id: purchase
  text: purchase
  translation: רכישה; לרכוש
  pos: noun
  example:
    text: Keep the receipt of your purchase.
    translation: שמרו את הקבלה של הרכישה.
- id: remove
  text: remove
  translation: להסיר
  pos: verb
  example:
    text: Please remove your shoes.
    translation: אנא הסירו את הנעליים.
- id: steel
  text: steel
  translation: פלדה
  pos: noun
  example:
    text: The table is made of steel.
    translation: השולחן עשוי פלדה.
- id: suit
  text: suit
  translation: חליפה; להתאים
  pos: noun
  example:
    text: He wore a dark suit to the interview.
    translation: הוא לבש חליפה כהה לראיון.
- id: mad
  text: mad
  translation: כועס, מטורף
  pos: adjective
  example:
    text: She was mad about the delay.
    translation: היא כעסה על העיכוב.
