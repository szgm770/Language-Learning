  - id: v4-l4-d1
    type: dialogue
    scene: תחנת הרכבת. ערב.
    lines:
    - speaker: saba
      text: I bought a new suit for this trip. Was it worth the purchase?
      translation: קניתי חליפה חדשה לטיול הזה. היה שווה לקנות?
    - speaker: noa
      text: Grandpa, you're mad! It was the best day of the year.
      translation: סבא, אתה משוגע! זה היה היום הכי טוב בשנה.
    - speaker: saba
      text: A mix of happy and sad. Like every good story.
      translation: שילוב של שמח ועצוב. כמו כל סיפור טוב.
    - speaker: noa
      text: And the book?
      translation: והספר?
    - speaker: saba
      text: It stays with Miriam. And Miriam and I will learn on the phone every week.
      translation: הוא נשאר אצל מרים. ומרים ואני נלמד בטלפון כל שבוע.
