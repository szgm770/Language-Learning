- id: v4-l3
  kind: new
  title:
    he: לומדים יחד
    en: Learning together
  exercises:
  - id: v4-l3-d1
    type: dialogue
    scene: 'בסלון של החווה. מרים פותחת את הספר: גמרא קטנה עם הערות בכתב יד.'
    lines:
    - speaker: miriam
      text: My grandfather wrote notes in this Gemara. He loved teaching.
      translation: סבא שלי כתב הערות בגמרא הזאת. הוא אהב ללמד.
    - speaker: saba
      text: Every evening after work we had a session. He was my teacher.
      translation: כל ערב אחרי העבודה היה לנו שיעור. הוא היה המורה שלי.
    - speaker: miriam
      text: Then it's my duty to transfer it to you. It belongs with someone who learns.
      translation: אז החובה שלי להעביר אותה אליך. היא שייכת למי שלומד.
    - speaker: saba
      text: No, no. Let's learn one page together, a proper session, like then.
      translation: לא, לא. בואי נלמד דף אחד יחד, שיעור כמו שצריך, כמו אז.
