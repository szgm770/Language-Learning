  exercises:
  - id: v4-l2-d1
    type: dialogue
    scene: 'בחווה. אישה מבוגרת פותחת את הדלת: מרים לוי, הנכדה של מר לוי.'
    lines:
    - speaker: saba
      text: Mrs. Levy? I worked for your grandfather. I have his book.
      translation: גברת לוי? עבדתי אצל סבא שלך. יש לי את הספר שלו.
    - speaker: miriam
      text: I'm his granddaughter, Miriam. This is entirely unexpected! Please come in.
      translation: אני הנכדה שלו, מרים. זה לגמרי לא צפוי! בבקשה, היכנסו.
    - speaker: noa
      text: Wait, Miriam? From our London office?
      translation: רגע, מרים? מהמשרד שלנו בלונדון?
    - speaker: miriam
      text: The same Miriam. I come here every Sunday. What a massive surprise!
      translation: אותה מרים. אני באה לכאן כל יום ראשון. איזו הפתעה ענקית!
