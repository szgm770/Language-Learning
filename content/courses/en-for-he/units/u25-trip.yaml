        type: translate
        direction: to_target
        prompt: "אני נוסע לחו\"ל בנסיעת עבודה."
        answers: ["I'm going abroad on business.", "I am going abroad on business.", "I'm travelling abroad on business.", "I'm traveling abroad on business."]
        lexemes: [abroad, on-business]
      - id: u25-l2-14
        type: speak_repeat
        text: "Departure is at half past ten, and Tamar is picking us up."
        translation: "ההמראה בעשר וחצי, ותמר אוספת אותנו."
        lexemes: [departure, pick-up]

  # ------------------------------------------------------------------ 3
