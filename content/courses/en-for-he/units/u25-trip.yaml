  - { id: "postpone", text: "postpone", translation: "לדחות (למועד מאוחר)", pos: "verb", pronunciation: "פּוֹסְטְפּוֹן" }
  - { id: "check-in", text: "check in", translation: "לעשות צ'ק־אין", pos: "verb", pronunciation: "צ'ֶק אִין" }
  - { id: "check-out", text: "check out", translation: "לעשות צ'ק־אאוט", pos: "verb", pronunciation: "צ'ֶק אַאוּט" }
  - { id: "pick-up", text: "pick up", translation: "לאסוף (מישהו)", pos: "verb", pronunciation: "פִּיק אַפּ", example: { text: "I'll pick you up at the airport.", translation: "אני אאסוף אותך משדה התעופה." } }
  - { id: "sightseeing", text: "sightseeing", translation: "סיור באתרים", pos: "noun", pronunciation: "סַייטְסִיאִינְג" }
  - { id: "guided-tour", text: "guided tour", translation: "סיור מודרך", pos: "noun", pronunciation: "גַייִדִיד טוּר" }
  - { id: "abroad", text: "abroad", translation: "בחו\"ל", pos: "adverb", pronunciation: "אַבְּרוֹד" }
  - { id: "on-business", text: "on business", translation: "בנסיעת עבודה", pos: "phrase", pronunciation: "אוֹן בִּיזְנֶס" }
