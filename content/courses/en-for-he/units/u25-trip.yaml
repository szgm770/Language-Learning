  - { id: "departure", text: "departure", translation: "המראה, יציאה", pos: "noun", pronunciation: "דִיפַּארְצ'ֶר" }
  - { id: "arrival", text: "arrival", translation: "נחיתה, הגעה", pos: "noun", pronunciation: "אָרַייבֶל" }
