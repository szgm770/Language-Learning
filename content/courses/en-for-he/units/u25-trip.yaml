grammar:
  - id: future-forms
    title: { he: "שלוש דרכים לעתיד", en: "Will, going to and present continuous" }
    explanation: |
      בעברית יש עתיד אחד: "אטוס", "אפגוש". באנגלית בוחרים לפי סוג התוכנית:

      - **הווה מתמשך**: סידור **קבוע** עם תאריך, שעה, כרטיס או פגישה ביומן.
        **I'm flying to Tel Aviv on Monday.** (יש לי כרטיס) **We're meeting the client at ten.**
      - **going to**: כוונה, תוכנית שהחלטתי עליה, עוד בלי פרטים סגורים.
        **I'm going to visit Jerusalem one day.**
      - **will**: החלטה ברגע הדיבור, הצעה, הבטחה או ניחוש.
        **The flight is late? I'll call the hotel.** / **I think you'll love Madrid.**

      טיפ: אם אפשר לכתוב את זה ביומן, כנראה שזה הווה מתמשך.
    examples:
      - { text: "Tamar is picking us up at the airport at eight.", translation: "תמר אוספת אותנו משדה התעופה בשמונה." }
      - { text: "We're going to do some sightseeing if we have time.", translation: "אנחנו מתכוונים לעשות קצת סיורים אם יהיה לנו זמן." }
      - { text: "It's fully booked? OK, I'll try another hotel.", translation: "מלא? בסדר, אנסה מלון אחר." }

lessons:
  # ------------------------------------------------------------------ 1
  - id: u25-l1
    kind: new
    title: { he: "מזמינים מלון", en: "Booking a hotel" }
    exercises:
      - id: u25-l1-01
        type: dialogue
        scene: "בן מתקשר למלון בתל אביב."
        lines:
          - { speaker: "ben", text: "Hello, I'd like to book two rooms for five nights, from the 3rd of June.", translation: "שלום, הייתי רוצה להזמין שני חדרים לחמישה לילות, מה־3 ביוני." }
          - { speaker: "cohen", text: "Let me check… I'm afraid we're fully booked on the 3rd.", translation: "רגע אבדוק… אני חושש שאנחנו מלאים ב־3." }
          - { speaker: "ben", text: "Oh. Do you have anything available from the 4th?", translation: "אה. יש לכם משהו פנוי מה־4?" }
          - { speaker: "cohen", text: "Yes, two rooms are available from the 4th. Breakfast is included.", translation: "כן, שני חדרים פנויים מה־4. ארוחת בוקר כלולה." }
          - { speaker: "ben", text: "Great. Can you confirm the booking by email?", translation: "מעולה. אפשר לאשר את ההזמנה במייל?" }
          - { speaker: "cohen", text: "Of course. You can check in from two o'clock.", translation: "בוודאי. אפשר לעשות צ'ק־אין משתיים." }
      - { id: "u25-l1-02", type: "learn", lexeme: "book" }
      - { id: "u25-l1-03", type: "learn", lexeme: "booking" }
      - { id: "u25-l1-04", type: "learn", lexeme: "fully-booked" }
      - { id: "u25-l1-05", type: "learn", lexeme: "available" }
      - { id: "u25-l1-06", type: "learn", lexeme: "confirm" }
      - { id: "u25-l1-07", type: "learn", lexeme: "check-in" }
      - { id: "u25-l1-08", type: "learn", lexeme: "check-out" }
      - { id: "u25-l1-09", type: "learn", lexeme: "accommodation" }
      - id: u25-l1-10
