  - id: u25-l5
    kind: reading
    title: { he: "אישור הזמנה", en: "Booking confirmation" }
    exercises:
      - { id: "u25-l5-01", type: "learn", lexeme: "sightseeing" }
      - { id: "u25-l5-02", type: "learn", lexeme: "guided-tour" }
      - id: u25-l5-03
        type: reading
        kind: "מייל אישור מהמלון"
        title: "Your booking is confirmed"
        text: |
          Dear Mr. Taylor,

          Thank you for booking with Hotel Sol, Madrid. We are happy to confirm your reservation:

          Two double rooms, 15–17 June (2 nights). Check-in from 3 p.m., check-out by 11 a.m. Breakfast is included.

          Arriving early? You are welcome to leave your luggage at reception and start sightseeing. Our free guided tour of the old city leaves from the hotel every day at 10 a.m.

          You can cancel your booking free of charge until 10 June. After that date, we will charge the first night.

          We look forward to welcoming you!
        translation: |
          מר טיילור היקר,

          תודה שהזמנת במלון סול, מדריד. אנו שמחים לאשר את ההזמנה שלך:

          שני חדרים זוגיים, 15–17 ביוני (2 לילות). צ'ק־אין משלוש אחר הצהריים, צ'ק־אאוט עד אחת־עשרה בבוקר. ארוחת בוקר כלולה.

          מגיעים מוקדם? אתם מוזמנים להשאיר את המטען בקבלה ולצאת לסיור. הסיור המודרך החינמי שלנו בעיר העתיקה יוצא מהמלון כל יום בעשר בבוקר.

          אפשר לבטל את ההזמנה ללא תשלום עד 10 ביוני. אחרי תאריך זה, נחייב את הלילה הראשון.

          מצפים לארח אתכם!
      - id: u25-l5-04
        type: multiple_choice
        prompt: "כמה לילות ההזמנה?"
        options: [שניים, שלושה, אחד]
        correct: 0
        lexemes: [booking, night]
      - id: u25-l5-05
        type: multiple_choice
        prompt: "מה אפשר לעשות כשמגיעים מוקדם?"
        options: [להשאיר מטען בקבלה, לעשות צ'ק־אין מוקדם, לאכול ארוחת בוקר]
        correct: 0
        lexemes: [luggage]
      - id: u25-l5-06
        type: multiple_choice
        prompt: "מתי יוצא הסיור המודרך?"
        options: [כל יום בעשר בבוקר, רק בסוף השבוע, בשלוש אחר הצהריים]
        correct: 0
        lexemes: [guided-tour]
      - id: u25-l5-07
        type: multiple_choice
        prompt: "מה קורה אם מבטלים אחרי 10 ביוני?"
        options: [משלמים על הלילה הראשון, משלמים על כל ההזמנה, לא משלמים כלום]
        correct: 0
