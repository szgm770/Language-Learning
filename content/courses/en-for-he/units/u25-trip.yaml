          - { speaker: "noa", text: "Arrival in Tel Aviv is at 17:15, and Tamar is picking us up.", translation: "הנחיתה בתל אביב ב־17:15, ותמר אוספת אותנו." }
          - { speaker: "david", text: "Is this your first time in Israel on business, Ben?", translation: "זו הפעם הראשונה שלך בישראל בנסיעת עבודה, בן?" }
          - { speaker: "ben", text: "Yes! I've been abroad a lot, but never to Israel.", translation: "כן! הייתי בחו\"ל הרבה, אבל אף פעם לא בישראל." }
          - { speaker: "noa", text: "Bring light luggage. It's going to be hot!", translation: "תביאו מטען קל. הולך להיות חם!" }
