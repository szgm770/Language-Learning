        translation: "אני טס ביום ראשון, ואני פוגש את הלקוח ביום שני."
        lexemes: [continuous-future, client]

  # ------------------------------------------------------------------ 4
  - id: u25-l4
    kind: listening
    title: { he: "הטיסה בוטלה", en: "The flight is cancelled" }
    exercises:
      - { id: "u25-l4-01", type: "learn", lexeme: "cancel" }
      - { id: "u25-l4-02", type: "learn", lexeme: "postpone" }
      - id: u25-l4-03
        type: dialogue
        scene: "שדה התעופה בתל אביב, בדרך לחתונה במדריד. ההודעה על הלוח לא טובה."
        lines:
          - { speaker: "ben", text: "Noa, look at the board. Our flight to Madrid is cancelled!", translation: "נועה, תסתכלי על הלוח. הטיסה שלנו למדריד בוטלה!" }
          - { speaker: "noa", text: "What? The wedding is tomorrow evening!", translation: "מה? החתונה מחר בערב!" }
          - { speaker: "cohen", text: "I'm sorry. We can put you on the 7 a.m. flight tomorrow.", translation: "אני מצטער. אנחנו יכולים להעביר אתכם לטיסה של 7 בבוקר מחר." }
          - { speaker: "noa", text: "What time does it arrive in Madrid?", translation: "באיזו שעה היא נוחתת במדריד?" }
          - { speaker: "cohen", text: "At 11:30, local time.", translation: "ב־11:30, שעון מקומי." }
