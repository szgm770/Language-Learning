        lexemes: [arrival]
      - id: u25-l2-12
        type: dialogue_gap
        lines:
          - { speaker: "tamar", text: "What time does your flight land?", translation: "באיזו שעה הטיסה שלכם נוחתת?" }
          - { speaker: "noa", text: "At quarter past five. Can you pick us up?", translation: "ברבע אחרי חמש. את יכולה לאסוף אותנו?" }
