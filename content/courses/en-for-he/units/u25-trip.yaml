      - { id: "u25-l5-02", type: "learn", lexeme: "guided-tour" }
      - id: u25-l5-03
        type: reading
        kind: "מייל אישור מהמלון"
        title: "Your booking is confirmed"
        text: |
          Dear Mr. Taylor,

          Thank you for booking with Hotel Sol, Madrid. We are happy to confirm your reservation:

          Two double rooms, 15–17 June (2 nights). Check-in from 3 p.m., check-out by 11 a.m. Breakfast is included.

