    exercises:
      - { id: "u25-l2-01", type: "learn", lexeme: "itinerary" }
      - { id: "u25-l2-02", type: "learn", lexeme: "departure" }
      - { id: "u25-l2-03", type: "learn", lexeme: "arrival" }
