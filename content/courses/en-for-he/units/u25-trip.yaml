id: u25-trip
cefr: B1
scene: travel
title:
  he: מתכננים נסיעה
  en: Planning a trip
story: "בן והצוות טסים לתל אביב לשבוע עבודה, ומשם כולם ממשיכים לחתונה של מרים ודוד במדריד. הזמנות, שינויים, ביטולים, ומה עושים כשהטיסה מתעכבת."
canDo:
  - להזמין מלון וכרטיסים ולשנות הזמנה
  - לדבר על תוכניות קבועות עם הווה מתמשך
  - לבחור בין will, going to והווה מתמשך לעתיד
  - להבין מסלול טיול ופרטי הזמנה

vocabulary:
  - { id: "book", text: "book", translation: "להזמין (מקום, כרטיס)", pos: "verb", pronunciation: "בּוּק", example: { text: "I've booked a hotel.", translation: "הזמנתי מלון." } }
  - { id: "booking", text: "booking", translation: "הזמנה (של מקום)", pos: "noun", pronunciation: "בּוּקִינְג" }
  - { id: "accommodation", text: "accommodation", translation: "לינה, מקום מגורים", pos: "noun", pronunciation: "אַקוֹמוֹדֵיישְׁן" }
