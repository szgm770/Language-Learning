id: v3-words
cefr: B2
scene: travel
title:
  he: סבא שמעון מגיע ללונדון
  en: Grandpa Shimon comes to London
story: 'סבא שמעון, אבא של רחל, מגיע לבקר את נועה בלונדון. בשנות השישים הוא עבד כאן כנער במאפייה של מר לוי, ויש לו בקשה אחת: למצוא את המשפחה ולהחזיר להם ספר ששמר חמישים שנה.'
canDo:
- לדבר על תוכניות, אפשרויות וקשיים
- לספר על חיפוש בארכיונים ובאינטרנט
- לתאר רחוב ישן ושינויים בעיר
vocabulary:
- id: apparently
  text: apparently
  translation: כנראה, לכאורה
  pos: adverb
  example:
    text: Apparently, the bakery closed many years ago.
    translation: מסתבר שהמאפייה נסגרה לפני שנים רבות.
- id: artist
  text: artist
  translation: אמן, אמנית
  pos: noun
  example:
    text: Mr. Levy's son became an artist.
    translation: הבן של מר לוי נעשה אמן.
- id: option
  text: option
  translation: אפשרות
  pos: noun
  example:
    text: The only option is to ask at the old shul.
    translation: האפשרות היחידה היא לשאול בבית הכנסת הישן.
- id: stone
  text: stone
  translation: אבן
  pos: noun
  example:
    text: The bakery was in a stone building.
    translation: המאפייה הייתה בבניין אבן.
- id: wild
  text: wild
  translation: פראי
  pos: adjective
  example:
    text: Grandpa had wild hair when he was sixteen.
    translation: לסבא היה שיער פרוע כשהיה בן שש־עשרה.
- id: winner
  text: winner
  translation: מנצח, זוכה
  pos: noun
  example:
    text: Mr. Levy's bread was the winner of a local prize.
    translation: הלחם של מר לוי זכה בפרס מקומי.
- id: correct
  text: correct
  translation: נכון; לתקן
  pos: adjective
  example:
    text: Is this the correct address?
    translation: זו הכתובת הנכונה?
- id: extremely
  text: extremely
  translation: במיוחד
  pos: adverb
  example:
    text: Grandpa is extremely excited.
    translation: סבא נרגש מאוד.
- id: handle
  text: handle
  translation: לטפל, להתמודד
  pos: verb
  example:
    text: Noa can handle the maps; Grandpa handles the stories.
    translation: נועה יכולה לטפל במפות; סבא מטפל בסיפורים.
- id: indeed
  text: indeed
  translation: אכן, באמת
  pos: adverb
  example:
    text: It was indeed a long journey.
    translation: זה היה אכן מסע ארוך.
- id: negative
  text: negative
  translation: שלילי
  pos: adjective
  example:
    text: The first search gave a negative result.
    translation: החיפוש הראשון נתן תוצאה שלילית.
- id: trouble
  text: trouble
  translation: בעיה, צרה
  pos: noun
  example:
    text: Grandpa has trouble with the small letters on the screen.
    translation: לסבא קשה עם האותיות הקטנות על המסך.
- id: advantage
  text: advantage
  translation: יתרון
  pos: noun
  example:
    text: Living near the archive is a big advantage.
    translation: לגור ליד הארכיון זה יתרון גדול.
- id: aware
  text: aware
  translation: מודע
  pos: adjective
  example:
    text: Were you aware that the street changed its name?
    translation: ידעת שהרחוב שינה את שמו?
- id: function
  text: function
  translation: תפקיד, פונקציה
  pos: noun
  example:
    text: 'This button has only one function: search.'
    translation: 'לכפתור הזה יש תפקיד אחד בלבד: חיפוש.'
- id: influence
  text: influence
  translation: השפעה; להשפיע
  pos: noun
  example:
    text: Mr. Levy had a great influence on Grandpa.
    translation: למר לוי הייתה השפעה גדולה על סבא.
- id: length
  text: length
  translation: אורך
  pos: noun
  example:
    text: The length of the list surprised them.
    translation: האורך של הרשימה הפתיע אותם.
- id: possibly
  text: possibly
  translation: אולי, ייתכן
  pos: adverb
  example:
    text: This could possibly be the right family.
    translation: ייתכן שזו המשפחה הנכונה.
- id: software
  text: software
  translation: תוכנה
  pos: noun
  example:
    text: Ben installed new software on the laptop.
    translation: בן התקין תוכנה חדשה במחשב הנייד.
- id: tough
  text: tough
  translation: קשה, חזק
  pos: adjective
  example:
    text: The search was tough, but they didn't give up.
    translation: החיפוש היה קשה, אבל הם לא ויתרו.
- id: request
  text: request
  translation: בקשה; לבקש
  pos: noun
  example:
    text: Ben sent a request to the local archive.
    translation: בן שלח בקשה לארכיון המקומי.
- id: stick
  text: stick
  translation: מקל; להידבק
  pos: noun
  example:
    text: Grandpa walked with a wooden stick.
    translation: סבא הלך עם מקל עץ.
- id: vehicle
  text: vehicle
  translation: רכב
  pos: noun
  example:
    text: No vehicle can enter this street on Sunday.
    translation: שום רכב לא יכול להיכנס לרחוב הזה ביום ראשון.
- id: volume
  text: volume
  translation: עוצמת קול, כרך
  pos: noun
  example:
    text: Please turn down the volume; Grandpa is resting.
    translation: בבקשה תנמיך את עוצמת הקול; סבא נח.
- id: beauty
  text: beauty
  translation: יופי
  pos: noun
  example:
    text: The beauty of the old building was still there.
    translation: היופי של הבניין הישן עדיין היה שם.
- id: concerned
  text: concerned
  translation: מודאג, קשור
  pos: adjective
  example:
    text: Noa was concerned about her grandfather.
    translation: נועה הייתה מודאגת לגבי סבא שלה.
- id: develop
  text: develop
  translation: לפתח
  pos: verb
  example:
    text: The neighbourhood began to develop in the 1980s.
    translation: השכונה התחילה להתפתח בשנות השמונים.
- id: existing
  text: existing
  translation: קיים
  pos: adjective
  example:
    text: The existing wall is two hundred years old.
    translation: הקיר הקיים בן מאתיים שנה.
- id: farm
  text: farm
  translation: חווה
  pos: noun
  example:
    text: The Levy family moved to a farm in Kent.
    translation: משפחת לוי עברה לחווה בקנט.
- id: file
  text: file
  translation: קובץ, תיק
  pos: noun
  example:
    text: The archive has a file on every building.
    translation: לארכיון יש תיק על כל בניין.
- id: roll
  text: roll
  translation: גליל, לחמנייה; להתגלגל
  pos: noun
  example:
    text: Grandpa remembers the smell of a fresh roll.
    translation: סבא זוכר את הריח של לחמנייה טרייה.
- id: slightly
  text: slightly
  translation: במעט
  pos: adverb
  example:
    text: The photo is slightly damaged.
    translation: התמונה פגועה במקצת.
- id: technical
  text: technical
  translation: טכני
  pos: adjective
  example:
    text: There was a technical problem with the printer.
    translation: הייתה בעיה טכנית במדפסת.
- id: treat
  text: treat
  translation: לטפל, לנהוג ב־
  pos: verb
  example:
    text: The train tickets are my treat.
    translation: כרטיסי הרכבת על חשבוני.
- id: unique
  text: unique
  translation: ייחודי
  pos: adjective
  example:
    text: The book has a unique cover.
    translation: לספר יש כריכה מיוחדת במינה.
- id: reference
  text: reference
  translation: הפניה, המלצה
  pos: noun
  example:
    text: The letter has a reference to a farm.
    translation: במכתב יש הפניה לחווה.
- id: alternative
  text: alternative
  translation: חלופה; חלופי
  pos: noun
  example:
    text: Is there an alternative route to Kent?
    translation: יש דרך חלופית לקנט?
- id: sky
  text: sky
  translation: שמיים
  pos: noun
  example:
    text: The sky over Kent was blue.
    translation: השמיים מעל קנט היו כחולים.
- id: valley
  text: valley
  translation: עמק
  pos: noun
  example:
    text: The farm is in a quiet valley.
    translation: החווה נמצאת בעמק שקט.
