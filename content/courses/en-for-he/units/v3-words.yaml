  exercises:
  - id: v3-l1-d1
    type: dialogue
    scene: נמל התעופה הית׳רו. נועה מחכה לסבא שמעון.
    lines:
    - speaker: saba
      text: Noa! Apparently your grandfather can still travel alone!
      translation: נועה! מסתבר שסבא שלך עוד יכול לטוס לבד!
    - speaker: noa
      text: Indeed! Grandpa, why did you really come? Mum says you have a mission.
      translation: בהחלט! סבא, למה באמת באת? אמא אומרת שיש לך משימה.
    - speaker: saba
      text: I have a book that isn't mine. I kept it for fifty years. It's extremely important to return it.
      translation: יש לי ספר שאינו שלי. שמרתי אותו חמישים שנה. חשוב מאוד להחזיר אותו.
    - speaker: noa
      text: 'Then we have one option: we find the owner.'
      translation: 'אז יש לנו אפשרות אחת: נמצא את הבעלים.'
