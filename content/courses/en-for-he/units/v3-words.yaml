id: v3-words
cefr: B2
scene: study
title:
  he: הרחבת אוצר מילים 3
  en: Word builder 3
story: עוד מילים חשובות בשימוש יומיומי, מקובצות בשיעורים קצרים. כל מילה מופיעה במשפט, ואחר כך מתרגלים אותה.
canDo:
- להבין ולהשתמש במילים נפוצות נוספות
- לזהות את המילים במשפטים אמיתיים
vocabulary:
- id: apparently
  text: apparently
  translation: כנראה, לכאורה
  pos: adverb
  example:
    text: Apparently, the shop is closed today.
    translation: כנראה שהחנות סגורה היום.
- id: artist
  text: artist
  translation: אמן, אמנית
  pos: noun
  example:
    text: My sister is a talented artist.
    translation: אחותי היא אמנית מוכשרת.
- id: option
  text: option
  translation: אפשרות
  pos: noun
  example:
    text: We have two options.
    translation: יש לנו שתי אפשרויות.
- id: stone
  text: stone
  translation: אבן
  pos: noun
  example:
    text: The old wall is made of stone.
    translation: החומה העתיקה בנויה מאבן.
- id: wild
  text: wild
  translation: פראי
  pos: adjective
  example:
    text: We saw wild flowers on the hill.
    translation: ראינו פרחי בר על הגבעה.
- id: winner
  text: winner
  translation: מנצח, זוכה
  pos: noun
  example:
    text: Who is the winner of the game?
    translation: מי הזוכה במשחק?
- id: correct
  text: correct
  translation: נכון; לתקן
  pos: adjective
  example:
    text: Your answer is correct.
    translation: התשובה שלך נכונה.
- id: extremely
  text: extremely
  translation: במיוחד
  pos: adverb
  example:
    text: The test was extremely difficult.
    translation: המבחן היה קשה במיוחד.
- id: handle
  text: handle
  translation: לטפל, להתמודד
  pos: verb
  example:
    text: Can you handle this problem?
    translation: אתה יכול לטפל בבעיה הזו?
- id: indeed
  text: indeed
  translation: אכן, באמת
  pos: adverb
  example:
    text: It was indeed a great idea.
    translation: זה אכן היה רעיון נהדר.
- id: negative
  text: negative
  translation: שלילי
  pos: adjective
  example:
    text: He has a negative attitude.
    translation: יש לו גישה שלילית.
- id: trouble
  text: trouble
  translation: בעיה, צרה
  pos: noun
  example:
    text: I am having trouble with my computer.
    translation: יש לי בעיה עם המחשב.
- id: advantage
  text: advantage
  translation: יתרון
  pos: noun
  example:
    text: Speaking English is a big advantage.
    translation: לדעת אנגלית זה יתרון גדול.
- id: aware
  text: aware
  translation: מודע
  pos: adjective
  example:
    text: Are you aware of the problem?
    translation: האם אתה מודע לבעיה?
- id: function
  text: function
  translation: תפקיד, פונקציה
  pos: noun
  example:
    text: What is the function of this button?
    translation: מה התפקיד של הכפתור הזה?
- id: influence
  text: influence
  translation: השפעה; להשפיע
  pos: noun
  example:
    text: Parents have a big influence on children.
    translation: להורים יש השפעה גדולה על ילדים.
- id: length
  text: length
  translation: אורך
  pos: noun
  example:
    text: What is the length of the table?
    translation: מה אורך השולחן?
- id: possibly
  text: possibly
  translation: אולי, ייתכן
  pos: adverb
  example:
    text: It could possibly rain tomorrow.
    translation: ייתכן שיירד גשם מחר.
- id: software
  text: software
  translation: תוכנה
  pos: noun
  example:
    text: We need to update the software.
    translation: אנחנו צריכים לעדכן את התוכנה.
- id: tough
  text: tough
  translation: קשה, חזק
  pos: adjective
  example:
    text: It was a tough week at work.
    translation: זה היה שבוע קשה בעבודה.
- id: request
  text: request
  translation: בקשה; לבקש
  pos: noun
  example:
    text: I have a small request.
    translation: יש לי בקשה קטנה.
- id: stick
  text: stick
  translation: מקל; להידבק
  pos: noun
  example:
    text: The dog ran after the stick.
    translation: הכלב רץ אחרי המקל.
- id: vehicle
  text: vehicle
  translation: רכב
  pos: noun
  example:
    text: You need a large vehicle for the trip.
    translation: צריך רכב גדול לטיול.
- id: volume
  text: volume
  translation: עוצמת קול, כרך
  pos: noun
  example:
    text: Please turn down the volume.
    translation: אנא הנמיכו את העוצמה.
- id: beauty
  text: beauty
  translation: יופי
  pos: noun
  example:
    text: We admired the beauty of the lake.
    translation: התפעלנו מיופיו של האגם.
- id: concerned
  text: concerned
  translation: מודאג, קשור
  pos: adjective
  example:
    text: I am concerned about the exam.
    translation: אני מודאג לגבי המבחן.
- id: develop
  text: develop
  translation: לפתח
  pos: verb
  example:
    text: They want to develop a new app.
    translation: הם רוצים לפתח אפליקציה חדשה.
- id: existing
  text: existing
  translation: קיים
  pos: adjective
  example:
    text: We can use the existing equipment.
    translation: אפשר להשתמש בציוד הקיים.
- id: farm
  text: farm
  translation: חווה
  pos: noun
  example:
    text: My uncle has a farm in the north.
    translation: לדוד שלי יש חווה בצפון.
- id: file
  text: file
  translation: קובץ, תיק
  pos: noun
  example:
    text: I saved the file on my computer.
    translation: שמרתי את הקובץ במחשב.
- id: roll
  text: roll
  translation: גליל, לחמנייה; להתגלגל
  pos: noun
  example:
    text: I ate a roll with cheese.
    translation: אכלתי לחמנייה עם גבינה.
- id: slightly
  text: slightly
  translation: במעט
  pos: adverb
  example:
    text: The price is slightly higher this year.
    translation: המחיר מעט גבוה יותר השנה.
- id: technical
  text: technical
  translation: טכני
  pos: adjective
  example:
    text: We had a technical problem.
    translation: הייתה לנו בעיה טכנית.
- id: treat
  text: treat
  translation: לטפל, לנהוג ב־
  pos: verb
  example:
    text: Doctors treat many patients every day.
    translation: רופאים מטפלים בהרבה חולים בכל יום.
- id: unique
  text: unique
  translation: ייחודי
  pos: adjective
  example:
    text: Every snowflake is unique.
    translation: כל פתית שלג ייחודית.
- id: reference
  text: reference
  translation: הפניה, המלצה
  pos: noun
  example:
    text: He gave me a good reference.
    translation: הוא נתן לי המלצה טובה.
- id: alternative
  text: alternative
  translation: חלופה; חלופי
  pos: noun
  example:
    text: Is there an alternative?
    translation: האם יש חלופה?
- id: sky
  text: sky
  translation: שמיים
  pos: noun
  example:
    text: The sky is clear tonight.
    translation: השמיים בהירים הלילה.
- id: valley
  text: valley
  translation: עמק
  pos: noun
  example:
    text: The village is in a green valley.
    translation: הכפר נמצא בעמק ירוק.
