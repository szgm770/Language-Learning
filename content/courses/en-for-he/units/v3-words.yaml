- id: v3-l2
  kind: new
  title:
    he: מחפשים
    en: Searching
  exercises:
  - id: v3-l2-d1
    type: dialogue
    scene: בדירה של נועה. נועה, בן וסבא מול המחשב.
    lines:
    - speaker: ben
      text: 'The archive software is tough, but it has one advantage: it searches old newspapers.'
      translation: 'התוכנה של הארכיון קשה, אבל יש לה יתרון אחד: היא מחפשת בעיתונים ישנים.'
    - speaker: saba
      text: I'm not aware of any computers in 1965!
      translation: אני לא מכיר שום מחשבים ב־1965!
    - speaker: noa
      text: Possibly there's a record of the bakery. Don't be so negative, Grandpa.
      translation: אולי יש רישום של המאפייה. אל תהיה כל כך פסימי, סבא.
    - speaker: saba
      text: Negative? Me? I've had enough trouble in my life to stay positive.
      translation: פסימי? אני? היו לי מספיק צרות בחיים כדי להישאר אופטימי.
