id: u12-weekend
cefr: A2
scene: free-time
title:
  he: סוף השבוע שעבר
  en: Last weekend
story: "מרים הגיעה ממדריד לסוף שבוע בלונדון. ביום שני כולם מספרים לאלי בבית הקפה מה הם עשו: שוק, חוף, הופעה וגם קצת בלגן."
canDo:
  - לספר מה עשיתי בסוף השבוע
  - להשתמש בפעלי עבר יוצאי דופן (went, had, saw)
  - לשאול What did you do?‎ ולהגיב בעניין
  - לסדר סיפור קצר בזמן עם then ו־after that

