  # ------------------------------------------------------------------ 5
  - id: u12-l5
    kind: reading
    title: { he: "הבלוג של מרים", en: "Miriam's blog" }
    exercises:
      - id: u12-l5-01
        type: reading
        kind: "פוסט בבלוג"
        title: "My weekend in London"
        text: |
          Last weekend I visited my friends Noa and Ben in London. I took an early flight from Madrid on Friday and arrived at lunchtime.

          On Saturday Noa and I went to Borough Market. We ate amazing food and I bought cheese for my mother. In the evening we saw a concert in the park. It was cold, but a lot of fun.

          Sunday was not perfect. I got up late, I missed the train and the museum was closed! But I met Noa at a café and we talked for hours.

          I didn't want to go home!
        translation: |
          בסוף השבוע שעבר ביקרתי את החברים שלי נועה ובן בלונדון. לקחתי טיסה מוקדמת ממדריד ביום שישי והגעתי בצהריים.

          בשבת נועה ואני הלכנו לשוק בורו. אכלנו אוכל מדהים וקניתי גבינה לאמא שלי. בערב ראינו הופעה בפארק. היה קר, אבל ממש כיף.

          יום ראשון לא היה מושלם. קמתי מאוחר, פספסתי את הרכבת והמוזיאון היה סגור! אבל פגשתי את נועה בבית קפה ודיברנו שעות.

          לא רציתי לחזור הביתה!
      - id: u12-l5-02
