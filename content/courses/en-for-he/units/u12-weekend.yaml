grammar:
  - id: past-simple-irregular
    title: { he: "עבר יוצא דופן: went, had, saw", en: "Past simple: irregular verbs" }
    explanation: |
      כמה מהפעלים הכי נפוצים באנגלית לא מקבלים ‎-ed. לכל אחד יש צורת עבר משלו, ופשוט לומדים אותה בעל פה:

      - **go → went**, **have → had**, **see → saw**, **eat → ate**
      - **meet → met**, **buy → bought**, **make → made**, **take → took**

      החדשות הטובות: גם כאן הצורה זהה לכל הגופים (**I went, she went, they went**).

      ובשאלה ובשלילה חוזרים לצורה הרגילה, בדיוק כמו בפעלים הרגילים:
      **Did you go?** (לא "Did you went") ו־**I didn't see it.**
    examples:
      - { text: "We went to the market and bought some fruit.", translation: "הלכנו לשוק וקנינו פירות." }
      - { text: "Did you see the concert? No, I didn't.", translation: "ראית את ההופעה? לא." }
      - { text: "Miriam met Ben two years ago.", translation: "מרים פגשה את בן לפני שנתיים." }

