        lexemes: [if-had-done, would-have]
      - id: u34-l3-10
        type: word_bank
        prompt: "אילו קמתי מוקדם יותר, לא הייתי מפספס את הרכבת."
        answers: ["If I had got up earlier, I wouldn't have missed the train.", "If I'd got up earlier, I wouldn't have missed the train.", "I wouldn't have missed the train if I had got up earlier."]
        distractors: [will, miss]
        lexemes: [if-had-done, miss]
      - id: u34-l3-11
        type: translate
        direction: to_target
        prompt: "אילו ידעתי, הייתי עוזרת לך."
        answers: ["If I had known, I would have helped you.", "If I'd known, I would have helped you.", "If I'd known, I'd have helped you."]
        lexemes: [if-had-done, help]
      - id: u34-l3-12
        type: translate
        direction: to_source
        prompt: "It was a win-win deal for both sides."
        answers: ["זו הייתה עסקה שבה שני הצדדים הרוויחו.", "זו הייתה עסקה טובה לשני הצדדים.", "זו הייתה עסקת win-win לשני הצדדים."]
        lexemes: [win-win, deal]
      - id: u34-l3-13
        type: speak_repeat
        text: "If we hadn't been flexible, we would have lost the deal."
        translation: "אילו לא היינו גמישים, היינו מפסידים את העסקה."
        lexemes: [if-had-done, flexible, deal]

  # ------------------------------------------------------------------ 4
  - id: u34-l4
    kind: listening
    title: { he: "מה היה קורה אילו…", en: "What would have happened if…" }
    exercises:
      - id: u34-l4-01
        type: dialogue
        scene: "ערב אחרי החתימה. נועה ובן חוגגים בבית קפה."
        lines:
          - { speaker: "ben", text: "Well done! We did it. Twenty percent and a new deadline. It's a win-win.", translation: "כל הכבוד! עשינו את זה. עשרים אחוז ודדליין חדש. כולם מרוויחים." }
          - { speaker: "noa", text: "To be honest, I almost walked away when they asked for twenty-five.", translation: "בכנות, כמעט קמתי והלכתי כשהם ביקשו עשרים וחמישה." }
          - { speaker: "ben", text: "I know. I saw your face! If you'd said no, we would have lost the client.", translation: "אני יודע. ראיתי את הפנים שלך! אילו אמרת לא, היינו מפסידים את הלקוח." }
          - { speaker: "noa", text: "And if you hadn't suggested meeting halfway, we'd still be negotiating.", translation: "ואילו לא היית מציע להיפגש באמצע, עדיין היינו מנהלים משא ומתן." }
          - { speaker: "ben", text: "We make a good team.", translation: "אנחנו צוות טוב." }
          - { speaker: "noa", text: "We do. You know, if you hadn't been in that video call three years ago, I'd never have come to London.", translation: "נכון. אתה יודע, אילו לא היית בשיחת הווידאו ההיא לפני שלוש שנים, לעולם לא הייתי מגיעה ללונדון." }
      - id: u34-l4-02
        type: multiple_choice
        prompt: "מתי נועה כמעט ויתרה?"
        options: [כשהבנק ביקש עשרים וחמישה אחוז, כשהם חתמו, בפגישה הראשונה]
