  # ------------------------------------------------------------------ 5
  - id: u34-l5
    kind: reading
    title: { he: "חמישה כללים למשא ומתן", en: "Five rules of negotiation" }
    exercises:
      - id: u34-l5-01
        type: reading
        kind: "פרק מספר עסקים"
        title: "The art of the friendly negotiation"
        text: |
          Many people think negotiation is a battle. The best negotiators disagree: their goal is a deal that both sides would sign again tomorrow.

          First, know your bottom line before you start. If you don't know when to walk away, you'll accept a bad deal.

          Second, listen more than you talk. Ask questions like "What's most important to you?" You'll often discover that the other side cares about something you can easily give.

          Third, use diplomatic language. "I'm not sure that would work" keeps the conversation open, whereas a simple "No" closes it.

          Finally, think about the long term. Many managers have told me the same story: "If we had pushed harder, we would have won that deal, but we would have lost the client."
        translation: |
          אנשים רבים חושבים שמשא ומתן הוא קרב. המשא ומתנים הטובים ביותר לא מסכימים: המטרה שלהם היא עסקה ששני הצדדים היו חותמים עליה שוב מחר.

          ראשית, דעו מה השורה התחתונה שלכם לפני שאתם מתחילים. אם אתם לא יודעים מתי לקום וללכת, תקבלו עסקה גרועה.

          שנית, הקשיבו יותר משאתם מדברים. שאלו שאלות כמו "מה הכי חשוב לכם?" לעתים קרובות תגלו שלצד השני אכפת ממשהו שאתם יכולים לתת בקלות.

          שלישית, השתמשו בשפה דיפלומטית. "אני לא בטוח שזה יעבוד" משאיר את השיחה פתוחה, בעוד ש"לא" פשוט סוגר אותה.

          לבסוף, חשבו לטווח הארוך. הרבה מנהלים סיפרו לי את אותו סיפור: "אילו לחצנו יותר, היינו מנצחים בעסקה ההיא, אבל היינו מפסידים את הלקוח."
