        options: [היו מפסידים את הלקוח, היו מקבלים יותר, היו צריכים להיפגש שוב]
        correct: 0
        lexemes: [if-had-done]
      - id: u34-l4-04
        type: multiple_choice
        prompt: "מה נועה אומרת בסוף?"
        options: [בלי בן היא לא הייתה מגיעה ללונדון, היא רוצה לחזור לתל אביב, היא רוצה קידום]
        correct: 0
        lexemes: [would-have]
      - id: u34-l4-05
        type: listening_choice
        audioText: "If we had signed last month, we would have got a better price."
        question: מה הוא אומר?
        options:
