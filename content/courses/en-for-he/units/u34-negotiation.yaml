          - { speaker: "ben", text: "Why didn't you tell me about the meeting?", translation: "למה לא סיפרת לי על הפגישה?" }
          - { speaker: "david", text: "Sorry! If I'd known it was important, I would have told you.", translation: "סליחה! אילו ידעתי שזה חשוב, הייתי מספר לך." }
        gap: 1
