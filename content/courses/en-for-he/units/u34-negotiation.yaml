id: u34-negotiation
cefr: B2
scene: money
title:
  he: משא ומתן
  en: Negotiation
story: "הבנק רוצה להמשיך לעבוד עם הצוות, אבל בתקציב קטן יותר. נועה ובן מנהלים משא ומתן קשה, מתפשרים, ובערב מדברים על מה היה קורה אילו…"
canDo:
  - לנהל משא ומתן בשפה דיפלומטית ומנומסת
  - להציע הצעה נגדית ולהגיע לפשרה
  - להשתמש במשפט תנאי שלישי (If I had…, I would have…)
  - לדבר על החלטות בעבר ועל תוצאות אחרות

vocabulary:
  - { id: "negotiate", text: "negotiate", translation: "לנהל משא ומתן", pos: "verb", pronunciation: "נֶגוֹשִׁיאֵייט" }
  - { id: "contract", text: "contract", translation: "חוזה", pos: "noun", pronunciation: "קוֹנְטְרֶקְט" }
  - { id: "deal", text: "deal", translation: "עסקה", pos: "noun", pronunciation: "דִיל", example: { text: "It's a deal!", translation: "עשינו עסקה!" } }
  - { id: "proposal", text: "proposal", translation: "הצעה (רשמית)", pos: "noun", pronunciation: "פְּרוֹפּוֹזֶל" }
  - { id: "budget", text: "budget", translation: "תקציב", pos: "noun", pronunciation: "בַּאג'ֶט" }
  - { id: "discount", text: "discount", translation: "הנחה", pos: "noun", pronunciation: "דִיסְקַאוּנְט" }
  - { id: "terms", text: "terms", translation: "תנאים (של הסכם)", pos: "noun", pronunciation: "טֶרְמְז" }
  - { id: "compromise", text: "compromise", translation: "פשרה; להתפשר", pos: "noun", pronunciation: "קוֹמְפְּרוֹמַייז" }
  - { id: "meet-halfway", text: "meet halfway", translation: "להיפגש באמצע, להתפשר", pos: "phrase", pronunciation: "מִיט הַאפְוֵויי" }
  - { id: "flexible", text: "flexible", translation: "גמיש", pos: "adjective", pronunciation: "פְלֶקְסִיבֶּל" }
  - { id: "sign", text: "sign", translation: "לחתום", pos: "verb", pronunciation: "סַיין" }
  - { id: "reject", text: "reject", translation: "לדחות (הצעה), לסרב", pos: "verb", pronunciation: "רִיג'ֶקְט" }
  - { id: "i-was-wondering", text: "I was wondering if…", translation: "תהיתי אם… (בקשה מנומסת מאוד)", pos: "phrase", pronunciation: "אַיי ווֹז וַואנְדֶרִינְג אִיף", example: { text: "I was wondering if you could lower the price.", translation: "תהיתי אם תוכלו להוריד את המחיר." } }
  - { id: "im-not-sure", text: "I'm not sure that…", translation: "אני לא בטוח ש… (ריכוך של 'לא')", pos: "phrase", pronunciation: "אַיים נוֹט שׁוּר דֶ'ט" }
  - { id: "would-it-be-possible", text: "Would it be possible to…?", translation: "האם יהיה אפשר ל…?", pos: "phrase", pronunciation: "ווּד אִיט בִּי פּוֹסִיבֶּל טוּ" }
  - { id: "bottom-line", text: "bottom line", translation: "השורה התחתונה", pos: "noun", pronunciation: "בּוֹטוֹם לַיין" }
  - { id: "would-have", text: "would have + V3", translation: "הייתי עושה (בעבר, ולא עשיתי)", pos: "phrase", pronunciation: "ווּד הֶב", example: { text: "I would have called you.", translation: "הייתי מתקשר אליך." } }
  - { id: "if-had-done", text: "If I had…, I would have…", translation: "אילו הייתי… (בעבר), הייתי…", pos: "phrase", pronunciation: "אִיף אַיי הֶד … אַיי ווּד הֶב", example: { text: "If we had asked for more, we would have got more.", translation: "אילו ביקשנו יותר, היינו מקבלים יותר." } }
  - { id: "win-win", text: "win-win", translation: "מצב שבו כולם מרוויחים", pos: "adjective", pronunciation: "וִוין וִוין" }
  - { id: "walk-away", text: "walk away", translation: "לקום וללכת, לוותר על העסקה", pos: "verb", pronunciation: "ווֹק אַוֵויי" }

grammar:
  - id: third-conditional
    title: { he: "אילו (אז)… הייתי…: תנאי בעבר", en: "The third conditional" }
    explanation: |
      **תנאי שלישי** מדבר על העבר שכבר לא אפשר לשנות: מה היה קורה אילו משהו היה אחרת.
      בעברית: "אילו הייתי יודעת, הייתי מתקשרת".

      המבנה: **If + had + V3, would have + V3**
      - **If I had known, I would have called you.** (לא ידעתי, ולא התקשרתי)
      - **If we hadn't been flexible, we would have lost the deal.**

      בדיבור מקצרים: **If I'd known, I'd have called.** (ושימו לב, ‎'d פעם אחת = had, פעם אחת = would)

      **שפה דיפלומטית** במשא ומתן מרככת את המסר:
      - במקום "No": **I'm not sure that would work for us.**
      - במקום "Lower the price": **I was wondering if you could be more flexible on the price.**
      - **Would it be possible to…?**
    examples:
      - { text: "If we had asked for more, we would have got more.", translation: "אילו ביקשנו יותר, היינו מקבלים יותר." }
      - { text: "She wouldn't have signed the contract if she had read the terms.", translation: "היא לא הייתה חותמת על החוזה אילו קראה את התנאים." }
      - { text: "I was wondering if we could meet halfway.", translation: "תהיתי אם נוכל להיפגש באמצע." }

lessons:
  # ------------------------------------------------------------------ 1
  - id: u34-l1
    kind: new
    title: { he: "התקציב קטן יותר", en: "A smaller budget" }
    exercises:
      - id: u34-l1-01
        type: dialogue
        scene: "פגישה עם מנהלת הרכש של הבנק (מרים בתפקיד הנציגה). נועה ובן מצד החברה."
        lines:
          - { speaker: "miriam", text: "We'd like to renew the contract for next year. However, our budget has been cut by twenty percent.", translation: "נרצה לחדש את החוזה לשנה הבאה. עם זאת, התקציב שלנו קוצץ בעשרים אחוז." }
          - { speaker: "noa", text: "I see. I'm not sure that we can do the same work for less.", translation: "אני מבינה. אני לא בטוחה שנוכל לעשות את אותה עבודה בפחות." }
          - { speaker: "miriam", text: "I understand. Could you send us a new proposal?", translation: "אני מבינה. תוכלו לשלוח לנו הצעה חדשה?" }
          - { speaker: "ben", text: "Of course. Would it be possible to discuss the terms first?", translation: "בוודאי. האם יהיה אפשר לדון קודם בתנאים?" }
          - { speaker: "miriam", text: "Yes. What's your bottom line?", translation: "כן. מה השורה התחתונה שלכם?" }
          - { speaker: "noa", text: "We can be flexible on the price if the deadline is flexible too.", translation: "אנחנו יכולים להיות גמישים במחיר אם גם הדדליין יהיה גמיש." }
      - { id: "u34-l1-02", type: "learn", lexeme: "contract" }
      - { id: "u34-l1-03", type: "learn", lexeme: "budget" }
      - { id: "u34-l1-04", type: "learn", lexeme: "im-not-sure" }
      - { id: "u34-l1-05", type: "learn", lexeme: "proposal" }
      - { id: "u34-l1-06", type: "learn", lexeme: "would-it-be-possible" }
      - { id: "u34-l1-07", type: "learn", lexeme: "terms" }
      - { id: "u34-l1-08", type: "learn", lexeme: "bottom-line" }
      - { id: "u34-l1-09", type: "learn", lexeme: "flexible" }
      - id: u34-l1-10
        type: match_pairs
        pairs:
          - [contract, חוזה]
          - [budget, תקציב]
          - [proposal, הצעה]
          - [terms, תנאים]
          - [flexible, גמיש]
        lexemes: [contract, budget, proposal, terms, flexible]
      - id: u34-l1-11
        type: multiple_choice
        prompt: "מה הבעיה של הבנק?"
        options: [התקציב קוצץ בעשרים אחוז, הם לא מרוצים מהעבודה, הם רוצים צוות חדש]
        correct: 0
        lexemes: [budget]
      - id: u34-l1-12
        type: multiple_choice
        prompt: "מה נועה מציעה?"
        options: [גמישות במחיר תמורת גמישות בדדליין, לעבוד בחינם, לבטל את החוזה]
        correct: 0
        lexemes: [flexible]
      - id: u34-l1-13
        type: listening_choice
        audioText: "I'm not sure that this proposal would work for us."
        question: מה היא אומרת בעדינות?
        options: [ההצעה לא מתאימה להם, ההצעה מעולה, היא צריכה עוד זמן לקרוא]
        correct: 0
        lexemes: [im-not-sure, proposal]
      - id: u34-l1-14
        type: word_bank
        prompt: "האם יהיה אפשר לדון בתנאים?"
        answers: ["Would it be possible to discuss the terms?"]
        distractors: [will, term]
        lexemes: [would-it-be-possible, terms]
      - id: u34-l1-15
        type: speak_repeat
        text: "We can be flexible on the price if the deadline is flexible too."
        translation: "אנחנו יכולים להיות גמישים במחיר אם גם הדדליין יהיה גמיש."
        lexemes: [flexible, deadline]

  # ------------------------------------------------------------------ 2
  - id: u34-l2
    kind: new
    title: { he: "להיפגש באמצע", en: "Meeting halfway" }
    exercises:
      - { id: "u34-l2-01", type: "learn", lexeme: "negotiate" }
      - { id: "u34-l2-02", type: "learn", lexeme: "i-was-wondering" }
      - { id: "u34-l2-03", type: "learn", lexeme: "discount" }
      - { id: "u34-l2-04", type: "learn", lexeme: "compromise" }
      - { id: "u34-l2-05", type: "learn", lexeme: "meet-halfway" }
      - { id: "u34-l2-06", type: "learn", lexeme: "reject" }
      - { id: "u34-l2-07", type: "learn", lexeme: "deal" }
      - { id: "u34-l2-08", type: "learn", lexeme: "sign" }
      - id: u34-l2-09
        type: dialogue
        scene: "הפגישה השנייה. ההצעה החדשה על השולחן."
        lines:
          - { speaker: "miriam", text: "Thank you for the proposal. I was wondering if you could offer a bigger discount.", translation: "תודה על ההצעה. תהיתי אם תוכלו להציע הנחה גדולה יותר." }
          - { speaker: "noa", text: "I'm afraid fifteen percent is the most we can offer.", translation: "אני חוששת שחמישה־עשר אחוז זה המקסימום שאנחנו יכולים להציע." }
          - { speaker: "miriam", text: "We were hoping for twenty-five.", translation: "קיווינו לעשרים וחמישה." }
          - { speaker: "ben", text: "What if we meet halfway? Twenty percent, and the deadline moves to June.", translation: "מה אם ניפגש באמצע? עשרים אחוז, והדדליין זז ליוני." }
          - { speaker: "miriam", text: "That sounds like a fair compromise. It's a deal.", translation: "זה נשמע כמו פשרה הוגנת. עשינו עסקה." }
          - { speaker: "noa", text: "Great. We'll send the contract to sign tomorrow.", translation: "מעולה. נשלח את החוזה לחתימה מחר." }
      - id: u34-l2-10
        type: match_pairs
        pairs:
          - [negotiate, לנהל משא ומתן]
          - [discount, הנחה]
          - [compromise, פשרה]
          - [deal, עסקה]
          - [sign, לחתום]
        lexemes: [negotiate, discount, compromise, deal, sign]
      - id: u34-l2-11
        type: multiple_choice
        prompt: "איזו הנחה הסכימו בסוף?"
        options: [עשרים אחוז, חמישה־עשר אחוז, עשרים וחמישה אחוז]
        correct: 0
        lexemes: [discount, meet-halfway]
      - id: u34-l2-12
        type: multiple_choice
        prompt: "מה הצוות קיבל בתמורה?"
        options: [הדדליין זז ליוני, תקציב גדול יותר, חוזה לשנתיים]
        correct: 0
        lexemes: [compromise]
      - id: u34-l2-13
        type: dialogue_gap
        lines:
          - { speaker: "miriam", text: "Twenty-five percent is our final offer.", translation: "עשרים וחמישה אחוז זו ההצעה הסופית שלנו." }
          - { speaker: "ben", text: "I'm not sure that works for us. Could we meet halfway?", translation: "אני לא בטוח שזה מתאים לנו. נוכל להיפגש באמצע?" }
        gap: 1
        distractors: ["No. Give us halfway now.", "I'm not sure that works for us. Could we meet half?"]
        lexemes: [im-not-sure, meet-halfway]
      - id: u34-l2-14
        type: translate
        direction: to_target
        prompt: "תהיתי אם תוכלו להיות גמישים יותר."
        answers: ["I was wondering if you could be more flexible.", "I was wondering whether you could be more flexible."]
        lexemes: [i-was-wondering, flexible]
      - id: u34-l2-15
        type: translate
        direction: to_source
        prompt: "They rejected our first proposal."
        answers: ["הם דחו את ההצעה הראשונה שלנו.", "הם סירבו להצעה הראשונה שלנו."]
        lexemes: [reject, proposal]
      - id: u34-l2-16
        type: speak_repeat
        text: "What if we meet halfway? That sounds like a fair compromise."
        translation: "מה אם ניפגש באמצע? זה נשמע כמו פשרה הוגנת."
        lexemes: [meet-halfway, compromise]

  # ------------------------------------------------------------------ 3
  - id: u34-l3
    kind: grammar
    grammar: third-conditional
    title: { he: "אילו הייתי יודעת…", en: "If I had known…" }
    exercises:
      - { id: "u34-l3-01", type: "learn", lexeme: "would-have" }
      - { id: "u34-l3-02", type: "learn", lexeme: "if-had-done" }
      - id: u34-l3-03
        type: fill_blank
        sentence: "If I had known, I ___ have called you."
        translation: "אילו ידעתי, הייתי מתקשרת אליך."
        answers: [would]
        options: [would, will, had]
        lexemes: [if-had-done, would-have]
      - id: u34-l3-04
        type: fill_blank
        sentence: "If we had ___ for more, we would have got more. (ask)"
        translation: "אילו ביקשנו יותר, היינו מקבלים יותר."
        answers: [asked]
        options: [asked, ask, would ask]
        lexemes: [if-had-done]
      - id: u34-l3-05
        type: multiple_choice
        prompt: "מה פירוש: If she had read the terms, she wouldn't have signed?"
        options:
          - "היא לא קראה, וחתמה"
          - "היא קראה, ולא חתמה"
          - היא תקרא ולא תחתום
        correct: 0
        lexemes: [if-had-done, terms, sign]
      - id: u34-l3-06
        type: multiple_choice
        prompt: איזה משפט נכון?
        options: ["If they hadn't been flexible, we would have walked away.", "If they wouldn't be flexible, we had walked away.", "If they weren't flexible, we would walk away yesterday."]
        correct: 0
