  # ------------------------------------------------------------------ 5
  - id: u24-l5
    kind: reading
    title: { he: "מדיניות החזרות", en: "Returns policy" }
    exercises:
      - id: u24-l5-01
        type: reading
        kind: "מדיניות החזרות באתר"
        title: "Our returns policy"
        text: |
          We want you to love your order. If you don't, you can return it within 30 days for a full refund.

          Items must be unused and in their original box. You have to include the receipt or your order number.

          You don't have to pay for returns: print the free label from your account and take the parcel to any post office.

          If an item arrives damaged, please contact customer service within 48 hours. You mustn't use a damaged electrical item.

