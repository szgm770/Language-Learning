          - { speaker: "cohen", text: "I'm sorry to hear that. What's your order number?", translation: "צר לי לשמוע. מה מספר ההזמנה שלך?" }
          - { speaker: "noa", text: "It's 4-5-8-2-1. The coffee machine arrived broken.", translation: "4-5-8-2-1. מכונת הקפה הגיעה שבורה." }
