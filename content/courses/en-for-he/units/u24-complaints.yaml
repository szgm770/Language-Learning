        scene: "נועה פותחת את הקופסה. רחל אצלה."
        lines:
          - { speaker: "noa", text: "My new coffee machine has finally arrived!", translation: "מכונת הקפה החדשה שלי סוף סוף הגיעה!" }
          - { speaker: "rachel", text: "Let's see… Oh no. The box is damaged.", translation: "בואי נראה… אוי לא. הקופסה פגומה." }
          - { speaker: "noa", text: "And the machine is broken! Look at the glass.", translation: "והמכונה שבורה! תסתכלי על הזכוכית." }
          - { speaker: "rachel", text: "And it's the wrong colour. You ordered black, didn't you?", translation: "וזה גם הצבע הלא נכון. הזמנת שחור, לא?" }
          - { speaker: "noa", text: "Yes! I'm going to complain. Where's the receipt?", translation: "כן! אני הולכת להתלונן. איפה הקבלה?" }
