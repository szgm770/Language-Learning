id: u24-complaints
cefr: B1
scene: money
title:
  he: זה לא עובד
  en: It doesn't work
story: "נועה הזמינה אונליין מכונת קפה חדשה, והיא הגיעה שבורה. עכשיו היא צריכה להתלונן, להחזיר ולקבל את הכסף בחזרה, באנגלית ובנימוס."
canDo:
  - להתלונן בנימוס על מוצר או שירות
  - לבקש החזר כספי או החלפה
  - "להבחין בין have to, must ו־don't have to"
  - להבין תנאים של חנות אונליין

