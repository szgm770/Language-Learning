      - { id: "u24-l1-03", type: "learn", lexeme: "arrive" }
      - { id: "u24-l1-04", type: "learn", lexeme: "damaged" }
      - { id: "u24-l1-05", type: "learn", lexeme: "broken" }
      - { id: "u24-l1-06", type: "learn", lexeme: "wrong" }
      - { id: "u24-l1-07", type: "learn", lexeme: "complain" }
      - { id: "u24-l1-08", type: "learn", lexeme: "receipt" }
