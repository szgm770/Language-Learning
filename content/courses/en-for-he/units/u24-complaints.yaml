          - { speaker: "noa", text: "That's really disappointing. I've already waited ten days.", translation: "זה באמת מאכזב. כבר חיכיתי עשרה ימים." }
          - { speaker: "cohen", text: "I completely understand. We can give you a full refund today.", translation: "אני מבין לגמרי. אנחנו יכולים לתת לך החזר מלא היום." }
