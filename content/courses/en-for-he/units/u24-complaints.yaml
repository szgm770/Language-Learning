grammar:
  - id: obligation
    title: { he: "חובה ואיסור: have to, must, don't have to", en: "Have to, must, don't have to" }
    explanation: |
      בעברית "צריך", "חייב" ו"אסור". באנגלית:

      - **have to** = צריך, חייבים (בדרך כלל כלל או חובה מבחוץ): **You have to keep the receipt.** בגוף שלישי: **she has to**.
      - **must** = חייב (רשמי יותר, או משהו שאני מרגיש שחשוב): **I must call the shop today.** בשלטים ובתקנונים: **Items must be returned within 30 days.**
      - **mustn't** = **אסור**: **You mustn't open the box.**
      - **don't have to** = **לא צריך**, אין חובה (אבל מותר!): **You don't have to pay for delivery.**

      זו המלכודת הגדולה: **mustn't** ו־**don't have to** נשמעים דומים, אבל המשמעות שונה לגמרי. "אסור לך" מול "לא חייב".

      בעבר יש רק **had to**: **I had to wait for an hour.**
    examples:
      - { text: "You have to show your receipt.", translation: "צריך להציג את הקבלה." }
      - { text: "You mustn't use the machine if it's damaged.", translation: "אסור להשתמש במכונה אם היא פגומה." }
      - { text: "You don't have to come to the shop. We'll collect it.", translation: "לא צריך לבוא לחנות. נאסוף את זה." }

