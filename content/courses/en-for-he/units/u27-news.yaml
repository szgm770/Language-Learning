id: u27-news
cefr: B1
scene: news
title:
  he: בחדשות
  en: In the news
story: "האפליקציה של הבנק יוצאת לאוויר, והעיתונים כותבים עליה. נועה והצוות קוראים כותרות, מגיבים לראיון ברדיו ומגלים שגם על טעויות כותבים."
