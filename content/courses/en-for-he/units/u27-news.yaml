  # ------------------------------------------------------------------ 5
  - id: u27-l5
    kind: reading
    title: { he: "כתבה: גשר בין שתי ערים", en: "Article: a bridge between two cities" }
    exercises:
      - id: u27-l5-01
        type: reading
        kind: "כתבה בעיתון"
        title: "The app that was built in two cities"
        text: |
          The new mobile app from Northbank was launched last Monday, and it is already used by more than one million people.

          The app was built by a team of twelve in London and Tel Aviv. According to team leader Noa Levi, half of the work was done remotely. "We met on video every morning," she said. "The distance actually helped us. While London was sleeping, Tel Aviv was working."

          The design was created by Tamar Ben-David, who moved from Tel Aviv to London this year. Users say the app is simple and fast: in a survey, 92 percent said they liked it.

          There was one problem: on Tuesday, a mistake in an update showed some customers the wrong balance. It was fixed in forty minutes.
        translation: |
          האפליקציה החדשה לנייד של נורת'בנק הושקה ביום שני שעבר, וכבר משמשת יותר ממיליון אנשים.

          האפליקציה נבנתה על ידי צוות של שנים־עשר אנשים בלונדון ובתל אביב. לפי ראש הצוות נועה לוי, חצי מהעבודה נעשה מרחוק. "נפגשנו בווידאו כל בוקר," היא אמרה. "המרחק דווקא עזר לנו. בזמן שלונדון ישנה, תל אביב עבדה."

          העיצוב נוצר על ידי תמר בן־דוד, שעברה מתל אביב ללונדון השנה. המשתמשים אומרים שהאפליקציה פשוטה ומהירה: בסקר, 92 אחוז אמרו שהם אוהבים אותה.

