grammar:
  - id: passive-voice
    title: { he: "סביל: It was built, it is made", en: "The passive" }
    explanation: |
      בעברית יש בניינים סבילים: "נבנה", "הושק", "תוקן". באנגלית בונים סביל עם **be + צורה שלישית של הפועל**:

      - הווה: **is / are + V3**: **Coffee is grown in Brazil.** (קפה מגודל בברזיל)
      - עבר: **was / were + V3**: **The app was launched yesterday.** (האפליקציה הושקה אתמול)

      משתמשים בסביל כשהפעולה חשובה יותר מהעושה, או כשלא יודעים מי עשה. וזה נפוץ מאוד בחדשות!

      רוצים לציין מי עשה? **by**: **The app was designed by Tamar.**

      צורות שלישיות שימושיות: **make → made, build → built, write → written, find → found, sell → sold, use → used**.
    examples:
      - { text: "The bridge was built in 1894.", translation: "הגשר נבנה ב־1894." }
      - { text: "The app is used by two million people.", translation: "האפליקציה משמשת שני מיליון אנשים." }
      - { text: "The mistake was fixed in an hour.", translation: "הטעות תוקנה תוך שעה." }

