grammar:
  - id: age-with-be
    title: { he: "גיל עם am", en: "Age with am" }
    explanation: |
      בעברית אומרים "אני בן עשר". באנגלית אומרים "אני עשר שנים זקן": **I am ten years old**.

      אפשר גם בקיצור: **I'm ten.**

      כדי לשאול: **How old are you?** – מילה במילה "כמה זקן אתה?". זו השאלה הרגילה והמנומסת, גם לילדים.
    examples:
      - { text: I'm ten years old., translation: אני בן עשר. }
      - { text: How old are you?, translation: בן כמה אתה? }

