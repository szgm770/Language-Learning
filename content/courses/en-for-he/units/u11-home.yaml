grammar:
  - id: past-simple-regular
    title: { he: "עבר פשוט: I moved, I lived", en: "Past simple: regular verbs" }
    explanation: |
      בעברית לכל פועל יש צורת עבר משלו: גרתי, עברתי, ניקיתי. באנגלית, ברוב הפעלים פשוט מוסיפים **‎-ed**, והצורה זהה לכל הגופים:

      - **I moved**, **she moved**, **they moved**
      - **live → lived**, **clean → cleaned**, **want → wanted**

      שאלה בעבר: **Did** בהתחלה, והפועל חוזר לצורה הרגילה, בלי ed:
      **Did you like the flat?** ולא "Did you liked".

      שלילה: **didn't** + פועל רגיל: **I didn't like it.**

      תשובה קצרה: **Yes, I did.** / **No, I didn't.**
    examples:
      - { text: "Noa moved to London last month.", translation: "נועה עברה ללונדון בחודש שעבר." }
      - { text: "Did you clean the kitchen? Yes, I did.", translation: "ניקית את המטבח? כן." }
      - { text: "We didn't want a noisy flat.", translation: "לא רצינו דירה רועשת." }

