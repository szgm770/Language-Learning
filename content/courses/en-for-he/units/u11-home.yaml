      - id: u11-l5-01
        type: reading
        kind: "מודעה להשכרה"
        title: "Flat for rent in Camden"
        text: |
          A bright one-bedroom flat on a quiet street, five minutes from the station.

          The flat has a large living room with two big windows, a new kitchen and a small bathroom. The bedroom is upstairs.

          The flat comes with furniture: a sofa, a bed, a table and four chairs.

          Rent: £950 a month. No pets, please. Call the landlord, Mr. Levy, on 0207 555 0193.
        translation: |
          דירת חדר שינה אחד מוארת ברחוב שקט, חמש דקות מהתחנה.

          בדירה סלון גדול עם שני חלונות גדולים, מטבח חדש וחדר אמבטיה קטן. חדר השינה למעלה.

          הדירה מגיעה עם רהיטים: ספה, מיטה, שולחן וארבעה כיסאות.

          שכר דירה: 950 פאונד לחודש. בלי חיות מחמד, בבקשה. התקשרו לבעל הבית, מר לוי, במספר 0207 555 0193.
      - id: u11-l5-02
