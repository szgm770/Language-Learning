  - id: u11-l4
    kind: listening
    title: { he: "איך הייתה ההעברה?", en: "How was the move?" }
    exercises:
      - id: u11-l4-01
        type: dialogue
        scene: "יום שני בבוקר במשרד. בן שואל את נועה על סוף השבוע."
        lines:
          - { speaker: "ben", text: "How was the weekend? Did you move?", translation: "איך היה סוף השבוע? עברת דירה?" }
          - { speaker: "noa", text: "Yes! I moved on Sunday. Rachel helped me.", translation: "כן! עברתי ביום ראשון. רחל עזרה לי." }
          - { speaker: "ben", text: "Great. Do you like the flat?", translation: "מעולה. את אוהבת את הדירה?" }
          - { speaker: "noa", text: "I love it. It's quiet, and the living room is very bright.", translation: "אני מתה עליה. היא שקטה, והסלון מאוד מואר." }
