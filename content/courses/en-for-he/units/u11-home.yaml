          - { speaker: "noa", text: "Mrs. Katz is very nice. She cleaned the kitchen for me.", translation: "גברת כץ מאוד נחמדה. היא ניקתה בשבילי את המטבח." }
          - { speaker: "ben", text: "Lucky you! My landlord never cleans anything.", translation: "יש לך מזל! בעל הבית שלי אף פעם לא מנקה כלום." }
