grammar:
  - id: can-cant
    title: { he: "יכול, יודע: can, can't", en: "Can and can't" }
    explanation: |
      **can** אומר "יכול" או "יודע לעשות". הוא לא משתנה לפי הגוף:
      **I can swim. She can swim.** (בלי s!)

      אחרי **can** בא הפועל בלי **to**: **I can cook**, לא "I can to cook".

      - שלילה: **can't** – **I can't play football.**
      - שאלה: **Can you swim?** תשובה: **Yes, I can.** / **No, I can't.**
    examples:
      - { text: "Ben can play the guitar.", translation: "בן יודע לנגן בגיטרה." }
      - { text: "I can't come on Saturday.", translation: "אני לא יכולה לבוא בשבת." }
      - { text: "Can you cook? Yes, I can.", translation: "אתה יודע לבשל? כן." }
  - id: like-ing
    title: { he: "אוהב לעשות: like + ing", en: "Like + -ing" }
    explanation: |
      כשאוהבים פעולה, מוסיפים לפועל **ing**:
      **I like swimming.** (אני אוהב לשחות)

      - swim → **swimming** (מכפילים את m)
      - cook → **cooking**, read → **reading**

      מילות תדירות באות **לפני** הפועל: **I always cook. She never swims. We sometimes watch movies.**
    examples:
      - { text: "Noa likes cooking.", translation: "נועה אוהבת לבשל." }
      - { text: "I don't like swimming.", translation: "אני לא אוהב לשחות." }
      - { text: "We always play football on Sunday.", translation: "אנחנו תמיד משחקים כדורגל ביום ראשון." }

