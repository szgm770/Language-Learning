id: u19-party
cefr: A2
scene: party
title:
  he: חגיגות
  en: Celebrations
story: "בן חוגג שלושים, ונועה ורחל מארגנות לו מסיבת הפתעה. מי יביא מה? מי יזמין את מי? ובסוף מגיעה עוד הזמנה, לחתונה."
canDo:
  - להזמין מישהו למסיבה ולהגיב להזמנה
  - להציע עזרה ולהבטיח עם will
  - לברך ביום הולדת ובחתונה
  - להשתמש ב־Would you like…?‎ בנימוס

