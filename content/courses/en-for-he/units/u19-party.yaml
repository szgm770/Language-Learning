      - { id: "u19-l1-03", type: "learn", lexeme: "party" }
      - { id: "u19-l1-04", type: "learn", lexeme: "surprise" }
      - { id: "u19-l1-05", type: "learn", lexeme: "celebrate" }
      - { id: "u19-l1-06", type: "learn", lexeme: "guests" }
      - { id: "u19-l1-07", type: "learn", lexeme: "invite" }
