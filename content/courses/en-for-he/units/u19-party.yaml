  # ------------------------------------------------------------------ 5
  - id: u19-l5
    kind: reading
    title: { he: "הזמנה לחתונה", en: "A wedding invitation" }
    exercises:
      - { id: "u19-l5-01", type: "learn", lexeme: "invitation" }
      - id: u19-l5-02
        type: reading
        kind: "הזמנה לחתונה"
        title: "Miriam & David are getting married!"
        text: |
          Together with their families, Miriam García and David Aharoni invite you to celebrate their wedding.

          Saturday, 14 June, at six o'clock in the evening, at the Rose Garden, Madrid.

          There will be dinner, music and a lot of dancing!

          Please let us know if you can come before 1 May. We hope you'll be there!

          No presents, please. Your smile is the best present.
        translation: |
          יחד עם משפחותיהם, מרים גרסיה ודוד אהרוני מזמינים אתכם לחגוג את חתונתם.

          שבת, 14 ביוני, בשש בערב, בגן הוורדים, מדריד.

          תהיה ארוחת ערב, מוזיקה והרבה ריקודים!

          אנא הודיעו לנו אם תוכלו להגיע לפני 1 במאי. אנחנו מקווים שתהיו שם!

          בלי מתנות, בבקשה. החיוך שלכם הוא המתנה הכי טובה.
      - id: u19-l5-03
        type: multiple_choice
        prompt: "באיזו שעה החתונה?"
        options: [בשש בערב, בשבע בערב, בשתיים בצהריים]
