grammar:
  - id: will-offers
    title: { he: "הצעות והבטחות: I'll", en: "Will for offers and promises" }
    explanation: |
      כבר למדנו **going to** לתוכניות שהחלטנו עליהן מראש. **will** משמש להחלטה שאנחנו מקבלים **עכשיו**, ברגע הדיבור, להצעה ולהבטחה:

      - החלטה עכשיו: "אין חלב." "**I'll buy some.**"
      - הצעה: **I'll help you.** (אני אעזור לך)
      - הבטחה: **I'll call you tomorrow. I promise.**

      **will** לא משתנה לפי הגוף, ובדיבור מקצרים: **I'll, you'll, she'll, we'll**.
      שלילה: **won't** (will not): **I won't tell anyone.**

      ובנימוס, כשמציעים משהו: **Would you like some cake?** והתשובה: **Yes, please!** או **I'd love to!** (להזמנה).
    examples:
      - { text: "The phone is ringing. I'll answer it.", translation: "הטלפון מצלצל. אני אענה." }
      - { text: "Don't worry, I won't be late.", translation: "אל תדאג, אני לא אאחר." }
      - { text: "Would you like to come to my party? I'd love to!", translation: "תרצה לבוא למסיבה שלי? בשמחה!" }

