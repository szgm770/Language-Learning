  - id: u19-l1
    kind: new
    title: { he: "מסיבת הפתעה", en: "A surprise party" }
    exercises:
      - id: u19-l1-01
        type: dialogue
        scene: "נועה ורחל בבית הקפה של אלי. ביום שבת בן חוגג שלושים."
        lines:
          - { speaker: "rachel", text: "It's Ben's birthday on Saturday. He's going to be thirty!", translation: "בשבת יום ההולדת של בן. הוא הולך להיות בן שלושים!" }
          - { speaker: "noa", text: "Let's have a surprise party!", translation: "בואי נעשה מסיבת הפתעה!" }
          - { speaker: "rachel", text: "Great idea. We can celebrate at my flat.", translation: "רעיון מעולה. אפשר לחגוג בדירה שלי." }
          - { speaker: "noa", text: "How many guests?", translation: "כמה אורחים?" }
          - { speaker: "rachel", text: "About twenty. Let's invite everyone from the office.", translation: "בערך עשרים. בואי נזמין את כולם מהמשרד." }
          - { speaker: "eli", text: "A party? I'll make the cake!", translation: "מסיבה? אני אכין את העוגה!" }
