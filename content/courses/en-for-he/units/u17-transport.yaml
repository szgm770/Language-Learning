  - { id: "miss", text: "miss", translation: "לפספס", pos: "verb", pronunciation: "מִיס", example: { text: "I missed the bus.", translation: "פספסתי את האוטובוס." } }
  - { id: "on-time", text: "on time", translation: "בזמן", pos: "phrase", pronunciation: "אוֹן טַיים" }
  - { id: "delay", text: "delay", translation: "עיכוב", pos: "noun", pronunciation: "דִילֵיי" }
  - { id: "journey", text: "journey", translation: "נסיעה, מסע", pos: "noun", pronunciation: "ג'ֶרְנִי" }
  - { id: "how-long", text: "How long does it take?", translation: "כמה זמן זה לוקח?", pos: "phrase", pronunciation: "הַאוּ לוֹנְג דַאז אִיט טֵייק" }
  - { id: "it-takes", text: "It takes…", translation: "זה לוקח…", pos: "phrase", pronunciation: "אִיט טֵייקְס", example: { text: "It takes twenty minutes by bus.", translation: "זה לוקח עשרים דקות באוטובוס." } }
  - { id: "by-transport", text: "by bus / by train", translation: "באוטובוס / ברכבת", pos: "phrase", pronunciation: "בַּיי בַּאס" }
  - { id: "on-foot", text: "on foot", translation: "ברגל", pos: "phrase", pronunciation: "אוֹן פוּט" }
  - { id: "the-est", text: "the …-est", translation: "הכי (מילים קצרות)", pos: "phrase", pronunciation: "דֶ'ה …אֶסְט", example: { text: "the fastest way", translation: "הדרך הכי מהירה" } }
  - { id: "the-most", text: "the most", translation: "הכי (מילים ארוכות)", pos: "phrase", pronunciation: "דֶ'ה מוֹסְט", example: { text: "the most expensive ticket", translation: "הכרטיס הכי יקר" } }
  - { id: "fast", text: "fast", translation: "מהיר", pos: "adjective", pronunciation: "פַאסְט" }
  - { id: "slow", text: "slow", translation: "איטי", pos: "adjective", pronunciation: "סְלוֹ" }

grammar:
  - id: superlatives
    title: { he: "הכי: the fastest, the most expensive", en: "Superlatives" }
    explanation: |
      בעברית אומרים "הכי מהיר". באנגלית, כמו בהשוואה, זה תלוי באורך המילה, ותמיד יש **the** לפני:

      - מילה קצרה: **‎-est**: **fast → the fastest**, **cheap → the cheapest**, **slow → the slowest**
      - מילה שנגמרת ב־y: **easy → the easiest**
      - מילה ארוכה: **the most**: **the most expensive**, **the most comfortable**
      - יוצאי דופן: **good → the best**, **bad → the worst**

      ושאלה שימושית מאוד בנסיעות: **How long does it take?** והתשובה: **It takes twenty minutes.**
    examples:
      - { text: "The Underground is the fastest way to get to work.", translation: "הרכבת התחתית היא הדרך הכי מהירה להגיע לעבודה." }
      - { text: "A taxi is the most expensive.", translation: "מונית היא הכי יקרה." }
      - { text: "This is the best bike in the shop.", translation: "אלה האופניים הכי טובים בחנות." }

