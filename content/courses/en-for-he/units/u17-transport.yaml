id: u17-transport
cefr: A2
scene: town
title:
  he: להתנייד בעיר
  en: Getting around
story: "נועה מגלה את התחבורה בלונדון: הרכבת התחתית, האוטובוסים האדומים והאופניים. היא קונה כרטיסים, מפספסת רכבת, ומחליטה מה הדרך הכי טובה להגיע לעבודה."
canDo:
  - לקנות כרטיס ולשאול על רציף ועל החלפה
  - לשאול כמה זמן לוקחת נסיעה
  - להשוות בין דרכי נסיעה עם the fastest ו־the most
  - להבין הודעות על עיכובים

