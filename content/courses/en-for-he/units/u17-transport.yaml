  # ------------------------------------------------------------------ 5
  - id: u17-l5
    kind: reading
    title: { he: "המדריך לתחבורה בלונדון", en: "A guide to London transport" }
    exercises:
      - id: u17-l5-01
        type: reading
        kind: "מדריך לתיירים"
        title: "Getting around London"
        text: |
          The Underground (or "the Tube") is usually the fastest way to travel around London. Trains come every few minutes, but they are very busy in the morning.

          The famous red buses are slower, but they are cheaper than the Tube, and you can see the city from the window.

          Taxis are the most comfortable way to travel, but they are also the most expensive.

          And the best way on a sunny day? On foot or by bike! London is bigger than it looks on the map, so take a good pair of shoes.
        translation: |
          הרכבת התחתית (או "הטיוב") היא בדרך כלל הדרך הכי מהירה לנסוע בלונדון. הרכבות מגיעות כל כמה דקות, אבל הן מאוד עמוסות בבוקר.

          האוטובוסים האדומים המפורסמים איטיים יותר, אבל הם זולים יותר מהטיוב, ואפשר לראות את העיר מהחלון.

          מוניות הן הדרך הכי נוחה לנסוע, אבל הן גם הכי יקרות.

          והדרך הכי טובה ביום שמשי? ברגל או באופניים! לונדון גדולה יותר ממה שהיא נראית במפה, אז קחו זוג נעליים טובות.
      - id: u17-l5-02
        type: multiple_choice
        prompt: "מה הדרך הכי מהירה?"
        options: [הרכבת התחתית, האוטובוס, מונית]
        correct: 0
        lexemes: [underground, the-est]
