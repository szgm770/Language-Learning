        type: dialogue
        scene: "נועה בקופה בתחנת רכבת. היא רוצה לנסוע לבן בגריניץ'."
        lines:
          - { speaker: "noa", text: "Hello. A ticket to Greenwich, please.", translation: "שלום. כרטיס לגריניץ', בבקשה." }
          - { speaker: "cohen", text: "Single or return?", translation: "לכיוון אחד או הלוך ושוב?" }
          - { speaker: "noa", text: "Return, please. Which platform is it?", translation: "הלוך ושוב, בבקשה. איזה רציף?" }
          - { speaker: "cohen", text: "Platform three. You need to change at London Bridge.", translation: "רציף שלוש. צריך להחליף בלונדון ברידג'." }
          - { speaker: "noa", text: "How long does it take?", translation: "כמה זמן זה לוקח?" }
          - { speaker: "cohen", text: "It takes about twenty-five minutes.", translation: "זה לוקח בערך עשרים וחמש דקות." }
