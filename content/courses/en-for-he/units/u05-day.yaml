        correct: 0
        lexemes: [go-to-work]
      - { id: "u5-l1-06", type: "learn", lexeme: "go-home" }
      - { id: "u5-l1-07", type: "learn", lexeme: "have-dinner" }
      - { id: "u5-l1-08", type: "learn", lexeme: "go-to-bed" }
