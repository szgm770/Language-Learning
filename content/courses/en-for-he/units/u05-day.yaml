    exercises:
      - id: u5-l1-01
        type: dialogue
        scene: "בהפסקת צהריים, בן שואל את נועה על הבוקר שלה."
        lines:
          - { speaker: "ben", text: "What time do you get up, Noa?", translation: "באיזו שעה את קמה, נועה?" }
          - { speaker: "noa", text: "I get up at seven. I have breakfast and I go to work.", translation: "אני קמה בשבע. אני אוכלת ארוחת בוקר והולכת לעבודה." }
          - { speaker: "ben", text: "I get up at six! I go to the gym every day.", translation: "אני קם בשש! אני הולך לחדר כושר כל יום." }
          - { speaker: "noa", text: "Wow, early!", translation: "וואו, מוקדם!" }
      - { id: "u5-l1-02", type: "learn", lexeme: "get-up" }
