  - { id: "still", text: "still", translation: "עדיין", pos: "adverb", pronunciation: "סְטִיל", example: { text: "I still work at seven.", translation: "אני עדיין עובד בשבע." } }
  - { id: "hour", text: "hour", translation: "שעה", pos: "noun", pronunciation: "אַוור", example: { text: "The meeting is one hour.", translation: "הפגישה נמשכת שעה." } }
  - { id: "talk", text: "talk", translation: "לדבר; שיחה", pos: "verb", pronunciation: "טוֹק", example: { text: "We talk every day.", translation: "אנחנו מדברים כל יום." } }
  - { id: "show", text: "show", translation: "להראות", pos: "verb", pronunciation: "שׁוֹ", example: { text: "I show you my diary.", translation: "אני מראה לך את היומן שלי." } }
  - { id: "thing", text: "thing", translation: "דבר", pos: "noun", pronunciation: "תִּינְג", example: { text: "This is a good thing.", translation: "זה דבר טוב." } }
  - { id: "place", text: "place", translation: "מקום", pos: "noun", pronunciation: "פְּלֵייס", example: { text: "This is my favorite place.", translation: "זה המקום האהוב עליי." } }
  - { id: "house", text: "house", emoji: "🏠", translation: "בית", pos: "noun", pronunciation: "הַאוּס", example: { text: "I go to his house on Sunday.", translation: "אני הולך לבית שלו ביום ראשון." } }
grammar:
  - id: present-simple
    title: { he: "הווה פשוט: I work, we work", en: "Present simple" }
    explanation: |
      כדי לתאר הרגל, משהו שקורה כל יום, משתמשים בפועל כמו שהוא: **I get up at seven.** **We work in Tel Aviv.**

      הצורה זהה ל־I, you, we ו־they. (עם he ו־she מוסיפים s, ביחידה הבאה.)

      שלילה: **don't** לפני הפועל. **I don't work on Saturday.**

      שאלה: **Do** בהתחלה. **Do you work on Sunday?** ועונים **Yes, I do.** או **No, I don't.**
    examples:
      - { text: "I have breakfast at eight.", translation: "אני אוכל ארוחת בוקר בשמונה." }
      - { text: "They don't work on Friday.", translation: "הם לא עובדים ביום שישי." }
      - { text: "Do you go to bed early? No, I don't.", translation: "את הולכת לישון מוקדם? לא." }

lessons:
