grammar:
  - id: present-simple
    title: { he: "הווה פשוט: I work, we work", en: "Present simple" }
    explanation: |
      כדי לתאר הרגל, משהו שקורה כל יום, משתמשים בפועל כמו שהוא: **I get up at seven.** **We work in Tel Aviv.**

      הצורה זהה ל־I, you, we ו־they. (עם he ו־she מוסיפים s, ביחידה הבאה.)

      שלילה: **don't** לפני הפועל. **I don't work on Saturday.**

      שאלה: **Do** בהתחלה. **Do you work on Sunday?** ועונים **Yes, I do.** או **No, I don't.**
    examples:
      - { text: "I have breakfast at eight.", translation: "אני אוכל ארוחת בוקר בשמונה." }
      - { text: "They don't work on Friday.", translation: "הם לא עובדים ביום שישי." }
      - { text: "Do you go to bed early? No, I don't.", translation: "את הולכת לישון מוקדם? לא." }

