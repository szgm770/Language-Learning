        type: dialogue
        scene: "בן מנסה לקבוע פגישה עם הצוות בישראל."
        lines:
          - { speaker: "ben", text: "Can we meet on Friday?", translation: "אפשר להיפגש ביום שישי?" }
          - { speaker: "noa", text: "Sorry, we don't work on Friday in Israel.", translation: "סליחה, אנחנו לא עובדים בשישי בישראל." }
          - { speaker: "ben", text: "Really? And on Sunday?", translation: "באמת? וביום ראשון?" }
