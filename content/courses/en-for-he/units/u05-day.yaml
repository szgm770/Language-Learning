          באנגליה ובארצות הברית עובדים מיום שני עד שישי, וה־weekend הוא שבת וראשון. Sunday הוא יום חופש.

          אז כשקובעים פגישה עם חו"ל, כדאי לבדוק מה זה "יום עבודה" אצלם.
      - id: u5-l4-12
        type: multiple_choice
        prompt: "באילו ימים עובדים בצוות של נועה?"
        options: [מראשון עד חמישי, משני עד שישי, כל יום]
        correct: 0
        lexemes: [sunday, thursday]
      - id: u5-l4-13
        type: fill_blank
        sentence: "We don't work ___ Saturday."
        translation: "אנחנו לא עובדים בשבת."
        answers: ["on"]
        options: ["on", "at", "in"]
        lexemes: [on-day, saturday]
      - id: u5-l4-14
        type: dialogue_gap
        lines:
          - { speaker: "rachel", text: "Do you work on Monday?", translation: "את עובדת ביום שני?" }
          - { speaker: "noa", text: "Yes, I do. I work from Sunday to Thursday.", translation: "כן. אני עובדת מראשון עד חמישי." }
        gap: 1
