id: u05-day
cefr: A1
scene: day
title:
  he: היום שלי
  en: My day
story: "בן ונועה משווים את סדר היום שלהם: מתי קמים, מתי עובדים, ולמה בישראל עובדים ביום ראשון."
canDo:
  - לתאר את סדר היום שלי
  - לשאול ולהגיד מה השעה
  - להגיד באיזה יום משהו קורה
  - לשאול שאלות עם do ולענות

