  - { id: "pharmacy", text: "pharmacy", translation: "בית מרקחת", pos: "noun", pronunciation: "פַארְמָסִי" }
  - { id: "supermarket", text: "supermarket", translation: "סופרמרקט", pos: "noun", pronunciation: "סוּפֶּרְמַרְקֶט" }
  - { id: "museum", text: "museum", translation: "מוזיאון", pos: "noun", pronunciation: "מְיוּזִיאֶם" }
  - { id: "park", text: "park", translation: "פארק, גן ציבורי", pos: "noun", pronunciation: "פַּארְק" }
  - { id: "left", text: "left", translation: "שמאלה, שמאל", pos: "adverb", pronunciation: "לֶפְט" }
  - { id: "right", text: "right", translation: "ימינה, ימין", pos: "adverb", pronunciation: "רַייט" }
  - { id: "straight-on", text: "straight on", translation: "ישר", pos: "phrase", pronunciation: "סְטְרֵייט אוֹן" }
  - { id: "turn", text: "turn", translation: "לפנות", pos: "verb", pronunciation: "טֶרְן", example: { text: "Turn left.", translation: "פנה שמאלה." } }
  - { id: "next-to", text: "next to", translation: "ליד, צמוד ל־", pos: "preposition", pronunciation: "נֶקְסְט טוּ", example: { text: "The bank is next to the station.", translation: "הבנק ליד התחנה." } }
  - { id: "opposite", text: "opposite", translation: "מול", pos: "preposition", pronunciation: "אוֹפּוֹזִיט" }
  - { id: "near", text: "near", translation: "קרוב", pos: "adverb", pronunciation: "נִיר", example: { text: "Is it near here?", translation: "זה קרוב לכאן?" } }
  - { id: "far", text: "far", translation: "רחוק", pos: "adverb", pronunciation: "פַאר" }
  - { id: "there-is", text: "there is", translation: "יש (דבר אחד)", pos: "phrase", pronunciation: "דֶ'ר אִיז", example: { text: "There is a bank on this street.", translation: "יש בנק ברחוב הזה." } }
  - { id: "there-are", text: "there are", translation: "יש (כמה דברים)", pos: "phrase", pronunciation: "דֶ'ר אָר", example: { text: "There are two museums near here.", translation: "יש שני מוזיאונים קרוב לכאן." } }
  - { id: "is-there", text: "Is there…?", translation: "יש…? (שאלה)", pos: "phrase", pronunciation: "אִיז דֶ'ר", example: { text: "Is there a pharmacy near here?", translation: "יש בית מרקחת קרוב לכאן?" } }
  - { id: "here", text: "here", translation: "כאן", pos: "adverb", pronunciation: "הִיר" }

grammar:
  - id: there-is-are
    title: { he: "יש: There is, there are", en: "There is, there are" }
    explanation: |
      בעברית "יש בנק ברחוב" ו"יש שני בנקים" זה אותו "יש". באנגלית בוחרים לפי הכמות:

      - **There is** לדבר אחד: **There is a bank on this street.**
      - **There are** לכמה דברים: **There are two museums.**

      שאלה: הופכים את הסדר. **Is there a pharmacy near here?** ועונים **Yes, there is.** או **No, there isn't.**

      בדיבור מקצרים: **there's**.
    examples:
      - { text: "There's a supermarket next to the hotel.", translation: "יש סופרמרקט ליד המלון." }
      - { text: "There are three parks in this area.", translation: "יש שלושה פארקים באזור הזה." }
      - { text: "Is there a bank near here? No, there isn't.", translation: "יש בנק קרוב לכאן? לא." }

