id: u07-town
cefr: A1
scene: town
title:
  he: בעיר
  en: Around town
story: "ביום חופשי בלונדון, נועה מחפשת בית מרקחת, סופרמרקט ומוזיאון, ושואלת אנשים ברחוב איך מגיעים."
canDo:
  - לשאול איפה נמצא מקום בעיר
  - להבין ולתת הוראות הגעה פשוטות
  - לתאר מה יש באזור עם there is ו־there are
  - לפנות לאנשים בנימוס ברחוב

