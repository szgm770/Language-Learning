        title: "Lost ring found after 20 years"
        text: |
          A woman from Manchester has found her wedding ring, twenty years after she lost it.

          In 2005, Sarah Miller was working in her garden when she noticed that her ring was missing. She looked everywhere, but she couldn't find it. "I was so sad," she said. "My husband bought me a new one, but it wasn't the same."

          Last Sunday, while her grandson was playing in the garden, he found something small and shiny under a tree. It was the ring!

          "At first I didn't believe it," said Mrs. Miller. "Now I'm never going to take it off again."
        translation: |
          אישה ממנצ'סטר מצאה את טבעת הנישואים שלה, עשרים שנה אחרי שאיבדה אותה.

          ב־2005, שרה מילר עבדה בגינה שלה כשהבחינה שהטבעת שלה חסרה. היא חיפשה בכל מקום, אבל לא הצליחה למצוא אותה. "הייתי כל כך עצובה," היא אמרה. "בעלי קנה לי חדשה, אבל זה לא היה אותו דבר."

          ביום ראשון שעבר, בזמן שהנכד שלה שיחק בגינה, הוא מצא משהו קטן ונוצץ מתחת לעץ. זו הייתה הטבעת!

          "בהתחלה לא האמנתי," אמרה גברת מילר. "עכשיו אני אף פעם לא אוריד אותה שוב."
