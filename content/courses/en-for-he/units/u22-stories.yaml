grammar:
  - id: past-continuous
    title: { he: "באמצע משהו: I was cycling when…", en: "Past continuous vs past simple" }
    explanation: |
      בעברית מספרים סיפור בעבר אחד: "רכבתי לעבודה ופתאום נפלתי". באנגלית מבחינים בין שני סוגי עבר:

      - **עבר מתמשך** (was / were + ‎-ing): הרקע, מה שהיה **באמצע** לקרות.
        **I was cycling to work.** (הייתי באמצע רכיבה)
      - **עבר פשוט**: האירוע הקצר שקרה **באמצע** הרקע.
        **I fell.**

      מחברים אותם עם **when** (כש־) ו־**while** (בזמן ש־):
      - **I was cycling to work when I fell.**
      - **While I was presenting, I spilled my coffee.**

      בדרך כלל: **while** + עבר מתמשך, **when** + עבר פשוט.

      שאלה: **What were you doing when it happened?** (מה עשית כשזה קרה?)
    examples:
      - { text: "It was raining when I left the house.", translation: "ירד גשם כשיצאתי מהבית." }
      - { text: "While Noa was talking, the client's phone rang.", translation: "בזמן שנועה דיברה, הטלפון של הלקוח צלצל." }
      - { text: "What were you doing at eight o'clock? I was sleeping!", translation: "מה עשית בשמונה? ישנתי!" }

