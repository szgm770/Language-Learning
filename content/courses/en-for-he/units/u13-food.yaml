    exercises:
      - id: u13-l5-01
        type: reading
        kind: "מתכון"
        title: "Easy shakshuka (for 2)"
        text: |
          You need: 4 eggs, 3 tomatoes, 1 red pepper, 1 onion, some olive oil, a little salt and some bread.

          First, cut the onion and the pepper and cook them in a pan with some oil for five minutes.

          Then add the tomatoes and a little salt. Cook for ten minutes.

          After that, make four small holes and put an egg in each one. Cook for six or seven minutes.

          Eat it with fresh bread. It's simple and delicious!
        translation: |
          צריך: 4 ביצים, 3 עגבניות, פלפל אדום אחד, בצל אחד, קצת שמן זית, קצת מלח וקצת לחם.

          קודם, חותכים את הבצל והפלפל ומבשלים אותם במחבת עם קצת שמן חמש דקות.

          אחר כך מוסיפים את העגבניות וקצת מלח. מבשלים עשר דקות.

          אחרי זה עושים ארבעה חורים קטנים ושמים ביצה בכל אחד. מבשלים שש או שבע דקות.

          אוכלים עם לחם טרי. זה פשוט וטעים מאוד!
