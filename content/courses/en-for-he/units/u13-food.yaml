        scene: "נועה מתכננת ארוחת שישי ומתקשרת לבן."
        lines:
          - { speaker: "noa", text: "I'm at the supermarket. Do you eat meat?", translation: "אני בסופר. אתה אוכל בשר?" }
          - { speaker: "ben", text: "Yes, but Rachel doesn't. She eats fish.", translation: "כן, אבל רחל לא. היא אוכלת דגים." }
          - { speaker: "noa", text: "OK. I'll make chicken and fish, with rice and vegetables.", translation: "בסדר. אני אכין עוף ודג, עם אורז וירקות." }
          - { speaker: "ben", text: "Sounds delicious! Can I bring some fruit?", translation: "נשמע טעים! אפשר להביא פירות?" }
          - { speaker: "noa", text: "Yes, please. And some bread!", translation: "כן, בבקשה. וגם לחם!" }
