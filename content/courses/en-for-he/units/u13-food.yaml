id: u13-food
cefr: A2
scene: food
title:
  he: אוכל ובישול
  en: Food and cooking
story: "נועה מזמינה את בן ורחל לארוחת שישי בדירה החדשה. היא קונה מצרכים בסופר, מבשלת לפי מתכון של אמא שלה, ובסוף כולם הולכים גם למסעדה."
