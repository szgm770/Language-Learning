grammar:
  - id: countable-uncountable
    title: { he: "סופרים או לא סופרים: some, any, much, many", en: "Countable and uncountable" }
    explanation: |
      באנגלית מחלקים את שמות העצם לשניים:

      - **סופרים**: אפשר להגיד "שלוש" לפניהם, ויש להם רבים: **an egg, three eggs**.
      - **לא סופרים**: חומרים ונוזלים, בלי רבים ובלי a: **milk, rice, bread, sugar**. לא אומרים "a bread" או "breads".

      **some** (קצת, כמה) במשפט חיובי: **I need some eggs. I need some milk.**
      **any** בשאלה ובשלילה: **Do we have any milk? We don't have any eggs.**

      וכשרוצים לשאול "כמה":
      - **How many** לדברים שסופרים: **How many eggs?**
      - **How much** לדברים שלא סופרים: **How much rice?**

      **a lot of** מתאים לשניהם: **a lot of eggs, a lot of milk**.
    examples:
      - { text: "We need some bread and some eggs.", translation: "אנחנו צריכים קצת לחם וכמה ביצים." }
      - { text: "Is there any sugar? No, there isn't any.", translation: "יש סוכר? לא, אין בכלל." }
      - { text: "How much milk do you want?", translation: "כמה חלב אתה רוצה?" }

