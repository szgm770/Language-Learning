          20, 30, 40… נגמרים ב־ty ומודגשים בהתחלה: TWENty, FIFty. ככה שומעים את ההבדל בין fifteen ל־fifty.

          מספר כמו 25 נבנה מעשרים + חמש: twenty-five.
