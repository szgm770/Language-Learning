id: u03-family
cefr: A1
scene: family
title:
  he: משפחה וחברים
  en: Family and friends
story: "נועה מראה לבן תמונות של המשפחה שלה, ובן מספר על אחותו רחל."
canDo:
  - להציג בני משפחה וחברים
  - להגיד של מי משהו (שלו, שלה, שלנו)
  - לשאול בן כמה מישהו ולענות
  - לספור עד 100

