grammar:
  - id: possessives
    title: { he: "של מי: his, her, our, their", en: "his, her, our, their" }
    explanation: |
      בעברית מוסיפים סיומת: אחותו, אחותה. באנגלית שמים מילה לפני השם:

      - **my** שלי, **your** שלך, **his** שלו, **her** שלה, **our** שלנו, **their** שלהם

      כשיש שם של אדם, מוסיפים **'s**: **Ben's sister** – האחות של בן. **Noa's family** – המשפחה של נועה.

      שימו לב ל־his ו־her: הבחירה תלויה במי ש"מחזיק", לא בדבר עצמו. **his sister** – האחות שלו.
    examples:
      - { text: "Her name is Rachel.", translation: "קוראים לה רחל." }
      - { text: "This is Ben's sister.", translation: "זו האחות של בן." }
      - { text: "Our parents are from Haifa.", translation: "ההורים שלנו מחיפה." }

