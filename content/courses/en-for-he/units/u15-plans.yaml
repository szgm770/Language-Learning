grammar:
  - id: going-to-future
    title: { he: "עתיד עם going to", en: "Going to" }
    explanation: |
      בעברית אומרים "אני הולכת לבקר את ההורים". באנגלית זה כמעט אותו דבר: **I'm going to visit my parents.**

      משתמשים ב־**going to** לתוכניות שכבר החלטנו עליהן.

      המבנה: **am / is / are + going to + פועל**
      - **I'm going to** start a course.
      - **She's going to** save money.
      - **We're going to** travel next month.

      שאלה: מקדימים את am / is / are: **Are you going to visit Israel?**
      שלילה: **I'm not going to work tomorrow.**

      בדיבור מהיר going to נשמע לפעמים כמו "גוֹנָה" (gonna). זה בסדר לשמוע, אבל בכתיבה כותבים going to.
    examples:
      - { text: "I'm going to learn to cook.", translation: "אני הולך ללמוד לבשל." }
      - { text: "Are they going to move next year?", translation: "הם הולכים לעבור דירה בשנה הבאה?" }
      - { text: "Ben isn't going to come tomorrow.", translation: "בן לא הולך לבוא מחר." }

