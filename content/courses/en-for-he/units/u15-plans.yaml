id: u15-plans
cefr: A2
scene: day
title:
  he: תוכניות וחלומות
  en: Plans and dreams
story: "סוף השנה מתקרב. נועה, בן ורחל מדברים על התוכניות שלהם: חופשה, לימודים, חיסכון, וגם חלום אחד גדול."
