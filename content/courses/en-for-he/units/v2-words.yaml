      text: I need to fill in an application to open an account.
      translation: אני צריכה למלא בקשה לפתוח חשבון.
    - speaker: ben
      text: In theory it takes ten minutes. In reality, an hour.
      translation: בתיאוריה זה לוקח עשר דקות. במציאות, שעה.
    - speaker: noa
      text: 'There''s one condition: a letter from my employer.'
      translation: 'יש תנאי אחד: מכתב מהמעסיק שלי.'
    - speaker: ben
      text: This is your first attempt. Don't worry, you'll catch on fast.
      translation: זה הניסיון הראשון שלך. אל תדאגי, תקלטי מהר.
