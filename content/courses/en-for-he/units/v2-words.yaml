id: v2-words
cefr: B1
scene: town
title:
  he: מסתדרים בלונדון
  en: Settling in London
story: 'נועה מסתדרת בלונדון: פותחת חשבון בבנק, לומדת לנסוע ברכבת התחתית, ונוסעת עם הצוות ליום ראשון בחוף הים. לפני שהיא מתחילה בעבודה, יש עוד הרבה מה ללמוד.'
canDo:
- לדבר על בנק, טפסים ובקשות
- לדבר על תחבורה וטיולים
- לספר על זיכרונות ועל חוויות חדשות
vocabulary:
- id: theory
  text: theory
  translation: תיאוריה
  pos: noun
  example:
    text: In theory, the form is simple.
    translation: בתיאוריה, הטופס פשוט.
- id: catch
  text: catch
  translation: לתפוס
  pos: verb
  example:
    text: Noa ran to catch the bus.
    translation: נועה רצה לתפוס את האוטובוס.
- id: coast
  text: coast
  translation: חוף, קו חוף
  pos: noun
  example:
    text: On Sunday the team drove to the coast.
    translation: ביום ראשון הצוות נסע לחוף.
- id: economy
  text: economy
  translation: כלכלה
  pos: noun
  example:
    text: The bank clerk talked about the British economy.
    translation: פקיד הבנק דיבר על הכלכלה הבריטית.
- id: mission
  text: mission
  translation: משימה
  pos: noun
  example:
    text: 'Her mission this week: open a bank account.'
    translation: 'המשימה שלה השבוע: לפתוח חשבון בנק.'
- id: application
  text: application
  translation: בקשה, אפליקציה
  pos: noun
  example:
    text: She filled in the application in English.
    translation: היא מילאה את הבקשה באנגלית.
- id: condition
  text: condition
  translation: מצב, תנאי
  pos: noun
  example:
    text: The flat is in good condition.
    translation: הדירה במצב טוב.
- id: freedom
  text: freedom
  translation: חופש
  pos: noun
  example:
    text: Living alone gives Noa a lot of freedom.
    translation: החיים לבד נותנים לנועה הרבה חופש.
- id: attempt
  text: attempt
  translation: ניסיון; לנסות
  pos: noun
  example:
    text: On her second attempt, the card worked.
    translation: בניסיון השני, הכרטיס עבד.
- id: channel
  text: channel
  translation: ערוץ
  pos: noun
  example:
    text: She found a news channel in Hebrew.
    translation: היא מצאה ערוץ חדשות בעברית.
- id: protection
  text: protection
  translation: הגנה
  pos: noun
  example:
    text: Take an umbrella for protection from the rain.
    translation: קחי מטרייה להגנה מהגשם.
- id: ride
  text: ride
  translation: נסיעה; לרכב
  pos: noun
  example:
    text: The ride to the office takes forty minutes.
    translation: הנסיעה למשרד לוקחת ארבעים דקות.
- id: serve
  text: serve
  translation: להגיש, לשרת
  pos: verb
  example:
    text: Does the café near the station serve kosher food?
    translation: האם בית הקפה ליד התחנה מגיש אוכל כשר?
- id: speech
  text: speech
  translation: נאום
  pos: noun
  example:
    text: The manager gave a short speech to the new team.
    translation: המנהל נשא נאום קצר לצוות החדש.
- id: partner
  text: partner
  translation: שותף
  pos: noun
  example:
    text: Ben is Noa's partner on the project.
    translation: בן הוא השותף של נועה בפרויקט.
- id: structure
  text: structure
  translation: מבנה
  pos: noun
  example:
    text: The structure of the Tube map is simple.
    translation: המבנה של מפת הרכבת פשוט.
- id: traditional
  text: traditional
  translation: מסורתי
  pos: adjective
  example:
    text: They ate a traditional English breakfast with eggs and beans.
    translation: הם אכלו ארוחת בוקר אנגלית מסורתית עם ביצים ושעועית.
- id: brand
  text: brand
  translation: מותג
  pos: noun
  example:
    text: Which brand of tea do you like?
    translation: איזה מותג תה אתה אוהב?
- id: critical
  text: critical
  translation: קריטי, ביקורתי
  pos: adjective
  example:
    text: It is critical to arrive on time.
    translation: קריטי להגיע בזמן.
- id: digital
  text: digital
  translation: דיגיטלי
  pos: adjective
  example:
    text: She paid with a digital card.
    translation: היא שילמה בכרטיס דיגיטלי.
- id: mental
  text: mental
  translation: נפשי, מנטלי
  pos: adjective
  example:
    text: Moving is a mental challenge as well.
    translation: מעבר הוא גם אתגר נפשי.
- id: mouth
  text: mouth
  translation: פה
  pos: noun
  example:
    text: The cake melted in her mouth.
    translation: העוגה נמסה לה בפה.
- id: realize
  text: realize
  translation: להבין, לשים לב
  pos: verb
  example:
    text: Noa didn't realize how tired she was.
    translation: נועה לא הבינה כמה היא עייפה.
- id: remain
  text: remain
  translation: להישאר
  pos: verb
  example:
    text: Please remain on the train until the last stop.
    translation: בבקשה הישארו ברכבת עד התחנה האחרונה.
- id: scale
  text: scale
  translation: קנה מידה, סולם
  pos: noun
  example:
    text: The scale of the city surprised her.
    translation: גודלה של העיר הפתיע אותה.
- id: score
  text: score
  translation: ציון, תוצאה
  pos: noun
  example:
    text: Eli got the best score in the game.
    translation: אלי השיג את התוצאה הכי טובה במשחק.
- id: separate
  text: separate
  translation: נפרד; להפריד
  pos: adjective
  example:
    text: Keep the meat and milk dishes separate.
    translation: תשמרי את כלי הבשר והחלב נפרדים.
- id: surface
  text: surface
  translation: משטח, פני השטח
  pos: noun
  example:
    text: The surface of the sea was calm.
    translation: פני הים היו רגועים.
- id: throw
  text: throw
  translation: לזרוק
  pos: verb
  example:
    text: Don't throw the bread; give it to the birds.
    translation: אל תזרוק את הלחם; תן אותו לציפורים.
- id: fashion
  text: fashion
  translation: אופנה
  pos: noun
  example:
    text: London fashion is very different from Tel Aviv.
    translation: האופנה בלונדון שונה מאוד מתל אביב.
- id: hill
  text: hill
  translation: גבעה
  pos: noun
  example:
    text: There is a green hill behind the station.
    translation: יש גבעה ירוקה מאחורי התחנה.
- id: metal
  text: metal
  translation: מתכת
  pos: noun
  example:
    text: The bench is made of metal.
    translation: הספסל עשוי ממתכת.
- id: profile
  text: profile
  translation: פרופיל
  pos: noun
  example:
    text: Noa updated her profile on the work website.
    translation: נועה עדכנה את הפרופיל שלה באתר העבודה.
- id: pull
  text: pull
  translation: למשוך
  pos: verb
  example:
    text: Pull the door, don't push it.
    translation: תמשכי את הדלת, אל תדחפי אותה.
- id: target
  text: target
  translation: יעד, מטרה
  pos: noun
  example:
    text: Her target is to speak English like a Londoner.
    translation: המטרה שלה היא לדבר אנגלית כמו לונדונית.
- id: memory
  text: memory
  translation: זיכרון
  pos: noun
  example:
    text: The smell of challah brought back a memory of home.
    translation: ריח החלה העלה זיכרון מהבית.
- id: supply
  text: supply
  translation: אספקה; לספק
  pos: noun
  example:
    text: The kosher shop gets a new supply every Thursday.
    translation: החנות הכשרה מקבלת אספקה חדשה בכל יום חמישי.
- id: weird
  text: weird
  translation: מוזר
  pos: adjective
  example:
    text: It's weird to see cars on the left side of the road.
    translation: מוזר לראות מכוניות בצד שמאל של הכביש.
- id: variety
  text: variety
  translation: מגוון
  pos: noun
  example:
    text: The market has a great variety of fruit.
    translation: בשוק יש מבחר גדול של פירות.
