id: v2-words
cefr: B1
scene: study
title:
  he: הרחבת אוצר מילים 2
  en: Word builder 2
story: עוד מילים חשובות בשימוש יומיומי, מקובצות בשיעורים קצרים. כל מילה מופיעה במשפט, ואחר כך מתרגלים אותה.
canDo:
- להבין ולהשתמש במילים נפוצות נוספות
- לזהות את המילים במשפטים אמיתיים
vocabulary:
- id: theory
  text: theory
  translation: תיאוריה
  pos: noun
  example:
    text: This theory explains the results.
    translation: התיאוריה הזו מסבירה את התוצאות.
- id: catch
  text: catch
  translation: לתפוס
  pos: verb
  example:
    text: Try to catch the ball.
    translation: נסו לתפוס את הכדור.
- id: coast
  text: coast
  translation: חוף, קו חוף
  pos: noun
  example:
    text: We drove along the coast.
    translation: נסענו לאורך החוף.
- id: economy
  text: economy
  translation: כלכלה
  pos: noun
  example:
    text: The economy is growing slowly.
    translation: הכלכלה צומחת לאט.
- id: mission
  text: mission
  translation: משימה
  pos: noun
  example:
    text: Our mission is to help students.
    translation: המשימה שלנו היא לעזור לתלמידים.
- id: application
  text: application
  translation: בקשה, אפליקציה
  pos: noun
  example:
    text: I sent my application yesterday.
    translation: שלחתי את הבקשה שלי אתמול.
- id: condition
  text: condition
  translation: מצב, תנאי
  pos: noun
  example:
    text: The car is in good condition.
    translation: המכונית במצב טוב.
- id: freedom
  text: freedom
  translation: חופש
  pos: noun
  example:
    text: Freedom of speech is important.
    translation: חופש הביטוי חשוב.
- id: attempt
  text: attempt
  translation: ניסיון; לנסות
  pos: noun
  example:
    text: It was a good attempt.
    translation: זה היה ניסיון טוב.
- id: channel
  text: channel
  translation: ערוץ
  pos: noun
  example:
    text: Change the channel, please.
    translation: החלף ערוץ, בבקשה.
- id: protection
  text: protection
  translation: הגנה
  pos: noun
  example:
    text: Wear a hat for protection from the sun.
    translation: חבשו כובע להגנה מהשמש.
- id: ride
  text: ride
  translation: נסיעה; לרכב
  pos: noun
  example:
    text: Thanks for the ride home.
    translation: תודה על הנסיעה הביתה.
- id: serve
  text: serve
  translation: להגיש, לשרת
  pos: verb
  example:
    text: They serve breakfast until ten.
    translation: הם מגישים ארוחת בוקר עד עשר.
- id: speech
  text: speech
  translation: נאום
  pos: noun
  example:
    text: He gave a short speech at the wedding.
    translation: הוא נשא נאום קצר בחתונה.
- id: partner
  text: partner
  translation: שותף
  pos: noun
  example:
    text: My business partner lives in Haifa.
    translation: השותף העסקי שלי גר בחיפה.
- id: structure
  text: structure
  translation: מבנה
  pos: noun
  example:
    text: The structure of the building is old.
    translation: המבנה של הבניין ישן.
- id: traditional
  text: traditional
  translation: מסורתי
  pos: adjective
  example:
    text: We ate a traditional dinner.
    translation: אכלנו ארוחת ערב מסורתית.
- id: brand
  text: brand
  translation: מותג
  pos: noun
  example:
    text: This brand is very popular.
    translation: המותג הזה מאוד פופולרי.
- id: critical
  text: critical
  translation: קריטי, ביקורתי
  pos: adjective
  example:
    text: It is critical to finish on time.
    translation: קריטי לסיים בזמן.
- id: digital
  text: digital
  translation: דיגיטלי
  pos: adjective
  example:
    text: I bought a digital camera.
    translation: קניתי מצלמה דיגיטלית.
- id: mental
  text: mental
  translation: נפשי, מנטלי
  pos: adjective
  example:
    text: Sleep is important for mental health.
    translation: שינה חשובה לבריאות הנפש.
- id: mouth
  text: mouth
  translation: פה
  pos: noun
  example:
    text: Open your mouth, please.
    translation: פתחו את הפה, בבקשה.
- id: realize
  text: realize
  translation: להבין, לשים לב
  pos: verb
  example:
    text: I did not realize it was so late.
    translation: לא שמתי לב שזה כל כך מאוחר.
- id: remain
  text: remain
  translation: להישאר
  pos: verb
  example:
    text: Please remain seated.
    translation: אנא הישארו במקומותיכם.
- id: scale
  text: scale
  translation: קנה מידה, סולם
  pos: noun
  example:
    text: On a scale of one to ten, I give it nine.
    translation: בסולם של אחת עד עשר, אני נותן לזה תשע.
- id: score
  text: score
  translation: ציון, תוצאה
  pos: noun
  example:
    text: What was the final score?
    translation: מה הייתה התוצאה הסופית?
- id: separate
  text: separate
  translation: נפרד; להפריד
  pos: adjective
  example:
    text: We have separate rooms.
    translation: יש לנו חדרים נפרדים.
- id: surface
  text: surface
  translation: משטח, פני השטח
  pos: noun
  example:
    text: The surface of the table is clean.
    translation: משטח השולחן נקי.
- id: throw
  text: throw
  translation: לזרוק
  pos: verb
  example:
    text: Do not throw paper on the floor.
    translation: אל תזרקו נייר על הרצפה.
- id: fashion
  text: fashion
  translation: אופנה
  pos: noun
  example:
    text: She works in the fashion industry.
    translation: היא עובדת בתעשיית האופנה.
- id: hill
  text: hill
  translation: גבעה
  pos: noun
  example:
    text: Our house is on a hill.
    translation: הבית שלנו על גבעה.
- id: metal
  text: metal
  translation: מתכת
  pos: noun
  example:
    text: The box is made of metal.
    translation: הקופסה עשויה ממתכת.
- id: profile
  text: profile
  translation: פרופיל
  pos: noun
  example:
    text: Please update your profile.
    translation: אנא עדכנו את הפרופיל שלכם.
- id: pull
  text: pull
  translation: למשוך
  pos: verb
  example:
    text: Pull the door, don't push it.
    translation: משכו את הדלת, אל תדחפו.
- id: target
  text: target
  translation: יעד, מטרה
  pos: noun
  example:
    text: We reached our target this month.
    translation: הגענו ליעד שלנו החודש.
- id: memory
  text: memory
  translation: זיכרון
  pos: noun
  example:
    text: I have a good memory for faces.
    translation: יש לי זיכרון טוב לפרצופים.
- id: supply
  text: supply
  translation: אספקה; לספק
  pos: noun
  example:
    text: We need a new supply of paper.
    translation: אנחנו צריכים אספקה חדשה של נייר.
- id: weird
  text: weird
  translation: מוזר
  pos: adjective
  example:
    text: That is a weird noise.
    translation: זה רעש מוזר.
- id: variety
  text: variety
  translation: מגוון
  pos: noun
  example:
    text: The shop sells a variety of cheese.
    translation: החנות מוכרת מגוון גבינות.
