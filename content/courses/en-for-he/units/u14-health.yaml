grammar:
  - id: should-advice
    title: { he: "עצות: should ו־shouldn't", en: "Should and shouldn't" }
    explanation: |
      כשנותנים עצה בעברית אומרים "כדאי לך" או "כדאי ש…". באנגלית יש מילה אחת: **should**.

      - **You should rest.** (כדאי שתנוח)
      - **You shouldn't go to work.** (לא כדאי שתלך לעבודה)

      כמו **can**, גם **should** לא משתנה לפי הגוף, ואחריו בא הפועל בלי to:
      **She should drink water**, לא "she shoulds" ולא "should to drink".

      שאלה: **Should I call the doctor?** (כדאי שאתקשר לרופא?)

      ועוד דרך להגיד "יש לי" כשמדברים על מחלה: **I've got a cold / a headache / a fever.**
    examples:
      - { text: "You should drink a lot of water.", translation: "כדאי לך לשתות הרבה מים." }
      - { text: "He shouldn't eat sugar.", translation: "לא כדאי לו לאכול סוכר." }
      - { text: "Should I take this medicine?", translation: "כדאי שאקח את התרופה הזאת?" }

