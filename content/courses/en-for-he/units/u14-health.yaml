id: u14-health
cefr: A2
scene: health
title:
  he: אצל הרופא
  en: At the doctor's
story: "החורף הראשון של נועה בלונדון. היא מתעוררת עם כאב גרון וחום, קובעת תור אצל ד\"ר שטרן ומקבלת עצות, גם מבן וגם מאמא."
