    type: dialogue
    scene: טקס קביעת מזוזה. כל הצוות, רחל, וסבא שמעון.
    lines:
    - speaker: saba
      text: I brought this mezuzah from the farm in Kent. Miriam asked me to give it to you.
      translation: הבאתי את המזוזה הזאת מהחווה בקנט. מרים ביקשה שאתן לך אותה.
    - speaker: noa
      text: Grandpa, I'm unable to speak. That's the most creative gift in the world.
      translation: סבא, אני לא מסוגלת לדבר. זו המתנה הכי מקורית בעולם.
    - speaker: rachel
      text: Don't be upset, it's tears of joy. A reasonable amount of tears.
      translation: אל תתרגשי, אלה דמעות שמחה. כמות סבירה של דמעות.
    - speaker: saba
      text: An empty office is just walls. With a mezuzah, it's a home.
      translation: משרד ריק הוא רק קירות. עם מזוזה, הוא בית.
