id: v6-words
cefr: C1
scene: work
title:
  he: פותחים את הדלת
  en: Opening the door
story: 'לפני הפתיחה: ויכוחים על גיוס עובדים, בירוקרטיה מול משרד ממשלתי, ביקור של ראש העירייה, ובסוף טקס קביעת מזוזה. סבא שמעון מגיע עם הפתעה.'
canDo:
- לנהל ויכוח ולהציג עמדה
- לדבר על תקשורת, ממשלה ובירוקרטיה
- לנאום בטקס ולהביע רגשות
vocabulary:
- id: argument
  text: argument
  translation: ויכוח, טיעון
  pos: noun
  example:
    text: David had a strong argument.
    translation: לדוד היה טיעון חזק.
- id: conflict
  text: conflict
  translation: סכסוך, התנגשות
  pos: noun
  example:
    text: A good manager knows how to handle conflict.
    translation: מנהלת טובה יודעת לטפל בסכסוך.
- id: debate
  text: debate
  translation: דיון; לדון
  pos: noun
  example:
    text: The team had a long debate about salaries.
    translation: לצוות היה דיון ארוך על משכורות.
- id: documents
  text: documents
  translation: מסמכים
  pos: noun
  example:
    text: Tamar signed all the documents.
    translation: תמר חתמה על כל המסמכים.
- id: escape
  text: escape
  translation: לברוח; מילוט
  pos: verb
  example:
    text: There is no escape from paperwork.
    translation: אין מנוס מניירת.
- id: phase
  text: phase
  translation: שלב
  pos: noun
  example:
    text: In the first phase they will hire two people.
    translation: בשלב הראשון הם יגייסו שני אנשים.
- id: requirements
  text: requirements
  translation: דרישות
  pos: noun
  example:
    text: What are the requirements for the job?
    translation: מהן הדרישות לתפקיד?
- id: revenue
  text: revenue
  translation: הכנסות
  pos: noun
  example:
    text: Revenue grew in the second month.
    translation: ההכנסות גדלו בחודש השני.
- id: secure
  text: secure
  translation: בטוח; להבטיח
  pos: adjective
  example:
    text: They need to secure a big client.
    translation: הם צריכים להבטיח לקוח גדול.
- id: strange
  text: strange
  translation: מוזר
  pos: adjective
  example:
    text: It was strange to work without Ben.
    translation: היה מוזר לעבוד בלי בן.
- id: talent
  text: talent
  translation: כישרון
  pos: noun
  example:
    text: Tamar has a talent for finance.
    translation: לתמר יש כישרון לכספים.
- id: blame
  text: blame
  translation: להאשים; אשמה
  pos: verb
  example:
    text: Nobody is to blame for the delay.
    translation: אף אחד לא אשם בעיכוב.
- id: coverage
  text: coverage
  translation: סיקור, כיסוי
  pos: noun
  example:
    text: The local news gave the opening some coverage.
    translation: החדשות המקומיות סיקרו את הפתיחה.
- id: display
  text: display
  translation: תצוגה; להציג
  pos: noun
  example:
    text: The display showed their number in the queue.
    translation: הצג הראה את המספר שלהם בתור.
- id: incredible
  text: incredible
  translation: מדהים, לא ייאמן
  pos: adjective
  example:
    text: The view from the roof is incredible.
    translation: הנוף מהגג מדהים.
- id: inspired
  text: inspired
  translation: מתרגש, מקבל השראה
  pos: adjective
  example:
    text: The old building inspired the whole team.
    translation: הבניין הישן נתן השראה לכל הצוות.
- id: ministry
  text: ministry
  translation: משרד ממשלתי
  pos: noun
  example:
    text: They needed a permit from the ministry.
    translation: הם היו צריכים אישור מהמשרד הממשלתי.
- id: mode
  text: mode
  translation: מצב, אופן
  pos: noun
  example:
    text: Noa switched her phone to silent mode.
    translation: נועה העבירה את הטלפון למצב שקט.
- id: obvious
  text: obvious
  translation: ברור
  pos: adjective
  example:
    text: The answer was obvious to everyone.
    translation: התשובה הייתה ברורה לכולם.
- id: remaining
  text: remaining
  translation: שנותר
  pos: adjective
  example:
    text: They used the remaining time to plan.
    translation: הם ניצלו את הזמן שנותר לתכנון.
- id: vision
  text: vision
  translation: חזון, ראייה
  pos: noun
  example:
    text: Noa explained her vision for the office.
    translation: נועה הסבירה את החזון שלה למשרד.
- id: crisis
  text: crisis
  translation: משבר
  pos: noun
  example:
    text: The team stayed calm during the crisis.
    translation: הצוות נשאר רגוע בזמן המשבר.
- id: literature
  text: literature
  translation: ספרות
  pos: noun
  example:
    text: The mayor loves Hebrew literature.
    translation: ראש העירייה אוהב ספרות עברית.
- id: mayor
  text: mayor
  translation: ראש עירייה
  pos: noun
  example:
    text: The mayor visited the new office.
    translation: ראש העירייה ביקר במשרד החדש.
- id: theme
  text: theme
  translation: נושא, רעיון מרכזי
  pos: noun
  example:
    text: The theme of the evening was old and new.
    translation: הנושא של הערב היה ישן וחדש.
- id: tiny
  text: tiny
  translation: זעיר
  pos: adjective
  example:
    text: Noa's office is tiny but bright.
    translation: המשרד של נועה זעיר אבל מואר.
- id: typically
  text: typically
  translation: בדרך כלל
  pos: adverb
  example:
    text: The team typically meets on Sunday morning.
    translation: הצוות בדרך כלל נפגש ביום ראשון בבוקר.
- id: capable
  text: capable
  translation: מסוגל
  pos: adjective
  example:
    text: Noa is capable of leading a large team.
    translation: נועה מסוגלת להוביל צוות גדול.
- id: desire
  text: desire
  translation: רצון, תשוקה
  pos: noun
  example:
    text: She has a strong desire to succeed.
    translation: יש לה רצון חזק להצליח.
- id: familiar
  text: familiar
  translation: מוכר
  pos: adjective
  example:
    text: Mr. Cohen's voice sounded familiar.
    translation: הקול של מר כהן נשמע מוכר.
- id: relevant
  text: relevant
  translation: רלוונטי
  pos: adjective
  example:
    text: Mr. Cohen asked only relevant questions.
    translation: מר כהן שאל רק שאלות רלוונטיות.
- id: seek
  text: seek
  translation: לחפש, לבקש
  pos: verb
  example:
    text: They seek people who love to learn.
    translation: הם מחפשים אנשים שאוהבים ללמוד.
- id: unable
  text: unable
  translation: לא מסוגל
  pos: adjective
  example:
    text: Noa was unable to hold back her tears.
    translation: נועה לא הצליחה לעצור את הדמעות.
- id: upset
  text: upset
  translation: נסער, מוטרד
  pos: adjective
  example:
    text: Rachel was not upset; she was moved.
    translation: רחל לא הייתה נסערת; היא הייתה נרגשת.
- id: creative
  text: creative
  translation: יצירתי
  pos: adjective
  example:
    text: Tamar has a creative idea for the opening.
    translation: לתמר יש רעיון יצירתי לפתיחה.
- id: extreme
  text: extreme
  translation: קיצוני
  pos: adjective
  example:
    text: The heat in August can be extreme.
    translation: החום באוגוסט יכול להיות קיצוני.
- id: threat
  text: threat
  translation: איום
  pos: noun
  example:
    text: The storm was a threat to the old roof.
    translation: הסערה הייתה איום על הגג הישן.
- id: empty
  text: empty
  translation: ריק
  pos: adjective
  example:
    text: Without people, the office felt empty.
    translation: בלי אנשים, המשרד הרגיש ריק.
- id: instance
  text: instance
  translation: מקרה, דוגמה
  pos: noun
  example:
    text: For instance, every door has a mezuzah.
    translation: לדוגמה, על כל דלת יש מזוזה.
- id: reasonable
  text: reasonable
  translation: סביר, הגיוני
  pos: adjective
  example:
    text: The rent is reasonable for Jaffa.
    translation: השכירות סבירה ליפו.
