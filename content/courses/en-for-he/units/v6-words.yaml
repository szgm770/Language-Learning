    - speaker: tamar
      text: And the revenue? We can't secure two salaries yet.
      translation: והכנסות? אנחנו עוד לא יכולים להבטיח שתי משכורות.
    - speaker: noa
      text: This isn't a conflict. It's a healthy debate. Let's look at the requirements.
      translation: זה לא סכסוך. זה דיון בריא. בואו נסתכל על הדרישות.
    - speaker: david
      text: Strange. Every time we argue, we end up agreeing.
      translation: מוזר. כל פעם שאנחנו מתווכחים, בסוף אנחנו מסכימים.
