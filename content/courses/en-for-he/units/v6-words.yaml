id: v6-words
cefr: C1
scene: study
title:
  he: הרחבת אוצר מילים 6
  en: Word builder 6
story: עוד מילים חשובות בשימוש יומיומי, מקובצות בשיעורים קצרים. כל מילה מופיעה במשפט, ואחר כך מתרגלים אותה.
canDo:
- להבין ולהשתמש במילים נפוצות נוספות
- לזהות את המילים במשפטים אמיתיים
vocabulary:
- id: argument
  text: argument
  translation: ויכוח, טיעון
  pos: noun
  example:
    text: They had an argument about money.
    translation: היה להם ויכוח על כסף.
- id: conflict
  text: conflict
  translation: סכסוך, התנגשות
  pos: noun
  example:
    text: There was a conflict between the two teams.
    translation: היה סכסוך בין שתי הקבוצות.
- id: debate
  text: debate
  translation: דיון; לדון
  pos: noun
  example:
    text: There was a long debate about the budget.
    translation: היה דיון ארוך על התקציב.
- id: documents
  text: documents
  translation: מסמכים
  pos: noun
  example:
    text: Bring all the documents to the meeting.
    translation: הביאו את כל המסמכים לפגישה.
- id: escape
  text: escape
  translation: לברוח; מילוט
  pos: verb
  example:
    text: The bird tried to escape from the cage.
    translation: הציפור ניסתה לברוח מהכלוב.
- id: phase
  text: phase
  translation: שלב
  pos: noun
  example:
    text: This is the last phase of the project.
    translation: זה השלב האחרון של הפרויקט.
- id: requirements
  text: requirements
  translation: דרישות
  pos: noun
  example:
    text: Check the requirements before you apply.
    translation: בדקו את הדרישות לפני שאתם מגישים בקשה.
- id: revenue
  text: revenue
  translation: הכנסות
  pos: noun
  example:
    text: The company's revenue grew this year.
    translation: הכנסות החברה גדלו השנה.
- id: secure
  text: secure
  translation: בטוח; להבטיח
  pos: adjective
  example:
    text: Keep your password secure.
    translation: שמרו על הסיסמה שלכם בטוחה.
- id: strange
  text: strange
  translation: מוזר
  pos: adjective
  example:
    text: I heard a strange sound.
    translation: שמעתי קול מוזר.
- id: talent
  text: talent
  translation: כישרון
  pos: noun
  example:
    text: She has a talent for music.
    translation: יש לה כישרון למוזיקה.
- id: blame
  text: blame
  translation: להאשים; אשמה
  pos: verb
  example:
    text: Don't blame me for the delay.
    translation: אל תאשימו אותי בעיכוב.
- id: coverage
  text: coverage
  translation: סיקור, כיסוי
  pos: noun
  example:
    text: The news gave full coverage of the event.
    translation: החדשות סיקרו את האירוע במלואו.
- id: display
  text: display
  translation: תצוגה; להציג
  pos: noun
  example:
    text: The shop has a nice display in the window.
    translation: בחנות יש תצוגה יפה בחלון.
- id: incredible
  text: incredible
  translation: מדהים, לא ייאמן
  pos: adjective
  example:
    text: The view was incredible.
    translation: הנוף היה מדהים.
- id: inspired
  text: inspired
  translation: מתרגש, מקבל השראה
  pos: adjective
  example:
    text: I felt inspired by her story.
    translation: קיבלתי השראה מהסיפור שלה.
- id: ministry
  text: ministry
  translation: משרד ממשלתי
  pos: noun
  example:
    text: She works at the Ministry of Education.
    translation: היא עובדת במשרד החינוך.
- id: mode
  text: mode
  translation: מצב, אופן
  pos: noun
  example:
    text: Put your phone in silent mode.
    translation: העבירו את הטלפון למצב שקט.
- id: obvious
  text: obvious
  translation: ברור
  pos: adjective
  example:
    text: The answer is obvious.
    translation: התשובה ברורה.
- id: remaining
  text: remaining
  translation: שנותר
  pos: adjective
  example:
    text: The remaining tickets are on sale.
    translation: הכרטיסים שנותרו למכירה.
- id: vision
  text: vision
  translation: חזון, ראייה
  pos: noun
  example:
    text: He has a clear vision for the company.
    translation: יש לו חזון ברור לחברה.
- id: crisis
  text: crisis
  translation: משבר
  pos: noun
  example:
    text: The company is facing a crisis.
    translation: החברה ניצבת מול משבר.
- id: literature
  text: literature
  translation: ספרות
  pos: noun
  example:
    text: She studies English literature.
    translation: היא לומדת ספרות אנגלית.
- id: mayor
  text: mayor
  translation: ראש עירייה
  pos: noun
  example:
    text: The mayor opened the new school.
    translation: ראש העירייה פתח את בית הספר החדש.
- id: theme
  text: theme
  translation: נושא, רעיון מרכזי
  pos: noun
  example:
    text: The theme of the party is the sea.
    translation: נושא המסיבה הוא הים.
- id: tiny
  text: tiny
  translation: זעיר
  pos: adjective
  example:
    text: The baby has tiny hands.
    translation: לתינוק יש ידיים זעירות.
- id: typically
  text: typically
  translation: בדרך כלל
  pos: adverb
  example:
    text: Typically, we start at nine.
    translation: בדרך כלל אנחנו מתחילים בתשע.
- id: capable
  text: capable
  translation: מסוגל
  pos: adjective
  example:
    text: She is capable of great things.
    translation: היא מסוגלת לדברים גדולים.
- id: desire
  text: desire
  translation: רצון, תשוקה
  pos: noun
  example:
    text: He has a strong desire to learn.
    translation: יש לו רצון חזק ללמוד.
- id: familiar
  text: familiar
  translation: מוכר
  pos: adjective
  example:
    text: Your face looks familiar.
    translation: הפנים שלך נראות מוכרות.
- id: relevant
  text: relevant
  translation: רלוונטי
  pos: adjective
  example:
    text: Is this information relevant?
    translation: האם המידע הזה רלוונטי?
- id: seek
  text: seek
  translation: לחפש, לבקש
  pos: verb
  example:
    text: Seek help if you need it.
    translation: בקשו עזרה אם אתם צריכים.
- id: unable
  text: unable
  translation: לא מסוגל
  pos: adjective
  example:
    text: I am unable to attend the meeting.
    translation: אני לא יכול להגיע לפגישה.
- id: upset
  text: upset
  translation: נסער, מוטרד
  pos: adjective
  example:
    text: She was upset about the news.
    translation: היא הייתה נסערת מהחדשות.
- id: creative
  text: creative
  translation: יצירתי
  pos: adjective
  example:
    text: He is a very creative child.
    translation: הוא ילד יצירתי מאוד.
- id: extreme
  text: extreme
  translation: קיצוני
  pos: adjective
  example:
    text: The weather was extreme this week.
    translation: מזג האוויר היה קיצוני השבוע.
- id: threat
  text: threat
  translation: איום
  pos: noun
  example:
    text: Pollution is a threat to the sea.
    translation: זיהום הוא איום על הים.
- id: empty
  text: empty
  translation: ריק
  pos: adjective
  example:
    text: The fridge is empty.
    translation: המקרר ריק.
- id: instance
  text: instance
  translation: מקרה, דוגמה
  pos: noun
  example:
    text: For instance, you can call me.
    translation: למשל, אפשר להתקשר אליי.
- id: reasonable
  text: reasonable
  translation: סביר, הגיוני
  pos: adjective
  example:
    text: The price is reasonable.
    translation: המחיר סביר.
