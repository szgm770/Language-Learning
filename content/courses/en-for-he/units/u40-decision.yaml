  - id: u40-l5
    kind: reading
    title: { he: "סיום פרק", en: "The end of a chapter" }
    exercises:
      - id: u40-l5-01
        type: reading
        kind: "סיפור קצר"
        title: "Coming home"
        text: |
          Noa's plane landed at Ben Gurion Airport on a warm spring morning. She had been dreaming of this moment for months, and now it felt almost unreal.

          While she was waiting for her suitcase, she remembered the day she had left. She had been so nervous that she had forgotten her passport at home, and her mother had run after the taxi with it in her hand. Everybody had laughed about it later.

          Now her family was waiting outside. Her mother was crying, her father was holding a sign that said "Welcome home, Manager!", and her little brother was filming everything on his phone.

          "I wish you had come sooner," her mother whispered. Noa smiled. "I don't," she said. "If I hadn't gone, I wouldn't have learned so much. I have no regrets."

          She picked up her suitcase and walked out into the sunshine. A new chapter had begun.
        translation: |
          המטוס של נועה נחת בנתב"ג בבוקר אביבי וחם. היא חלמה על הרגע הזה חודשים, ועכשיו זה כמעט לא נראה אמיתי.

          בזמן שחיכתה למזוודה, היא נזכרה ביום שבו עזבה. היא הייתה כל כך לחוצה שהשאירה את הדרכון בבית, ואמה רצה אחרי המונית עם הדרכון ביד. כולם צחקו על זה אחר כך.

          עכשיו משפחתה חיכתה בחוץ. אמה בכתה, אביה החזיק שלט שאמר "ברוכה השבה הביתה, מנהלת!", ואחיה הקטן צילם הכול בטלפון.

          "הלוואי שהיית באה מוקדם יותר", לחשה אמה. נועה חייכה. "אני לא", אמרה. "אילו לא הייתי נוסעת, לא הייתי לומדת כל כך הרבה. אין לי חרטות."

          היא הרימה את המזוודה ויצאה אל השמש. פרק חדש התחיל.
      - id: u40-l5-02
        type: multiple_choice
