grammar:
  - id: narrative-tenses
    title: { he: "זמני עבר בסיפור", en: "Narrative tenses" }
    explanation: |
      בסיפור משלבים כמה זמני עבר, וכל אחד אומר משהו אחר:

      | זמן | מה הוא עושה בסיפור | דוגמה |
      |---|---|---|
      | **past simple** | האירועים עצמם, אחד אחרי השני | *She opened the door and walked in.* |
      | **past continuous** | הרקע והתהליך שהיה באותו רגע | *It was raining while she waited.* |
      | **past perfect** | מה שקרה **לפני** האירוע | *She had decided before he called.* |
      | **past perfect continuous** | תהליך ארוך שהיה **לפני** האירוע | *She had been thinking about it for weeks.* |

      טיפ: **used to** ו-**would** מתארים הרגלים בעבר: *We used to meet every Friday.*
    examples:
      - { text: "When Noa arrived, the party had already started.", translation: "כשנועה הגיעה, המסיבה כבר התחילה." }
      - { text: "She was packing while Ben was making coffee.", translation: "היא ארזה בזמן שבן הכין קפה." }
      - { text: "She had been thinking about it for months before she decided.", translation: "היא חשבה על זה חודשים לפני שהחליטה." }

