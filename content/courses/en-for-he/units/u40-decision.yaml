  # ------------------------------------------------------------------ 1
  - id: u40-l1
    kind: new
    title: { he: "הצעה מתל אביב", en: "An offer from Tel Aviv" }
    exercises:
      - id: u40-l1-01
        type: dialogue
        scene: "המשרד של מר כהן. ההחלטה הגדולה."
        lines:
          - { speaker: "cohen", text: "Noa, we're opening a new office in Tel Aviv. I would like you to lead it.", translation: "נועה, אנחנו פותחים משרד חדש בתל אביב. אני רוצה שתעמדי בראשו." }
          - { speaker: "noa", text: "That's a big decision. Can I weigh it up for a few days?", translation: "זו החלטה גדולה. אפשר לשקול אותה כמה ימים?" }
          - { speaker: "cohen", text: "Of course. You would have to relocate in the spring.", translation: "בוודאי. תצטרכי לעבור באביב." }
          - { speaker: "noa", text: "I have been thinking about home for months. But London has been my home for five years.", translation: "אני חושבת על הבית כבר חודשים. אבל לונדון הייתה הבית שלי חמש שנים." }
          - { speaker: "cohen", text: "Follow your heart. We will support you either way.", translation: "לכי אחרי הלב. נתמוך בך בכל מקרה." }
      - { id: "u40-l1-02", type: "learn", lexeme: "decision" }
      - { id: "u40-l1-03", type: "learn", lexeme: "weigh-up" }
      - { id: "u40-l1-04", type: "learn", lexeme: "relocate" }
      - { id: "u40-l1-05", type: "learn", lexeme: "make-up-your-mind" }
