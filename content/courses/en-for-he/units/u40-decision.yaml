  he: ההחלטה
  en: The decision
story: "הגיע הרגע. נועה צריכה להחליט אם להישאר בלונדון או לחזור הביתה ולנהל את המשרד החדש בתל אביב. פרק הסיום של הסיפור, ומבחן רמה B2."
