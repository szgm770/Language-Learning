  - { id: "right-now", text: "right now", translation: "ממש עכשיו", pos: "phrase", pronunciation: "רַייט נַאוּ" }
  - { id: "at-the-moment", text: "at the moment", translation: "כרגע", pos: "phrase", pronunciation: "אֶט דֶ'ה מוֹמֶנְט" }
  - { id: "wait", text: "wait", translation: "לחכות", pos: "verb", pronunciation: "וֵויט" }
