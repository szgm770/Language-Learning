          - { speaker: "noa", text: "Hang on… I'm at the supermarket. I'm paying right now.", translation: "רגע… אני בסופר. אני משלמת עכשיו." }
          - { speaker: "ben", text: "No problem. Can you call me back?", translation: "אין בעיה. את יכולה לחזור אליי?" }
          - { speaker: "noa", text: "Sure. Sorry, I can't hear you. My battery is low!", translation: "בטח. סליחה, אני לא שומעת אותך. הסוללה שלי נגמרת!" }
          - { speaker: "ben", text: "OK, text me later!", translation: "בסדר, תשלחי לי הודעה אחר כך!" }
