      - id: u18-l1-10
        type: multiple_choice
        prompt: "מה נועה עושה כשבן מתקשר?"
        options: [משלמת בסופר, מבשלת, עובדת]
        correct: 0
        lexemes: [right-now]
      - id: u18-l1-11
        type: match_pairs
