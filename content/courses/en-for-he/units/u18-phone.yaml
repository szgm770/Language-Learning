id: u18-phone
cefr: A2
scene: tech
title:
  he: ממש עכשיו
  en: Right now
story: "יום עמוס בטלפון: הסוללה של נועה נגמרת, הלפטופ לא מתחבר, ובן מתקשר בדיוק כשהיא באמצע משהו. מה כל אחד עושה עכשיו?"
canDo:
  - לדבר בטלפון ולבקש לחכות רגע
  - לספר מה אני עושה עכשיו
  - להבחין בין "בדרך כלל" ל"עכשיו" (הווה פשוט והווה מתמשך)
  - לדבר על בעיות פשוטות בטלפון ובמחשב

