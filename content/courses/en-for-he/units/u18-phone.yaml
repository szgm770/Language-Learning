      - id: u18-l1-13
        type: word_bank
        prompt: "אפשר להתקשר אליך אחר כך?"
        answers: ["Can I call you later?"]
        distractors: [back, text]
        lexemes: [call]
      - id: u18-l1-14
        type: speak_repeat
        text: "Hang on, I can't hear you!"
        translation: "רגע, אני לא שומע אותך!"
