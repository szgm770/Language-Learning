grammar:
  - id: present-continuous
    title: { he: "עכשיו או בדרך כלל: I'm working, I work", en: "Present continuous vs present simple" }
    explanation: |
      בעברית "אני עובדת" יכול להיות עכשיו וגם בדרך כלל. באנגלית יש שתי צורות:

      - **עכשיו, ברגע זה**: **am / is / are + פועל עם ‎-ing**
        **I'm working right now. She's talking on the phone.**
      - **בדרך כלל, הרגל**: הווה פשוט, שכבר למדנו
        **I work every day. She talks a lot.**

      מילים שעוזרות לזהות: **now, right now, at the moment** → ‎-ing. **every day, usually, always** → הווה פשוט.

      שאלה: **Are you working?** שלילה: **I'm not working at the moment.**

      איות: **write → writing** (בלי e), **sit → sitting** (מכפילים).
    examples:
      - { text: "Ben is cooking dinner right now.", translation: "בן מבשל ארוחת ערב עכשיו." }
      - { text: "Ben cooks every Friday.", translation: "בן מבשל כל יום שישי." }
      - { text: "What are you doing? I'm waiting for the bus.", translation: "מה אתה עושה? אני מחכה לאוטובוס." }

lessons:
  # ------------------------------------------------------------------ 1
  - id: u18-l1
    kind: new
    title: { he: "רגע, אני באמצע", en: "Hang on, I'm busy" }
    exercises:
      - id: u18-l1-01
        type: dialogue
        scene: "בן מתקשר לנועה. היא בסופר."
        lines:
          - { speaker: "ben", text: "Hi Noa, are you busy?", translation: "היי נועה, את עסוקה?" }
          - { speaker: "noa", text: "Hang on… I'm at the supermarket. I'm paying right now.", translation: "רגע… אני בסופר. אני משלמת עכשיו." }
          - { speaker: "ben", text: "No problem. Can you call me back?", translation: "אין בעיה. את יכולה לחזור אליי?" }
          - { speaker: "noa", text: "Sure. Sorry, I can't hear you. My battery is low!", translation: "בטח. סליחה, אני לא שומעת אותך. הסוללה שלי נגמרת!" }
          - { speaker: "ben", text: "OK, text me later!", translation: "בסדר, תשלחי לי הודעה אחר כך!" }
      - { id: "u18-l1-02", type: "learn", lexeme: "phone" }
      - { id: "u18-l1-03", type: "learn", lexeme: "call" }
      - { id: "u18-l1-04", type: "learn", lexeme: "hang-on" }
      - { id: "u18-l1-05", type: "learn", lexeme: "right-now" }
      - { id: "u18-l1-06", type: "learn", lexeme: "call-back" }
      - { id: "u18-l1-07", type: "learn", lexeme: "cant-hear-you" }
      - { id: "u18-l1-08", type: "learn", lexeme: "battery" }
