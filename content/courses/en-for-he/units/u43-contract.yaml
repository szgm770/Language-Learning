  - id: u43-l5-01
    type: reading
    kind: סעיף מחוזה
    title: 'Clause 9: Liability and termination'
    text: '9.1 Each party shall comply with all applicable regulations and shall keep confidential any information it receives from the other party.


      9.2 Should either party breach this agreement, the other party shall be entitled to compensation. Had the breach been caused by events beyond a party''s control, no compensation shall be due.


      9.3 This agreement is binding on both parties. Neither party may terminate it without thirty days'' written notice, except where a serious breach has occurred. It is essential that any amendment be made in writing and signed by both parties.


      9.4 Any dispute shall be resolved through discussion before legal action is taken. Each party may waive its right to compensation in writing.

      '
    translation: '9.1 כל צד יפעל בהתאם לכל התקנות הרלוונטיות וישמור בסוד כל מידע שהוא מקבל מהצד השני.


      9.2 אם אחד הצדדים יפר את ההסכם, הצד השני יהיה זכאי לפיצוי. אילו ההפרה נגרמה בשל אירועים שמחוץ לשליטת הצד, לא ישולם פיצוי.


      9.3 ההסכם מחייב את שני הצדדים. אף צד אינו רשאי לסיים אותו ללא הודעה בכתב שלושים יום מראש, למעט כשהתרחשה הפרה חמורה. חיוני שכל תיקון ייעשה בכתב ויחתם על ידי שני הצדדים.


      9.4 כל מחלוקת תיפתר בדיון לפני נקיטת הליך משפטי. כל צד רשאי לוותר בכתב על זכותו לפיצוי.

      '
