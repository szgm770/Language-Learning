grammar:
- id: subjunctive
  title:
    he: 'שפה משפטית: subjunctive והיפוך תנאי'
    en: Subjunctive and formal conditionals
  explanation: 'בשפה רשמית ומשפטית יש שני מבנים חשובים:


    **1. Subjunctive** אחרי פעלים ותארים של דרישה והמלצה (*insist, demand, suggest, recommend, essential, vital*): הפועל חוזר לצורה הבסיסית, **גם בגוף שלישי יחיד**, בלי s:

    - "It is essential that he **be** present. (לא: is)"

    - The contract requires that she **sign** by Friday.

    - We insist that the payment **be** made on time.


    **2. תנאי רשמי בלי if** (היפוך):

    - **Should** you need more information, call us. (= If you should need…)

    - **Were** I in your position, I would sign. (= If I were…)

    - **Had** we known, we would have acted. (= If we had known…)


    בעברית אין הבחנה כזו; בחוזים באנגלית מצפים לה.'
  examples:
  - text: It is essential that the client sign the contract.
    translation: חיוני שהלקוח יחתום על החוזה.
  - text: Should you have any questions, please contact us.
    translation: אם יהיו לכם שאלות, אנא פנו אלינו.
  - text: Had we read the clause carefully, we would have noticed the problem.
    translation: אילו קראנו את הסעיף בעיון, היינו מבחינים בבעיה.
