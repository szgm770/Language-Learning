    type: dialogue
    scene: נמל התעופה בן גוריון. דוד מחכה לנועה.
    lines:
    - speaker: david
      text: Welcome back! The crew from the London office sent you flowers.
      translation: ברוכה השבה! הצוות מהמשרד בלונדון שלח לך פרחים.
    - speaker: noa
      text: I intended to rest for a week. Instead, we start tomorrow.
      translation: התכוונתי לנוח שבוע. במקום זה, מתחילים מחר.
    - speaker: david
      text: We need to ensure the office makes a profit in the first year.
      translation: אנחנו צריכים לוודא שהמשרד ירוויח בשנה הראשונה.
    - speaker: noa
      text: First we need an office. With a historical building, if possible.
      translation: קודם צריך משרד. בבניין היסטורי, אם אפשר.
