  - id: v5-l2-d1
    type: dialogue
    scene: ביפו העתיקה. תמר מראה לנועה ולדוד בניין אבן.
    lines:
    - speaker: tamar
      text: This building is ancient. Two hundred years, at a minimum.
      translation: הבניין הזה עתיק. מאתיים שנה, לפחות.
    - speaker: noa
      text: I love it. But is it connected to fast internet?
      translation: אני אוהבת אותו. אבל הוא מחובר לאינטרנט מהיר?
    - speaker: david
      text: Communication is our business. Without internet, it's a joke.
      translation: תקשורת זה העסק שלנו. בלי אינטרנט, זו בדיחה.
    - speaker: tamar
      text: 'Don''t jump to conclusions. The owner is a hero: he''ll fix everything.'
      translation: 'אל תקפוץ למסקנות. הבעלים הוא גיבור: הוא יתקן הכול.'
