id: v5-words
cefr: C1
scene: work
title:
  he: משרד חדש ביפו
  en: A new office in Jaffa
story: נועה חוזרת לתל אביב להקים את המשרד החדש. היא מחפשת מקום, מוצאת בניין עתיק ביפו, ומתחילה בשיפוץ עם דוד ותמר. לא הכול הולך לפי התוכנית.
canDo:
- לדבר על מעבר, תקציב ורווח
- לתאר בניין היסטורי ושיפוץ
- לדבר על תכנון, מימון ותחזוקה
vocabulary:
- id: border
  text: border
  translation: גבול
  pos: noun
  example:
    text: The plane crossed the border into Israel.
    translation: המטוס חצה את הגבול לישראל.
- id: crew
  text: crew
  translation: צוות (בספינה/במטוס)
  pos: noun
  example:
    text: The crew of the London office sent flowers.
    translation: הצוות של המשרד בלונדון שלח פרחים.
- id: elements
  text: elements
  translation: מרכיבים, יסודות
  pos: noun
  example:
    text: Trust is one of the key elements of a good team.
    translation: אמון הוא אחד המרכיבים החשובים של צוות טוב.
- id: ensure
  text: ensure
  translation: להבטיח, לוודא
  pos: verb
  example:
    text: Please ensure that every document is signed.
    translation: אנא ודאו שכל מסמך חתום.
- id: intended
  text: intended
  translation: מיועד, מכוון
  pos: adjective
  example:
    text: Noa intended to rest, but there was no time.
    translation: נועה התכוונה לנוח, אבל לא היה זמן.
- id: ocean
  text: ocean
  translation: אוקיינוס
  pos: noun
  example:
    text: After the ocean of London rain, Tel Aviv felt like summer.
    translation: אחרי אוקיינוס הגשם של לונדון, תל אביב הרגישה כמו קיץ.
- id: profit
  text: profit
  translation: רווח
  pos: noun
  example:
    text: The new office must make a profit within a year.
    translation: המשרד החדש חייב להרוויח תוך שנה.
- id: appearance
  text: appearance
  translation: מראה, הופעה
  pos: noun
  example:
    text: The appearance of the building matters to clients.
    translation: המראה של הבניין חשוב ללקוחות.
- id: domestic
  text: domestic
  translation: ביתי, מקומי
  pos: adjective
  example:
    text: Most of their clients are domestic companies.
    translation: רוב הלקוחות שלהם הם חברות מקומיות.
- id: historical
  text: historical
  translation: היסטורי
  pos: adjective
  example:
    text: They want an office in a historical building.
    translation: הם רוצים משרד בבניין היסטורי.
- id: jump
  text: jump
  translation: לקפוץ
  pos: verb
  example:
    text: Don't jump to conclusions about the building.
    translation: אל תקפוץ למסקנות לגבי הבניין.
- id: minimum
  text: minimum
  translation: מינימום
  pos: noun
  example:
    text: The rent is for a minimum of three years.
    translation: השכירות היא למינימום שלוש שנים.
- id: ancient
  text: ancient
  translation: עתיק
  pos: adjective
  example:
    text: The office is in an ancient stone building.
    translation: המשרד נמצא בבניין אבן עתיק.
- id: communication
  text: communication
  translation: תקשורת
  pos: noun
  example:
    text: Good communication saves time.
    translation: תקשורת טובה חוסכת זמן.
- id: connected
  text: connected
  translation: מחובר
  pos: adjective
  example:
    text: Is the building connected to fast internet?
    translation: הבניין מחובר לאינטרנט מהיר?
- id: express
  text: express
  translation: להביע; מהיר
  pos: verb
  example:
    text: Noa tried to express her excitement in a calm way.
    translation: נועה ניסתה להביע את ההתלהבות שלה בצורה רגועה.
- id: flow
  text: flow
  translation: זרימה; לזרום
  pos: noun
  example:
    text: The flow of people in the market never stops.
    translation: זרם האנשים בשוק לא נעצר אף פעם.
- id: hero
  text: hero
  translation: גיבור
  pos: noun
  example:
    text: The owner was the hero of the day.
    translation: הבעלים היה הגיבור של היום.
- id: joke
  text: joke
  translation: בדיחה
  pos: noun
  example:
    text: David made a joke about the old pipes.
    translation: דוד התבדח על הצינורות הישנים.
- id: loan
  text: loan
  translation: הלוואה
  pos: noun
  example:
    text: They took a small loan for the renovation.
    translation: הם לקחו הלוואה קטנה לשיפוץ.
- id: soft
  text: soft
  translation: רך
  pos: adjective
  example:
    text: Tamar chose a soft light for the entry.
    translation: תמר בחרה אור רך לכניסה.
- id: appeal
  text: appeal
  translation: משיכה; לפנות
  pos: noun
  example:
    text: The old building has a special appeal.
    translation: לבניין הישן יש קסם מיוחד.
- id: appropriate
  text: appropriate
  translation: מתאים, ראוי
  pos: adjective
  example:
    text: Is this colour appropriate for an old building?
    translation: הצבע הזה מתאים לבניין ישן?
- id: device
  text: device
  translation: מכשיר
  pos: noun
  example:
    text: They installed a security device at the door.
    translation: הם התקינו מכשיר אבטחה בדלת.
- id: drama
  text: drama
  translation: דרמה
  pos: noun
  example:
    text: There was some drama when a pipe burst.
    translation: הייתה קצת דרמה כשצינור התפוצץ.
- id: entry
  text: entry
  translation: כניסה, רשומה
  pos: noun
  example:
    text: The entry is through a small garden.
    translation: הכניסה היא דרך גינה קטנה.
- id: era
  text: era
  translation: תקופה, עידן
  pos: noun
  example:
    text: The building is from the Ottoman era.
    translation: הבניין מהתקופה העות׳מאנית.
- id: factor
  text: factor
  translation: גורם
  pos: noun
  example:
    text: Cost is an important factor in every decision.
    translation: עלות היא שיקול חשוב בכל החלטה.
- id: grant
  text: grant
  translation: מענק; להעניק
  pos: noun
  example:
    text: The city gave them a grant for the renovation.
    translation: העירייה נתנה להם מענק לשיפוץ.
- id: pool
  text: pool
  translation: בריכה
  pos: noun
  example:
    text: They have a pool of good workers to choose from.
    translation: יש להם מאגר של עובדים טובים לבחור מתוכו.
- id: route
  text: route
  translation: מסלול
  pos: noun
  example:
    text: The fastest route to Jaffa is along the sea.
    translation: הדרך המהירה ביותר ליפו היא לאורך הים.
- id: scientific
  text: scientific
  translation: מדעי
  pos: adjective
  example:
    text: They used a scientific method to plan the budget.
    translation: הם השתמשו בשיטה מדעית לתכנן את התקציב.
- id: storm
  text: storm
  translation: סערה
  pos: noun
  example:
    text: A winter storm damaged the roof.
    translation: סערת חורף פגעה בגג.
- id: strike
  text: strike
  translation: שביתה; לפגוע
  pos: noun
  example:
    text: A strike at the port delayed the furniture.
    translation: שביתה בנמל עיכבה את הרהיטים.
- id: equal
  text: equal
  translation: שווה
  pos: adjective
  example:
    text: Everyone has an equal voice in the team.
    translation: לכולם יש קול שווה בצוות.
- id: finance
  text: finance
  translation: מימון, כספים
  pos: noun
  example:
    text: Tamar is responsible for finance.
    translation: תמר אחראית על הכספים.
- id: identity
  text: identity
  translation: זהות
  pos: noun
  example:
    text: The office needs its own identity.
    translation: המשרד צריך זהות משלו.
- id: maintain
  text: maintain
  translation: לתחזק, לשמר
  pos: verb
  example:
    text: It is expensive to maintain an old building.
    translation: יקר לתחזק בניין ישן.
- id: numerous
  text: numerous
  translation: רבים
  pos: adjective
  example:
    text: They had numerous meetings with the city.
    translation: היו להם פגישות רבות עם העירייה.
- id: specifically
  text: specifically
  translation: במיוחד, בפירוט
  pos: adverb
  example:
    text: Noa asked specifically for a room with a window.
    translation: נועה ביקשה במיוחד חדר עם חלון.
