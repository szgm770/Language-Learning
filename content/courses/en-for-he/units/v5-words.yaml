id: v5-words
cefr: C1
scene: study
title:
  he: הרחבת אוצר מילים 5
  en: Word builder 5
story: עוד מילים חשובות בשימוש יומיומי, מקובצות בשיעורים קצרים. כל מילה מופיעה במשפט, ואחר כך מתרגלים אותה.
canDo:
- להבין ולהשתמש במילים נפוצות נוספות
- לזהות את המילים במשפטים אמיתיים
vocabulary:
- id: border
  text: border
  translation: גבול
  pos: noun
  example:
    text: We crossed the border at noon.
    translation: חצינו את הגבול בצהריים.
- id: crew
  text: crew
  translation: צוות (בספינה/במטוס)
  pos: noun
  example:
    text: The crew welcomed the passengers.
    translation: הצוות קיבל את פני הנוסעים.
- id: elements
  text: elements
  translation: מרכיבים, יסודות
  pos: noun
  example:
    text: Trust is one of the key elements of teamwork.
    translation: אמון הוא אחד המרכיבים המרכזיים בעבודת צוות.
- id: ensure
  text: ensure
  translation: להבטיח, לוודא
  pos: verb
  example:
    text: Please ensure that the door is locked.
    translation: אנא וודאו שהדלת נעולה.
- id: intended
  text: intended
  translation: מיועד, מכוון
  pos: adjective
  example:
    text: The gift was intended for my mother.
    translation: המתנה הייתה מיועדת לאמא שלי.
- id: ocean
  text: ocean
  translation: אוקיינוס
  pos: noun
  example:
    text: The ocean was calm in the morning.
    translation: האוקיינוס היה רגוע בבוקר.
- id: profit
  text: profit
  translation: רווח
  pos: noun
  example:
    text: The shop made a small profit.
    translation: החנות הרוויחה רווח קטן.
- id: appearance
  text: appearance
  translation: מראה, הופעה
  pos: noun
  example:
    text: His appearance has changed a lot.
    translation: המראה שלו השתנה מאוד.
- id: domestic
  text: domestic
  translation: ביתי, מקומי
  pos: adjective
  example:
    text: We offer domestic and international flights.
    translation: אנו מציעים טיסות מקומיות ובינלאומיות.
- id: historical
  text: historical
  translation: היסטורי
  pos: adjective
  example:
    text: It is a historical building.
    translation: זה בניין היסטורי.
- id: jump
  text: jump
  translation: לקפוץ
  pos: verb
  example:
    text: The children like to jump on the bed.
    translation: הילדים אוהבים לקפוץ על המיטה.
- id: minimum
  text: minimum
  translation: מינימום
  pos: noun
  example:
    text: You need a minimum of two hours.
    translation: צריך מינימום של שעתיים.
- id: ancient
  text: ancient
  translation: עתיק
  pos: adjective
  example:
    text: We visited an ancient city.
    translation: ביקרנו בעיר עתיקה.
- id: communication
  text: communication
  translation: תקשורת
  pos: noun
  example:
    text: Good communication saves time.
    translation: תקשורת טובה חוסכת זמן.
- id: connected
  text: connected
  translation: מחובר
  pos: adjective
  example:
    text: Is the printer connected to the network?
    translation: האם המדפסת מחוברת לרשת?
- id: express
  text: express
  translation: להביע; מהיר
  pos: verb
  example:
    text: It is hard to express my feelings.
    translation: קשה לי להביע את הרגשות שלי.
- id: flow
  text: flow
  translation: זרימה; לזרום
  pos: noun
  example:
    text: The flow of water was strong.
    translation: זרימת המים הייתה חזקה.
- id: hero
  text: hero
  translation: גיבור
  pos: noun
  example:
    text: My father is my hero.
    translation: אבא שלי הוא הגיבור שלי.
- id: joke
  text: joke
  translation: בדיחה
  pos: noun
  example:
    text: He told a funny joke.
    translation: הוא סיפר בדיחה מצחיקה.
- id: loan
  text: loan
  translation: הלוואה
  pos: noun
  example:
    text: They took a loan to buy a flat.
    translation: הם לקחו הלוואה לקניית דירה.
- id: soft
  text: soft
  translation: רך
  pos: adjective
  example:
    text: The bed is soft and warm.
    translation: המיטה רכה וחמה.
- id: appeal
  text: appeal
  translation: משיכה; לפנות
  pos: noun
  example:
    text: The idea has a wide appeal.
    translation: לרעיון יש משיכה רחבה.
- id: appropriate
  text: appropriate
  translation: מתאים, ראוי
  pos: adjective
  example:
    text: Wear appropriate clothes for the event.
    translation: לבשו בגדים מתאימים לאירוע.
- id: device
  text: device
  translation: מכשיר
  pos: noun
  example:
    text: Turn off your device before the flight.
    translation: כבו את המכשיר לפני הטיסה.
- id: drama
  text: drama
  translation: דרמה
  pos: noun
  example:
    text: We watched a drama about two families.
    translation: צפינו בדרמה על שתי משפחות.
- id: entry
  text: entry
  translation: כניסה, רשומה
  pos: noun
  example:
    text: Entry to the museum is free today.
    translation: הכניסה למוזיאון חינם היום.
- id: era
  text: era
  translation: תקופה, עידן
  pos: noun
  example:
    text: It was the era of big changes.
    translation: זה היה עידן של שינויים גדולים.
- id: factor
  text: factor
  translation: גורם
  pos: noun
  example:
    text: Price is an important factor.
    translation: המחיר הוא גורם חשוב.
- id: grant
  text: grant
  translation: מענק; להעניק
  pos: noun
  example:
    text: The school received a grant for books.
    translation: בית הספר קיבל מענק לספרים.
- id: pool
  text: pool
  translation: בריכה
  pos: noun
  example:
    text: The children are playing in the pool.
    translation: הילדים משחקים בבריכה.
- id: route
  text: route
  translation: מסלול
  pos: noun
  example:
    text: We took the shortest route.
    translation: לקחנו את המסלול הקצר ביותר.
- id: scientific
  text: scientific
  translation: מדעי
  pos: adjective
  example:
    text: This is a scientific discovery.
    translation: זו תגלית מדעית.
- id: storm
  text: storm
  translation: סערה
  pos: noun
  example:
    text: A storm is coming tonight.
    translation: סערה מתקרבת הלילה.
- id: strike
  text: strike
  translation: שביתה; לפגוע
  pos: noun
  example:
    text: The workers went on strike.
    translation: העובדים יצאו לשביתה.
- id: equal
  text: equal
  translation: שווה
  pos: adjective
  example:
    text: All people are equal.
    translation: כל בני האדם שווים.
- id: finance
  text: finance
  translation: מימון, כספים
  pos: noun
  example:
    text: She works in finance.
    translation: היא עובדת בתחום הכספים.
- id: identity
  text: identity
  translation: זהות
  pos: noun
  example:
    text: Please show your identity card.
    translation: אנא הציגו תעודת זהות.
- id: maintain
  text: maintain
  translation: לתחזק, לשמר
  pos: verb
  example:
    text: It is important to maintain a healthy life.
    translation: חשוב לשמור על אורח חיים בריא.
- id: numerous
  text: numerous
  translation: רבים
  pos: adjective
  example:
    text: There are numerous reasons.
    translation: יש סיבות רבות.
- id: specifically
  text: specifically
  translation: במיוחד, בפירוט
  pos: adverb
  example:
    text: I asked specifically for a window seat.
    translation: ביקשתי במיוחד מושב ליד החלון.
