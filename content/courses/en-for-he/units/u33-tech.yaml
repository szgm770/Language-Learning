  - id: u33-l5
    kind: reading
    title: { he: "ניסוי: שבוע בלי סמארטפון", en: "Experiment: a week without a smartphone" }
    exercises:
      - id: u33-l5-01
        type: reading
        kind: "טור אישי בעיתון"
        title: "I gave up my smartphone for a week. Here's what happened."
        text: |
          My screen time was over five hours a day, so I decided to try an experiment: one week with an old phone that could only make calls and send texts.

          The first two days were difficult. I kept reaching for my pocket. I had to ask strangers for directions, and I even had a paper map printed at the library.

          By day four, something had changed. I was reading books on the train. I noticed my neighbours. Conversations felt longer and, honestly, better.

          Not everything was positive. I missed two important emails, and I couldn't pay for parking, because everything is done through apps now.

          Am I giving up my smartphone for good? No. But I've had all my notifications switched off, and my screen time has been cut in half.
        translation: |
          זמן המסך שלי היה מעל חמש שעות ביום, אז החלטתי לנסות ניסוי: שבוע אחד עם טלפון ישן שיכול רק להתקשר ולשלוח הודעות.

          היומיים הראשונים היו קשים. כל הזמן הושטתי יד לכיס. הייתי צריך לבקש מזרים הוראות הגעה, ואפילו הדפסתי מפה מנייר בספרייה.

          עד היום הרביעי, משהו השתנה. קראתי ספרים ברכבת. שמתי לב לשכנים שלי. שיחות הרגישו ארוכות יותר ובכנות, טובות יותר.

          לא הכול היה חיובי. פספסתי שני מיילים חשובים, ולא יכולתי לשלם על חניה, כי הכול נעשה דרך אפליקציות היום.

          האם אני מוותר על הסמארטפון לתמיד? לא. אבל כיביתי את כל ההתראות, וזמן המסך שלי ירד בחצי.
      - id: u33-l5-02
        type: multiple_choice
        prompt: "מה היה הניסוי?"
        options: [שבוע עם טלפון ישן בלי אפליקציות, שבוע בלי טלפון בכלל, שבוע בלי מחשב]
        correct: 0
        lexemes: [screen-time]
      - id: u33-l5-03
        type: multiple_choice
        prompt: "מה השתנה ביום הרביעי?"
        options: [הוא קרא ספרים ושם לב לשכנים, הוא חזר לסמארטפון, הוא הפסיק לדבר עם אנשים]
        correct: 0
        lexemes: [neighbour]
      - id: u33-l5-04
        type: multiple_choice
        prompt: "מה היה שלילי?"
        options: [הוא פספס מיילים ולא יכל לשלם על חניה, הוא הלך לאיבוד, הוא היה בודד]
        correct: 0
        lexemes: [email]
      - id: u33-l5-05
        type: multiple_choice
        prompt: "מה התוצאה בסוף?"
        options: [זמן המסך ירד בחצי, הוא ויתר על הסמארטפון לתמיד, שום דבר לא השתנה]
        correct: 0
        lexemes: [being-done, screen-time]
      - id: u33-l5-06
        type: fill_blank
        sentence: "I even had a paper map ___ at the library. (print)"
        translation: "אפילו הדפסתי מפה מנייר בספרייה."
        answers: [printed]
        options: [printed, print, printing]
        lexemes: [have-it-done]
      - id: u33-l5-07
        type: fill_blank
        sentence: "Everything is ___ through apps now. (do)"
        translation: "הכול נעשה דרך אפליקציות היום."
        answers: [done]
        options: [done, did, doing]
        lexemes: [passive, app]
      - id: u33-l5-08
        type: word_bank
        prompt: "זמן המסך שלי ירד בחצי."
        answers: ["My screen time has been cut in half.", "My screen time was cut in half."]
        distractors: [being, cutting]
        lexemes: [being-done, screen-time]
      - id: u33-l5-09
        type: translate
        direction: to_target
        prompt: "היומיים הראשונים היו קשים."
        answers: ["The first two days were difficult.", "The first two days were hard."]
        lexemes: [were]
      - id: u33-l5-10
        type: speak_repeat
        text: "I've had all my notifications switched off."
        translation: "כיביתי את כל ההתראות שלי."
        lexemes: [have-it-done]

