        question: מה הבעיה שלו?
        options: [שש שעות מסך ביום, הטלפון שלו נפרץ, אין לו טלפון]
        correct: 0
        lexemes: [screen-time, addicted]
      - id: u33-l4-11
        type: dialogue_gap
        lines:
          - { speaker: "ben", text: "Did you see the news about chocolate curing colds?", translation: "ראית את החדשות על שוקולד שמרפא הצטננות?" }
          - { speaker: "tamar", text: "Careful, that's fake news. It's already been checked.", translation: "זהירות, אלה חדשות כזב. זה כבר נבדק." }
        gap: 1
