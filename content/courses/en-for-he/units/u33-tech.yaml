grammar:
  - id: causative-passive
    title: { he: "תיקנתי (אצל מישהו): have something done", en: "Causative and advanced passive" }
    explanation: |
      בעברית אומרים "תיקנתי את הטלפון" גם כשבעצם תיקנו אותו במעבדה. באנגלית מבדילים:
      - **I repaired my phone.** (אני תיקנתי, בעצמי)
      - **I had my phone repaired.** / **I got my phone repaired.** (מישהו אחר תיקן בשבילי)

      המבנה: **have / get + דבר + צורה שלישית**: **I'm having my hair cut. We got the windows cleaned.**

      **סביל בזמנים נוספים**:
      - עכשיו: **is / are being + V3**: **The servers are being updated.**
      - הווה מושלם: **has / have been + V3**: **My account has been hacked!**
      - עתיד: **will be + V3**: **The data will be protected.**
      - עם מודאלים: **can / should / must be + V3**: **Passwords should be changed regularly.**
    examples:
      - { text: "Ben had his account checked by David.", translation: "בן דאג שדוד יבדוק לו את החשבון." }
      - { text: "Your personal information is being protected.", translation: "המידע האישי שלך מוגן (בתהליך)." }
      - { text: "Thousands of jobs will be replaced by AI.", translation: "אלפי משרות יוחלפו על ידי בינה מלאכותית." }

lessons:
  # ------------------------------------------------------------------ 1
  - id: u33-l1
    kind: new
    title: { he: "החשבון שלי נפרץ!", en: "My account has been hacked!" }
    exercises:
      - id: u33-l1-01
        type: dialogue
        scene: "בוקר במשרד. בן נכנס בלחץ."
        lines:
          - { speaker: "ben", text: "David, help! My social media account has been hacked.", translation: "דוד, עזרה! החשבון שלי ברשת החברתית נפרץ." }
          - { speaker: "david", text: "OK, don't panic. Has any personal information been posted?", translation: "בסדר, בלי פאניקה. פורסם מידע אישי כלשהו?" }
          - { speaker: "ben", text: "Someone's sending messages to all my friends, asking for money!", translation: "מישהו שולח הודעות לכל החברים שלי ומבקש כסף!" }
          - { speaker: "david", text: "Classic. First, change all your passwords. I'll get your laptop checked too.", translation: "קלאסי. קודם, תשנה את כל הסיסמאות. אני גם אדאג שיבדקו לך את הלפטופ." }
          - { speaker: "ben", text: "I always thought my privacy was protected.", translation: "תמיד חשבתי שהפרטיות שלי מוגנת." }
          - { speaker: "david", text: "Only if you protect it. Did you use the same password for everything?", translation: "רק אם אתה מגן עליה. השתמשת באותה סיסמה לכל דבר?" }
          - { speaker: "ben", text: "…Maybe.", translation: "…אולי." }
      - { id: "u33-l1-02", type: "learn", lexeme: "social-media" }
      - { id: "u33-l1-03", type: "learn", lexeme: "account" }
      - { id: "u33-l1-04", type: "learn", lexeme: "hacked" }
      - { id: "u33-l1-05", type: "learn", lexeme: "personal-information" }
      - { id: "u33-l1-06", type: "learn", lexeme: "privacy" }
      - { id: "u33-l1-07", type: "learn", lexeme: "protect" }
      - id: u33-l1-08
        type: match_pairs
        pairs:
          - [social media, רשתות חברתיות]
          - [account, חשבון]
          - [hacked, נפרץ]
          - [privacy, פרטיות]
          - [protect, להגן]
        lexemes: [social-media, account, hacked, privacy, protect]
      - id: u33-l1-09
        type: multiple_choice
        prompt: "מה הפורץ עושה?"
        options: [שולח הודעות לחברים ומבקש כסף, מוחק תמונות, משנה את השם של בן]
        correct: 0
        lexemes: [hacked]
      - id: u33-l1-10
        type: multiple_choice
        prompt: "מה הטעות של בן?"
        options: [אותה סיסמה לכל דבר, הוא לא עדכן את הלפטופ, הוא פתח מייל חשוד]
        correct: 0
        lexemes: [password]
      - id: u33-l1-11
        type: listening_choice
        audioText: "Your personal information should be protected with a strong password."
        question: מה ההמלצה?
        options: [להגן על המידע עם סיסמה חזקה, לא להשתמש ברשתות חברתיות, לשתף פחות תמונות]
        correct: 0
        lexemes: [personal-information, protect]
      - id: u33-l1-12
        type: word_bank
        prompt: "החשבון שלי נפרץ."
        answers: ["My account has been hacked.", "My account was hacked."]
        distractors: [hack, is]
        lexemes: [account, hacked]
