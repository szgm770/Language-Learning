        options: [הן מתפשטות מהר יותר מהאמת, קל לזהות אותן, הן כבר לא בעיה]
        correct: 0
        lexemes: [fake-news, raise-concerns]
      - id: u33-l4-08
        type: multiple_choice
        prompt: "לפי תמר, מה הבעיה עם זמן מסך?"
        options: [האפליקציות מעוצבות כדי שנמשיך לגלול, הטלפונים זולים מדי, אנשים עובדים יותר מדי]
        correct: 0
        lexemes: [screen-time, addicted]
      - id: u33-l4-09
        type: multiple_choice
        prompt: "מה המסקנה של דוד?"
        options: [השאלה היא מה הטכנולוגיה צריכה לעשות, צריך להפסיק להשתמש בטכנולוגיה, הטכנולוגיה תמיד טובה]
        correct: 0
        lexemes: [should]
      - id: u33-l4-10
