      - id: u33-l4-05
        type: dialogue
        scene: "נועה מנחה פאנל בכנס טכנולוגיה בלונדון. משתתפים: דוד ותמר."
        lines:
          - { speaker: "noa", text: "Welcome, everyone. Today's question: is technology making our lives better or worse?", translation: "ברוכים הבאים. השאלה היום: האם הטכנולוגיה משפרת את חיינו או מרעה אותם?" }
          - { speaker: "tamar", text: "Better, mostly. Medical research is being transformed by AI. Diseases are being found earlier.", translation: "משפרת, בעיקר. מחקר רפואי משתנה בזכות בינה מלאכותית. מחלות מתגלות מוקדם יותר." }
          - { speaker: "david", text: "That's true. However, social media raises serious concerns. Fake news spreads faster than the truth.", translation: "זה נכון. עם זאת, הרשתות החברתיות מעוררות חששות רציניים. חדשות כזב מתפשטות מהר יותר מהאמת." }
          - { speaker: "noa", text: "And what about screen time? Are we addicted to our phones?", translation: "ומה עם זמן מסך? אנחנו מכורים לטלפונים שלנו?" }
          - { speaker: "tamar", text: "Some of us are. But the problem isn't the technology; it's how it's designed. Many apps are built to keep us scrolling.", translation: "חלק מאיתנו כן. אבל הבעיה היא לא הטכנולוגיה; היא איך שהיא מעוצבת. הרבה אפליקציות בנויות כדי שנמשיך לגלול." }
          - { speaker: "david", text: "Exactly. So the question isn't 'what can technology do', but 'what should it do'.", translation: "בדיוק. אז השאלה היא לא 'מה הטכנולוגיה יכולה לעשות', אלא 'מה היא צריכה לעשות'." }
      - id: u33-l4-06
        type: multiple_choice
        prompt: "איזו דוגמה חיובית תמר נותנת?"
        options: [מחלות מתגלות מוקדם יותר, רשתות חברתיות, אפליקציות חדשות]
        correct: 0
        lexemes: [being-done]
      - id: u33-l4-07
