id: u33-tech
cefr: B2
scene: tech
title:
  he: טכנולוגיה וחברה
  en: Tech and society
story: "החשבון של בן ברשת חברתית נפרץ, והצוות מתווכח על בינה מלאכותית, פרטיות וזמן מסך. נועה מנחה דיון בכנס, ומגלה שהשאלות הקשות הן לא טכניות."
canDo:
  - לדבר על בינה מלאכותית, פרטיות ורשתות חברתיות
  - להשתמש בסביל מתקדם (is being, has been, will be)
  - "להגיד שמישהו עשה משהו בשבילי (have / get something done)"
  - להציג טיעונים בעד ונגד

