        type: speak_repeat
        text: "Has any personal information been posted?"
        translation: "פורסם מידע אישי כלשהו?"
        lexemes: [personal-information]

  # ------------------------------------------------------------------ 2
  - id: u33-l2
    kind: new
    title: { he: "בינה מלאכותית: בעד ונגד", en: "AI: pros and cons" }
    exercises:
      - { id: "u33-l2-01", type: "learn", lexeme: "artificial-intelligence" }
      - { id: "u33-l2-02", type: "learn", lexeme: "data" }
      - { id: "u33-l2-03", type: "learn", lexeme: "algorithm" }
      - { id: "u33-l2-04", type: "learn", lexeme: "replace" }
      - { id: "u33-l2-05", type: "learn", lexeme: "automated" }
      - { id: "u33-l2-06", type: "learn", lexeme: "rely-on" }
      - { id: "u33-l2-07", type: "learn", lexeme: "pros-and-cons" }
      - { id: "u33-l2-08", type: "learn", lexeme: "on-one-hand" }
      - id: u33-l2-09
        type: dialogue
        scene: "ארוחת צהריים. תמר ודוד מתווכחים על בינה מלאכותית."
        lines:
          - { speaker: "tamar", text: "I use AI every day for design ideas. It saves me hours.", translation: "אני משתמשת בבינה מלאכותית כל יום לרעיונות עיצוב. זה חוסך לי שעות." }
          - { speaker: "david", text: "On the one hand, it's useful. On the other hand, a lot of jobs will be replaced.", translation: "מצד אחד, זה שימושי. מצד שני, הרבה משרות יוחלפו." }
          - { speaker: "tamar", text: "Some tasks will be automated, sure. But someone still has to make the decisions.", translation: "חלק מהמשימות יהפכו לאוטומטיות, בטח. אבל מישהו עדיין צריך לקבל את ההחלטות." }
          - { speaker: "david", text: "My worry is the data. These algorithms learn from our personal information.", translation: "הדאגה שלי היא הנתונים. האלגוריתמים האלה לומדים מהמידע האישי שלנו." }
          - { speaker: "tamar", text: "Fair point. We shouldn't rely on it for everything.", translation: "נקודה הוגנת. לא כדאי שנסמוך עליה בכל דבר." }
      - id: u33-l2-10
        type: match_pairs
        pairs:
          - [data, נתונים]
          - [replace, להחליף]
          - [automated, אוטומטי]
          - [rely on, לסמוך על]
          - [pros and cons, יתרונות וחסרונות]
        lexemes: [data, replace, automated, rely-on, pros-and-cons]
      - id: u33-l2-11
        type: multiple_choice
        prompt: "ממה דוד חושש?"
        options: [משרות יוחלפו והנתונים האישיים, שבינה מלאכותית יקרה מדי, שהיא לא עובדת טוב]
        correct: 0
        lexemes: [replace, data]
      - id: u33-l2-12
        type: dialogue_gap
        lines:
          - { speaker: "noa", text: "Should we use AI to answer our clients?", translation: "כדאי שנשתמש בבינה מלאכותית כדי לענות ללקוחות?" }
          - { speaker: "ben", text: "On the one hand, it's faster. On the other hand, clients want to talk to real people.", translation: "מצד אחד, זה מהיר יותר. מצד שני, לקוחות רוצים לדבר עם אנשים אמיתיים." }
        gap: 1
        distractors: ["On one side hand, it's faster. On other, clients want people.", "On the one hand, it's faster. However hand, clients want people."]
        lexemes: [on-one-hand, on-the-other-hand]
      - id: u33-l2-13
        type: translate
        direction: to_target
        prompt: "הרבה משימות יהפכו לאוטומטיות."
        answers: ["A lot of tasks will be automated.", "Many tasks will be automated.", "Lots of tasks will be automated."]
        lexemes: [automated, passive]
      - id: u33-l2-14
        type: translate
        direction: to_source
        prompt: "We shouldn't rely on AI for everything."
        answers: ["לא כדאי שנסמוך על בינה מלאכותית בכל דבר.", "לא כדאי לנו להסתמך על בינה מלאכותית בכל דבר.", "אסור לנו לסמוך על בינה מלאכותית בכל דבר."]
        lexemes: [rely-on, artificial-intelligence]
      - id: u33-l2-15
        type: speak_repeat
        text: "On the one hand, AI is useful. On the other hand, it raises a lot of questions."
        translation: "מצד אחד, בינה מלאכותית שימושית. מצד שני, היא מעוררת הרבה שאלות."
        lexemes: [on-one-hand, artificial-intelligence]

