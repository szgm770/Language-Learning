        lines:
          - { speaker: "miriam", text: "What do you do, Noa?", translation: "במה את עובדת, נועה?" }
          - { speaker: "noa", text: "I'm an engineer. And you?", translation: "אני מהנדסת. ואת?" }
          - { speaker: "miriam", text: "I'm a manager. And Ben is an engineer too.", translation: "אני מנהלת. וגם בן מהנדס." }
          - { speaker: "noa", text: "Do you like your job?", translation: "את אוהבת את העבודה שלך?" }
          - { speaker: "miriam", text: "Yes, I love it!", translation: "כן, אני מתה עליה!" }
