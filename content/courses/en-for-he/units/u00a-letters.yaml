id: u00a-letters
cefr: A0
scene: study
title:
  he: האלפבית האנגלי
  en: The English alphabet
story: "לפני שפוגשים את נועה ובן: מכירים את 26 האותיות, את השמות שלהן ואת הצליל הראשון של כל אחת. בסוף אפשר גם לאיית שם."
canDo:
  - לזהות את 26 האותיות באנגלית, גדולות וקטנות
  - להגיד את השם של כל אות
  - לשמוע את הצליל הראשון של מילה ולחבר אותו לאות
  - לאיית את השם שלי באותיות

vocabulary:
