      - id: u00a-l3-15
        type: tip
        title: W, V ו־Z – שלוש אותיות שקל לבלבל
        text: |
          **W** נקראת "דַאבֶּל־יוּ" (כלומר "U כפולה"), והצליל שלה בתוך מילה מעוגל כמו **או־ו** (water, we).
          **V** נקראת "וִי", והצליל שלה כמו ה־**ו** העברית הרגילה (very). **Z** נשמעת "זְ" ארוכה, כמו ב־zero.
