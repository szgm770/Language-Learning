lessons:
  - id: u00a-l1
    kind: new
    title: { he: "האותיות A–H", en: "Letters A–H" }
    exercises:
      - id: u00a-l1-01
        type: tip
        title: אותיות עם שם וצליל
        text: |
          באנגלית לכל אות יש **שם** (כמו "אֵיי" ל־A) ו**צליל** שהיא משמיעה בתוך מילה (A ב־Apple נשמעת "אֶ").
          אנחנו מתחילים בשמות. כל אות מופיעה בשתי צורות: **גדולה** (A) ו**קטנה** (a).
      - { id: "u00a-l1-02", type: "learn", lexeme: "l-a" }
      - { id: "u00a-l1-03", type: "learn", lexeme: "l-b" }
      - { id: "u00a-l1-04", type: "learn", lexeme: "l-c" }
      - { id: "u00a-l1-05", type: "learn", lexeme: "l-d" }
