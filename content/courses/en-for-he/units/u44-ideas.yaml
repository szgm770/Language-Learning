story: 'נועה מוזמנת להרצות באוניברסיטה על עבודה מרחוק. היא לומדת לדבר בזהירות אקדמית: לטעון בלי להגזים, להציג מגמות ולהשתמש בשמות עצם מופשטים.'
canDo:
- לדבר על מגמות, ראיות ומסקנות בשפה אקדמית
- להשתמש בזהירות מילולית (tend to, it appears that, arguably)
- להמיר פעלים לשמות עצם (decide → decision, grow → growth)
- לקרוא ולסכם טיעון כתוב
