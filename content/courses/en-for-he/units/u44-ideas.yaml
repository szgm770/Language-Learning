    en: The guest lecture
  exercises:
  - id: u44-l1-01
    type: dialogue
    scene: אחרי ההרצאה באוניברסיטה.
    lines:
    - speaker: david
      text: Dr. Levy, you said remote work improves productivity. Is that proven?
      translation: ד"ר לוי, אמרת שעבודה מרחוק משפרת פריון. האם זה הוכח?
    - speaker: noa
      text: Not conclusively. The data imply a link, but a correlation is not proof.
      translation: לא באופן חד־משמעי. הנתונים מצביעים על קשר, אבל מתאם אינו הוכחה.
    - speaker: david
      text: So your hypothesis could be wrong?
      translation: אז ההשערה שלך עלולה להיות שגויה?
    - speaker: noa
      text: Of course. I am sceptical of any claim that sounds too simple. It is a complex phenomenon.
      translation: בוודאי. אני ספקנית כלפי כל טענה שנשמעת פשוטה מדי. זו תופעה מורכבת.
    - speaker: david
      text: And the substantial increase in remote jobs?
      translation: ומה לגבי העלייה המשמעותית במשרות מרחוק?
    - speaker: noa
      text: That trend is real. Whether it will continue is another question.
      translation: המגמה הזאת אמיתית. אם היא תימשך זו שאלה אחרת.
