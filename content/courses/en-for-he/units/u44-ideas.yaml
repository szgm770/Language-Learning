grammar:
- id: hedging
  title:
    he: זהירות אקדמית ושמות עצם מופשטים
    en: Hedging and nominalisation
  explanation: 'באנגלית אקדמית נמנעים מטענות מוחלטות. משתמשים ב**מרככים (hedging)**:

    - **tend to** – *Remote workers tend to be more productive.*

    - **It appears / seems that…** – *It appears that the trend is growing.*

    - **may / might / could** ו־**arguably**, **to some extent**, **in most cases**

    - "**suggest** במקום prove: *The data suggest a link.*"


    כדי להישמע מקצועי הופכים **פעלים לשמות עצם** (nominalisation) ומקבלים משפט צפוף יותר:

    - *Prices rose sharply.* → **The sharp rise in prices** surprised everyone.

    - *They decided quickly.* → **Their quick decision** helped.

    - *Companies grow.* → **The growth of companies** continues.


    שימו לב לתוספות: *a rise **in***, *a decline **in***, *an increase **in***.'
  examples:
  - text: Remote work tends to improve concentration.
    translation: עבודה מרחוק נוטה לשפר ריכוז.
  - text: The sharp rise in prices surprised everyone.
    translation: העלייה החדה במחירים הפתיעה את כולם.
  - text: Arguably, the results are not conclusive.
    translation: ניתן לטעון שהתוצאות אינן חד־משמעיות.
