grammar:
  - id: used-to-first-conditional
    title: { he: "פעם ועכשיו, אם… אז…: used to ו־if", en: "Used to and the first conditional" }
    explanation: |
      **used to** מתאר הרגל או מצב **בעבר שכבר לא קיים**. בעברית אומרים "פעם…" או "הייתי נוהג…":
      **I used to run every morning.** (פעם רצתי כל בוקר, היום כבר לא)
      שאלה ושלילה, כמו בכל עבר: **Did you use to…? I didn't use to…** (בלי d!)

      **משפט תנאי אמיתי** מדבר על משהו שבאמת יכול לקרות:
      **If** + הווה פשוט, **will** + פועל
      - **If you sleep more, you'll have more energy.**
      - **You'll feel better if you exercise.** (אפשר להפוך את הסדר)

      שימו לב: אחרי **if** לא אומרים will. בעברית "אם תישני", אבל באנגלית **If you sleep**, ולא "If you will sleep".

      **unless** = אלא אם כן (if not): **You won't get fit unless you exercise.**
    examples:
      - { text: "Noa used to drink five coffees a day.", translation: "נועה נהגה לשתות חמישה קפה ביום." }
      - { text: "If I go to bed early, I'll get up at six.", translation: "אם אלך לישון מוקדם, אקום בשש." }
      - { text: "I won't go to the gym unless you come with me.", translation: "אני לא אלך לחדר כושר אלא אם כן תבוא איתי." }

