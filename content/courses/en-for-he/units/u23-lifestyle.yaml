          - { speaker: "noa", text: "Tired. I've got no energy, and I'm always stressed.", translation: "עייפה. אין לי אנרגיה, ואני כל הזמן לחוצה." }
          - { speaker: "dr-stern", text: "How much sleep do you get?", translation: "כמה את ישנה?" }
          - { speaker: "noa", text: "About five hours. I work until midnight.", translation: "בערך חמש שעות. אני עובדת עד חצות." }
          - { speaker: "dr-stern", text: "That isn't enough. And your diet? Do you get any exercise?", translation: "זה לא מספיק. ומה עם התזונה? את עושה פעילות גופנית?" }
