  - id: u23-l5
    kind: reading
    title: { he: "חמישה טיפים לשינה טובה", en: "Five tips for better sleep" }
    exercises:
      - id: u23-l5-01
        type: reading
        kind: "כתבה במגזין בריאות"
        title: "Five tips for better sleep"
        text: |
          Most adults need seven to nine hours of sleep a night, but many of us don't get enough. Here are five simple habits that really work.

          1. Go to bed at the same time every night, even at the weekend. If your body has a routine, you'll fall asleep faster.

          2. Don't drink coffee after 2 p.m. It stays in your body for up to ten hours.

          3. Put your phone away an hour before bed. The light from the screen tells your brain it's still daytime.

          4. Get some exercise during the day, but not late in the evening.

          5. Keep your bedroom cool, dark and quiet.

          Change one habit at a time. If you try to change everything at once, you'll probably give up.
        translation: |
          רוב המבוגרים צריכים שבע עד תשע שעות שינה בלילה, אבל רבים מאיתנו לא ישנים מספיק. הנה חמישה הרגלים פשוטים שבאמת עובדים.

          1. לכו לישון באותה שעה כל ערב, גם בסוף השבוע. אם לגוף שלכם יש שגרה, תירדמו מהר יותר.

          2. אל תשתו קפה אחרי שתיים בצהריים. הוא נשאר בגוף עד עשר שעות.

          3. הניחו את הטלפון בצד שעה לפני השינה. האור מהמסך אומר למוח שעדיין יום.

          4. עשו פעילות גופנית במהלך היום, אבל לא מאוחר בערב.

          5. שמרו על חדר השינה קריר, חשוך ושקט.

          שנו הרגל אחד בכל פעם. אם תנסו לשנות הכול בבת אחת, כנראה שתוותרו.
