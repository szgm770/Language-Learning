id: u23-lifestyle
cefr: B1
scene: health
title:
  he: הרגלים בריאים
  en: Healthy habits
story: "הפרויקט לוחץ, ונועה ישנה מעט, אוכלת מהר ולא זזה. ד\"ר שטרן ובן משכנעים אותה לשנות הרגלים: מה היה פעם, מה יקרה אם…"
canDo:
  - לדבר על הרגלים בריאים ולא בריאים
  - לספר מה עשיתי פעם ואני כבר לא עושה (used to)
  - להשתמש במשפטי תנאי אמיתיים (if + will)
  - לתת ולקבל עצות על סגנון חיים

