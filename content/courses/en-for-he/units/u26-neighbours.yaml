grammar:
  - id: polite-requests
    title: { he: "בקשות מנומסות וצירופי פועל", en: "Polite requests and phrasal verbs" }
    explanation: |
      בעברית מבקשים "תוכל להנמיך?". באנגלית יש כמה דרגות של נימוס:

      - **Can you…?** רגיל, בין חברים.
      - **Could you turn the music down?** מנומס יותר.
      - **Would you mind turning the music down?** מנומס מאוד. אחרי mind בא פועל עם **‎-ing**.

      ושימו לב לתשובה: Would you mind פירושו "אכפת לך?", אז כשמסכימים עונים **No, not at all.** (לא, בכלל לא אכפת לי).

      **צירופי פועל** (phrasal verbs) הם פועל + מילה קטנה שמשנים משמעות: **turn down** (להנמיך), **turn off** (לכבות), **look after** (לשמור על), **run out of** (להיגמר).
      כשהמושא הוא it או them, הוא נכנס באמצע: **turn it down**, לא "turn down it".
    examples:
      - { text: "Could you take out the rubbish, please?", translation: "תוכל להוציא את הזבל, בבקשה?" }
      - { text: "Would you mind looking after my plants? Not at all!", translation: "אכפת לך לשמור על העציצים שלי? בכלל לא!" }
      - { text: "The TV is loud. Can you turn it down?", translation: "הטלוויזיה רועשת. אתה יכול להנמיך אותה?" }

