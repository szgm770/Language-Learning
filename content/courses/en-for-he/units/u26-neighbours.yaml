      - id: u26-l1-01
        type: dialogue
        scene: "אחת־עשרה בלילה. נועה דופקת בדלת של השכנה החדשה מלמעלה."
        lines:
          - { speaker: "noa", text: "Hi, sorry to bother you. I'm Noa, your neighbour from downstairs.", translation: "היי, סליחה שאני מטרידה. אני נועה, השכנה שלך מלמטה." }
          - { speaker: "tamar", text: "Oh, hi! Nice to meet you. Is everything OK?", translation: "אה, היי! נעים להכיר. הכול בסדר?" }
          - { speaker: "noa", text: "Well, I have to get up early. Could you turn the music down a bit?", translation: "טוב, אני צריכה לקום מוקדם. תוכלי להנמיך קצת את המוזיקה?" }
          - { speaker: "tamar", text: "Oh no, I'm so sorry! I didn't know the noise was so bad. I'll turn it off.", translation: "אוי לא, אני כל כך מצטערת! לא ידעתי שהרעש כל כך חזק. אכבה אותה." }
          - { speaker: "noa", text: "Thanks. No worries!", translation: "תודה. הכול בסדר!" }
          - { speaker: "tamar", text: "Wait… Noa? From Project Bridge? I'm Tamar! I've just moved to London!", translation: "רגע… נועה? מפרויקט ברידג'? אני תמר! הרגע עברתי ללונדון!" }
