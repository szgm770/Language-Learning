      - { id: "u26-l1-03", type: "learn", lexeme: "neighbour" }
      - { id: "u26-l1-04", type: "learn", lexeme: "could-you" }
      - { id: "u26-l1-05", type: "learn", lexeme: "turn-down" }
      - { id: "u26-l1-06", type: "learn", lexeme: "noise" }
