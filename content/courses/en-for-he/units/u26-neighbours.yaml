scene: home
title:
  he: שכנים
  en: Neighbours
story: "בדירה מעל נועה עברו שכנים חדשים עם מוזיקה רועשת. היא מבקשת בנימוס, עוזרת לגברת כץ ומבקשת טובה, ומגלה שהשכנה החדשה דווקא נחמדה."
