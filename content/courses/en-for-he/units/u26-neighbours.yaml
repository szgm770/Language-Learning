    exercises:
      - id: u26-l5-01
        type: reading
        kind: "פתק על לוח המודעות"
        title: "Dear neighbours,"
        text: |
          Some of you have asked me about the new building rules, so here is a short reminder.

          Please take the rubbish out on Tuesday and Thursday evenings only. The bins are collected early in the morning.

          Please keep the noise down after 11 p.m. If you're having a party, it's a good idea to tell your neighbours first.

          If you're going to be away, please let me know. I'm happy to keep an eye on your flat or collect your parcels.

          And finally: the garden is for everyone! Would you mind cleaning up after you use it?

          Thank you, and enjoy the summer!
          Ruth Katz, Flat 1
        translation: |
          כמה מכם שאלו אותי על כללי הבניין החדשים, אז הנה תזכורת קצרה.

          בבקשה הוציאו את הזבל רק בערבי שלישי וחמישי. הפחים נאספים מוקדם בבוקר.

          בבקשה שמרו על שקט אחרי 11 בלילה. אם אתם עושים מסיבה, רעיון טוב לספר קודם לשכנים.

          אם אתם עומדים להיות מחוץ לבית, בבקשה עדכנו אותי. אשמח להשגיח על הדירה שלכם או לאסוף את החבילות שלכם.

          ולסיום: הגינה היא של כולם! אכפת לכם לנקות אחרי שאתם משתמשים בה?

          תודה, ותיהנו מהקיץ!
          רות כץ, דירה 1
