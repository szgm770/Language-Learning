- id: u41-l5
  kind: reading
  title:
    he: דוח רבעוני
    en: The quarterly report
  exercises:
  - id: u41-l5-01
    type: reading
    kind: דוח קצר
    title: 'Tel Aviv office: first quarter report'
    text: 'The Tel Aviv office has completed its first quarter, and the results exceed our expectations.


      Not only did the team reach the first milestone ahead of schedule, but it also built strong relationships with every stakeholder. Responsibility was shared clearly: each manager was accountable for one area, and daily tasks were delegated to team members. Consequently, no one was overloaded.


      There were setbacks, of course. Rarely does a new office avoid pitfalls, and ours was no exception: the first version of the onboarding process took too long. After an overhaul, new employees now become productive in two weeks instead of six.


      Looking ahead, our priority is to keep the process scalable. If the team continues to thrive, we will need more bandwidth, and we recommend hiring three more people.

      '
    translation: 'משרד תל אביב סיים את הרבעון הראשון שלו, והתוצאות עולות על הציפיות.


      הצוות לא רק הגיע לאבן הדרך הראשונה לפני הזמן, אלא גם בנה קשרים חזקים עם כל בעלי העניין. האחריות חולקה בבירור: כל מנהל היה אחראי על תחום אחד, ומשימות יומיומיות הואצלו לחברי הצוות. כתוצאה מכך איש לא היה עמוס יתר על המידה.


      היו גם מכשולים, כמובן. לעיתים נדירות משרד חדש נמנע ממלכודות, והמשרד שלנו לא היה יוצא דופן: הגרסה הראשונה של תהליך קליטת העובדים נמשכה זמן רב מדי. אחרי שינוי יסודי, עובדים חדשים הופכים עכשיו לפרודוקטיביים בשבועיים במקום בשישה.


      מבט קדימה: העדיפות שלנו היא לשמור על תהליך שניתן להרחבה. אם הצוות ימשיך לשגשג, נזדקק ליותר פניוּת, ואנחנו ממליצים לגייס שלושה אנשים נוספים.

      '
