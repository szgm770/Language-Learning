id: u41-office
cefr: C1
scene: work
title:
  he: המשרד החדש
  en: The new office
story: נועה חזרה לתל אביב ומנהלת את המשרד החדש. היא לומדת שפה של ניהול, הובלת צוות ושיחות עם בעלי עניין, ומשתמשת במבנים מודגשים כמו Never have I…
canDo:
- לדבר על ניהול, האצלת סמכויות ואבני דרך
- להדגיש רעיון בעזרת היפוך (Not only… but also, Rarely does…)
- לנהל שיחה מקצועית עם צוות ובעלי עניין
- לקרוא ולכתוב דוח קצר בשפה מקצועית
