  exercises:
  - id: u41-l4-01
    type: dialogue
    scene: שיחת וידאו עם בן בלונדון.
    lines:
    - speaker: ben
      text: How is the onboarding going? Have the new hires settled in?
      translation: איך הולכת קליטת העובדים? העובדים החדשים השתלבו?
    - speaker: noa
      text: Better than expected. Not only have they learned the system, but they have also suggested improvements.
      translation: טוב מהצפוי. הם לא רק למדו את המערכת, אלא גם הציעו שיפורים.
    - speaker: ben
      text: Impressive. What about the overhaul of the reporting process?
      translation: מרשים. ומה עם השינוי היסודי בתהליך הדיווח?
    - speaker: noa
      text: Rarely do I say this, but we are ahead of schedule.
      translation: לעיתים נדירות אני אומרת את זה, אבל אנחנו לפני לוח הזמנים.
    - speaker: ben
      text: Then let's make sure the new process is scalable before we celebrate.
      translation: אז בואו נוודא שהתהליך החדש ניתן להרחבה לפני שחוגגים.
