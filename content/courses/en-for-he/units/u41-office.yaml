grammar:
- id: inversion
  title:
    he: היפוך להדגשה
    en: Inversion for emphasis
  explanation: 'כשפותחים משפט במילה שלילית או מגבילה, **הפועל העזר קופץ לפני הנושא**, כמו בשאלה. זה נשמע רשמי ומדגיש:


    - "**Never** have I seen such a fast team. (במקום: I have never seen…)"

    - **Rarely** does she miss a deadline.

    - **Not only** did we finish early, **but** we also saved money.

    - **Hardly** had we started **when** the phone rang.

    - **No sooner** had he left **than** it began to rain.

    - **Only after** the meeting did I understand the problem.


    אם אין פועל עזר, מוסיפים do/does/did: *Rarely **does** she…* בעברית הסדר נשאר רגיל ("לעולם לא ראיתי"), ובאנגלית ההיפוך הוא כלי סגנוני שמופיע במבחנים ובנאומים.'
  examples:
  - text: Never have I worked with such a motivated team.
    translation: מעולם לא עבדתי עם צוות כל כך מוטיבציה.
  - text: Not only did she lead the project, but she also trained the new staff.
    translation: היא לא רק הובילה את הפרויקט, אלא גם הכשירה את העובדים החדשים.
  - text: Hardly had the meeting started when the power went out.
    translation: בקושי התחילה הפגישה והחשמל נפל.
