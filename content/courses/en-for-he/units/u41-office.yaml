  exercises:
  - id: u41-l1-01
    type: dialogue
    scene: היום הראשון במשרד החדש בתל אביב.
    lines:
    - speaker: noa
      text: Welcome to the new office, everyone. Our first milestone is the product launch in March.
      translation: ברוכים הבאים למשרד החדש. אבן הדרך הראשונה שלנו היא השקת המוצר במרץ.
    - speaker: eli
      text: Who will be accountable for the budget?
      translation: מי יהיה אחראי על התקציב?
    - speaker: noa
      text: I will. But I plan to delegate the daily work, because I can't do everything myself.
      translation: אני. אבל אני מתכננת להאציל את העבודה היומיומית, כי אני לא יכולה לעשות הכול בעצמי.
    - speaker: eli
      text: And the stakeholders in London?
      translation: ומה עם בעלי העניין בלונדון?
    - speaker: noa
      text: Ben will keep them informed. Our job is to streamline the process and avoid setbacks.
      translation: בן יעדכן אותם. התפקיד שלנו הוא לייעל את התהליך ולמנוע מכשולים.
    - speaker: miriam
      text: Never have I seen a team start with so much energy.
      translation: מעולם לא ראיתי צוות שמתחיל עם כל כך הרבה אנרגיה.
