        type: dialogue
        scene: "רחל מספרת לנועה על הצעה ממלבורן."
        lines:
          - { speaker: "rachel", text: "Guess what? A university in Melbourne offered me a place on a master's degree in nursing.", translation: "נחשי מה? אוניברסיטה במלבורן הציעה לי מקום בתואר שני בסיעוד." }
          - { speaker: "noa", text: "That's amazing! Are you going to study abroad?", translation: "זה מדהים! את הולכת ללמוד בחו\"ל?" }
          - { speaker: "rachel", text: "I don't know. The fees are very high. I can't afford it.", translation: "אני לא יודעת. שכר הלימוד מאוד גבוה. אני לא יכולה להרשות את זה לעצמי." }
          - { speaker: "noa", text: "Can you get a scholarship?", translation: "את יכולה לקבל מלגה?" }
          - { speaker: "rachel", text: "Maybe. But first I have to pass an English exam. Can you believe it?", translation: "אולי. אבל קודם אני צריכה לעבור מבחן באנגלית. את מאמינה?" }
          - { speaker: "noa", text: "An English exam? For you? Ha! You'll pass easily.", translation: "מבחן באנגלית? בשבילך? חה! את תעברי בקלות." }
