id: u29-learning
cefr: B1
scene: study
title:
  he: ללמוד כל החיים
  en: Learning for life
story: "רחל מתלבטת אם ללמוד תואר שני באוסטרליה, ובן חולם ללמוד לבשל באיטליה. בערב אחד כולם משחקים במשחק: מה היית עושה אם…?"
canDo:
  - לדבר על לימודים, מבחנים ותארים
  - לדמיין מצבים עם משפט תנאי לא אמיתי (If I had…, I would…)
  - לתת עצה עם If I were you
  - לספר על דרכים ללמוד ולהשתפר

