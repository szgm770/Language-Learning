grammar:
  - id: second-conditional
    title: { he: "אילו… הייתי…: תנאי דמיוני", en: "The second conditional" }
    explanation: |
      כבר למדנו תנאי אמיתי: **If it rains, I'll stay home.** (באמת יכול לקרות)

      **תנאי דמיוני** מדבר על משהו לא סביר או לא נכון עכשיו. בעברית "אילו היה לי זמן, הייתי לומדת":
      **If** + עבר פשוט, **would** + פועל
      - **If I had more time, I would learn Italian.** (אין לי זמן)
      - **If I won the lottery, I'd buy a house in London.** (לא סביר)

      שימו לב: העבר אחרי if לא מדבר על העבר! הוא מסמן שזה דמיוני.

      עם be משתמשים ב־**were** לכל הגופים, במיוחד בעצה: **If I were you, I'd apply.** (במקומך, הייתי מגישה)

      שאלה: **What would you do if you had a million pounds?**
    examples:
      - { text: "If I lived in Italy, I would eat pasta every day.", translation: "אילו גרתי באיטליה, הייתי אוכל פסטה כל יום." }
      - { text: "If I were you, I'd take the scholarship.", translation: "במקומך, הייתי לוקחת את המלגה." }
      - { text: "Rachel would study abroad if she could afford it.", translation: "רחל הייתה לומדת בחו\"ל אילו יכלה להרשות זאת לעצמה." }

