  - id: u29-l5
    kind: reading
    title: { he: "לומדים בגיל 70", en: "Learning at seventy" }
    exercises:
      - id: u29-l5-01
        type: reading
        kind: "כתבה במגזין"
        title: "\"It's never too late\": the 70-year-old student"
        text: |
          When Ruth Katz retired, her friends asked her what she would do with all her free time. "If I had the energy," she told them, "I would go back to university."

          Five years later, she has a degree in art history. "At first it was difficult," she says. "I hadn't taken an exam for fifty years! I failed my first one. But I practised, and I improved."

          Today Ruth gives free talks at a museum in London. "Young people often ask me for advice," she says. "I always tell them the same thing: if you love a subject, study it. Knowledge is the only thing nobody can take away from you."

          Her next plan? "Japanese. My neighbour Noa wants to learn it too, so we'll study together."
        translation: |
          כשרות כץ יצאה לפנסיה, החברות שלה שאלו אותה מה היא תעשה עם כל הזמן הפנוי. "אילו הייתה לי האנרגיה," היא אמרה להן, "הייתי חוזרת לאוניברסיטה."

          חמש שנים אחר כך, יש לה תואר בתולדות האמנות. "בהתחלה זה היה קשה," היא אומרת. "לא ניגשתי למבחן חמישים שנה! נכשלתי בראשון. אבל תרגלתי, והשתפרתי."

          היום רות נותנת הרצאות חינם במוזיאון בלונדון. "צעירים שואלים אותי הרבה פעמים לעצה," היא אומרת. "אני תמיד אומרת להם אותו דבר: אם אתם אוהבים מקצוע, תלמדו אותו. ידע הוא הדבר היחיד שאף אחד לא יכול לקחת מכם."

          התוכנית הבאה שלה? "יפנית. השכנה שלי נועה רוצה ללמוד גם, אז נלמד ביחד."
