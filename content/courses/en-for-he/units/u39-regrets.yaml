  # ------------------------------------------------------------------ 5
  - id: u39-l5
    kind: reading
    title: { he: "מכתב לעצמי הצעיר", en: "A letter to my younger self" }
    exercises:
      - id: u39-l5-01
        type: reading
        kind: "מכתב"
        title: "Dear younger me"
        text: |
          Dear younger me,

          I know you are worried about everything. I wish I could tell you that it will all be fine, because it will. I wish you would relax more and trust yourself.

          There are things I regret. I wish I had called my grandparents more often. I wish I hadn't spent so many evenings worrying about what other people thought. If only I had understood earlier that people care less than we imagine!

          But I am also proud of you. You learned from your mistakes and you kept going. Make the most of every day, keep in touch with the people you love, and remember: it is never too late to start again.

          With love,
          Me
        translation: |
          לעצמי הצעיר,

          אני יודעת שאת מודאגת מהכול. הלוואי שיכולתי לומר לך שהכול יהיה בסדר, כי זה יהיה. הלוואי שהיית נרגעת יותר ומאמינה בעצמך.

          יש דברים שאני מצטערת עליהם. הלוואי שהייתי מתקשרת לסבא וסבתא לעתים קרובות יותר. הלוואי שלא הייתי מבלה כל כך הרבה ערבים בדאגה למה שאחרים חושבים. הלוואי שהבנתי מוקדם יותר שאנשים אכפתיים פחות ממה שאנחנו מדמיינים!

          אבל אני גם גאה בך. למדת מהטעויות והמשכת הלאה. נצלי כל יום עד תום, שמרי על קשר עם האנשים שאת אוהבת, וזכרי: אף פעם לא מאוחר מדי להתחיל מחדש.

          באהבה,
          אני
