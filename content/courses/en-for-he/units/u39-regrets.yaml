grammar:
  - id: wish-if-only
    title: { he: "הלוואי ש… (I wish / If only)", en: "I wish and If only" }
    explanation: |
      **I wish** ו-**If only** מביעים רצון ש**המציאות תהיה אחרת**. הזמן בעברית הוא "הלוואי ש…", אבל באנגלית **מחזירים צעד אחורה בזמן**:

      1. **הווה לא רצוי → I wish + past simple**
         - **I wish I lived closer.** (בפועל אני לא גר קרוב)
         - עם to be משתמשים גם ב-**were**: *I wish I were taller.*

      2. **חרטה על העבר → I wish + had + V3**
         - **I wish I had studied harder.** (לא למדתי מספיק)
         - **If only I had known!**

      3. **תלונה על מישהו/משהו שמפריע → I wish + would**
         - **I wish you would stop interrupting.** (תפסיק כבר)
         - לא אומרים *I wish I would*, כי לא מתלוננים על עצמנו.

      **If only** חזק ורגשי יותר: *If only I had more time!*
    examples:
      - { text: "I wish I had more free time.", translation: "הלוואי שהיה לי יותר זמן פנוי." }
      - { text: "I wish I hadn't said that.", translation: "הלוואי שלא הייתי אומר את זה." }
      - { text: "If only he would listen!", translation: "הלוואי שהוא היה מקשיב!" }

