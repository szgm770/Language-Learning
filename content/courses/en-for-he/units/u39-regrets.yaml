scene: family
title:
  he: משאלות וחרטות
  en: Wishes and regrets
story: "נועה מתגעגעת הביתה. בשיחה ארוכה עם אמה, רחל, היא מדברת על מה שהייתה רוצה שיהיה אחרת, על דברים שהיא מצטערת עליהם, ועל מה שבעצם חשוב לה."
