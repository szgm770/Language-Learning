        lines:
          - { speaker: "rachel", text: "You look tired, Noa. Are you all right?", translation: "את נראית עייפה, נועה. הכול בסדר?" }
          - { speaker: "noa", text: "I'm fine, Mum. Just a bit homesick. I miss you all so much.", translation: "אני בסדר, אמא. רק קצת מתגעגעת הביתה. אני מתגעגעת אליכם כל כך." }
          - { speaker: "rachel", text: "We miss you too. Dad is cooking for Shabbat tomorrow, and he keeps asking about you.", translation: "גם אנחנו מתגעגעים. אבא מבשל לשבת מחר, והוא כל הזמן שואל עלייך." }
          - { speaker: "noa", text: "I wish I lived closer. It's hard to keep in touch from so far away.", translation: "הלוואי שהייתי גרה קרוב יותר. קשה לשמור על קשר ממרחק כזה." }
          - { speaker: "rachel", text: "We talk every week. That's what matters.", translation: "אנחנו מדברים כל שבוע. זה מה שחשוב." }
