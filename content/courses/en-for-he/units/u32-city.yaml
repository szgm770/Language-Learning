grammar:
  - id: contrast-so-such
    title: { he: "ניגוד ועוצמה: although, despite, so, such", en: "Contrast; so and such; too and enough" }
    explanation: |
      **ניגוד** ("למרות", "אבל"):
      - **although** + משפט: **Although it was raining, we went out.**
      - **despite** + שם עצם או ‎-ing: **Despite the rain, we went out.** (לא "despite it was raining")
      - **however** בתחילת משפט חדש, עם פסיק: **London is expensive. However, the salaries are higher.**
      - **whereas** להשוואה בין שני דברים: **London is busy, whereas the village is quiet.**

      **so** ו־**such** ("כל כך"):
      - **so** + תואר: **It's so quiet.**
      - **such (a)** + שם עצם: **It's such a quiet village.**

      **too** ו־**enough**:
      - **too** לפני התואר (שלילי, "מדי"): **It's too expensive.**
      - **enough** אחרי התואר ("מספיק"): **It isn't cheap enough.** אבל לפני שם עצם: **enough money**.
    examples:
      - { text: "Although the countryside is beautiful, I'd feel lonely there.", translation: "למרות שהכפר יפה, הייתי מרגישה בודדה שם." }
      - { text: "Despite the long commute, Ben loves living in the suburbs.", translation: "למרות הנסיעה הארוכה, בן אוהב לגור בפרברים." }
      - { text: "It was such a peaceful weekend that I didn't want to leave.", translation: "זה היה סוף שבוע כל כך שליו שלא רציתי לעזוב." }

