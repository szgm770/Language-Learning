id: u32-city
cefr: B2
scene: nature
title:
  he: עיר או כפר?
  en: City or country?
story: "רחל חוזרת מאוסטרליה לביקור ומספרת על החיים בעיר קטנה ליד הים. בסוף שבוע בכפר האנגלי, כולם מתווכחים: איפה טוב יותר לגור, ולמה."
canDo:
  - להשוות בין חיים בעיר לחיים מחוץ לעיר
  - להביע ניגוד עם although, however, despite ו־whereas
  - להשתמש ב־so, such, too ו־enough
  - לנמק עמדה בוויכוח ידידותי

