  - id: u32-l5
    kind: reading
    title: { he: "מחקר: איפה הכי טוב לגור?", en: "Study: where is life best?" }
    exercises:
      - id: u32-l5-01
        type: reading
        kind: "כתבה במגזין"
        title: "Are country people happier?"
        text: |
          For years, people have left villages for big cities in search of jobs and excitement. Recently, however, the opposite has been happening: since working from home became normal, thousands of families have moved to the countryside.

          Are they happier? According to a new survey, the answer is complicated. People in rural areas reported less stress and a stronger sense of community, whereas city residents were more satisfied with their careers and social lives.

          Although rents are lower outside the cities, the cost of living is not always cheaper. Many families need two cars, and public transport is often too limited to be useful.

          "Quality of life isn't about where you live," says the study's author. "It's about whether your place matches the life you want."
        translation: |
          במשך שנים, אנשים עזבו כפרים לערים גדולות בחיפוש אחר עבודה וריגוש. לאחרונה, עם זאת, קורה ההפך: מאז שעבודה מהבית הפכה לנורמלית, אלפי משפחות עברו לאזורים כפריים.

          האם הם מאושרים יותר? לפי סקר חדש, התשובה מורכבת. אנשים באזורים כפריים דיווחו על פחות לחץ ועל תחושת קהילה חזקה יותר, בעוד שתושבי הערים היו מרוצים יותר מהקריירה ומחיי החברה שלהם.

          למרות ששכר הדירה נמוך יותר מחוץ לערים, יוקר המחיה לא תמיד זול יותר. משפחות רבות צריכות שתי מכוניות, והתחבורה הציבורית לרוב מוגבלת מדי כדי להועיל.

          "איכות חיים היא לא עניין של איפה גרים," אומר מחבר המחקר. "זה עניין של האם המקום מתאים לחיים שאתה רוצה."
