    - speaker: zeyde
      text: גיי ווײַטער. וואָס איז דיין פּראָבלעם?
      translation: המשך הלאה. מה הבעיה שלך?
    - speaker: menachem
      text: איך זע ניט די ציפֿער פֿון דער זײַט. איך וויל עס געדענקען און ניט פֿאַרגעסן.
      translation: אני לא רואה את המספר של העמוד. אני רוצה לזכור ולא לשכוח.
    - speaker: zeyde
      text: גוט. איבער יעדן קאַפּיטל שטעלסטו אַ צייכן.
      translation: טוב. על כל פרק תשים סימן.
