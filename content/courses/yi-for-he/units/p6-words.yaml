    lines:
    - speaker: menachem
      text: זיידע, מיר זענען אין קלאַס און איך האָב אַ בלאַט.
      translation: סבא, אנחנו בכיתה ויש לי דף.
    - speaker: zeyde
      text: לייג אַ פֿינגער אויף יעדן בוכשטאַב. דאָס איז אַ וואָרט.
      translation: שים אצבע על כל אות. זו מילה.
    - speaker: menachem
      text: אַ וואָרט און דערנאָך אַ זאַץ. און דאָס ליד?
      translation: מילה ואחר כך משפט. והשיר?
    - speaker: zeyde
      text: דאָס ליד זינגט מען נאָך דער מעשה.
      translation: השיר שרים אחרי הסיפור.
