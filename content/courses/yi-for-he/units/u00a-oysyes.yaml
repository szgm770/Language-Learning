id: u00a-oysyes
cefr: A0
scene: study
title:
  he: האותיות והתנועות
  en: Letters and vowels
story: מנחם נוסע לשנה אל סבא וסבתא בכפר חב״ד. הם מדברים יידיש, והיידיש נכתבת באותיות עבריות, אבל התנועות שלה אחרות.
canDo:
- לקרוא יידיש באותיות עבריות
- לזהות את התנועות הכתובות באותיות
- להבחין בין אַ (a) לבין אָ (o)
vocabulary:
- id: v-pasekh-alef
  text: אַ
  translation: 'אלף עם פתח: הצליל a'
  pos: noun
  pronunciation: a
  example:
    text: מאַמע
    translation: אמא
- id: v-komets-alef
  text: אָ
  translation: 'אלף עם קמץ: הצליל o'
  pos: noun
  pronunciation: o
  example:
    text: דאָס
    translation: זה
- id: v-ayin
  text: ע
  translation: העי״ן היא תנועה (e) ולא עיצור
  pos: noun
  pronunciation: e
  example:
    text: שטעטל
    translation: עיירה יהודית קטנה
- id: v-yud
  text: י
  translation: היוד היא התנועה i
  pos: noun
  pronunciation: i
  example:
    text: איך
    translation: אני
- id: v-vov
  text: ו
  translation: הוו היא התנועה u
  pos: noun
  pronunciation: u
  example:
    text: קוגל
    translation: קוגל (פשטידה)
lessons:
- id: u00a-l1
  kind: new
  title:
    he: התנועות באותיות
    en: Vowel letters
  exercises:
  - id: u00a-l1-01
    type: tip
    title: יידיש נכתבת באותיות עבריות
    text: 'יידיש נכתבת **מימין לשמאל באותיות עבריות**, ולכן אתם כבר יודעים לקרוא את רוב האותיות.

      ההבדל הגדול: **התנועות נכתבות באותיות** ולא בניקוד. לכן **ו**, **י**, **ע** ו**א** הן לפעמים תנועות ולא עיצורים.

      רק האלף נשארת עם סימן: **אַ** (פתח) נקראת a, ו**אָ** (קמץ) נקראת o.

      שימו לב: בשיעורים האלה כותבים את התנועות לפי היידיש הליטאית, כמו שמדברים בחב״ד.

      '
