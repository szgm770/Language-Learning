    text: 'המספרים ביידיש: **איינס, צוויי, דרײַ, פֿיר, פֿינף, זעקס, זיבן, אַכט, נײַן, צען**.

      לפני שם עצם אומרים **איין** ולא איינס: **איין שוועסטער** (אחות אחת).

      את **צוויי** כבר הכרתם ביחידה על הצלילים.

      '
