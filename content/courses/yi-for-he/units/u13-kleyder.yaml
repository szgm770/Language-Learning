  - id: u13-l1-01
    type: tip
    title: בגדים
    text: '**הוט** (כובע), **רעקל** (רקל), **העמד** (חולצה), **שיך** (נעליים), ו**טראָגן** (ללבוש).

      **איך טראָג אַ הוט** פירושו "אני לובש כובע".

      **עס איז קאַלט** (קר), **עס איז וואַרעם** (חם).

      '
