  en: Plurals
story: מנחם סופר את הספרים והילדים בכפר ולומד איך מרבים שמות עצם.
canDo:
- ליצור רבים של שמות עצם נפוצים
- לומר 'יש הרבה'
- להשתמש ב־זענען
