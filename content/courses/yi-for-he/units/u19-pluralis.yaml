  - id: u19-l1-01
    type: tip
    title: רבים
    text: 'ביידיש יש כמה סוגי רבים: **-ן** (טיש→טישן, שול→שולן), **-ער** (בוך→ביכער, קינד→קינדער, הויז→הײַזער), ושינוי תנועה (טאָג→טעג).

      בלשון רבים הפועל "זײַן" הוא **זענען**: **עס זענען דאָ פֿיל שולן** (יש הרבה בתי כנסת).

      **פֿיל** פירושו "הרבה".

      '
