id: p19-words
cefr: B2
scene: study
title:
  he: 'הרחבת אוצר מילים 19: עוד מילים משיחות'
  en: 'Word builder 19: more words from talks'
story: מילים נפוצות מעוד שיחות, כל אחת במשפט קצר.
canDo:
- להבין ולהשתמש במילים נפוצות נוספות
- לזהות את המילים במשפטים
