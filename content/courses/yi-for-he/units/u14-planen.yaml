  - id: u14-l1-01
    type: tip
    title: העתיד
    text: 'העתיד נוצר עם **וועלן**: **איך וועל גיין** (אלך), **מיר וועלן פֿאָרן** (ניסע).

      **מאָרגן** כאן פירושו "מחר", ו**באַלד** (בקרוב), **שפּעטער** (אחר כך).

      **קיין** פירושו "אל", כשנוסעים לעיר: **קיין ניו־יאָרק**.

      '
