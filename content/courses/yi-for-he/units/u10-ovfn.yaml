    text: 'העבר נוצר מ־**האָבן** + צורת עבר של הפועל: **איך האָב געגעסן** (אכלתי), **ער האָט געלערנט** (הוא למד).

      בליטאית משתמשים ב־**האָבן** תמיד, גם בפעלים של תנועה: **איך האָב געגאַנגען** (הלכתי).

      **ער** (הוא), **זי** (היא).

      '
