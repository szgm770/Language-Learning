title:
  he: ארוחה במטוס
  en: A meal on the plane
story: במטוס ובדרך לניו יורק מנחם מסתכל בתפריט הכשר, והסבא מזמין לו אוכל לפי הכללים.
canDo:
- להבין ולהשתמש במילים נפוצות נוספות בשיחה
- לזהות את המילים במשפטים
