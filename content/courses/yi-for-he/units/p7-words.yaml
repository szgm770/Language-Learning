      text: זיידע, איך האָב הונגער. וואָס פֿאַר פֿלייש האָבן זיי?
      translation: סבא, אני רעב. איזה בשר יש להם?
    - speaker: zeyde
      text: אַ הינדל מיט קאַרטאָפֿל און ציבעלע. דער מערן איז פֿאַר שבת.
      translation: עוף עם תפוחי אדמה ובצל. הגזר לשבת.
    - speaker: menachem
      text: און אַ באַנאַנע און ווײַנטרויבן?
      translation: ובננה וענבים?
    - speaker: zeyde
      text: יאָ, מיט האָניק פֿאַר ראש־השנה.
      translation: כן, עם דבש לראש השנה.
