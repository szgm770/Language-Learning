      translation: סבא, לחם עם שום, צנון וכרוב!
    - speaker: zeyde
      text: און אַ פּאָמידאָר מיט אַן איי און אַ סאַלאַט.
      translation: ועגבנייה עם ביצה וסלט.
    - speaker: menachem
      text: און שאָקאָלאַד פֿאַר מנחם?
