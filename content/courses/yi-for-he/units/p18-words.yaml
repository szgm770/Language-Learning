id: p18-words
cefr: C1
scene: day
title:
  he: 'הרחבת אוצר מילים 18: תארים'
  en: 'Word builder 18: adjectives'
story: 'מנחם כותב לסבא מכתב מניו יורק ומתאר את מה שהוא רואה: צבעים, חום וקור, גדול וקטן.'
canDo:
- להבין ולהשתמש במילים נפוצות נוספות בשיחה
- לזהות את המילים במשפטים
