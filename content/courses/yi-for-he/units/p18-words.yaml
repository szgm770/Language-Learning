  - id: p18-l1-10
    type: dialogue
    scene: צבעים ומהירות
    lines:
    - speaker: menachem
      text: זיידע, דער בוים איז גרין, די בלום איז רויט און בלוי, דער זאַמד איז געל.
      translation: סבא, העץ ירוק, הפרח אדום וכחול, החול צהוב.
    - speaker: zeyde
      text: און דער טיש איז ברוין. אין דער שטוב איז הייס, און דער ווינט איז שנעל.
      translation: והשולחן חום. בבית חם והרוח מהירה.
    - speaker: menachem
      text: דער זיידע איז שטאַרק, און איך בין ניט שוואַך.
      translation: סבא חזק, ואני לא חלש.
    - speaker: zeyde
      text: גוט, שרײַב עס אין מכתב.
      translation: טוב, כתוב את זה במכתב.
