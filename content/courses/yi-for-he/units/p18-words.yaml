      translation: הכביסה רטובה והאדמה יבשה. האדון עשיר, הכיס מלא.
    - speaker: zeyde
      text: דער טיש איז ליידיק, דער יינגל איז רויק און לוסטיק. ער איז ניט טרויעריק.
      translation: השולחן ריק, הילד רגוע ועליז. הוא לא עצוב.
    - speaker: menachem
      text: ער איז אויך קלוג, זיידע.
      translation: הוא גם חכם, סבא.
    - speaker: zeyde
      text: אַ קלוגער, אָבער רויק. שרײַב עס.
      translation: חכם, אבל רגוע. כתוב.
