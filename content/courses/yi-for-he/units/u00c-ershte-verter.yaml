story: מנחם מגיע לבית של סבא וסבתא. הוא מכיר מילים מהבית, ושומע גם מילים שלא הכיר.
canDo:
- להבין ולכתוב כמה מילים בסיסיות ביידיש
- לזהות מילים עבריות שנכתבות כמו בעברית
- לקרוא אותן בליטאית
