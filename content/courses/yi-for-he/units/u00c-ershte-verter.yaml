  - id: u00c-l1-01
    type: tip
    title: מילים קצרות
    text: 'המילים האלה הן הבסיס לכל משפט: **איך** (אני), **דו** (אתה או את), **יאָ** (כן), **ניין** (לא), **גוט** (טוב).

      שימו לב לכתיב: **ניין** נקראת neyn, ו**גוט** נקראת gut.

      '
