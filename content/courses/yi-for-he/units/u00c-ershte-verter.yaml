    type: tip
    title: מילים מעברית
    text: 'מילים רבות ביידיש באות מעברית, ו**נכתבות כמו בעברית**: שבת, תורה, שלום, ברכה.

      בניגוד לשאר היידיש, הן לא נכתבות לפי התנועות של היידיש, אלא באותו כתיב כמו בלשון הקודש.

      '
