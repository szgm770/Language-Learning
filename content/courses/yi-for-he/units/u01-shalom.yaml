  title:
    he: ברכות
    en: Lesson
  exercises:
  - id: u01-l1-01
    type: tip
    title: ברכת שלום
    text: 'הברכה הרגילה היא **שלום־עליכם**, והתשובה היא **עליכם־שלום**, בדיוק כמו בלשון הקודש.

      שואלים מה שלומו: **ווי גייט עס?** (איך זה הולך?), ועונים: **גוט, אַ דאַנק** (טוב, תודה).

      נפרדים עם **זײַ געזונט**.

      '
