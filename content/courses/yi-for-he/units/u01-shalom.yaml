id: u01-shalom
cefr: A1
scene: hello
title:
  he: שלום עליכם
  en: Hello
story: 'מנחם מגיע לכפר חב״ד, ואצל הסבא והסבתא הוא מתחיל לדבר יידיש: ברכות, שם ומוצא.'
canDo:
- לברך ולהשיב לברכה
- לומר איך קוראים לי ומאין אני
- להודות ולהיפרד
vocabulary:
- id: sholem
  text: שלום־עליכם
  translation: שלום עליכם (ברכת שלום)
  pos: noun
  example:
    text: שלום־עליכם, זיידע!
    translation: שלום עליכם, סבא!
- id: aleykhem
  text: עליכם־שלום
  translation: עליכם שלום (התשובה לברכה)
  pos: noun
- id: vi
  text: ווי
  translation: איך / איפה
  pos: adverb
  pronunciation: vi
  example:
    text: ווי גייט עס?
    translation: מה שלומך? (איך זה הולך?)
- id: geyt
  text: גייט
  translation: הולך
  pos: verb
  pronunciation: geyt
- id: es
  text: עס
  translation: זה
  pos: pronoun
  pronunciation: es
- id: dank
  text: אַ דאַנק
  translation: תודה
  pos: noun
  example:
    text: גוט, אַ דאַנק.
    translation: טוב, תודה.
- id: bite
  text: ביטע
  translation: בבקשה
  pos: noun
- id: gezunt
  text: זײַ געזונט
  translation: להתראות (בריאות)
  pos: noun
- id: zeyer
  text: זייער
  translation: מאוד
  pos: adverb
  pronunciation: zeyer
- id: heysn
  text: הייסן
  translation: להיקרא
  pos: verb
  pronunciation: heysn
  example:
    text: איך הייס מנחם.
    translation: קוראים לי מנחם.
- id: bin
  text: בין
  translation: (אני) הוא / נמצא
  pos: verb
  pronunciation: bin
  example:
    text: איך בין פֿון ישראל.
    translation: אני מישראל.
- id: fun
  text: פֿון
  translation: מ־
  pos: preposition
  pronunciation: fun
- id: yisroel
  text: ישראל
  translation: ארץ ישראל
  pos: noun
