  exercises:
  - id: u06-l1-01
    type: tip
    title: בבית
    text: '**הויז** (בית), **קיך** (מטבח), **שטוב** (חדר), **טיר** (דלת), **פֿענצטער** (חלון), **בעט** (מיטה).

      **אין** פירושו "ב־", ו**דאָ** פירושו "כאן" או "יש": **אין די קיך איז דאָ אַ טיש** (במטבח יש שולחן).

      **אַ** הוא "אחד" (סתמי): **אַ טיר** (דלת).

      בליטאית אומרים **די קיך** גם אחרי **אין**.

      '
