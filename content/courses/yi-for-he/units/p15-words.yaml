id: p15-words
cefr: B2
scene: town
title:
  he: 'בהתוועדות: מי ואיפה'
  en: 'At the farbrengen: who and where'
story: 'הסבא ממשיך להסביר למנחם מילים נפוצות בשיחות: יהודים, נשים, גברים, הורים ועולם.'
canDo:
- להבין ולהשתמש במילים נפוצות נוספות בשיחה
- לזהות את המילים במשפטים
vocabulary:
