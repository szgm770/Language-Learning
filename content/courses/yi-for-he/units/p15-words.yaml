      text: דער רבי רעדט צו אידן, צו פֿרויען און צו מענער.
      translation: הרבי מדבר ליהודים, לנשים ולגברים.
    - speaker: menachem
      text: און צו עלטערן? און אויך צו אידישע קינדער?
      translation: ולהורים? וגם לילדים יהודיים?
    - speaker: zeyde
      text: יאָ, מער ווי אַלע, לויט דעם סדר.
      translation: כן, יותר מכולם, לפי הסדר.
    - speaker: menachem
      text: וואו זעצט זיך דער רבי?
      translation: איפה הרבי יושב?
