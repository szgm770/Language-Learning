  - id: u12-l1-01
    type: tip
    title: מילות שאלה
    text: '**ווער** (מי), **וואָס** (מה), **ווען** (מתי), **וואָרום** (למה), ו**וווּ** (איפה) כבר הכרתם.

      אחרי מילת השאלה בא הפועל: **ווער איז דאָס?**, **ווען גייסטו אין שול?**

      **-סטו** בסוף הפועל פירושו "אתה": **גייסטו** (אתה הולך).

      '
