  exercises:
  - id: u07-l1-01
    type: tip
    title: יום וזמן
    text: '**טאָג** (יום), **מאָרגן** (בוקר), **אָוונט** (ערב), **נאַכט** (לילה).

      הפועל ביידיש מקבל סיומת לפי מי עושה: **איך לערן** (אני לומד), **מיר לערנען** (אנחנו לומדים).

      **נישט** פירושו "לא", ואחרי הפועל: **איך אַרבעט נישט** (אני לא עובד).

      '
