  en: Daily routine
story: 'מנחם מספר איך נראה היום שלו אצל סבא וסבתא: תפילה, לימוד ושינה.'
canDo:
- לתאר פעולות יומיומיות
- לומר לאן אני הולך
- לדבר על בוקר, ערב ולילה
