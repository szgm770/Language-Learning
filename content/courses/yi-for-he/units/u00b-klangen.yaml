lessons:
- id: u00b-l1
  kind: new
  title:
    he: אותיות כפולות
    en: Double letters
  exercises:
  - id: u00b-l1-01
    type: tip
    title: שתי אותיות, צליל אחד
    text: 'ביידיש יש צירופי אותיות שמייצגים צליל אחד:

      **יי** נקרא ey, ו**וו** נקרא v (כמו בעברית, ו בתחילת מילה).

      **וי** נקרא בליטאית ey (בחסידות אחרות שומעים oy), ו**ײַ** עם הפתח נקרא ay.

      שימו לב: בליטאית **יי** ו**וי** נשמעות דומה, אבל הכתיב שונה, ולכן צריך לזכור איך כל מילה נכתבת.

      '
