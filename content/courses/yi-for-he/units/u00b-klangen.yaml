    he: המילים הראשונות
    en: Words
  exercises:
  - id: u00b-l2-01
    type: tip
    title: הניבים של היידיש
    text: 'ביידיש יש כמה ניבים. בקורס הזה לומדים את **הליטאי**, שמדברים בחב״ד.

      דוגמה: המילה "קטן" נשמעת **kleyn** בליטאית, ו**klayn** בחסידויות פולניות. גם **dos** (ליטאי) מול **dus**, ו**kugl** מול **kigl**.

      שני הניבים נכונים, אבל בקורס הזה ההגייה היא הליטאית.

      '
