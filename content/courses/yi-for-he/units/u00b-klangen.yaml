id: u00b-klangen
cefr: A0
scene: study
title:
  he: הצלילים בליטאית
  en: Litvish sounds
story: סבא של מנחם מדבר יידיש ליטאית. מנחם לומד לקרוא מילים ולהבין איך הן נשמעות אצלו.
canDo:
- לקרוא את צירופי האותיות הכפולים
- להגות שמונה מילים ביידיש הליטאית
- לדעת שיש ניבים שונים ביידיש
