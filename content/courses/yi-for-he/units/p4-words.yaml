id: p4-words
cefr: B1
scene: study
title:
  he: 'הרחבת אוצר מילים 4: מילים קטנות מהשיחות'
  en: 'Word builder 4: small words from the talks'
story: מנחם ממשיך לשוחח עם הסבא ושם לב למילים הקטנות שמחברות כל משפט.
canDo:
- להבין ולהשתמש במילים נפוצות נוספות בשיחה
- לזהות את המילים במשפטים
vocabulary:
- id: p4-oyf
  text: אויף
  translation: על
  pos: preposition
  example:
    text: דער ספֿר ליגט אויף דעם טיש.
    translation: הספר מונח על השולחן
- id: p4-im
  text: אים
  translation: אותו / לו
  pos: pronoun
  example:
    text: איך זע אים.
    translation: אני רואה אותו
- id: p4-zey
  text: זיי
  translation: הם / אותם
  pos: pronoun
  example:
    text: איך זע זיי.
    translation: אני רואה אותם
- id: p4-men
  text: מען
  translation: אומרים / לומדים (כללי)
  pos: pronoun
  example:
    text: מען לערנט אין שול.
    translation: לומדים בבית הכנסת
- id: p4-azoy
  text: אַזוי
  translation: כך
  pos: adverb
  example:
    text: מען זאָגט עס אַזוי.
    translation: אומרים את זה כך
- id: p4-tsu
  text: צו
  translation: אל
  pos: preposition
  example:
    text: איך גיי צו מײַן זיידע.
    translation: אני הולך אל סבא שלי
- id: p4-nor
  text: נאָר
  translation: רק
  pos: adverb
  example:
    text: איך האָב נאָר איין בוך.
    translation: יש לי רק ספר אחד
- id: p4-oder
  text: אָדער
  translation: או
  pos: conjunction
  example:
    text: איך וויל טיי אָדער קאַווע.
    translation: אני רוצה תה או קפה
- id: p4-bay
  text: ביי
  translation: אצל
  pos: preposition
  example:
    text: ער וווינט ביי זײַן זיידע.
    translation: הוא גר אצל סבא שלו
- id: p4-durkh
  text: דורך
  translation: דרך
  pos: preposition
  example:
    text: מיר גייען דורך דער שטאָט.
    translation: אנחנו הולכים דרך העיר
- id: p4-tsvishn
  text: צווישן
  translation: בין
  pos: preposition
  example:
    text: דאָס בלײַבט צווישן מיר און דיר.
    translation: זה נשאר בינינו
- id: p4-far
  text: פֿאַר
  translation: בשביל
  pos: preposition
  example:
    text: דאָס איז פֿאַר דיר.
    translation: זה בשבילך
- id: p4-vegn
  text: וועגן
  translation: על / אודות
  pos: preposition
  example:
    text: מיר רעדן וועגן דער תורה.
    translation: אנחנו מדברים על התורה
- id: p4-iber
  text: איבער
  translation: מעל / מעבר
  pos: preposition
  example:
    text: ער גייט איבער דער בריק.
    translation: הוא הולך על הגשר
- id: p4-biz
  text: ביז
  translation: עד
  pos: preposition
  example:
    text: איך בלײַב דאָ ביז מאָרגן.
    translation: אני נשאר כאן עד מחר
- id: p4-aleyn
  text: אַליין
  translation: לבד
  pos: adverb
  example:
    text: איך לערן אַליין.
    translation: אני לומד לבד
- id: p4-gor
  text: גאָר
  translation: ממש
  pos: adverb
  example:
    text: דאָס איז גאָר שיין.
    translation: זה ממש יפה
- id: p4-takeh
  text: טאַקע
  translation: אכן
  pos: adverb
  example:
    text: ער איז טאַקע אין שול.
    translation: הוא אכן בבית הכנסת
- id: p4-khotsh
  text: כאָטש
  translation: אף על פי ש־
  pos: conjunction
  example:
    text: כאָטש איך בין מיד, גיי איך אין שול.
    translation: אף על פי שאני עייף, אני הולך לבית הכנסת
- id: p4-vaybald
  text: וויבאַלד
  translation: מכיוון ש־
  pos: conjunction
  example:
    text: וויבאַלד איך בין מיד, שלאָף איך.
    translation: מכיוון שאני עייף, אני ישן
- id: p4-itst
  text: איצט
  translation: עכשיו
  pos: adverb
  example:
    text: איצט בין איך אין שול.
    translation: עכשיו אני בבית הכנסת
- id: p4-demolt
  text: דעמולט
  translation: אז
  pos: adverb
  example:
    text: דעמולט האָב איך געלערנט.
    translation: אז למדתי
- id: p4-frier
  text: פֿריִער
  translation: קודם
  pos: adverb
  example:
    text: פֿריִער האָב איך געגעסן.
    translation: קודם אכלתי
- id: p4-derfar
  text: דערפֿאַר
  translation: לכן
  pos: adverb
  example:
    text: איך בין מיד, דערפֿאַר שלאָף איך.
    translation: אני עייף, לכן אני ישן
- id: p4-tsulib
  text: צוליב
  translation: בגלל
  pos: preposition
  example:
    text: צוליב דעם רעגן בלײַב איך אין שטוב.
    translation: בגלל הגשם אני נשאר בבית
- id: p4-yeder
  text: יעדער
  translation: כל / כל אחד
  pos: pronoun
  example:
    text: יעדער איד לערנט.
    translation: כל יהודי לומד
- id: p4-ale
  text: אַלע
  translation: כל / כולם
  pos: pronoun
  example:
    text: אַלע קינדער לערנען.
    translation: כל הילדים לומדים
- id: p4-gants
  text: גאַנץ
  translation: שלם / כל
  pos: adjective
  example:
    text: דער גאַנץ טאָג איז שיין.
    translation: כל היום יפה
- id: p4-zol
  text: זאָל
  translation: שֶׁ־ (שיהיה)
  pos: adverb
  example:
    text: ער זאָל קומען.
    translation: שיבוא
- id: p4-tor
  text: טאָר
  translation: 'מותר (בשלילה: אסור)'
  pos: verb
  example:
    text: מען טאָר ניט עסן דאָ.
    translation: אסור לאכול כאן
- id: p4-vert2
  text: ווערט
  translation: נהיה
  pos: verb
  example:
    text: עס ווערט קאַלט.
    translation: נהיה קר
