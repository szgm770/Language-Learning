      translation: סבא, אל מי הולכים בשבת?
    - speaker: zeyde
      text: מיר גייען צו דער באָבע. ביי איר איז אַלץ גרייט.
      translation: אנחנו הולכים לסבתא. אצלה הכול מוכן.
    - speaker: menachem
      text: און מען עסט נאָר דאָרט, אָדער אויך ביי אים?
      translation: ואוכלים רק שם, או גם אצלו?
    - speaker: zeyde
      text: ביי איר. און ער קומט אויך, דער שכן.
      translation: אצלה. והוא בא גם, השכן.
