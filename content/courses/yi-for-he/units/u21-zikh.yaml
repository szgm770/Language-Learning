  - id: u21-l1-01
    type: tip
    title: פעלים חוזרים
    text: 'כשהפעולה חוזרת על עושה אותה, יש **זיך**: **איך וואַש זיך** (אני רוחץ), **איך פֿרײַ זיך** (אני שמח).

      **זיך** משמש לכל גוף, ובא אחרי הפועל: **ער וואַשט זיך**.

      **איך וויל זיך באַקענען** פירושו "אני רוצה להכיר".

      '
