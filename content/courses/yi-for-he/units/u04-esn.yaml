title:
  he: אוכל ושתייה
  en: Food and drink
story: הסבתא מכינה לארוחה, ומנחם אומר מה הוא רוצה לאכול ולשתות. כל האוכל כשר, ובארוחה בשרית אין חלב.
canDo:
- לומר מה אני אוכל ושותה
- לבקש מה שאני רוצה
- לנקוב בכמה מאכלים
