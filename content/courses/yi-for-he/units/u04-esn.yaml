  - id: u04-l1-01
    type: tip
    title: אוכל ושתייה
    text: 'המאכלים כאן: **פֿיש** (דג), **מילך** (חלב), **קעז** (גבינה), **וואַסער** (מים), **עפּל** (תפוח), **זופּ** (מרק).

      את **ברויט** (לחם) כבר הכרתם.

      כמו תמיד בבית כשר: בארוחה בשרית אין חלב, ובחלבית אין בשר.

      '
