  - id: u11-l1-01
    type: tip
    title: פעלי עזר
    text: '**קענען** (יכול), **מוזן** (חייב), **דאַרפֿן** (צריך), ואחריהם שם הפועל: **איך קען גיין**, **איך מוז גיין**.

      **נישט** בא לפני הפועל השני: **איך קען נישט שלאָפֿן**.

      **אָבער** (אבל) ו**אויך** (גם).

      '
