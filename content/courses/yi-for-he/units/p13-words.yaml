id: p13-words
cefr: B2
scene: study
title:
  he: 'הרחבת אוצר מילים 13: עוד מהשיחות'
  en: 'Word builder 13: more from the talks'
story: מנחם וסבא יושבים בהתוועדות בבית הכנסת ושומעים שיחה בשיעור יידיש; הסבא מסביר למנחם מילים שחוזרות בה.
canDo:
- להבין ולהשתמש במילים נפוצות נוספות בשיחה
- לזהות את המילים במשפטים
