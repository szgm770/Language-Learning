    - speaker: menachem
      text: און אינערלעך, זיידע?
      translation: ופנימי, סבא?
    - speaker: zeyde
      text: אינערלעך מיינט אין האַרץ, ניט נאָר אויסערלעך.
      translation: פנימי פירושו בלב, לא רק כלפי חוץ.
