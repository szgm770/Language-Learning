      translation: סבא, הרבי אומר שזה רע, אבל גם חשוב מאוד.
    - speaker: zeyde
      text: דאָס איז באַוואוסט. אַ מענטש דאַרף זיין העכער ווי די וועלטלעכע זאַכן.
