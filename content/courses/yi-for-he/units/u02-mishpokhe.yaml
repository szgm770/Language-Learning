title:
  he: המשפחה
  en: Family
story: סבא וסבתא מראים למנחם תמונות של כל המשפחה, והוא לומד לומר מי זה מי.
canDo:
- לומר מי כל אחד במשפחה
- להשתמש ב־דאָס איז (זה הוא)
- 'לתאר בקצרה: גדול, יפה'
