  - id: u02-l1-01
    type: tip
    title: זה הוא
    text: 'כדי להציג מישהו אומרים **דאָס איז** ואחר כך את השם או הקרבה: **דאָס איז מײַן זיידע** (זה סבא שלי).

      **איז** פירושו "הוא" או "נמצא", כמו "is" באנגלית. בעברית אין את המילה הזאת בהווה.

      **מײַן** פירושו "שלי".

      '
