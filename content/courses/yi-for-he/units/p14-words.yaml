id: p14-words
cefr: B2
scene: study
title:
  he: 'הרחבת אוצר מילים 14: צורות הפועל בשיחות'
  en: 'Word builder 14: verb forms from the talks'
story: הסבא מראה למנחם איך הפעלים משתנים בשיחות של הרבי, בהווה ובעבר.
canDo:
- להבין ולהשתמש במילים נפוצות נוספות בשיחה
- לזהות את המילים במשפטים
vocabulary:
- id: p14-hot
