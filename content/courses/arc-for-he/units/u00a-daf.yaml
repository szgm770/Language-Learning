- id: u00a-l1
  kind: new
  title:
    he: משנה וגמרא
    en: Mishnah and Gemara
  exercises:
  - id: u00a-l1-01
    type: dialogue
    scene: דירה ריקה בירושלים. ארגזים, אבק, וקיר שלם של ספרים.
    lines:
    - speaker: eitan
      text: חנה, יש פה עשרים כרכים של גמרא. אני לא יודע אפילו איך מחזיקים אחד.
      translation: הש״ס של סבא
    - speaker: chana
      text: 'אני היסטוריונית, לא ראש ישיבה, אבל את זה אני יודעת. תראה: בכל דף יש מילה גדולה, ״מתני׳״. משם מתחילה משנה.'
      translation: מתני׳
    - speaker: chana
      text: 'וכשכתוב ״גמ׳״, מתחילה הגמרא: הדיון של החכמים על המשנה. המשנה בעברית, והגמרא ברובה בארמית.'
      translation: גמ׳
    - speaker: eitan
      text: ומה זה ״תנן״ ו״תניא״?
      translation: שאלה
    - speaker: chana
      text: ״תנן״ = שנינו במשנה. ״תניא״ = שנינו בברייתא, משנה שלא נכנסה לספר המשנה.
      translation: תנן ותניא
  - id: u00a-l1-02
    type: tip
    title: איך נראה דף גמרא
    text: 'באמצע הדף: **משנה** (אחרי **מתני׳**) ו**גמרא** (אחרי **גמ׳**). מסביב: רש״י ותוספות.


      הגמרא כתובה **בלי ניקוד** ובלי פיסוק. בקורס אפשר תמיד ללחוץ **הצגה עם ניקוד**.


      כל משפט כאן הוא ציטוט אמיתי, ולידו המקור: מסכת, דף ועמוד (ע״א / ע״ב).'
