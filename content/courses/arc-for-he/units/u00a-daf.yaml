  - id: u00a-l2-16
    type: tip
    title: ראשי תיבות
    text: 'הגמרא חוסכת מקום. **ת״ר** = תנו רבנן. **א״ר** = אמר רב, או אמר רבי (לפי השם שאחריו). **ת״ש** = תא שמע, בוא שמע. **וכו׳** = וכולי, הציטוט ממשיך.


      בתשובות אפשר להקליד ראשי תיבות בכל צורה: ת״ש, ת"ש או תש.'
