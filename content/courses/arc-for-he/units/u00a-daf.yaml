id: u00a-daf
cefr: A0
scene: study
title:
  he: דף גמרא
  en: A page of Gemara
story: 'איתן וחנה באים לדירה של סבא בירושלים כדי למיין את הספרים. חנה, היסטוריונית, פותחת כרך גמרא ומראה לאיתן איך קוראים דף: משנה, גמרא, וראשי התיבות.'
canDo:
- להבחין בין משנה (מתני׳) לגמרא (גמ׳) בדף
- 'לזהות מקורות: תנן, תניא, ת״ר'
- 'לפתוח ראשי תיבות נפוצים: א״ר, ת״ש, ש״מ, קמ״ל, וכו׳'
vocabulary:
- id: matni
  text: מתני׳
  translation: מתניתין, המשנה (כאן מתחילה משנה)
  pos: noun
  example:
    text: מתני׳ מאימתי קורין את שמע בערבין
    translation: 'משנה: מאימתי קוראים את שמע בערבית?'
    source: בבלי, ברכות ב ע״א
- id: gmara
  text: גמ׳
  translation: גמרא (כאן מתחיל דיון הגמרא)
  pos: noun
  example:
    text: גמ׳ תנא היכא קאי דקתני מאימתי
    translation: 'גמרא: התנא, על מה הוא סומך ששונה ׳מאימתי׳?'
