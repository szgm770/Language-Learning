- id: u05-l1
  kind: new
  title:
    he: האי ינוקא
    en: This child
  exercises:
  - id: u05-l1-01
    type: dialogue
    scene: חנה מגדילה את התמונה בטלפון.
    lines:
    - speaker: chana
      text: זה לא סבא. לסבא היו אוזניים אחרות, ובתמונות שלו מגיל עשר הוא לא דומה לזה בכלל.
      translation: החשד של חנה
    - speaker: eitan
      text: אז מי הילד? ולמה סבא הדביק אותו דווקא בגמרא?
      translation: השאלה
    - speaker: yisrael
      text: 'בוא נלמד קודם ״הא… הא…״. הגמרא מוצאת שני מקורות שסותרים, ואומרת: ״לא קשיא, הא… הא…״. כאן מדובר במקרה אחד, וכאן במקרה אחר.'
      translation: הא… הא…
    - speaker: yisrael
      text: ובבבא בתרא נז יש בדיוק דוגמה כזו, עם ״ינוקא״.
      translation: ינוקא = תינוק
