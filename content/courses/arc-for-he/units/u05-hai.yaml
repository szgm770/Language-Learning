id: u05-hai
cefr: A1
scene: study
title:
  he: האי ינוקא
  en: This child
story: 'התמונה של הילד בגמרא של סבא. חנה בטוחה שזה לא סבא. ר׳ ישראל מלמד את איתן ״הא… הא…״: איך הגמרא מיישבת שני מקורות שסותרים.'
canDo:
- 'להבין זה ואלה: האי, הא, הני, הנך'
- להבין ״הא… הא…״ ו״לא קשיא״
- להבין ״אי הכי״, ״הכי השתא״, ״מנא הני מילי״
vocabulary:
- id: hai
  text: האי
  translation: הזה, הזאת
  pos: pronoun
  example:
    text: האי טריד והאי לא טריד
    translation: זה טרוד, וזה אינו טרוד
    source: בבלי, ברכות יא ע״א
    vocalized: הַאי טְרִיד, וְהַאי לָא טְרִיד
- id: ha
  text: הא
  translation: זה, זאת; ״הא… הא…״ = כאן… וכאן…
  pos: pronoun
  example:
    text: לא קשיא הא דאיכא ינוקא הא דליכא ינוקא
    translation: 'אין קושיה: כאן (מדובר) כשיש תינוק, וכאן כשאין תינוק'
    source: בבלי, בבא בתרא נז ע״ב
    vocalized: לָא קַשְׁיָא הָא דְּאִיכָּא יָנוֹקָא, הָא דְּלֵיכָּא יָנוֹקָא
- id: ynuka
  text: ינוקא
  translation: תינוק, ילד קטן
  pos: noun
  example:
    text: לא קשיא הא דאיכא ינוקא הא דליכא ינוקא
    translation: 'אין קושיה: כאן (מדובר) כשיש תינוק, וכאן כשאין תינוק'
    source: בבלי, בבא בתרא נז ע״ב
    vocalized: לָא קַשְׁיָא הָא דְּאִיכָּא יָנוֹקָא, הָא דְּלֵיכָּא יָנוֹקָא
- id: la-kashya
  text: לא קשיא
  translation: אין קושיה (אין סתירה)
  pos: phrase
  example:
    text: לא קשיא הא דאיכא ינוקא הא דליכא ינוקא
    translation: 'אין קושיה: כאן (מדובר) כשיש תינוק, וכאן כשאין תינוק'
    source: בבלי, בבא בתרא נז ע״ב
    vocalized: לָא קַשְׁיָא הָא דְּאִיכָּא יָנוֹקָא, הָא דְּלֵיכָּא יָנוֹקָא
- id: hani
  text: הני
  translation: האלה
  pos: pronoun
  example:
