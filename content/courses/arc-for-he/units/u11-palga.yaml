id: u11-palga
cefr: A2
scene: study
title:
  he: פלגא דליליא
  en: Midnight
story: 'הפתק של סבא: ״בחצות, כמו דוד.״ ר׳ ישראל מספר שבמתבן למדו בחצות הלילה, כשהאיכר ישן. בברכות ג לומדים: האם דוד ידע מתי חצות? ומילים של זמן ומספרים.'
canDo:
- 'להבין מילים של זמן: אורתא, צפרא, יממא, ליליא, פלגא'
- 'להבין מספרים: תרי, תרתי, שית'
- 'להבין ״מי…?״ כשאלה: האם?'
vocabulary:
- id: palga
