  exercises:
  - id: u11-l1-01
    type: dialogue
    scene: ר׳ ישראל פותח סוף־סוף את הפתק המקופל של סבא.
    lines:
    - speaker: yisrael
      text: ״ישראל, כשאיתן יגיע לכאן, תלמדו פעם אחת בחצות. כמו אז. כמו דוד.״
      translation: הפתק
    - speaker: eitan
      text: בחצות? למה?
      translation: שאלה
    - speaker: yisrael
      text: במתבן למדנו רק בחצות הלילה, כשהאיכר והכלבים ישנו. ״פלגא דליליא״, חצי הלילה.
      translation: פלגא דליליא
    - speaker: yisrael
      text: 'והגמרא שואלת על דוד המלך, שקם בחצות: ״ודוד מי הוה ידע פלגא דליליא אימת?״ האם הוא ידע מתי חצות?'
      translation: מי = האם
    - speaker: eitan
      text: ולכם היה שעון?
      translation: איתן
    - speaker: yisrael
      text: 'לא. ״סימנא הוה לן״. היה לנו סימן: התרנגול של האיכר.'
      translation: סימנא
