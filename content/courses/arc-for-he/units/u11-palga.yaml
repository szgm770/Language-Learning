- id: u11-l2
  kind: new
  title:
    he: אורתא וצפרא
    en: Evening and morning
  exercises:
  - id: u11-l2-15
    type: tip
    title: זמנים
    text: '**צפרא** = בוקר. **יממא** = יום (שעות האור). **אורתא** = ערב. **ליליא** = לילה.


      **פלגא דליליא** = חצות הלילה. **יומא** = יום (תאריך).


      מספרים: **חד** / **חדא** = אחד / אחת. **תרי** / **תרתי** = שניים / שתיים. **תלת**, **תלתא** = שלוש, שלושה. **שית** = שש.'
