id: o03-alma
cefr: A1
section: onkelos
scene: study
title:
  he: שמיא וארעא
  en: Heaven and earth
story: 'מילים של העולם אצל אונקלוס: ים, הר, שדה, עץ, ענן, וחיות. חנה מצטרפת עם מפה של ארץ ישראל.'
canDo:
- 'להבין שמות של טבע: ימא, טורא, חקלא, אילנא, עננא'
- 'להבין שמות של בעלי חיים: בעירא, חיתא, ענא, עופא'
- להבין שמיא, נהורא, חשוכא
vocabulary:
- id: shmaya
  text: שמיא
  translation: שמיים
  pos: noun
  example:
    text: ואשתכללו שמיא וארעא וכל חיליהון
    translation: 'בתורה: וַיְכֻלּוּ הַשָּׁמַיִם וְהָאָרֶץ וְכָל־צְבָאָם'
    source: תרגום אונקלוס, בראשית ב, א
    vocalized: וְאִשְׁתַּכְלָלוּ שְׁמַיָּא וְאַרְעָא וְכָל חֵילֵיהוֹן
- id: yama
  text: ימא
  translation: הים
  pos: noun
  example:
    text: ונטלו מאילם ושרו על ימא דסוף
    translation: 'בתורה: וַיִּסְעוּ מֵאֵילִם וַיַּחֲנוּ עַל־יַם־סוּף'
    source: תרגום אונקלוס, במדבר לג, י
    vocalized: וּנְטָלוּ מֵאֵילִם וּשְׁרוֹ עַל יַמָא דְסוּף
- id: tura
  text: טורא
  translation: ההר
  pos: noun
  example:
    text: ונטלו מהור טורא ושרו בצלמונה
    translation: 'בתורה: וַיִּסְעוּ מֵהֹר הָהָר וַיַּחֲנוּ בְּצַלְמֹנָה'
    source: תרגום אונקלוס, במדבר לג, מא
    vocalized: וּנְטָלוּ מֵהוֹר טוּרָא וּשְׁרוֹ בְּצַלְמוֹנָה
- id: chakla
  text: חקלא
  translation: השדה
  pos: noun
  example:
    text: זביני חקלא ומערתא די בה מן בני חתאה
    translation: 'בתורה: מִקְנֵה הַשָּׂדֶה וְהַמְּעָרָה אֲשֶׁר־בּוֹ מֵאֵת בְּנֵי־חֵת'
    source: תרגום אונקלוס, בראשית מט, לב
    vocalized: זְבִינֵי חַקְלָא וּמְעַרְתָּא דִי בֵהּ מִן בְּנֵי חִתָּאָהּ
- id: ilana
  text: אילנא
  translation: העץ
  pos: noun
  example:
    text: יסבון כען זעיר מיא ואסחו רגליכון ואסתמיכו תחות אילנא
    translation: 'בתורה: יֻקַּח־נָא מְעַט־מַיִם וְרַחֲצוּ רַגְלֵיכֶם וְהִשָּׁעֲנוּ תַּחַת הָעֵץ'
    source: תרגום אונקלוס, בראשית יח, ד
    vocalized: יִסְּבוּן כְּעַן זְעֵיר מַיָּא וְאַסְחוּ רַגְלֵיכוֹן וְאִסְתְּמִיכוּ תְּחוֹת אִילָנָא
- id: anana
  text: עננא
  translation: הענן
  pos: noun
  example:
    text: וסלק משה לטורא וחפא עננא ית טורא
    translation: 'בתורה: וַיַּעַל מֹשֶׁה אֶל־הָהָר וַיְכַס הֶעָנָן אֶת־הָהָר'
    source: תרגום אונקלוס, שמות כד, טו
    vocalized: וּסְלֵק משֶׁה לְטוּרָא וַחֲפָא עֲנָנָא יָת טוּרָא
- id: ishta
  text: אשתא
  translation: האש
  pos: noun
  example:
    text: לא תבערון אשתא בכל מותבניכון ביומא דשבתא
    translation: 'בתורה: לֹא־תְבַעֲרוּ אֵשׁ בְּכֹל מֹשְׁבֹתֵיכֶם בְּיוֹם הַשַּׁבָּת'
    source: תרגום אונקלוס, שמות לה, ג
    vocalized: לָא תְבַעֲרוּן אֶשָׁתָא בְּכֹל מוֹתְבָנֵיכוֹן בְּיוֹמָא דְשַׁבְּתָא
- id: beira
  text: בעירא
  translation: בהמה
  pos: noun
  example:
    text: וכל בעירא ועדי קרויא בזנא לנא
    translation: 'בתורה: וְכָל־הַבְּהֵמָה וּשְׁלַל הֶעָרִים בַּזּוֹנוּ לָנוּ'
    source: תרגום אונקלוס, דברים ג, ז
    vocalized: וְכָל בְּעִירָא וַעֲדִי קִרְוַיָא בַּזָנָא לָנָא
- id: cheita
  text: חיתא
  translation: חיה
  pos: noun
  example:
    text: והוה כד דחילא חיתא מן קדם יי ועבד להון בתין
    translation: 'בתורה: וַיְהִי כִּי־יָרְאוּ הַמְיַלְּדֹת אֶת־הָאֱלֹהִים וַיַּעַשׂ לָהֶם בָּתִּים'
    source: תרגום אונקלוס, שמות א, כא
    vocalized: וַהֲוָה כַּד דְחִילָא חַיָתָא מִן קֳדָם יְיָ וַעֲבַד לְהוֹן בָּתִּין
- id: ana-tson
  text: ענא
  translation: צאן
  pos: noun
  example:
    text: ואזלו אחוהי למרעי ית ענא דאבוהון בשכם
    translation: 'בתורה: וַיֵּלְכוּ אֶחָיו לִרְעוֹת אֶת־צֹאן אֲבִיהֶם בִּשְׁכֶם'
    source: תרגום אונקלוס, בראשית לז, יב
    vocalized: וַאֲזָלוּ אֲחוֹהִי לְמִרְעֵי יָת עָנָא דַאֲבוּהוֹן בִּשְׁכֶם
- id: ofa
  text: עופא
  translation: עוף
  pos: noun
  example:
    text: כל עופא דכי תיכלון
    translation: 'בתורה: כָּל־עוֹף טָהוֹר תֹּאכֵלוּ'
    source: תרגום אונקלוס, דברים יד, כ
    vocalized: כָּל עוֹפָא דְכֵי תֵּיכְלוּן
- id: turei
  text: תורי
  translation: שוורים
  pos: noun
  example:
    text: בדא יהי עלל אהרן לקודשא בתור בר תורי לחטאתא ודכר לעלתא
    translation: 'בתורה: בְּזֹאת יָבֹא אַהֲרֹן אֶל־הַקֹּדֶשׁ בְּפַר בֶּן־בָּקָר לְחַטָּאת וְאַיִל לְעֹלָה'
    source: תרגום אונקלוס, ויקרא טז, ג
    vocalized: בְּדָא יְהֵי עָלֵל אַהֲרֹן לְקוּדְשָׁא בְּתוֹר בַּר תּוֹרֵי לְחַטָּאתָא וּדְכַר לַעֲלָתָא
- id: chashocha
  text: חשוכא
  translation: חושך
  pos: noun
  example:
    text: ולמשלט ביממא ובליליא ולאפרשא בין נהורא ובין חשוכא וחזא יי ארי טב
    translation: 'בתורה: וְלִמְשֹׁל בַּיּוֹם וּבַלַּיְלָה וּלֲהַבְדִּיל בֵּין הָאוֹר וּבֵין הַחֹשֶׁךְ וַיַּרְא אֱלֹהִים כִּי־טוֹב'
    source: תרגום אונקלוס, בראשית א, יח
    vocalized: וּלְמִשְׁלַט בִּימָמָא וּבְלֵילְיָא וּלְאַפְרָשָׁא בֵּין נְהוֹרָא וּבֵין חֲשׁוֹכָא וַחֲזָא יְיָ אֲרֵי טָב
- id: nehora
  text: נהורא
  translation: אור
  pos: noun
  example:
    text: ואמר יי יהי נהורא והוה נהורא
    translation: 'בתורה: וַיֹּאמֶר אֱלֹהִים יְהִי אוֹר וַיְהִי־אוֹר'
    source: תרגום אונקלוס, בראשית א, ג
    vocalized: וַאֲמַר יְיָ יְהֵי נְהוֹרָא וַהֲוָה נְהוֹרָא
