- id: u21-l2
  kind: new
  title:
    he: ולא מחו ביה
    en: And they did not protest
  exercises:
  - id: u21-l2-21
    type: dialogue
    scene: ר׳ ישראל ממשיך, לאט.
    lines:
    - speaker: yisrael
      text: 'בר קמצא ביקש: ״שבקן״, הנח לי, אשלם על מה שאני אוכל. אחר כך על חצי הסעודה. אחר כך על כל הסעודה.'
      translation: שבקן, יהיבנא
    - speaker: yisrael
      text: ״נקטיה בידיה ואפקיה״. תפס אותו והוציא אותו. וחכמים ישבו שם, ״ולא מחו ביה״.
      translation: לא מחו
    - speaker: eitan
      text: ר׳ ישראל, למה אתה מספר לי את זה דווקא היום?
      translation: איתן
    - speaker: yisrael
      text: כי פעם סבא שלך ואני לא דיברנו שנה שלמה, על שטות. ואף אחד מסביב לא אמר לנו כלום. מי ששבר את השתיקה היה סבתא שלך.
      translation: השתיקה
