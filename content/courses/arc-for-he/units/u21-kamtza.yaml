  exercises:
  - id: u21-l1-01
    type: dialogue
    scene: ערב שקט. רק איתן ור׳ ישראל.
    lines:
    - speaker: yisrael
      text: ״אקמצא ובר קמצא חרוב ירושלים״. בגלל קמצא ובר קמצא חרבה ירושלים.
      translation: הפתיחה
    - speaker: yisrael
      text: אדם אחד, ״דרחמיה קמצא ובעל דבביה בר קמצא״. חברו היה קמצא, והשונא שלו בר קמצא. הוא עשה סעודה ושלח את המשרת להביא את קמצא.
      translation: רחמיה, בעל דבביה
    - speaker: eitan
      text: 'תן לי לנחש: המשרת הביא את בר קמצא.'
      translation: איתן
    - speaker: yisrael
      text: 'והבעל הבית אמר לו: ״מאי בעית הכא? קום פוק!״ מה אתה רוצה כאן? קום, צא!'
      translation: קום פוק
