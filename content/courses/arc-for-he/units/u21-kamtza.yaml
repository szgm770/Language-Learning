id: u21-kamtza
cefr: B2
scene: study
title:
  he: קמצא ובר קמצא
  en: Kamtza and Bar Kamtza
story: 'סיפור קשה: אדם מבויש בסעודה, וחכמים ששתקו. ר׳ ישראל מספר שגם הוא וסבא לא דיברו שנה שלמה, ומי שבר את השתיקה.'
canDo:
- 'לקרוא סיפור אגדה ארוך: קמצא ובר קמצא'
- 'להבין דו־שיח בארמית: מאי בעית הכא? קום פוק! שבקן!'
- להבין ״הואיל ו…״ ו״לא מחו״
