- id: u08-l1
  kind: new
  title:
    he: יומא חד הוה אזל
    en: One day he was walking
  exercises:
  - id: u08-l1-01
    type: dialogue
    scene: ערב. איתן ור׳ ישראל לומדים במטבח של סבא.
    lines:
    - speaker: yisrael
      text: ״יומא חד הוה אזל באורחא״. יום אחד חוני היה הולך בדרך. ״אזל״ = הלך.
      translation: אזל
    - speaker: yisrael
      text: ״חזייה לההוא גברא״, ראה אדם אחד שנוטע חרוב. ״חזא״ = ראה, ״חזייה״ = ראה אותו.
      translation: חזייה
    - speaker: eitan
      text: ושוב ״ההוא גברא״.
      translation: איתן מחייך
    - speaker: yisrael
      text: בגמרא תמיד יש מישהו כזה. בלי שם, אבל לא בלי חשיבות.
      translation: ר׳ ישראל
  - id: u08-l1-02
    type: tip
    title: פעלים בעבר
    text: 'בארמית רוב הפעלים בעבר קצרים: **אזל** = הלך. **אתא** = בא. **חזא** = ראה. **קם** = קם. **נים** = נרדם.


      סיומת **־יה** מוסיפה ״אותו״: **חזייה** = ראה אותו. **אשכחיה** = מצא אותו.


      ולפני ההמשך הם: **אזלו** = הלכו, **אתו** = באו.'
