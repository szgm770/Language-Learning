  exercises:
  - id: u08-l4-53
    type: reading
    kind: גמרא, תענית כג ע״א
    title: חוני המעגל
    text: 'יומא חד הוה אזל באורחא


      חזייה לההוא גברא דהוה נטע חרובא


      אמר ליה האי עד כמה שנין טעין


      אמר ליה עד שבעין שנין'
    translation: 'יום אחד היה הולך בדרך.


      ראה אדם אחד שהיה נוטע עץ חרוב.


      אמר לו: זה, עד כמה שנים (עד שהוא) טוען פרי?


      אמר לו: עד שבעים שנה.'
    lexemes:
    - yoma-chad
    - azal
    - orcha
    - chazyeih
    - shnin
    source: בבלי, תענית כג ע״א
    vocalized: 'יוֹמָא חַד הֲוָה אָזֵל בְּאוֹרְחָא, חַזְיֵיהּ לְהָהוּא גַּבְרָא דַּהֲוָה נָטַע חָרוּבָא, אֲמַר לֵיהּ: הַאי, עַד כַּמָּה שְׁנִין טָעֵין? אֲמַר לֵיהּ: עַד שִׁבְעִין שְׁנִין'
  - id: u08-l4-54
    type: reading
    kind: גמרא, תענית כג ע״א
    title: בר בריה
    text: 'אזל לביתיה


      אמר להו בריה דחוני המעגל מי קיים


      אמרו ליה בריה ליתא בר בריה איתא'
    translation: 'הלך לביתו.


