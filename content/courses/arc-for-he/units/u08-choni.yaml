id: u08-choni
cefr: A2
scene: study
title:
  he: חוני המעגל ישן
  en: Choni sleeps
story: 'ר׳ ישראל מלמד את איתן את סיפור חוני המעגל, שישן שבעים שנה, ואת הפעלים בעבר: אזל, חזא, יתיב, קם. בסוף: ״או חברותא או מיתותא״.'
canDo:
- 'להבין פעלים בעבר: אזל, חזייה, יתיב, נים, קם'
- לקרוא סיפור אגדה רצוף בארמית
- להבין ״או חברותא או מיתותא״
