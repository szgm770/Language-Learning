id: u18-bishlama
cefr: B1
scene: study
title:
  he: בשלמא… אלא…
  en: It works for one, but for the other…
story: הכנות לסיום. איתן מנסה ליישב סתירה בשתי שיטות, ולומד את המבנה ״בשלמא לפלוני ניחא, אלא לפלוני קשיא״, ואת ״אדרבה״.
canDo:
- להבין ״בשלמא… אלא…״ ו״ניחא״
- להבין ״אי אמרת בשלמא״
- להבין ״אדרבה״ ו״טפי״
vocabulary:
- id: bishlama
  text: בשלמא
  translation: מובן (לשיטה זו), אבל…
  pos: adverb
  example:
    text: בשלמא לרב ניחא אלא לשמואל קשיא
    translation: לשיטת רב, מובן ומיושב; אבל לשיטת שמואל, קשה
    source: בבלי, יבמות נו ע״א
    vocalized: בִּשְׁלָמָא לְרַב נִיחָא אֶלָּא לִשְׁמוּאֵל קַשְׁיָא
- id: nicha
  text: ניחא
  translation: מיושב, נוח; ״ניחא ליה״ = נוח לו
  pos: adjective
  example:
    text: בשלמא לרב ניחא אלא לשמואל קשיא
    translation: לשיטת רב, מובן ומיושב; אבל לשיטת שמואל, קשה
    source: בבלי, יבמות נו ע״א
    vocalized: בִּשְׁלָמָא לְרַב נִיחָא אֶלָּא לִשְׁמוּאֵל קַשְׁיָא
- id: i-amart
  text: אי אמרת בשלמא
  translation: אם תאמר (שזו השיטה), מובן…
  pos: phrase
  example:
    text: אי אמרת בשלמא מעני לעני מחלוקת
    translation: אם תאמר שמעני לעני (נחלקו), מובן (שיש) מחלוקת
    source: בבלי, בבא מציעא ט ע״ב
    vocalized: 'אִי אָמְרַתְּ בִּשְׁלָמָא: מֵעָנִי לְעָנִי מַחְלוֹקֶת'
- id: adraba
  text: אדרבה
  translation: להפך!
  pos: adverb
  example:
    text: אדרבה בתר ערבא אזלי
    translation: להפך! הולכים אחרי הערב (הערֵב)
    source: בבלי, בבא בתרא קעג ע״ב
    vocalized: אַדְּרַבָּה, בָּתַר עָרְבָא אָזְלִי
- id: tfei
  text: טפי
  translation: יותר
  pos: adverb
  example:
    text: ואי נמי בהכי ניחא לי דעבדא טפי
    translation: ואם גם בכך נוח לי, שתעבוד (השפחה) יותר
    source: בבלי, בבא בתרא כט ע״א
    vocalized: וְאִי נָמֵי, בְּהָכִי נִיחָא לִי דְּעָבְדָא טְפֵי
- id: f-liteamich
  text: ליטעמיך
  translation: לשיטתך (גם לפי דבריך יש קושיה)
  pos: phrase
- id: f-vetisbera
  text: ותסברא
  translation: וכי אתה סובר כך?
  pos: verb
- id: f-teinach
  text: תינח
  translation: נניח (זה מובן ב…)
  pos: verb
- id: f-alma-lama
  text: אלמה
  translation: למה?
  pos: adverb
- id: f-veachati
  text: ואכתי
