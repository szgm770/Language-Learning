  translation: הועיל
  pos: verb
- id: f-tipuk
  text: תיפוק ליה
  translation: שילמד את זה ממקור אחר!
  pos: phrase
- id: f-ipuch
  text: איפוך
  translation: הפוך!
  pos: verb
