  - id: u18-l1-01
    type: dialogue
    scene: חצות. שבוע לפני הסיום.
    lines:
    - speaker: eitan
      text: יש פה שתי שיטות. לפי אחת הכול מסתדר, ולפי השנייה לא.
      translation: איתן
    - speaker: yisrael
      text: 'בדיוק. הגמרא אומרת: ״בשלמא לרב ניחא, אלא לשמואל קשיא״. לרב מובן, ולשמואל קשה.'
      translation: בשלמא, ניחא
    - speaker: eitan
      text: אז שמואל טעה?
      translation: שאלה
    - speaker: yisrael
      text: לא כל כך מהר. מיד תבוא תשובה לשמואל. ״בשלמא״ רק פותח את השאלה.
      translation: ר׳ ישראל
