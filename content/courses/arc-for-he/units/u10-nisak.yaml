id: u10-nisak
cefr: A2
scene: study
title:
  he: ניסק לאיגרא
  en: Let us go up to the roof
story: אבא חלקיה ואשתו עולים לגג להתפלל, ילדים מבקשים ״אבא, הב לן מיטרא״, ורבי יונה הולך ״לקנות תבואה״. ר׳ ישראל מספר איך ביקשו לחם במתבן.
canDo:
- 'להבין עתיד: ניסק, ניבעי, איזיל, ייתי'
- 'להבין ציווי: הב, הבו, ואת ״לימא לן מר״'
- 'להבין את סוגי הפעלים: נ־ (אנחנו / הוא), א־ (אני), ל־ (שיעשה)'
vocabulary:
- id: nisak
  text: ניסק
  translation: נעלה
  pos: verb
  example:
    text: ניסק לאיגרא וניבעי רחמי
    translation: נעלה לגג ונבקש רחמים
    source: בבלי, תענית כג ע״ב
    vocalized: נִיסַּק לְאִיגָּרָא וְנִיבְעֵי רַחֲמֵי
- id: igra
