- id: u10-l1
  kind: new
  title:
    he: ניסק וניבעי
    en: Let us go up and pray
  exercises:
  - id: u10-l1-01
    type: dialogue
    scene: בוקר גשום. איתן מגיע רטוב.
    lines:
    - speaker: yisrael
      text: 'יפה, גשם. בדיוק בזמן. אבא חלקיה אמר לאשתו: ״ניסק לאיגרא וניבעי רחמי״.'
      translation: ניסק לאיגרא
    - speaker: yisrael
      text: ״ניסק״ = נעלה. ״ניבעי״ = נבקש. נ־ בהתחלה זה ״אנחנו נעשה״, ״בואו נעשה״.
      translation: נ־ = אנחנו
    - speaker: eitan
      text: ולמה דווקא לגג?
      translation: שאלה
    - speaker: yisrael
      text: כדי שהחכמים לא יראו. ״ולא נחזיק טיבותא לנפשין״, שלא ניקח את הקרדיט על הגשם.
      translation: טיבותא
  - id: u10-l1-02
    type: tip
    title: עתיד בארמית
    text: '**נ־** = אנחנו נעשה, בואו נעשה: **ניסק** (נעלה), **ניבעי** (נבקש). בגמרא נ־ משמשת לעתים גם ל״הוא יעשה״.


      **א־** = אני אעשה: **איזיל** (אלך), **אייתי** (אביא).


      **ל־** = שיעשה: **לימא** (שיאמר), **ליתני** (שישנה). **י־** = הוא יעשה: **ייתי** (יבוא).'
