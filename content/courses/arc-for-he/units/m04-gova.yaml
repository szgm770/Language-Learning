  text: ומצלא
  translation: ומתפלל
  pos: verb
  example:
    text: ודניאל כדי ידע די רשים כתבא על לביתה וכוין פתיחן לה בעליתה נגד ירושלם וזמנין תלתה ביומא הוא ברך על ברכוהי ומצלא ומודא קדם אלהה כל קבל די הוא עבד מן קדמת דנה
    translation: וְדָנִיֵּאל, כַּאֲשֶׁר יָדַע שֶׁנִּרְשַׁם הַכְּתָב, נִכְנַס לְבֵיתוֹ, וְחַלּוֹנוֹת פְּתוּחִים לוֹ בַּעֲלִיָּתוֹ מוּל יְרוּשָׁלַיִם, וּפְעָמִים שָׁלֹשׁ בַּיּוֹם, הוּא כּוֹרֵעַ עַל בִּרְכָּיו, וּמִתְפַּלֵּל וּמוֹדֶה לִפְנֵי אֱלֹהָיו, כּמוֹ שֶׁהָיָה עוֹשֶׂה מִלִּפְנֵי זֶה.
