id: m04-gova
cefr: A2
section: mikra
scene: study
title:
  he: כוין פתיחן
  en: Open windows
story: דניאל ממשיך להתפלל שלוש פעמים ביום, מול חלונות פתוחים לכיוון ירושלים, ונזרק לגוב האריות. חנה מוצאת שסבא כתב את הפסוק הזה בעיפרון על קיר המתבן.
canDo:
- להבין אריותא, גבא, צלי, מודא
- להבין ״תלתה זמנין ביומא״
- לקרוא את דניאל ו, יא
