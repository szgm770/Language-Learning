- id: u14-l2
  kind: new
  title:
    he: אלמא
    en: Therefore
  exercises:
  - id: u14-l2-12
    type: tip
    title: איך מוכיחים
    text: '**דיקא נמי דקתני…** = מדויק גם מלשון המשנה.


      **אלמא** = מכאן ש… **קסבר** = הוא סובר (קא + סבר). **מכלל ד…** = משמע ש…


      **מסייע ליה** = מקור שתומך בו. **מהו דתימא… קמ״ל** = הייתי חושב כך, והמשנה משמיעה לנו שלא.'
  - id: u14-l2-13
    type: learn
    lexeme: alma-therefore
  - id: u14-l2-14
    type: learn
    lexeme: kasvar
  - id: u14-l2-15
    type: learn
    lexeme: mesayea
  - id: u14-l2-16
    type: learn
    lexeme: mahu-detima
  - id: u14-l2-17
    type: match_pairs
    pairs:
    - - אלמא
      - מכאן (שמע מכאן ש…)
    - - קסבר
      - הוא סובר; ״קסברי״ = הם סוברים
    - - מסייע ליה
      - מסייע לו (מקור שתומך בשיטתו)
    - - מהו דתימא
