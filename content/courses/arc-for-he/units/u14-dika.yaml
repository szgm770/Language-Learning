id: u14-dika
cefr: B1
scene: study
title:
  he: 'דיקא נמי: ראיות'
  en: Proofs
story: 'איתן מביא ראיה ראשונה, והגמרא מלמדת איך מוכיחים: מדייקים בלשון המשנה, לומדים ״מכלל״, ואומרים ״אלמא״. חנה כותבת לנכד של האיכר בווילנה.'
canDo:
- 'להבין דיוק: ״דיקא נמי דקתני…״'
- 'להבין מסקנה: אלמא, קסבר, מכלל'
- 'להבין ״מהו דתימא… קמ״ל״: מה החידוש'
vocabulary:
- id: dika-nami
  text: דיקא נמי
  translation: מדויק גם (בלשון המקור)
  pos: phrase
  example:
    text: דיקא נמי דקתני כל שהוא ש"מ
    translation: מדויק גם (בלשון המשנה), ששנה ׳כל שהוא׳. מכאן לומדים
    source: בבלי, בבא בתרא כז ע״ב
    vocalized: 'דַּיְקָא נָמֵי, דְּקָתָנֵי: כׇּל שֶׁהוּא. שְׁמַע מִינַּהּ'
- id: michlal
  text: מכלל
  translation: מכלל (זה משמע ש…)
  pos: phrase
  example:
    text: הלכה מכלל דפליגי
    translation: (כשאומרים) ׳הלכה׳, משמע שנחלקו
    source: בבלי, ברכות לג ע״ב
    vocalized: הֲלָכָה מִכְלָל דִּפְלִיגִי
- id: pligi
  text: פליגי
  translation: חולקים, נחלקו
  pos: verb
  example:
    text: הלכה מכלל דפליגי
    translation: (כשאומרים) ׳הלכה׳, משמע שנחלקו
    source: בבלי, ברכות לג ע״ב
    vocalized: הֲלָכָה מִכְלָל דִּפְלִיגִי
- id: alma-therefore
  text: אלמא
  translation: מכאן (שמע מכאן ש…)
  pos: adverb
  example:
    text: אלמא קסברי דאסור לקנאות
    translation: מכאן שהם סוברים שאסור לקנא
    source: בבלי, סוטה ג ע״א
    vocalized: אַלְמָא קָסָבְרִי דְּאָסוּר לְקַנּאוֹת
- id: kasvar
  text: קסבר
  translation: הוא סובר; ״קסברי״ = הם סוברים
  pos: verb
  example:
    text: אלמא קסבר ישנה לשכירות מתחלה ועד סוף
    translation: 'מכאן שהוא סובר: השכירות קיימת מתחילתה ועד סופה'
    source: בבלי, עבודה זרה יט ע״ב
    vocalized: אַלְמָא קָסָבַר, יֶשְׁנָהּ לִשְׂכִירוּת מִתְּחִלָּה וְעַד סוֹף
- id: mesayea
  text: מסייע ליה
  translation: מסייע לו (מקור שתומך בשיטתו)
  pos: phrase
  example:
    text: מסייע ליה לחזקיה דאמר חזקיה מלאהו בקרובים כשר
    translation: '(מקור) מסייע לחזקיה, שאמר חזקיה: מילא אותו בקרובים, כשר'
    source: בבלי, בבא בתרא קסב ע״ב
    vocalized: 'מְסַיַּיע לֵיהּ לְחִזְקִיָּה, דְּאָמַר חִזְקִיָּה: מִלְּאָהוּ בִּקְרוֹבִים כָּשֵׁר'
- id: mahu-detima
  text: מהו דתימא
  translation: הייתי אומר (מה שהיית עלול לחשוב)
  pos: phrase
  example:
    text: מהו דתימא פרושי קא מפרש קמ"ל
    translation: 'היית עלול לומר: (שהוא רק) מפרש. קא משמע לן (שלא)'
    source: בבלי, בבא בתרא קה ע״ב
    vocalized: מַהוּ דְּתֵימָא פָּרוֹשֵׁי קָא מְפָרֵשׁ; קָא מַשְׁמַע לַן
- id: tnina
  text: תנינא
  translation: כבר שנינו (זה כתוב כבר)
  pos: verb
  example:
    text: ורב פפא מאי קמ"ל תנינא
    translation: ורב פפא, מה הוא משמיע לנו? כבר שנינו את זה!
    source: בבלי, עירובין יט ע״ב
    vocalized: וְרַב פָּפָּא מַאי קָא מַשְׁמַע לַן? תְּנֵינָא
- id: dumya
  text: דומיא
  translation: בדומה ל…
  pos: noun
  example:
    text: דיקא נמי דקתני דומיא דסלע ש"מ
    translation: מדויק גם, ששנה (את זה) בדומה לסלע. שמע מינה
    source: בבלי, עירובין פד ע״א
    vocalized: דַּיְקָא נָמֵי דְּקָתָנֵי דּוּמְיָא דְּסֶלַע. שְׁמַע מִינַּהּ
- id: svira-leih
  text: סבירא ליה
  translation: סובר (כך דעתו)
  pos: phrase
  example:
    text: ואיהו כמאן סבירא ליה
    translation: והוא, כמי הוא סובר?
    source: בבלי, ברכות מו ע״א
    vocalized: וְאִיהוּ, כְּמַאן סְבִירָא לֵיהּ
- id: letaameih
  text: לטעמיה
  translation: לשיטתו (הולך בעקבות דבריו במקום אחר)
  pos: adverb
  example:
    text: רבי יוחנן לטעמיה
    translation: רבי יוחנן הולך לשיטתו
    source: בבלי, עבודה זרה נח ע״ב
    vocalized: רַבִּי יוֹחָנָן לְטַעְמֵיהּ
