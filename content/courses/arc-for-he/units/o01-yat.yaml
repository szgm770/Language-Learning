  - id: o01-l2-21
    type: tip
    title: אונקלוס ובבלי
    text: 'בגמרא: **הכא** = כאן, **התם** = שם, **השתא** = עכשיו.


      אצל אונקלוס: **הכא** = כאן, **תמן** = שם, **כען** = עכשיו.


      **אנון** = הם (בגמרא: אינהו). **אנחנא** = אנחנו (בגמרא: אנן).'
