id: o01-yat
cefr: A1
section: onkelos
scene: study
title:
  he: 'בקדמין: ית'
  en: 'In the beginning: yat'
story: יום שישי בבוקר. ר׳ ישראל מציע לאיתן ללמוד יחד ״שניים מקרא ואחד תרגום״ כמו שעשה עם סבא, ופותחים בפסוק הראשון.
canDo:
- 'לזהות את ״ית״: סימן המושא (כמו ״את״)'
- להבין ית, יתיה, יתה, יתהון, יתך, יתי
- להבין כען, תמן, עמא
vocabulary:
- id: yat
  text: ית
  translation: את (לפני מושא)
  pos: preposition
  example:
    text: ולמכיר יהבית ית גלעד
    translation: 'בתורה: וּלְמָכִיר נָתַתִּי אֶת־הַגִּלְעָד'
    source: תרגום אונקלוס, דברים ג, טו
    vocalized: וּלְמָכִיר יְהָבִית יָת גִלְעָד
- id: yateih
  text: יתיה
  translation: אותו
  pos: pronoun
  example:
    text: ועבד משה כמא די פקיד יי יתיה כן עבד
    translation: 'בתורה: וַיַּעַשׂ מֹשֶׁה כַּאֲשֶׁר צִוָּה יְהוָה אֹתוֹ כֵּן עָשָׂה'
    source: תרגום אונקלוס, במדבר יז, כו
    vocalized: וַעֲבַד משֶׁה כְּמָא דִי פַקֵיד יְיָ יָתֵיה כֵּן עֲבָד
- id: yatah
  text: יתה
  translation: אותה
  pos: pronoun
  example:
    text: כל כנשתא דישראל יעבדון יתה
    translation: 'בתורה: כָּל־עֲדַת יִשְׂרָאֵל יַעֲשׂוּ אֹתוֹ'
    source: תרגום אונקלוס, שמות יב, מז
    vocalized: כָּל כְּנִשְׁתָּא דְיִשְׂרָאֵל יַעְבְדוּן יָתֵהּ
- id: yathon
  text: יתהון
  translation: אותם
  pos: pronoun
  example:
    text: אעק ית מדינאי ותקטלון יתהון
    translation: 'בתורה: צָרוֹר אֶת־הַמִּדְיָנִים וְהִכִּיתֶם אוֹתָם'
    source: תרגום אונקלוס, במדבר כה, יז
    vocalized: אָעֵק יַת מִדְיָנָאֵי וְתִקְטְלוּן יָתְהוֹן
- id: yatach
  text: יתך
  translation: אותך
  pos: pronoun
  example:
    text: ינהר יי שכנתה לותך וירחם יתך
    translation: 'בתורה: יָאֵר יְהוָה פָּנָיו אֵלֶיךָ וִיחֻנֶּךָּ'
    source: תרגום אונקלוס, במדבר ו, כה
    vocalized: יַנְהַר יְיָ שְׁכִנְתֵּהּ לְוָתָךְ וִירַחֵם יָתָךְ
- id: yati
  text: יתי
  translation: אותי
  pos: pronoun
  example:
    text: ואתבתון יתי ואמרתון תקין פתגמא די מללתא למעבד
    translation: 'בתורה: וַתַּעֲנוּ אֹתִי וַתֹּאמְרוּ טוֹב־הַדָּבָר אֲשֶׁר־דִּבַּרְתָּ לַעֲשׂוֹת'
    source: תרגום אונקלוס, דברים א, יד
    vocalized: וַאֲתֶבְתּוּן יָתִי וַאֲמַרְתּוּן תַּקִין פִּתְגָמָא דִי מַלֶלְתָּא לְמֶעְבָּד
- id: kean
  text: כען
  translation: עכשיו
  pos: adverb
  example:
    text: ואמר אחזיני כען ית יקרך
    translation: 'בתורה: וַיֹּאמַר הַרְאֵנִי נָא אֶת־כְּבֹדֶךָ'
    source: תרגום אונקלוס, שמות לג, יח
    vocalized: וַאֲמַר אַחֲזֵינִי כְעַן יָת יְקָרָךְ
- id: tamman
  text: תמן
  translation: שם
  pos: adverb
  example:
    text: ואזמן מימרי תמן לבני ישראל ויתקדש ביקרי
    translation: 'בתורה: וְנֹעַדְתִּי שָׁמָּה לִבְנֵי יִשְׂרָאֵל וְנִקְדַּשׁ בִּכְבֹדִי'
    source: תרגום אונקלוס, שמות כט, מג
    vocalized: וֶאֱזַמֵן מֵימְרִי תַמָן לִבְנֵי יִשְׂרָאֵל וְיִתְקַדַשׁ בִּיקָרִי
- id: ama
  text: עמא
  translation: העם
  pos: noun
  example:
    text: ונחו עמא ביומא שביעאה
    translation: 'בתורה: וַיִּשְׁבְּתוּ הָעָם בַּיּוֹם הַשְּׁבִעִי'
    source: תרגום אונקלוס, שמות טז, ל
    vocalized: וְנָחוּ עַמָא בְּיוֹמָא שְׁבִיעָאָה
- id: anun
  text: אנון
  translation: הם
  pos: pronoun
  example:
    text: וקריבן לחינתא אנון ובניהן וסגידו
    translation: 'בתורה: וַתִּגַּשְׁןָ הַשְּׁפָחוֹת הֵנָּה וְיַלְדֵיהֶן וַתִּשְׁתַּחֲוֶיןָ'
    source: תרגום אונקלוס, בראשית לג, ו
    vocalized: וּקְרִיבָן לְחֵינָתָא אִנוּן וּבְנֵיהֶן וּסְגִידוּ
- id: anachna
  text: אנחנא
  translation: אנחנו
  pos: pronoun
  example:
    text: ואמרנא לה כיוני אנחנא לא הוינא אלילי
    translation: 'בתורה: וַנֹּאמֶר אֵלָיו כֵּנִים אֲנָחְנוּ לֹא הָיִינוּ מְרַגְּלִים'
    source: תרגום אונקלוס, בראשית מב, לא
    vocalized: וַאֲמַרְנָא לֵהּ כֵּיוָנֵי אֲנָחְנָא לָא הֲוֵינָא אַלִּילֵי
- id: ant
  text: את
  translation: אתה
  pos: pronoun
  example:
    text: ליט את בקרתא וליט את בחקלא
    translation: 'בתורה: אָרוּר אַתָּה בָּעִיר וְאָרוּר אַתָּה בַּשָּׂדֶה'
    source: תרגום אונקלוס, דברים כח, טז
    vocalized: לִיטּ אַתְּ בְּקַרְתָא וְלִיט אַתְּ בְּחַקְלָא
