  - id: o01-l1-01
    type: dialogue
    scene: יום שישי, שמונה בבוקר. איתן מגיע לר׳ ישראל עם חומש.
    lines:
    - speaker: yisrael
      text: 'סבא שלך ואני קראנו כל יום שישי את הפרשה: פעמיים פסוק, ופעם אחת תרגום אונקלוס. ״שניים מקרא ואחד תרגום״.'
      translation: שניים מקרא ואחד תרגום
    - speaker: eitan
      text: ומה ההבדל בין הארמית של אונקלוס לגמרא?
      translation: שאלה
    - speaker: yisrael
      text: 'אותה שפה, משפחה אחרת. תראה: ״בקדמין ברא יי ית שמיא וית ארעא״. איפה שבתורה יש ״את״, אצל אונקלוס יש ״ית״.'
      translation: ית = את
