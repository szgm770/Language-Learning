    en: We were; he passed away
  exercises:
  - id: y03-l2-15
    type: tip
    title: פעלים בירושלמי
    text: '**עאל** = נכנס. **חמית** = ראית. **מימר** = לומר. **הוינן** = היינו. **יכיל** = יכול.


      **דמך** = ישן, ובלשון עדינה: נפטר.


      בעתיד הירושלמי משתמש ב**י־**: ״ייתי״ (יבוא), ״יימר״ (יאמר). בבבלי לרוב **נ־** או **ל־**.'
