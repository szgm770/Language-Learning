  text: עאל
  translation: 'נכנס (בבבלי: עייל)'
  pos: verb
  example:
    text: יהודה בריבי עאל לכנישתא
    translation: יהודה בנו של רבי נכנס לבית הכנסת
    source: ירושלמי, בבא מציעא ב, ח
    vocalized: יְהוּדָה בְּרִיבִי עָאַל לִכְנִישְׁתָּא
- id: berabi
