id: y03-eal
cefr: A2
section: yerushalmi
scene: study
title:
  he: עאל ונפק
  en: Went in and came out
story: 'בציפורי, ליד בית הכנסת העתיק. איתן לומד את צורות הפועל של הירושלמי: עאל, חמית, הוינן, דמך, יכיל, ואת העתיד ביו״ד.'
canDo:
- 'להבין פעלים בירושלמי: עאל (= עייל), חמית (= חזאי), דמך (= נח נפשו)'
- להבין הוינן, יכיל, מימר
- 'להבין עתיד ביו״ד: ייתי, יימר (בבבלי: נ־ או ל־)'
vocabulary:
