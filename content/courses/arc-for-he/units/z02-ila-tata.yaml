- id: z02-l2
  kind: new
  title:
    he: סטרא ודרגא
    en: Side and level
  exercises:
  - id: z02-l2-15
    type: tip
    title: מילים של מקום
    text: '**לעילא** = למעלה. **לתתא** = למטה. **עלאה** = עליון. **תתאה** = תחתון.


      **סטרא** = צד: **סטרא דימינא** (צד ימין, חסד), **סטרא דשמאלא** (צד שמאל, דין), **סטרא אחרא** (הצד האחר, הרע).


      **דרגא** = מדרגה. **אתר** = מקום.'
