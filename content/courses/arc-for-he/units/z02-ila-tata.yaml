id: z02-ila-tata
cefr: A2
section: zohar
scene: study
title:
  he: לעילא ולתתא
  en: Above and below
story: 'במירון, ליד המדורה. ר׳ ישראל מסביר את מילות המקום של הזוהר: למעלה ולמטה, צד ימין וצד שמאל, דרגות והיכלות.'
canDo:
- להבין עלאה, לעילא, לתתא, תתאה
- להבין סטרא, סטרא אחרא, ימינא, שמאלא
- להבין דרגא, היכלא, אתר
