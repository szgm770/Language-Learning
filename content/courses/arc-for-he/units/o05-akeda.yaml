id: o05-akeda
cefr: A2
section: onkelos
scene: study
title:
  he: ואזלו תרויהון כחדא
  en: And the two went together
story: 'פרשת וירא, העקדה. לומדים את הפעלים של אונקלוס: מלל, אקדים, נסב, תב, יתב, סגיד, וגם את ״כחדא״.'
canDo:
- 'להבין פעלים בעבר: מלל, אקדים, נסב, תב, יתב, סגיד'
- להבין ״תרויהון כחדא״
- לקרוא את פסוקי העקדה בתרגום
vocabulary:
- id: akdim
  text: ואקדים
  translation: והשכים (קם מוקדם)
  pos: verb
  example:
    text: ואקדים אברהם בצפרא לאתרא דשמש תמן בצלו קדם יי
    translation: 'בתורה: וַיַּשְׁכֵּם אַבְרָהָם בַּבֹּקֶר אֶל־הַמָּקוֹם אֲשֶׁר־עָמַד שָׁם אֶת־פְּנֵי יְהוָה'
    source: תרגום אונקלוס, בראשית יט, כז
    vocalized: וְאַקְדֵּים אַבְרָהָם בְּצַפְרָא לְאַתְרָא דִּשַׁמֵשׁ תַּמָּן בִּצְלוֹ קֳדָם יְיָ
- id: nesav
  text: ודבר
  translation: ולקח
  pos: verb
  example:
    text: ודבר אברהם עאן ותורין ויהב לאבימלך וגזרו תרויהון קים
    translation: 'בתורה: וַיִּקַּח אַבְרָהָם צֹאן וּבָקָר וַיִּתֵּן לַאֲבִימֶלֶךְ וַיִּכְרְתוּ שְׁנֵיהֶם בְּרִית'
    source: תרגום אונקלוס, בראשית כא, כז
    vocalized: וּדְבַר אַבְרָהָם עָאן וְתוֹרִין וִיהַב לַאֲבִימֶלֶךְ וּגְזָרוּ תַרְוֵיהוֹן קְיָם
- id: ulam
  text: עולימוהי
  translation: נעריו
  pos: noun
  example:
    text: ותב אברהם לות עולימוהי וקמו ואזלו כחדא לבאר שבע ויתיב אברהם בבאר שבע
    translation: 'בתורה: וַיָּשָׁב אַבְרָהָם אֶל־נְעָרָיו וַיָּקֻמוּ וַיֵּלְכוּ יַחְדָּו אֶל־בְּאֵר שָׁבַע וַיֵּשֶׁב אַבְרָהָם בִּבְאֵר שָׁבַע'
    source: תרגום אונקלוס, בראשית כב, יט
    vocalized: וְתַב אַבְרָהָם לְוָת עוּלֵימוֹהִי וְקָמוּ וַאֲזָלוּ כַחֲדָא לִבְאֵר שָׁבַע וִיתֵיב אַבְרָהָם בִּבְאֵר שָׁבַע
- id: kachada
  text: כחדא
  translation: יחד
  pos: adverb
  example:
    text: לא תרדי בתורא ובחמרא כחדא
    translation: 'בתורה: לֹא־תַחֲרֹשׁ בְּשׁוֹר־וּבַחֲמֹר יַחְדָּו'
    source: תרגום אונקלוס, דברים כב, י
    vocalized: לָא תִרְדֵי בְתוֹרָא וּבַחֲמָרָא כַּחֲדָא
- id: tarvehon
  text: תרויהון
  translation: שניהם
  pos: pronoun
  example:
    text: והוו תרויהון ערטילאין אדם ואתתה ולא מתכלמין
    translation: 'בתורה: וַיִּהְיוּ שְׁנֵיהֶם עֲרוּמִּים הָאָדָם וְאִשְׁתּוֹ וְלֹא יִתְבֹּשָׁשׁוּ'
    source: תרגום אונקלוס, בראשית ב, כה
    vocalized: וַהֲווֹ תַרְוֵיהוֹן עַרְטִילָאִין אָדָם וְאִתְּתֵהּ וְלָא מִתְכַּלְמִין
- id: mallel
  text: מלל
  translation: דיבר
  pos: verb
  example:
    text: מלל עם בני ישראל ותימר להון אנא יי אלהכון
    translation: 'בתורה: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל וְאָמַרְתָּ אֲלֵהֶם אֲנִי יְהוָה אֱלֹהֵיכֶם'
    source: תרגום אונקלוס, ויקרא יח, ב
    vocalized: מַלֵל עִם בְּנֵי יִשְׂרָאֵל וְתֵימַר לְהוֹן אֲנָא יְיָ אֱלָהָכוֹן
- id: tav
  text: ותב
  translation: וחזר
  pos: verb
  example:
    text: ותב ביומא ההוא עשו לארחה לשעיר
    translation: 'בתורה: וַיָּשָׁב בַּיּוֹם הַהוּא עֵשָׂו לְדַרְכּוֹ שֵׂעִירָה'
    source: תרגום אונקלוס, בראשית לג, טז
    vocalized: וְתַב בְּיוֹמָא הַהוּא עֵשָׂו לְאָרְחֵהּ לְשֵׂעִיר
- id: yetiv
  text: ויתב
  translation: וישב
  pos: verb
  example:
    text: ויתב יצחק בגרר
    translation: 'בתורה: וַיֵּשֶׁב יִצְחָק בִּגְרָר'
    source: תרגום אונקלוס, בראשית כו, ו
    vocalized: וִיתֵב יִצְחָק בִּגְרָר
- id: sgid
  text: וסגיד
  translation: והשתחווה
  pos: verb
  example:
    text: וסגיד אברהם קדם עמא דארעא
    translation: 'בתורה: וַיִּשְׁתַּחוּ אַבְרָהָם לִפְנֵי עַם הָאָרֶץ'
    source: תרגום אונקלוס, בראשית כג, יב
    vocalized: וּסְגִיד אַבְרָהָם קֳדָם עַמָּא דְאַרְעָא
- id: chaza
  text: וחזא
  translation: וראה
  pos: verb
  example:
    text: וחזא ישראל ית בני יוסף ואמר מן אלין
    translation: 'בתורה: וַיַּרְא יִשְׂרָאֵל אֶת־בְּנֵי יוֹסֵף וַיֹּאמֶר מִי־אֵלֶּה'
    source: תרגום אונקלוס, בראשית מח, ח
    vocalized: וַחֲזָא יִשְׂרָאֵל יָת בְּנֵי יוֹסֵף וַאֲמַר מַן אִלֵּין
- id: nefaku
  text: נפקו
  translation: יצאו
  pos: verb
  example:
    text: והוה ביומא שביעאה נפקו מן עמא למלקט ולא אשכחו
    translation: 'בתורה: וַיְהִי בַּיּוֹם הַשְּׁבִיעִי יָצְאוּ מִן־הָעָם לִלְקֹט וְלֹא מָצָאוּ'
    source: תרגום אונקלוס, שמות טז, כז
    vocalized: וַהֲוָה בְּיוֹמָא שְׁבִיעָאָה נְפָקוּ מִן עַמָא לְמִלְקָטּ וְלָא אַשְׁכָּחוּ
- id: karivu
  text: וקריבו
  translation: והתקרבו
  pos: verb
  example:
    text: וקריבו ונטלנון בכתניהון למברא למשריתא כמא די מליל משה
    translation: 'בתורה: וַיִּקְרְבוּ וַיִּשָּׂאֻם בְּכֻתֳּנֹתָם אֶל־מִחוּץ לַמַּחֲנֶה כַּאֲשֶׁר דִּבֶּר מֹשֶׁה'
    source: תרגום אונקלוס, ויקרא י, ה
    vocalized: וּקְרִיבוּ וּנְטָלֻּנוּן בְּכִתֻּנֵיהוֹן לְמִבָּרָא לְמַשְׁרִיתָא כְּמָא דִי מַלִיל מֹשֶׁה
