id: u04-sheelot
cefr: A1
scene: study
title:
  he: מאן? היכא? אימת? אמאי?
  en: Who? Where? When? Why?
story: בשולי הדף סבא כתב ארבע שאלות. ר׳ ישראל פותח עם איתן את הדף הראשון של הש״ס, ברכות ב, שכולו שאלות.
canDo:
- 'לזהות את מילות השאלה: מאן, היכא, אימת, אמאי, היכי דמי, מנלן'
- להבין ״מאי טעמא״, ״מהו״, ״תיקו״
- לקרוא את פתיחת הגמרא במסכת ברכות
vocabulary:
- id: heichi-dami
  text: היכי דמי
  translation: איך זה נראה? באיזה מקרה מדובר?
  pos: phrase
  example:
    text: היכי דמי סולם המצרי אמרי דבי ר' ינאי כל שאין לו ארבעה חווקין
    translation: 'איך נראה ׳סולם מצרי׳? אמרו בבית רבי ינאי: כל (סולם) שאין לו ארבעה שלבים'
    source: בבלי, בבא בתרא נט ע״א
    vocalized: 'הֵיכִי דָּמֵי סוּלָּם הַמִּצְרִי? אָמְרִי דְּבֵי רַבִּי יַנַּאי: כֹּל שֶׁאֵין לוֹ אַרְבָּעָה חֲווֹקִין'
- id: heicha
  text: היכא
  translation: איפה? היכן?
  pos: adverb
  example:
    text: תנא היכא קאי דקתני מאימתי
    translation: התנא, על מה הוא עומד (סומך) ששונה ׳מאימתי׳?
    source: בבלי, ברכות ב ע״א
    vocalized: תַּנָּא הֵיכָא קָאֵי דְּקָתָנֵי מֵאֵימָתַי
- id: kai
  text: קאי
  translation: 'עומד; גם: סומך על'
  pos: verb
  example:
    text: תנא אקרא קאי דכתיב בשכבך ובקומך
    translation: 'התנא סומך על הפסוק, שכתוב: ׳ובשכבך ובקומך׳'
    source: בבלי, ברכות ב ע״א
    vocalized: 'תַּנָּא אַקְּרָא קָאֵי, דִּכְתִיב: בְּשָׁכְבְּךָ וּבְקוּמֶךָ'
- id: man
  text: מאן
  translation: מי?
  pos: pronoun
  example:
    text: אתא לקמיה דרבי אמי אמר ליה מאן שם לך
    translation: 'בא לפני רבי אמי. אמר לו: מי העריך (את הנכס) בשבילך?'
    source: בבלי, כתובות צח ע״א
    vocalized: 'אֲתָא לְקַמֵּיהּ דְּרַבִּי אַמֵּי. אֲמַר לֵיהּ: מַאן שָׁם לָךְ'
- id: amai
  text: אמאי
  translation: למה?
  pos: adverb
  example:
    text: אמאי נוגעין בעדותן הן
    translation: למה (הם כשרים)? הרי הם נוגעים בעדותם (יש להם עניין בדבר)!
    source: בבלי, בבא בתרא מג ע״א
    vocalized: אַמַּאי? נוֹגְעִין בְּעֵדוּתָן הֵן
- id: eimat
  text: אימת
  translation: מתי?
  pos: adverb
  example:
    text: ועד אימת אמר רב נחמן בר יצחק עד זמן ברכה
    translation: 'ועד מתי? אמר רב נחמן בר יצחק: עד זמן ברכה'
    source: בבלי, ברכות כג ע״ב
    vocalized: 'וְעַד אֵימַת? אָמַר רַב נַחְמָן בַּר יִצְחָק: עַד זְמַן בְּרָכָה'
- id: menalan
  text: מנלן
  translation: מניין לנו? (מאיזה מקור?)
  pos: adverb
  example:
    text: והתם מנלן
    translation: ושם, מניין לנו?
    source: בבלי, חגיגה יז ע״א
    vocalized: וְהָתָם מְנָלַן
- id: mai-taama
  text: מאי טעמא
  translation: 'מה הטעם? (בקיצור: מ״ט)'
  pos: phrase
  example:
    text: מאי טעמא דרבי
    translation: מה הטעם של רבי?
    source: בבלי, מנחות מז ע״א
    vocalized: מַאי טַעְמָא דְּרַבִּי
- id: mahu
  text: מהו
  translation: מה הדין?
  pos: pronoun
  example:
    text: בסירוגין מהו תיקו
    translation: (אם הם) לסירוגין, מה הדין? תיקו (השאלה נשארת בספק)
    source: בבלי, בבא בתרא סב ע״ב
    vocalized: בְּסֵירוּגִין, מַהוּ? תֵּיקוּ
- id: teiku
  text: תיקו
  translation: השאלה נשארת בספק
  pos: phrase
  example:
    text: בסירוגין מהו תיקו
    translation: (אם הם) לסירוגין, מה הדין? תיקו (השאלה נשארת בספק)
    source: בבלי, בבא בתרא סב ע״ב
    vocalized: בְּסֵירוּגִין, מַהוּ? תֵּיקוּ
- id: mai-shna
  text: מאי שנא
  translation: מה שונה? למה דווקא?
  pos: phrase
  example:
    text: ותו מאי שנא דתני בערבית ברישא לתני דשחרית ברישא
    translation: 'ועוד: למה שנה (קריאת שמע) של ערבית קודם? שישנה של שחרית קודם!'
    source: בבלי, ברכות ב ע״א
    vocalized: 'וְתוּ: מַאי שְׁנָא דְּתָנֵי בְּעַרְבִית בְּרֵישָׁא? לִתְנֵי דְּשַׁחֲרִית בְּרֵישָׁא'
- id: vetu
  text: ותו
  translation: ועוד (שאלה נוספת)
  pos: adverb
  example:
    text: ותו מאי שנא דתני בערבית ברישא לתני דשחרית ברישא
    translation: 'ועוד: למה שנה (קריאת שמע) של ערבית קודם? שישנה של שחרית קודם!'
