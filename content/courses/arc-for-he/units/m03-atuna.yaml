id: m03-atuna
cefr: A2
section: mikra
scene: study
title:
  he: אתון נורא יקדתא
  en: The burning fiery furnace
story: חנניה, מישאל ועזריה מסרבים להשתחוות לצלם ונזרקים לכבשן. ר׳ ישראל מצטרף לקריאה, ושותק ליד ״לא איתינא פלחין״.
canDo:
- להבין נורא, יקדתא, אתון
- להבין סגד ופלח (השתחווה, עבד)
- להבין ״הא אנה חזה״ וגם ״לא איתינא״
vocabulary:
- id: nura
  text: נורא
  translation: האש
  pos: noun
  example:
    text: ומן די לא יפל ויסגד יתרמא לגוא אתון נורא יקדתא
    translation: וּמִי שֶׁלֹּא יִפֹּל וְיִשְׁתַּחֲוֶה, יֻשְׁלַךְ לְתוֹךְ כִּבְשַׁן הָאֵשׁ הַבּוֹעֶרֶת.
    source: דניאל ג, יא
    vocalized: וּמַן דִּי לָא יִפֵּל וְיִסְגֻּד יִתְרְמֵא לְגוֹא אַתּוּן נוּרָא יָקִדְתָּא
- id: yakidta
  text: יקדתא
  translation: הבוערת
  pos: adjective
  example:
    text: ומן די לא יפל ויסגד יתרמא לגוא אתון נורא יקדתא
    translation: וּמִי שֶׁלֹּא יִפֹּל וְיִשְׁתַּחֲוֶה, יֻשְׁלַךְ לְתוֹךְ כִּבְשַׁן הָאֵשׁ הַבּוֹעֶרֶת.
    source: דניאל ג, יא
    vocalized: וּמַן דִּי לָא יִפֵּל וְיִסְגֻּד יִתְרְמֵא לְגוֹא אַתּוּן נוּרָא יָקִדְתָּא
- id: atun
  text: אתון
  translation: כבשן
  pos: noun
  example:
    text: ומן די לא יפל ויסגד יתרמא לגוא אתון נורא יקדתא
    translation: וּמִי שֶׁלֹּא יִפֹּל וְיִשְׁתַּחֲוֶה, יֻשְׁלַךְ לְתוֹךְ כִּבְשַׁן הָאֵשׁ הַבּוֹעֶרֶת.
    source: דניאל ג, יא
    vocalized: וּמַן דִּי לָא יִפֵּל וְיִסְגֻּד יִתְרְמֵא לְגוֹא אַתּוּן נוּרָא יָקִדְתָּא
- id: sagid
  text: סגד
  translation: משתחווה
  pos: verb
  example:
    text: באדין מלכא נבוכדנצר נפל על אנפוהי ולדניאל סגד ומנחה וניחחין אמר לנסכה לה
    translation: אָז הַמֶּלֶךְ נְבוּכַדְנֶצַּר נָפַל עַל פָּנָיו, וּלְדָנִיֵּאל הִשְׁתַּחֲוָה, וּמִנְחָה וּקְטֹרֶת אָמַר לְנַסֵּךְ לוֹ.
    source: דניאל ב, מו
    vocalized: בֵּאדַיִן מַלְכָּא נְבוּכַדְנֶצַּר נְפַל עַל אַנְפּוֹהִי וּלְדָנִיֵּאל סְגִד וּמִנְחָה וְנִיחֹחִין אֲמַר לְנַסָּכָה לֵהּ
- id: palach
  text: פלחין
  translation: עובדים (עבודת אלילים או ה׳)
  pos: verb
  example:
    text: הן איתי אלהנא די אנחנא פלחין יכל לשיזבותנא מן אתון נורא יקדתא ומן ידך מלכא ישיזב
    translation: אִם יֵשׁ [בִּרְצוֹנוֹ], אֱלֹהֵינוּ אֲשֶׁר אֲנַחְנוּ עוֹבְדִים, יָכֹל לְהוֹשִׁיעֵנוּ מִן כִּבְשַׁן הָאֵשׁ הַבּוֹעֶרֶת, וּמִן יָדְךָ, הַמֶּלֶךְ, יוֹשִׁיעַ.
    source: דניאל ג, יז
    vocalized: הֵן אִיתַי אֱלָהַנָא דִּי אֲנַחְנָא פָלְחִין יָכִל לְשֵׁיזָבוּתַנָא מִן אַתּוּן נוּרָא יָקִדְתָּא וּמִן יְדָךְ מַלְכָּא יְשֵׁיזִב
- id: gavrin
  text: גברין
  translation: אנשים
  pos: noun
  example:
    text: כל קבל דנה בה זמנא קרבו גברין כשדאין ואכלו קרציהון די יהודיא
    translation: אָז בּוֹ בַזְּמַן, קָרְבוּ אֲנָשִׁים כַּשְׂדִּים וְאָכְלוּ בְּשָׂרָם שֶׁל הַיְּהוּדִים.
    source: דניאל ג, ח
    vocalized: כָּל קֳבֵל דְּנָה בֵּהּ זִמְנָא קְרִבוּ גֻּבְרִין כַּשְׂדָּאִין וַאֲכַלוּ קַרְצֵיהוֹן דִּי יְהוּדָיֵא
- id: aru
  text: ארו
  translation: הנה
  pos: adverb
  example:
    text: ענה דניאל ואמר חזה הוית בחזוי עם ליליא וארו ארבע רוחי שמיא מגיחן לימא רבא
    translation: 'עוֹנֶה דָנִיֵּאל וְאוֹמֵר: רוֹאֶה הָיִיתִי בְּחֶזְיוֹנִי עִם הַלַּיְלָה, וְהִנֵּה אַרְבַּע רוּחוֹת הַשָּׁמַיִם מְגִיחוֹת לַיָּם הַגָּדוֹל.'
    source: דניאל ז, ב
    vocalized: עָנֵה דָנִיֵּאל וְאָמַר חָזֵה הֲוֵית בְּחֶזְוִי עִם לֵילְיָא וַאֲרוּ אַרְבַּע רוּחֵי שְׁמַיָּא מְגִיחָן לְיַמָּא רַבָּא
- id: arbaa
  text: ארבעה
  translation: ארבעה (4)
  pos: number
  example:
    text: אלין חיותא רברבתא די אנין ארבע ארבעה מלכין יקומון מן ארעא
    translation: אֵלֶּה הַחַיּוֹת הַגְּדוֹלוֹת אֲשֶׁר הֵן אַרְבַּע, אַרְבָּעָה מְלָכִים יַעַמְדוּ מִן הָאָרֶץ.
    source: דניאל ז, יז
    vocalized: אִלֵּין חֵיוָתָא רַבְרְבָתָא דִּי אִנִּין אַרְבַּע אַרְבְּעָה מַלְכִין יְקוּמוּן מִן אַרְעָא
- id: sharayin
  text: שרין
  translation: משוחררים, מותרים
  pos: adjective
  example:
    text: ענה ואמר הא אנה חזה גברין ארבעה שרין מהלכין בגוא נורא וחבל לא איתי בהון ורוה די רביעיא רביעאה דמה לבר אלהין
    translation: 'עוֹנֶה וְאוֹמֵר: הִנֵּה אֲנִי רוֹאֶה אֲנָשִׁים אַרְבָּעָה, מֻתָּרִים, מְהַלְּכִים בְּתוֹךְ הָאֵשׁ, וְנֶזֶק אֵין בָּהֶם, וּמַרְאֵהוּ שֶׁל הָרְבִיעִי דּוֹמֶה לְבֶן אֱלֹהִים.'
    source: דניאל ג, כה
    vocalized: עָנֵה וְאָמַר הָא אֲנָה חָזֵה גֻּבְרִין אַרְבְּעָה שְׁרַיִן מַהְלְכִין בְּגוֹא נוּרָא וַחֲבָל לָא אִיתַי בְּהוֹן וְרֵוֵהּ דִּי רביעיא [רְבִיעָאָה] דָּמֵה לְבַר אֱלָהִין
- id: mehalchin
  text: מהלכין
  translation: מתהלכים
  pos: verb
  example:
    text: כען אנה נבוכדנצר משבח ומרומם ומהדר למלך שמיא די כל מעבדוהי קשט וארחתה דין ודי מהלכין בגוה יכל להשפלה
    translation: עַתָּה, אֲנִי נְבוּכַדְנֶצַּר מְשַׁבַּח וּמְרוֹמֵם וּמְהַדַּר אֶת מֶלֶךְ הַשָּׁמַיִם, אֲשֶׁר כָּל מַעֲשָׂיו אֱמֶת, וּדְרָכָיו מִשְׁפָט, וַאֲשֶׁר מְהַלְּכִים בְּגַאֲוָה יָכֹל לְהַשְׁפִּיל.
    source: דניאל ד, לד
    vocalized: כְּעַן אֲנָה נְבוּכַדְנֶצַּר מְשַׁבַּח וּמְרוֹמֵם וּמְהַדַּר לְמֶלֶךְ שְׁמַיָּא דִּי כָל מַעֲבָדוֹהִי קְשֹׁט וְאֹרְחָתֵהּ דִּין וְדִי מַהְלְכִין בְּגֵוָה יָכִל לְהַשְׁפָּלָה
- id: chaval
  text: חבל
  translation: נזק
  pos: noun
  example:
    text: באדין מלכא שגיא טאב עלוהי ולדניאל אמר להנסקה מן גבא והסק דניאל מן גבא וכל חבל לא השתכח בה די הימן באלהה
    translation: אָז הַמֶּלֶךְ הַרְבֵּה הָיָה טוֹב עָלָיו, וְאֶת דָּנִיֵּאל אָמַר לְהַעֲלוֹת מִן הַבּוֹר וְהָעֳלָה דָּנִיֵּאל מִן הַבּוֹר, וְכָל נֶזֶק לֹא נִמְצָא בוֹ, אֲשֶׁר הֶאֱמִין בֵּאלֹהָיו.
    source: דניאל ו, כד
    vocalized: בֵּאדַיִן מַלְכָּא שַׂגִּיא טְאֵב עֲלוֹהִי וּלְדָנִיֵּאל אֲמַר לְהַנְסָקָה מִן גֻּבָּא וְהֻסַּק דָּנִיֵּאל מִן גֻּבָּא וְכָל חֲבָל לָא הִשְׁתְּכַח בֵּהּ דִּי הֵימִן בֵּאלָהֵהּ
- id: itay
  text: איתי
  translation: יש (״איתי״ = ישנו)
  pos: verb
  example:
    text: הן איתי אלהנא די אנחנא פלחין יכל לשיזבותנא מן אתון נורא יקדתא ומן ידך מלכא ישיזב
    translation: אִם יֵשׁ [בִּרְצוֹנוֹ], אֱלֹהֵינוּ אֲשֶׁר אֲנַחְנוּ עוֹבְדִים, יָכֹל לְהוֹשִׁיעֵנוּ מִן כִּבְשַׁן הָאֵשׁ הַבּוֹעֶרֶת, וּמִן יָדְךָ, הַמֶּלֶךְ, יוֹשִׁיעַ.
    source: דניאל ג, יז
