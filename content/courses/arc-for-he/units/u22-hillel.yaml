id: u22-hillel
cefr: B2
scene: study
title:
  he: זיל גמור
  en: Go and learn
story: 'שבוע לפני הסיום. ר׳ ישראל מלמד את הצד השני של קמצא: הלל, שלא דחה אף אחד, ורבן יוחנן בן זכאי, שביקש ״תן לי יבנה וחכמיה״. ומה שנשאר מכל זה: ״זיל גמור״.'
canDo:
- 'להבין את דברי הלל: ״דעלך סני לחברך לא תעביד״'
- להבין ״מידי״, ״אידך״, ״מיזל אזילנא״
- לקרוא שיחה בין רבן יוחנן בן זכאי לאספסיינוס
