  kind: new
  title:
    he: דעלך סני
    en: What is hateful to you
  exercises:
  - id: u22-l1-01
    type: dialogue
    scene: שבוע לפני הסיום. חנה מביאה את רשימת המוזמנים.
    lines:
    - speaker: chana
      text: הזמנתי גם את השכנים של סבא. ואת המשפחה שגרה מעליו, שסבא תמיד התווכח איתם על החניה.
      translation: חנה
    - speaker: yisrael
      text: 'יפה. הלל היה מסכים. גוי בא לשמאי ואמר: למד אותי את כל התורה על רגל אחת. שמאי דחה אותו. הלל ״גייריה״.'
      translation: הלל
    - speaker: yisrael
      text: 'ואמר לו: ״דעלך סני לחברך לא תעביד״. מה ששנוא עליך, אל תעשה לחברך. ״ואידך פירושה הוא, זיל גמור״.'
      translation: זיל גמור
    - speaker: eitan
      text: ״זיל גמור״. לך ולמד. סבא כתב את זה בסוף המחברת שלו.
      translation: איתן
