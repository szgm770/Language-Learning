id: u16-pligi
cefr: B1
scene: study
title:
  he: במאי קמיפלגי
  en: What do they disagree about?
story: 'איתן ור׳ ישראל חלוקים: להזמין את יונאס לישראל או לא. בגמרא לומדים איך מנסחים מחלוקת: מר סבר ומר סבר, במאי קמיפלגי, ולשיטת מי.'
canDo:
- 'להבין מחלוקת: מר סבר… ומר סבר…'
- להבין ״במאי קמיפלגי״ ו״כולי עלמא לא פליגי״
- להבין ״אליבא ד…״ ו״הלכתא כוותיה״
vocabulary:
- id: mar-savar
  text: מר סבר
  translation: חכם אחד סובר (״ומר סבר״ = והשני סובר)
  pos: phrase
  example:
    text: דמר סבר כופין ומר סבר אין כופין
    translation: 'שחכם אחד סובר: כופין, והשני סובר: אין כופין'
