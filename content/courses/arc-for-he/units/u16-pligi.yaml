  - id: u16-l2-12
    type: tip
    title: מחלוקת
    text: '**מר סבר… ומר סבר…** = חכם אחד סובר כך, והשני כך.


      **במאי קמיפלגי?** = במה הם חלוקים? **כולי עלמא לא פליגי** = כולם מסכימים (בזה).


      **אליבא דמאן?** = לשיטת מי? **הלכתא כוותיה** = ההלכה כמותו. **לית הלכתא כוותיה** = אין הלכה כמותו.'
