- id: u20-l1
  kind: new
  title:
    he: אזלינן בספינתא
    en: We were sailing
  exercises:
  - id: u20-l1-01
    type: dialogue
    scene: אחר הצהריים. חנה, איתן ור׳ ישראל מנקים את הבית לקראת הסיום.
    lines:
    - speaker: chana
      text: ר׳ ישראל, איך שרדתם בחורף במתבן? שני ילדים, לבד?
      translation: השאלה של חנה
    - speaker: yisrael
      text: סבא שלך הצחיק אותי. כל לילה סיפור של רבה בר בר חנה. ״זימנא חדא הוה קא אזלינן בספינתא״, פעם אחת היינו הולכים בספינה.
      translation: רבה בר בר חנה
    - speaker: yisrael
      text: ״וחזינן ההוא כוורא״, וראינו דג, עם חול על הגב ועשב צומח עליו.
      translation: כוורא
    - speaker: eitan
      text: -ינן בסוף זה ״אנחנו״. אזלינן, חזינן.
      translation: איתן שם לב
  - id: u20-l1-02
    type: tip
    title: 'אנחנו: ־ינן'
    text: 'פעלים בגוף ראשון רבים מסתיימים ב**־ינן**: **אזלינן** = הולכים אנחנו. **חזינן** = רואים אנחנו. **סברינן** = סבורים אנחנו.


      **הוה קא אזלינן** = היינו הולכים (תיאור בעבר).


      זוכרים את **אמרינן** ו**עסקינן**? אותה סיומת.'
