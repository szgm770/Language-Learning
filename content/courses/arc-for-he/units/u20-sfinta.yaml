  - id: u20-l3-42
    type: reading
    kind: גמרא, בבא בתרא עג ע״ב
    title: רבה בר בר חנה
    text: 'זימנא חדא הוה קא אזלינן בספינתא


      וחזינן ההוא כוורא דיתבא ליה חלתא אגביה וקדח אגמא עילויה


      סברינן יבשתא היא וסלקינן ואפינן ובשלינן אגביה


      וכד חם גביה אתהפיך


      ואי לאו דהוה מקרבא ספינתא הוה טבעינן'
    translation: 'פעם אחת היינו הולכים בספינה,


      וראינו דג אחד שישב עליו חול על גבו, וצמח עליו עשב.


      חשבנו שיבשה היא, ועלינו ואפינו ובישלנו על גבו.


      וכשהתחמם גבו, התהפך.


      ואילולא שהספינה הייתה קרובה, היינו טובעים.'
    lexemes:
