id: u20-sfinta
cefr: B2
scene: study
title:
  he: זימנא חדא הוה קא אזלינן בספינתא
  en: Once we were sailing
story: 'ר׳ ישראל מגלה איך סבא הצחיק אותו במתבן: בסיפורים של רבה בר בר חנה. הדג שנראה כמו אי, והספינה שכמעט טבעה.'
canDo:
- 'לקרוא סיפור אגדה ארוך בגוף ראשון רבים: אזלינן, חזינן, סברינן'
- 'להבין ״אי לאו… הוה…״: אילולא… היה…'
- 'להבין ״לדידי חזי לי״: אני בעצמי ראיתי'
