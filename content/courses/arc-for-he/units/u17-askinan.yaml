id: u17-askinan
cefr: B1
scene: study
title:
  he: הכא במאי עסקינן
  en: What case are we dealing with?
story: 'הדף שיונאס מצא מגיע במעטפה מווילנה. כדי להבין את הציורים בשוליים צריך לדעת באיזה מקרה מדובר. בגמרא לומדים ״אוקימתא״: להעמיד מקור במקרה מסוים.'
canDo:
- להבין ״הכא במאי עסקינן״ ו״כגון״
- להבין ״אילימא… אלא…״ ו״לעולם״
- להבחין בין ״דאורייתא״ ל״דרבנן״, ולהבין ״היינו״
vocabulary:
- id: askinan
  text: הכא במאי עסקינן
  translation: כאן במה אנו עוסקים? (באיזה מקרה מדובר)
  pos: phrase
  example:
    text: הכא במאי עסקינן ביתמי
    translation: כאן במה אנו עוסקים? ביתומים
    source: בבלי, בבא קמא יד ע״ב
    vocalized: הָכָא בְּמַאי עָסְקִינַן בְּיַתְמֵי
- id: kegon
  text: כגון
  translation: כמו, למשל (המקרה הוא…)
  pos: conjunction
  example:
    text: היכי דמי כגון שהקדימו בשבלין
    translation: איך זה נראה? כגון שהקדימו (לעבוד) בשיבולים
    source: בבלי, בבא מציעא צ ע״א
    vocalized: הֵיכִי דָּמֵי? כְּגוֹן שֶׁהִקְדִּימוֹ בְּשִׁבֳּלִין
- id: ilima
  text: אילימא
  translation: אם תאמר (הצעה שתידחה)
  pos: phrase
  example:
    text: במאי עסקינן אילימא
    translation: במה מדובר? אם תאמר…
    source: בבלי, כריתות יב ע״א
    vocalized: בְּמַאי עָסְקִינַן? אִילֵּימָא
- id: leolam
  text: לעולם
  translation: 'באמת (אחרי דחייה: ״לעולם כמו שאמרנו״)'
  pos: adverb
  example:
    text: לעולם דרבנן היא
    translation: באמת, מדרבנן היא
    source: בבלי, זבחים ק ע״ב
    vocalized: לְעוֹלָם דְּרַבָּנַן הִיא
- id: derabanan
  text: דרבנן
  translation: מדרבנן (תקנת חכמים)
  pos: adjective
  example:
    text: לעולם דרבנן היא
    translation: באמת, מדרבנן היא
    source: בבלי, זבחים ק ע״ב
    vocalized: לְעוֹלָם דְּרַבָּנַן הִיא
- id: deoraita
  text: דאורייתא
  translation: מן התורה
  pos: adjective
  example:
    text: מחיצות דאורייתא נינהו
    translation: מחיצות (שיעורי המחיצות) מן התורה הם
    source: בבלי, עירובין ד ע״ב
    vocalized: מְחִיצּוֹת, דְּאוֹרָיְיתָא נִינְהוּ
- id: heinu
  text: היינו
  translation: זה הוא, זה אותו דבר
  pos: pronoun
  example:
    text: היינו רבנן
    translation: זו (בדיוק שיטת) חכמים!
    source: בבלי, ברכות כז ע״א
    vocalized: הַיְינוּ רַבָּנַן
- id: chaishinan
  text: חיישינן
  translation: חוששים אנחנו
  pos: verb
  example:
    text: כשיקרא לא חיישינן
    translation: לשקר (שמא ישקר) אין אנו חוששים
    source: בבלי, כתובות פה ע״ב
    vocalized: כְּשִׁיקְרָא לָא חָיְישִׁינַן
- id: idi-veidi
  text: אידי ואידי
  translation: זה וזה (שניהם)
  pos: phrase
  example:
    text: והא אידי ואידי
    translation: והרי זה וזה (שניהם שווים)!
    source: בבלי, בבא מציעא פא ע״ב
    vocalized: וְהָא אִידֵּי וְאִידֵּי
- id: leimar
  text: למימר
  translation: לומר
  pos: verb
  example:
    text: הלכך ליכא למימר הכי
    translation: לכן אי אפשר לומר כך
    source: בבלי, בבא קמא ח ע״ב
    vocalized: הִלְכָּךְ לֵיכָּא לְמֵימַר הָכִי
- id: bainan
  text: בעינן
  translation: אנחנו צריכים, דרוש
  pos: verb
  example:
    text: אלהים בעינן וליכא
    translation: ״אלהים״ (דיינים סמוכים) אנו צריכים, ואין
    source: בבלי, בבא קמא פד ע״ב
    vocalized: אֱלֹהִים בָּעֵינַן, וְלֵיכָּא
