- id: u17-l1
  kind: new
  title:
    he: במאי עסקינן
    en: What are we dealing with?
  exercises:
  - id: u17-l1-01
    type: dialogue
    scene: מעטפה חומה מווילנה על השולחן. חנה פותחת אותה בכפפות.
    lines:
    - speaker: chana
      text: 'דף אחד, בבא מציעא, וחסרה פינה. ובשוליים שני ציורים: ילד גדול וילד קטן, ובאמצע טלית.'
      translation: הדף מהעליית גג
    - speaker: eitan
      text: ״שנים אוחזין בטלית״! הם ציירו את המשנה.
      translation: איתן
    - speaker: yisrael
      text: לא את המשנה. אותנו. היה לנו מעיל אחד לשנינו בחורף. התווכחנו של מי הוא.
      translation: ר׳ ישראל
    - speaker: chana
      text: אז ״הכא במאי עסקינן״, באיזה מקרה מדובר, זה לא רק בגמרא.
      translation: חנה
  - id: u17-l1-02
    type: tip
    title: אוקימתא
    text: 'כשמקור לא מתאים, הגמרא ״מעמידה״ אותו במקרה מסוים: **הכא במאי עסקינן? כגון…** = כאן מדובר במקרה כמו…


      **אילימא…** = אם תאמר (הצעה ראשונה), ואחריה **אלא…** (הצעה אחרת).


      **לעולם** = באמת. חוזרים להסבר הראשון אחרי שהקושיה נדחתה.'
