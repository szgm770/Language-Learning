  - id: u12-l2-18
    type: tip
    title: מילים של משפחה
    text: '**אבוה** = אביו / אביה. **אימיה** = אמו. **בריה** = בנו. **ברתיה** = בתו. **אחוה** = אחיו.


      **דביתהו** = אשתו. **שיבבתא** = שכנות. **סבא** = זקן.


      **בי רב** = הישיבה, בית המדרש. **בהדיה** = איתו.'
