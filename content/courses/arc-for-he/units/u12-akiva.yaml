  exercises:
  - id: u12-l1-01
    type: dialogue
    scene: חנה מגיעה לשיעור עם הכרך של מסכת כתובות.
    lines:
    - speaker: chana
      text: 'בדף סג סבא כתב בשוליים: ״לרחל שלי, שחיכתה.״ כך קראו לסבתא.'
      translation: הקדשה
    - speaker: yisrael
      text: כמו רחל של רבי עקיבא. בואו נקרא. ״ר״ע רעיא דבן כלבא שבוע הוה״. הוא היה רועה.
      translation: רעיא = רועה
    - speaker: yisrael
      text: ״חזיתיה ברתיה״, ראתה אותו בתו של העשיר, שהוא ״צניע ומעלי״, צנוע ומעולה.
      translation: ברתיה = בתו
    - speaker: eitan
      text: והיא שאלה אותו משהו.
      translation: איתן
    - speaker: yisrael
      text: '״אי מקדשנא לך, אזלת לבי רב?״ אם אתקדש לך, תלך ללמוד? והוא אמר: ״אין״. כן.'
      translation: אין = כן
