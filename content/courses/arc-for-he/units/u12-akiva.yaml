id: u12-akiva
cefr: A2
scene: study
title:
  he: שלי ושלכם שלה הוא
  en: Mine and yours are hers
story: 'בשולי כתובות סג מצאה חנה הקדשה של סבא לסבתא. ר׳ ישראל מלמד את סיפור רבי עקיבא ורחל: הרועה שהלך ללמוד עשרים וארבע שנה, והאישה שחיכתה לו.'
canDo:
- לקרוא סיפור ארוך בארמית ברצף
- 'להבין מילים של משפחה וחיים: ברתיה, אבוה, דביתהו, סבא, שיבבתא'
- להבין ״בי רב״, ״אחריני״, ״שבקוה״
vocabulary:
- id: raya
  text: רעיא
  translation: רועה
  pos: noun
  example:
    text: ר"ע רעיא דבן כלבא שבוע הוה
    translation: רבי עקיבא היה רועה של בן כלבא שבוע
    source: בבלי, כתובות סב ע״ב
    vocalized: רַבִּי עֲקִיבָא רָעֲיָא דְּבֶן כַּלְבָּא שָׂבוּעַ הֲוָה
- id: berateih
  text: ברתיה
  translation: בתו
  pos: noun
  example:
    text: חזיתיה ברתיה דהוה צניע ומעלי
    translation: ראתה אותו בתו (של בן כלבא שבוע), שהיה צנוע ומעולה
    source: בבלי, כתובות סב ע״ב
    vocalized: חֲזִיתֵיהּ בְּרַתֵּיה דַּהֲוָה צְנִיעַ וּמְעַלֵּי
- id: tsania
  text: צניע
  translation: צנוע
  pos: adjective
  example:
    text: חזיתיה ברתיה דהוה צניע ומעלי
    translation: ראתה אותו בתו (של בן כלבא שבוע), שהיה צנוע ומעולה
    source: בבלי, כתובות סב ע״ב
    vocalized: חֲזִיתֵיהּ בְּרַתֵּיה דַּהֲוָה צְנִיעַ וּמְעַלֵּי
- id: bei-rav
  text: בי רב
  translation: בית המדרש, הישיבה
  pos: noun
  example:
    text: אמרה ליה אי מקדשנא לך אזלת לבי רב
    translation: 'אמרה לו: אם אתקדש לך, תלך לבית המדרש (ללמוד)?'
    source: בבלי, כתובות סב ע״ב
    vocalized: 'אֲמַרָה לֵיהּ: אִי מִקַּדַּשְׁנָא לָךְ, אָזְלַתְּ לְבֵי רַב'
- id: in
  text: אין
  translation: כן
  pos: adverb
  example:
    text: אמר לה אין
    translation: 'אמר לה: כן'
    source: בבלי, כתובות סב ע״ב
    vocalized: 'אֲמַר לַהּ: אִין'
- id: shama
  text: שמע
  translation: שמע (עבר); ״שמע מינה״ = למד מכאן
  pos: verb
  example:
    text: שמע אבוה אפקה מביתיה
    translation: שמע אביה, והוציא אותה מביתו
    source: בבלי, כתובות סב ע״ב
    vocalized: שְׁמַע אֲבוּהָ, אַפְּקַהּ מִבֵּיתֵיהּ
- id: avuha
  text: אבוה
  translation: אביו, אביה
  pos: noun
  example:
    text: שמע אבוה אפקה מביתיה
    translation: שמע אביה, והוציא אותה מביתו
    source: בבלי, כתובות סב ע״ב
    vocalized: שְׁמַע אֲבוּהָ, אַפְּקַהּ מִבֵּיתֵיהּ
- id: trei-sar
  text: תרי סרי
  translation: שתים־עשרה, שנים־עשר
  pos: number
  example:
    text: אזיל יתיב תרי סרי שנין בבי רב
    translation: הלך וישב שתים־עשרה שנים בבית המדרש
    source: בבלי, כתובות סב ע״ב
- id: bahadeih
  text: בהדיה
  translation: איתו, עמו
  pos: preposition
  example:
    text: כי אתא אייתי בהדיה תרי סרי אלפי תלמידי
    translation: כשבא, הביא איתו שנים־עשר אלף תלמידים
    source: בבלי, כתובות סב ע״ב
    vocalized: כִּי אֲתָא, אַיְיתִי בַּהֲדֵיהּ תְּרֵי סְרֵי אַלְפֵי תַּלְמִידֵי
- id: tsayit
  text: ציית
  translation: שומע בקול, מציית
  pos: verb
  example:
    text: אמרה ליה אי לדידי ציית יתיב תרי סרי שני אחריני
    translation: 'אמרה לו (לזקן): אם לי הוא שומע, שישב עוד שתים־עשרה שנים'
    source: בבלי, כתובות סג ע״א
- id: achrini
  text: אחריני
  translation: אחרים, נוספים
  pos: adjective
  example:
    text: אמרה ליה אי לדידי ציית יתיב תרי סרי שני אחריני
    translation: 'אמרה לו (לזקן): אם לי הוא שומע, שישב עוד שתים־עשרה שנים'
    source: בבלי, כתובות סג ע״א
- id: lapeih
  text: לאפיה
  translation: לקראתו (לפניו)
  pos: preposition
  example:
    text: שמעה דביתהו הות קא נפקא לאפיה
    translation: שמעה אשתו, והייתה יוצאת לקראתו
    source: בבלי, כתובות סג ע״א
    vocalized: שְׁמַעָה דְּבֵיתְהוּ, הֲוָת קָא נָפְקָא לְאַפֵּיהּ
- id: shivkuha
  text: שבקוה
  translation: הניחו לה! עזבו אותה!
  pos: verb
  example:
    text: שמעיה אמר להו שבקוה שלי ושלכם שלה הוא
    translation: '(כשהתלמידים דחפו אותה) אמר להם: הניחו לה! שלי ושלכם, שלה הוא'
    source: בבלי, כתובות סג ע״א
    vocalized: 'שַׁמָּעֵיהּ. אֲמַר לְהוּ: שִׁבְקוּהָ, שֶׁלִּי וְשֶׁלָּכֶם שֶׁלָּהּ הוּא'
