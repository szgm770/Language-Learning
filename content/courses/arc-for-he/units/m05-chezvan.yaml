- id: yehiv
  text: יהיב
  translation: ניתן
  pos: verb
  example:
    text: ולה יהיב שלטן ויקר ומלכו וכל עממיא אמיא ולשניא לה יפלחון שלטנה שלטן עלם די לא יעדה ומלכותה די לא תתחבל
    translation: וְלוֹ נִתַּן שִׁלְטוֹן וְכָבוֹד וּמַלְכוּת, וְכָל הָעַמִּים, הָאֻמּוֹת וְהַלְּשׁוֹנוֹת אוֹתוֹ יַעַבְדוּ, שִׁלְטוֹנוֹ שִׁלְטוֹן עוֹלָם שֶׁלֹּא יַעֲבֹר, וּמַלְכוּתוֹ אֲשֶׁר לֹא תִפָּסֵד.
    source: דניאל ז, יד
    vocalized: וְלֵהּ יְהִיב שָׁלְטָן וִיקָר וּמַלְכוּ וְכֹל עַמְמַיָּא אֻמַיָּא וְלִשָּׁנַיָּא לֵהּ יִפְלְחוּן שָׁלְטָנֵהּ שָׁלְטָן עָלַם דִּי לָא יֶעְדֵּה וּמַלְכוּתֵהּ דִּי לָא תִתְחַבַּל
- id: yiplechun
  text: יפלחון
  translation: יעבדו
  pos: verb
  example:
    text: ומלכותה ושלטנא ורבותא די מלכות תחות כל שמיא יהיבת לעם קדישי עליונין מלכותה מלכות עלם וכל שלטניא לה יפלחון וישתמעון
    translation: וְהַמַּלְכוּת וְהַשִּׁלְטוֹן, וְהַגְּדֻלָּה שֶׁל מַלְכֻיּוֹת תַּחַת כָּל הַשָּׁמַיִם, נִתְּנָה לְעַם קְדוֹשֵׁי עֶלְיוֹנִים, מַלְכוּתוֹ מַלְכוּת עוֹלָם, וְכָל הַשִּׁלְטוֹנוֹת אוֹתוֹ יַעַבְדוּ וְיִשָּׁמְעוּ [לוֹ].
    source: דניאל ז, כז
    vocalized: וּמַלְכוּתָה וְשָׁלְטָנָא וּרְבוּתָא דִּי מַלְכְוָת תְּחוֹת כָּל שְׁמַיָּא יְהִיבַת לְעַם קַדִּישֵׁי עֶלְיוֹנִין מַלְכוּתֵהּ מַלְכוּת עָלַם וְכֹל שָׁלְטָנַיָּא לֵהּ יִפְלְחוּן וְיִשְׁתַּמְּעוּן
