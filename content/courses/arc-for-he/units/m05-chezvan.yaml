id: m05-chezvan
cefr: B1
section: mikra
scene: study
title:
  he: עתיק יומין
  en: The Ancient of Days
story: 'דניאל ז: ארבע חיות, קרן קטנה, ו״כבר אנש״ שבא עם ענני שמיא. ר׳ ישראל מסביר איך חז״ל קראו את החזון על הגאולה.'
canDo:
- להבין חיותא, רברבן, קרנא, שלטן
- להבין ״בר אנש״, ״עתיק יומין״, ״עם ענני שמיא״
- לקרוא את דניאל ז, יג–יד
vocabulary:
- id: cheyvata
  text: חיותא
  translation: החיות
  pos: noun
  example:
    text: ושאר חיותא העדיו שלטנהון וארכה בחיין יהיבת להון עד זמן ועדן
    translation: וּשְׁאָר הַחַיּוֹת, הֶעֱבִירוּ שִׁלְטוֹנָן, וְאַרְכָּה בְחַיִּים נִתְּנָה לָהֶם עַד זְמַן וְעֵת.
    source: דניאל ז, יב
    vocalized: וּשְׁאָר חֵיוָתָא הֶעְדִּיו שָׁלְטָנְהוֹן וְאַרְכָה בְחַיִּין יְהִיבַת לְהוֹן עַד זְמַן וְעִדָּן
- id: ravrevan
  text: רברבן
  translation: גדולות
  pos: adjective
  example:
    text: וארבע חיון רברבן סלקן מן ימא שנין דא מן דא
    translation: וְאַרְבַּע חַיּוֹת גְּדוֹלוֹת עוֹלוֹת מִן הַיָּם, שׁוֹנוֹת זוֹ מִזּוֹ.
    source: דניאל ז, ג
    vocalized: וְאַרְבַּע חֵיוָן רַבְרְבָן סָלְקָן מִן יַמָּא שָׁנְיָן דָּא מִן דָּא
- id: karna
  text: קרנא
  translation: הקרן
  pos: noun
  example:
    text: חזה הוית באדין מן קל מליא רברבתא די קרנא ממללה חזה הוית עד די קטילת חיותא והובד גשמה ויהיבת ליקדת אשא
    translation: רוֹאֶה הָיִיתִי, אָז, מִקּוֹל הַדְּבָרִים הַגְּדוֹלִים אֲשֶׁר הַקֶּרֶן מְדַבֶּרֶת, רוֹאֶה הָיִיתִי, עַד אֲשֶׁר נֶהֶרְגָה הַחַיָּה, וְהֻשְׁמַד גּוּפָהּ וְנִתְּנָה לִשְׂרֵפַת הָאֵשׁ.
    source: דניאל ז, יא
    vocalized: חָזֵה הֲוֵית בֵּאדַיִן מִן קָל מִלַּיָּא רַבְרְבָתָא דִּי קַרְנָא מְמַלֱּלָה חָזֵה הֲוֵית עַד דִּי קְטִילַת חֵיוְתָא וְהוּבַד גִּשְׁמַהּ וִיהִיבַת לִיקֵדַת אֶשָּׁא
- id: sholtan
  text: שלטן
  translation: שלטון
  pos: noun
  example:
    text: ודי אמרו למשבק עקר שרשוהי די אילנא מלכותך לך קימה מן די תנדע די שלטן שמיא
    translation: וַאֲשֶׁר אָמְרוּ לַעֲזֹב עִקַּר שָׁרָשָׁיו שֶׁל הָעֵץ, מַלְכוּתְךָ לְךָ עוֹמֶדֶת, מִשֶּׁתֵּדַע שֶׁמּוֹשְׁלִים הַשָּׁמַיִם.
    source: דניאל ד, כג
    vocalized: וְדִי אֲמַרוּ לְמִשְׁבַּק עִקַּר שָׁרְשׁוֹהִי דִּי אִילָנָא מַלְכוּתָךְ לָךְ קַיָּמָה מִן דִּי תִנְדַּע דִּי שַׁלִּטִן שְׁמַיָּא
- id: malchuta
  text: מלכותא
  translation: המלכות
  pos: noun
  example:
    text: ודריוש מדיא קבל מלכותא כבר שנין שתין ותרתין
    translation: וְדָרְיָוֶשׁ הַמָּדִי קִבֵּל הַמַּלְכוּת כְּבֶן שָׁנִים שִׁשִּׁים וּשְׁתַּיִם.
    source: דניאל ו, א
    vocalized: וְדָרְיָוֶשׁ מָדָיָא קַבֵּל מַלְכוּתָא כְּבַר שְׁנִין שִׁתִּין וְתַרְתֵּין
- id: ateik
  text: עתיק
  translation: עתיק, זקן
  pos: adjective
  example:
    text: עד די אתה עתיק יומיא ודינא יהב לקדישי עליונין וזמנא מטה ומלכותא החסנו קדישין
    translation: עַד אֲשֶׁר בָּא עַתִּיק הַיָּמִים וְהַמִּשְׁפָּט נִתָּן לְקַדִּישֵׁי עֶלְיוֹנִים, וְהַזְּמָן הִגִּיעַ, וְהַמַּלְכוּת יָרְשׁוּ קְדוֹשִׁים.
    source: דניאל ז, כב
    vocalized: עַד דִּי אֲתָה עַתִּיק יוֹמַיָּא וְדִינָא יְהִב לְקַדִּישֵׁי עֶלְיוֹנִין וְזִמְנָא מְטָה וּמַלְכוּתָא הֶחֱסִנוּ קַדִּישִׁין
- id: bar-enash
  text: בר אנש
  translation: בן אדם
  pos: phrase
  example:
    text: חזה הוית בחזוי ליליא וארו עם ענני שמיא כבר אנש אתה הוה ועד עתיק יומיא מטה וקדמוהי הקרבוהי
    translation: רוֹאֶה הָיִיתִי בְּמַרְאֵי הַלַּיְלָה, וְהִנֵּה עִם עֲנָנֵי הַשָּׁמַיִם כְּבֶן אִישׁ בָּא הָיָה, וְעַד עַתִּיק הַיָּמִים הִגִּיעַ וּלְפָנָיו הִקְרִיבוּהוּ.
    source: דניאל ז, יג
    vocalized: חָזֵה הֲוֵית בְּחֶזְוֵי לֵילְיָא וַאֲרוּ עִם עֲנָנֵי שְׁמַיָּא כְּבַר אֱנָשׁ אָתֵה הֲוָה וְעַד עַתִּיק יוֹמַיָּא מְטָה וּקְדָמוֹהִי הַקְרְבוּהִי
- id: anani
  text: ענני
  translation: עננים של…
  pos: noun
  example:
    text: חזה הוית בחזוי ליליא וארו עם ענני שמיא כבר אנש אתה הוה ועד עתיק יומיא מטה וקדמוהי הקרבוהי
