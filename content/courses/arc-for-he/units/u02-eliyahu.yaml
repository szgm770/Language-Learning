- id: u02-l2
  kind: new
  title:
    he: אמר ליה
    en: He said to him
  exercises:
  - id: u02-l2-19
    type: dialogue
    scene: ר׳ ישראל קורא את ההערה של סבא בעיפרון.
    lines:
    - speaker: yisrael
      text: ״גם אני ניצחתי פעם. ישראל יספר לך.״ הוא באמת כתב את זה.
      translation: ההערה בשוליים
    - speaker: yisrael
      text: בישיבה, לפני המלחמה, סבא שלך היה בן ארבע־עשרה. הוא הקשה על ראש הישיבה קושיה, וראש הישיבה לא ענה.
      translation: הסיפור של ר׳ ישראל
    - speaker: eitan
      text: ומה ראש הישיבה עשה?
      translation: שאלה
    - speaker: yisrael
      text: '״קא חייך״. הוא חייך, ואמר לכל הישיבה: ״נצחני תלמידי״. אדהכי, בינתיים, סבא שלך כבר ברח מהחדר מרוב בושה.'
      translation: אדהכי = בינתיים
  - id: u02-l2-20
    type: tip
    title: ליה, לה, להו
    text: '**ליה** = לו. **לה** = לה. **להו** = להם.


      **אמר ליה** כתוב בדף לרוב בקיצור: **א״ל**. ו**אמרה ליה** = אמרה לו.'
