id: u02-eliyahu
cefr: A1
scene: study
title:
  he: נצחוני בני
  en: My children have defeated me
story: 'בעקבות הרמז ״חפש את אליהו״ מגיעים איתן ור׳ ישראל לתנורו של עכנאי. ליד ״נצחוני בני״ סבא כתב: ״גם אני ניצחתי פעם. ישראל יספר לך.״'
canDo:
- 'להבין סיפור קצר בארמית: מצא, עשה, יצא, בא'
- 'לזהות את ״קא״ לפני פועל: עכשיו, תוך כדי'
- להבין ״אמר ליה״, ״איכא דאמרי״, ״מנא״
