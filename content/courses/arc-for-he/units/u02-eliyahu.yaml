lessons:
- id: u02-l1
  kind: new
  title:
    he: רבי נתן מצא את אליהו
    en: Rabbi Natan found Eliyahu
  exercises:
  - id: u02-l1-01
    type: dialogue
    scene: למחרת בבוקר. ר׳ ישראל מגיע עם המחברת של סבא, ואיתן פותח את בבא מציעא בדף נט.
    lines:
    - speaker: eitan
      text: 'חיפשתי ״אליהו״ בכל הפרק. מצאתי פה: ״אשכחיה רבי נתן לאליהו״.'
      translation: ״אשכחיה״ = מצא אותו
    - speaker: yisrael
      text: 'יפה. זה הסוף של סיפור תנורו של עכנאי. רבי אליעזר הביא הוכחות מהשמיים, וחכמים אמרו: ״לא בשמים היא״.'
      translation: הרקע לסיפור
    - speaker: yisrael
      text: 'ואז רבי נתן פוגש את אליהו ושואל: ״מאי עביד קוב״ה בההיא שעתא?״'
      translation: מה עשה הקב״ה באותה שעה?
    - speaker: eitan
      text: ומה הוא ענה? ובצד, סבא כתב משהו בעיפרון.
      translation: ההערה של סבא
  - id: u02-l1-02
    type: tip
    title: 'קא: פעולה שקורית עכשיו'
    text: '**קא** לפני פועל אומרת שהפעולה קורית ממש עכשיו, או תוך כדי משהו אחר.


      **קא חייך** = הוא צוחק (עכשיו).


      בדף תמצאו אותה גם מחוברת למילה: **קאמר** = קא + אמר, **קתני** = קא + תני.'
