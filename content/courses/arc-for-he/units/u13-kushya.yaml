    text: 'איתן מוסיף למחברת שלו עוד מילים של קושיה, כמו שסבא עשה. מילים שחוזרות שוב ושוב בדפים: **מתקיף לה** = מקשה על כך (מסברה), **מתיב** = מקשה (ממקור), **מאי איריא** = למה דווקא (זה)?, **דמיא** = דומה.'
