    source: בבלי, מועד קטן כא ע״ב
    vocalized: כְּבוֹד רַבִּים שָׁאנֵי
- id: ibait-eima
  text: איבעית אימא
  translation: ואם תרצה, אמור (הסבר נוסף)
  pos: phrase
  example:
    text: ואיבעית אימא זכה שאני
    translation: 'ואם תרצה, אמור: זכייה שונה'
    source: בבלי, ביצה מ ע״א
    vocalized: 'וְאִיבָּעֵית אֵימָא: זִכָּה שָׁאנֵי'
- id: mateif
  text: מתקיף לה
  translation: מקשה על כך (מסברה)
  pos: phrase
  example:
    text: מתקיף לה רב כהנא
    translation: הקשה על כך רב כהנא
    source: בבלי, שבת מח ע״א
    vocalized: מַתְקִיף לַהּ רַב כָּהֲנָא
- id: mativ
  text: מתיב
  translation: מקשה (ממקור)
  pos: verb
  example:
    text: מתיב רבא הזוג והעינבל חיבור
    translation: 'הקשה רבא (ממשנה): הפעמון והענבל, חיבור הם'
    source: בבלי, שבת נח ע״ב
- id: irya
  text: מאי איריא
  translation: למה דווקא (זה)?
  pos: phrase
  example:
    text: מאי איריא תינוק אפי' גדול נמי
    translation: למה דווקא תינוק? אפילו גדול גם!
    source: בבלי, ברכות נג ע״א
    vocalized: מַאי אִירְיָא תִּינוֹק? אֲפִילּוּ גָּדוֹל נָמֵי
- id: damya
  text: דמיא
  translation: דומה
  pos: verb
  example:
    text: והא לא דמיא רישא לסיפא
    translation: והרי אין תחילת המשנה דומה לסופה!
    source: בבלי, בבא קמא לה ע״ב
    vocalized: וְהָא לָא דָּמְיָא רֵישָׁא לְסֵיפָא
