id: u13-kushya
cefr: B1
scene: study
title:
  he: 'מיתיבי: קושיא ותירוץ'
  en: Objection and answer
story: לימוד בחצות. איתן מקשה לראשונה קושיה על ר׳ ישראל, ור׳ ישראל מאושר. לומדים איך הגמרא מקשה ממקור (מיתיבי), דוחה (דילמא, שאני) ומכריעה (תיובתא).
canDo:
- 'לזהות קושיה ממקור: מיתיבי, איתיביה, ורמינהי'
- 'לזהות דחייה: ממאי, דילמא, שאני, איבעית אימא'
- 'להבין ״תיובתא״: קושיה שאין עליה תשובה'
vocabulary:
- id: mitivei
  text: מיתיבי
  translation: מקשים (ממשנה או ברייתא)
  pos: verb
  example:
    text: מיתיבי מפני שמי נחת הוא
    translation: 'מקשים (מברייתא): ׳מפני שמי נחת הוא׳…'
    source: בבלי, ברכות יב ע״א
- id: itiveih
  text: איתיביה
  translation: הקשה עליו (ממקור)
  pos: verb
  example:
    text: איתיביה רבי יוחנן לריש לקיש
    translation: הקשה רבי יוחנן על ריש לקיש (ממקור)
    source: בבלי, בבא מציעא צ ע״ב
    vocalized: אֵיתִיבֵיהּ רַבִּי יוֹחָנָן לְרֵישׁ לָקִישׁ
- id: tiyuvta
  text: תיובתא
  translation: קושיה מכרעת (השיטה נדחית)
  pos: noun
  example:
    text: תיובתא דתרוייהו
    translation: קושיה מכרעת על שניהם
    source: בבלי, תמורה כג ע״ב
    vocalized: תְּיוּבְתָּא דְּתַרְוַיְיהוּ
- id: tarvaihu
  text: תרוייהו
  translation: שניהם
  pos: pronoun
  example:
    text: תיובתא דתרוייהו
    translation: קושיה מכרעת על שניהם
    source: בבלי, תמורה כג ע״ב
    vocalized: תְּיוּבְתָּא דְּתַרְוַיְיהוּ
- id: veramineihu
  text: ורמינהי
  translation: ומשליכים זה מול זה (שני מקורות סותרים)
  pos: verb
  example:
    text: וסתומות מותרות ורמינהי
    translation: ׳וסגורות מותרות׳. ומקשים (ממקור אחר שסותר)…
    source: בבלי, עבודה זרה לא ע״א
    vocalized: וּסְתוּמוֹת מוּתָּרוֹת? וּרְמִינְהִי
- id: mimai
  text: ממאי
  translation: מניין? (איך אתה יודע?)
  pos: adverb
  example:
    text: ממאי דלמא שאני התם דקניא בשינוי מעשה
    translation: מניין (שזו הראיה)? אולי שם שונה, שקנה (אותה) בשינוי מעשה
    source: בבלי, בבא מציעא עח ע״ב
    vocalized: 'מִמַּאי: דִּלְמָא שָׁאנֵי הָתָם דְּקַנְיֵאּ בְּשִׁינּוּי מַעֲשֶׂה'
- id: dilma
  text: דלמא
  translation: 'אולי (גם: דילמא)'
  pos: adverb
  example:
    text: ממאי דלמא שאני התם דקניא בשינוי מעשה
    translation: מניין (שזו הראיה)? אולי שם שונה, שקנה (אותה) בשינוי מעשה
    source: בבלי, בבא מציעא עח ע״ב
    vocalized: 'מִמַּאי: דִּלְמָא שָׁאנֵי הָתָם דְּקַנְיֵאּ בְּשִׁינּוּי מַעֲשֶׂה'
- id: shani
  text: שאני
  translation: שונה (המקרה שונה)
  pos: verb
  example:
