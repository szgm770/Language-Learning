- id: u13-l1
  kind: new
  title:
    he: מיתיבי
    en: They object
  exercises:
  - id: u13-l1-01
    type: dialogue
    scene: חצות. בבית של סבא. רק מנורת שולחן דולקת.
    lines:
    - speaker: eitan
      text: רגע, ר׳ ישראל. אמרת שהמשנה הולכת כמו חכמים. אבל בדף ג כתוב אחרת!
      translation: איתן מקשה
    - speaker: yisrael
      text: 'הקשית! ״איתיביה איתן לר׳ ישראל״. זה בדיוק מה שהגמרא עושה: ״מיתיבי״, מקשים ממשנה או מברייתא.'
      translation: מיתיבי
    - speaker: eitan
      text: ואם אין לך תשובה?
      translation: שאלה
    - speaker: yisrael
      text: אז זו ״תיובתא״, קושיה שמפילה את השיטה. אבל אל תשמח מוקדם. יש לי תשובה.
      translation: תיובתא
  - id: u13-l1-02
    type: tip
    title: מבנה של קושיה
    text: '**מיתיבי** = מקשים ממקור (משנה או ברייתא). **איתיביה פלוני לפלוני** = פלוני הקשה על פלוני.


      **ורמינהי** = שני מקורות סותרים זה את זה.


      אם אין תשובה: **תיובתא**. הגמרא לא מסתירה כשחכם נדחה.'
