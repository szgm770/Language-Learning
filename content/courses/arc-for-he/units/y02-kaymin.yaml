  - id: y02-l2-15
    type: tip
    title: מילות הסוגיה בירושלמי
    text: '**אנן קיימין** = הכא במאי עסקינן. **תיפתר** = אפשר להעמיד. **שנייא** = שאני.


      **התיב** = הקשה (בבבלי: איתיביה). **מסייעא** = מסייע. **נישמעינה מן הדא** = תא שמע.


      **יאות** = נכון, יפה. **ודכוותה** = וכן.'
