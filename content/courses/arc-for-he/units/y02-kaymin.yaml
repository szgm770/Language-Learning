id: y02-kaymin
cefr: A2
section: yerushalmi
scene: study
title:
  he: באנן קיימין
  en: What we are dealing with
story: 'בבית מדרש קטן בטבריה. ר׳ ישראל מראה לאיתן את ״מילות הסוגיה״ של הירושלמי: קיימין, תיפתר, שנייא, התיב, מסייעא, נישמעינה.'
canDo:
- להבין קיימין (= הכא במאי עסקינן) ותיפתר
- להבין שנייא (= שאני), התיב, מסייעא
- להבין נישמעינה (= תא שמע), יאות, ודכוותה
vocabulary:
- id: kaymin
  text: קיימין
  translation: עוסקים (״אנן קיימין״ = במה מדובר)
  pos: verb
  example:
    text: בתרומה אנן קיימין הכא
    translation: בתרומה אנו עוסקים כאן
    source: ירושלמי, חגיגה ג, ג
    vocalized: בַּתְּרוּמָה אֲנָן קַיָימִין הָכָא
- id: tiftar
  text: תיפתר
  translation: תתפרש, אפשר להעמיד (את המקור במקרה…)
  pos: verb
  example:
    text: תיפתר בעיר שכולה גוים
    translation: אפשר להעמיד (את המשנה) בעיר שכולה גויים
    source: ירושלמי, עבודה זרה ב, א
    vocalized: תִּיפְתָּר בְּעִיר שֶׁכּוּלָּהּ גּוֹיִם
- id: shanya
  text: שנייא
  translation: 'שונה (בבבלי: שאני)'
  pos: verb
  example:
    text: שנייא הכא שהיא לשינון
    translation: כאן שונה, שהיא (נאמרת) לשם שינון
    source: ירושלמי, ברכות א, א
    vocalized: שַׁנְיָיא הָכָא שֶׁהִיא לְשִׁינּוּן
- id: hetiv
  text: התיב
  translation: הקשה
  pos: verb
  example:
    text: התיב רבי חייה לרבי
    translation: הקשה רבי חייא לרבי
    source: ירושלמי, נדה ב, א
    vocalized: הָתִיב רִבִּי חִיָיה לְרִבִּי
- id: mesayya
  text: מסייעא
  translation: מסייעת
  pos: verb
  example:
    text: מתניתא מסייעא לריש לקיש
    translation: המשנה (ברייתא) מסייעת לריש לקיש
    source: ירושלמי, בבא קמא ב, ה
    vocalized: מַתְנִיתָא מְסַיְיעָא לְרֵישׁ לָקִישׁ
- id: nishmeina
  text: נישמעינה
  translation: 'נשמע אותה (בבבלי: תא שמע)'
  pos: verb
  example:
    text: נישמעינה מן הדא דתני
    translation: נלמד אותה מזו ששנה
    source: ירושלמי, תענית ד, ה
    vocalized: נִישְׁמְעִינָהּ מִן הָדָא דְתַנֵּי
- id: yaut
  text: יאות
  translation: יפה, נכון
  pos: adverb
  example:
    text: אמר לון יאות עבדיתון
    translation: 'אמר להם: יפה עשיתם'
    source: ירושלמי, ברכות ט, א
    vocalized: אֲמָר לוֹן יְאוּת עַבְדִיתוּן
- id: udechvateh
  text: ודכוותה
  translation: וכמו כן, ובדומה לזה
  pos: adverb
  example:
    text: ודכוותה הלכה כרבי שמעון
    translation: וכמו כן, הלכה כרבי שמעון
    source: ירושלמי, שבועות ז, ז
    vocalized: וְדִכְוָותָהּ הֲלָכָה כְרִבִּי שִׁמְעוֹן
- id: pligin
  text: פליגין
  translation: 'חולקים (בבבלי: פליגי)'
  pos: verb
  example:
    text: מה פליגין רב ושמואל
    translation: במה חולקים רב ושמואל?
    source: ירושלמי, עירובין ח, ג
    vocalized: מַה פְלִיגִין רַב וּשְׁמוּאֵל
