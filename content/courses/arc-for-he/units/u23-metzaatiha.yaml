  exercises:
  - id: u23-l1-01
    type: dialogue
    scene: הלילה שלפני הסיום. איתן לבד בבית של סבא, עם הגמרא פתוחה בדף ב.
    lines:
    - speaker: eitan
      text: (לעצמו) ״מאי מצאתיה? ראיתיה״. מה פירוש ״מצאתי״? שראיתי אותה.
      translation: איתן קורא לבד
    - speaker: eitan
      text: ״אף על גב דלא אתאי לידיה, בראיה בעלמא קני״. גם אם לא באה לידו, בראייה בלבד הוא קונה. זה מה שהייתי חושב.
      translation: הוה אמינא
    - speaker: eitan
      text: אבל המשנה מוסיפה ״כולה שלי״, כדי ללמד ש״בראיה לא קני״. לראות זה לא מספיק.
      translation: המסקנה
