id: u23-metzaatiha
cefr: B2
scene: study
title:
  he: מאי מצאתיה?
  en: What does 'I found it' mean?
story: הלילה שלפני הסיום. איתן חוזר לדף הראשון, להערה הראשונה של סבא, וקורא עכשיו את כל הסוגיה לבד. התשובה ל״מאי מצאתיה?״ היא גם התשובה למכתב.
canDo:
- לקרוא סוגיה שלמה בבבא מציעא ב ע״א
- להבין ״בעלמא״, ״קני״, ״אתאי לידיה״, ״משמע״
- להבין איך הגמרא מדייקת בלשון המשנה
vocabulary:
- id: liteni
  text: ליתני
  translation: שישנה (התנא)!
  pos: verb
  example:
    text: וליתני אני מצאתיה ואנא ידענא דכולה שלי
    translation: ושישנה (רק) ׳אני מצאתיה׳, ואני אדע (מעצמי) שכולה שלי!
    source: בבלי, בבא מציעא ב ע״א
    vocalized: וְלִיתְנֵי אֲנִי מְצָאתִיהָ, וַאֲנָא יָדַעְנָא דְּכוּלָּהּ שֶׁלִּי
- id: bealma
  text: בעלמא
  translation: 'בלבד, סתם; גם: באופן כללי'
  pos: adverb
  example:
    text: בראיה בעלמא קני
    translation: בראייה בלבד הוא קונה
    source: בבלי, בבא מציעא ב ע״א
    vocalized: בִּרְאִיָּה בְּעָלְמָא קָנֵי
- id: kanei
  text: קני
  translation: קונה (זוכה בדבר)
  pos: verb
  example:
    text: בראיה בעלמא קני
    translation: בראייה בלבד הוא קונה
    source: בבלי, בבא מציעא ב ע״א
    vocalized: בִּרְאִיָּה בְּעָלְמָא קָנֵי
- id: leydeih
  text: לידיה
  translation: לידו
  pos: noun
  example:
    text: אע"ג דלא אתאי לידיה בראיה בעלמא קני
    translation: אף על פי שלא באה לידו, בראייה בלבד הוא קונה
    source: בבלי, בבא מציעא ב ע״א
    vocalized: אַף עַל גַּב דְּלָא אֲתַאי לִידֵיהּ בִּרְאִיָּה בְּעָלְמָא קָנֵי
- id: matzit
  text: מצית אמרת
  translation: אתה יכול לומר
  pos: phrase
  example:
    text: ומי מצית אמרת
    translation: וכי אתה יכול לומר?
    source: בבלי, בבא מציעא ב ע״א
    vocalized: וּמִי מָצֵית אָמְרַתְּ
- id: mashma
  text: משמע
  translation: משמעו, פירושו
  pos: verb
  example:
    text: ומצאתה דאתאי לידיה משמע
    translation: ׳ומצאתה׳ משמעו שבאה לידו
    source: בבלי, בבא מציעא ב ע״א
    vocalized: וּמְצָאתָהּ דַּאֲתַאי לִידֵיהּ מַשְׁמַע
- id: lishna
  text: לישנא
  translation: לשון
  pos: noun
  example:
    text: ומיהו תנא לישנא דעלמא נקט
    translation: ובכל זאת התנא השתמש בלשון של בני אדם
    source: בבלי, בבא מציעא ב ע״א
    vocalized: וּמִיהוּ תַּנָּא לִישָּׁנָא דְעָלְמָא נָקֵט
- id: nakat
  text: נקט
  translation: לקח, תפס; השתמש (בלשון)
  pos: verb
  example:
    text: ומיהו תנא לישנא דעלמא נקט
    translation: ובכל זאת התנא השתמש בלשון של בני אדם
    source: בבלי, בבא מציעא ב ע״א
    vocalized: וּמִיהוּ תַּנָּא לִישָּׁנָא דְעָלְמָא נָקֵט
- id: ashkachit
  text: אשכחית
  translation: מצאתי
  pos: verb
  example:
    text: ומדחזי ליה אמר אנא אשכחית
    translation: 'וכיוון שראה אותה, הוא אומר: אני מצאתי'
    source: בבלי, בבא מציעא ב ע״א
    vocalized: 'וּמִדְּחָזֵי לֵיהּ אָמַר: אֲנָא אַשְׁכַּחִית'
- id: ashmeinan
  text: אשמעינן
  translation: השמיע לנו, לימד אותנו
  pos: verb
  example:
    text: דממשנה יתירה אשמעינן דראיה לא קני
    translation: שממשנה מיותרת לימד אותנו שראייה אינה קונה
    source: בבלי, בבא מציעא ב ע״א
    vocalized: דְּמִמִּשְׁנָה יַתִּירָה אַשְׁמְעִינַן דִּרְאִיָּה לָא קָנֵי
- id: f-ruba
  text: רובא
  translation: רוב
  pos: noun
- id: f-shayer
