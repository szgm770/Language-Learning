  - id: o08-l1-01
    type: dialogue
    scene: יום שישי. איתן הגיע עם שאלה.
    lines:
    - speaker: eitan
      text: למה כשכתוב בתורה ״וירא ה׳״, אונקלוס כותב ״ואתגלי יי״, נגלה?
      translation: השאלה
    - speaker: yisrael
      text: כי אונקלוס זהיר. לא ״ראה ה׳״ כמו אדם, אלא ״גלוי קדם יי״, ״לפני ה׳״. ולא ״אמר ה׳ לי״, אלא ״מימרא דיי״.
      translation: קדם יי
    - speaker: eitan
      text: גם סבא היה זהיר ככה בדיבור.
      translation: איתן
