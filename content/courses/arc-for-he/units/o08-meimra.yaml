id: o08-meimra
cefr: B1
section: onkelos
scene: study
title:
  he: מימרא דיי
  en: The word of God
story: 'פרשת יתרו. איתן מגלה שאונקלוס נזהר מאוד כשהוא מתרגם פסוקים על הקב״ה: ״מימרא״, ״קדם יי״, ״יקרא״, ״שכינתא״, ״אתגלי״.'
canDo:
- להבין למה אונקלוס כותב ״קדם יי״ ו״מימרא דיי״
- להבין יקרא, שכינתא, אתגלי, ברעוא
- להבין פתגמא, אוריתא, קימי
vocabulary:
- id: kodam
  text: קדם
  translation: לפני
  pos: preposition
  example:
    text: וסגיד אברהם קדם עמא דארעא
    translation: 'בתורה: וַיִּשְׁתַּחוּ אַבְרָהָם לִפְנֵי עַם הָאָרֶץ'
    source: תרגום אונקלוס, בראשית כג, יב
    vocalized: וּסְגִיד אַבְרָהָם קֳדָם עַמָּא דְאַרְעָא
- id: meimra
  text: מימרא
  translation: דבר (ה׳), ״מאמר״
  pos: noun
  example:
    text: ונטלו בקדמיתא על מימרא דיי בידא דמשה
    translation: 'בתורה: וַיִּסְעוּ בָּרִאשֹׁנָה עַל־פִּי יְהוָה בְּיַד־מֹשֶׁה'
    source: תרגום אונקלוס, במדבר י, יג
    vocalized: וּנְטָלוּ בְקַדְמֵיתָא עַל מֵימְרָא דַיְיָ בִּידָא דְמשֶׁה
- id: yekara
  text: יקרא
  translation: הכבוד
  pos: noun
  example:
    text: ושיצי למללא עמה ואסתלק יקרא דיי מעלווהי דאברהם
    translation: 'בתורה: וַיְכַל לְדַבֵּר אִתּוֹ וַיַּעַל אֱלֹהִים מֵעַל אַבְרָהָם'
    source: תרגום אונקלוס, בראשית יז, כב
    vocalized: וְשֵׁיצֵי לְמַלָּלָא עִמֵהּ וְאִסְתַּלַּק יְקָרָא דַיְיָ מֵעִלָּווֹהִי דְּאַבְרָהָם
- id: shechinta
  text: שכינתא
  translation: השכינה
  pos: noun
  example:
    text: וקרא שמא דאתרא נסיתא ומצותא על דנצו בני ישראל ועל דנסיאו קדם יי למימר האית שכינתא דיי ביננא אם לא
    translation: 'בתורה: וַיִּקְרָא שֵׁם הַמָּקוֹם מַסָּה וּמְרִיבָה עַל־רִיב בְּנֵי יִשְׂרָאֵל וְעַל נַסֹּתָם אֶת־יְהוָה לֵאמֹר הֲיֵשׁ יְהוָה בְּקִרְבֵּנוּ אִם־אָיִן'
    source: תרגום אונקלוס, שמות יז, ז
    vocalized: וּקְרָא שְׁמָא דְאַתְרָא נִסֵיתָא וּמַצוּתָא עַל דִנְצוֹ בְּנֵי יִשְׂרָאֵל וְעַל דְנַסִיאוּ קֳדָם יְיָ לְמֵימַר הֲאִית שְׁכִינְתָּא דַיְיָ בֵּינָנָא אִם לָא
- id: itgeli
  text: אתגלי
  translation: נגלה
  pos: verb
  example:
    text: ולא קם נביא עוד בישראל כמשה די אתגלי לה יי אפין באפין
    translation: 'בתורה: וְלֹא־קָם נָבִיא עוֹד בְּיִשְׂרָאֵל כְּמֹשֶׁה אֲשֶׁר יְדָעוֹ יְהוָה פָּנִים אֶל־פָּנִים'
    source: תרגום אונקלוס, דברים לד, י
    vocalized: וְלָא קָם נְבִיָא עוֹד בְּיִשְׂרָאֵל כְּמֹשֶׁה דִי אִתְגְלִי לֵהּ יְיָ אַפִּין בְּאַפִּין
- id: bereava
  text: ברעוא
  translation: ברצון
  pos: adverb
  example:
    text: וחמרא לנסכא תלתות הינא תקרב לאתקבלא ברעוא קדם יי
    translation: 'בתורה: וְיַיִן לַנֶּסֶךְ שְׁלִשִׁית הַהִין תַּקְרִיב רֵיחַ־נִיחֹחַ לַיהוָה'
    source: תרגום אונקלוס, במדבר טו, ז
    vocalized: וְחַמְרָא לְנִסְכָּא תַּלְתּוּת הִינָא תְּקָרֵב לְאִתְקַבָּלָא בְרַעֲוָא קֳדָם יְיָ
- id: pitgama
  text: פתגמא
  translation: הדבר
  pos: noun
  example:
    text: וקניאו בה אחוהי ואבוהי נטר ית פתגמא
    translation: 'בתורה: וַיְקַנְאוּ־בוֹ אֶחָיו וְאָבִיו שָׁמַר אֶת־הַדָּבָר'
    source: תרגום אונקלוס, בראשית לז, יא
    vocalized: וְקַנִּיאוּ בֵהּ אֲחוֹהִי וַאֲבוּהִי נְטַר יָת פִּתְגָמָא
- id: orayta
  text: אוריתא
  translation: התורה
  pos: noun
  example:
    text: דא אוריתא לכל מכתש סגירותא ולנתקא
    translation: 'בתורה: זֹאת הַתּוֹרָה לְכָל־נֶגַע הַצָּרַעַת וְלַנָּתֶק'
    source: תרגום אונקלוס, ויקרא יד, נד
    vocalized: דָא אוֹרַיְתָא לְכָל מַכְתַּשׁ סְגִירוּתָא וּלְנִתְקָא
- id: kayami
  text: קימי
  translation: בריתי
  pos: noun
  example:
    text: אנא הא קימי עמך ותהי לאב סגי עממין
    translation: 'בתורה: אֲנִי הִנֵּה בְרִיתִי אִתָּךְ וְהָיִיתָ לְאַב הֲמוֹן גּוֹיִם'
    source: תרגום אונקלוס, בראשית יז, ד
    vocalized: אֲנָא הָא קְיָמִי עִמָךְ וּתְהֵי לְאַב סַגִי עַמְמִין
- id: alam
  text: עלם
  translation: עולם
  pos: noun
  example:
    text: ויהון בך לאת ולמופת ובבניך עד עלם
    translation: 'בתורה: וְהָיוּ בְךָ לְאוֹת וּלְמוֹפֵת וּבְזַרְעֲךָ עַד־עוֹלָם'
    source: תרגום אונקלוס, דברים כח, מו
    vocalized: וִיהוֹן בָּךְ לְאָת וּלְמוֹפֵת וּבִבְנָיךְ עַד עֳלָם
- id: kudsha
  text: קודשא
  translation: הקודש
  pos: noun
  example:
    text: ותעבד לבושי קודשא לאהרן אחוך ליקר ולתשבחן
    translation: 'בתורה: וְעָשִׂיתָ בִגְדֵי־קֹדֶשׁ לְאַהֲרֹן אָחִיךָ לְכָבוֹד וּלְתִפְאָרֶת'
    source: תרגום אונקלוס, שמות כח, ב
    vocalized: וְתַעְבֵּד לְבוּשֵׁי קוּדְשָׁא לְאַהֲרֹן אָחוּךְ לִיקָר וּלְתֻשְׁבְּחָן
- id: rachamin
  text: רחמין
  translation: רחמים
  pos: noun
  example:
    text: ונח אשכח רחמין קדם יי
    translation: 'בתורה: וְנֹחַ מָצָא חֵן בְּעֵינֵי יְהוָה'
    source: תרגום אונקלוס, בראשית ו, ח
    vocalized: וְנֹחַ אַשְׁכַּח רַחֲמִין קֳדָם יְיָ
