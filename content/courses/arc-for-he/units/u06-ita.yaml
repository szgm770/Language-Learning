  exercises:
  - id: u06-l1-01
    type: dialogue
    scene: חנה חוזרת מהארכיון עם דף מודפס.
    lines:
    - speaker: chana
      text: מצאתי את העיירה מהתמונה. יש עדות של איכר ליטאי. ב־1943 הוא החביא במתבן שני ילדים יהודים.
      translation: העדות
    - speaker: eitan
      text: שני ילדים? אחד מהם סבא. ומי השני?
      translation: השאלה הגדולה
    - speaker: chana
      text: השם השני מחוק בעדות. רק ״ילד, בן תשע״.
      translation: השם חסר
    - speaker: yisrael
      text: בואו נלמד היום מילים של ״יש״ ו״אין״. ״איתא״ = ישנו. ״ליתא״ = איננו.
      translation: ר׳ ישראל מחליף נושא
