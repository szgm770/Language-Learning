    translation: האבות (של הוצאה בשבת), מה הן? יציאות. ויציאות, שתיים הן
    source: בבלי, שבת ב ע״ב
    vocalized: אָבוֹת מַאי נִיהוּ? יְצִיאוֹת, וִיצִיאוֹת תְּרֵי הָוְיָין
- id: havyan
