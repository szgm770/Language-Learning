id: u06-ita
cefr: A1
scene: study
title:
  he: איתא וליתא
  en: It is and it is not
story: 'חנה מוצאת בארכיון רשימה: איכר ליטאי שהחביא שני ילדים יהודים ב־1943. ״שני ילדים?״ שואל איתן. ר׳ ישראל מלמד את מילות ההוויה: איתא, ליתא, נינהו, הוו.'
canDo:
- להבין איתא וליתא, ״אם איתא״
- להבין נינהו, ניהו, הוו, הויין
- 'להבין ״לית ליה״: חכם שאינו סובר דבר מסוים'
vocabulary:
- id: ita
  text: איתא
  translation: ישנו, קיים; כך הוא
  pos: verb
  example:
    text: אי רבנן טריפה במכירה איתא בזביחה ליתא
    translation: 'אם (המשנה כשיטת) חכמים: טריפה, במכירה (החיוב) ישנו, בשחיטה איננו'
    source: בבלי, בבא קמא עז ע״ב
- id: leita
  text: ליתא
  translation: איננו, לא קיים; לא כך
  pos: verb
  example:
    text: אי רבנן טריפה במכירה איתא בזביחה ליתא
    translation: 'אם (המשנה כשיטת) חכמים: טריפה, במכירה (החיוב) ישנו, בשחיטה איננו'
    source: בבלי, בבא קמא עז ע״ב
- id: im-ita
  text: אם איתא
  translation: אילו זה היה נכון
  pos: phrase
  example:
    text: ואם איתא הוא נמי לימא
    translation: ואילו זה היה נכון, שגם הוא יאמר!
    source: בבלי, מנחות ל ע״ב
    vocalized: וְאִם אִיתָא הוּא נָמֵי לֵימָא
- id: iteih
  text: איתיה
  translation: הוא ישנו, הוא קיים
  pos: verb
  example:
    text: אלא פשיטא דאיתיה ומדסיפא איתיה רישא נמי איתיה
    translation: אלא פשוט שהוא ישנו. ומכיוון שבסוף (המשנה) הוא ישנו, גם בתחילתה הוא ישנו
    source: בבלי, עירובין ע ע״א
    vocalized: אֶלָּא פְּשִׁיטָא דְּאִיתֵיהּ. וּמִדְּסֵיפָא אִיתֵיהּ, רֵישָׁא נָמֵי אִיתֵיהּ
- id: pshita
  text: פשיטא
  translation: פשוט! (מה החידוש?)
  pos: adverb
  example:
    text: אלא פשיטא דאיתיה ומדסיפא איתיה רישא נמי איתיה
    translation: אלא פשוט שהוא ישנו. ומכיוון שבסוף (המשנה) הוא ישנו, גם בתחילתה הוא ישנו
    source: בבלי, עירובין ע ע״א
    vocalized: אֶלָּא פְּשִׁיטָא דְּאִיתֵיהּ. וּמִדְּסֵיפָא אִיתֵיהּ, רֵישָׁא נָמֵי אִיתֵיהּ
- id: reisha
  text: רישא
  translation: תחילת המשנה (הראש)
  pos: noun
