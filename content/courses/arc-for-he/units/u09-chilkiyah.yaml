id: u09-chilkiyah
cefr: A2
scene: study
title:
  he: אבא חלקיה
  en: Abba Chilkiyah
story: הנכד של חוני, אבא חלקיה, עובד בשדה כשחכמים באים לבקש ממנו להתפלל על גשם. בכל דבר מוזר שהוא עושה יש טעם. ר׳ ישראל מספר שגם סבא היה ״שכיר יום״ אחרי המלחמה.
canDo:
- 'להבין פעלים בהווה ובגוף ראשון: ידענא, חזינא, אמינא, הואי'
- להבין ״בעי רחמי״, ״יהבו ליה שלמא״
- 'לקרוא סיפור של שאלות ותשובות: ״מאי טעמא… אמר להו…״'
