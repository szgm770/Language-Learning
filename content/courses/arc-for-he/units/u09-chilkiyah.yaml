- id: u09-l2
  kind: new
  title:
    he: ידענא
    en: I know
  exercises:
  - id: u09-l2-21
    type: tip
    title: 'אני: ־נא'
    text: 'פעל בגוף ראשון בהווה מסתיים לרוב ב**־נא**: **ידענא** = אני יודע. **חזינא** = אני רואה. **אמינא** = אני אומר.


      בעבר: **הואי** = הייתי.


      **דביתהו** = אשתו (״בת ביתו״).'
  - id: u09-l2-22
    type: dialogue
    scene: ר׳ ישראל ממשיך.
    lines:
    - speaker: yisrael
      text: 'חכמים שאלו: ״מאי טעמא כי יהיבנא למר שלמא לא אסבר לן מר אפיה?״ למה לא ענית לנו?'
      translation: השאלה של החכמים
    - speaker: yisrael
      text: 'והוא ענה: ״שכיר יום הואי״, הייתי שכיר יום, ולא רציתי להתבטל מהעבודה של מי ששכר אותי.'
      translation: התשובה
