id: z05-brich-shmei
cefr: B1
section: zohar
scene: study
title:
  he: בריך שמיה
  en: Blessed is His name
story: שבת בבוקר בבית הכנסת. כשפותחים את ארון הקודש, איתן אומר ״בריך שמיה״ ומבין כל מילה. ר׳ ישראל עומד לידו, במקום של סבא.
canDo:
- לקרוא ולהבין את ״בריך שמיה״ מהזוהר
- להבין מארי, כתרך, אתרך, רעותך, פורקן
- להבין רחיצנא, סמיכנא, קשוט
vocabulary:
- id: marei
  text: מארי
  translation: אדון, בעל (״מארי עלמא״ = ריבון העולם)
  pos: noun
  example:
    text: בריך שמיה דמארי עלמא
    translation: ברוך שמו של אדון העולם
    source: זוהר, פרשת ויקהל
- id: kitrach
  text: כתרך
  translation: הכתר שלך
  pos: noun
  example:
    text: בריך כתרך ואתרך
    translation: ברוך כתרך ומקומך
    source: זוהר, פרשת ויקהל
- id: atrach
  text: אתרך
  translation: מקומך
  pos: noun
  example:
    text: בריך כתרך ואתרך
    translation: ברוך כתרך ומקומך
    source: זוהר, פרשת ויקהל
- id: reutach
  text: רעותך
  translation: רצונך
  pos: noun
  example:
    text: יהא רעותך עם עמך ישראל לעלם
    translation: יהי רצונך עם עמך ישראל לעולם
    source: זוהר, פרשת ויקהל
- id: purkan
  text: פורקן
  translation: גאולה
  pos: noun
  example:
    text: ופורקן ימינך אחזי לעמך בבית מקדשך
    translation: ואת גאולת ימינך הראה לעמך בבית מקדשך
    source: זוהר, פרשת ויקהל
- id: rechitzna
  text: רחיצנא
  translation: אני בוטח
  pos: verb
  example:
    text: לא על אינש רחיצנא
    translation: לא על אדם אני בוטח
    source: זוהר, פרשת ויקהל
- id: smichna
