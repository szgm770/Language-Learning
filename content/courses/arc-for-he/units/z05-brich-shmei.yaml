    title: בריך שמיה
    text: 'בריך שמיה דמארי עלמא


      בריך כתרך ואתרך


      יהא רעותך עם עמך ישראל לעלם


      ופורקן ימינך אחזי לעמך בבית מקדשך'
    translation: 'ברוך שמו של אדון העולם,


      ברוך כתרך ומקומך.


      יהי רצונך עם עמך ישראל לעולם,


      ואת גאולת ימינך הראה לעמך בבית מקדשך.'
