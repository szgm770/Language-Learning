  exercises:
  - id: u03-l1-01
    type: dialogue
    scene: חנה פורשת על השולחן את המכתבים של סבא משנת 1946.
    lines:
    - speaker: chana
      text: בכל המכתבים סבא שואל על אותו אדם. הוא לא כותב שם, רק ״ההוא גברא״.
      translation: ההוא גברא = אותו אדם
    - speaker: yisrael
      text: ״גברא״ זה אדם. וכשהגמרא אומרת ״הוה ההוא גברא״, מתחיל סיפור.
      translation: הוה ההוא גברא = היה אדם אחד
    - speaker: eitan
      text: ר׳ ישראל, אתה יודע מי זה?
      translation: איתן חושד
    - speaker: yisrael
      text: בוא קודם נקרא סיפור אחר על ״ההוא גברא״. בבא בתרא, דף ס. סבא שלך אהב אותו מאוד.
      translation: ר׳ ישראל מתחמק
