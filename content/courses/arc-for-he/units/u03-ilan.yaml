    source: בבלי, בבא בתרא ס ע״א
    vocalized: הֲוָה הָהוּא גַּבְרָא דַּהֲוָה לֵיהּ נָמֵי אִילָן הַנּוֹטֶה לִרְשׁוּת הָרַבִּים
- id: atu
