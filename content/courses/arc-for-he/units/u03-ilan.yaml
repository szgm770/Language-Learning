id: u03-ilan
cefr: A1
scene: study
title:
  he: ההוא גברא והאילן
  en: That man and the tree
story: 'חנה מוצאת במכתבים של סבא חיפוש אחרי ״ההוא גברא״. ר׳ ישראל מראה לאיתן סיפור על ״ההוא גברא״ בגמרא: רבי ינאי, האילן, ו״קשוט עצמך ואחר כך קשוט אחרים״.'
canDo:
- 'להבין סיפור מעשה בגמרא: הוה ליה, אתא לקמיה, אמר ליה'
- 'להבין ציווי: זיל, תא, חזי'
- 'להבין שלי, שלך, שלו: דידי, דידך, דידיה'
vocabulary:
- id: hava-leih
  text: הוה ליה
  translation: היה לו
  pos: phrase
  example:
    text: ר' ינאי הוה ליה אילן הנוטה לרשות הרבים
    translation: לרבי ינאי היה עץ הנוטה לרשות הרבים
    source: בבלי, בבא בתרא ס ע״א
    vocalized: רַבִּי יַנַּאי הֲוָה לֵיהּ אִילָן הַנּוֹטֶה לִרְשׁוּת הָרַבִּים
