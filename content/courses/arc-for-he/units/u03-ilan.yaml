    type: reading
    kind: גמרא, בבא בתרא ס ע״ב
    title: רבי ינאי והאילן
    text: 'זיל האידנא ותא למחר


      בליליא שדר קצייה לההוא דידיה


      למחר אתא לקמיה א"ל זיל קוץ


      א"ל הא מר נמי אית ליה


      א"ל זיל חזי אי קוץ דידי קוץ דידך אי לא קוץ דידי לא תקוץ את'
    translation: '(אמר לו:) לך היום ובוא מחר.


      בלילה שלח (אנשים) וקצץ את שלו.


      למחר בא לפניו. אמר לו: לך, קצוץ (את העץ שלך).


      אמר לו: הרי גם לאדוני יש (עץ כזה)!


      אמר לו: לך וראה: אם שלי קצוץ, קצוץ את שלך. אם שלי לא קצוץ, אל תקצוץ אתה.'
    lexemes:
    - zil
    - haidna
    - ta
    - shadar
    - dideih
    - mar
