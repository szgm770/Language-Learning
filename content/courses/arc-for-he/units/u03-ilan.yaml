      translation: הבעיה של האיש
    - speaker: yisrael
      text: ״זיל האידנא ותא למחר״. לך היום ובוא מחר.
      translation: זיל = לך, תא = בוא
    - speaker: eitan
      text: למה למחר? הוא יכול היה לפסוק מיד.
      translation: התמיהה של איתן
    - speaker: yisrael
      text: 'תמשיך לקרוא: ״בליליא שדר קצייה לההוא דידיה״. בלילה הוא קצץ קודם את העץ שלו.'
      translation: הפתרון
