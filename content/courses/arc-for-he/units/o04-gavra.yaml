id: o04-gavra
cefr: A2
section: onkelos
scene: study
title:
  he: אתתא וגברא
  en: Woman and man
story: 'אמא של איתן וחנה מצטרפת ללימוד. בפרשת חיי שרה לומדים מילים של אנשים ומשפחה: איש, אישה, זכר, בכור, עבד, ומלאך.'
canDo:
- להבין אתתא, אנשא, גבריא, דכורא, בוכרא
- להבין עבדוהי, אמתא, רבוני
- להבין עממיא, זרעית, מלאכא
vocabulary:
- id: itta
  text: אתתא
  translation: אישה
  pos: noun
  example:
    text: והוא אתתא בבתלתהא יסב
    translation: 'בתורה: וְהוּא אִשָּׁה בִבְתוּלֶיהָ יִקָּח'
    source: תרגום אונקלוס, ויקרא כא, יג
    vocalized: וְהוּא אִתְּתָא בִבְתֻלְתָּהָא יִסָב
- id: insha
  text: אנשא
  translation: האדם, בני האדם
  pos: noun
  example:
    text: ודיקטול בעירא ישלמנה ודיקטול אנשא יתקטל
    translation: 'בתורה: וּמַכֵּה בְהֵמָה יְשַׁלְּמֶנָּה וּמַכֵּה אָדָם יוּמָת'
    source: תרגום אונקלוס, ויקרא כד, כא
    vocalized: וּדְיִקְטוֹל בְּעִירָא יְשַׁלְמִנַהּ וּדְיִקְטוֹל אֲנָשָׁא יִתְקְטֵל
- id: gavraya
  text: גבריא
  translation: הגברים, האנשים
  pos: noun
  example:
    text: ואלין שמהת גבריא לשבטא דיהודה כלב בר יפנה
    translation: 'בתורה: וְאֵלֶּה שְׁמוֹת הָאֲנָשִׁים לְמַטֵּה יְהוּדָה כָּלֵב בֶּן־יְפֻנֶּה'
    source: תרגום אונקלוס, במדבר לד, יט
    vocalized: וְאִלֵין שְׁמָהַת גֻבְרַיָא לְשִׁבְטָא דִיהוּדָה כָּלֵב בַּר יְפֻנֶה
- id: duchra
  text: דכורא
  translation: זכר
  pos: noun
  example:
    text: לרעוא לכון שלים דכורא בתורי באמריא ובעזיא
    translation: 'בתורה: לִרְצֹנְכֶם תָּמִים זָכָר בַּבָּקָר בַּכְּשָׂבִים וּבָעִזִּים'
    source: תרגום אונקלוס, ויקרא כב, יט
    vocalized: לְרַעֲוָא לְכוֹן שְׁלִים דְכוּרָא בְּתוֹרֵי בְּאִמְרַיָא וּבְעִזַיָא
- id: buchra
  text: בוכרא
  translation: בכור
  pos: noun
  example:
    text: בכורך ודמעך לא תאחר בוכרא דבניך תפרש קדמי
    translation: 'בתורה: מְלֵאָתְךָ וְדִמְעֲךָ לֹא תְאַחֵר בְּכוֹר בָּנֶיךָ תִּתֶּן־לִּי'
    source: תרגום אונקלוס, שמות כב, כח
    vocalized: בִּכּוּרָךְ וְדִמְעָךְ לָא תְאַחֵר בּוּכְרָא דִבְנָיךְ תַּפְרֵשׁ קֳדָמָי
- id: berateh
  text: ברתה
  translation: בתה
  pos: noun
  example:
    text: ויהב לבן לה ית זלפה אמתה ללאה ברתה לאמהו
    translation: 'בתורה: וַיִּתֵּן לָבָן לָהּ אֶת־זִלְפָּה שִׁפְחָתוֹ לְלֵאָה בִתּוֹ שִׁפְחָה'
    source: תרגום אונקלוס, בראשית כט, כד
    vocalized: וִיהַב לָבָן לַהּ יָת זִלְפָּה אַמְתֵהּ לְלֵאָה בְרַתֵּהּ לְאַמְהוּ
- id: avdohi
  text: עבדוהי
  translation: עבדיו
  pos: noun
  example:
    text: ושפר פתגמא בעיני פרעה ובעיני כל עבדוהי
    translation: 'בתורה: וַיִּיטַב הַדָּבָר בְּעֵינֵי פַרְעֹה וּבְעֵינֵי כָּל־עֲבָדָיו'
    source: תרגום אונקלוס, בראשית מא, לז
    vocalized: וּשְׁפַר פִּתְגָּמָא בְּעֵינֵי פַרְעֹה וּבְעֵינֵי כָּל עַבְדּוֹהִי
- id: amta
  text: אמתא
  translation: שפחה, אמה
  pos: noun
  example:
    text: וילידת זלפה אמתא דלאה ליעקב בר
    translation: 'בתורה: וַתֵּלֶד זִלְפָּה שִׁפְחַת לֵאָה לְיַעֲקֹב בֵּן'
    source: תרגום אונקלוס, בראשית ל, י
    vocalized: וִילִידַת זִלְפָּה אַמְתָא דְלֵאָה לְיַעֲקֹב בָּר
- id: ribboni
  text: רבוני
  translation: אדוני
  pos: noun
  example:
    text: ואמר לוט להון בבעו כען רבוני
    translation: 'בתורה: וַיֹּאמֶר לוֹט אֲלֵהֶם אַל־נָא אֲדֹנָי'
    source: תרגום אונקלוס, בראשית יט, יח
    vocalized: וַאֲמַר לוֹט לְהוֹן בְּבָעוּ כְעַן רִבּוֹנָי
- id: avhathon
  text: אבהתהון
  translation: אבותיהם
  pos: noun
  example:
    text: ומניני בני גרשון לזרעיתהון ולבית אבהתהון
    translation: 'בתורה: וּפְקוּדֵי בְּנֵי גֵרְשׁוֹן לְמִשְׁפְּחוֹתָם וּלְבֵית אֲבֹתָם'
    source: תרגום אונקלוס, במדבר ד, לח
    vocalized: וּמִנְיָנֵי בְּנֵי גֵרְשׁוֹן לְזַרְעֲיַתְהוֹן וּלְבֵית אֲבָהַתְהוֹן
- id: zareit
  text: זרעית
  translation: משפחה, שבט
  pos: noun
  example:
    text: לזרח זרעית זרח לשאול זרעית שאול
    translation: 'בתורה: לְזֶרַח מִשְׁפַּחַת הַזַּרְחִי לְשָׁאוּל מִשְׁפַּחַת הַשָּׁאוּלִי'
    source: תרגום אונקלוס, במדבר כו, יג
    vocalized: לְזֶרַח זַרְעִית זֶרַח לְשָׁאוּל זַרְעִית שָׁאוּל
- id: amamaya
  text: עממיא
  translation: העמים
  pos: noun
  example:
    text: שמעו עממיא וזעו דחלא אחדתנון דהוו יתבין בפלשת
    translation: 'בתורה: שָׁמְעוּ עַמִּים יִרְגָּזוּן חִיל אָחַז יֹשְׁבֵי פְּלָשֶׁת'
    source: תרגום אונקלוס, שמות טו, יד
    vocalized: שְׁמָעוּ עַמְמַיָא וְזָעוּ דַחֲלָא אַחֲדָתְנוּן דַהֲווֹ יָתְבִין בִּפְלָשֶׁת
- id: malacha
  text: מלאכא
  translation: מלאך
  pos: noun
  example:
    text: וקרא מלאכא דיי לאברהם תנינות מן שמיא
    translation: 'בתורה: וַיִּקְרָא מַלְאַךְ יְהוָה אֶל־אַבְרָהָם שֵׁנִית מִן־הַשָּׁמָיִם'
    source: תרגום אונקלוס, בראשית כב, טו
    vocalized: וּקְרָא מַלְאָכָא דַּיְיָ לְאַבְרָהָם תִּנְיָנוּת מִן שְׁמַיָּא
