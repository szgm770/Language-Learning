id: m02-tselma
cefr: A1
section: mikra
scene: study
title:
  he: צלמא
  en: The statue
story: 'דניאל מספר לנבוכדנצר את חלומו: צלם עצום של זהב, כסף, נחושת, ברזל וחרס, ואבן שמנפצת אותו.'
canDo:
- 'להבין שמות של חומרים: דהבא, כספא, נחשא, פרזלא, חספא, אבנא'
- להבין צלמא, רישה, רגלוהי
- 'להבין ״חזה הוית״: הייתי רואה'
vocabulary:
- id: tselma
  text: צלמא
  translation: הצלם, הפסל
  pos: noun
  example:
    text: הוא צלמא ראשה די דהב טב חדוהי ודרעוהי די כסף מעוהי וירכתה די נחש
    translation: הַפֶּסֶל הָהוּא, רֹאשׁוֹ שֶׁל זָהָב טוֹב, חָזֵהוּ וּזְרוֹעוֹתָיו שֶׁל כֶּסֶף, בִּטְנוֹ וִירֵכָיו שֶׁל נְחֹשֶׁת;
    source: דניאל ב, לב
    vocalized: הוּא צַלְמָא רֵאשֵׁהּ דִּי דְהַב טָב חֲדוֹהִי וּדְרָעוֹהִי דִּי כְסַף מְעוֹהִי וְיַרְכָתֵהּ דִּי נְחָשׁ
- id: dahava
  text: דהבא
  translation: הזהב
  pos: noun
  example:
    text: אשתיו חמרא ושבחו לאלהי דהבא וכספא נחשא פרזלא אעא ואבנא
    translation: שָׁתוּ הַיַּיִן, וְשִׁבְּחוּ אֶת אֱלֹהֵי הַזָּהָב וְהַכֶּסֶף, הַנְּחֹשֶׁת, הַבַּרְזֶל, הָעֵץ וְהָאֶבֶן.
    source: דניאל ה, ד
    vocalized: אִשְׁתִּיו חַמְרָא וְשַׁבַּחוּ לֵאלָהֵי דַּהֲבָא וְכַסְפָּא נְחָשָׁא פַרְזְלָא אָעָא וְאַבְנָא
- id: kaspa
  text: כספא
  translation: הכסף
  pos: noun
  example:
    text: ומה די עליך עלך ועל אחיך אחך ייטב בשאר כספא ודהבה למעבד כרעות אלהכם תעבדון
    translation: וּמַה שֶּׁעָלֶיךָ וְעַל אַחֶיךָ יִיטַב בִּשְׁאָר הַכֶּסֶף וְהַזָּהָב לַעֲשׂוֹת, כִּרְצוֹן אֱלֹהֵיכֶם תַּעֲשׂוּ.
    source: עזרא ז, יח
    vocalized: וּמָה דִי עליך [עֲלָךְ] וְעַל אחיך [אֶחָךְ] יֵיטַב בִּשְׁאָר כַּסְפָּא וְדַהֲבָה לְמֶעְבַּד כִּרְעוּת אֱלָהֲכֹם תַּעַבְדוּן
