- id: charaka
  text: כחדה
  translation: כאחד, יחד
  pos: adverb
  example:
    text: באדין דקו כחדה פרזלא חספא נחשא כספא ודהבא והוו כעור מן אדרי קיט ונשא המון רוחא וכל אתר לא השתכח להון ואבנא די מחת לצלמא הות לטור רב ומלת כל ארעא
    translation: אָז רֻסְּקוּ כְּאַחַת, הַבַּרְזֶל, הַחֶרֶס, הַנְּחֹשֶׁת, הַכֶּסֶף וְהַזָּהָב, וְהָיוּ כְּמוֹץ מִגָּרְנֵי קַיִץ, וְנָשְׂאָה אוֹתָם הָרוּחַ, וְכָל מָקוֹם לֹא נִמְצָא לָהֶם. וְהָאֶבֶן אֲשֶׁר הִכְּתָה אֶת הַפֶּסֶל, הָיְתָה לְהַר גָּדוֹל וּמָלְאָה כָּל הָאָרֶץ.
    source: דניאל ב, לה
    vocalized: בֵּאדַיִן דָּקוּ כַחֲדָה פַּרְזְלָא חַסְפָּא נְחָשָׁא כַּסְפָּא וְדַהֲבָא וַהֲווֹ כְּעוּר מִן אִדְּרֵי קַיִט וּנְשָׂא הִמּוֹן רוּחָא וְכָל אֲתַר לָא הִשְׁתֲּכַח לְהוֹן וְאַבְנָא דִּי מְחָת לְצַלְמָא הֲוָת לְטוּר רַב וּמְלָת כָּל אַרְעָא
