    text: די ודי חזית פרזלא מערב בחסף טינא מתערבין להון בזרע אנשא ולא להון דבקין דנה עם דנה הא כדי פרזלא לא מתערב עם חספא
    translation: אֲשֶׁר רָאִיתָ הַבַּרְזֶל מְעֹרָב בְּחֶרֶס הַטִּיט, מְעֹרָבִים יִהְיוּ בְּזֶרַע הָאָדָם, וְלֹא יִהְיוּ דְּבֵקִים זֶה עִם זֶה, הִנֵּה כְּמוֹ שֶׁהַבַּרְזֶל לֹא מְעֹרָב עִם הַחֶרֶס.
