lessons:
- id: u25-l1
  kind: new
  title:
    he: אני, אתה, אנחנו
    en: I, you, we
  exercises:
  - id: u25-l1-01
    type: dialogue
    scene: לפני שעוברים לשלב הבא, ר׳ ישראל מוציא דף ריק ומשרטט טבלה.
    lines:
    - speaker: yisrael
      text: 'סבא שלך לא שינן מילים. הוא שינן סיומות. תראה: ״אמר״ זה השורש. ״אמרינן״ = אנחנו אומרים. ״קאמרי״ = הם אומרים. ״אמרן״ = אמרנו.'
      translation: סיומות
    - speaker: eitan
      text: אז כל פועל שאני מכיר, אני מכיר בעצם בעשר צורות.
      translation: איתן
    - speaker: yisrael
      text: בדיוק. במתבן לא היו לנו מילונים. רק השיטה.
      translation: השיטה
  - id: u25-l1-02
    type: tip
    title: מי עושה?
    text: '**־נא** = אני (ידענא). **־ת** = אתה (קאמרת). **־ינן** = אנחנו (אמרינן, עבדינן). **־ן** = אנחנו בעבר (אמרן).


      **־י / ־ו** = הם (קאמרי, אזלו).


      **קא** לפני הפועל = עכשיו (קאמר, קאמרי). **נ־** = נעשה (נעביד). **ל־** = שיעשה (ליתי, ליהוי).'
