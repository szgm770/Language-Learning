id: u25-netiyot
cefr: A2
scene: study
title:
  he: אמר, קאמרי, אמרינן
  en: One verb, many forms
story: 'ר׳ ישראל מראה לאיתן את הסוד של סבא: לא לומדים כל צורה לבד. מכירים את השורש ואת הסיומות, ומזהים מיד מי עושה ומתי.'
canDo:
- 'לזהות מי עושה לפי הסיומת: ־נא (אני), ־ינן (אנחנו), ־י / ־ו (הם)'
- להבחין בין עבר, הווה (קא־) ועתיד (ל־, נ־, ת־)
- 'לזהות צורות של פעלים שכבר למדנו: אזיל, שקיל, יהיב, ידעי'
