id: u19-kra
cefr: B1
scene: study
title:
  he: אמר קרא
  en: The verse says
story: 'חנה מספרת על פומבדיתא, שבה ״עבד רבה עובדא״. ר׳ ישראל מלמד איך הגמרא דורשת פסוקים: אמר קרא, קרא יתירא, לאפוקי, לאתויי. ההכנה האחרונה לסיום.'
canDo:
- להבין ״אמר קרא״ ו״קרא יתירא״
- 'להבין למה בא פסוק: לאפוקי, לאתויי, למעוטי, איצטריך'
- 'להבין ״עבד עובדא״: פסק הלכה למעשה'
vocabulary:
- id: kra
  text: קרא
  translation: פסוק (מקרא)
  pos: noun
  example:
    text: שאני התם דאמר קרא
    translation: שונה שם, שאמר הפסוק (במפורש)
    source: בבלי, מכות ח ע״א
    vocalized: שָׁאנֵי הָתָם, דְּאָמַר קְרָא
- id: yetira
  text: יתירא
  translation: מיותר
  pos: adjective
  example:
    text: עליה קרא יתירא הוא
    translation: ׳עליה׳, פסוק (מילה) מיותר הוא (ובא ללמד)
    source: בבלי, נדרים עא ע״א
    vocalized: עָלֶיהָ קְרָא יַתִּירָא הוּא
- id: leafukei
  text: לאפוקי
  translation: להוציא (שלא כולל את…)
  pos: verb
  example:
    text: לאפוקי מצות
    translation: להוציא מצות (שאינן בכלל)
