  exercises:
  - id: u19-l2-12
    type: tip
    title: למה בא הפסוק?
    text: '**לאתויי** = להביא, לכלול עוד מקרה. **לאפוקי** = להוציא מקרה. **למעוטי** = למעט.


      **איצטריך** = היה צריך. **אמר קרא** = הפסוק אומר. **קרא יתירא** = פסוק או מילה מיותרים, שבאים ללמד.'
