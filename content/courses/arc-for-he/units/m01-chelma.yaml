- id: m01-l2
  kind: new
  title:
    he: ענה ואמר
    en: Answered and said
  exercises:
  - id: m01-l2-21
    type: tip
    title: ארמית מקראית
    text: 'זו הארמית הקדומה ביותר שלנו, מימי גלות בבל.


      **אנתה** = אתה (בגמרא: את). **באדין**, **אדין** = אז.


      **ענה ואמר** = ענה ואמר: כך פותחים כמעט כל דיבור.'
  - id: m01-l2-22
