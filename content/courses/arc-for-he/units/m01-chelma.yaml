id: m01-chelma
cefr: A1
section: mikra
scene: study
title:
  he: חלמא ופשרא
  en: The dream and its meaning
story: 'חנה כותבת מאמר על גלות בבל, ומבקשת מאיתן לקרוא איתה את ספר דניאל. בפרק ב התנ״ך עובר פתאום לארמית: ״מלכא לעלמין חיי״.'
canDo:
- לזהות היכן מתחילה הארמית בדניאל ובעזרא
- להבין מלכא, חלמא, פשרא, חכימי
- להבין ״ענה ואמר״, באדין, אנתה
vocabulary:
- id: malka
  text: מלכא
  translation: המלך
  pos: noun
  example:
    text: כלא מטא על נבוכדנצר מלכא
    translation: הַכֹּל הִגִּיעַ עַל נְבוּכַדְנֶצַּר הַמֶּלֶךְ.
    source: דניאל ד, כה
    vocalized: כֹּלָּא מְּטָא עַל נְבוּכַדְנֶצַּר מַלְכָּא
- id: chelma
  text: חלמא
  translation: החלום
  pos: noun
  example:
    text: דנה חלמא ופשרה נאמר קדם מלכא
    translation: זֶה הַחֲלוֹם, וּפִתְרוֹנוֹ נֹאמַר לִפְנֵי הַמֶּלֶךְ.
    source: דניאל ב, לו
    vocalized: דְּנָה חֶלְמָא וּפִשְׁרֵהּ נֵאמַר קֳדָם מַלְכָּא
- id: pishra
  text: פשרא
  translation: הפתרון, הפירוש
  pos: noun
  example:
    text: דנה פשרא מלכא וגזרת עליא עלאה היא די מטת על מראי מרי מלכא
    translation: זֶה הַפִּתְרוֹן, הַמֶּלֶךְ, וּגְזֵרַת הָעֶלְיוֹן הִיא, אֲשֶׁר הִגִּיעָה עַל אֲדֹנִי הַמֶּלֶךְ.
    source: דניאל ד, כא
    vocalized: דְּנָה פִשְׁרָא מַלְכָּא וּגְזֵרַת עליא [עִלָּאָה] הִיא דִּי מְטָת עַל מראי [מָרִי] מַלְכָּא
- id: chakimei
  text: חכימי
  translation: חכמי
  pos: noun
  example:
    text: כל קבל דנה מלכא בנס וקצף שגיא ואמר להובדה לכל חכימי בבל
    translation: עֵקֶב זֹאת הַמֶּלֶךְ כָּעַס וְקָצַף הַרְבֵּה, וְאָמַר לְהַשְׁמִיד אֶת כָּל חַכְמֵי בָבֶל.
    source: דניאל ב, יב
    vocalized: כָּל קֳבֵל דְּנָה מַלְכָּא בְּנַס וּקְצַף שַׂגִּיא וַאֲמַר לְהוֹבָדָה לְכֹל חַכִּימֵי בָבֶל
- id: leolmin
  text: לעלמין
  translation: לעולמים
  pos: adverb
  example:
    text: ענו ואמרין לנבוכדנצר מלכא מלכא לעלמין חיי
    translation: 'עָנוּ וְאוֹמְרִים לִנְבוּכַדְנֶצַּר הַמֶּלֶךְ: הַמֶּלֶךְ, לְעוֹלָמִים חְיֵה!'
    source: דניאל ג, ט
    vocalized: עֲנוֹ וְאָמְרִין לִנְבוּכַדְנֶצַּר מַלְכָּא מַלְכָּא לְעָלְמִין חֱיִי
- id: chei
  text: חיי
  translation: 'חיה (ציווי: חיה!)'
  pos: verb
  example:
    text: ענו ואמרין לנבוכדנצר מלכא מלכא לעלמין חיי
    translation: 'עָנוּ וְאוֹמְרִים לִנְבוּכַדְנֶצַּר הַמֶּלֶךְ: הַמֶּלֶךְ, לְעוֹלָמִים חְיֵה!'
    source: דניאל ג, ט
    vocalized: עֲנוֹ וְאָמְרִין לִנְבוּכַדְנֶצַּר מַלְכָּא מַלְכָּא לְעָלְמִין חֱיִי
- id: bedayin
  text: באדין
  translation: אז
  pos: adverb
  example:
    text: באדין מלכא הצלח לשדרך מישך ועבד נגו במדינת בבל
    translation: אָז הַמֶּלֶךְ גִּדֵּל אֶת שַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ בִּמְדִינַת בָּבֶל.
    source: דניאל ג, ל
    vocalized: בֵּאדַיִן מַלְכָּא הַצְלַח לְשַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ בִּמְדִינַת בָּבֶל
- id: edayin
  text: אדין
  translation: אז (צורה קצרה)
  pos: adverb
  example:
    text: אדין דניאל עם מלכא מלל מלכא לעלמין חיי
    translation: 'אָז דָּנִיֶּאל עִם הַמֶּלֶךְ דִּבֵּר: הַמֶּלֶךְ, לְעוֹלָמִים חְיֵה!'
    source: דניאל ו, כב
    vocalized: אֱדַיִן דָּנִיֶּאל עִם מַלְכָּא מַלִּל מַלְכָּא לְעָלְמִין חֱיִי
- id: anta
  text: אנתה
  translation: אתה
  pos: pronoun
  example:
    text: אנתה מלכא מלך מלכיא די אלה שמיא מלכותא חסנא ותקפא ויקרא יהב לך
    translation: אַתָּה הַמֶּלֶךְ, מֶלֶךְ הַמְּלָכִים, אֲשֶׁר אֱלוֹהַּ הַשָּׁמַיִם הַמַּלְכוּת הַחֹסֶן וְהַכֹּחַ וְהַכָּבוֹד נָתַן לְךָ.
    source: דניאל ב, לז
    vocalized: אַנְתְּה מַלְכָּא מֶלֶךְ מַלְכַיָּא דִּי אֱלָהּ שְׁמַיָּא מַלְכוּתָא חִסְנָא וְתָקְפָּא וִיקָרָא יְהַב לָךְ
- id: ane
  text: ענה
  translation: עונה
  pos: verb
  example:
    text: ענה מלכא ואמר לדניאל די שמה בלטשאצר האיתיך האיתך כהל להודעתני חלמא די חזית ופשרה
    translation: 'עוֹנֶה הַמֶּלֶךְ וְאוֹמֵר לְדָנִיֵּאל, אֲשֶׁר שְׁמוֹ בֵּלְטְשַׁאצַּר: הֲיֶשְׁךָ יָכֹל לְהוֹדִיעֵנִי, הַחֲלוֹם אֲשֶׁר רָאִיתִי וּפִתְרוֹנוֹ?'
    source: דניאל ב, כו
    vocalized: עָנֵה מַלְכָּא וְאָמַר לְדָנִיֵּאל דִּי שְׁמֵהּ בֵּלְטְשַׁאצַּר האיתיך [הַאִיתָךְ] כָּהֵל לְהוֹדָעֻתַנִי חֶלְמָא דִי חֲזֵית וּפִשְׁרֵהּ
- id: lehachvaya
  text: להחויה
  translation: להגיד, להראות
  pos: verb
  example:
    text: אתיא ותמהיא די עבד עמי אלהא עליא עלאה שפר קדמי להחויה
    translation: הָאוֹתוֹת וְהַמּוֹפְתִים אֲשֶׁר עָשָׂה עִמִּי הָאֵל הָעֶלְיוֹן, נָאֶה לְפָנַי לְהַגִּיד.
    source: דניאל ג, לב
    vocalized: אָתַיָּא וְתִמְהַיָּא דִּי עֲבַד עִמִּי אֱלָהָא עליא [עִלָּאָה] שְׁפַר קָדָמַי לְהַחֲוָיָה
- id: menach
  text: מנך
  translation: ממך
  pos: pronoun
  example:
    text: עוד מלתא בפם מלכא קל מן שמיא נפל לך אמרין נבוכדנצר מלכא מלכותה עדת מנך
    translation: 'עוֹד הַדָּבָר בְּפִי הַמֶּלֶךְ, קוֹל מִן הַשָּׁמַיִם נָפַל: לְךָ אוֹמְרִים, נְבוּכַדְנֶצַּר הַמֶּלֶךְ: הַמַּלְכוּת עָבְרָה מִמְּךָ,'
    source: דניאל ד, כח
    vocalized: עוֹד מִלְּתָא בְּפֻם מַלְכָּא קָל מִן שְׁמַיָּא נְפַל לָךְ אָמְרִין נְבוּכַדְנֶצַּר מַלְכָּא מַלְכוּתָה עֲדָת מִנָּךְ
