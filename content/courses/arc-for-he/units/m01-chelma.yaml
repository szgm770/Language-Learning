    type: reading
    kind: דניאל ב
    title: מלכא לעלמין חיי
    text: 'וידברו הכשדים למלך ארמית מלכא לעלמין חיי אמר חלמא לעבדיך לעבדך ופשרא נחוא


      ענה מלכא ואמר לכשדיא לכשדאי מלתא מני אזדא הן לא תהודעונני חלמא ופשרה הדמין תתעבדון ובתיכון נולי יתשמון'
    translation: 'הַמֶּלֶךְ, לְעוֹלָמִים חְיֵה! אֱמֹר הַחֲלוֹם לַעֲבָדֶיךָ, וְהַפִּתְרוֹן נַגִּיד.


      עוֹנֶה הַמֶּלֶךְ וְאוֹמֵר לַכַּשְׂדִּים: הַדָּבָר מִמֶּנִּי הָלַךְ, אִם לֹא תּוֹדִיעוּנִי הַחֲלוֹם וּפִתְרוֹנוֹ, נְתָחִים תֵּעָשׂוּ, וּבָתֵּיכֶם עִיִּים יֻשְּׂמוּ.'
