    lines:
    - speaker: chana
      text: 'תראה: בדניאל ב, ד, באמצע הפסוק, התנ״ך עובר לארמית. ״ארמית: מלכא לעלמין חיי״.'
      translation: מעבר לארמית
    - speaker: eitan
      text: ״מלכא״ זה המלך, ו״לעלמין חיי״, לעולם תחיה. את זה אני מבין בלי מילון!
      translation: איתן
    - speaker: chana
      text: הכשדים מדברים עם נבוכדנצר בשפה שלו. והארמית נשארת עד סוף פרק ז.
