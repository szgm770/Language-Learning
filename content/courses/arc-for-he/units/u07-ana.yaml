id: u07-ana
cefr: A2
scene: study
title:
  he: אנא, איהו, אנן
  en: I, he, we
story: 'ר׳ ישראל מספר על הלילות במתבן: שני ילדים ודף גמרא אחד. איתן לומד את הכינויים: אני, הוא, אנחנו, הם, וגם לי, לנו, ממנו.'
canDo:
- 'להבין את הכינויים: אנא, את, איהו, אנן, אינהו'
- להבין ליה, לן, להו, מיניה, עלה
- 'להבין ״נפשיה״: עצמו'
vocabulary:
- id: ana
  text: אנא
  translation: אני
  pos: pronoun
  example:
    text: א"ל אנא תפילין מנחנא
    translation: 'אמר לו: אני מניח תפילין (ולכן מותר לי לשמוח)'
    source: בבלי, ברכות ל ע״ב
    vocalized: 'אֲמַר לֵיהּ: אֲנָא תְּפִילִּין מַנַּחְנָא'
- id: ihu
  text: איהו
  translation: הוא (בהדגשה)
  pos: pronoun
  example:
    text: התם איהו דאפסיד נפשיה בידים
    translation: שם הוא (עצמו) הפסיד את עצמו בידיים
    source: בבלי, כתובות צה ע״א
    vocalized: הָתָם אִיהוּ דְּאַפְסֵיד נַפְשֵׁיהּ בְּיָדַיִם
- id: nafsheih
  text: נפשיה
  translation: עצמו
  pos: pronoun
  example:
    text: התם איהו דאפסיד נפשיה בידים
    translation: שם הוא (עצמו) הפסיד את עצמו בידיים
    source: בבלי, כתובות צה ע״א
    vocalized: הָתָם אִיהוּ דְּאַפְסֵיד נַפְשֵׁיהּ בְּיָדַיִם
- id: anan
  text: אנן
  translation: אנחנו
  pos: pronoun
  example:
    text: אנן נעבד לחומרא
    translation: אנחנו נעשה לחומרה
    source: בבלי, ברכות נא ע״ב
    vocalized: אֲנַן נַעֲבֵד לְחוּמְרָא
- id: inhu
  text: אינהו
  translation: הם
  pos: pronoun
  example:
