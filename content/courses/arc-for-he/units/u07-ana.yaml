lessons:
- id: u07-l1
  kind: new
  title:
    he: אנא ואיהו
    en: I and he
  exercises:
  - id: u07-l1-01
    type: dialogue
    scene: בבית של ר׳ ישראל. על השולחן תה ועוגה, ובאמצע הגמרא של סבא.
    lines:
    - speaker: yisrael
      text: במתבן היינו שני ילדים. אני הייתי בן תשע, סבא שלך בן ארבע־עשרה. הוא קרא, ואני חזרתי אחריו.
      translation: ר׳ ישראל מספר
    - speaker: eitan
      text: ומה למדתם?
      translation: שאלה
    - speaker: yisrael
      text: מה שהיה בספר. בבא מציעא. ולפעמים, כשהיינו עצובים, הוא פתח בברכות ל, בסיפור על השמחה.
      translation: ברכות ל
    - speaker: yisrael
      text: '״אביי הוה יתיב קמיה דרבה״. אביי ישב לפני רבה, וראה שהוא שמח מאוד. ורבה ענה: ״אנא תפילין מנחנא״, אני מניח תפילין.'
      translation: אנא = אני
  - id: u07-l1-02
    type: tip
    title: אני, אתה, הוא
    text: '**אנא** = אני. **את** = אתה. **איהו** = הוא. **איהי** = היא.


      **אנן** = אנחנו. **אתון** = אתם. **אינהו** = הם.


      **נפשיה** = עצמו (״אפסיד נפשיה״ = הפסיד לעצמו).'
