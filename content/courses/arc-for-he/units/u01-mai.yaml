id: u01-mai
cefr: A1
scene: study
title:
  he: מאי? המחברת של סבא
  en: What? Grandfather's notebook
story: 'איתן מוצא מכתב סגור מסבו והערה בשולי בבא מציעא: ״מאי מצאתיה?״. ר׳ ישראל, החברותא של סבא, מלמד אותו לקרוא את השאלות הראשונות של הגמרא.'
canDo:
- 'לזהות את מילות השאלה של הגמרא: מאי, למה לי, לימא'
- להבין ״אי… הוה אמינא״ ו״צריכא״
- להבין משפטים עם הכא, התם, איכא, ליכא
- לקרוא קטע קצר מבבא מציעא ב ע״ב
vocabulary:
- id: mai
  text: מאי
  translation: מה
  pos: pronoun
  example:
    text: אי תנא אני מצאתיה הוה אמינא מאי מצאתיה ראיתיה
    translation: 'אילו שנה (רק) ''אני מצאתיה'', הייתי אומר: מה פירוש ''מצאתיה''? ראה אותה.'
    source: בבלי, בבא מציעא ב ע״א
    vocalized: 'אִי תְּנָא ״אֲנִי מְצָאתִיהָ״, הֲוָה אָמֵינָא: מַאי ״מְצָאתִיהָ״ רְאִיתִיהָ'
- id: lama-li
  text: למה לי
  translation: למה צריך? (מה הצורך?)
  pos: phrase
  example:
    text: למה לי למתנא
    translation: למה (המשנה) צריכה לשנות (פעמיים)?
    source: בבלי, בבא מציעא ב ע״א
    vocalized: לְמָה לִי לְמִתְנָא
- id: katani
  text: קתני
  translation: (המשנה) שונה, כתוב בה
  pos: verb
  example:
    text: ומי מצית אמרת חדא קתני והא זה וזה קתני
    translation: וכי אתה יכול לומר שהיא שונה (טענה) אחת? הרי 'זה' ו'זה' היא שונה!
    source: בבלי, בבא מציעא ב ע״א
    vocalized: וּמִי מָצֵית אָמְרַתְּ חֲדָא קָתָנֵי? וְהָא ״זֶה״ וְ״זֶה״ קָתָנֵי
- id: chada
  text: חדא
  translation: אחת
  pos: number
  example:
    text: ליתני חדא
    translation: שתשנה (המשנה טענה) אחת!
    source: בבלי, בבא מציעא ב ע״א
    vocalized: לִיתְנֵי חֲדָא
- id: i
  text: אי
  translation: אם, אילו
  pos: conjunction
  example:
    text: אי תנא אני מצאתיה הוה אמינא
    translation: אילו שנה (רק) 'אני מצאתיה', הייתי אומר
    source: בבלי, בבא מציעא ב ע״א
    vocalized: אִי תְּנָא ״אֲנִי מְצָאתִיהָ״, הֲוָה אָמֵינָא
- id: tana
  text: תנא
  translation: 'שנה (בעבר); גם: התנא, חכם המשנה'
  pos: verb
  example:
    text: תנא כולה שלי
    translation: (לכן) שנה 'כולה שלי'
    source: בבלי, בבא מציעא ב ע״א
    vocalized: 'תְּנָא: ״כּוּלָּהּ שֶׁלִּי״'
- id: hava-amina
  text: הוה אמינא
  translation: הייתי אומר (הייתי חושב)
