    translation: אפילו תאמר (שהמשנה כשיטת) בן ננס
    source: בבלי, בבא מציעא ב ע״ב
    vocalized: אֲפִילּוּ תֵּימָא בֶּן נַנָּס
- id: nami
  text: נמי
