    translation: נאמר שהמשנה אינה כשיטת סומכוס?
    source: בבלי, בבא מציעא ב ע״ב
    vocalized: לֵימָא מַתְנִיתִין דְּלָא כְּסוֹמְכוֹס
- id: afilu-teima
