    translation: שאי אפשר לומר כך
    source: בבלי, בבא מציעא ב ע״ב
    vocalized: דְּלֵיכָּא לְמֵימַר הָכִי
- id: leima
  text: לימא
  translation: נאמר? (האם נאמר ש…)
  pos: verb
  example:
