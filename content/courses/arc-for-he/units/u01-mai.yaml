lessons:
- id: u01-l1
  kind: new
  title:
    he: ההערה הראשונה
    en: The first note
  exercises:
  - id: u01-l1-01
    type: dialogue
    scene: דירה ריקה בירושלים. איתן וחנה מפנים את הספרים של סבא אחרי השבעה.
    lines:
    - speaker: chana
      text: איתן, תראה. במגירה של סבא יש מעטפה סגורה, ועליה כתוב השם שלך.
      translation: המכתב של סבא
    - speaker: eitan
      text: ״כל מה שרציתי לומר לך כתוב בדף. תמצא אותו.״ זה הכול? איזה דף?
      translation: המכתב
    - speaker: chana
      text: אולי הש״ס שלו. יש פה סימנייה בבבא מציעא, דף ב.
      translation: ש״ס = שישה סדרי משנה, כל התלמוד
    - speaker: eitan
      text: 'ויש הערה בכתב היד שלו בשוליים: ״איתן, מאי מצאתיה?״ אני לא מבין מילה.'
      translation: ״מאי מצאתיה״ – ציטוט מהגמרא בדף
  - id: u01-l1-02
    type: dialogue
    scene: דפיקה בדלת. ר׳ ישראל, החברותא של סבא כבר שישים שנה, נכנס עם מקל.
    lines:
    - speaker: yisrael
      text: סבא שלך ביקש שאבוא כשתמצא את ההערה הראשונה. מצאת כבר?
      translation: ר׳ ישראל ידע מראש
    - speaker: eitan
      text: מצאתי. אבל מה זה ״מאי״?
      translation: מאי = מה
    - speaker: yisrael
      text: '״מאי״ זה ״מה״. הגמרא שואלת: מאי ״מצאתיה״? כלומר, מה פירוש המילה ״מצאתיה״ במשנה.'
      translation: השאלה הראשונה בדף
    - speaker: yisrael
      text: ואני לא אגיד לך את התשובה. אתה תקרא בעצמך. ככה סבא שלך היה רוצה.
      translation: ר׳ ישראל לא מגלה תשובות
  - id: u01-l1-03
    type: tip
    title: ארמית בדף הגמרא
    text: 'המשנה בראש הדף כתובה **בעברית**: ״שנים אוחזין בטלית…״. הגמרא שאחריה (אחרי **גמ׳**) כתובה ברובה **בארמית**.


      הגמרא מודפסת **בלי ניקוד** ובלי פיסוק. ליד כל ציטוט בקורס יש כפתור **הצגה עם ניקוד**, אם תרצו עזרה.


      כל משפט בקורס הוא ציטוט אמיתי, ולידו המקור: מסכת ודף.'
