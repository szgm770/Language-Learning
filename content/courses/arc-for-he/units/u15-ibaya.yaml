      text: שאלתי את יונאס אם הסבא שלו השאיר משהו מהילדים. הוא כתב שיבדוק. עכשיו אני מחכה.
      translation: שאלה פתוחה
    - speaker: yisrael
      text: ״איבעיא להו״. כך הגמרא פותחת שאלה שאין לה עדיין תשובה. ״בעא מיניה רבא מרב נחמן״, רבא שאל את רב נחמן.
