- id: u15-l2
  kind: new
  title:
    he: למאי נפקא מינה
    en: What difference does it make?
  exercises:
  - id: u15-l2-12
    type: tip
    title: שאלות פתוחות
    text: '**איבעיא להו** = נשאלה שאלה בבית המדרש. **בעא מיניה** = שאל אותו.


      **פשטה** = ענה עליה. אם לא: **תיקו**.


      **למאי נפקא מינה?** = מה ההבדל המעשי? **לא מיבעיא** = לא צריך לומר (זה ברור), אלא אפילו…'
