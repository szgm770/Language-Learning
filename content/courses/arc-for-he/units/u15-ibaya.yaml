id: u15-ibaya
cefr: B1
scene: study
title:
  he: איבעיא להו
  en: A question was asked
story: חנה שולחת ליונאס שאלה, וממתינה לתשובה. בגמרא לומדים איך נשאלת שאלה פתוחה (איבעיא), איך היא נפשטת, ומה ״נפקא מינה״.
canDo:
- 'לזהות שאלה פתוחה: איבעיא להו, בעא מיניה'
- 'להבין איך שאלה נפשטת: הדר פשטה'
- להבין ״למאי נפקא מינה״ ו״לא מיבעיא״
vocabulary:
- id: ibaya-lehu
  text: איבעיא להו
  translation: נשאלה להם שאלה (בבית המדרש)
  pos: phrase
  example:
    text: איבעיא להו עומדי מהו
    translation: 'נשאלה להם שאלה: ׳עומדי׳, מה דינו?'
    source: בבלי, ערכין יט ע״א
    vocalized: 'אִיבַּעְיָא לְהוּ: עוֹמְדֵי מַהוּ'
- id: baa-mineih
  text: בעא מיניה
  translation: שאל אותו (ביקש ממנו תשובה)
  pos: phrase
  example:
    text: בעא מיניה רבא מרב נחמן
    translation: שאל רבא את רב נחמן
    source: בבלי, קידושין מד ע״א
    vocalized: בְּעָא מִינֵּיהּ רָבָא מֵרַב נַחְמָן
- id: pashta
  text: פשטה
  translation: פשט אותה (ענה על השאלה)
  pos: verb
  example:
    text: הדר פשטה עבדו כגופו שורו כממונו
    translation: 'חזר ופשט אותה: עבדו (של אדם) כגופו, שורו כממונו'
    source: בבלי, בבא קמא כז ע״א
    vocalized: 'הֲדַר פַּשְׁטַהּ: עַבְדּוֹ כְּגוּפוֹ, שׁוֹרוֹ כְּמָמוֹנוֹ'
- id: nafka-mina
  text: נפקא מינה
  translation: יוצא מזה (ההבדל המעשי)
  pos: phrase
  example:
    text: למאי נפקא מינה
    translation: למה (זה חשוב)? מה ההבדל המעשי?
    source: בבלי, יבמות קיט ע״ב
    vocalized: לְמַאי נָפְקָא מִינַּהּ
- id: la-mibaya
  text: לא מיבעיא
  translation: לא צריך לומר (ברור), אלא אפילו…
  pos: phrase
  example:
    text: לא מיבעיא קאמר
    translation: '׳לא מיבעיא׳ הוא אומר: לא רק זה, אלא אפילו זה'
    source: בבלי, בבא בתרא נט ע״ב
    vocalized: לָא מִיבַּעְיָא קָאָמַר
- id: tivei
  text: תיבעי
  translation: תישאל (השאלה) גם…
  pos: verb
  example:
    text: תיבעי לרבי תיבעי לרבנן
    translation: השאלה תישאל לשיטת רבי, ותישאל לשיטת חכמים
    source: בבלי, עירובין עח ע״ב
    vocalized: תִּיבְּעֵי לְרַבִּי, תִּיבְּעֵי לְרַבָּנַן
- id: beinaihu
  text: בינייהו
  translation: ביניהם; ״מאי בינייהו?״ = מה ההבדל ביניהם?
  pos: pronoun
  example:
    text: מאי בינייהו
    translation: מה (ההבדל) ביניהם?
    source: בבלי, בבא בתרא קעד ע״ב
    vocalized: מַאי בֵּינַיְיהוּ
- id: mashkachat
  text: משכחת
  translation: אתה מוצא; ״היכי משכחת ליה?״ = איך תמצא מקרה כזה?
  pos: verb
  example:
    text: ואי בד' היכי משכחת ליה
    translation: ואם בארבע, איך תמצא אותו?
    source: בבלי, עירובין ה ע״א
- id: mibaei-leih
  text: מיבעי ליה
  translation: נצרך לו (הפסוק בא ללמד דבר אחר)
  pos: phrase
  example:
    text: האי מיבעי ליה
    translation: זה (הפסוק) נצרך לו (לדבר אחר)
    source: בבלי, זבחים נו ע״א
    vocalized: הַאי מִיבְּעֵי לֵיהּ
