- id: u00b-l1
  kind: new
  title:
    he: רבנן ומר
    en: The sages
  exercises:
  - id: u00b-l1-01
    type: dialogue
    scene: למחרת בבוקר, לפני שאיתן פותח את המעטפה. חנה מסדרת ספרים לפי מסכתות.
    lines:
    - speaker: eitan
      text: יש פה כל כך הרבה שמות. רב, רבי, רבא, רבה, רבינא. איך מבדילים?
      translation: השמות
    - speaker: chana
      text: ״רבי״ זה תואר של חכמי ארץ ישראל. ״רב״ זה תואר של חכמי בבל. ״רבנן״ = חכמים, כולם ביחד.
      translation: רב ורבי
    - speaker: chana
      text: ו״בר״ זה בן. ״רב שימי בר אשי״ = רב שימי בן אשי. ״בריה״ = בנו.
      translation: בר, בריה
  - id: u00b-l1-02
    type: tip
    title: תנאים ואמוראים
    text: '**תנאים**: חכמי המשנה והברייתא (התואר ״רבי״).


      **אמוראים**: חכמי הגמרא, בארץ ישראל (״רבי״) ובבבל (״רב״, או בלי תואר: **אביי**, **רבא**).


      בדף הם מתווכחים זה עם זה, גם כשחיו בהפרש של מאות שנים.'
