    type: tip
    title: מי אמר את זה?
    text: 'הגמרא מקפידה לומר מי אמר כל דבר. **משמיה דרבא** = בשם רבא.


      כשלא בטוחים: **ואיתימא** = ויש אומרים שזה חכם אחר. **ואמרי לה** = ויש אומרים נוסח אחר.


      **איתמר** פותח מחלוקת של אמוראים: ״איתמר: רב אמר… ושמואל אמר…״.'
