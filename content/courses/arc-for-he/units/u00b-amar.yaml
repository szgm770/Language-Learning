id: u00b-amar
cefr: A0
scene: study
title:
  he: מי אמר?
  en: Who said it?
story: 'חנה מסבירה לאיתן מי הם החכמים בגמרא: תנאים ואמוראים, רב ושמואל, אביי ורבא, ואיך הגמרא מוסרת דברים מפה לפה.'
canDo:
- 'לזהות שמות של חכמים ותארים: רב, רבי, רבנן, מר, בר'
- 'להבין שרשרת מסירה: משמיה ד…, ואיתימא, ואמרי לה'
- להבחין בין ״איתמר״ (מחלוקת אמוראים) ל״תניא״ (ברייתא)
vocabulary:
- id: rabanan
  text: רבנן
  translation: חכמים
  pos: noun
  example:
    text: ואלא מאי רבנן הא אמרי המע"ה
    translation: 'ואלא מה, (המשנה כשיטת) חכמים? הרי הם אומרים: המוציא מחברו עליו הראיה'
    source: בבלי, בבא מציעא ב ע״ב
- id: amri
  text: אמרי
  translation: אומרים (הם)
  pos: verb
  example:
