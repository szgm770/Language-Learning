id: m06-bayta
cefr: B1
section: mikra
scene: study
title:
  he: ביתא דנה
  en: This house
story: 'ספר עזרא: היהודים חוזרים ובונים את בית המקדש, ומושלי האזור כותבים מכתבים לדריוש. ״אנחנא המו עבדוהי די אלה שמיא וארעא״.'
canDo:
- להבין ביתא, אגרתא, טעם, עבידתא
- להבין ״אנחנא המו עבדוהי״
- לקרוא את עזרא ה, יא
vocabulary:
- id: igarta
  text: אגרתא
  translation: האיגרת, המכתב
  pos: noun
  example:
    text: דנה פרשגן אגרתא די שלחו עלוהי על ארתחששתא מלכא עבדיך אנש עבר נהרה וכענת
    translation: 'זֶה תַּקְצִיר הָאִגֶּרֶת, אֲשֶׁר שָׁלְחוּ אֵלָיו אֶל אַרְתַּחְשַׁשְׂתְּא הַמֶּלֶךְ: עֲבָדֶיךָ אַנְשֵׁי עֵבֶר הַנָּהָר, וְעַתָּה,'
    source: עזרא ד, יא
    vocalized: דְּנָה פַּרְשֶׁגֶן אִגַּרְתָּא דִּי שְׁלַחוּ עֲלוֹהִי עַל אַרְתַּחְשַׁשְׂתְּא מַלְכָּא עַבְדָיךְ אֱנָשׁ עֲבַר נַהֲרָה וּכְעֶנֶת
- id: teem
  text: טעם
  translation: פקודה, צו
  pos: noun
  example:
    text: ומני שים טעם להנעלה קדמי לכל חכימי בבל די פשר חלמא יהודענני
    translation: וּמִמֶּנִּי נִתַּן צַו, לְהַכְנִיס לְפָנַי אֶת כָּל חַכְמֵי בָבֶל, אֲשֶׁר פִּתְרוֹן הַחֲלוֹם יוֹדִיעוּנִי.
    source: דניאל ד, ג
    vocalized: וּמִנִּי שִׂים טְעֵם לְהַנְעָלָה קָדָמַי לְכֹל חַכִּימֵי בָבֶל דִּי פְשַׁר חֶלְמָא יְהוֹדְעֻנַּנִי
- id: avidta
  text: עבידתא
  translation: העבודה, המלאכה
  pos: noun
  example:
    text: ודניאל בעא מן מלכא ומני על עבידתא די מדינת בבל לשדרך מישך ועבד נגו ודניאל בתרע מלכא
    translation: וְדָנִיֵּאל בִּקֵּשׁ מִן הַמֶּלֶךְ, וּמִנָּה עַל הַמְּלָאכָה שֶׁל מְדִינַת בָּבֶל, אֶת שַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ, וְדָנִיֵּאל בְּשַׁעַר הַמֶּלֶךְ.
    source: דניאל ב, מט
    vocalized: וְדָנִיֵּאל בְּעָא מִן מַלְכָּא וּמַנִּי עַל עֲבִידְתָּא דִּי מְדִינַת בָּבֶל לְשַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ וְדָנִיֵּאל בִּתְרַע מַלְכָּא
- id: dena
  text: דנה
  translation: הזה
  pos: pronoun
  example:
    text: דנה חלמא ופשרה נאמר קדם מלכא
    translation: זֶה הַחֲלוֹם, וּפִתְרוֹנוֹ נֹאמַר לִפְנֵי הַמֶּלֶךְ.
    source: דניאל ב, לו
    vocalized: דְּנָה חֶלְמָא וּפִשְׁרֵהּ נֵאמַר קֳדָם מַלְכָּא
- id: kenama
  text: כנמא
  translation: כך
  pos: adverb
  example:
    text: אדין כנמא אמרנא להם מן אנון שמהת גבריא די דנה בנינא בנין
    translation: 'אָז כָּךְ אָמַרְנוּ לָהֶם: מִי הֵם שְׁמוֹת הָאֲנָשִׁים אֲשֶׁר זֶה הַבִּנְיָן בּוֹנִים?'
    source: עזרא ה, ד
    vocalized: אֱדַיִן כְּנֵמָא אֲמַרְנָא לְּהֹם מַן אִנּוּן שְׁמָהָת גֻּבְרַיָּא דִּי דְנָה בִנְיָנָא בָּנַיִן
- id: shlama-ezra
  text: שלמא
  translation: שלום
  pos: noun
  example:
    text: פתגמא שלחו עלוהי וכדנה כתיב בגוה לדריוש מלכא שלמא כלא
    translation: 'הַדָּבָר שָׁלְחוּ אֵלָיו וְכָךְ כָּתוּב בְּתוֹכוֹ: לְדָרְיָוֶשׁ הַמֶּלֶךְ, הַשָּׁלוֹם הַכֹּל!'
    source: עזרא ה, ז
    vocalized: פִּתְגָמָא שְׁלַחוּ עֲלוֹהִי וְכִדְנָה כְּתִיב בְּגַוֵּהּ לְדָרְיָוֶשׁ מַלְכָּא שְׁלָמָא כֹלָּא
