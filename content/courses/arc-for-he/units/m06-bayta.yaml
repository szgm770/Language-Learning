    translation: 'וְכַזֵּה הַדָּבָר הֵשִׁיבוּנוּ לֵאמֹר: אֲנַחְנוּ הֵם עֲבָדָיו שֶׁל אֱלוֹהַּ הַשָּׁמַיִם וְהָאָרֶץ, וּבוֹנִים הַבַּיִת אֲשֶׁר הָיָה בָּנוּי מִלִּפנֵי זֶה שָׁנִים רַבּוֹת, וּמֶלֶךְ לְיִשְׂרָאֵל גָּדוֹל בָּנָהוּ וְהִשׁלִימוֹ.'
    lexemes:
    - igarta
    - teem
    - avidta
    - dena
    - kenama
    - shlama-ezra
    - benayin
    - hamo
    source: עזרא ה, יא
    vocalized: וּכְנֵמָא פִתְגָמָא הֲתִיבוּנָא לְמֵמַר אֲנַחְנָא הִמּוֹ עַבְדוֹהִי דִי אֱלָהּ שְׁמַיָּא וְאַרְעָא וּבָנַיִן בַּיְתָא דִּי הֲוָא בְנֵה מִקַּדְמַת דְּנָה שְׁנִין שַׂגִּיאָן וּמֶלֶךְ לְיִשְׂרָאֵל רַב בְּנָהִי וְשַׁכְלְלֵהּ
