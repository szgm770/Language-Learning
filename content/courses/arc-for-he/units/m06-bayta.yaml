    translation: 'אָז כָּךְ אָמַרְנוּ לָהֶם: מִי הֵם שְׁמוֹת הָאֲנָשִׁים אֲשֶׁר זֶה הַבִּנְיָן בּוֹנִים?'
    source: עזרא ה, ד
