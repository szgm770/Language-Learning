- id: hamo
  text: המו
  translation: הם, הֵמה
  pos: pronoun
  example:
    text: ושאר אמיא די הגלי אסנפר רבא ויקירא והותב המו בקריה די שמרין ושאר עבר נהרה וכענת
    translation: וּשְׁאָר הָאֻמּוֹת אֲשֶׁר הֶגְלָה אָסְנַפַּר הַגָּדוֹל וְהַנִּכְבָּד, וְהוֹשִׁיב אוֹתָם בְּעִיר שֶׁל שׁוֹמְרוֹן וּשְׁאָר עֵבֶר הַנָּהָר, וְעַתָּה,
    source: עזרא ד, י
    vocalized: וּשְׁאָר אֻמַּיָּא דִּי הַגְלִי אָסְנַפַּר רַבָּא וְיַקִּירָא וְהוֹתֵב הִמּוֹ בְּקִרְיָה דִּי שָׁמְרָיִן וּשְׁאָר עֲבַר נַהֲרָה וּכְעֶנֶת
- id: shnin-sagian
  text: שנין שגיאן
  translation: שנים רבות
  pos: phrase
  example:
    text: וכנמא פתגמא התיבונא לממר אנחנא המו עבדוהי די אלה שמיא וארעא ובנין ביתא די הוא בנה מקדמת דנה שנין שגיאן ומלך לישראל רב בנהי ושכללה
    translation: 'וְכַזֵּה הַדָּבָר הֵשִׁיבוּנוּ לֵאמֹר: אֲנַחְנוּ הֵם עֲבָדָיו שֶׁל אֱלוֹהַּ הַשָּׁמַיִם וְהָאָרֶץ, וּבוֹנִים הַבַּיִת אֲשֶׁר הָיָה בָּנוּי מִלִּפנֵי זֶה שָׁנִים רַבּוֹת, וּמֶלֶךְ לְיִשְׂרָאֵל גָּדוֹל בָּנָהוּ וְהִשׁלִימוֹ.'
    source: עזרא ה, יא
    vocalized: וּכְנֵמָא פִתְגָמָא הֲתִיבוּנָא לְמֵמַר אֲנַחְנָא הִמּוֹ עַבְדוֹהִי דִי אֱלָהּ שְׁמַיָּא וְאַרְעָא וּבָנַיִן בַּיְתָא דִּי הֲוָא בְנֵה מִקַּדְמַת דְּנָה שְׁנִין שַׂגִּיאָן וּמֶלֶךְ לְיִשְׂרָאֵל רַב בְּנָהִי וְשַׁכְלְלֵהּ
