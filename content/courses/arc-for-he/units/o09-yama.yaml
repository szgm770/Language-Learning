id: o09-yama
cefr: B1
section: onkelos
scene: study
title:
  he: ימא ומצראי
  en: The sea and the Egyptians
story: 'פרשת בשלח. קוראים את קריעת ים סוף בתרגום: מצראי, משריתא, כנשתא, מכתשא, ויציאת מצרים.'
canDo:
- 'להבין מילים של יציאת מצרים: מצראי, משריתא, כנשתא, מכתשא'
- לקרוא פסוקים רצופים בתרגום
- להבין פסחא, מדברא
vocabulary:
- id: mitsrai
  text: מצראי
  translation: המצרים
  pos: noun
  example:
    text: ואפלחו מצראי ית בני ישראל בקשיו
    translation: 'בתורה: וַיַּעֲבִדוּ מִצְרַיִם אֶת־בְּנֵי יִשְׂרָאֵל בְּפָרֶךְ'
    source: תרגום אונקלוס, שמות א, יג
    vocalized: וְאַפְלָחוּ מִצְרָאֵי יָת בְּנֵי יִשְׂרָאֵל בְּקַשְׁיוּ
- id: mashrita
  text: משריתא
  translation: המחנה
  pos: noun
  example:
    text: ותתקעון יבבתא ויטלון משריתא דשרן קדומא
    translation: 'בתורה: וּתְקַעְתֶּם תְּרוּעָה וְנָסְעוּ הַמַּחֲנוֹת הַחֹנִים קֵדְמָה'
    source: תרגום אונקלוס, במדבר י, ה
    vocalized: וְתִתְקְעוּן יַבֶּבְתָּא וְיִטְלוּן מַשִׁרְיָתָא דְשָׁרָן קִדוּמָא
- id: knishta-o
  text: כנשתא
  translation: העדה, הקהל
  pos: noun
  example:
    text: כל כנשתא דישראל יעבדון יתה
    translation: 'בתורה: כָּל־עֲדַת יִשְׂרָאֵל יַעֲשׂוּ אֹתוֹ'
    source: תרגום אונקלוס, שמות יב, מז
    vocalized: כָּל כְּנִשְׁתָּא דְיִשְׂרָאֵל יַעְבְדוּן יָתֵהּ
- id: machtasha
  text: מכתשא
  translation: המכה, הנגע
  pos: noun
  example:
    text: ואם אוספא תוסף במשכא ויסאב כהנא יתה מכתשא היא
    translation: 'בתורה: וְאִם־פָּשֹׂה תִפְשֶׂה בָּעוֹר וְטִמֵּא הַכֹּהֵן אֹתוֹ נֶגַע הִוא'
    source: תרגום אונקלוס, ויקרא יג, כב
    vocalized: וְאִם אוֹסָפָא תוֹסֵף בְּמַשְׁכָּא וִיסָאֵב כַּהֲנָא יָתֵהּ מַכְתָּשָׁא הִיא
- id: pischa
  text: פסחא
  translation: הפסח
  pos: noun
  example:
    text: ויעבדון בני ישראל ית פסחא בזמניה
    translation: 'בתורה: וְיַעֲשׂוּ בְנֵי־יִשְׂרָאֵל אֶת־הַפָּסַח בְּמוֹעֲדוֹ'
    source: תרגום אונקלוס, במדבר ט, ב
    vocalized: וְיַעְבְּדוּן בְּנֵי יִשְׂרָאֵל יָת פִּסְחָא בְּזִמְנֵיהּ
- id: madbera
  text: מדברא
  translation: המדבר
  pos: noun
  example:
    text: ונטלו מסכות ושרו באתם בסטר מדברא
    translation: 'בתורה: וַיִּסְעוּ מִסֻּכֹּת וַיַּחֲנוּ בְאֵתָם בִּקְצֵה הַמִּדְבָּר'
    source: תרגום אונקלוס, שמות יג, כ
    vocalized: וּנְטָלוּ מִסֻכּוֹת וּשְׁרוֹ בְאֵתָם בִּסְטַר מַדְבְּרָא
- id: perak
  text: ופרק
  translation: והציל, וגאל
  pos: verb
  example:
    text: ופרק יי ביומא ההוא ית ישראל מידא דמצראי וחזו ישראל ית מצראי מיתין על כיף ימא
    translation: 'בתורה: וַיּוֹשַׁע יְהוָה בַּיּוֹם הַהוּא אֶת־יִשְׂרָאֵל מִיַּד מִצְרָיִם וַיַּרְא יִשְׂרָאֵל אֶת־מִצְרַיִם מֵת עַל־שְׂפַת הַיָּם'
    source: תרגום אונקלוס, שמות יד, ל
    vocalized: וּפְרַק יְיָ בְּיוֹמָא הַהוּא יָת יִשְׂרָאֵל מִידָא דְמִצְרָאֵי וַחֲזוֹ יִשְׂרָאֵל יָת מִצְרָאֵי מַיְתִין עַל כֵּיף יַמָא
- id: chela
  text: חילא
  translation: חיל, צבא; כוח
  pos: noun
  example:
    text: ועל חילא דשבטא דבני יששכר נתנאל בר צוער
    translation: 'בתורה: וְעַל־צְבָא מַטֵּה בְּנֵי יִשָׂשכָר נְתַנְאֵל בֶּן־צוּעָר'
    source: תרגום אונקלוס, במדבר י, טו
    vocalized: וְעַל חֵילָא דְשִׁבְטָא דִבְנֵי יִשָׂשׂכָר נְתַנְאֵל בַּר צוּעָר
- id: hemenu
  text: והמינו
  translation: והאמינו
  pos: verb
  example:
    text: וחזא ישראל ית גבורתא ידא רבתא די עבד יי במצרים ודחילו עמא מן קדם יי והמינו במימרא דיי ובנביאות משה עבדה
    translation: 'בתורה: וַיַּרְא יִשְׂרָאֵל אֶת־הַיָּד הַגְּדֹלָה אֲשֶׁר עָשָׂה יְהוָה בְּמִצְרַיִם וַיִּירְאוּ הָעָם אֶת־יְהוָה וַיַּאֲמִינוּ בַּיהוָה וּבְמֹשֶׁה עַבְדּוֹ'
    source: תרגום אונקלוס, שמות יד, לא
    vocalized: וַחֲזָא יִשְׂרָאֵל יָת גְבוּרְתָּא יְדָא רַבְּתָא דִי עֲבַד יְיָ בְּמִצְרַיִם וּדְחִילוּ עַמָא מִן קֳדָם יְיָ וְהֵמִינוּ בְּמֵימְרָא דַיְיָ וּבִנְבִיאוּת משֶׁה עַבְדֵהּ
- id: yeda
  text: ידא
  translation: יד
  pos: noun
  example:
    text: ומן משחא יריק כהנא על ידא דכהנא דשמאלא
    translation: 'בתורה: וּמִן־הַשֶּׁמֶן יִצֹק הַכֹּהֵן עַל־כַּף הַכֹּהֵן הַשְּׂמָאלִית'
    source: תרגום אונקלוס, ויקרא יד, כו
    vocalized: וּמִן מִשְׁחָא יְרִיק כַּהֲנָא עַל יְדָא דְכַהֲנָא דִשְׂמָאלָא
- id: tekif
  text: תקיף
  translation: חזק
  pos: adjective
  example:
    text: וכפנא תקיף בארעא
    translation: 'בתורה: וְהָרָעָב כָּבֵד בָּאָרֶץ'
    source: תרגום אונקלוס, בראשית מג, א
    vocalized: וְכַפְנָא תַּקִּיף בְּאַרְעָא
- id: rabrevei
  text: רברבי
  translation: שרי, גדולי
  pos: noun
  example:
    text: ודישון ואצר ודישן אלין רברבי חוראי בני שעיר בארעא דאדום
    translation: 'בתורה: וְדִשׁוֹן וְאֵצֶר וְדִישָׁן אֵלֶּה אַלּוּפֵי הַחֹרִי בְּנֵי שֵׂעִיר בְּאֶרֶץ אֱדוֹם'
    source: תרגום אונקלוס, בראשית לו, כא
    vocalized: וְדִישׁוֹן וְאֵצֶר וְדִישָׁן אִלֵּין רַבְרְבֵי חוֹרָאֵי בְּנֵי שֵׂעִיר בְּאַרְעָא דֶאֱדוֹם
