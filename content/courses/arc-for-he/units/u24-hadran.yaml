  - id: u24-l3-23
    type: reading
    kind: גמרא, בבא מציעא כא ע״א
    title: סוף הפרק
    text: 'יוצא מתחת ידי שליש דהא הימניה מלוה לשליש


      יוצא לאחר חיתום שטרות נמי דאי לאו דפריע לא הוה מרע ליה לשטריה


      הדרן עלך שנים אוחזין'
    translation: '(שובר) שיוצא מתחת יד השליש, כשר, שהרי המלווה האמין לשליש.


      (שובר) שיוצא בין השטרות (של המלווה), גם כשר: שאילולא (החוב) היה פרוע, לא היה (המלווה) מחליש את השטר שלו.


      נחזור אליך, (פרק) ׳שנים אוחזין׳.'
    lexemes:
    - i-lav
    - shtara
    - mara
    - hadran
    source: בבלי, בבא מציעא כא ע״א
    vocalized: יוֹצֵא מִתַּחַת יְדֵי שָׁלִישׁ, דְּהָא הֵימְנֵיהּ מַלְוֶה לְשָׁלִישׁ. יוֹצֵא לְאַחַר חִיתּוּם שְׁטָרוֹת נָמֵי, דְּאִי לָאו דִּפְרִיעַ לָא הֲוָה מַרַע לֵיהּ לִשְׁטָרֵיהּ. הֲדַרַן עֲלָךְ שְׁנַיִם אוֹחֲזִין
