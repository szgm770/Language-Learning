      translation: המעיל
    - speaker: yisrael
      text: ״שנים אוחזין בטלית״. התווכחנו עליו כל החורף. בסוף הוא נתן אותו לי, והוא קפא.
      translation: ר׳ ישראל
    - speaker: eitan
