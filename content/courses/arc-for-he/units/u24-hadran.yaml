id: u24-hadran
cefr: B2
scene: study
title:
  he: הדרן עלך שנים אוחזין
  en: We will return to you
story: הסיום. בבית של סבא, עם כל המשפחה, השכנים, ויונאס מווילנה. איתן קורא את השורות האחרונות של הפרק, ויונאס מוציא מהתיק את מה שסבא שלו שמר שמונים שנה.
canDo:
- לקרוא את סוף הפרק הראשון של בבא מציעא
- להבין ״סהדי״, ״שטרא״, ״מסתברא״, ״גופא״
- 'לסיים פרק: הדרן עלך'
vocabulary:
- id: shaylinan
  text: שיילינן
  translation: שואלים אנחנו
  pos: verb
  example:
    text: דשיילינן להו לסהדי אי פרוע אי לא פרוע
    translation: 'ששואלים אנחנו את העדים: האם (החוב) פרוע או לא פרוע'
    source: בבלי, בבא מציעא כא ע״א
    vocalized: דְּשָׁיְילִינַן לְהוּ לְסָהֲדִי אִי פָּרוּעַ אִי לָא פָּרוּעַ
- id: sahadei
  text: סהדי
  translation: עדים
  pos: noun
  example:
    text: דשיילינן להו לסהדי אי פרוע אי לא פרוע
    translation: 'ששואלים אנחנו את העדים: האם (החוב) פרוע או לא פרוע'
    source: בבלי, בבא מציעא כא ע״א
    vocalized: דְּשָׁיְילִינַן לְהוּ לְסָהֲדִי אִי פָּרוּעַ אִי לָא פָּרוּעַ
- id: mistabra
  text: מסתברא
  translation: מסתבר, הגיוני
  pos: verb
  example:
    text: הכי נמי מסתברא מדקתני סיפא ושאין עליו עדים פסול
    translation: 'כך גם מסתבר, ממה ששנה בסוף (המשנה): ושאין עליו עדים, פסול'
    source: בבלי, בבא מציעא כא ע״א
    vocalized: 'הָכִי נָמֵי מִסְתַּבְּרָא, מִדְּקָתָנֵי סֵיפָא: וְשֶׁאֵין עָלָיו עֵדִים פָּסוּל'
- id: gufa
  text: גופא
  translation: גופו של עניין (חוזרים לדברים עצמם)
  pos: noun
  example:
    text: גופא סמפון שיש עליו עדי' יתקיים בחותמיו
    translation: 'גופו של עניין: שובר שיש עליו עדים, יתקיים בחותמיו'
    source: בבלי, בבא מציעא כא ע״א
- id: shtara
  text: שטרא
  translation: שטר; ״שטריה״ = השטר שלו
  pos: noun
  example:
    text: דאי לאו דפריע לא הוה מרע ליה לשטריה
    translation: שאילולא (החוב) היה פרוע, לא היה מחליש את השטר שלו
    source: בבלי, בבא מציעא כא ע״א
    vocalized: דְּאִי לָאו דִּפְרִיעַ לָא הֲוָה מַרַע לֵיהּ לִשְׁטָרֵיהּ
- id: mara
  text: מרע
  translation: מחליש, פוגם
