    title: אור ונשמה
    text: '**נהורא** = אור. **נהיר** = מאיר. **חשוכא** = חושך. **מגו** = מתוך.


      **נשמתא** = נשמה. **אילנא דחיי** = עץ החיים.


      בזוהר האור והחושך הם לא רק טבע: הם עבודת האדם.'
