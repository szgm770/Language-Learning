    en: The secret of faith
  exercises:
  - id: z01-l2-14
    type: tip
    title: הלשון של הזוהר
    text: 'הזוהר כתוב בארמית ספרותית, דומה לבבלי ולתרגום.


      **פתח ואמר** = פתח ואמר (מתחיל דרשה). **תאנא** = שנינו. **ת״ח** = תא חזי, בוא וראה.


      **אוקמוה** = כבר הסבירו. **רזא** = סוד. **זכאה** = אשרי.'
