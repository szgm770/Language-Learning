id: z01-ta-chazi
cefr: A1
scene: study
title:
  he: תא חזי
  en: Come and see
story: ל״ג בעומר. איתן, חנה ור׳ ישראל נוסעים למירון. ר׳ ישראל מספר שסבא הלך לשם כל שנה, ותמיד עם זוהר קטן בכיס. בדרך לומדים את המילים שפותחות כל קטע בזוהר.
canDo:
- 'לזהות את נוסחאות הזוהר: פתח, תאנא, תא חזי, זכאה'
- להבין חברייא, חולקיה, רזא
- 'להבין ״אוקמוה״: כבר הסבירו זאת'
vocabulary:
- id: zakaa
  text: זכאה
  translation: אשרי, מאושר; צדיק
  pos: adjective
  example:
    text: זכאה חולקיה בעלמין כלהו
    translation: אשרי חלקו בכל העולמות
    source: זוהר, פרשת בהר
- id: chulakeih
  text: חולקיה
  translation: חלקו
  pos: noun
  example:
    text: זכאה חולקיה בעלמין כלהו
    translation: אשרי חלקו בכל העולמות
    source: זוהר, פרשת בהר
- id: chavraya
  text: חברייא
  translation: החברים (תלמידי רבי שמעון)
  pos: noun
  example:
    text: והא אתערו ביה חברייא
    translation: והרי כבר עוררו בו (דיברו בו) החברים
    source: זוהר, פרשת בראשית
- id: okmuha
  text: אוקמוה
  translation: העמידו אותו, הסבירו אותו
  pos: verb
  example:
    text: האי קרא אוקמוה ואתמר
    translation: את הפסוק הזה כבר העמידו (הסבירו), ונאמר
    source: זוהר, פרשת בראשית
- id: raza
  text: רזא
