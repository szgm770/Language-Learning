  exercises:
  - id: z01-l1-01
    type: dialogue
    scene: בטרמפ למירון. כולם עם תיקים, ור׳ ישראל עם זוהר קטן וישן.
    lines:
    - speaker: yisrael
      text: זה הזוהר של סבא שלך. כל שנה בל״ג בעומר הוא קרא ממנו במירון, ליד הציון של רבי שמעון בר יוחאי.
      translation: הזוהר של סבא
    - speaker: eitan
      text: ״זכאה חולקיה״. אשרי חלקו. את זה הוא סימן בעיפרון.
      translation: איתן
    - speaker: yisrael
      text: 'והזוהר מדבר כל הזמן על ״חברייא״, החברים של רבי שמעון. וכל קטע פותח ב״ת״ח״, תא חזי: בוא וראה.'
      translation: חברייא, תא חזי
