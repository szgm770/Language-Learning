id: z04-bar-nash
cefr: B1
scene: study
title:
  he: ווי לההוא בר נש
  en: Woe to that person
story: 'בדרך הביתה ממירון. ר׳ ישראל מלמד את הקטע שסבא חזר עליו: התורה אינה רק ״ספורין״, סיפורים. יש לה לבוש, גוף ונשמה.'
canDo:
- להבין ווי, ב״נ, ספורין, לאחזאה
- להבין אשתכח, אתער, יכיל, לאסתכלא
- לקרוא קטע מהזוהר בפרשת בהעלותך
