- id: z04-l2
  kind: new
  title:
    he: קום, אתער
    en: Rise, awaken
  exercises:
  - id: z04-l2-15
    type: tip
    title: פעלים בזוהר
    text: '**אשתכח** = נמצא. **אתער** = התעורר. **לאסתכלא** = להתבונן. **יכיל** = יכול. **אצטריך** = צריך.


      **גרמיה** = עצמו (בבבלי: נפשיה). **בלחודוי** = לבדו.


      הרבה פעלים בזוהר מתחילים ב**את־** או **אש־**: אתער, אשתכח, אתגלייא. זה כמו ״הת־״ בעברית.'
  - id: z04-l2-16
    type: learn
    lexeme: ishtakach
  - id: z04-l2-17
    type: learn
    lexeme: iter
  - id: z04-l2-18
    type: learn
    lexeme: leistakla
