      text: Buenos días, Yael. ¿Qué hiciste el fin de semana?
      translation: בוקר טוב, יעל. מה עשית בסוף השבוע?
    - speaker: yael
      text: El viernes preparé la cena y fuimos a la sinagoga. El sábado descansé. El domingo caminé por el parque.
      translation: ביום שישי הכנתי את הסעודה והלכנו לבית הכנסת. בשבת נחתי. ביום ראשון טיילתי בפארק.
    - speaker: sofia
      text: ¡Qué bien! Yo trabajé mucho y vi una película.
      translation: איזה יופי! אני עבדתי הרבה וראיתי סרט.
    - speaker: yael
