scene: day
title:
  he: מה עשיתי? (עבר)
  en: What did I do? (past tense)
story: 'יום שני בבוקר. סופיה שואלת את יעל מה עשתה בסוף השבוע, ויעל לומדת לספר על העבר. בעברית יש זמן עבר אחד ובספרדית יש שניים, אבל מתחילים בקל: ה־pretérito הרגיל.'
canDo:
- לספר מה עשיתי אתמול ובשבוע שעבר
- 'להטות פעלים רגילים בעבר: hablé, hablaste, habló…'
- 'להשתמש בסימני זמן: ayer, anoche, la semana pasada'
- לשאול ¿Qué hiciste…? ולענות
