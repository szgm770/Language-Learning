grammar:
- id: preterito-regular
  title:
    he: עבר (pretérito) – פעלים רגילים
    en: The preterite of regular verbs
  explanation: 'בעברית יש זמן עבר אחד ("דיברתי, דיברת, דיבר"). בספרדית יש שניים: ה־**pretérito** (מה שקרה ונגמר) וה־**imperfecto** (רקע, הרגל). אנחנו מתחילים בראשון, והוא דומה מאוד לעבר העברי: הסיומת מספרת מי עשה.


    | כינוי | -ar (hablar) | -er / -ir (comer, vivir) |

    |---|---|---|

    | yo | habl**é** | com**í** / viv**í** |

    | tú | habl**aste** | com**iste** / viv**iste** |

    | él / ella / usted | habl**ó** | com**ió** / viv**ió** |

    | nosotros | habl**amos** | com**imos** / viv**imos** |

    | ellos / ustedes | habl**aron** | com**ieron** / viv**ieron** |


    * **שימו לב לטעם** (האקסנט): *hablé* ו־*habló* מוטעמים בסוף. בלי האקסנט זה פועל אחר (hablo = אני מדבר).

    * ב־nosotros -ar/-ir נראים כמו ההווה (*hablamos*): ההקשר ("ayer") מבהיר.

    * **איותים:** *llegar* → yo **llegué** (gu), *buscar* → yo **busqué** (qu).

    * **סימני זמן:** *ayer* (אתמול), *anoche* (אמש), *la semana pasada*, *el año pasado*, **hace** + זמן: *hace dos días* (לפני יומיים).

    * שאלה: **¿Qué hiciste ayer?** (מה עשית אתמול?)'
  examples:
  - text: Ayer trabajé hasta las dos y comí en casa.
    translation: אתמול עבדתי עד שתיים ואכלתי בבית.
  - text: La semana pasada llegamos tarde a la reunión.
    translation: בשבוע שעבר הגענו באיחור לפגישה.
  - text: Mateo escribió el informe y lo envió.
    translation: מתאו כתב את הדוח ושלח אותו.
