lessons:
- id: u00a-l1
  kind: new
  title:
    he: 'אות ראשונות: A עד G'
    en: Letters
  exercises:
  - id: u00a-l1-01
    type: tip
    title: הספרדית נקראת כמו שהיא כתובה
    text: 'בספרדית **כמעט כל אות מייצגת צליל אחד קבוע**, ולכן אפשר ללמוד לקרוא תוך שעה. יש 27 אותיות, כולל **ñ** שאינה באנגלית.

      התנועות **a e i o u** נשמעות כמעט בדיוק כמו אַ אֶ אִ אוֹ אוּ בעברית: קצרות, ברורות ולא מתארכות.

      לכל אות יש גם **שם** (a, be, ce…), ובשיעור הזה לומדים אותם כדי שיהיה אפשר לאיית.

      '
