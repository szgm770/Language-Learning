- id: u00a-l3
  kind: new
  title:
    he: האותיות Ñ עד T
    en: Letters
  exercises:
  - id: u00a-l3-01
    type: tip
    title: האות Ñ
    text: '**ñ** נקראת *eñe* והצליל שלה הוא כמו **"ני"** בעברית: *año* (שנה) נשמעת "אַנְיוֹ".

      שימו לב: **ñ אינה n עם קישוט**, זו אות נפרדת שמשנה את המשמעות: *año* (שנה) מול *ano* (פי הטבעת).

      במקלדת של האתר יש כפתור מיוחד ל־ñ.

      '
