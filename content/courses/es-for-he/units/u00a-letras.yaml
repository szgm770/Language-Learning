  en: The letters
story: הספרדית נכתבת כמעט בדיוק כמו שהיא נשמעת. כאן לומדים את 27 האותיות ואת השמות שלהן, ומיד קוראים מילים אמיתיות.
canDo:
- לזהות ולהגות את כל 27 אותיות האלפבית הספרדי
- לאיית שם בספרדית
- לקרוא מילים פשוטות בקול
