    en: The family tree
  exercises:
  - id: u04-l5-01
    type: reading
    kind: טקסט
    title: Mi familia
    text: 'Me llamo Yael y esta es mi familia.

      Mis padres son de Israel. Mi padre se llama David y mi madre se llama Ruth. Son muy simpáticos.

      Tengo dos hermanos y una hermana. Mi hermano mayor es muy simpático. Mi hermana menor tiene diecisiete años.

      Mis abuelos también son de Israel, y tienen cuatro nietos.

