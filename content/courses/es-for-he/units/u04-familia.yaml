grammar:
- id: posesivos
  title:
    he: שלי, שלך, שלו, ורבים
    en: Possessives and plurals
  explanation: '**מילות שייכות** באות **לפני** שם העצם, ולא אחריו:


    | בעברית | בספרדית |

    |---|---|

    | אמא **שלי** | **mi** madre |

    | אח **שלך** | **tu** hermano |

    | בן **שלו / שלה** | **su** hijo |

    | הבית **שלנו** | **nuestro** hijo / **nuestra** hija |


    ברבים מוסיפים **s**: *mi hermano* → ***mis*** *hermanos*; *tu hermana* → ***tus*** *hermanas*; *su hijo* → ***sus*** *hijos*.

    *su* יכול להיות "שלו", "שלה", "שלהם" או "שלכם", וההקשר מבהיר. כדי להבהיר: **la madre de Dani**.


    **רבים של שמות עצם:** אחרי תנועה מוסיפים **-s** (*hermano → hermanos*); אחרי עיצור מוסיפים **-es** (*papel → papeles*). הערה חשובה: **los padres** פירושו "ההורים" (אבא ואמא), לא רק "אבות".

    וגם: *el hermano* (זכר), *la hermana* (נקבה), *los hermanos* = "האחים" (כשיש גם אחיות).'
  examples:
  - text: Mi madre es de Israel.
    translation: אמא שלי מישראל.
  - text: Mis hermanos son jóvenes.
    translation: האחים שלי צעירים.
  - text: Sus padres son simpáticos.
    translation: ההורים שלו (שלה) נחמדים.
