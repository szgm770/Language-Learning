id: u31-subjuntivo-uso
cefr: B2
scene: work
title:
  he: 'לפני שתצא הגרסה: סובג''ונקטיב לעומק'
  en: Subjunctive in depth
story: 'הצוות של יעל משיק מוצר חדש. כולם ממוקדים במה שעלול לקרות, במה שחייבים לעשות ובמתי: ''antes de que salga'', ''cuando termines'', ''para que funcione''. יעל מבינה שהסובג''ונקטיב הוא לא רק ''רוצה ש'', אלא דרך להסתכל קדימה.'
canDo:
- להשתמש בסובג'ונקטיב אחרי רגשות (me alegra que, temo que)
- להשתמש אחרי ביטויים כלליים (es necesario que, es mejor que)
- 'לחבר זמן ומטרה: antes de que, para que, cuando + סובג''ונקטיב'
- 'להבחין בין כוונה ועובדה: cuando llego / cuando llegue'
