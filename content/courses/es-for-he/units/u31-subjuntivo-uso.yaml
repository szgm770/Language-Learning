grammar:
- id: subj-uso
  title:
    he: שימושי הסובג'ונקטיב
    en: Uses of the subjunctive
  explanation: 'בעברית "כשתגיע" (עתיד) ו"כשהגעת" (עבר) הם שני מצבים שונים. בספרדית גם: **עובדה** → אינדיקטיב, **עתיד / לא ודאי / מטרה** → סובג''ונקטיב.


    **1. רגשות והערכות (על מה שמישהו אחר עושה):**

    * *Me alegra que **vengas**.* | *Siento que **no puedas**.* | *Temo que **llegue** tarde.* | *Me sorprende que **sea** tan fácil.*

    **2. ביטויים כלליים עם es + שם תואר:** *Es necesario que **terminemos** hoy.* | *Es mejor que **hables** con él.* (אבל: *Es verdad que **es** difícil* – עובדה → אינדיקטיב)


    **3. מילות חיבור שתמיד לוקחות סובג''ונקטיב:**

    **para que** (כדי ש), **antes de que** (לפני ש), **a menos que** (אלא אם), **sin que** (בלי ש), **con tal de que** (ובלבד ש):

    * *Te llamo **antes de que salga**.* | *Lo explico **para que entiendas**.* | *No salgo **a menos que** me **llames**.*


    **4. זמן – תלוי בעתיד:** **cuando, en cuanto, hasta que, después de que**

    * **הרגל או עבר** → אינדיקטיב: *Cuando **llego**, siempre saludo.* | *Cuando **llegué**, ya se había ido.*

    * **עתיד** → סובג''ונקטיב: *Cuando **llegue**, te aviso.* | *En cuanto **terminemos**, salimos.*


    **5. ‏aunque:** עובדה → *Aunque **llueve**, salgo.* (כבר יורד); אפשרות → *Aunque **llueva**, saldré.* (גם אם ירד)


    **הערה:** כשיש נושא אחד אין סובג''ונקטיב: *Antes de **salir**, apago la luz.* (מקור) – אבל *antes de que **salgas**.*'
  examples:
  - text: Es necesario que probemos la versión antes de que salga.
    translation: הכרחי שננסה את הגרסה לפני שתצא.
  - text: Cuando termines, avísame. En cuanto lo sepa, te llamo.
    translation: כשתסיים, תודיע לי. ברגע שאדע, אתקשר אליך.
  - text: Me alegra que el equipo esté listo, a menos que haya otro error.
    translation: משמח אותי שהצוות מוכן, אלא אם כן יהיה עוד באג.
