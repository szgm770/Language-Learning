  en: Plans and weather
story: 'יעל ולוסיה מתכננות את סוף השבוע: יום שישי בבוקר, יום ראשון בפארק. הן בודקות מה מזג האוויר ולומדות לדבר על העתיד הקרוב עם ir a.'
