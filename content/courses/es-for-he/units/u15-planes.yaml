grammar:
- id: ir-a-inf
  title:
    he: ir a + מקור, ומזג אוויר
    en: Going to, and weather
  explanation: '**העתיד הקרוב:** **ir** (שכבר למדנו) + **a** + פועל במקור = "עומד ל־":


    | בספרדית | בעברית |

    |---|---|

    | **Voy a** visitar a mi familia. | אני הולכת לבקר את המשפחה שלי. |

    | **¿Vas a** venir mañana? | אתה בא מחר? |

    | **Va a** llover. | עומד לרדת גשם. |

    | **Vamos a** comer. | אנחנו הולכים לאכול. |

    | **Van a** trabajar. | הם הולכים לעבוד. |


    זה העתיד הנפוץ ביותר בדיבור. ב־B1 נלמד גם את צורת העתיד ("hablaré").

    **pensar** + מקור = "מתכוון": *Pienso visitar Oaxaca* (e → ie: *pienso, piensas, piensa, pensamos, piensan*).

    **venir** = לבוא (חריג): *vengo, vienes, viene, venimos, vienen*.


    **מזג אוויר:** בספרדית אומרים **"עושה"** (hace): *Hace frío / calor / sol / viento.* אבל: *Llueve* (יורד גשם), *Está nublado* (מעונן). שאלה: **¿Qué tiempo hace?**

    שימו לב: **tiempo** = גם ''זמן'' וגם ''מזג אוויר''. *Tengo tiempo.* (יש לי זמן.)'
  examples:
  - text: Mañana vamos a visitar a Dani.
    translation: מחר אנחנו הולכים לבקר את דני.
  - text: Hoy hace sol, pero mañana va a llover.
    translation: היום יש שמש אבל מחר ירד גשם.
  - text: ¿Quieres venir al parque el domingo?
    translation: רוצה לבוא לפארק ביום ראשון?
