id: u36-estilo-indirecto
cefr: B2
scene: work
title:
  he: 'הוא אמר ש…: דיבור עקיף'
  en: Reported speech
story: 'אחרי פגישה עם לקוח חשוב, יעל צריכה לדווח לצוות מה כל אחד אמר: ''Dijo que vendría'', ''Preguntó si ya habíamos terminado'', ''Pidió que le mandáramos el informe''. היא לומדת להעביר דברים בלי לשנות את המשמעות.'
canDo:
- 'לדווח על אמירה: dijo que + זמן מוסט'
- 'לדווח על שאלה: preguntó si / qué / cuándo'
- 'לדווח על בקשה או הוראה: pidió que + סובג''ונקטיב בעבר'
- לשנות זמנים ומילות זמן/מקום
