grammar:
- id: estilo-indirecto
  title:
    he: דיבור עקיף
    en: Reported speech
  explanation: 'בעברית: "הוא אמר: *אני אבוא*" → "הוא אמר שיבוא". בספרדית הזמן מוסט **צעד אחורה** כשהפועל המדווח בעבר:


    | ציטוט ישיר | דיבור עקיף |

    |---|---|

    | "Estoy cansado." | Dijo que **estaba** cansado. (הווה → אימפרפקט) |

    | "Voy a venir." | Dijo que **iba a venir**. |

    | "Vendré mañana." | Dijo que **vendría** al día siguiente. (עתיד → תנאי) |

    | "Terminé el informe." | Dijo que **había terminado** el informe. (פרטריט → pluscuamperfecto) |

    | "He hablado con él." | Dijo que **había hablado** con él. |

    | "Si puedo, voy." | Dijo que **si podía, iría**. |


    **שאלות:** *"¿Ya terminaste?"* → *Preguntó **si** ya había terminado.* | *"¿Cuándo vienes?"* → *Preguntó **cuándo** venía.*

    **בקשות והוראות:** *"Envíame el informe."* → *Pidió **que le enviara** el informe.* (סובג''ונקטיב בעבר) | *Me dijo que **lo hiciera**.*


    **שינויי מילים:** *aquí → allí* | *hoy → ese día* | *mañana → al día siguiente* | *ayer → el día anterior* | *ahora → entonces* | *este → ese*


    **הערה:** אם הפועל המדווח בהווה (*Dice que viene*), הזמן לא משתנה. ואם הדבר נכון גם עכשיו, מותר להשאיר הווה: *Dijo que la reunión es a las tres.*'
  examples:
  - text: El cliente dijo que le gustaba la propuesta y que la firmaría al día siguiente.
    translation: הלקוח אמר שהוא אוהב את ההצעה ושיחתום עליה למחרת.
  - text: Preguntó si ya habíamos terminado el informe.
    translation: הוא שאל אם כבר סיימנו את הדוח.
  - text: Me pidió que le mandara los documentos.
    translation: הוא ביקש ממני שאשלח לו את המסמכים.
