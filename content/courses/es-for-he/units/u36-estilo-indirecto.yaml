  - id: u36-l4-01
    type: reading
    kind: סיכום
    title: Resumen de la reunión
    text: 'El cliente dijo que le gustaba la propuesta, pero que necesitaba más tiempo para decidir. Preguntó si podíamos reducir el precio y si habíamos revisado el contrato.

      Yo respondí que sí, que ya lo habíamos revisado, y que el lunes le mandaríamos la versión final. Él pidió que se la enviáramos por correo.

      También prometió que nos daría una respuesta al día siguiente.

      '
    translation: 'הלקוח אמר שההצעה מוצאת חן בעיניו, אבל שהוא צריך עוד זמן להחליט. הוא שאל אם אפשר להוזיל את המחיר ואם בדקנו את החוזה.

      עניתי שכן, שכבר בדקנו אותו, ושביום שני נשלח לו את הגרסה הסופית. הוא ביקש שנשלח לו אותה בדואר.

      הוא גם הבטיח שיתן לנו תשובה למחרת.

      '
