- id: u12-l5
  kind: reading
  title:
    he: בוקר של יום שישי
    en: A Friday morning
  exercises:
  - id: u12-l5-01
    type: reading
    kind: יומן
    title: Un viernes de Yael
    text: 'Los viernes me despierto a las seis. Primero me lavo las manos y rezo. Luego me ducho, me visto y desayuno.

      Antes de salir, preparo la comida de Shabat. Por la tarde estoy cansada, pero estoy lista.

      Por la noche cenamos en familia y a veces cantamos. Nunca trabajo el sábado.

      '
    translation: 'בימי שישי אני מתעוררת בשש. קודם כול אני נוטלת ידיים ומתפללת. אחר כך אני מתקלחת, מתלבשת ואוכלת ארוחת בוקר.

      לפני שאני יוצאת אני מכינה את האוכל לשבת. אחר הצהריים אני עייפה, אבל אני מוכנה.

      בערב אנחנו אוכלים כמשפחה ולפעמים שרים. אני אף פעם לא עובדת בשבת.

      '
