grammar:
- id: reflexivos
  title:
    he: פעלים חוזרים ופעלים 'נשברים'
    en: Reflexive verbs and stem changes
  explanation: '**פעלים חוזרים** (reflexivos) הם פעלים שבהם הפעולה חוזרת אל מי שעושה אותה. בעברית יש להם בניין שלם (התרחץ, התלבש, התעורר). בספרדית מוסיפים כינוי לפני הפועל:


    | כינוי | כינוי חוזר | levantarse |

    |---|---|---|

    | yo | **me** | me levanto |

    | tú | **te** | te levantas |

    | él / ella / usted | **se** | se levanta |

    | nosotros | **nos** | nos levantamos |

    | ellos / ustedes | **se** | se levantan |


    המקור מסתיים ב־**se**: *levantarse*, *lavarse*. הכינוי **חייב** להופיע: *Me levanto temprano.* (ולא *Levanto temprano*).

    כשמדברים על חלק גוף משתמשים ב־el/la, **לא** ב־mi: *Me lavo **las** manos.*


    **פעלים "נשברים":** בכמה פעלים התנועה שבתוך הגזע משתנה כשהיא מודגשת, ובשני האנשים של nosotros לא:

    * **e → ie:** despertarse → *me despierto*, *nos despertamos*

    * **o → ue:** acostarse → *me acuesto*, dormir → *duermo*, *dormimos*

    * **e → i:** vestirse → *me visto*, *nos vestimos*

    (כבר פגשנו אותם: querer → *quiero*, poder → *puedo*.)


    **סדר:** *primero, luego, después, por último.* **antes de / después de** + פועל במקור: *después de desayunar*.'
  examples:
  - text: Me despierto temprano y me lavo las manos.
    translation: אני מתעוררת מוקדם ונוטלת ידיים.
  - text: Se acuesta tarde porque estudia.
    translation: הוא הולך לישון מאוחר כי הוא לומד.
  - text: Después de rezar, desayuno.
    translation: אחרי התפילה אני אוכלת ארוחת בוקר.
