  en: My morning routine
story: 'יעל מספרת ללוסיה איך נראה בוקר רגיל שלה: קמה, נוטלת ידיים, מתפללת, אוכלת ויוצאת. בדרך היא לומדת פעלים עם ''me'', ''te'', ''se'', ופעלים ש''נשברים באמצע'': me acuesto, me despierto.'
canDo:
