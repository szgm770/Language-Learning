id: u41-matices
cefr: C1
scene: news
title:
  he: 'אולי, כנראה, ככל ש…: ניואנסים של הודאות'
  en: 'Nuance: certainty and conjecture'
story: 'יעל מגיעה לרמה שבה אי אפשר לומר רק ''כן'' או ''לא''. בכתבה על פרויקט העיר היא קוראת: ''Quizás se apruebe'', ''Serán las tres'', ''Por mucho que lo intenten…''. היא לומדת לבטא ספק, הערכה והסתייגות בדיוק של דוברת מתקדמת.'
canDo:
- 'לבטא ספק והנחה: quizás, tal vez, a lo mejor, seguramente'
- 'להשתמש בעתיד ובתנאי של הנחה: serán las tres, tendría treinta años'
- 'לבטא ויתור: por mucho que, por más que, aunque + סובג''ונקטיב'
- להבחין בין ודאות (indicativo) ולא־ודאות (subjuntivo)
