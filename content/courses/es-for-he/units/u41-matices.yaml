    type: reading
    kind: כתבה
    title: ¿Se construirá el parque?
    text: 'Según fuentes del ayuntamiento, quizás se apruebe el proyecto del parque, aunque nada es seguro. Probablemente los trabajos empiecen en primavera, pero a lo mejor se retrasen por falta de presupuesto.

      Un vecino, que tendría unos sesenta años, dijo: «Por mucho que lo prometan, no creo que lo terminen». Los expertos creen que, por muy complicado que sea, el proyecto es viable.

      '
    translation: 'לפי מקורות בעירייה, אולי יאושר פרויקט הפארק, אם כי שום דבר לא בטוח. כנראה העבודות יתחילו באביב, אבל אולי יתעכבו בגלל חוסר תקציב.

      שכן, שבערך בן שישים, אמר: «ככל שיבטיחו, אני לא חושב שיסיימו». המומחים סבורים שככל שהפרויקט מסובך, הוא ישים.

