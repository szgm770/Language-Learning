  - id: u41-review-12
    type: write
    prompt: 'כתבו ניתוח זהיר (5–7 משפטים) של שאלה פתוחה: האם פרויקט, החלטה או שינוי ייצליחו. השתמשו בביטויי ספק והשערה (quizás, a lo mejor, probablemente, seguramente), בויתור (por mucho que / por más que / por muy… que / aunque), ובהשערה (עתיד או תנאי: estará, serán, tendría).'
    minWords: 60
    checks:
    - label: אולי / כנראה (quizás, tal vez, a lo mejor, probablemente, seguramente)
      any:
      - quizas
      - tal vez
      - a lo mejor
      - probablemente
      - seguramente
      - posiblemente
    - label: ויתור (por mucho que / por más que / por muy… que / a pesar de que / aunque)
      any:
      - por mucho que
      - por mas que
      - por muy
      - a pesar de que
      - aunque
    - label: 'השערה: עתיד או תנאי (será, estará, tendrá, tendría, estaría)'
      any:
      - \b(sera|seran|estara|estaran|tendra|tendran|tendria|tendrian|estaria|estarian|llegaria|llegara)\b
    - label: סובג'ונקטיב (llegue, tenga, sea, apruebe, intente…)
      any:
      - \b(llegue|tenga|sea|apruebe|intente|intenten|funcione|pueda|logre|logren|haya|termine|terminen)\b
    model: Quizás el proyecto se apruebe este año, pero a lo mejor se retrase por falta de dinero. Probablemente los vecinos estén contentos, aunque algunos no creen que sea posible. Por mucho que lo prometan, no hay garantía. Por muy complicado que sea, creo que es viable. Seguramente habrá cambios; tendría que haber más información. El resultado depende del presupuesto, y por eso conviene esperar antes de opinar con seguridad.
    lexemes: []
