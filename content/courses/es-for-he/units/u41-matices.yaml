grammar:
- id: matices-modo
  title:
    he: ודאות, השערה וויתור
    en: Certainty, conjecture and concession
  explanation: 'בעברית אפשר לומר "אולי הוא יבוא", "כנראה שהוא בא", "ככל שירצה – לא יצליח". בספרדית הבחירה בין **אינדיקטיב** ל**סובג''ונקטיב** מראה כמה את בטוחה:


    **אולי:**

    * *quizás / tal vez / posiblemente* + **סובג''ונקטיב** (אי־ודאות): *Quizás **llegue** tarde.* | *Tal vez **tenga** razón.* — אבל + **אינדיקטיב** אם את בטוחה יותר: *Quizás **llegó** ya.*

    * *a lo mejor* תמיד + **אינדיקטיב** (דיבורי, מקסיקני): *A lo mejor **llega** tarde.*

    * *seguramente / probablemente / acaso* – לפי מידת הוודאות.


    **השערה (עתיד ותנאי):** הערכה על הווה ועבר:

    * **עתיד = השערה על הווה:** *Serán las tres.* (בטח כבר שלוש) | *Estará en casa.* (כנראה שהוא בבית)

    * **תנאי = השערה על עבר:** *Tendría treinta años.* (הוא היה בערך בן שלושים) | *Llegaría tarde.* (כנראה איחר)


    **ויתור (לא משנה כמה):**

    * *por mucho que / por más que* + סובג''ונקטיב: ***Por mucho que** estudies, no vas a saber todo.* (ככל שתלמד…)

    * *por muy + תואר + que* + סובג''ונקטיב: ***Por muy** difícil **que** sea, lo intento.*

    * *aunque*: עובדה → אינדיקטיב (*Aunque llueve, salgo*); אפשרות → סובג''ונקטיב (*Aunque llueva, saldré*).

    * *a pesar de que* + אינדיקטיב (עובדה): *A pesar de que está cansado, trabaja.*


    **הערה:** כשאת רוצה להישמע זהירה, העדיפי *seguramente* ו־*probablemente* על פני "sí" ו־"no".'
  examples:
  - text: Quizás se apruebe el proyecto. A lo mejor llega la semana próxima.
    translation: אולי הפרויקט יאושר. אולי הוא יגיע בשבוע הבא.
  - text: Serán las tres. Tendría unos treinta años cuando llegó.
    translation: בטח כבר שלוש. הוא היה בערך בן שלושים כשהגיע.
  - text: Por mucho que lo intenten, no van a ganar.
    translation: ככל שינסו, הם לא ינצחו.
