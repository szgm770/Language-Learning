    lines:
    - speaker: yael
      text: Mi computadora está muy lenta y no puedo conectarme a la red.
      translation: המחשב שלי איטי מאוד ואני לא מצליחה להתחבר לרשת.
    - speaker: herrera
      text: Primero hay que instalar la versión nueva; es compatible con tu equipo.
      translation: קודם צריך להתקין את הגרסה החדשה; היא תואמת למחשב שלך.
    - speaker: yael
      text: Voy a borrar archivos viejos, imprimir el contrato y escanear la firma.
      translation: אני אמחק קבצים ישנים, אדפיס את החוזה ואסרוק את החתימה.
    - speaker: herrera
      text: Cuando termines, programa una reunión; mañana estoy disponible.
      translation: כשתסיימי, קבעי פגישה; מחר אני פנוי.
