id: p3-words
cefr: B1
scene: work
title:
  he: המשרד של דון ריקרדו
  en: Don Ricardo's office
story: 'יעל מתחילה פרויקט חדש במשרד של דון ריקרדו: סיסמאות, רשת, עדכונים וגיבויים. היא לומדת את שפת המחשב והעבודה היומיומית.'
canDo:
- לדבר על ציוד ותוכנות במשרד
- לבקש עזרה טכנית
- לתאר פעולות במחשב
vocabulary:
- id: p3-horario
  text: el horario
  translation: לוח זמנים, שעות
  pos: noun
  example:
    text: Mi horario es de nueve a cinco.
    translation: שעות העבודה שלי הן מתשע עד חמש.
- id: p3-herramienta
  text: la herramienta
  translation: כלי
  pos: noun
  example:
    text: Esta herramienta nos ahorra mucho tiempo.
    translation: הכלי הזה חוסך לנו הרבה זמן.
- id: p3-contrasena
  text: la contraseña
  translation: סיסמה
  pos: noun
  example:
    text: No compartas tu contraseña con nadie.
    translation: אל תשתף את הסיסמה שלך עם אף אחד.
- id: p3-pantalla
  text: la pantalla
  translation: מסך
  pos: noun
  example:
    text: La pantalla de mi computadora es grande.
    translation: המסך של המחשב שלי גדול.
- id: p3-teclado
  text: el teclado
  translation: מקלדת
  pos: noun
  example:
    text: Necesito un teclado nuevo.
    translation: אני צריכה מקלדת חדשה.
- id: p3-red
  text: la red
  translation: רשת
  pos: noun
  example:
    text: La red de la oficina es muy rápida.
    translation: הרשת של המשרד מהירה מאוד.
- id: p3-aplicacion
  text: la aplicación
  translation: אפליקציה
  pos: noun
  example:
    text: Descargué la aplicación en mi celular.
    translation: הורדתי את האפליקציה בנייד.
- id: p3-actualizacion
  text: la actualización
  translation: עדכון
  pos: noun
  example:
    text: La actualización tarda diez minutos.
    translation: העדכון לוקח עשר דקות.
- id: p3-respaldo
  text: el respaldo
  translation: גיבוי
  pos: noun
  example:
    text: Hago un respaldo cada semana.
    translation: אני עושה גיבוי כל שבוע.
- id: p3-plataforma
  text: la plataforma
  translation: פלטפורמה
  pos: noun
  example:
    text: Usamos una plataforma nueva para el curso.
    translation: אנחנו משתמשים בפלטפורמה חדשה לקורס.
- id: p3-raton
  text: el ratón
  translation: עכבר (מחשב)
  pos: noun
  example:
    text: El ratón no funciona bien.
    translation: העכבר לא עובד טוב.
- id: p3-cargador
  text: el cargador
  translation: מטען
  pos: noun
  example:
    text: ¿Dónde está el cargador de mi celular?
    translation: איפה המטען של הנייד שלי?
- id: p3-descargar
  text: descargar
  translation: להוריד (קובץ)
  pos: verb
  example:
    text: Voy a descargar el informe ahora.
    translation: אני הולכת להוריד את הדוח עכשיו.
- id: p3-subir
  text: subir
  translation: להעלות
  pos: verb
  example:
    text: Puedes subir las fotos a la plataforma.
    translation: אפשר להעלות את התמונות לפלטפורמה.
- id: p3-guardar
  text: guardar
  translation: לשמור
  pos: verb
  example:
    text: No olvides guardar el archivo.
    translation: אל תשכח לשמור את הקובץ.
- id: p3-actualizar
  text: actualizar
  translation: לעדכן
  pos: verb
  example:
    text: Tengo que actualizar el programa hoy.
    translation: אני צריכה לעדכן את התוכנה היום.
- id: p3-instalar
  text: instalar
  translation: להתקין
  pos: verb
  example:
    text: Voy a instalar el programa nuevo.
    translation: אני הולכת להתקין את התוכנה החדשה.
- id: p3-conectarse
  text: conectarse
  translation: להתחבר
  pos: verb
  example:
    text: Es difícil conectarse a la red aquí.
    translation: קשה להתחבר לרשת כאן.
- id: p3-borrar
  text: borrar
  translation: למחוק
  pos: verb
  example:
    text: Puedes borrar los archivos viejos.
    translation: אפשר למחוק את הקבצים הישנים.
- id: p3-programar
  text: programar
  translation: לתכנת, לתזמן
  pos: verb
  example:
    text: Hay que programar una reunión para mañana.
    translation: צריך לקבוע פגישה למחר.
- id: p3-imprimir
  text: imprimir
  translation: להדפיס
  pos: verb
  example:
    text: Necesito imprimir el contrato.
    translation: אני צריכה להדפיס את החוזה.
- id: p3-escanear
  text: escanear
  translation: לסרוק
  pos: verb
  example:
    text: Voy a escanear los documentos.
    translation: אני הולכת לסרוק את המסמכים.
- id: p3-disponible
  text: disponible
  translation: זמין, פנוי
  pos: adjective
  example:
    text: El doctor está disponible por la tarde.
    translation: הדוקטור פנוי אחר הצהריים.
- id: p3-lento
  text: lento
  translation: איטי
  pos: adjective
  example:
    text: Mi internet está muy lento hoy.
    translation: האינטרנט שלי איטי מאוד היום.
- id: p3-compatible
  text: compatible
  translation: תואם
  pos: adjective
  example:
    text: Este cargador es compatible con mi celular.
    translation: המטען הזה תואם לנייד שלי.
