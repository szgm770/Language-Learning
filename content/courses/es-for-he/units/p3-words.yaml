id: p3-words
cefr: B1
scene: tech
title:
  he: 'הרחבת אוצר מילים 3: עבודה וטכנולוגיה'
  en: 'Word builder 3: work and technology'
story: 'מילים לעבודה, למחשב ולטלפון: כלים, פעולות ותקלות יומיומיות. כל מילה מופיעה במשפט.'
canDo:
- להבין ולהשתמש במילים נפוצות נוספות
- לזהות את המילים במשפטים אמיתיים
vocabulary:
- id: p3-horario
  text: el horario
  translation: לוח זמנים, שעות
  pos: noun
  example:
    text: El horario de la oficina es de nueve a seis.
    translation: שעות המשרד הן מתשע עד שש.
- id: p3-herramienta
  text: la herramienta
  translation: כלי
  pos: noun
  example:
    text: Esta herramienta nos ahorra mucho tiempo.
    translation: הכלי הזה חוסך לנו הרבה זמן.
- id: p3-contrasena
  text: la contraseña
  translation: סיסמה
  pos: noun
  example:
    text: Olvidé la contraseña de mi correo.
    translation: שכחתי את הסיסמה של הדואר שלי.
- id: p3-pantalla
  text: la pantalla
  translation: מסך
  pos: noun
  example:
    text: La pantalla de mi laptop es muy brillante.
    translation: המסך של הלפטופ שלי בהיר מאוד.
- id: p3-teclado
  text: el teclado
  translation: מקלדת
  pos: noun
  example:
    text: Necesito un teclado en español.
    translation: אני צריכה מקלדת בספרדית.
- id: p3-red
  text: la red
  translation: רשת
  pos: noun
  example:
    text: No hay red en este lugar.
    translation: אין רשת במקום הזה.
- id: p3-aplicacion
  text: la aplicación
  translation: אפליקציה
  pos: noun
  example:
    text: Descargué una aplicación nueva para estudiar.
    translation: הורדתי אפליקציה חדשה ללימוד.
- id: p3-actualizacion
  text: la actualización
  translation: עדכון
  pos: noun
  example:
    text: La actualización tarda diez minutos.
    translation: העדכון לוקח עשר דקות.
- id: p3-respaldo
  text: el respaldo
  translation: גיבוי
  pos: noun
  example:
    text: Hago un respaldo de mis archivos cada semana.
    translation: אני עושה גיבוי לקבצים שלי כל שבוע.
- id: p3-plataforma
  text: la plataforma
  translation: פלטפורמה
  pos: noun
  example:
    text: Usamos una plataforma para las clases.
    translation: אנחנו משתמשים בפלטפורמה לשיעורים.
- id: p3-raton
  text: el ratón
  translation: עכבר (מחשב)
  pos: noun
  example:
    text: Mi ratón no funciona bien.
    translation: העכבר שלי לא עובד טוב.
- id: p3-cargador
  text: el cargador
  translation: מטען
  pos: noun
  example:
    text: Olvidé el cargador del celular.
    translation: שכחתי את המטען של הנייד.
- id: p3-descargar
  text: descargar
  translation: להוריד (קובץ)
  pos: verb
  example:
    text: Voy a descargar el archivo ahora.
    translation: אני אוריד את הקובץ עכשיו.
- id: p3-subir
  text: subir
  translation: להעלות
  pos: verb
  example:
    text: Tengo que subir la tarea a la plataforma.
    translation: אני צריכה להעלות את שיעורי הבית לפלטפורמה.
- id: p3-guardar
  text: guardar
  translation: לשמור
  pos: verb
  example:
    text: No olvides guardar el documento.
    translation: אל תשכח לשמור את המסמך.
- id: p3-actualizar
  text: actualizar
  translation: לעדכן
  pos: verb
  example:
    text: Hay que actualizar el programa.
    translation: צריך לעדכן את התוכנה.
- id: p3-instalar
  text: instalar
  translation: להתקין
  pos: verb
  example:
    text: Mateo me ayudó a instalar la aplicación.
    translation: מתאו עזר לי להתקין את האפליקציה.
- id: p3-conectarse
  text: conectarse
  translation: להתחבר
  pos: verb
  example:
    text: Es difícil conectarse desde el tren.
    translation: קשה להתחבר מהרכבת.
- id: p3-borrar
  text: borrar
  translation: למחוק
  pos: verb
  example:
    text: Voy a borrar los mensajes viejos.
    translation: אמחק את ההודעות הישנות.
- id: p3-programar
  text: programar
  translation: לתכנת, לתזמן
  pos: verb
  example:
    text: Mi trabajo es programar aplicaciones.
    translation: העבודה שלי היא לתכנת אפליקציות.
- id: p3-imprimir
  text: imprimir
  translation: להדפיס
  pos: verb
  example:
    text: ¿Puedes imprimir este documento?
    translation: אתה יכול להדפיס את המסמך הזה?
- id: p3-escanear
  text: escanear
  translation: לסרוק
  pos: verb
  example:
    text: Tengo que escanear mi pasaporte.
    translation: אני צריכה לסרוק את הדרכון שלי.
- id: p3-disponible
  text: disponible
  translation: זמין, פנוי
  pos: adjective
  example:
    text: El cliente no está disponible hoy.
    translation: הלקוח לא זמין היום.
- id: p3-lento
  text: lento
  translation: איטי
  pos: adjective
  example:
    text: El internet está muy lento hoy.
    translation: האינטרנט איטי מאוד היום.
- id: p3-compatible
  text: compatible
  translation: תואם
  pos: adjective
  example:
    text: Esta aplicación no es compatible con mi celular.
    translation: האפליקציה הזו לא תואמת לנייד שלי.
