grammar:
- id: decenas
  title:
    he: מספרים 21–100 ו־cuesta / cuestan
    en: Numbers 21–100 and cuesta / cuestan
  explanation: '**עשרות:** treinta (30), cuarenta (40), cincuenta (50), sesenta (60), setenta (70), ochenta (80), noventa (90), **cien** (100).


    **מ־31 ואילך** אומרים עשרות + **y** + יחידה, בשלוש מילים נפרדות: *treinta **y** cinco* (35), *cuarenta **y** dos* (42), *noventa y nueve* (99).

    **21–29** הם מילה אחת, בלי y: *veintiuno, veintidós, veintitrés, veinticuatro, veinticinco* … *veintinueve* (שימו לב לטעם: veintidós, veintitrés, veintiséis).


    **כמה זה עולה?** → **¿Cuánto cuesta?** (דבר אחד) / **¿Cuánto cuestan?** (כמה דברים).

    * ¿Cuánto **cuesta** el libro? **Cuesta** cuarenta pesos.

    * ¿Cuánto **cuestan** los zapatos? **Cuestan** cien pesos.

    (costar הוא פועל ממשפחת o → ue: *cuesta*, *cuestan*, אבל בלי *costa*.)


    **esto** = "זה" כשלא יודעים או לא אומרים את שם הדבר: *¿Cuánto cuesta esto?*'
  examples:
  - text: El libro cuesta cuarenta y cinco pesos.
    translation: הספר עולה ארבעים וחמישה פסו.
  - text: Los zapatos cuestan cien pesos.
    translation: הנעליים עולות מאה פסו.
  - text: ¿Cuánto cuesta esto?
    translation: כמה זה עולה?
