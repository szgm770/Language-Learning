grammar:
- id: querer-gustar
  title:
    he: querer ו־gustar
    en: Querer and gustar
  explanation: '**querer** = "לרצות". הפועל לא רגיל (**e → ie**) ברוב הצורות:


    | כינוי | querer | דוגמה |

    |---|---|---|

    | yo | **quiero** | Quiero un café. |

    | tú | **quieres** | ¿Qué quieres? |

    | él / ella / usted | **quiere** | Ella quiere agua. |

    | nosotros | **queremos** | Queremos la cuenta. |

    | ellos / ustedes | **quieren** | Quieren pescado. |


    **gustar** עובד בכיוון **הפוך** מהעברית "אני אוהב", ודווקא קרוב ל**"זה מוצא חן בעיני"**. מי שאוהב הוא "מי שמוצא חן בעיניו" (me), ומה שאוהבים הוא הנושא:


    * **Me gusta** el café. = הקפה מוצא חן בעיני = אני אוהב קפה.

    * **Me gustan** los huevos. (רבים: gustan)

    * **¿Te gusta** la sopa? = את אוהבת מרק?

    * **Le gusta** el té. = הוא / היא אוהב/ת תה.


    אם אוהבים משהו אחד (או פועל): **gusta**. אם אוהבים כמה דברים: **gustan**. ואם רוצים להגיד "אני מאוד אוהב": **me gusta mucho**.'
  examples:
  - text: Quiero un café con leche, por favor.
    translation: אני רוצה קפה עם חלב, בבקשה.
  - text: Me gusta mucho la sopa.
    translation: אני אוהב מאוד מרק.
  - text: Me gustan los huevos.
    translation: אני אוהב ביצים.
