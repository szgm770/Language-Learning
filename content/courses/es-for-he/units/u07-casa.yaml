grammar:
- id: hay-estar
  title:
    he: 'hay ו־estar: ''יש'' ו''נמצא'''
    en: Hay and estar
  explanation: 'בעברית יש שתי דרכים שונות: **יש** ("יש שולחן במטבח") ו**נמצא** ("השולחן נמצא במטבח"). בספרדית אותו הדבר, והשתיים מתאימות בדיוק:


    * **hay** = **יש**. צורה אחת לכולם, ביחיד וברבים: *Hay una mesa. Hay dos sillas.*

    * **estar** = **נמצא**. מתחבר לדבר מסוים וידוע: *La mesa **está** en la cocina.*


    **estar** בהווה:


    | כינוי | estar |

    |---|---|

    | yo | **estoy** |

    | tú | **estás** |

    | él / ella / usted | **está** |

    | nosotros | **estamos** |

    | ellos / ustedes | **están** |


    * **hay** + דבר *לא* ידוע (un, una, dos…): *Hay una ventana.*

    * **estar** + דבר ידוע (el, la, mi, su…): *La ventana está aquí.*

    * שאלה: **¿Dónde está** el baño? (איפה השירותים?) ו־**¿Hay** un baño? (יש שירותים?)


    **ser** מול **estar:** *ser* = מי / מה הדבר (זהות), *estar* = איפה הוא נמצא ואיך הוא עכשיו. יעל **es** israelí, אבל יעל **está** en México.'
  examples:
  - text: Hay una mezuzá en la puerta.
    translation: יש מזוזה על הדלת.
  - text: ¿Dónde está el baño?
    translation: איפה השירותים?
  - text: La cama está al lado de la ventana.
    translation: המיטה נמצאת ליד החלון.
