id: u13-salud
cefr: A2
scene: health
title:
  he: איך אתה מרגיש?
  en: How are you feeling?
story: 'יעל מתעוררת עם כאב גרון וחום. היא הולכת לרופא ולבית המרקחת, ולומדת לתאר כאב, מחלה והרגשה: me duele la garganta, tengo fiebre, estoy enfermo.'
canDo:
- 'לומר מה כואב: me duele la cabeza, me duelen los ojos'
- 'לתאר הרגשה עם tener: tengo hambre, frío, fiebre'
- לבקש תור ולהבין הוראות רופא
- 'לאחל החלמה: ¡Que te mejores!'
