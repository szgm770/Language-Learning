grammar:
- id: doler-tener
  title:
    he: doler ופתגמי tener
    en: Doler and tener expressions
  explanation: "**doler** = \"לכאוב\". הוא עובד כמו **gustar** (שפגשנו): מי שכואב לו הוא ה־me/te/le, והחלק בגוף הוא הנושא:\n* **Me duele** la cabeza. (כואב לי הראש) — חלק אחד: *duele*\n* **Me duelen** los ojos. (כואבות לי העיניים) — כמה: *duelen*\n* **¿Te duele** la garganta? | **Le duele** la espalda.\n(o → ue, כמו poder: *duele*, *duelen*.)\n\n**tener + שם עצם** — בספרדית **\"יש לי חום\"** (לא \"אני חם\"): \n* **Tengo hambre** (רעב), **sed** (צמא), **frío** (קר), **calor** (חם), **sueño** (ישנוני), **fiebre**, **tos**.\n* בעברית אומרים \"אני רעב\" (תואר), בספרדית \"יש לי רעב\". לכן *לא* אומרים *soy hambre*.\n* עם mucho: **Tengo mucho frío.** (לא muy!)\n\n**estar + תואר** מתאר מצב עכשווי: *Estoy enfermo / cansado.* לעומת **ser** (תכונה קבועה): *Soy alta.*\n**tomar** = לקחת (תרופה) וגם לשתות: *Tomo la medicina dos veces al día.*"
  examples:
  - text: Me duele la garganta y tengo fiebre.
    translation: כואב לי הגרון ויש לי חום.
  - text: ¿Te duelen los ojos?
    translation: כואבות לך העיניים?
  - text: Tengo mucha sed.
    translation: אני מאוד צמא.
