grammar:
- id: preterito-irregular
  title:
    he: עבר לא רגיל
    en: Irregular preterite
  explanation: 'חלק מהפעלים הכי נפוצים הם **לא רגילים** בעבר. כדאי לשנן אותם בבלוק:


    **ser / ir** (שניהם אותה צורה בעבר!): **fui, fuiste, fue, fuimos, fueron**

    * *Fui a Teotihuacán.* (הלכתי = ir) | *Fue un viaje increíble.* (היה = ser). ההקשר מבהיר.


    **hacer:** **hice, hiciste, hizo, hicimos, hicieron** (*hizo* עם z)

    **tener:** **tuve, tuviste, tuvo, tuvimos, tuvieron**

    **estar:** **estuve, estuviste, estuvo, estuvimos, estuvieron**

    **poder:** **pude…** | **venir:** **vine, viniste, vino…** | **decir:** **dije, dijiste, dijo…, dijeron**

    **ver / dar:** **vi, viste, vio, vimos, vieron** | **di, diste, dio, dimos, dieron** (בלי אקסנט!)


    **כללים שעוזרים לזכור:**

    1. הסיומות של אלה **אחרות** מהרגילות: **-e, -iste, -o, -imos, -ieron** (בלי אקסנט).

    2. הגזע משתנה: tener → **tuv-**, estar → **estuv-**, hacer → **hic-**, venir → **vin-**.

    3. אחרי j בגזע (decir → **dij-**) הסיומת ל־ellos היא **-eron** (לא -ieron).


    שאלות: **¿Adónde fuiste?** (לאן הלכת?) | **¿Cómo fue?** (איך היה?) | **¿Qué hiciste?**'
  examples:
  - text: Fui con unos amigos a las pirámides y tuve un día increíble.
    translation: הלכתי עם כמה חברים לפירמידות והיה לי יום מדהים.
  - text: ¿Qué hicieron ayer? Vimos una película.
    translation: מה עשיתם אתמול? ראינו סרט.
  - text: Estuvimos allí tres horas.
    translation: היינו שם שלוש שעות.
