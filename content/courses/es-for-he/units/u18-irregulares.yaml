id: u18-irregulares
cefr: A2
scene: travel
title:
  he: 'הטיול שלי: עבר לא רגיל'
  en: 'My trip: irregular past'
story: 'סוף השבוע הארוך: יעל נסעה עם חברים לפירמידות של טאוטיהואקאן. היא לומדת לספר על הטיול ואת הפעלים הנפוצים בעבר שלא מתנהגים כרגיל: fui, hice, tuve, estuve.'
canDo:
- 'לספר על טיול בעבר: fui, vi, hice, estuve'
- להטות את ser/ir, hacer, tener, estar, ver בעבר
- להבין את ההבדל בין ser ו־ir בעבר (אותה צורה!)
- לשאול ¿Cómo fue? ¿Qué hiciste? ¿Adónde fuiste?
