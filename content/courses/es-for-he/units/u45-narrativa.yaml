grammar:
- id: narrar
  title:
    he: סיפור ותיאור
    en: Narrative and description
  explanation: 'סיפור טוב מאזן בין **רקע** (imperfecto) ל**אירועים** (pretérito) ל**מה שקרה קודם** (pluscuamperfecto).


    **החלוקה:**

    * **Imperfecto** – רקע, תיאור, הרגל: *Llovía y la calle estaba vacía. Yo caminaba despacio.*

    * **Pretérito** – אירוע שנגמר, התקדמות העלילה: *De repente **escuché** un ruido y **me detuve**.*

    * **Pluscuamperfecto** – מה שקרה קודם: *Ya **había oscurecido** cuando llegué.*


    **מחברי סיפור:** *érase una vez* (היה היה) | *de repente* (פתאום) | *en aquel momento* (באותו רגע) | *mientras tanto* (בינתיים) | *al cabo de una hora* (כעבור שעה) | *poco después* (זמן קצר אחרי) | *finalmente / al final*


    **תיאור חי:**

    * *como si* + סובג''ונקטיב בעבר: *Caminaba **como si** flotara.* (כאילו ריחפה)

    * *tan… como*: *Era **tan** silencioso **como** una biblioteca.*

    * מטאפורה: *Sus ojos eran dos faros.* | סימיל: *Corría como el viento.*


    **שימו לב:** שילוב נכון: *Mientras **caminaba** (רקע), **vi** (אירוע) a un hombre.*


    **הערה:** במקסיקו סיפורים בעל־פה פותחים לעיתים ב*"Pues resulta que…"* (אז מסתבר ש…) – אבל בכתיבה ספרותית פותחים ב*érase una vez* או בתיאור סצנה.'
  examples:
  - text: Llovía y la calle estaba vacía. De repente escuché un ruido y me detuve.
    translation: ירד גשם והרחוב היה ריק. פתאום שמעתי רעש ועצרתי.
  - text: Ya había oscurecido cuando llegué. Caminaba como si flotara.
    translation: כבר החשיך כשהגעתי. הלכתי כאילו ריחפתי.
  - text: Al cabo de una hora, poco después de que se fuera la luz, volvió.
    translation: כעבור שעה, זמן קצר אחרי שהאור כבה, היא חזרה.
