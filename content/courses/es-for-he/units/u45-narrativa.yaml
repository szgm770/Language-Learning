  - id: u45-review-12
    type: write
    prompt: 'כתבו סיפור קצר (8–10 משפטים) מתאים לכל קהל: פתחו באווירה (imperfecto: llovía, estaba), הוסיפו אירוע פתאומי (de repente + pretérito), הזכירו משהו שקרה קודם (pluscuamperfecto), השתמשו בדימוי (como si… / tan… como) וסיימו עם מחבר זמן (al cabo de / poco después / al final).'
    minWords: 80
    checks:
    - label: רקע ב־imperfecto (llovía, era, estaba, caminaba, había)
      any:
      - \b(llovia|era|estaba|caminaba|habia|hacia|tenia|veia|queria|sabia|esperaba)\b
    - label: אירוע פתאומי (de repente / en aquel momento + pretérito)
      any:
      - de repente
      - en aquel momento
      - de pronto
    - label: pluscuamperfecto (había + participio)
      any:
      - \bhabia\s+\w+(ado|ido|to|cho)\b
    - label: דימוי (como si… / tan… como…)
      any:
      - como si
      - tan \w+ como
      - como un
      - como una
    - label: מחבר זמן (al cabo de / poco después / mientras tanto / al final)
      any:
      - al cabo de
      - poco despues
      - mientras tanto
      - al final
      - finalmente
    model: Era una tarde de invierno y llovía. La calle estaba vacía y yo caminaba despacio, como si flotara. De repente se apagó la luz y escuché un ruido. En aquel momento recordé que mi madre me había dicho que no saliera sola de noche. Mientras tanto, en una ventana lejana se encendió una vela. Poco después, una mujer abrió la puerta y me sonrió. Su voz era tan cálida como una taza de té. Al final entré, y la noche ya no me dio miedo.
    lexemes: []
