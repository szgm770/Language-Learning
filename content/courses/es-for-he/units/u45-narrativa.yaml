id: u45-narrativa
cefr: C1
scene: free-time
title:
  he: 'לספר סיפור: זמני עבר, תיאור ודימויים'
  en: Storytelling
story: יעל מגישה סיפור קצר לתחרות כתיבה של הקהילה. הדוקטור הררה מסבירה איך להתחיל, איך להחליף קצב ('de repente'), איך לתאר ('como si') ואיך לסיים. יעל מרכיבה את כל זמני העבר בסיפור אחד.
canDo:
- 'לבנות עלילה: פתיחה, התפתחות, שיא, סיום'
- לשלב pretérito, imperfecto ו־pluscuamperfecto בסיפור אחד
- לתאר באמצעות דימויים (como si, tan… como) ושמות תואר חיים
- להשתמש במחברי סיפור (de repente, al cabo de, mientras, poco después)
