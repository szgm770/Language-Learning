    text: 'Era tarde y llovía. La calle estaba vacía; el aire olía a tierra mojada. Caminaba despacio, como si flotara, cuando de repente se apagó la luz.

      En aquel momento recordé que mi madre había dicho: «No salgas sola de noche». Mientras tanto, a lo lejos, una ventana se iluminó.

      Al cabo de unos minutos, alguien abrió la puerta y dijo: «Pasa, te estábamos esperando». Entré sin dudar.

      '
    translation: 'היה מאוחר וירד גשם. הרחוב היה ריק; האוויר הריח מאדמה רטובה. הלכתי לאט, כאילו ריחפתי, כשפתאום האור כבה.

      באותו רגע נזכרתי שאמא שלי אמרה: «אל תצאי לבד בלילה». בינתיים, ממרחק, חלון הואר.

      כעבור כמה דקות מישהו פתח את הדלת ואמר: «היכנסי, חיכינו לך». נכנסתי בלי להסס.

      '
