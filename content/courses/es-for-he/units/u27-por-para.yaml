grammar:
- id: por-para
  title:
    he: por מול para
    en: Por vs. para
  explanation: 'בעברית "בשביל" ו"בגלל" שונות. בספרדית זה בדיוק ההבדל בין **para** ל־**por**.


    **para** – מטרה, כיוון, תאריך יעד, מקבל:

    * **למי?** *Este regalo es **para** Sofía.* (בשביל סופיה)

    * **כדי:** *Estudio **para** aprender.* | *Voy a Guadalajara **para** una reunión.*

    * **עד / לקראת מועד:** *Necesito el informe **para** el viernes.*

    * **לאן:** *Salgo **para** el aeropuerto.*


    **por** – סיבה, דרך, משך, תמורה:

    * **בגלל:** *Llegué tarde **por** el tráfico.* | *Gracias **por** tu ayuda.*

    * **דרך / ליד:** *Caminamos **por** el parque.*

    * **במשך / בתקופה:** *Viajé **por** tres semanas.* | *por la mañana* (בבוקר)

    * **תמורת / במקום:** *Pagué cien pesos **por** el boleto.* | *Cambio este libro **por** otro.*

    * **באמצעות:** *Te llamo **por** teléfono.*


    **כלל אצבע:** שאלו "בשביל מה?" → *para*. שאלו "בגלל מה?" → *por*.

    **ביטויים קבועים:** *por favor, por eso* (בגלל זה), *por fin, por ejemplo, para siempre, ¿para qué?* (בשביל מה?), *¿por qué?* (למה, בגלל מה)


    **הערה:** שימו לב להבדל: *¿Por qué?* (בשתי מילים) = למה; *porque* = כי.'
  examples:
  - text: Compré este regalo para mi hermana, por su cumpleaños.
    translation: קניתי את המתנה הזאת בשביל אחותי, לכבוד יום ההולדת שלה.
  - text: Pagué mil pesos por el boleto.
    translation: שילמתי אלף פזו עבור הכרטיס.
  - text: Necesito el plazo para el lunes.
    translation: אני צריכה את המועד עד יום שני.
