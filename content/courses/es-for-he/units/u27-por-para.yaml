id: u27-por-para
cefr: B1
scene: travel
title:
  he: בשביל או בגלל? por ו־para
  en: Por vs. para
story: 'יעל מתכננת נסיעה עסקית לגוואדלחרה ומתאמת הכול: כרטיסים, מתנות, מועדים. בדרך היא מגלה שבספרדית יש שתי מילים לכל מה שבעברית נקרא ''בשביל'' ו''בגלל''.'
canDo:
- להשתמש ב־para למטרה, ליעד ולמועד אחרון
- להשתמש ב־por לסיבה, למשך זמן, להחלפה ולמעבר דרך מקום
- להבחין בין 'בשביל' (para) ל'בגלל' (por)
- 'להבין ביטויים קבועים: por favor, por eso, para siempre'
