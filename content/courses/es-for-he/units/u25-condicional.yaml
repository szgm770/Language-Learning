grammar:
- id: condicional
  title:
    he: 'תנאי: hablaría'
    en: The conditional
  explanation: '**ה־condicional** נבנה כמו העתיד: **מקור + סיומות**, אבל הסיומות הן של ה־imperfecto של er/ir:


    | כינוי | סיומת | hablar |

    |---|---|---|

    | yo | **-ía** | hablaría |

    | tú | **-ías** | hablarías |

    | él / ella / usted | **-ía** | hablaría |

    | nosotros | **-íamos** | hablaríamos |

    | ellos / ustedes | **-ían** | hablarían |


    **אותם גזעים לא רגילים כמו בעתיד:** *tendría, haría, podría, diría, saldría, vendría, pondría, sabría, querría, habría.*

    (ser הוא רגיל כאן: *sería*; ir: *iría*.)


    **שימושים:**

    1. **בקשה מנומסת:** *¿Podrías ayudarme?* | *Me gustaría una taza de té.*

    2. **עצה:** *Yo en tu lugar descansaría.* | *Deberías hablar con tu jefe.* | *Podrías tomar unas vacaciones.*

    3. **השערה:** *Sería mejor hablar mañana.* | *Con más tiempo, lo haría.*

    4. **עתיד בתוך עבר (דיבור עקיף):** *Dijo que vendría.* (אמר שיבוא)


    **דרכים להציע:** *te aconsejo que…*, *te recomiendo…*, *sería bueno…*, *quizás deberías…*.

    הערה: *deber* ו־*poder* בתנאי (*debería, podría*) הם הנפוצים ביותר לעצות.'
  examples:
  - text: Yo en tu lugar descansaría un poco.
    translation: במקומך הייתי נח קצת.
  - text: ¿Podrías ayudarme con este archivo?
    translation: תוכל לעזור לי עם הקובץ הזה?
  - text: Dijo que vendría a las ocho.
    translation: הוא אמר שיבוא בשמונה.
