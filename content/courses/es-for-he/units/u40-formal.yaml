grammar:
- id: registro-formal
  title:
    he: מכתב רשמי
    en: Formal register
  explanation: 'בעברית מכתב רשמי נפתח ב"לכבוד" ונחתם ב"בכבוד רב". בספרדית יש מבנה קבוע, תמיד ב־**usted**:


    **פתיחה:** *Estimado señor Ramírez:* / *Estimada señora López:* / *A quien corresponda:* (למי שזה נוגע)

    **מטרה:** *Me dirijo a usted para solicitar…* | *Le escribo para informarle que…* | *En relación con su pedido…*

    **בקשה מנומסת:**

    * *Le agradecería que me **enviara** la cotización.* (תנאי + סובג''ונקטיב עבר – עדין מאוד)

    * *Quisiera **solicitar** información sobre…* | *¿Sería posible **adjuntar** la factura?*

    **תלונה בנימוס:** *Lamento informarle que el pedido no llegó. Le solicito que **revise** el caso.*

    **צירוף:** *Adjunto encontrará…* | *Se adjunta la factura.*

    **סיום:** *Quedo a su disposición para cualquier duda.* | *A la espera de su respuesta,* | *Atentamente,* / *Un cordial saludo,* / *Cordialmente,*


    **כללי סגנון:**

    * תמיד **usted**, פנייה בגוף שלישי: *le agradezco* (לא "te agradezco").

    * משפטים ארוכים עם מחברים: *Por lo tanto, le solicito…* | *No obstante…*

    * שמות תואר נימוסיים: *estimado, atento, amable, cordial*


    **הערה:** במקסיקו מקובל להוסיף *Estimado(a) + תואר + שם* ולסיים ב*Atentamente*. פחות מקובל "Cordiales saludos" מאשר בספרד.'
  examples:
  - text: 'Estimado señor Ramírez: Me dirijo a usted para solicitar una cotización.'
    translation: 'אדון רמירז הנכבד: אני פונה אליך כדי לבקש הצעת מחיר.'
  - text: Le agradecería que me enviara la factura. Adjunto encontrará el pedido.
    translation: אודה לך אם תשלח לי את החשבונית. מצורפת ההזמנה.
  - text: Quedo a su disposición. Atentamente, Yael Cohen.
    translation: אני עומדת לרשותך. בכבוד רב, יעל כהן.
