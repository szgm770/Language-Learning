  - id: u40-l4-04
    type: fill_blank
    sentence: Le ___ que me respondiera. (agradecer, תנאי)
    translation: אודה לך אם תענה לי.
    answers:
    - agradecería
    options:
    - agradecería
    - agradezco
    - agradecí
