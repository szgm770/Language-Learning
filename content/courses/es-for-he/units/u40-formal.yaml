  title:
    he: מכתב ללקוח
    en: A letter to a client
  exercises:
  - id: u40-l4-01
    type: reading
    kind: מכתב
    title: Un correo formal
    text: 'Estimado señor Ramírez:

      Me dirijo a usted para solicitar una cotización de los equipos que mencionó en su pedido. Adjunto encontrará la factura anterior.

      Le agradecería que me respondiera antes del viernes, ya que necesitamos confirmar la entrega.

      Quedo a su disposición para cualquier duda.

      Atentamente,

      Yael Cohen

      '
    translation: 'אדון רמירז הנכבד:

      אני פונה אליך כדי לבקש הצעת מחיר לציוד שציינת בהזמנה שלך. מצורפת החשבונית הקודמת.

      אודה לך אם תענה לי לפני יום שישי, מאחר שאנחנו צריכים לאשר את האספקה.

      אני עומדת לרשותך לכל שאלה.

      בכבוד רב,

      יעל כהן

      '
  - id: u40-l4-02
    type: multiple_choice
    prompt: מה יעל מבקשת?
    options:
    - הצעת מחיר
    - חשבונית
    - החזר כסף
    correct: 0
    lexemes:
    - cotizacion
    - factura
  - id: u40-l4-03
    type: multiple_choice
