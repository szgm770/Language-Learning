  - id: u40-review-12
    type: write
    prompt: 'כתבו מכתב רשמי קצר (usted) לחברה או למוסד: פתיחה (Estimado/a…), מטרת הפנייה (me dirijo a usted para… / le escribo para…), בקשה מנומסת (le agradecería que… + סובג''ונקטיב עבר), צירוף מסמך (adjunto), וסיום (quedo a su disposición / atentamente).'
    minWords: 55
    checks:
    - label: פתיחה רשמית (Estimado/a, A quien corresponda)
      any:
      - estimado
      - estimada
      - a quien corresponda
    - label: מטרת הפנייה (me dirijo a usted / le escribo para / solicito)
      any:
      - me dirijo a usted
      - le escribo para
      - solicito
      - quisiera solicitar
    - label: בקשה מנומסת (le agradecería que… / le solicito que…)
      any:
      - le agradeceria que
      - le solicito que
      - le pido que
    - label: צירוף או סיום (adjunto / quedo a su disposición / atentamente)
      any:
      - adjunto
      - se adjunta
      - quedo a su disposicion
      - atentamente
      - un cordial saludo
    model: 'Estimada señora López: Me dirijo a usted para solicitar información sobre el curso de verano. Adjunto encontrará mis datos y mi currículum. Le agradecería que me enviara el horario y el precio antes del lunes, ya que necesito organizar mi viaje. Le agradezco de antemano su atención y su pronta respuesta. Quedo a su disposición para cualquier duda. Atentamente, Yael Cohen.'
    lexemes: []
