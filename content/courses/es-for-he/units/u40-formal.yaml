id: u40-formal
cefr: B2
scene: work
title:
  he: מכתב רשמי ועסקי
  en: Formal writing
story: 'יעל כותבת מכתב רשמי ללקוח חשוב ולמשרד ממשלתי: פנייה בנימוס, בקשה, תלונה, תודה. היא לומדת את הנוסחים הקבועים בספרדית עסקית: ''Estimado señor'', ''me dirijo a usted para…'', ''le agradecería que…'', ''quedo a su disposición''.'
canDo:
- לפתוח ולסיים מכתב רשמי
- לנסח בקשה מנומסת (le agradecería que…, quisiera solicitar)
- לנסח תלונה והסבר בנימוס
- לצרף מסמכים ולבקש אישור
