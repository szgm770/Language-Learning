grammar:
- id: subjuntivo-presente
  title:
    he: סובג'ונקטיב בהווה
    en: Present subjunctive
  explanation: 'בעברית יש משהו דומה: "אני רוצה **שתבוא**" (עתיד) ולא "שאתה בא". בספרדית זה **סובג''ונקטיב**: הפועל השני משנה צורה כשיש רצון, בקשה, תקווה, ספק או הערכה.


    **המבנה:** פועל ראשון (רצון) + **que** + פועל שני בסובג''ונקטיב, וכשיש **שני נושאים שונים**:

    * *Quiero que **estudies**.* (אני רוצה שתלמד) | *Espero que **apruebes**.* (אני מקווה שתעבור)

    * *Necesito que me **ayudes**.* | *Es importante que **repases**.*

    כשיש **נושא אחד** משתמשים במקור: *Quiero estudiar.* (אני רוצה ללמוד)


    **איך יוצרים (הווה):** לוקחים את גוף ראשון יחיד בהווה (yo hablo → habl‑) ומחליפים את התנועה:

    ‑ar → **‑e, ‑es, ‑e, ‑emos, ‑en**: *hable, hables, hable*

    ‑er/‑ir → **‑a, ‑as, ‑a, ‑amos, ‑an**: *coma, comas, coma*


    **לא רגילים:** *ser → sea* | *tener → tenga* | *ir → vaya* | *hacer → haga* | *venir → venga* | *poder → pueda* | *saber → sepa* | *estar → esté*


    **מתי משתמשים:** רצון (*querer que*), בקשה (*pedir que*), תקווה (*esperar que*, *ojalá*), ספק (*dudar que*), רגש (*alegrarse de que*), הערכה (*es importante que*, *es posible que*).

    **ojalá** + סובג''ונקטיב = הלוואי: *Ojalá que sea fácil.*


    **הערה:** אחרי "creo que" משתמשים בהווה רגיל: *Creo que es fácil.* אבל *No creo que **sea** fácil.*'
  examples:
  - text: Quiero que estudies más, Lucía.
    translation: אני רוצה שתלמדי יותר, לוסיה.
  - text: Espero que apruebes el examen. Ojalá que sea fácil.
    translation: אני מקווה שתעברי את המבחן. הלוואי שיהיה קל.
  - text: Es importante que repases los temas.
    translation: חשוב שתחזרי על הנושאים.
