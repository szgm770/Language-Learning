id: u29-subjuntivo
cefr: B1
scene: study
title:
  he: 'אני רוצה ש…: הסובג''ונקטיב הראשון'
  en: First subjunctive
story: 'לוסיה נבחנת בקרוב והכול סביבה מקווים, מבקשים ומאחלים: ''quiero que estudies'', ''espero que apruebes'', ''ojalá que sea fácil''. יעל פוגשת את הסובג''ונקטיב, מצב הרוח של רצון וספק.'
canDo:
- לבקש מאחרים בעזרת quiero que / necesito que / pido que
- 'לבטא תקווה ורצון: espero que, ojalá'
- להשתמש ב־es importante que / es posible que
- לזהות צורות הסובג'ונקטיב בהווה (hable, coma, sea, tenga, vaya)
