- id: u16-l5
  kind: reading
  title:
    he: לוח שנה
    en: A calendar
  exercises:
  - id: u16-l5-01
    type: reading
    kind: לוח
    title: Calendario de fiestas
    text: 'En septiembre u octubre: Rosh Hashaná y Yom Kipur. Después, Sucot.

      En diciembre, normalmente: Janucá. En marzo: Purim. En marzo o abril: Pésaj.

      En cada fiesta celebramos con la familia, comemos juntos y damos gracias. ¡Feliz fiesta!

      '
    translation: 'בספטמבר או באוקטובר: ראש השנה ויום כיפור. אחר כך סוכות.

      בדצמבר, בדרך כלל: חנוכה. במרץ: פורים. במרץ או באפריל: פסח.

      בכל חג אנחנו חוגגים עם המשפחה, אוכלים יחד ומודים. חג שמח!

      '
