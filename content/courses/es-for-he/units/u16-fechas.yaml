grammar:
- id: fechas
  title:
    he: תאריכים ו־¿cuál?
    en: Dates
  explanation: '**תאריך** נאמר כך: **el + מספר + de + חודש (+ de + שנה)**.

    * *Hoy es el quince de marzo.* (היום ה־15 במרץ.)

    * *Mi cumpleaños es el tres de junio.*

    * היום הראשון בחודש הוא היחיד שמשתמש ב**מספר סידורי**: *el primero de enero*. כל השאר משתמשים במספר רגיל: *el dos de enero*.

    * שנה: *dos mil veintiséis* (2026).


    **שאלות:**

    * **¿Cuál es la fecha de hoy?** — מה התאריך היום?

    * **¿Cuándo es tu cumpleaños?** — מתי יום ההולדת שלך?

    * **¿Qué día es hoy?** — איזה יום היום? (יום בשבוע)


    **¿cuál?** משמש לבחירה בין כמה אפשרויות ("איזה?" / "מה?"); **¿qué?** מבקש הגדרה. *¿Cuál es tu número?* | *¿Qué es esto?*

    **חודשים וימי השבוע** נכתבים באות קטנה בספרדית.

    **חגים:** שמות החגים העבריים נכתבים עם אות גדולה: *Pésaj, Rosh Hashaná, Janucá, Purim, Sucot.*

    **אחלות:** *¡Feliz cumpleaños!* | *¡Feliz Pésaj!* | *¡Feliz Janucá!* | *¡Shaná Tová!* (ל־Rosh Hashaná, כרגיל).'
  examples:
  - text: Mi cumpleaños es el tres de junio.
    translation: יום ההולדת שלי בשלישי ביוני.
  - text: Pésaj es en marzo o en abril.
    translation: פסח הוא במרץ או באפריל.
  - text: ¡Feliz Janucá!
    translation: חג חנוכה שמח!
