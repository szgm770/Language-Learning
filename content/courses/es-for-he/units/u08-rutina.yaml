id: u08-rutina
cefr: A1
scene: day
title:
  he: היום שלי
  en: My day
story: 'שבוע בחייה של יעל: עבודה, לימוד ספרדית, הליכה ברחוב, ארוחת ערב. היא לומדת את הפעלים הרגילים שמסתיימים ב־ar, את ימות השבוע, ושמה שבת קודש כבר שם: sábado הוא Shabat.'
canDo:
- לספר מה אני עושה ביום רגיל
- 'להטות פעלים רגילים ב־ar: trabajo, trabajas, trabaja…'
- לומר את ימות השבוע
- לשלול משפט עם no
