    title: El viernes de Yael
    text: 'El viernes llego temprano a la oficina. Trabajo hasta las dos. Después camino a mi casa.

      Por la tarde preparo la cena de Shabat. Por la noche cenamos con la comunidad: hablamos, cantamos y descansamos.

      El sábado no trabajo. El domingo estudio español.

      '
