    scene: תוכנית השבוע.
    lines:
    - speaker: sofia
      text: Yael, ¿trabajas el viernes?
      translation: יעל, את עובדת ביום שישי?
    - speaker: yael
      text: Sí, trabajo hasta las dos. El viernes llego temprano.
      translation: כן, אני עובדת עד שתיים. ביום שישי אני מגיעה מוקדם.
    - speaker: sofia
      text: ¿Y el sábado?
      translation: ובשבת?
    - speaker: yael
      text: El sábado es Shabat. No trabajo. Descanso con mi comunidad.
      translation: שבת היא שבת. אני לא עובדת. אני נחה עם הקהילה שלי.
  - id: u08-l1-02
    type: tip
    title: sábado = שבת
    text: 'המילה הספרדית *sábado* באה מ־*Shabat* (שבת). וגם בשפות רבות אחרות: sabato (איטלקית), samedi (צרפתית). אנחנו מכירים כבר את היום הזה.

