grammar:
- id: ar-presente
  title:
    he: פעלים רגילים ב־ar
    en: Regular -ar verbs
  explanation: 'רוב הפעלים בספרדית מסתיימים ב־**ar**, **er** או **ir**. הפעלים ב־**ar** הם הרגילים והנפוצים ביותר, והם כולם מוטים אותו דבר: מורידים את **ar** ומוסיפים סיומת.


    | כינוי | סיומת | trabajar | hablar |

    |---|---|---|---|

    | yo | **-o** | trabajo | hablo |

    | tú | **-as** | trabajas | hablas |

    | él / ella / usted | **-a** | trabaja | habla |

    | nosotros | **-amos** | trabajamos | hablamos |

    | ellos / ustedes | **-an** | trabajan | hablan |


    מי שמכיר עברית כבר מתרגל: גם בעברית הסיומת מספרת מי עושה (אני עובד**ת**, אנחנו עובד**ים**). לכן אפשר להשמיט את הכינוי: *Trabajo en la oficina.*

    **שלילה:** מניחים **no** לפני הפועל: *No trabajo el sábado.*

    **ימות השבוע** הם זכר ובלי אות גדולה. **el sábado** = "בשבת" ("ביום שבת"). המילה *sábado* באה מ־*Shabat*, ולכן בקורס הזה בשבת לא עובדים ולא עושים תוכניות: זה יום מנוחה.'
  examples:
  - text: Trabajo en la oficina todos los días.
    translation: אני עובדת במשרד כל יום.
  - text: Mateo habla español y un poco de hebreo.
    translation: מתאו מדבר ספרדית וקצת עברית.
  - text: No trabajamos el sábado.
    translation: אנחנו לא עובדים בשבת.
