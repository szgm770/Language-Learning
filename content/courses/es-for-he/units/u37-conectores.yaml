id: u37-conectores
cefr: B2
scene: study
title:
  he: 'אולם, לכן, ובכל זאת: מחברי שיח'
  en: Connectors
story: 'יעל כותבת עבודת סיכום על השנה שלה במקסיקו עבור קורס אונליין. הדוקטור הררה, שמלמדת בקורס, מבקשת שהטקסט יזרום. יעל לומדת מחברים שמארגנים טיעון: además, sin embargo, por lo tanto, a pesar de.'
canDo:
- לחבר רעיונות בעזרת además, también, incluso
- 'להביע ניגוד: sin embargo, en cambio, a pesar de, aunque'
- 'להביע סיבה ותוצאה: por lo tanto, ya que, así que'
- 'לפתוח ולסכם טקסט: en primer lugar, en conclusión'
