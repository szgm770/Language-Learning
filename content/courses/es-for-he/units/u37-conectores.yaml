    kind: חיבור
    title: Mi año en México
    text: 'En primer lugar, aprendí mucho español, ya que lo hablé todos los días. Además, conocí a gente muy amable.

      Sin embargo, no todo fue fácil: al principio extrañaba a mi familia. A pesar de eso, me quedé, y por lo tanto pude terminar mi proyecto.

      En conclusión, sin duda fue la mejor decisión del año.

      '
    translation: 'ראשית, למדתי הרבה ספרדית, מאחר שדיברתי אותה כל יום. בנוסף הכרתי אנשים אדיבים מאוד.

      אולם לא הכול היה קל: בהתחלה התגעגעתי למשפחה. למרות זאת נשארתי, ולכן הצלחתי לסיים את הפרויקט שלי.

      לסיכום, ללא ספק זו הייתה ההחלטה הטובה ביותר של השנה.

      '
