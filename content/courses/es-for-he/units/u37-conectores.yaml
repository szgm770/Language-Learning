      - en cambio
      - a pesar de
      - aun asi
      - no obstante
      - mientras que
    - label: 'סיבה/תוצאה: ya que / dado que / por lo tanto / así que'
      any:
      - ya que
      - dado que
      - por lo tanto
      - asi que
      - puesto que
    - label: 'סיכום: en conclusión / para terminar'
      any:
      - en conclusion
      - para terminar
      - en resumen
      - finalmente
