    prompt: 'כתבו חיבור קצר (4–6 משפטים) על נושא שאתם מכירים (שנה, עבודה, מקום, חוויה). השתמשו בלפחות חמישה מחברים שונים: ראשית (en primer lugar), בנוסף (además), ניגוד (sin embargo / en cambio / a pesar de), סיבה או תוצאה (ya que / por lo tanto), ולסיכום (en conclusión).'
