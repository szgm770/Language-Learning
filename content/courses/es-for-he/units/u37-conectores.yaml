grammar:
- id: conectores
  title:
    he: מחברי שיח
    en: Discourse connectors
  explanation: 'בעברית אנחנו מארגנים טקסט עם "אולם", "לכן", "לעומת זאת". בספרדית:


    **תוספת:** *además* (בנוסף) | *también* | *incluso* (אפילו) | *de hecho* (למעשה)

    * *El curso es útil. **Además**, es barato.*


    **ניגוד:**

    * *sin embargo / no obstante* (אולם, עם זאת) – בתחילת משפט או אחרי פסיק: *Quería ir. **Sin embargo**, estaba cansada.*

    * *en cambio* (לעומת זאת), *mientras que* (בעוד ש): *Yo estudio de noche, **mientras que** él estudia de mañana.*

    * *a pesar de* + שם עצם או מקור (למרות): ***A pesar de** la lluvia, salimos.* | *aunque* (למרות ש) + אינדיקטיב או סובג''ונקטיב.

    * *aun así* (ובכל זאת): *Estaba cansada. **Aun así**, vino.*


    **סיבה ותוצאה:**

    * *ya que / dado que / puesto que* (מאחר ש): *Llegué tarde **ya que** perdí el autobús.*

    * *por lo tanto / así que / por eso* (לכן): *Perdí el autobús, **por lo tanto**, llegué tarde.*


    **מבנה טיעון:** *en primer lugar* (ראשית) → *en segundo lugar* → *además* → *sin embargo* → *en conclusión / para terminar* (לסיכום)

    **הערה:** בדיבור מקסיקני נפוץ *entonces* ו*o sea*. בכתיבה אקדמית משתמשים ב־*por lo tanto*, *no obstante*, *dado que*.'
  examples:
  - text: En primer lugar, el curso es útil; además, es barato. Sin embargo, es difícil.
    translation: ראשית הקורס שימושי; בנוסף הוא זול. אולם הוא קשה.
  - text: A pesar de la lluvia, salimos; por lo tanto, llegamos mojados.
    translation: למרות הגשם יצאנו; לכן הגענו רטובים.
  - text: En conclusión, aprendí mucho, ya que hablé español todos los días.
    translation: לסיכום, למדתי הרבה, מאחר שדיברתי ספרדית כל יום.
