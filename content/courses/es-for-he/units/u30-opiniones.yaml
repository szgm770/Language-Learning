grammar:
- id: opinar
  title:
    he: להביע דעה
    en: Giving opinions
  explanation: 'בעברית "אני חושב ש…" ואחריו הווה רגיל, וגם "אני לא חושב ש…" ואחריו הווה. בספרדית יש הבדל:


    **דעה חיובית – אינדיקטיב:** *Creo que **es** buena idea.* | *Me parece que **tiene** razón.* | *Pienso que **va** a funcionar.*

    **דעה שלילית או ספק – סובג''ונקטיב:** *No creo que **sea** buena idea.* | *No pienso que **tenga** razón.* | *Dudo que **funcione**.*


    **הסכמה:**

    * *Estoy de acuerdo.* | *No estoy de acuerdo con eso.* | *Tienes razón.* | *Es cierto.*

    * **Estar de acuerdo con** (+ אדם או דעה): *Estoy de acuerdo con Mateo.*


    **לנמק ולהשוות:** *Por un lado… por otro lado…* (מצד אחד… מצד שני) | *Sin embargo* (אולם) | *Por eso* (בגלל זה) | *Aunque* (אף על פי ש)


    **הערה:** שאלה "¿Crees que **sea**…?" מתחלפת בין אינדיקטיב לסובג''ונקטיב; במקסיקו נפוץ יותר *¿Crees que **es**…?*. בשלילה, *no creo que* תמיד לוקח סובג''ונקטיב.'
  examples:
  - text: Creo que la biblioteca es una buena idea.
    translation: אני חושבת שהספרייה היא רעיון טוב.
  - text: No creo que sea fácil, pero estoy de acuerdo con el plan.
    translation: אני לא חושבת שזה יהיה קל, אבל אני מסכימה עם התוכנית.
  - text: Por un lado cuesta dinero; por otro lado ayuda a la comunidad.
    translation: מצד אחד זה עולה כסף; מצד שני זה עוזר לקהילה.
