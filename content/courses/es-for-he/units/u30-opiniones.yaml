  title:
    he: בעיתון
    en: In the paper
  exercises:
  - id: u30-l4-01
    type: dialogue
    scene: דון ריקרדו ויעל מסכמים את הכתבה.
    lines:
    - speaker: ricardo
      text: El artículo dice que la biblioteca abre en marzo. ¿Qué piensas?
      translation: הכתבה אומרת שהספרייה נפתחת במרץ. מה את חושבת?
    - speaker: yael
      text: Me parece una buena noticia, pero dudo que abra a tiempo.
      translation: נראה לי חדשות טובות, אבל אני מפקפקת שהיא תיפתח בזמן.
    - speaker: ricardo
      text: Estoy de acuerdo. Ojalá que la comunidad ayude con los libros.
      translation: אני מסכים. הלוואי שהקהילה תעזור עם הספרים.
    - speaker: yael
      text: Puedo escribir un comentario en el periódico. Creo que es importante.
      translation: אני יכולה לכתוב תגובה בעיתון. אני חושבת שזה חשוב.
