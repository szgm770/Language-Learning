id: u30-opiniones
cefr: B1
scene: news
title:
  he: מה דעתך? חדשות, דעות והסכמה
  en: Opinions and news
story: 'בבית של דון ריקרדו, כל ערב קוראים את החדשות המקומיות ומתווכחים בנימוס: על פרויקט הספרייה בשכונה. יעל לומדת להגיד מה היא חושבת, להסכים, לא להסכים ולהסביר.'
canDo:
- 'להביע דעה: creo que, pienso que, me parece que'
- 'להסכים ולא להסכים: estoy de acuerdo, no estoy de acuerdo'
- לשלב סובג'ונקטיב אחרי no creo que
- לקרוא ולסכם כתבה קצרה
