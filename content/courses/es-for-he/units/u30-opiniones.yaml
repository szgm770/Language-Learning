  - id: u30-review-12
    type: write
    prompt: כתבו תגובה קצרה לכתבה על נושא שמעניין אתכם (ספרייה, שכונה, בית ספר, עיר). הביעו דעה (creo que…), הסתייגות (no creo que…), הסכמה או אי־הסכמה (estoy de acuerdo / no estoy de acuerdo), וגם 'מצד אחד… מצד שני'.
    minWords: 40
    checks:
    - label: דעה חיובית (creo que / pienso que / me parece que)
      any:
      - creo que
      - pienso que
      - me parece que
    - label: הסתייגות או ספק (no creo que / dudo que + סובג'ונקטיב)
      any:
      - no creo que
      - no pienso que
      - dudo que
    - label: הסכמה או אי־הסכמה
      any:
      - de acuerdo
      - tengo razon
      - tienes razon
      - es cierto
    - label: מצד אחד… מצד שני, sin embargo או aunque
      any:
      - por un lado
      - por otro
      - sin embargo
      - aunque
      - pero
    model: Leí el artículo sobre la biblioteca de la colonia. Creo que es una buena idea para la comunidad. Por un lado, los niños necesitan libros; por otro lado, cuesta mucho dinero. No creo que sea fácil, pero estoy de acuerdo con el plan. Ojalá que muchos vecinos ayuden.
    lexemes: []
