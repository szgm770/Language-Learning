- id: u30-l5
  kind: reading
  title:
    he: כתבה קצרה
    en: A short article
  exercises:
  - id: u30-l5-01
    type: reading
    kind: כתבה
    title: Nueva biblioteca para la colonia
    text: 'La comunidad de la colonia va a abrir una biblioteca nueva en marzo. Muchas familias creen que es una buena idea, porque los niños necesitan libros.

      Sin embargo, algunos vecinos no creen que sea fácil: cuesta dinero y necesitan voluntarios.

      El director de la escuela dice: «Es importante que todos ayudemos».

      '
    translation: 'קהילת השכונה תפתח ספרייה חדשה במרץ. הרבה משפחות חושבות שזה רעיון טוב כי ילדים צריכים ספרים.

      אולם כמה שכנים לא חושבים שזה יהיה קל: זה עולה כסף וצריך מתנדבים.

      מנהל בית הספר אומר: «חשוב שכולנו נעזור».

      '
  - id: u30-l5-02
    type: multiple_choice
    prompt: מה צריך לספרייה?
    options:
    - כסף ומתנדבים
    - רק ספרים
