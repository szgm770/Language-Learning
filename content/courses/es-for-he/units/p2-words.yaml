id: p2-words
cefr: B1
scene: family
title:
  he: לפני המבחן של לוסיה
  en: Before Lucía's exam
story: 'לוסיה נבחנת מחר, והכול סביבה מרגישים: התרגשות, חשש, גאווה. יעל לומדת לדבר על רגשות ועל אופי, ולתאר את האנשים שהיא כבר מכירה.'
canDo:
- לדבר על רגשות ועל אופי
- לתאר אנשים סביבי
- לספר איך אני מרגישה בעקבות אירוע
vocabulary:
- id: p2-ilusion
  text: la ilusión
  translation: התרגשות, תקווה
  pos: noun
  example:
    text: Tengo mucha ilusión por mi examen.
    translation: יש לי הרבה תקווה בקשר למבחן שלי.
- id: p2-tristeza
  text: la tristeza
  translation: עצב
  pos: noun
  example:
    text: Sentí tristeza cuando se fue mi amiga.
    translation: הרגשתי עצב כשהחברה שלי עזבה.
- id: p2-enojo
  text: el enojo
  translation: כעס
  pos: noun
  example:
    text: Su enojo pasó rápido.
    translation: הכעס שלו עבר מהר.
- id: p2-susto
  text: el susto
  translation: בהלה
  pos: noun
  example:
    text: Me llevé un susto con el trueno.
    translation: נבהלתי מהרעם.
- id: p2-verguenza
  text: la vergüenza
  translation: מבוכה, בושה
  pos: noun
  example:
    text: Qué vergüenza llegar tarde al examen.
    translation: איזו מבוכה להגיע באיחור למבחן.
- id: p2-orgullo
  text: el orgullo
  translation: גאווה
  pos: noun
  example:
    text: Su mamá siente mucho orgullo.
    translation: אמא שלה מרגישה המון גאווה.
- id: p2-confianza
  text: la confianza
  translation: אמון, ביטחון
  pos: noun
  example:
    text: Ten confianza en ti misma.
    translation: תהיי בטוחה בעצמך.
- id: p2-paciencia
  text: la paciencia
  translation: סבלנות
  pos: noun
  example:
    text: Para estudiar necesitas paciencia.
    translation: כדי ללמוד צריך סבלנות.
- id: p2-orgulloso
  text: orgulloso
  translation: גאה
  pos: adjective
  example:
    text: Mi papá está orgulloso de mí.
    translation: אבא שלי גאה בי.
- id: p2-timido
  text: tímido
  translation: ביישן
  pos: adjective
  example:
    text: Mateo es tímido con las personas nuevas.
    translation: מתאו ביישן עם אנשים חדשים.
- id: p2-generoso
  text: generoso
  translation: נדיב
  pos: adjective
  example:
    text: Don Ricardo es muy generoso con los vecinos.
    translation: דון ריקרדו נדיב מאוד כלפי השכנים.
- id: p2-terco
  text: terco
  translation: עקשן
  pos: adjective
  example:
    text: El doctor es terco, pero tiene razón.
    translation: הדוקטור עקשן, אבל הוא צודק.
- id: p2-honesto
  text: honesto
  translation: ישר
  pos: adjective
  example:
    text: Un buen jefe es honesto.
    translation: מנהל טוב הוא ישר.
- id: p2-sincero
  text: sincero
  translation: כן, אמיתי
  pos: adjective
  example:
    text: Sé sincero conmigo, por favor.
    translation: היה כן איתי, בבקשה.
- id: p2-curioso
  text: curioso
  translation: סקרן
  pos: adjective
  example:
    text: Dani es curioso y pregunta todo.
    translation: דני סקרן ושואל הכול.
- id: p2-nervioso
  text: nervioso
  translation: עצבני, לחוץ
  pos: adjective
  example:
    text: Mi hermano está nervioso antes de cada examen.
    translation: אחי לחוץ לפני כל מבחן.
- id: p2-preocupado
  text: preocupado
  translation: מודאג
  pos: adjective
  example:
    text: Mi papá está preocupado por el tráfico.
    translation: אבא שלי מודאג מהפקק.
- id: p2-agradecido
  text: agradecido
  translation: אסיר תודה
  pos: adjective
  example:
    text: Estoy muy agradecido con mis amigos.
    translation: אני אסיר תודה לחברים שלי.
- id: p2-ansioso
  text: ansioso
  translation: חרד, משתוקק
  pos: adjective
  example:
    text: Estoy ansioso por saber el resultado.
    translation: אני משתוקק לדעת את התוצאה.
- id: p2-enojarse
  text: enojarse
  translation: להתכעס
  pos: verb
  example:
    text: No quiero enojarme por una tontería.
    translation: אני לא רוצה להתכעס על שטות.
- id: p2-asustarse
  text: asustarse
  translation: להיבהל
  pos: verb
  example:
    text: Mi hermano suele asustarse con los truenos.
    translation: אחי נוטה להיבהל מרעמים.
- id: p2-emocionarse
  text: emocionarse
  translation: להתרגש
  pos: verb
  example:
    text: Me emociono cuando veo a mi familia.
    translation: אני מתרגשת כשאני רואה את המשפחה שלי.
- id: p2-confiar
  text: confiar
  translation: לבטוח
  pos: verb
  example:
    text: Es importante confiar en los amigos.
    translation: חשוב לבטוח בחברים.
- id: p2-reirse
  text: reírse
  translation: לצחוק
  pos: verb
  example:
    text: Es bueno reírse de uno mismo.
    translation: טוב לצחוק על עצמך.
- id: p2-abrazar
  text: abrazar
  translation: לחבק
  pos: verb
  example:
    text: Quiero abrazar a mi mamá.
    translation: אני רוצה לחבק את אמא שלי.
