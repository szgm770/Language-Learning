id: p2-words
cefr: B1
scene: family
title:
  he: 'הרחבת אוצר מילים 2: רגשות ואופי'
  en: 'Word builder 2: feelings and character'
story: מילים לתיאור רגשות ותכונות אופי, ולשיחה אמיתית על אנשים. כל מילה מופיעה במשפט.
canDo:
- להבין ולהשתמש במילים נפוצות נוספות
- לזהות את המילים במשפטים אמיתיים
vocabulary:
- id: p2-ilusion
  text: la ilusión
  translation: התרגשות, תקווה
  pos: noun
  example:
    text: Me hace mucha ilusión el viaje.
    translation: הנסיעה מאוד מרגשת אותי.
- id: p2-tristeza
  text: la tristeza
  translation: עצב
  pos: noun
  example:
    text: Sus ojos mostraban tristeza.
    translation: עיניו הראו עצב.
- id: p2-enojo
  text: el enojo
  translation: כעס
  pos: noun
  example:
    text: Su enojo desapareció rápido.
    translation: הכעס שלו נעלם מהר.
- id: p2-susto
  text: el susto
  translation: בהלה
  pos: noun
  example:
    text: ¡Qué susto me diste!
    translation: איזו בהלה גרמת לי!
- id: p2-verguenza
  text: la vergüenza
  translation: מבוכה, בושה
  pos: noun
  example:
    text: Me da vergüenza hablar en público.
    translation: אני מתביישת לדבר בפומבי.
- id: p2-orgullo
  text: el orgullo
  translation: גאווה
  pos: noun
  example:
    text: Mis padres sienten orgullo por mí.
    translation: ההורים שלי גאים בי.
- id: p2-confianza
  text: la confianza
  translation: אמון, ביטחון
  pos: noun
  example:
    text: Tengo mucha confianza en mi equipo.
    translation: יש לי הרבה אמון בצוות שלי.
- id: p2-paciencia
  text: la paciencia
  translation: סבלנות
  pos: noun
  example:
    text: Los niños necesitan paciencia.
    translation: ילדים צריכים סבלנות.
- id: p2-orgulloso
  text: orgulloso
  translation: גאה
  pos: adjective
  example:
    text: Mi padre está muy orgulloso de ti.
    translation: אבא שלי מאוד גאה בך.
- id: p2-timido
  text: tímido
  translation: ביישן
  pos: adjective
  example:
    text: Mi hijo es muy tímido con extraños.
    translation: הבן שלי מאוד ביישן עם זרים.
- id: p2-generoso
  text: generoso
  translation: נדיב
  pos: adjective
  example:
    text: Don Ricardo es un hombre generoso.
    translation: דון ריקרדו הוא אדם נדיב.
- id: p2-terco
  text: terco
  translation: עקשן
  pos: adjective
  example:
    text: Mi hermano es muy terco.
    translation: אחי עקשן מאוד.
- id: p2-honesto
  text: honesto
  translation: ישר
  pos: adjective
  example:
    text: Un buen amigo es siempre honesto.
    translation: חבר טוב הוא תמיד ישר.
- id: p2-sincero
  text: sincero
  translation: כן, אמיתי
  pos: adjective
  example:
    text: Quiero ser sincero contigo.
    translation: אני רוצה להיות כנה איתך.
- id: p2-curioso
  text: curioso
  translation: סקרן
  pos: adjective
  example:
    text: El niño es muy curioso y pregunta todo.
    translation: הילד סקרן מאוד ושואל על הכול.
- id: p2-nervioso
  text: nervioso
  translation: עצבני, לחוץ
  pos: adjective
  example:
    text: Estoy nervioso antes del examen.
    translation: אני לחוצה לפני המבחן.
- id: p2-preocupado
  text: preocupado
  translation: מודאג
  pos: adjective
  example:
    text: Mi mamá está preocupado por mí.
    translation: אמא שלי מודאגת בגללי.
- id: p2-agradecido
  text: agradecido
  translation: אסיר תודה
  pos: adjective
  example:
    text: Estoy muy agradecido por tu ayuda.
    translation: אני מאוד אסיר תודה על העזרה שלך.
- id: p2-ansioso
  text: ansioso
  translation: חרד, משתוקק
  pos: adjective
  example:
    text: Está ansioso por saber el resultado.
    translation: הוא משתוקק לדעת את התוצאה.
- id: p2-enojarse
  text: enojarse
  translation: להתכעס
  pos: verb
  example:
    text: No quiero enojarme contigo.
    translation: אני לא רוצה להתכעס עליך.
- id: p2-asustarse
  text: asustarse
  translation: להיבהל
  pos: verb
  example:
    text: El perro va a asustarse con el ruido.
    translation: הכלב ייבהל מהרעש.
- id: p2-emocionarse
  text: emocionarse
  translation: להתרגש
  pos: verb
  example:
    text: Siempre me emociono al ver a mi familia.
    translation: אני תמיד מתרגשת כשאני רואה את המשפחה שלי.
- id: p2-confiar
  text: confiar
  translation: לבטוח
  pos: verb
  example:
    text: Puedes confiar en mí.
    translation: אתה יכול לסמוך עליי.
- id: p2-reirse
  text: reírse
  translation: לצחוק
  pos: verb
  example:
    text: Todos empezaron a reírse.
    translation: כולם התחילו לצחוק.
- id: p2-abrazar
  text: abrazar
  translation: לחבק
  pos: verb
  example:
    text: Quiero abrazar a mi hermano.
    translation: אני רוצה לחבק את אחי.
