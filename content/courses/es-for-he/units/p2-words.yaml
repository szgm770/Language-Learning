    lines:
    - speaker: lucia
      text: Tengo mucha ilusión, pero también un poco de miedo.
      translation: יש לי הרבה תקווה, אבל גם קצת פחד.
    - speaker: yael
      text: Ten confianza, estudiaste muchísimo. Solo falta paciencia.
      translation: תבטחי בעצמך, למדת המון. חסרה רק סבלנות.
    - speaker: carmen
      text: Mañana tu mamá va a sentir orgullo cuando te vea salir.
      translation: מחר אמא שלך תרגיש גאווה כשתראה אותך יוצאת.
    - speaker: lucia
      text: Qué vergüenza si me quedo en blanco…
      translation: איזו מבוכה אם אתקע…
