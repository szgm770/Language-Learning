      translation: הייתי מודאגת, אבל זה הלך טוב. אני אסירת תודה לכולם.
    - speaker: yael
      text: Me emociono de verlas así. Quiero abrazar a tu mamá.
      translation: אני מתרגשת לראות אתכן כך. אני רוצה לחבק את אמא שלך.
    - speaker: lucia
      text: Ya no estoy ansiosa. Ahora solo quiero reírme.
      translation: אני כבר לא חרדה. עכשיו אני רק רוצה לצחוק.
    - speaker: yael
      text: 'Hay que confiar: ya no vas a enojarte ni a asustarte por nada.'
      translation: 'צריך לבטוח: כבר לא תתכעסי ולא תיבהלי משום דבר.'
