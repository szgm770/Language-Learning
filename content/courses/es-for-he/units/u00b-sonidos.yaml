id: u00b-sonidos
cefr: A0
scene: study
title:
  he: הצלילים של הספרדית
  en: The sounds of Spanish
story: בספרדית יש כללי הגייה קבועים. כאן לומדים את הכללים שמבלבלים הכי הרבה דוברי עברית, ומתחילים להבדיל בין צלילים דומים.
canDo:
- לקרוא נכון b, v, c, z, g, j, h, ll, ñ, r ו־rr
- להבדיל בין pero לבין perro
- לקרוא מילה חדשה בקול ולהגות אותה נכון
vocabulary:
- id: s-vowels
  text: a e i o u
  translation: חמש תנועות טהורות וקצרות, כמעט כמו אַ אֶ אִ אוֹ אוּ בעברית. אין תנועות ארוכות או מתחלפות
  pos: noun
  example:
    text: casa, mesa, ropa
    translation: דוגמאות
- id: s-b-v
  text: b / v
  translation: 'שתי האותיות נשמעות אותו דבר: ב'' (כמו בעברית, ולא ו''). *vaca* ו־*baca* נשמעות כמעט זהה'
  pos: noun
  pronunciation: בּ
  example:
    text: vaso, bebé, vino
    translation: דוגמאות
- id: s-c-k
  text: ca co cu / qu
  translation: 'c לפני a, o, u וגם qu לפני e, i: צליל ק'''
  pos: noun
  pronunciation: ק
  example:
    text: casa, queso, quiero
    translation: דוגמאות
- id: s-c-s
  text: ce ci / z
  translation: 'c לפני e, i וכן z: ס'' (באמריקה הלטינית)'
  pos: noun
  pronunciation: ס
  example:
    text: cena, cine, zapato
    translation: דוגמאות
- id: s-g-hard
  text: ga go gu / gue gui
  translation: 'g לפני a, o, u: ג'' קשה. כדי לקבל ג'' לפני e, i כותבים gue, gui (ה־u שקטה)'
  pos: noun
  pronunciation: ג
  example:
    text: gato, gusto, guitarra
    translation: דוגמאות
- id: s-g-j
  text: ge gi / j
  translation: 'g לפני e, i וגם j: ח'' (כמו בעברית, גרונית)'
  pos: noun
  pronunciation: ח
  example:
    text: gente, jugo, jamón
    translation: דוגמאות
- id: s-h-silent
  text: h
  translation: 'h שותקת. מתעלמים ממנה: *hola* נשמעת ''אוֹלָה'''
  pos: noun
  example:
    text: hola, hotel, hermano
    translation: דוגמאות
- id: s-ll-y
  text: ll / y
  translation: 'שתיהן נשמעות כמו י'' או ג'' (באמריקה הלטינית לרוב י''): *llave*, *yo*'
  pos: noun
  pronunciation: י
  example:
    text: llave, yo, calle
    translation: דוגמאות
- id: s-n-tilde
  text: ñ
  translation: 'ני: *año*, *niño*, *mañana*'
  pos: noun
  pronunciation: ני
  example:
    text: año, niño, mañana
    translation: דוגמאות
- id: s-ch
  text: ch
  translation: 'צ'' כמו בעברית: *chocolate*, *mucho*'
  pos: noun
  pronunciation: צ'
  example:
    text: chocolate, mucho, noche
    translation: דוגמאות
- id: s-r-tap
  text: r
  translation: 'ר'' קצרה, נגיעה אחת של הלשון בחך (לא ר'' גרונית כמו בעברית): *pero*, *cara*'
  pos: noun
  pronunciation: ר
  example:
    text: pero, cara, para
    translation: דוגמאות
- id: s-rr
  text: rr / r בתחילת מילה
  translation: 'ר'' מתגלגלת עם מספר נגיעות: *perro*, *carro*, *rojo*. זה הצליל שמבדיל בין *pero* (אבל) ל־*perro* (כלב)'
  pos: noun
  pronunciation: רר
  example:
    text: perro, carro, rojo
    translation: דוגמאות
lessons:
- id: u00b-l1
  kind: new
  title:
    he: תנועות ו־b/v/h
    en: Vowels, b/v and h
  exercises:
  - id: u00b-l1-01
    type: tip
    title: תנועות נקיות
    text: 'בספרדית יש **רק חמש תנועות**, והן תמיד נשמעות אותו דבר: **a** כמו אַ, **e** כמו אֶ, **i** כמו אִי, **o** כמו אוֹ, **u** כמו אוּ.

      אין צורך לנחש כמו באנגלית: *casa* היא תמיד "קָסָה", *mesa* היא תמיד "מֶסָה".

      שתי אותיות מפתיעות: **b ו־v נשמעות אותו דבר** (ב''), ו־**h שותקת**.

      '
  - id: u00b-l1-02
    type: learn
    lexeme: s-vowels
  - id: u00b-l1-03
    type: learn
    lexeme: s-b-v
  - id: u00b-l1-04
    type: learn
    lexeme: s-h-silent
  - id: u00b-l1-05
