- id: u00b-l3
  kind: new
  title:
    he: ll, ñ, ch, r, rr
    en: ll, ñ, ch, r and rr
  exercises:
  - id: u00b-l3-01
    type: tip
    title: הצליל R
    text: '**r** אחת היא **נגיעה קצרה** של קצה הלשון בחך (כמו ה־t הרכה באנגלית *water* בארה"ב). **rr** (וגם r בתחילת מילה) היא **גלגול**.

      הדוברים העבריים שרגילים לר'' גרונית צריכים קצת אימון, אבל גם ר'' גרונית מובנת.

      הבדל במשמעות: **pero** (אבל) ≠ **perro** (כלב).

      '
