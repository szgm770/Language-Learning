- id: u00b-l2
  kind: new
  title:
    he: c, z, qu, g, j
    en: c, z, qu, g and j
  exercises:
  - id: u00b-l2-01
    type: tip
    title: האותיות שמשנות צליל
    text: '**c** ו־**g** משתנות לפי האות שאחריהן:

      - **ca co cu → ק''**, **ce ci → ס''** (וגם **z** = ס'' באמריקה הלטינית).

      - **ga go gu → ג''**, **ge gi → ח''** (וגם **j** = ח'').

      כדי לכתוב ק'' לפני e/i משתמשים ב־**qu** (*queso*), וכדי לכתוב ג'' לפני e/i משתמשים ב־**gu** (*guitarra*). ה־u לא נשמעת.

      '
  - id: u00b-l2-02
    type: learn
    lexeme: s-c-k
