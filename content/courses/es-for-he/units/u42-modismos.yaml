id: u42-modismos
cefr: C1
scene: free-time
title:
  he: '''ahorita'', ''ni modo'', ''echar una mano'': ניבים ומקסיקנית יומיומית'
  en: Idioms and everyday Mexican Spanish
story: 'אחרי שנה, יעל שומעת מקסיקנים אמיתיים: ''ahorita vengo'', ''¡qué padre!'', ''ni modo'', ''me costó un ojo de la cara''. סופיה מלמדת אותה ניבים וביטויים יומיומיים, ואיך להבחין מתי מתאים להשתמש בהם.'
canDo:
- להבין ולהשתמש בביטויים יומיומיים מקסיקניים (ahorita, ni modo, qué padre, platicar)
- להבין ניבים נפוצים (costar un ojo de la cara, echar una mano, meter la pata)
- להבחין בין סגנון רשמי לדיבורי
- להימנע ממילות סלנג שאינן מתאימות
