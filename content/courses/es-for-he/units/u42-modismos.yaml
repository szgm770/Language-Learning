- id: u42-l4
  kind: reading
  title:
    he: שיחה בין חברים
    en: A chat between friends
  exercises:
  - id: u42-l4-01
    type: reading
    kind: שיחה
    title: Entre amigos
    text: '—¿Mande? ¿Qué dijiste?

      —Que ahorita vengo, voy a echarle una mano a Mateo. Metió la pata con un pedido.

      —¡Órale! Ni modo. ¿Costó mucho?

      —Un ojo de la cara. Pero se puso las pilas y lo arregló. ¡Qué padre que somos un buen equipo!

      '
    translation: '—סליחה? מה אמרת?

      —שאני חוזרת עוד רגע, אני הולכת לעזור למתאו. הוא טעה בהזמנה.

      —יאללה! אין מה לעשות. זה עלה הרבה?

