grammar:
- id: modismos-mx
  title:
    he: ניבים ורמת שפה
    en: Idioms and register
  explanation: 'ניבים הם הדבר שהכי קשה לתרגם מילה במילה: "עלה לו עין מהראש" בעברית, **costar un ojo de la cara** בספרדית ("עין מהפנים"). חשוב להבין את המשמעות ולא את המילים.


    **ביטויים מקסיקניים יומיומיים (לא וולגריים):**

    * ***ahorita*** – בדרך כלל "עוד מעט" (גם "ממש עכשיו"): *Ahorita vengo.* (אני באה עוד רגע)

    * ***ni modo*** – אין מה לעשות: *No llegó el pedido. Ni modo.*

    * ***¡Qué padre!*** – איזה יופי! (מקסיקו) | *chido* (נוער) – מתאים בין חברים

    * ***platicar*** – לשוחח (במקום *hablar*): *Vamos a platicar.*

    * ***¿Mande?*** – סליחה? מה? (בנימוס, במקום *¿Qué?*)

    * ***¡Órale!*** – יאללה / וואו


    **ניבים נפוצים:**

    * *echar una mano* – לעזור | *meter la pata* – לעשות טעות מביכה | *costar un ojo de la cara* – לעלות הון

    * *ponerse las pilas* – להתאמץ, להתעורר | *dar lata* – להציק | *estar en las nubes* – להיות בעננים | *tomar el pelo* – לעבוד על מישהו


    **נימוסים:** *con mucho gusto* (בשמחה), *no hay de qué* (אין בעד מה), *a sus órdenes* (לשירותך – בחנויות)


    **רמת שפה (registro):**

    * **רשמי:** *Le agradezco su atención.* | **ידידותי:** *Gracias, qué amable.* | **דיבורי:** *¡Qué padre, gracias!*

    * בעבודה ועם מבוגרים: *usted*, בלי סלנג. עם חברים: *tú* ובדיבורית.


    **הערה:** יש מילות סלנג מקסיקניות פוגעניות או וולגריות; הקורס הזה לא מלמד אותן. אם שומעים מילה לא מוכרת, עדיף לשאול "¿Qué significa?" מאשר לחקות.'
  examples:
  - text: Ahorita vengo. ¿Me echas una mano con esto?
    translation: אני חוזרת עוד רגע. תעזור לי עם זה?
  - text: El viaje me costó un ojo de la cara, pero ni modo, ¡qué padre fue!
    translation: הנסיעה עלתה לי הון, אבל אין מה לעשות, איזה כיף זה היה!
  - text: Metí la pata con el pedido, pero me puse las pilas y lo arreglé.
    translation: טעיתי בהזמנה, אבל התאמצתי ותיקנתי.
