grammar:
- id: tu-usted
  title:
    he: tú ו־usted
    en: Tú and usted
  explanation: 'בספרדית יש **שתי דרכים לומר "אתה/את"**:

    - "**tú** (בלשון נוחה): לחברים, משפחה, ילדים, עמיתים: *¿Cómo te llamas? ¿Cómo estás?*"

    - "**usted** (בלשון מכבדת): למבוגרים שלא מכירים, ללקוחות, לאנשים חשובים: *¿Cómo se llama? ¿Cómo está usted?*"


    בשאלה *¿Cómo estás?* אומרים **tú**, ובשאלה *¿Cómo está usted?* אומרים **usted**. הפועל משתנה: estás ← está.

    לא ניתן לדעת מהעברית איזו צורה לבחור, כי בעברית הלשון אחת. הכלל הפשוט: **כשיש ספק, השתמשו ב־usted**; אנשים יתקנו אתכם ויעברו ל־tú בעצמם.

    באמריקה הלטינית יש רק *ustedes* לרבים ("אתם/אתן"), לא *vosotros* של ספרד.'
  examples:
  - text: ¿Cómo te llamas?
    translation: איך קוראים לך? (tú)
  - text: ¿Cómo se llama usted?
    translation: איך קוראים לך? (usted, מכבד)
  - text: ¿Cómo está usted, señor Ricardo?
    translation: מה שלומך, אדון ריקרדו?
