grammar:
- id: comparativos
  title:
    he: השוואות
    en: Comparisons
  explanation: '**השוואה** בספרדית דומה מאוד לעברית ("יותר… מ־", "פחות… מ־"):


    * **más + תואר + que** — יותר מ־: *El abrigo es **más caro que** la camisa.*

    * **menos + תואר + que** — פחות מ־: *La falda es **menos larga que** el vestido.*

    * **tan + תואר + como** — באותה מידה: *Es **tan bonito como** el rojo.*

    * אותו דבר עם **פעלים ושמות עצם:** *Trabajo **más que** tú.* | *Tengo **menos** ropa **que** ella.*


    **ארבעה מיוחדים** (בלי más):

    | רגיל | יותר |

    |---|---|

    | bueno (טוב) | **mejor** (טוב יותר) |

    | malo (רע) | **peor** (גרוע יותר) |

    | grande (גדול, גיל) | **mayor** (מבוגר יותר) |

    | pequeño / joven | **menor** (צעיר יותר) |


    אומרים **mejor que**: *Este color es mejor que el negro.*

    **סופרלטיב:** אל הצורה המשווה מוסיפים el / la: *el más barato* (הזול ביותר), *la mejor* (הטובה ביותר).

    **צבעים והתאמה:** *rojo* → *roja* (נקבה); *azul, verde* לא משתנים בין זכר לנקבה. תואר בא אחרי שם העצם: *un abrigo negro*, *una falda larga*.'
  examples:
  - text: Los zapatos negros son más baratos que los azules.
    translation: הנעליים השחורות זולות מהכחולות.
  - text: Esta falda es tan larga como esa.
    translation: החצאית הזאת ארוכה כמו ההיא.
  - text: Este abrigo es mejor que el viejo.
    translation: המעיל הזה טוב מהישן.
