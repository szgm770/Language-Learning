id: p4-words
cefr: B2
scene: nature
title:
  he: טיול עם מתאו וסופיה
  en: A trip with Mateo and Sofia
story: 'יום ראשון, יעל יוצאת עם מתאו וסופיה לטיול מחוץ לעיר: הרים, הר געש, מדבר וג''ונגל. היא לומדת לדבר על טבע, מזג אוויר ומסלולים.'
canDo:
- לתאר נופים ותופעות טבע
- לספר על טיול ועל מסלול
- לתאר תנאים ומקומות
vocabulary:
- id: p4-montana
  text: la montaña
  translation: הר
  pos: noun
  example:
    text: Vivimos cerca de una montaña muy alta.
    translation: אנחנו גרים ליד הר גבוה מאוד.
- id: p4-volcan
  text: el volcán
  translation: הר געש
  pos: noun
  example:
    text: El volcán se ve desde mi ventana.
    translation: רואים את הר הגעש מהחלון שלי.
- id: p4-desierto
  text: el desierto
  translation: מדבר
  pos: noun
  example:
    text: En el desierto hace mucho calor.
    translation: במדבר חם מאוד.
- id: p4-selva
  text: la selva
  translation: ג'ונגל
  pos: noun
  example:
    text: La selva tiene muchos animales.
    translation: בג'ונגל יש הרבה חיות.
- id: p4-costa
  text: la costa
  translation: חוף, קו חוף
  pos: noun
  example:
    text: La costa está a tres horas de aquí.
    translation: החוף נמצא במרחק שלוש שעות מכאן.
- id: p4-cueva
  text: la cueva
  translation: מערה
  pos: noun
  example:
    text: Dentro de la cueva hace frío.
    translation: בתוך המערה קר.
- id: p4-neblina
  text: la neblina
  translation: ערפל
  pos: noun
  example:
    text: Hay mucha neblina en la mañana.
    translation: יש הרבה ערפל בבוקר.
- id: p4-trueno
  text: el trueno
  translation: רעם
  pos: noun
  example:
    text: Se oyó un trueno muy fuerte.
    translation: נשמע רעם חזק מאוד.
- id: p4-sequia
  text: la sequía
  translation: בצורת
  pos: noun
  example:
    text: La sequía duró dos años.
    translation: הבצורת נמשכה שנתיים.
- id: p4-inundacion
  text: la inundación
  translation: הצפה
  pos: noun
  example:
    text: La inundación cerró la carretera.
    translation: השיטפון סגר את הכביש.
- id: p4-sendero
  text: el sendero
  translation: שביל
  pos: noun
  example:
    text: Seguimos el sendero entre los árboles.
    translation: הלכנו בשביל בין העצים.
- id: p4-cima
  text: la cima
  translation: פסגה
  pos: noun
  example:
    text: Llegamos a la cima antes del mediodía.
    translation: הגענו לפסגה לפני הצהריים.
- id: p4-escalar
  text: escalar
  translation: לטפס
  pos: verb
  example:
    text: Mateo quiere escalar la montaña.
    translation: מתאו רוצה לטפס על ההר.
- id: p4-explorar
  text: explorar
  translation: לחקור, לטייל
  pos: verb
  example:
    text: Vamos a explorar la cueva.
    translation: אנחנו הולכים לחקור את המערה.
- id: p4-acampar
  text: acampar
  translation: לחנות (בקמפינג)
  pos: verb
  example:
    text: No podemos acampar cerca del río.
    translation: אי אפשר לחנות באוהלים ליד הנהר.
- id: p4-atravesar
  text: atravesar
  translation: לחצות
  pos: verb
  example:
    text: Hay que atravesar el río por el puente.
    translation: צריך לחצות את הנהר דרך הגשר.
- id: p4-orientarse
  text: orientarse
  translation: להתמצא
  pos: verb
  example:
    text: Es difícil orientarse en la selva.
    translation: קשה להתמצא בג'ונגל.
- id: p4-aterrizar
  text: aterrizar
  translation: לנחות
  pos: verb
  example:
    text: El avión va a aterrizar a las cinco.
    translation: המטוס הולך לנחות בחמש.
- id: p4-escarpado
  text: escarpado
  translation: תלול
  pos: adjective
  example:
    text: El camino es escarpado y resbaloso.
    translation: הדרך תלולה וחלקלקה.
- id: p4-arido
  text: árido
  translation: צחיח
  pos: adjective
  example:
    text: La tierra del norte es árida.
    translation: האדמה בצפון צחיחה.
- id: p4-fertil
  text: fértil
  translation: פורה
  pos: adjective
  example:
    text: El valle es fértil y verde.
    translation: העמק פורה וירוק.
- id: p4-humedo
  text: húmedo
  translation: לח
  pos: adjective
  example:
    text: El clima en la costa es húmedo.
    translation: האקלים בחוף לח.
- id: p4-remoto
  text: remoto
  translation: מרוחק
  pos: adjective
  example:
    text: Es un pueblo remoto en la montaña.
    translation: זה כפר מרוחק בהר.
- id: p4-peligroso
  text: peligroso
  translation: מסוכן
  pos: adjective
  example:
    text: Es peligroso caminar de noche.
    translation: מסוכן ללכת בלילה.
