    lines:
    - speaker: mateo
      text: 'Mira la montaña: detrás está el volcán.'
      translation: 'תראי את ההר: מאחוריו נמצא הר הגעש.'
    - speaker: yael
      text: Qué diferente es la costa del desierto y de la selva.
      translation: כמה שונים החוף, המדבר והג'ונגל.
    - speaker: sofia
      text: Hay neblina hoy, y dicen que habrá trueno en la tarde.
      translation: יש ערפל היום, ואומרים שיהיה רעם אחר הצהריים.
    - speaker: mateo
      text: Cerca hay una cueva muy antigua.
      translation: קרוב יש מערה עתיקה מאוד.
