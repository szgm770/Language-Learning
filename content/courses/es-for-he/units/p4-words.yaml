id: p4-words
cefr: B2
scene: nature
title:
  he: 'הרחבת אוצר מילים 4: טבע וטיולים'
  en: 'Word builder 4: nature and travel'
story: 'מילים לנוף, למזג אוויר ולטיולים: הרים, מדבר, שבילים ומה שקורה בדרך. כל מילה מופיעה במשפט.'
canDo:
- להבין ולהשתמש במילים נפוצות נוספות
- לזהות את המילים במשפטים אמיתיים
vocabulary:
- id: p4-montana
  text: la montaña
  translation: הר
  pos: noun
  example:
    text: Vivimos al pie de una montaña muy alta.
    translation: אנחנו גרים למרגלות הר גבוה מאוד.
- id: p4-volcan
  text: el volcán
  translation: הר געש
  pos: noun
  example:
    text: Desde la ciudad se ve el volcán.
    translation: מהעיר רואים את הר הגעש.
- id: p4-desierto
  text: el desierto
  translation: מדבר
  pos: noun
  example:
    text: En el desierto hace mucho calor de día.
    translation: במדבר חם מאוד ביום.
- id: p4-selva
  text: la selva
  translation: ג'ונגל
  pos: noun
  example:
    text: La selva tiene muchísimos animales.
    translation: בג'ונגל יש המון חיות.
- id: p4-costa
  text: la costa
  translation: חוף, קו חוף
  pos: noun
  example:
    text: Viajamos por la costa del Pacífico.
    translation: נסענו לאורך חוף האוקיינוס השקט.
- id: p4-cueva
  text: la cueva
  translation: מערה
  pos: noun
  example:
    text: Entramos a una cueva con linternas.
    translation: נכנסנו למערה עם פנסים.
- id: p4-neblina
  text: la neblina
  translation: ערפל
  pos: noun
  example:
    text: Había mucha neblina en la carretera.
    translation: היה הרבה ערפל בכביש.
- id: p4-trueno
  text: el trueno
  translation: רעם
  pos: noun
  example:
    text: El trueno se escuchó muy fuerte.
    translation: הרעם נשמע חזק מאוד.
- id: p4-sequia
  text: la sequía
  translation: בצורת
  pos: noun
  example:
    text: La sequía afectó a los campos.
    translation: הבצורת פגעה בשדות.
- id: p4-inundacion
  text: la inundación
  translation: הצפה
  pos: noun
  example:
    text: Una inundación cerró varias calles.
    translation: הצפה סגרה כמה רחובות.
- id: p4-sendero
  text: el sendero
  translation: שביל
  pos: noun
  example:
    text: Seguimos el sendero hasta el lago.
    translation: הלכנו בשביל עד האגם.
- id: p4-cima
  text: la cima
  translation: פסגה
  pos: noun
  example:
    text: Llegamos a la cima al amanecer.
    translation: הגענו לפסגה עם עלות השחר.
- id: p4-escalar
  text: escalar
  translation: לטפס
  pos: verb
  example:
    text: Quiero escalar esa montaña algún día.
    translation: אני רוצה לטפס על ההר הזה יום אחד.
- id: p4-explorar
  text: explorar
  translation: לחקור, לטייל
  pos: verb
  example:
    text: Nos gusta explorar lugares nuevos.
    translation: אנחנו אוהבים לחקור מקומות חדשים.
- id: p4-acampar
  text: acampar
  translation: לחנות (בקמפינג)
  pos: verb
  example:
    text: Vamos a acampar cerca del río.
    translation: אנחנו הולכים לחנות ליד הנהר.
- id: p4-atravesar
  text: atravesar
  translation: לחצות
  pos: verb
  example:
    text: Tuvimos que atravesar el desierto en coche.
    translation: היינו צריכים לחצות את המדבר ברכב.
- id: p4-orientarse
  text: orientarse
  translation: להתמצא
  pos: verb
  example:
    text: Es difícil orientarse sin mapa.
    translation: קשה להתמצא בלי מפה.
- id: p4-aterrizar
  text: aterrizar
  translation: לנחות
  pos: verb
  example:
    text: El avión va a aterrizar en diez minutos.
    translation: המטוס הולך לנחות בעוד עשר דקות.
- id: p4-escarpado
  text: escarpado
  translation: תלול
  pos: adjective
  example:
    text: El camino es muy escarpado y peligroso.
    translation: הדרך תלולה מאוד ומסוכנת.
- id: p4-arido
  text: árido
  translation: צחיח
  pos: adjective
  example:
    text: Es una zona árida y casi sin lluvia.
    translation: זה אזור צחיח כמעט בלי גשם.
- id: p4-fertil
  text: fértil
  translation: פורה
  pos: adjective
  example:
    text: Este valle es muy fértil.
    translation: העמק הזה פורה מאוד.
- id: p4-humedo
  text: húmedo
  translation: לח
  pos: adjective
  example:
    text: El clima es cálido y húmedo.
    translation: האקלים חם ולח.
- id: p4-remoto
  text: remoto
  translation: מרוחק
  pos: adjective
  example:
    text: Es un pueblo remoto en la sierra.
    translation: זה כפר מרוחק בהרים.
- id: p4-peligroso
  text: peligroso
  translation: מסוכן
  pos: adjective
  example:
    text: El sendero es peligroso cuando llueve.
    translation: השביל מסוכן כשיורד גשם.
