- id: p4-l3
  kind: new
  title:
    he: איך חוזרים?
    en: How do we get back?
  exercises:
  - id: p4-l3-d1
    type: dialogue
    scene: בדרך חזרה השמיים מתחילים להתכסות עננים.
    lines:
    - speaker: yael
      text: Es un lugar remoto y no sé orientarme sin el mapa.
      translation: זה מקום מרוחק ואני לא יודעת להתמצא בלי המפה.
    - speaker: mateo
      text: El camino es escarpado y peligroso cuando está húmedo.
      translation: הדרך תלולה ומסוכנת כשהיא רטובה.
    - speaker: sofia
      text: La tierra aquí es árida, pero más abajo es fértil.
      translation: האדמה כאן צחיחה, אבל למטה היא פורייה.
    - speaker: yael
      text: Mi avión va a aterrizar el jueves; quiero volver temprano.
      translation: המטוס שלי הולך לנחות ביום חמישי; אני רוצה לחזור מוקדם.
    lexemes: []
  - id: p4-l3-01
    type: learn
    lexeme: p4-orientarse
