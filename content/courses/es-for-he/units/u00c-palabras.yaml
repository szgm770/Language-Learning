id: u00c-palabras
cefr: A0
scene: travel
title:
  he: מילים שאתם כבר מכירים
  en: Words you already know
story: יעל נוחתת במקסיקו. היא מגלה שהיא כבר מבינה הרבה מילים בספרדית, כי הן דומות לעברית ולאנגלית.
canDo:
- לקרוא ולהבין כ־24 מילים בינלאומיות בספרדית
- לדעת מתי להשתמש ב־el ומתי ב־la
- לקרוא סימני הטעמה ופיסוק הפוך (¿ ¡)
vocabulary:
