  exercises:
  - id: u00c-l1-01
    type: dialogue
    scene: יעל נוחתת בשדה התעופה ופוגשת את מתאו.
    lines:
    - speaker: mateo
      text: ¡Hola! ¿Eres Yael?
      translation: שלום! את יעל?
    - speaker: yael
      text: Sí, soy Yael. ¿Tú eres Mateo?
      translation: כן, אני יעל. אתה מתאו?
    - speaker: mateo
      text: Sí. Bienvenida a México. El taxi está allí.
      translation: כן. ברוכה הבאה למקסיקו. המונית שם.
    - speaker: yael
      text: Gracias. ¿El hotel está cerca?
      translation: תודה. המלון קרוב?
  - id: u00c-l1-02
    type: tip
    title: כל שם עצם בא עם el או la
    text: 'בספרדית לכל שם עצם יש **מין**: זכר (**el**) או נקבה (**la**), כמו בעברית. לכן **לומדים כל מילה עם המין שלה**: *el hotel*, *la música*.

      הכלל המועיל: מילים שנגמרות ב־**-o** הן בדרך כלל זכר, וב־**-a** בדרך כלל נקבה. יש יוצאים מן הכלל (*el mapa*, *el día*), ולכן הם מופיעים כאן עם el.

      '
