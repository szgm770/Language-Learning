    title: סימני ההטעמה
    text: 'בספרדית **ההטעמה** נופלת בדרך כלל על ההברה לפני האחרונה (*música* – המוּ, *familia* – המִי). כשהיא נופלת במקום אחר, **כותבים סימן הטעמה (´)**: *café*, *teléfono*, *fútbol*.

      הסימן לא משנה את הצליל של האות, רק מראה איפה מדגישים.

      '
