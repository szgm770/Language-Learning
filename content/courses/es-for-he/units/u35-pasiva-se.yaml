id: u35-pasiva-se
cefr: B2
scene: town
title:
  he: 'נבנה, נמכר, נשכח: סביל ו־se'
  en: Passive and se
story: 'יעל מטיילת עם סופיה במרכז ההיסטורי ומתבוננת בשלטים: ''Se vende'', ''Se habla inglés'', ''Fue construido en 1700''. היא לומדת שבספרדית אומרים ''נמכר'' בשתי דרכים, ושדברים ''נשכחים'' ממנו בלי אשמה: ''Se me olvidó''.'
canDo:
- 'להשתמש בסביל עם ser + participio: fue construido'
- 'להשתמש ב־se סביל ואל־אישי: se vende, se habla'
- להשתמש ב־se me olvidó (אירוע בלתי מכוון)
- לקרוא שלטים ומודעות
