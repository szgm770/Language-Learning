grammar:
- id: pasiva-se
  title:
    he: סביל ו־se
    en: Passive voice and se
  explanation: 'בעברית יש בניין סביל (פּוּעַל, נִפְעַל): "נבנה", "נמכר". בספרדית שתי דרכים:


    **1. סביל עם ser + פרטיציפ** (בכתיבה, חדשות, היסטוריה) – הפרטיציפ מתאים בגזרה ובמספר:

    * *El museo **fue construido** en 1800.* | *Las casas **fueron vendidas**.* | *La carta **fue escrita por** Yael.* (על ידי)


    **2. se סביל / se אל־אישי** (בדיבור, שלטים) – ‏**se + פועל**:

    * *Se vende casa.* (בית למכירה) | *Se venden casas.* | *Se habla español aquí.* | *No se permite fumar.*

    * עם שם עצם רבים: הפועל ברבים (*se venden*). עם אדם כמושא: *Se busca a una persona.*


    **3. se me… (אירוע לא מכוון)** – בעברית "נשכח לי", "נפל לי":

    * *Se me olvidó la llave.* (שכחתי את המפתח) | *Se me cayó el vaso.* (נפל לי הכוס) | *Se nos acabó el tiempo.*

    * אפשר לראות את זה כמו "המפתח נשכח ממני": הנושא הוא הדבר, לא אני.


    **שלטים נפוצים:** *Se prohíbe… | Se requiere… | Se ofrece… | Se alquila | Se vende | Se habla inglés | Cerrado*


    **הערה:** כשיש מבצע ("על ידי") משתמשים בסביל עם ser; כשאין, מעדיפים se.'
  examples:
  - text: El museo fue fundado en el siglo XIX.
    translation: המוזיאון הוקם במאה ה־19.
  - text: Se alquilan cuartos y se habla inglés.
    translation: מושכרים חדרים ומדברים אנגלית.
  - text: Se me olvidó el pasaporte en casa.
    translation: שכחתי את הדרכון בבית.
