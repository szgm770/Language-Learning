id: u43-academico
cefr: C1
scene: study
title:
  he: 'ספרדית אקדמית: ניסוח, שמות פעולה, הסתייגות'
  en: Academic Spanish
story: 'יעל כותבת מאמר קצר לקורס באוניברסיטה בגוואדלחרה: ''Cabe destacar que…'', ''El aumento de…'', ''Se ha demostrado que…''. היא לומדת לנסח בסגנון אקדמי: שמות פעולה, ניסוח עקיף, והסתייגות מדודה.'
canDo:
- להפוך פעלים לשמות פעולה (aumentar → el aumento)
- להשתמש בניסוח אל־אישי (se ha demostrado, cabe señalar)
- לצטט ולהפנות למקורות
- להסתייג בזהירות (parece indicar, podría sugerir)
