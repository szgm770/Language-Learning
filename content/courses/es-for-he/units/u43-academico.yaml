grammar:
- id: academico
  title:
    he: ניסוח אקדמי
    en: Academic style
  explanation: 'בעברית אקדמית אנחנו כותבים "העלייה במחירים", "נמצא כי", "ראוי לציין". בספרדית:


    **שמות פעולה (nominalización) – מעדיפים שם עצם במקום פועל:**

    * *aumentar → **el aumento*** | *disminuir → **la disminución*** | *desarrollar → **el desarrollo*** | *analizar → **el análisis***

    * ***El aumento** de los precios afectó a las familias.* (במקום: *Los precios aumentaron y afectaron…*)


    **ניסוח אל־אישי עם se:**

    * ***Se ha demostrado que** el ejercicio mejora la salud.* | ***Se observa** una disminución.* | ***Se puede concluir que**…*


    **ביטויים אקדמיים קבועים:**

    * *Cabe destacar / señalar que…* (ראוי להדגיש / לציין ש) | *En este sentido,…* (מבחינה זו) | *Según los datos,…* | *Por lo tanto,…* | *En cambio,…*


    **הסתייגות (hedging) – חשוב באקדמיה:**

    * *Parece indicar que…* | *Los resultados sugieren que…* | *Podría explicarse por…* | *Es probable que… + סובג''ונקטיב* | *Tiende a…*

    * במקום "זה כך": *Esto parece indicar que…* או *Es posible que… sea…*


    **ציטוט והפניה:** *Según García (2020),… | De acuerdo con el estudio,… | Como señala la fuente,…*


    **הערה:** האקדמיה מעדיפה משפטים ארוכים עם מחברים, אבל משפט אחד שמעביר רעיון אחד טוב יותר ממשפט ארוך ומבולבל.'
  examples:
  - text: Cabe destacar que el aumento de los precios afectó a las familias.
    translation: ראוי להדגיש שהעלייה במחירים השפיעה על המשפחות.
  - text: Se ha demostrado que el estudio constante mejora los resultados.
    translation: הוכח שלימוד עקבי משפר את התוצאות.
  - text: Los datos parecen indicar que el factor principal es el tiempo.
    translation: הנתונים נראים כמצביעים על כך שהגורם העיקרי הוא הזמן.
