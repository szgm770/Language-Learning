scene: town
title:
  he: 'בעיר: איך מגיעים?'
  en: In the city
story: יום שישי בבוקר. יעל יוצאת לבית הכנסת ולחנות כשרה, ואין לה מפה. היא לומדת לשאול איך מגיעים, להבין הוראות, ולהגיד לאן היא הולכת. בסוף היחידה מחכה מבחן הרמה של A1.
canDo:
