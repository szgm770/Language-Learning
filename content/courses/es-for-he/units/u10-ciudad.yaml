- id: u10-l5
  kind: reading
  title:
    he: ביום שישי בעיר
    en: Friday in the city
  exercises:
  - id: u10-l5-01
    type: reading
    kind: סיפור
    title: Un viernes en la ciudad
    text: 'Hoy es viernes. Yael va a la oficina temprano y trabaja hasta las dos.

      Después va a la tienda kosher: camina cinco minutos, cruza la plaza y dobla a la derecha.

      Compra pan y pescado para la cena de Shabat. Por la tarde va a la sinagoga con Doña Carmen.

      '
    translation: 'היום יום שישי. יעל הולכת למשרד מוקדם ועובדת עד שתיים.

      אחר כך היא הולכת לחנות הכשרה: הולכת חמש דקות, חוצה את הכיכר ופונה ימינה.

      היא קונה לחם ודג לסעודת שבת. אחר הצהריים היא הולכת לבית הכנסת עם דוניה כרמן.

      '
