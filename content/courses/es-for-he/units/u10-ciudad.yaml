grammar:
- id: ir-presente
  title:
    he: הפועל ir והמילית a
    en: The verb ir and a
  explanation: '**ir** = "ללכת / לנסוע". הוא פועל חריג לגמרי, וצריך לשנן אותו:


    | כינוי | ir |

    |---|---|

    | yo | **voy** |

    | tú | **vas** |

    | él / ella / usted | **va** |

    | nosotros | **vamos** |

    | ellos / ustedes | **van** |


    אחרי ir אומרים **a** ("ל־"): *Voy **a** la sinagoga.*

    כש־a פוגש את **el**, הם מתחברים ל־**al**: *Voy **al** mercado* (לא a el mercado). ל־la, los, las לא קורה כלום: *a la calle, a los museos.*


    **כיוונים:** *a la derecha* (ימינה), *a la izquierda* (שמאלה), *todo recto* (ישר). פעלים שימושיים: **doblar** (לפנות), **cruzar** (לחצות), **caminar**.

    **איך מגיעים?** → **¿Cómo llego a la sinagoga?** ("llego" מ־llegar).


    **ir a + פועל** פירושו ''עומד ל־'': *Voy a comer* (אני הולך לאכול, או: אני אוכל בקרוב).'
  examples:
  - text: Voy a la sinagoga el viernes por la noche.
    translation: אני הולכת לבית הכנסת בליל שישי.
  - text: Cruzas la calle y doblas a la derecha.
    translation: חוצים את הרחוב ופונים ימינה.
  - text: Vamos al mercado.
    translation: אנחנו הולכים לשוק.
