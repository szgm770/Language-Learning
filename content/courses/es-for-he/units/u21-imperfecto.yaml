    lines:
    - speaker: carmen
      text: Yael, cuéntanos de tu infancia. ¿Dónde vivías?
      translation: יעל, ספרי לנו על הילדות שלך. איפה גרת?
    - speaker: yael
      text: Vivía en una ciudad pequeña en Israel. Mi escuela estaba cerca de mi casa y íbamos a pie.
      translation: גרתי בעיר קטנה בישראל. בית הספר היה קרוב לבית והלכנו ברגל.
    - speaker: carmen
      text: ¿Y qué hacían en el recreo?
      translation: ומה עשיתם בהפסקה?
    - speaker: yael
      text: Jugábamos y cantábamos. Mis abuelos siempre me contaban cuentos.
      translation: שיחקנו ושרנו. הסבים שלי תמיד סיפרו לי סיפורים.
