id: u21-imperfecto
cefr: B1
scene: family
title:
  he: כשהייתי קטן
  en: When I was little
story: 'ערב שבת בבית של דוניה כרמן. כולם מספרים על הילדות שלהם, ויעל לומדת את זמן העבר השני: ה־imperfecto, שמתאר מה היה רגיל ומה היה מסביב. בעברית אנחנו אומרים ''הייתי הולך'', ובספרדית זה בדיוק ה־imperfecto: iba.'
canDo:
- 'לספר על הילדות: Cuando era niña, vivía en…'
- להשתמש ב־imperfecto להרגלים ולתיאורים בעבר
- להטות -ar, -er, -ir ואת שלושת החריגים ser, ir, ver
- 'להשתמש במילות הרגל: siempre, a menudo, cada día, de niño'
