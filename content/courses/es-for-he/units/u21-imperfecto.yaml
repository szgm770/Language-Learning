      any:
      - aba\b
      - abas\b
      - aban\b
      - abamos\b
    - label: השתמשתם ב־imperfecto של -er/-ir (…ía/…ían)
      any:
      - ia\b
      - ias\b
      - ian\b
      - iamos\b
    - label: השתמשתם במילת הרגל (siempre, a menudo, cada, de niño, antes)
      any:
      - \bsiempre\b
      - \ba menudo\b
      - \bcada\b
      - \bde nin
      - \bantes\b
      - \btodos los dias\b
    - label: הזכרתם אדם מהמשפחה או חבר
      any:
      - \babuel
      - \bpadre
      - \bmadre
      - \bhermano
      - \bhermana
      - \bamig
      - \bvecin
      - \bfamilia
    model: Cuando era niña, vivía en un pueblo pequeño. Mi familia era muy unida y siempre comíamos juntos los viernes. Mi abuela cocinaba pan y yo la ayudaba. Después íbamos a la sinagoga con mis hermanos. Era una vida tranquila y yo era muy feliz.
    lexemes: []
