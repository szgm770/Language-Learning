    he: סיפורי ילדות
    en: Childhood stories
  exercises:
  - id: u21-l4-01
    type: dialogue
    scene: דני וסופיה מספרים.
    lines:
    - speaker: dani
      text: Cuando era niño, mi familia vivía en Puebla. Mis abuelos tenían un jardín enorme.
      translation: כשהייתי ילד משפחתי גרה בפואבלה. לסבים שלי הייתה גינה ענקית.
    - speaker: sofia
      text: 'Yo era muy diferente: vivía en la ciudad y no tenía jardín. Pero jugaba mucho con mis vecinos.'
      translation: 'אני הייתי שונה מאוד: גרתי בעיר ולא הייתה לי גינה. אבל שיחקתי הרבה עם השכנים.'
    - speaker: dani
      text: ¿Qué hacían en el recreo?
      translation: מה עשיתם בהפסקה?
    - speaker: sofia
      text: Cantábamos y contábamos cuentos. Era muy divertido.
      translation: שרנו וסיפרנו סיפורים. היה מאוד כיף.
