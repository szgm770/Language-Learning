grammar:
- id: imperfecto
  title:
    he: 'imperfecto: מה היה רגיל'
    en: The imperfect
  explanation: 'ה־**imperfecto** מתאר **רקע, הרגל ותיאור** בעבר, ולא אירוע בודד שנגמר. בעברית נשמע לנו מוכר: "הייתי הולך לבית הספר ברגל", "היה חם ושמשי".


    | כינוי | -ar (jugar) | -er / -ir (comer, vivir) |

    |---|---|---|

    | yo | jug**aba** | com**ía** / viv**ía** |

    | tú | jug**abas** | com**ías** / viv**ías** |

    | él / ella / usted | jug**aba** | com**ía** / viv**ía** |

    | nosotros | jug**ábamos** | com**íamos** / viv**íamos** |

    | ellos / ustedes | jug**aban** | com**ían** / viv**ían** |


    **רק שלושה חריגים בכל השפה:**

    * **ser:** era, eras, era, éramos, eran

    * **ir:** iba, ibas, iba, íbamos, iban

    * **ver:** veía, veías, veía, veíamos, veían


    **מילים שמעידות על imperfecto:** *siempre, a menudo, cada día, todos los días, de niño, antes, entonces, mientras.*

    **דוגמאות:** *De niña vivía en un pueblo pequeño.* (תיאור) | *Cada viernes mi abuela cocinaba.* (הרגל) | *Hacía frío y llovía.* (רקע)

    **לעומת pretérito:** *Ayer fui al parque* (פעם אחת, נגמר) מול *Antes iba al parque cada día* (הרגל).

    שימו לב: בעברית נאמר "הייתי הולך" גם לעבר רגיל וגם ל"פעם הייתי…". זה הרמז שלך ל־imperfecto.'
  examples:
  - text: Cuando era niña, vivía en un pueblo pequeño.
    translation: כשהייתי ילדה גרתי בעיירה קטנה.
  - text: Mi abuela siempre cantaba mientras cocinaba.
    translation: סבתא שלי תמיד שרה בזמן שבישלה.
  - text: Íbamos a la escuela a pie.
    translation: הלכנו לבית הספר ברגל.
