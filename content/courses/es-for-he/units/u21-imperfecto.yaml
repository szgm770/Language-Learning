- id: u21-l5
  kind: reading
  title:
    he: זיכרון מהילדות
    en: A childhood memory
  exercises:
  - id: u21-l5-01
    type: reading
    kind: זיכרון
    title: Mi viernes favorito
    text: 'Cuando yo era niña, el viernes era mi día favorito. Mi abuela se levantaba temprano y preparaba pan y sopa. Mi abuelo ponía la mesa con flores.

      Nosotros llegábamos a su casa antes de la noche. Toda la familia cantaba y contaba cuentos. Yo me sentía muy feliz.

      Hoy extraño esos viernes.

      '
    translation: 'כשהייתי ילדה, יום שישי היה היום האהוב עליי. סבתא שלי קמה מוקדם והכינה לחם ומרק. סבא שלי ערך את השולחן עם פרחים.

      אנחנו הגענו לבית שלהם לפני הלילה. כל המשפחה שרה וסיפרה סיפורים. הרגשתי מאושרת מאוד.

      היום אני מתגעגעת לימי שישי האלה.

      '
