grammar:
- id: futuro
  title:
    he: עתיד פשוט
    en: The simple future
  explanation: '**העתיד הפשוט** בנוי מ**מקור + סיומות** (בכל שלוש קבוצות הפעלים אותן סיומות):


    | כינוי | סיומת | hablar |

    |---|---|---|

    | yo | **-é** | hablaré |

    | tú | **-ás** | hablarás |

    | él / ella / usted | **-á** | hablará |

    | nosotros | **-emos** | hablaremos |

    | ellos / ustedes | **-án** | hablarán |


    **אין צורך להסיר שום דבר:** עוטפים את המקור כמו שהוא.


    **גזעים לא רגילים** (הסיומות זהות): tener → **tendr-é**, hacer → **har-é**, poder → **podr-é**, decir → **dir-é**, salir → **saldr-é**, venir → **vendr-é**, poner → **pondr-é**, saber → **sabr-é**, querer → **querr-é**, haber → **habr-á** (יהיה).


    **מתי עתיד פשוט ומתי ir a?**

    * *ir a + מקור* — תוכנית קרובה, רצון: *Voy a comer.*

    * עתיד פשוט — הבטחה, חיזוי, החלטה רשמית: *Te llamaré mañana.* | *Mañana lloverá.*

    * **הסקה:** עתיד פשוט גם מבטא ניחוש בהווה: *¿Dónde estará Mateo?* (איפה הוא כבר? / אני תוהה). *Estará en una reunión.*


    **מילות עתיד:** *mañana, la próxima semana, el año que viene, dentro de dos meses, algún día.*'
  examples:
  - text: El año que viene tendré más responsabilidades.
    translation: בשנה הבאה יהיו לי יותר אחריות.
  - text: Te prometo que te llamaré mañana.
    translation: אני מבטיח לך שאתקשר מחר.
  - text: ¿Dónde estará mi cartera? Seguramente estará en casa.
    translation: איפה הארנק שלי? בוודאי בבית.
