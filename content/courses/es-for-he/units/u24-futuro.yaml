id: u24-futuro
cefr: B1
scene: work
title:
  he: מה יהיה?
  en: The future
story: 'סוף שנה. יעל מתכננת את השנה הבאה: פרויקט חדש, טיול משפחתי, שיעורי ספרדית מתקדמים. היא לומדת את העתיד הפשוט (hablaré), הבטחות, חיזויים והסקות.'
canDo:
- 'להשתמש בעתיד הפשוט: hablaré, comerás, vivirán'
- 'לשנן את הפעלים הנפוצים עם גזע לא רגיל: tendré, haré, podré, diré, saldré'
- 'להבטיח, לחזות ולהסיק: Mañana lloverá. ¿Dónde estará?'
- להבדיל בין ir a + מקור לבין עתיד פשוט
