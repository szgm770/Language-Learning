id: u22-contraste
cefr: B1
scene: day
title:
  he: 'סיפור: מה קרה ומה היה מסביב'
  en: Telling a story
story: 'יעל מספרת לצוות על בוקר מוזר: ירד גשם, היא איחרה לאוטובוס ומצאה ארנק על המדרכה. עכשיו היא צריכה לשלב את שני זמני העבר: מה היה ברקע (imperfecto) ומה קרה (pretérito).'
canDo:
- לספר סיפור שלם בעבר עם שני הזמנים
- להבחין בין אירוע (pretérito) לרקע (imperfecto)
- להשתמש ב־de repente, un día, mientras, cuando
- 'להבין פעלים שמשנים משמעות: saber, conocer, querer, poder'
