- id: u22-l5
  kind: reading
  title:
    he: הסיפור המלא
    en: The full story
  exercises:
  - id: u22-l5-01
    type: reading
    kind: סיפור
    title: La cartera en la acera
    text: 'Era una mañana lluviosa y yo caminaba a la estación. Hacía mucho frío y no había mucha gente en la calle.

      De repente vi una cartera en la acera. La recogí, busqué un documento y llamé al dueño. Él estaba muy asustado porque la cartera tenía todo su dinero.

      Media hora después llegó, me dio las gracias y quiso darme un regalo. Yo no quise aceptar, pero me sentí muy contenta.

      '
    translation: 'זה היה בוקר גשום ואני הלכתי לתחנה. היה קר מאוד ולא היו הרבה אנשים ברחוב.

      פתאום ראיתי ארנק על המדרכה. הרמתי אותו, חיפשתי תעודה והתקשרתי לבעלים. הוא היה מפוחד מאוד כי בארנק היה כל הכסף שלו.

      חצי שעה אחר כך הוא הגיע, הודה לי ורצה לתת לי מתנה. אני לא הסכמתי לקבל, אבל הרגשתי שמחה מאוד.

      '
