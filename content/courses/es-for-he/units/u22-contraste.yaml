grammar:
- id: contraste
  title:
    he: pretérito או imperfecto?
    en: Preterite vs imperfect
  explanation: 'בעברית יש זמן עבר אחד, אז זה החלק הקשה ביותר. הנה שאלת מפתח:


    > **האם זה אירוע שהתחיל ונגמר (נקודה בציר הזמן), או רקע / הרגל / תיאור (קו)?**


    | **pretérito** (אירוע) | **imperfecto** (רקע) |

    |---|---|

    | פעולה שנגמרה: *Vi una cartera.* | תיאור: *Llovía y hacía frío.* |

    | אירוע אחד / סדר אירועים: *Llegué, abrí, entré.* | הרגל: *Siempre tomaba el autobús.* |

    | פעולה פתאומית: *De repente, oí un ruido.* | פעולה ברקע בזמן שקרה משהו: *Caminaba cuando vi un perro.* |

    | זמן מוגדר: *Ayer, el lunes, a las ocho* | זמן לא מוגדר: *Antes, entonces, mientras* |


    **סיפור טיפוסי:** רקע ב־imperfecto, אירועים ב־pretérito: *Llovía (רקע) y yo caminaba (רקע) cuando de repente vi (אירוע) una cartera. La recogí (אירוע) y llamé (אירוע) a la policía.*


    **פעלים שמשנים משמעות:**

    * **saber:** *sabía* = ידעתי | *supe* = גיליתי

    * **conocer:** *conocía* = הכרתי (כבר) | *conocí* = פגשתי לראשונה

    * **querer:** *quería* = רציתי | *quise* = ניסיתי; *no quise* = סירבתי

    * **poder:** *podía* = יכולתי | *pude* = הצלחתי'
  examples:
  - text: Llovía mucho cuando salí de casa.
    translation: ירד גשם חזק כשיצאתי מהבית.
  - text: Encontré una cartera en la acera y llamé al dueño.
    translation: מצאתי ארנק על המדרכה והתקשרתי לבעלים.
  - text: No sabía nada, pero ayer supe la verdad.
    translation: לא ידעתי כלום, אבל אתמול גיליתי את האמת.
