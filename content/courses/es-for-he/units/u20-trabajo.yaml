id: u20-trabajo
cefr: A2
scene: work
title:
  he: עבודה ומה אני עושה עכשיו
  en: Work and right now
story: חודש אחרי ההגעה, יעל מדברת בשיחת וידאו עם חברה, וחברים חדשים שואלים על עבודתה. היא לומדת מקצועות, לדבר על מה שקורה עכשיו עם estar + gerundio ולהשוות ser ו־estar. בסוף היחידה מחכה מבחן הרמה של A2.
canDo:
- לדבר על מקצוע וכל מה שקשור לעבודה
- 'לתאר מה קורה עכשיו: estoy trabajando'
- לבחור בין ser ל־estar בביטחון
- 'לשאול ולענות על העבודה: ¿en qué trabajas?'
