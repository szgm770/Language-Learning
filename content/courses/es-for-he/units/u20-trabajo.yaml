grammar:
- id: estar-gerundio
  title:
    he: estar + gerundio, ו־ser מול estar
    en: The progressive and ser vs estar
  explanation: '**מה אני עושה עכשיו?** בעברית: "אני עובד" (גם עכשיו וגם בדרך כלל). בספרדית אפשר לחדד: **estar + gerundio**.

    * גזע של ar + **-ando**: hablar → **hablando**, trabajar → **trabajando**

    * גזע של er / ir + **-iendo**: comer → **comiendo**, escribir → **escribiendo**

    * חריגים: leer → **leyendo**, dormir → **durmiendo**, decir → **diciendo**, ir → **yendo**.

    * *Estoy trabajando.* | *¿Qué estás haciendo?* | *Está escribiendo un correo.* | *Estamos esperando.*

    **Present simple** מספר עובדה והרגל: *Trabajo en una empresa.* **Estar + gerundio** מדגיש "ממש עכשיו": *Ahora mismo estoy trabajando.*


    **ser או estar?** סיכום:

    | ser | estar |

    |---|---|

    | מי / מה: *Soy ingeniera.* | איפה: *Estoy en la oficina.* |

    | תכונה קבועה: *Es simpático.* | מצב / הרגשה: *Está ocupado.* |

    | מוצא, שעה, תאריך: *Soy de Israel. Son las dos.* | פעולה עכשווית: *Estoy leyendo.* |

    | מקצוע: *Mateo es gerente.* | תוצאה: *La puerta está abierta.* |

    זכרו: **ser** = מי שאני, **estar** = איפה ואיך אני עכשיו.'
  examples:
  - text: Soy programadora, pero ahora estoy hablando con un cliente.
    translation: אני מתכנתת, אבל עכשיו אני מדברת עם לקוח.
  - text: Mateo es gerente y está muy ocupado.
    translation: מתאו הוא מנהל והוא עסוק מאוד.
  - text: ¿Qué estás haciendo? Estoy escribiendo un informe.
    translation: מה אתה עושה? אני כותב דוח.
