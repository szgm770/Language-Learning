grammar:
- id: pronombres-objeto
  title:
    he: כינויי מושא
    en: Object pronouns
  explanation: 'בעברית "אותו / אותה" ו"לו / לה" מתחברים לפועל ("שלחתי אותו", "נתתי לו"). בספרדית יש שתי קבוצות:


    **מושא ישיר** (מה / מי שפועלים עליו): **lo** (אותו, זכר), **la** (אותה), **los** (אותם), **las** (אותן)

    * *¿Enviaste el informe? Sí, **lo** envié.* | *¿Viste a Ana? Sí, **la** vi.*


    **מושא עקיף** (למי): **me** (לי), **te** (לך), **le** (לו / לה / לך-בנימוס), **nos** (לנו), **les** (להם / לכם)

    * *Mateo **me** dio el archivo.* | *Le escribí un correo a doña Carmen.*


    **מיקום:** הכינוי בא **לפני הפועל המוטה**: *Lo tengo.* אבל נצמד ל**מקור** או ל**gerundio**: *Quiero revisarlo.* | *Estoy escribiéndolo.* (ואפשר גם: *Lo quiero revisar.*)

    **בשלילה:** *No lo envié.* (no לפני הכינוי)


    **שני כינויים ביחד:** קודם עקיף ואחר כך ישיר (**me lo, te lo, nos lo**): *¿Me enviaste el archivo? Sí, **te lo** envié.*

    כש־le/les פוגשים lo/la/los/las, הם נהפכים ל־**se**: *Le entregué el contrato.* → *Se lo entregué.* (מסרתי לו אותו)


    **הערה:** את המושא הישיר שהוא אדם מוסיפים "a": *Vi **a** Mateo.* (לא *vi Mateo*)'
  examples:
  - text: El contrato es urgente. Voy a firmarlo hoy.
    translation: החוזה דחוף. אני הולך לחתום עליו היום.
  - text: ¿Le diste el paquete a Dani? Sí, se lo di ayer.
    translation: נתת לדני את החבילה? כן, נתתי לו אותה אתמול.
  - text: Mi jefe me envió un mensaje y yo lo contesté.
    translation: הבוס שלי שלח לי הודעה ואני עניתי לה.
