id: u26-pronombres
cefr: B1
scene: work
title:
  he: 'אותו, לו, לי: כינויי מושא'
  en: Object pronouns
story: 'שבוע של מסירות במשרד: מסמכים, חבילות, חוזים. יעל לומדת להחליף שמות עצם בכינויים (lo, la, le, me) כדי לא לחזור על עצמה, ואת הצירוף המסובך se lo.'
canDo:
- 'להחליף מושא ישיר בכינוי: lo, la, los, las'
- 'להחליף מושא עקיף: me, te, le, nos, les'
- 'לשים את הכינוי נכון: לפני הפועל או בסוף המקור'
- להבין את se lo / se la ('לו את זה')
