grammar:
- id: tener-presente
  title:
    he: הפועל tener ואיך אומרים גיל
    en: The verb tener and age
  explanation: '**tener** פירושו "יש ל־" ("להחזיק"). הוא פועל חשוב מאוד, והוא **לא רגיל**:


    | כינוי | tener | דוגמה |

    |---|---|---|

    | yo | **tengo** | Tengo un teléfono. |

    | tú | **tienes** | ¿Tienes veinte años? |

    | él / ella / usted | **tiene** | Ella tiene diecinueve años. |

    | nosotros | **tenemos** | Tenemos tiempo. |

    | ellos / ustedes | **tienen** | Ellos tienen dos teléfonos. |


    **גיל:** בעברית אומרים "אני בן 19" (*להיות*). בספרדית אומרים "**יש לי** 19 שנים": **Tengo diecinueve años.**

    לכן *לא* אומרים "soy diecinueve". השאלה: **¿Cuántos años tienes?**

    שימו לב: *año* ב־**ñ** (לא *ano*, שזו מילה אחרת ולא מנומסת).'
  examples:
  - text: Dani tiene diecinueve años.
    translation: דני בן תשע־עשרה.
  - text: ¿Cuántos años tienes?
    translation: בן כמה אתה?
  - text: Tengo veinte años.
    translation: אני בן עשרים.
