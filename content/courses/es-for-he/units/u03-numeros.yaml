title:
  he: מספרים וגיל
  en: Numbers and age
story: בסוף היום הראשון מחליפים מספרי טלפון. יעל לומדת לספור עד עשרים, לומדת מה גילם של דני ולוסיה, ופוגשת את הפועל tener.
