title:
  he: מאיפה את?
  en: Where are you from?
story: 'יעל פוגשת את סופיה ואת מתאו בהפסקה. הם מספרים מאיפה הם, ויעל לומדת את הפועל החשוב ביותר בספרדית: ser.'
canDo:
- 'להציג את עצמי: אני יעל, אני ישראלית'
- לשאול ולענות מאיפה אתם
- להתאים תואר לזכר או לנקבה (mexicano / mexicana)
- להשתמש בכינויי גוף yo, tú, él, ella, nosotros, ellos
