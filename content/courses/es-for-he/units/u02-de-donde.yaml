grammar:
- id: ser-present
  title:
    he: הפועל ser
    en: The verb ser
  explanation: '**ser** פירושו "להיות" וממנו אומרים **מי אתם ומאיפה**: שם, מוצא, מקצוע, זהות.

    בעברית לא אומרים "הוא" בהווה ("אני ישראלית"), אבל בספרדית **חייבים פועל**:


    | כינוי | ser | דוגמה |

    |---|---|---|

    | yo | **soy** | Yo soy Yael. |

    | tú | **eres** | Tú eres Mateo. |

    | él / ella / usted | **es** | Ella es mexicana. |

    | nosotros | **somos** | Somos colegas. |

    | ellos / ustedes | **son** | Ellos son españoles. |


    הכינוי (*yo*, *tú*) **לא חובה**, כי הסיומת מספרת מי מדבר: *Soy israelí.*

    תארים מתאימים למין: **-o** לזכר, **-a** לנקבה: *mexicano / mexicana*. תארים שנגמרים ב־**-í** או ב־**-e** (*israelí*, *estudiante*) אינם משתנים.'
  examples:
  - text: Soy israelí, soy de Israel.
    translation: אני ישראלית (ישראלי), אני מישראל.
  - text: Mateo es mexicano y Sofía es mexicana.
    translation: מתאו מקסיקני וסופיה מקסיקנית.
  - text: Nosotros somos estudiantes.
    translation: אנחנו סטודנטים.
