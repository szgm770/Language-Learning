id: u28-imperativo
cefr: B1
scene: health
title:
  he: 'קדימה, בואו, אל תדאגו: ציווי'
  en: Commands (imperative)
story: 'דני עייף מדי אחרי שבוע עבודה, והדוקטור הררה נותן הוראות: ''descansa'', ''toma agua'', ''no trabajes tanto''. יעל לומדת לתת הוראות, בקשות ואזהרות, בנימוס (usted) ובחברות (tú).'
canDo:
- 'לתת הוראה לחבר (tú): habla, come, escribe'
- 'לתת הוראה בנימוס (usted): hable, coma, escriba'
- 'לצוות על פעלים לא רגילים: ven, sal, pon, haz, di, ten, ve'
- 'לצוות בשלילה: no hables, no comas'
