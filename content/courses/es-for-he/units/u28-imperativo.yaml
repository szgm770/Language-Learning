grammar:
- id: imperativo
  title:
    he: ציווי
    en: Imperative
  explanation: 'בעברית ציווי הוא צורה נפרדת: "דבר!", "אכלי!". בספרדית:


    **tú (חיובי):** כמו גוף שלישי יחיד בהווה: *hablar → **habla**, comer → **come**, escribir → **escribe***

    **usted (חיובי ושלילי):** הסיומת ההפוכה: ‑ar → **‑e**, ‑er/‑ir → **‑a**: *Hable más despacio. | Coma algo. | Escriba aquí.*

    **שלילה (tú):** *no* + הסיומת ההפוכה + ‑s: *No hables tan rápido. | No comas eso. | No escribas.*


    **שמונה פעלים לא רגילים (tú, חיובי) – כדאי לזכור:**

    *ve* (ir) | *ven* (venir) | *sal* (salir) | *pon* (poner) | *haz* (hacer) | *di* (decir) | *ten* (tener) | *sé* (ser)

    * *Ven aquí. | Sal ahora. | Pon la mesa. | Haz la tarea. | Di la verdad. | Ten cuidado. | Sé amable.*


    **כינויים:** בציווי חיובי הכינוי **נצמד** לסוף ("sentarse" → *siéntate*), ובשלילי הוא **בא לפני**: *Dímelo.* (תגיד לי אותו) | *No me lo digas.* (אל תגיד לי אותו)

    בציווי חיובי ההטעמה נשמרת, ולכן מופיע סימן הטעמה: *dime → dímelo*


    **הערה:** בספרדית מקסיקנית מקובל להוסיף *por favor* ו"¿Me puedes…?" כדי לרכך את הציווי. בלי זה זה נשמע חד.'
  examples:
  - text: Siéntate y descansa un poco.
    translation: שב ונוח קצת.
  - text: No trabajes tanto. Ten cuidado con tu salud.
    translation: אל תעבוד כל כך הרבה. תיזהר עם הבריאות שלך.
  - text: Señor Dani, tome agua y respire despacio.
    translation: אדון דני, שתה מים ונשום לאט.
