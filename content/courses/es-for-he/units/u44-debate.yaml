id: u44-debate
cefr: C1
scene: study
title:
  he: 'לא רק… אלא גם: וויכוח וטיעון'
  en: Debate and argument
story: 'בכיתה אונליין מתקיים דיון על החלפת העבודה מהבית בעבודה במשרד. יעל מנסה להשתתף: ''Si bien es cierto que…'', ''No solo… sino también…'', ''Tienes parte de razón, pero…''. היא לומדת לטעון, להסתייג ולהתנגד בנימוס ובביטחון.'
canDo:
- 'להציג עמדה ולנמק: en mi opinión, desde mi punto de vista'
- 'להסכים חלקית ולמתן: si bien, tienes parte de razón, me gustaría matizar'
- 'להשתמש במבנים רטוריים: no solo… sino también, cuanto más… más, ya sea… o'
- 'להתנגד בנימוס: no estoy convencida de que + סובג''ונקטיב'
