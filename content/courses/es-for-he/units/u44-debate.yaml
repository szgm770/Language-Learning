grammar:
- id: argumentar
  title:
    he: טיעון ווויכוח
    en: Argumentation
  explanation: 'בעברית אנחנו אומרים "לדעתי", "אמנם… אך", "לא רק… אלא גם". בספרדית:


    **להציג עמדה:** *En mi opinión,…* | *Desde mi punto de vista,…* | *Estoy a favor / en contra de…*

    **להסכים חלקית ולמתן:**

    * ***Si bien** es cierto que + אינדיקטיב, + טענה נגדית*: ***Si bien** es cierto que ahorra tiempo, también aísla.*

    * *Tienes **parte de razón**, pero…* | *Me gustaría **matizar**…* (ללמתן, לדייק) | *Hasta cierto punto,…* (עד גבול מסוים)

    **ספק ושלילת תוקף (+ סובג''ונקטיב):** *No estoy convencida de que **sea** mejor.* | *No creo que **tenga** razón.* | *Dudo que **funcione**.*

    **מבנים רטוריים:**

    * ***no solo… sino también***: *No solo ahorra dinero, **sino también** tiempo.*

    * ***cuanto más… más / menos***: ***Cuanto más** practico, **más** aprendo.*

    * ***ya sea… o***: *Ya sea en casa o en la oficina, hay que concentrarse.*

    * *mientras que / en cambio / por el contrario* (לעומת זאת)

    **סיכום:** *En definitiva,…* (בסופו של דבר) | *Por todo ello,…* (בשל כל אלה) | *En resumen,…*


    **נימוס בוויכוח:** *Entiendo tu postura, pero…* | *Respeto tu opinión, aunque…* | *¿No crees que…?*


    **הערה:** בוויכוח תרבותי, פתחו בהסכמה חלקית לפני שאתם מתנגדים: זה נשמע חכם ומכבד יותר.'
  examples:
  - text: Si bien es cierto que trabajar desde casa ahorra tiempo, no estoy convencida de que sea mejor para todos.
    translation: אמנם עבודה מהבית חוסכת זמן, אך אני לא משוכנעת שזה טוב יותר לכולם.
  - text: No solo ahorra tiempo, sino también dinero.
    translation: זה חוסך לא רק זמן אלא גם כסף.
  - text: Cuanto más practico, más aprendo.
    translation: ככל שאני מתרגלת יותר, אני לומדת יותר.
