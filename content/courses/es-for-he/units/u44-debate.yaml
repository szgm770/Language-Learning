    kind: מאמר
    title: 'Trabajo en casa: ¿sí o no?'
    text: 'En mi opinión, trabajar desde casa tiene ventajas y desventajas. Si bien es cierto que ahorra tiempo, no estoy convencida de que sea mejor para todos.

      No solo se pierde el contacto con los compañeros, sino también la rutina. Cuanto más tiempo se trabaja sola, más difícil es separar el trabajo de la vida personal.

      En definitiva, ya sea en casa o en la oficina, lo importante es la organización.

      '
    translation: 'לדעתי, לעבוד מהבית יש יתרונות וחסרונות. אמנם זה חוסך זמן, אך אני לא משוכנעת שזה טוב יותר לכולם.

      לא רק שאובד הקשר עם העמיתים, אלא גם השגרה. ככל שעובדים יותר זמן לבד, קשה יותר להפריד בין עבודה לחיים אישיים.

      בסופו של דבר, בין אם בבית ובין אם במשרד, החשוב הוא ארגון.

      '
