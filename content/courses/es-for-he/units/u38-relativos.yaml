id: u38-relativos
cefr: B2
scene: home
title:
  he: 'האדם שאיתו, הדבר ש…: משפטי זיקה'
  en: Relative clauses
story: 'יעל מתארת לאמא בטלפון את החיים החדשים: ''La señora que vive abajo'', ''el restaurante donde comemos'', ''lo que más me gusta es…'', ''mi amigo cuya madre es de Oaxaca''. היא לומדת לחבר משפטים ארוכים ולהסביר מי ומה.'
canDo:
- לחבר משפטים עם que, quien, donde
- להשתמש ב־el que / la que / lo que
- להשתמש ב־cuyo (ששלו)
- להבחין בין זיקה מגדירה לתוספת (עם פסיקים)
