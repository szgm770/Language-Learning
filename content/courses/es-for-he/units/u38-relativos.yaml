grammar:
- id: relativos
  title:
    he: משפטי זיקה
    en: Relative clauses
  explanation: 'בעברית "ש" אחת מחברת הכול: "האישה שגרה למטה", "הספר שקראתי". בספרדית יש כמה מילות זיקה:


    **que** (הנפוץ ביותר – אדם, דבר, מקום): *La vecina **que** vive abajo es amable.* | *El libro **que** leí es bueno.*

    **quien / quienes** (אדם, אחרי מילית יחס או עם פסיק): *El amigo con **quien** hablé es de Oaxaca.* | *Mateo, **quien** trabaja conmigo, es mi amigo.*

    **el que / la que / los que / las que** (אחרי מילית יחס, או "זה ש…"): *La casa en **la que** vivo es vieja.* | ***El que** llega primero gana.*

    **lo que** (מה ש…, בלי שם עצם): ***Lo que** más me gusta es el mercado.* | *No entiendo **lo que** dices.* | ***Lo mejor** es esperar.*

    **donde** (מקום): *El restaurante **donde** comemos es kosher.*

    **cuyo / cuya / cuyos / cuyas** (ששלו – מתאים לדבר הנושא): *Mi amigo, **cuya** madre es de Oaxaca, canta bien.*


    **זיקה מגדירה / מוסיפה:**

    * בלי פסיק: מגדירה (*Los vecinos que viven abajo…* – רק אלה שגרים למטה)

    * עם פסיק: מוסיפה (*Los vecinos, que viven abajo, …* – כל השכנים, ואגב הם גרים למטה)


    **הערה:** אחרי מילית יחס אי אפשר "que" לבד: ✗ *la casa en que vivo* (נפוץ בכתיבה, אבל הצורה התקנית: *en la que / donde*).'
  examples:
  - text: La señora que vive abajo es doña Carmen, con quien hablo mucho.
    translation: האישה שגרה למטה היא דונה כרמן, שאיתה אני מדברת הרבה.
  - text: Lo que más me gusta del barrio es el mercado donde compro fruta.
    translation: מה שהכי אוהבת בשכונה זה השוק שבו אני קונה פירות.
  - text: Mi amigo, cuya madre es de Oaxaca, cocina muy bien.
    translation: החבר שלי, שאמא שלו מאואחאקה, מבשל מצוין.
