- id: u38-l4
  kind: reading
  title:
    he: תיאור השכונה
    en: Describing the neighbourhood
  exercises:
  - id: u38-l4-01
    type: reading
    kind: תיאור
    title: Mi barrio
    text: 'Vivo en un barrio tranquilo donde casi todos se conocen. La señora que vive abajo es doña Carmen, con quien hablo todos los días.

      Lo que más me gusta es el mercado donde compro fruta fresca. Don Ricardo, cuya casa está cerca, siempre me saluda.

      La cafetería en la que desayuno tiene la mejor limonada de la ciudad.

      '
