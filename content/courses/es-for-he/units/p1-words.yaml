    type: dialogue
    scene: יום שישי בבוקר. יעל מכינה את הדירה לשבת ודני בא לעזור.
    lines:
    - speaker: yael
      text: 'Hoy es viernes y hay mucho que hacer: primero voy a ordenar la sala.'
      translation: 'היום יום שישי ויש הרבה מה לעשות: קודם אסדר את הסלון.'
    - speaker: dani
      text: Yo paso a recoger el pan y luego te ayudo a colgar la ropa.
      translation: אני אעבור לאסוף את הלחם ואחר כך אעזור לך לתלות את הכביסה.
    - speaker: yael
      text: Gracias. El técnico viene a reparar la lámpara, y tengo que enchufar la plancha.
      translation: תודה. הטכנאי בא לתקן את המנורה, ואני צריכה לחבר את המגהץ.
    - speaker: dani
      text: Con este sol la ropa se va a secar rápido.
      translation: עם השמש הזאת הכביסה תתייבש מהר.
    lexemes: []
