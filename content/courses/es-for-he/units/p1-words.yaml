id: p1-words
cefr: B1
scene: home
title:
  he: 'הרחבת אוצר מילים 1: חיי יומיום בבית'
  en: 'Word builder 1: daily life'
story: 'מילים שימושיות לבית, לעיר ולשגרה: חפצים, מקומות ופעולות קטנות. כל מילה מופיעה במשפט, ואחר כך מתרגלים אותה.'
canDo:
- להבין ולהשתמש במילים נפוצות נוספות
- לזהות את המילים במשפטים אמיתיים
vocabulary:
- id: p1-llave
  text: la llave
  translation: מפתח
  pos: noun
  example:
    text: ¿Dónde dejé la llave?
    translation: איפה השארתי את המפתח?
- id: p1-espejo
  text: el espejo
  translation: מראה
  pos: noun
  example:
    text: Me miro en el espejo cada mañana.
    translation: אני מסתכלת במראה כל בוקר.
- id: p1-basura
  text: la basura
  translation: זבל
  pos: noun
  example:
    text: Saco la basura por la noche.
    translation: אני מוציאה את הזבל בלילה.
- id: p1-cepillo
  text: el cepillo
  translation: מברשת
  pos: noun
  example:
    text: Uso un cepillo de dientes suave.
    translation: אני משתמשת במברשת שיניים רכה.
- id: p1-toalla
  text: la toalla
  translation: מגבת
  pos: noun
  example:
    text: Necesito una toalla limpia.
    translation: אני צריכה מגבת נקייה.
- id: p1-jabon
  text: el jabón
  translation: סבון
  pos: noun
  example:
    text: Lávate las manos con jabón y agua.
    translation: תרחץ ידיים בסבון ובמים.
- id: p1-regadera
  text: la regadera
  translation: מקלחת (מקסיקו)
  pos: noun
  example:
    text: Me gusta la regadera con agua tibia.
    translation: אני אוהבת מקלחת עם מים פושרים.
- id: p1-propina
  text: la propina
  translation: טיפ
  pos: noun
  example:
    text: Dejamos una propina al mesero.
    translation: השארנו טיפ למלצר.
- id: p1-fila
  text: la fila
  translation: תור, שורה
  pos: noun
  example:
    text: Hay una fila larga en el banco.
    translation: יש תור ארוך בבנק.
- id: p1-llanta
  text: la llanta
  translation: צמיג
  pos: noun
  example:
    text: Una llanta del coche está ponchada.
    translation: צמיג אחד של המכונית מפונצ'ר.
- id: p1-ascensor
  text: el ascensor
  translation: מעלית
  pos: noun
  example:
    text: El ascensor está descompuesto.
    translation: המעלית מקולקלת.
- id: p1-escalera
  text: la escalera
  translation: מדרגות, סולם
  pos: noun
  example:
    text: Subo por la escalera porque es rápido.
    translation: אני עולה במדרגות כי זה מהיר.
- id: p1-almohada
  text: la almohada
  translation: כרית
  pos: noun
  example:
    text: Prefiero una almohada suave.
    translation: אני מעדיפה כרית רכה.
- id: p1-cobija
  text: la cobija
  translation: שמיכה
  pos: noun
  example:
    text: Hace frío; trae otra cobija.
    translation: קר; תביא עוד שמיכה.
- id: p1-lavar
  text: lavar
  translation: לשטוף, לכבס
  pos: verb
  example:
    text: Hoy voy a lavar la ropa.
    translation: היום אכבס את הבגדים.
- id: p1-barrer
  text: barrer
  translation: לטאטא
  pos: verb
  example:
    text: Mi hermano barre el piso cada viernes.
    translation: אחי מטאטא את הרצפה כל יום שישי.
- id: p1-planchar
  text: planchar
  translation: לגהץ
  pos: verb
  example:
    text: Siempre plancho la camisa antes de salir.
    translation: אני תמיד מגהצת את החולצה לפני שיוצאים.
- id: p1-ordenar
  text: ordenar
  translation: לסדר
  pos: verb
  example:
    text: Voy a ordenar mi cuarto hoy.
    translation: אסדר את החדר שלי היום.
- id: p1-tirar
  text: tirar
  translation: לזרוק
  pos: verb
  example:
    text: No debes tirar papeles en la calle.
    translation: אסור לזרוק ניירות ברחוב.
- id: p1-enchufar
  text: enchufar
  translation: לחבר לחשמל
  pos: verb
  example:
    text: Tienes que enchufar el cargador.
    translation: אתה צריך לחבר את המטען לחשמל.
- id: p1-reparar
  text: reparar
  translation: לתקן
  pos: verb
  example:
    text: El técnico va a reparar la lavadora.
    translation: הטכנאי הולך לתקן את מכונת הכביסה.
- id: p1-recoger
  text: recoger
  translation: לאסוף
  pos: verb
  example:
    text: Paso a recoger a mi hija a las tres.
    translation: אני עוברת לאסוף את הבת שלי בשלוש.
- id: p1-colgar
  text: colgar
  translation: לתלות
  pos: verb
  example:
    text: Voy a colgar la ropa en el patio.
    translation: אתלה את הכביסה בחצר.
- id: p1-secar
  text: secar
  translation: לייבש
  pos: verb
  example:
    text: Uso la secadora para secar la ropa.
    translation: אני משתמשת במייבש כדי לייבש את הכביסה.
