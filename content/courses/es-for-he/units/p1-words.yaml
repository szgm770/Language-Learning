    lines:
    - speaker: yael
      text: Doña Carmen, perdí la llave de mi departamento.
      translation: דוניה כרמן, איבדתי את מפתח הדירה שלי.
    - speaker: carmen
      text: No te preocupes, mija. El portero la encontró junto a la basura.
      translation: אל תדאגי, מיחה. השוער מצא אותו ליד הזבל.
    - speaker: yael
      text: ¡Qué alivio! Le voy a dar una propina.
      translation: איזה הקלה! אתן לו טיפ.
    - speaker: carmen
      text: Ve a bañarte, que traes mucho polvo.
      translation: לכי להתרחץ, את מלאה אבק.
