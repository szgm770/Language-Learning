id: p1-words
cefr: B1
scene: home
title:
  he: הבניין של דוניה כרמן
  en: Doña Carmen's building
story: 'שגרה בבניין של דוניה כרמן: מפתח שאבד, מעלית שמתקלקלת, ובוקר יום שישי של הכנות לפני השבת. יעל לומדת את המילים של הבית ושל החיים סביבו.'
canDo:
- לדבר על חפצים ועל מקומות בבית ובבניין
- לתאר תקלות ולבקש תיקון
- לספר על ניקיון והכנות לשבת
vocabulary:
- id: p1-llave
  text: la llave
  translation: מפתח
  pos: noun
  example:
    text: Perdí la llave del departamento.
    translation: איבדתי את מפתח הדירה.
- id: p1-espejo
  text: el espejo
  translation: מראה
  pos: noun
  example:
    text: Hay un espejo grande en el baño.
    translation: יש מראה גדולה בחדר האמבטיה.
- id: p1-basura
  text: la basura
  translation: זבל
  pos: noun
  example:
    text: El portero saca la basura por la mañana.
    translation: השוער מוציא את הזבל בבוקר.
- id: p1-cepillo
  text: el cepillo
  translation: מברשת
  pos: noun
  example:
    text: Compré un cepillo nuevo para el cabello.
    translation: קניתי מברשת חדשה לשיער.
- id: p1-toalla
  text: la toalla
  translation: מגבת
  pos: noun
  example:
    text: Dejé mi toalla en el baño.
    translation: השארתי את המגבת שלי בחדר האמבטיה.
- id: p1-jabon
  text: el jabón
  translation: סבון
  pos: noun
  example:
    text: Este jabón huele muy bien.
    translation: הסבון הזה מריח טוב מאוד.
- id: p1-regadera
  text: la regadera
  translation: מקלחת (מקסיקו)
  pos: noun
  example:
    text: La regadera de mi departamento tiene agua caliente.
    translation: במקלחת של הדירה שלי יש מים חמים.
- id: p1-propina
  text: la propina
  translation: טיפ
  pos: noun
  example:
    text: Le doy una propina al portero cada mes.
    translation: אני נותנת טיפ לשוער כל חודש.
- id: p1-fila
  text: la fila
  translation: תור, שורה
  pos: noun
  example:
    text: Hay una fila larga para pagar la luz.
    translation: יש תור ארוך לתשלום החשמל.
- id: p1-llanta
  text: la llanta
  translation: צמיג
  pos: noun
  example:
    text: Mateo cambió la llanta de su coche.
    translation: מתאו החליף צמיג ברכב שלו.
- id: p1-ascensor
  text: el ascensor
  translation: מעלית
  pos: noun
  example:
    text: El ascensor del edificio no funciona hoy.
    translation: המעלית של הבניין לא עובדת היום.
- id: p1-escalera
  text: la escalera
  translation: מדרגות, סולם
  pos: noun
  example:
    text: Subimos por la escalera hasta el cuarto piso.
    translation: עלינו במדרגות עד הקומה הרביעית.
- id: p1-almohada
  text: la almohada
  translation: כרית
  pos: noun
  example:
    text: Necesito otra almohada para mi mamá.
    translation: אני צריכה עוד כרית לאמא שלי.
- id: p1-cobija
  text: la cobija
  translation: שמיכה
  pos: noun
  example:
    text: La noche está fría; ponle una cobija.
    translation: הלילה קר; תניחי עליה שמיכה.
- id: p1-lavar
  text: lavar
  translation: לשטוף, לכבס
  pos: verb
  example:
    text: Hoy tengo que lavar las sábanas.
    translation: היום אני צריכה לכבס את הסדינים.
- id: p1-barrer
  text: barrer
  translation: לטאטא
  pos: verb
  example:
    text: Doña Carmen barre la entrada todas las mañanas.
    translation: דוניה כרמן מטאטאת את הכניסה כל בוקר.
- id: p1-planchar
  text: planchar
  translation: לגהץ
  pos: verb
  example:
    text: Los viernes plancho el mantel para la cena.
    translation: בימי שישי אני מגהצת את המפה לארוחת הערב.
- id: p1-ordenar
  text: ordenar
  translation: לסדר
  pos: verb
  example:
    text: Primero voy a ordenar la sala.
    translation: קודם אסדר את הסלון.
- id: p1-tirar
  text: tirar
  translation: לזרוק
  pos: verb
  example:
    text: Voy a tirar los papeles viejos.
    translation: אני הולכת לזרוק את הניירות הישנים.
- id: p1-enchufar
  text: enchufar
  translation: לחבר לחשמל
  pos: verb
  example:
    text: Tengo que enchufar la lámpara nueva.
    translation: אני צריכה לחבר לחשמל את המנורה החדשה.
- id: p1-reparar
  text: reparar
  translation: לתקן
  pos: verb
  example:
    text: Un técnico viene a reparar el ascensor.
    translation: טכנאי בא לתקן את המעלית.
- id: p1-recoger
  text: recoger
  translation: לאסוף
  pos: verb
  example:
    text: Paso a recoger el pan antes de las doce.
    translation: אעבור לאסוף את הלחם לפני שתים־עשרה.
- id: p1-colgar
  text: colgar
  translation: לתלות
  pos: verb
  example:
    text: Ayúdame a colgar la ropa en el patio.
    translation: עזור לי לתלות את הכביסה בחצר.
- id: p1-secar
  text: secar
  translation: לייבש
  pos: verb
  example:
    text: Con este sol la ropa se va a secar rápido.
    translation: עם השמש הזאת הכביסה תתייבש מהר.
