    title: El horario de Yael
    text: 'Lunes: 9:00 reunión de equipo. 1:00 comemos.

      Miércoles: 8:30 escribo informes. 12:00 almuerzo en la cafetería.

      Viernes: llego temprano y cierro la oficina a las 2:00. Después camino a casa.

      Sábado: no trabajo.

      '
    translation: 'יום שני: 9:00 ישיבת צוות. 1:00 אוכלים.

      יום רביעי: 8:30 כותבת דוחות. 12:00 ארוחת צהריים בקפיטריה.

      יום שישי: מגיעה מוקדם וסוגרת את המשרד בשתיים. אחר כך הולכת הביתה ברגל.

      שבת: לא עובדת.

      '
