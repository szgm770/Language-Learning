grammar:
- id: er-ir-presente
  title:
    he: פעלי er ו־ir, והשעה
    en: Regular -er/-ir verbs and telling time
  explanation: '**פעלים ב־er וב־ir** מוטים כמעט כמו פעלי ar. ההבדל היחיד בין שתי הקבוצות הוא ב־**nosotros**:


    | כינוי | comer (er) | vivir (ir) |

    |---|---|---|

    | yo | como | vivo |

    | tú | comes | vives |

    | él / ella / usted | come | vive |

    | nosotros | comemos | **vivimos** |

    | ellos / ustedes | comen | viven |


    **השעה:**

    * מה השעה? → **¿Qué hora es?**

    * השעה אחת: **Es la una.** שאר השעות: **Son las dos / tres / cuatro…**

    * וחצי: **Son las tres y media.** ורבע: **y cuarto.** רבע ל־: **menos cuarto.** (Son las cuatro **menos cuarto** = 3:45.)

    * בדיוק: **en punto** (Son las cinco en punto).

    * **בשעה…** = **a la una / a las dos…**: *La reunión es a las ocho.* (בשביל "פגישה היא בשמונה")

    * הצהריים: **mediodía**. בבוקר/בערב: **de la mañana / de la tarde / de la noche**.'
  examples:
  - text: Son las ocho y media.
    translation: השעה שמונה וחצי.
  - text: La reunión es a las diez en punto.
    translation: הפגישה היא בעשר בדיוק.
  - text: Vivimos en la Ciudad de México.
    translation: אנחנו גרים במקסיקו סיטי.
