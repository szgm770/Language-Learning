id: u09-horas
cefr: A1
scene: day
title:
  he: מה השעה?
  en: What time is it?
story: 'יעל מקבלת לוח זמנים חדש במשרד. היא לומדת לשאול מה השעה, לקבוע פגישות בשעה מדויקת, ואת שתי משפחות הפעלים האחרות: er ו־ir.'
canDo:
- לשאול ולומר מה השעה
- 'להגיד ''בשעה…'': a las ocho'
- 'להטות פעלים ב־er וב־ir: comer, vivir'
- לשאול ¿cuándo? ולקבוע פגישה
