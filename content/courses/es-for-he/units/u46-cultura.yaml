  exercises:
  - id: u46-l4-01
    type: reading
    kind: נאום
    title: Una cena de despedida
    text: 'Queridos amigos:

      A lo largo de este año aprendí mucho más que una lengua. Aprendí que la identidad no se pierde cuando uno se adapta, sino que se enriquece. Preservo mis tradiciones, pero también agradezco las suyas.

      Si tuviera que resumir este año, diría que lo más valioso fue la convivencia. Ojalá pudiéramos volver a cenar juntos pronto. Gracias por todo.

      '
    translation: 'חברים יקרים:

      לאורך השנה הזאת למדתי הרבה יותר משפה. למדתי שהזהות לא אובדת כשמסתגלים, אלא מתעשרת. אני שומרת על המסורות שלי, אבל גם מודה על שלכם.

      אילו הייתי צריכה לסכם את השנה, הייתי אומרת שהדבר היקר ביותר היה הדו־קיום. הלוואי שנוכל לחזור ולהתכנס לארוחה בקרוב. תודה על הכול.

      '
