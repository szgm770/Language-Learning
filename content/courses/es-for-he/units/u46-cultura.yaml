id: u46-cultura
cefr: C1
scene: family
title:
  he: 'שפה, זהות ותרבות: סוף השנה של יעל'
  en: Language, identity and culture
story: 'שנה עברה. יעל מארחת ארוחת ערב של פרידה לשכנים, לעמיתים ולמשפחת סופיה. היא מדברת ספרדית בביטחון על זהות, על מסורת ועל מה שלמדה על מקסיקו: איך שומרים על מנהגים בארץ אחרת, ואיך שפה משנה את מי שאנחנו.'
canDo:
- לדבר על זהות, מסורת ושפה בטון משכנע
- להסביר מנהגים מהתרבות שלך לאנשים אחרים
- להשתתף בשיחה על ניואנסים תרבותיים בלי להתנצל על ההבדלים
- לסכם חוויה בצורה מורכבת ומדויקת
