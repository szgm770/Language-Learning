grammar:
- id: cultura-identidad
  title:
    he: לדבר על תרבות וזהות
    en: Talking about culture and identity
  explanation: 'בכיתה מתקדמת מדברים על רעיונות, לא רק על אירועים. כדאי לשלוט במבנים מורכבים שפגשנו לאורך הקורס, ולחבר אותם:


    **ניסוח זהירות ותרבות:**

    * *Cada cultura tiene sus costumbres; **lo importante es que** nos respetemos.* (lo importante es que + סובג''ונקטיב)

    * *No creo que **haya** una sola forma correcta de vivir.*

    * *Aunque **seamos** diferentes, compartimos valores.*


    **לבטא שינוי ולמידה:**

    * *Me **hizo** reflexionar que…* | *Gracias a este año, **he aprendido** a…* | ***A lo largo de** estos meses, **me di cuenta de** que…*


    **לדבר על זהות:**

    * *Pertenezco a una comunidad que **preserva** sus tradiciones.* | *Ser bilingüe **enriquece** la identidad.*

    * *Hay quienes piensan que… mientras que otros sostienen que…*


    **הערה על כבוד הדדי:** כשמסבירים מנהג (למשל שבת, כשרות) לאנשים אחרים, הטון הנעים: *Para mí es importante… y me alegra poder compartirlo con ustedes.* – מסביר בלי לשפוט.


    **סיכום שנה:** *Si tuviera que resumir este año, diría que… | Lo que más valoro es… | Ojalá pudiera volver.*


    **הערה:** הנושא רגיש; עדיף להתחיל מ"אני" ולא מ"אתם": *Yo suelo… / En mi comunidad se acostumbra…*'
  examples:
  - text: A lo largo de este año, me di cuenta de que ser bilingüe enriquece la identidad.
    translation: לאורך השנה הזאת הבנתי שדו־לשוניות מעשירה את הזהות.
  - text: Cada cultura tiene sus tradiciones; lo importante es que nos respetemos.
    translation: לכל תרבות יש מסורות; החשוב הוא שנכבד זה את זה.
  - text: Si tuviera que resumir este año, diría que aprendí a escuchar.
    translation: אילו הייתי צריכה לסכם את השנה, הייתי אומרת שלמדתי להקשיב.
