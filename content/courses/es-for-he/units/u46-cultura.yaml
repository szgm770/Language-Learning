  - id: u46-review-12
    type: write
    prompt: כתבו נאום או מכתב סיכום (8–10 משפטים) על שנה, על חוויה או על מקום שהשפיעו עליכם. דברו על זהות, מסורת ושפה; הסבירו מה למדתם (a lo largo de…, me di cuenta de que…); השתמשו בסובג'ונקטיב (lo importante es que…, aunque seamos…, ojalá pudiera…), בתנאי (si tuviera que resumir… diría…) ובחיבורים (sin embargo, por lo tanto, en definitiva).
