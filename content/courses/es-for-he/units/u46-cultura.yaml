      - aunque seamos
      - aunque sea
      - ojala pudiera
      - no creo que
      - es importante que
    - label: תנאי (si tuviera que… diría / sería / podría)
      any:
      - si tuviera que
      - diria
      - seria
      - podria
      - me gustaria
    - label: חיבור (sin embargo / por lo tanto / en definitiva / además)
      any:
      - sin embargo
      - por lo tanto
      - en definitiva
      - ademas
      - no obstante
      - en conclusion
    - label: נושאי זהות ותרבות (identidad, tradición, lengua, comunidad, respeto, costumbre)
      any:
      - identidad
      - tradicion
      - tradiciones
      - lengua
      - idioma
      - comunidad
      - respeto
      - costumbre
      - convivencia
    model: 'Queridos amigos: A lo largo de este año me di cuenta de que la identidad no se pierde cuando uno se adapta, sino que se enriquece. Lo importante es que nos respetemos y compartamos nuestras tradiciones. Aunque seamos diferentes, tenemos muchos valores en común. No creo que haya una sola manera de vivir; sin embargo, creo que la tolerancia es clave. Si tuviera que resumir este año, diría que aprendí a escuchar. Además, hice amigos de verdad. Ojalá pudiera volver pronto. En definitiva, esta experiencia cambió mi forma de ver el mundo.'
    lexemes: []
