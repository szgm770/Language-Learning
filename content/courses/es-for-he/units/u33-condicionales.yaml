grammar:
- id: si-clauses
  title:
    he: משפטי תנאי
    en: Conditional sentences
  explanation: 'בעברית "אם יהיה לי זמן, אבוא", "אילו היה לי זמן, הייתי בא", "אילו היה לי זמן, הייתי בא (אז)". בספרדית יש בדיוק שלוש מדרגות, והזמנים קבועים:


    **1. אפשרי / אמיתי:** si + **הווה** → **הווה / עתיד / ציווי**

    * *Si **tengo** tiempo, **voy**.* | *Si **llueve**, **me quedo** en casa.* | *Si **puedes**, **llámame**.*


    **2. דמיוני / לא סביר בהווה:** si + **סובג''ונקטיב בעבר** → **תנאי (-ría)**

    * *Si **tuviera** tiempo, **iría**.* (אילו היה לי זמן, הייתי הולכת) | *Si yo **fuera** tú, me **quedaría**.* (אילו הייתי במקומך)

    * גם: *En tu lugar, me quedaría.*


    **3. לא התממש בעבר (חרטה):** si + **pluscuamperfecto סובג''ונקטיב (hubiera + participio)** → **תנאי מושלם (habría + participio)**

    * *Si **hubiera sabido**, **habría venido**.* (אילו ידעתי, הייתי בא) | *Si **hubiéramos salido** antes, **habríamos llegado**.*


    **איסור חשוב:** אחרי **si** אין **‑ría** ואין **סובג''ונקטיב בהווה**: ✗ *Si tendría…* ✗ *Si tenga…* ✓ *Si tuviera…*

    **מילים נוספות:** *siempre que* (בתנאי ש), *de lo contrario* (אחרת), *por si acaso* (ליתר ביטחון)


    **הערה:** בדיבור מקסיקני מדברים גם בלי תנאי: *Si me dices, te ayudo.* (אם תגיד לי, אעזור) – טבעי לגמרי.'
  examples:
  - text: Si tengo tiempo, voy contigo.
    translation: אם יהיה לי זמן, אבוא איתך.
  - text: Si fuera tú, me quedaría un año más.
    translation: אילו הייתי במקומך, הייתי נשארת עוד שנה.
  - text: Si hubiera sabido, habría venido antes.
    translation: אילו ידעתי, הייתי מגיעה קודם.
