id: u33-condicionales
cefr: B2
scene: money
title:
  he: 'אם… אז…: משפטי תנאי'
  en: If-clauses
story: יעל שוקלת אם להאריך את השהות במקסיקו. מתאו שואל 'אם תישארי, מה תעשי?', סופיה אומרת 'אילו הייתי במקומך…', ודון ריקרדו מספר מה היה קורה אילו… יעל לומדת את שלושת סוגי משפטי התנאי.
canDo:
- 'לבטא תנאי אפשרי: si tengo, voy'
- 'לבטא תנאי דמיוני: si tuviera, iría'
- 'לבטא חרטה: si hubiera sabido, habría venido'
- להבחין בין si + אינדיקטיב ל־si + סובג'ונקטיב
