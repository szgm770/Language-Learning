story: יעל מתכננת נסיעה לישראל לחג. היא קונה כרטיס, מזמינה ארוחה כשרה בטיסה ומסדרת חדר במלון בדרך. היא לומדת בקשות מנומסות עם quisiera ואיך לפתור בעיות בנסיעה.
