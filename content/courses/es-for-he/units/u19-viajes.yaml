grammar:
- id: cortesia
  title:
    he: 'נימוס: quisiera ו־podría'
    en: Polite requests
  explanation: 'בנסיעה ובמלון חשוב לדבר **בנימוס**. הבסיס:


    * **Quisiera** + שם עצם או מקור = "הייתי רוצה": *Quisiera una habitación.* | *Quisiera reservar un vuelo.* (צורה מנומסת של *quiero*, זו המילה המועדפת בחנויות ובמלונות.)

    * **Me gustaría** + מקור = "הייתי רוצה / יהיה נחמד": *Me gustaría viajar a Israel.*

    * **¿Podría + מקור?** = "האם תוכל?": *¿Podría repetir, por favor?* | *¿Podría darme la llave?* (נימוס גבוה, צורת התנאי של poder.)

    * **¿Me puede…?** = "אפשר לי…?": *¿Me puede ayudar?*


    **pedir** (לבקש, להזמין) ו**preguntar** (לשאול שאלה) הם שני פעלים נפרדים, כמו בעברית "ביקש" ו"שאל":

    * *Pedí comida kosher.* (ביקשתי אוכל כשר) — **pedir** פועל e → i: *pido, pides, pide, pedimos, piden.*

    * *Pregunté la hora.* (שאלתי מה השעה)


    **מונחי נסיעה:** *ida* (הלוך), *ida y vuelta* (הלוך וחזור), *vuelo directo* (ישיר), *retraso* (עיכוב).'
  examples:
  - text: Quisiera un boleto de ida y vuelta, por favor.
    translation: הייתי רוצה כרטיס הלוך וחזור, בבקשה.
  - text: ¿Podría darme una comida kosher?
    translation: האם אפשר לקבל ארוחה כשרה?
  - text: Me gustaría una habitación con desayuno incluido.
    translation: הייתי רוצה חדר עם ארוחת בוקר כלולה.
