grammar:
- id: poder-deber
  title:
    he: poder, deber, tener que
    en: Modal verbs
  explanation: '**poder** = "יכול / אפשר". בגזרה הרגילה o נהפך ל־**ue** (כמו costar), פרט ל־nosotros:


    | כינוי | poder |

    |---|---|

    | yo | **puedo** |

    | tú | **puedes** |

    | él / ella / usted | **puede** |

    | nosotros | **podemos** |

    | ellos / ustedes | **pueden** |


    אחרי poder, deber ו־tener que בא **פועל במקור** (בלי סיומת מוטה): *Puedo abrir*, *Debo escribir*, *Tengo que llamar*.

    * **¿Puedo + מקור?** = "אפשר ל…?" (בקשה לעצמי): *¿Puedo entrar?*

    * **¿Puede/Puedes + מקור?** = "אתה יכול ל…?" (בקשה מאחר): *¿Puede repetir, por favor?*

    * **tener que** = חייבים כי צריך (עובדה); **deber** = צריך כי נכון / מוסרי: *Debes estudiar.*

    * **ayudar** — *¿Puedes ayudarme?* (אפשר לעזור לי?) — **me** מתחבר לסוף הפועל במקור.'
  examples:
  - text: ¿Puede hablar más despacio, por favor?
    translation: אפשר לדבר לאט יותר, בבקשה?
  - text: Tengo que enviar un archivo.
    translation: אני צריך לשלוח קובץ.
  - text: No podemos trabajar el sábado.
    translation: אנחנו לא יכולים לעבוד בשבת.
