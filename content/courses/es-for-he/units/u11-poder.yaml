id: u11-poder
cefr: A2
scene: work
title:
  he: אפשר? צריך? חייב?
  en: Can, must, need to
story: 'שבוע שני של יעל בחברה. הדוקטור הררה נותן לה משימות, והיא צריכה לבקש עזרה, לבקש הסבר ולהסכים או לסרב בנימוס. הפעלים החדשים: poder, deber, tener que.'
canDo:
- 'לבקש בנימוס: ¿Puedo…? ¿Puede ayudarme?'
- 'להגיד מה אני חייב ומה אני יכול: tengo que, debo, puedo'
- 'לבקש חזרה והסבר: más despacio, otra vez'
- לדבר על המחשב, הדואר והעבודה במשרד
