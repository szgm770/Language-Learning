grammar:
- id: perfecto
  title:
    he: 'pretérito perfecto: he hecho'
    en: The present perfect
  explanation: '**pretérito perfecto** = **haber** (בהווה) + **participio**. הוא משמש לדבר על **ניסיון ועל מה שהתרחש עד עכשיו** ("כבר עשיתי", "מעולם לא ביקרתי").


    **haber:** he, has, ha, hemos, han.

    **participio:** -ar → **-ado**, -er/-ir → **-ido**:

    * hablar → hablado | comer → comido | vivir → vivido


    **חריגים שחשוב לדעת:** hacer → **hecho**, decir → **dicho**, ver → **visto**, escribir → **escrito**, abrir → **abierto**, poner → **puesto**, volver → **vuelto**.


    **דוגמאות:**

    * *He trabajado en tres empresas.* | *¿Has estado alguna vez en Israel?* | *Todavía no he terminado.* | *Ya hemos comido.*


    **מילים שמלוות אותו:** *ya* (כבר), *todavía no* (עדיין לא), *nunca* (אף פעם), *alguna vez* (אי פעם), *varias veces*, *una vez*.

    **אין להפריד:** he + participio צמודים: *No he comido* (ולא *He no comido*).

    **הערה למקסיקו:** בדיבור יומיומי במקסיקו אומרים לעתים קרובות גם בעבר פשוט (*Ya comí*), אבל לניסיון ("עד היום") ה־perfecto הוא הצורה הטבעית.'
  examples:
  - text: Nunca he estado en Argentina, pero he visitado Chile.
    translation: אף פעם לא הייתי בארגנטינה, אבל ביקרתי בצ'ילה.
  - text: ¿Ya has enviado el currículum?
    translation: כבר שלחת את קורות החיים?
  - text: Todavía no he recibido una respuesta.
    translation: עדיין לא קיבלתי תשובה.
