id: u32-subj-imperfecto
cefr: B2
scene: family
title:
  he: הייתי רוצה ש… סובג'ונקטיב בעבר
  en: Imperfect subjunctive
story: 'בערב שישי יעל מתקשרת הביתה ומספרת להוריה על השנה. אמא שלה סיפרה: ''רציתי שתישארי, אבל הצעתי שתיסעי''. יעל פוגשת את הסובג''ונקטיב בעבר: quería que vinieras, ojalá tuviera, como si fuera.'
canDo:
- לבנות את הסובג'ונקטיב בעבר (hablara, comiera, tuviera, fuera)
- 'לבטא רצון, עצה וציפייה בעבר: quería que, me pidió que'
- 'להביע משאלה על ההווה: ojalá tuviera tiempo'
- 'להשתמש ב־como si… ובבקשות מנומסות: quisiera, pudiera'
