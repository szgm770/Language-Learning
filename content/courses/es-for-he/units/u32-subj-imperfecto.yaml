- id: u32-l4
  kind: reading
  title:
    he: מכתב מהבית
    en: A letter from home
  exercises:
  - id: u32-l4-01
    type: reading
    kind: מכתב
    title: Una carta de mamá
    text: 'Querida Yael:

      Cuando eras niña, yo quería que fueras valiente, y ahora lo eres. Tu papá insistió en que viajaras. Yo te aconsejé que no tuvieras miedo.

      Ojalá estuvieras aquí para la cena de Shabat, pero entiendo que trabajas. Hablas como si vivieras allí desde siempre.

      Te extrañamos. Mamá

      '
    translation: 'יעל היקרה:

      כשהיית ילדה רציתי שתהיי אמיצה, ועכשיו את כזאת. אבא שלך התעקש שתיסעי. אני יעצתי לך שלא תפחדי.

