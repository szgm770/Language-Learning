grammar:
- id: subj-imperfecto
  title:
    he: סובג'ונקטיב בעבר
    en: Imperfect subjunctive
  explanation: 'כש**הפועל הראשון בעבר** או בתנאי, הפועל השני עובר **לסובג''ונקטיב בעבר**: *Quería que **vinieras**.* (רציתי שתבוא) | *Me pidió que **esperara**.* (ביקש שאחכה)


    **איך בונים:** לוקחים את **ellos בפרטריט** (hablaron → habla‑), מורידים את ‑ron, ומוסיפים **‑ra, ‑ras, ‑ra, ‑ramos, ‑ran**:

    *hablar → hablara, hablaras, hablara, habláramos, hablaran* | *comer → comiera…* | *vivir → viviera…*

    (אפשרי גם ‑se: *hablase* – ספרותי יותר)


    **לא רגילים** (כל מה שהפרטריט שלו לא רגיל): *tener → **tuviera*** | *ser/ir → **fuera*** | *hacer → **hiciera*** | *poder → **pudiera*** | *decir → **dijera*** | *venir → **viniera*** | *querer → **quisiera*** | *estar → **estuviera***


    **שימושים עיקריים:**

    * **רצון / בקשה / עצה בעבר:** *Mi madre quería que **volviera**.* | *Me aconsejó que **descansara**.*

    * **הלוואי על ההווה (שלא קיים):** *Ojalá **tuviera** más tiempo.* (הלוואי שהיה לי יותר זמן – אבל אין)

    * **כאילו:** *Habla como si **fuera** experta.* (כאילו היא מומחית)

    * **בקשה מנומסת:** *Quisiera un café.* | *¿Pudiera ayudarme?* (קל יותר מ"podría" בקשות רשמיות)


    **הערה:** כמו בעברית ("רציתי שתבוא"), הזמן של הפועל הראשון קובע. עבר או תנאי → סובג''ונקטיב בעבר; הווה או עתיד → סובג''ונקטיב בהווה.'
  examples:
  - text: Mi mamá quería que me quedara, pero me aconsejó que viajara.
    translation: אמא שלי רצתה שאשאר, אבל יעצה לי שאסע.
  - text: Ojalá tuviera más tiempo para llamar.
    translation: הלוואי שהיה לי יותר זמן להתקשר.
  - text: Habla español como si fuera de México.
    translation: היא מדברת ספרדית כאילו היא ממקסיקו.
