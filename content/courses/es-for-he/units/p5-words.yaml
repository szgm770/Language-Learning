id: p5-words
cefr: B2
scene: news
title:
  he: 'הרחבת אוצר מילים 5: חברה וחדשות'
  en: 'Word builder 5: society and news'
story: מילים לקריאת חדשות ולשיחה על חברה, חינוך, כלכלה וסביבה. כל מילה מופיעה במשפט.
canDo:
- להבין ולהשתמש במילים נפוצות נוספות
- לזהות את המילים במשפטים אמיתיים
vocabulary:
- id: p5-encuesta
  text: la encuesta
  translation: סקר
  pos: noun
  example:
    text: Según la encuesta, la mayoría está de acuerdo.
    translation: לפי הסקר, רוב האנשים מסכימים.
- id: p5-ley
  text: la ley
  translation: חוק
  pos: noun
  example:
    text: La nueva ley entra en vigor en marzo.
    translation: החוק החדש נכנס לתוקף במרץ.
- id: p5-derecho
  text: el derecho
  translation: זכות
  pos: noun
  example:
    text: Todos tenemos derecho a la educación.
    translation: לכולנו יש זכות לחינוך.
- id: p5-obligacion
  text: la obligación
  translation: חובה
  pos: noun
  example:
    text: Cuidar a los demás es una obligación.
    translation: לדאוג לאחרים זו חובה.
- id: p5-sociedad
  text: la sociedad
  translation: חברה
  pos: noun
  example:
    text: La sociedad cambia muy rápido.
    translation: החברה משתנה מהר מאוד.
- id: p5-economia
  text: la economía
  translation: כלכלה
  pos: noun
  example:
    text: La economía del país creció este año.
    translation: כלכלת המדינה צמחה השנה.
- id: p5-empleo
  text: el empleo
  translation: תעסוקה, משרה
  pos: noun
  example:
    text: Muchos jóvenes buscan empleo.
    translation: הרבה צעירים מחפשים עבודה.
- id: p5-educacion
  text: la educación
  translation: חינוך
  pos: noun
  example:
    text: La educación es la base del futuro.
    translation: החינוך הוא הבסיס לעתיד.
- id: p5-transporte
  text: el transporte
  translation: תחבורה
  pos: noun
  example:
    text: El transporte público es barato en la ciudad.
    translation: התחבורה הציבורית זולה בעיר.
- id: p5-contaminacion
  text: la contaminación
  translation: זיהום
  pos: noun
  example:
    text: La contaminación del aire preocupa a todos.
    translation: זיהום האוויר מדאיג את כולם.
- id: p5-reciclaje
  text: el reciclaje
  translation: מיחזור
  pos: noun
  example:
    text: El reciclaje ayuda a cuidar el planeta.
    translation: המיחזור עוזר לשמור על כדור הארץ.
- id: p5-servicio
  text: el servicio
  translation: שירות
  pos: noun
  example:
    text: El servicio de salud mejoró mucho.
    translation: שירותי הבריאות השתפרו מאוד.
- id: p5-informar
  text: informar
  translation: להודיע, לדווח
  pos: verb
  example:
    text: Los periódicos deben informar con honestidad.
    translation: העיתונים צריכים לדווח ביושר.
- id: p5-denunciar
  text: denunciar
  translation: להתלונן, לדווח על
  pos: verb
  example:
    text: Es importante denunciar los abusos.
    translation: חשוב לדווח על התעללויות.
- id: p5-regular
  text: regular
  translation: להסדיר
  pos: verb
  example:
    text: El gobierno quiere regular los precios.
    translation: הממשלה רוצה להסדיר את המחירים.
- id: p5-invertir
  text: invertir
  translation: להשקיע
  pos: verb
  example:
    text: La ciudad va a invertir en transporte.
    translation: העיר הולכת להשקיע בתחבורה.
- id: p5-apoyar
  text: apoyar
  translation: לתמוך
  pos: verb
  example:
    text: Muchos vecinos quieren apoyar el proyecto.
    translation: הרבה שכנים רוצים לתמוך בפרויקט.
- id: p5-reducir
  text: reducir
  translation: להפחית
  pos: verb
  example:
    text: Queremos reducir la contaminación.
    translation: אנחנו רוצים להפחית את הזיהום.
- id: p5-publico
  text: público
  translation: ציבורי
  pos: adjective
  example:
    text: El parque es un espacio público.
    translation: הפארק הוא מרחב ציבורי.
- id: p5-social
  text: social
  translation: חברתי
  pos: adjective
  example:
    text: Es un problema social muy serio.
    translation: זו בעיה חברתית רצינית מאוד.
- id: p5-urbano
  text: urbano
  translation: עירוני
  pos: adjective
  example:
    text: El transporte urbano es esencial.
    translation: התחבורה העירונית חיונית.
- id: p5-sostenible
  text: sostenible
  translation: בר־קיימא
  pos: adjective
  example:
    text: Buscamos una solución sostenible.
    translation: אנחנו מחפשים פתרון בר־קיימא.
- id: p5-vulnerable
  text: vulnerable
  translation: פגיע
  pos: adjective
  example:
    text: Los niños son un grupo vulnerable.
    translation: ילדים הם קבוצה פגיעה.
- id: p5-gratuito
  text: gratuito
  translation: חינם
  pos: adjective
  example:
    text: El servicio es gratuito para estudiantes.
    translation: השירות הוא בחינם לסטודנטים.
- id: p5-eficaz
  text: eficaz
  translation: יעיל
  pos: adjective
  example:
    text: Es una medida eficaz y barata.
    translation: זהו צעד יעיל וזול.
