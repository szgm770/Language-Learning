    lines:
    - speaker: ricardo
      text: La encuesta muestra que la sociedad quiere cambios en la economía.
      translation: הסקר מראה שהחברה רוצה שינויים בכלכלה.
    - speaker: yael
      text: Hablan del empleo y de la educación para los jóvenes.
      translation: מדברים על תעסוקה ועל חינוך לצעירים.
    - speaker: ricardo
      text: Cada ley tiene un derecho y también una obligación.
      translation: בכל חוק יש זכות וגם חובה.
    - speaker: yael
      text: Voy a preparar un resumen.
      translation: אכין סיכום.
