      text: Hay que apoyar los servicios públicos y reducir los costos.
      translation: צריך לתמוך בשירותים ציבוריים ולהפחית עלויות.
    - speaker: yael
      text: Un transporte urbano sostenible ayuda a los más vulnerables.
      translation: תחבורה עירונית בת־קיימא עוזרת לפגיעים ביותר.
    - speaker: dani
      text: 'Y debe ser gratuito para los niños: es una medida eficaz.'
      translation: 'והיא צריכה להיות חינם לילדים: זה צעד יעיל.'
    - speaker: ricardo
      text: Perfecto, es un tema social importante.
      translation: מצוין, זה נושא חברתי חשוב.
