id: p5-words
cefr: B2
scene: work
title:
  he: הכתבה של דון ריקרדו
  en: Don Ricardo's article
story: 'דון ריקרדו מכין כתבה על העיר, ויעל עוזרת לו: סקר, חוקים, תחבורה, איכות הסביבה ושירותים לציבור. היא לומדת את שפת החברה והחדשות.'
canDo:
- לדבר על חברה, כלכלה וחוקים
- להציג עמדה על שירותים ציבוריים
- לקרוא ולדון בכתבה
vocabulary:
- id: p5-encuesta
  text: la encuesta
  translation: סקר
  pos: noun
  example:
    text: La encuesta tiene diez preguntas.
    translation: בסקר יש עשר שאלות.
- id: p5-ley
  text: la ley
  translation: חוק
  pos: noun
  example:
    text: Esa ley es nueva en la ciudad.
    translation: החוק הזה חדש בעיר.
- id: p5-derecho
  text: el derecho
  translation: זכות
  pos: noun
  example:
    text: Todos tenemos derecho a la educación.
    translation: לכולנו יש זכות לחינוך.
- id: p5-obligacion
  text: la obligación
  translation: חובה
  pos: noun
  example:
    text: Pagar impuestos es una obligación.
    translation: תשלום מסים הוא חובה.
- id: p5-sociedad
  text: la sociedad
  translation: חברה
  pos: noun
  example:
    text: La sociedad cambia muy rápido.
    translation: החברה משתנה מהר מאוד.
- id: p5-economia
  text: la economía
  translation: כלכלה
  pos: noun
  example:
    text: La economía del país está mejorando.
    translation: כלכלת המדינה משתפרת.
- id: p5-empleo
  text: el empleo
  translation: תעסוקה, משרה
  pos: noun
  example:
    text: Muchos jóvenes buscan empleo.
    translation: הרבה צעירים מחפשים עבודה.
- id: p5-educacion
  text: la educación
  translation: חינוך
  pos: noun
  example:
    text: La educación es muy importante.
    translation: חינוך חשוב מאוד.
- id: p5-transporte
  text: el transporte
  translation: תחבורה
  pos: noun
  example:
    text: El transporte en la ciudad es lento.
    translation: התחבורה בעיר איטית.
- id: p5-contaminacion
  text: la contaminación
  translation: זיהום
  pos: noun
  example:
    text: La contaminación del aire preocupa a todos.
    translation: זיהום האוויר מדאיג את כולם.
- id: p5-reciclaje
  text: el reciclaje
  translation: מיחזור
  pos: noun
  example:
    text: El reciclaje empieza en la casa.
    translation: המיחזור מתחיל בבית.
- id: p5-servicio
  text: el servicio
  translation: שירות
  pos: noun
  example:
    text: El servicio en este banco es excelente.
    translation: השירות בבנק הזה מצוין.
- id: p5-informar
  text: informar
  translation: להודיע, לדווח
  pos: verb
  example:
    text: Queremos informar a los vecinos.
    translation: אנחנו רוצים ליידע את השכנים.
- id: p5-denunciar
  text: denunciar
  translation: להתלונן, לדווח על
  pos: verb
  example:
    text: Hay que denunciar los abusos.
    translation: צריך להתלונן על עוולות.
- id: p5-regular
  text: regular
  translation: להסדיר
  pos: verb
  example:
    text: El gobierno quiere regular los precios.
    translation: הממשלה רוצה להסדיר את המחירים.
- id: p5-invertir
  text: invertir
  translation: להשקיע
  pos: verb
  example:
    text: Es buen momento para invertir en trenes.
    translation: זה זמן טוב להשקיע ברכבות.
- id: p5-apoyar
  text: apoyar
  translation: לתמוך
  pos: verb
  example:
    text: Quiero apoyar este proyecto.
    translation: אני רוצה לתמוך בפרויקט הזה.
- id: p5-reducir
  text: reducir
  translation: להפחית
  pos: verb
  example:
    text: Hay que reducir la contaminación.
    translation: צריך להפחית את הזיהום.
- id: p5-publico
  text: público
  translation: ציבורי
  pos: adjective
  example:
    text: El parque es un espacio público.
    translation: הפארק הוא מרחב ציבורי.
- id: p5-social
  text: social
  translation: חברתי
  pos: adjective
  example:
    text: Es un problema social muy serio.
    translation: זו בעיה חברתית רצינית מאוד.
- id: p5-urbano
  text: urbano
  translation: עירוני
  pos: adjective
  example:
    text: El transporte urbano es lento.
    translation: התחבורה העירונית איטית.
- id: p5-sostenible
  text: sostenible
  translation: בר־קיימא
  pos: adjective
  example:
    text: Buscamos un modelo sostenible.
    translation: אנחנו מחפשים מודל בר־קיימא.
- id: p5-vulnerable
  text: vulnerable
  translation: פגיע
  pos: adjective
  example:
    text: Los niños son un grupo vulnerable.
    translation: ילדים הם קבוצה פגיעה.
- id: p5-gratuito
  text: gratuito
  translation: חינם
  pos: adjective
  example:
    text: El museo es gratuito los domingos.
    translation: המוזיאון בחינם בימי ראשון.
- id: p5-eficaz
  text: eficaz
  translation: יעיל
  pos: adjective
  example:
    text: Es una medida muy eficaz.
    translation: זה צעד יעיל מאוד.
