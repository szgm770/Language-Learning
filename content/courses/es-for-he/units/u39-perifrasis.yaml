grammar:
- id: perifrasis
  title:
    he: צירופי פועל
    en: Verb phrases
  explanation: 'בעברית אנחנו אומרים "התחלתי ללמוד", "המשכתי לעבוד", "הפסקתי לעשן", "הרגע סיימתי". בספרדית זה פועל עזר + מילית + פועל:


    **התחלה:** *empezar a* + מקור, *ponerse a* (פתאום): *Empecé **a** estudiar.* | *Se puso **a** llorar.*

    **המשך:** *seguir* + gerundio: *Sigo **practicando**.* | *llevar + זמן + gerundio*: *Llevo un año **viviendo** aquí.* (אני גרה כאן שנה)

    **סיום / הפסקה:** *dejar de* + מקור: *Dejé **de** usar el traductor.* | *terminar de*: *Terminé **de** escribir.*

    **מקרוב:** *acabar de* + מקור (הרגע): *Acabo **de** llegar.* (הרגע הגעתי)

    **שוב:** *volver a* + מקור: *Volví **a** leer.* (קראתי שוב)

    **הרגל:** *soler* + מקור: *Suelo caminar al mercado.* (בדרך כלל אני הולכת)

    **קרוב לקרות:** *estar a punto de*: *Estoy a punto **de** salir.* (עוד רגע אצא)

    **שימו לב:** אחרי כל מילית יחס (a, de) בא **מקור**, לא gerundio. רק עם *seguir* ו*llevar* בא gerundio.


    **הערה:** *tener que* (צריך), *deber* (צריך מוסרית), *hay que* (אל־אישי) הם צירופים נוספים שכבר הכרתם.'
  examples:
  - text: Acabo de terminar el curso y sigo practicando todos los días.
    translation: הרגע סיימתי את הקורס ואני ממשיכה לתרגל כל יום.
  - text: Dejé de usar el traductor y volví a leer libros en español.
    translation: הפסקתי להשתמש במתרגם וחזרתי לקרוא ספרים בספרדית.
  - text: Llevo un año viviendo aquí y suelo caminar al mercado.
    translation: אני גרה כאן שנה ובדרך כלל הולכת ברגל לשוק.
