    en: A year in review
  exercises:
  - id: u39-l4-01
    type: reading
    kind: יומן
    title: Un año después
    text: 'Acabo de cumplir un año en México. Al principio dependía del traductor, pero dejé de usarlo y empecé a leer periódicos.

      Ahora suelo hablar español con mis vecinos y sigo practicando todos los días. Estoy a punto de terminar mi curso. Si todo sale bien, voy a volver a escribir mi diario, pero ya en español.

      '
    translation: 'הרגע מלאה לי שנה במקסיקו. בהתחלה הייתי תלויה במתרגם, אבל הפסקתי להשתמש בו והתחלתי לקרוא עיתונים.

      עכשיו בדרך כלל אני מדברת ספרדית עם השכנים וממשיכה לתרגל כל יום. אני על סף סיום הקורס. אם הכול ילך טוב, אחזור לכתוב את היומן שלי, אבל כבר בספרדית.

      '
