id: p6-words
cefr: C1
scene: study
title:
  he: ההרצאה האחרונה
  en: The last lecture
story: 'לקראת הפרידה, יעל מרצה בפני הצוות של דון ריקרדו על מה שלמדה. עכשיו היא מתמודדת עם שפה מופשטת: מגמות, קריטריונים, נקודות מבט וניואנסים.'
canDo:
- להציג רעיון מופשט בבהירות
- לנסח עמדה ולהצדיק אותה
- לנתח טקסט ולהעיר עליו בעדינות
vocabulary:
- id: p6-tendencia
  text: la tendencia
  translation: מגמה
  pos: noun
  example:
    text: Hay una tendencia clara en los datos.
    translation: יש מגמה ברורה בנתונים.
- id: p6-criterio
  text: el criterio
  translation: קריטריון, שיקול דעת
  pos: noun
  example:
    text: ¿Qué criterio usaste para elegir?
    translation: באיזה קריטריון השתמשת כדי לבחור?
- id: p6-alcance
  text: el alcance
  translation: היקף, טווח
  pos: noun
  example:
    text: El alcance del proyecto es limitado.
    translation: היקף הפרויקט מוגבל.
- id: p6-premisa
  text: la premisa
  translation: הנחת יסוד
  pos: noun
  example:
    text: La premisa del estudio es muy simple.
    translation: הנחת היסוד של המחקר פשוטה מאוד.
- id: p6-vinculo
  text: el vínculo
  translation: קשר, זיקה
  pos: noun
  example:
    text: Hay un vínculo fuerte entre ambos temas.
    translation: יש קשר חזק בין שני הנושאים.
- id: p6-brecha
  text: la brecha
  translation: פער
  pos: noun
  example:
    text: Existe una brecha entre ricos y pobres.
    translation: קיים פער בין עשירים לעניים.
- id: p6-rasgo
  text: el rasgo
  translation: תכונה, מאפיין
  pos: noun
  example:
    text: La honestidad es un rasgo importante.
    translation: יושר הוא תכונה חשובה.
- id: p6-ambito
  text: el ámbito
  translation: תחום, היקף
  pos: noun
  example:
    text: Trabajo en el ámbito de la educación.
    translation: אני עובדת בתחום החינוך.
- id: p6-perspectiva
  text: la perspectiva
  translation: נקודת מבט, אופק
  pos: noun
  example:
    text: Desde mi perspectiva, es una buena idea.
    translation: מנקודת מבטי, זה רעיון טוב.
- id: p6-sesgo
  text: el sesgo
  translation: הטיה
  pos: noun
  example:
    text: Hay un sesgo en la encuesta.
    translation: יש הטיה בסקר.
- id: p6-coyuntura
  text: la coyuntura
  translation: מצב, צירוף נסיבות
  pos: noun
  example:
    text: En la coyuntura actual es difícil invertir.
    translation: במצב הנוכחי קשה להשקיע.
- id: p6-planteamiento
  text: el planteamiento
  translation: גישה, הצגת הבעיה
  pos: noun
  example:
    text: Su planteamiento es claro y directo.
    translation: הניסוח שלו ברור וישיר.
- id: p6-plantear
  text: plantear
  translation: להציג, להעלות
  pos: verb
  example:
    text: Quiero plantear una duda.
    translation: אני רוצה להעלות ספק.
- id: p6-abordar
  text: abordar
  translation: לגשת ל, להתמודד עם
  pos: verb
  example:
    text: Vamos a abordar el tema mañana.
    translation: ניגש לנושא מחר.
- id: p6-fomentar
  text: fomentar
  translation: לעודד
  pos: verb
  example:
    text: Hay que fomentar la lectura.
    translation: צריך לעודד קריאה.
- id: p6-sostener
  text: sostener
  translation: לטעון, להחזיק
  pos: verb
  example:
    text: Los datos sostienen esa idea.
    translation: הנתונים תומכים ברעיון הזה.
- id: p6-asumir
  text: asumir
  translation: לקבל על עצמו
  pos: verb
  example:
    text: Hay que asumir la responsabilidad.
    translation: צריך לקחת אחריות.
- id: p6-reflejar
  text: reflejar
  translation: לשקף
  pos: verb
  example:
    text: Este informe va a reflejar la realidad.
    translation: הדוח הזה ישקף את המציאות.
- id: p6-subrayar
  text: subrayar
  translation: להדגיש
  pos: verb
  example:
    text: Quiero subrayar un punto importante.
    translation: אני רוצה להדגיש נקודה חשובה.
- id: p6-cuestionar
  text: cuestionar
  translation: להטיל ספק, לשאול
  pos: verb
  example:
    text: Es sano cuestionar las ideas.
    translation: בריא להטיל ספק ברעיונות.
- id: p6-sutil
  text: sutil
  translation: עדין, דק
  pos: adjective
  example:
    text: Hay una diferencia sutil entre las dos palabras.
    translation: יש הבדל עדין בין שתי המילים.
- id: p6-pertinente
  text: pertinente
  translation: רלוונטי, במקום
  pos: adjective
  example:
    text: Tu comentario es muy pertinente.
    translation: ההערה שלך רלוונטית מאוד.
- id: p6-ambiguo
  text: ambiguo
  translation: דו־משמעי
  pos: adjective
  example:
    text: El mensaje es ambiguo.
    translation: המסר דו־משמעי.
- id: p6-coherente
  text: coherente
  translation: קוהרנטי, עקבי
  pos: adjective
  example:
    text: Su argumento es coherente.
    translation: הטיעון שלו עקבי.
- id: p6-inherente
  text: inherente
  translation: טבוע, מובנה
  pos: adjective
  example:
    text: Ese riesgo es inherente al proyecto.
    translation: הסיכון הזה טבוע בפרויקט.
