    - speaker: ricardo
      text: ¿Cuál es el criterio que usaste y qué alcance tiene?
      translation: איזה קריטריון השתמשת בו ומה ההיקף שלו?
    - speaker: yael
      text: 'La premisa es simple: hay un vínculo entre idioma y confianza.'
