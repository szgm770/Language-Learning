id: p6-words
cefr: C1
scene: study
title:
  he: 'הרחבת אוצר מילים 6: שפה מופשטת ומתקדמת'
  en: 'Word builder 6: advanced and abstract'
story: 'מילים לשיחה מתקדמת ולכתיבה אקדמית: מושגים, פעלים רטוריים ותארים מדויקים. כל מילה מופיעה במשפט.'
canDo:
- להבין ולהשתמש במילים נפוצות נוספות
- לזהות את המילים במשפטים אמיתיים
vocabulary:
- id: p6-tendencia
  text: la tendencia
  translation: מגמה
  pos: noun
  example:
    text: Hay una tendencia a trabajar desde casa.
    translation: יש מגמה לעבוד מהבית.
- id: p6-criterio
  text: el criterio
  translation: קריטריון, שיקול דעת
  pos: noun
  example:
    text: Cada uno tiene su propio criterio.
    translation: לכל אחד יש שיקול דעת משלו.
- id: p6-alcance
  text: el alcance
  translation: היקף, טווח
  pos: noun
  example:
    text: El alcance del proyecto es enorme.
    translation: היקף הפרויקט עצום.
- id: p6-premisa
  text: la premisa
  translation: הנחת יסוד
  pos: noun
  example:
    text: La premisa del argumento es falsa.
    translation: הנחת היסוד של הטיעון שגויה.
- id: p6-vinculo
  text: el vínculo
  translation: קשר, זיקה
  pos: noun
  example:
    text: Existe un vínculo entre ambos temas.
    translation: קיים קשר בין שני הנושאים.
- id: p6-brecha
  text: la brecha
  translation: פער
  pos: noun
  example:
    text: Hay una brecha entre la teoría y la práctica.
    translation: יש פער בין התיאוריה לפרקטיקה.
- id: p6-rasgo
  text: el rasgo
  translation: תכונה, מאפיין
  pos: noun
  example:
    text: La paciencia es un rasgo importante.
    translation: סבלנות היא תכונה חשובה.
- id: p6-ambito
  text: el ámbito
  translation: תחום, היקף
  pos: noun
  example:
    text: En el ámbito laboral, la puntualidad es clave.
    translation: בתחום העבודה, דייקנות היא מפתח.
- id: p6-perspectiva
  text: la perspectiva
  translation: נקודת מבט, אופק
  pos: noun
  example:
    text: Desde esa perspectiva, el problema cambia.
    translation: מנקודת המבט הזו הבעיה משתנה.
- id: p6-sesgo
  text: el sesgo
  translation: הטיה
  pos: noun
  example:
    text: Todo estudio puede tener un sesgo.
    translation: בכל מחקר יכולה להיות הטיה.
- id: p6-coyuntura
  text: la coyuntura
  translation: מצב, צירוף נסיבות
  pos: noun
  example:
    text: En esta coyuntura, es mejor esperar.
    translation: במצב הנוכחי עדיף לחכות.
- id: p6-planteamiento
  text: el planteamiento
  translation: גישה, הצגת הבעיה
  pos: noun
  example:
    text: Su planteamiento del problema es original.
    translation: הגישה שלו לבעיה מקורית.
- id: p6-plantear
  text: plantear
  translation: להציג, להעלות
  pos: verb
  example:
    text: Quiero plantear una pregunta importante.
    translation: אני רוצה להעלות שאלה חשובה.
- id: p6-abordar
  text: abordar
  translation: לגשת ל, להתמודד עם
  pos: verb
  example:
    text: Hay que abordar el tema con cuidado.
    translation: צריך לגשת לנושא בזהירות.
- id: p6-fomentar
  text: fomentar
  translation: לעודד
  pos: verb
  example:
    text: La escuela debe fomentar la lectura.
    translation: בית הספר צריך לעודד קריאה.
- id: p6-sostener
  text: sostener
  translation: לטעון, להחזיק
  pos: verb
  example:
    text: Algunos expertos sostienen que es posible.
    translation: כמה מומחים טוענים שזה אפשרי.
- id: p6-asumir
  text: asumir
  translation: לקבל על עצמו
  pos: verb
  example:
    text: Tienes que asumir tu responsabilidad.
    translation: אתה צריך לקבל על עצמך את האחריות.
- id: p6-reflejar
  text: reflejar
  translation: לשקף
  pos: verb
  example:
    text: Los datos pueden reflejar la realidad.
    translation: הנתונים יכולים לשקף את המציאות.
- id: p6-subrayar
  text: subrayar
  translation: להדגיש
  pos: verb
  example:
    text: Quiero subrayar este punto.
    translation: אני רוצה להדגיש את הנקודה הזו.
- id: p6-cuestionar
  text: cuestionar
  translation: להטיל ספק, לשאול
  pos: verb
  example:
    text: No dudes en cuestionar lo que lees.
    translation: אל תהסס להטיל ספק במה שאתה קורא.
- id: p6-sutil
  text: sutil
  translation: עדין, דק
  pos: adjective
  example:
    text: Hay una diferencia sutil entre las dos palabras.
    translation: יש הבדל עדין בין שתי המילים.
- id: p6-pertinente
  text: pertinente
  translation: רלוונטי, במקום
  pos: adjective
  example:
    text: Tu comentario fue muy pertinente.
    translation: ההערה שלך הייתה במקום.
- id: p6-ambiguo
  text: ambiguo
  translation: דו־משמעי
  pos: adjective
  example:
    text: El mensaje es ambiguo y confuso.
    translation: המסר דו־משמעי ומבלבל.
- id: p6-coherente
  text: coherente
  translation: קוהרנטי, עקבי
  pos: adjective
  example:
    text: Su argumento es claro y coherente.
    translation: הטיעון שלו ברור ועקבי.
- id: p6-inherente
  text: inherente
  translation: טבוע, מובנה
  pos: adjective
  example:
    text: El riesgo es inherente a este tipo de inversión.
    translation: הסיכון טבוע בסוג כזה של השקעה.
