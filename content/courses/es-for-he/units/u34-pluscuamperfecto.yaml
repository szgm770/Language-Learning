grammar:
- id: pluscuamperfecto
  title:
    he: עבר מושלם (pluscuamperfecto)
    en: Past perfect
  explanation: 'בעברית "כשהגעתי, הוא כבר **היה יצא**" (עבר רחוק) – ספרדית משתמשת במבנה מסודר: **había + participio**.


    **המבנה:** haber באימפרפקט (**había, habías, había, habíamos, habían**) + פרטיציפ (‑ado / ‑ido):

    * *Cuando llegué, el vuelo ya **había salido**.* (כשהגעתי, הטיסה כבר יצאה)

    * *Todavía no **habíamos comido**.* | *Ya **había hablado** con ella.*


    **פרטיציפים לא רגילים:** *hacer → **hecho*** | *decir → **dicho*** | *ver → **visto*** | *escribir → **escrito*** | *poner → **puesto*** | *abrir → **abierto*** | *volver → **vuelto*** | *romper → **roto***


    **משמעות:** פעולה שהסתיימה **לפני** פעולה אחרת בעבר:

    * *Perdí el vuelo porque **había olvidado** el pasaporte.* (קודם שכחתי, אחר כך החמצתי)


    **תנאי מושלם (habría + participio):** מה **היה קורה**: *Si hubiera salido antes, **habría llegado** a tiempo.* | *Habría llamado, pero no tenía tu número.*

    **מילים נפוצות:** *ya* (כבר) | *todavía no* (עדיין לא) | *antes de* (לפני) | *después de* (אחרי) | *justo* (בדיוק) | *al + מקור* (כש…): *Al llegar, vi que…*


    **הערה:** במקסיקו משתמשים בפרטריט בדיבור יומיומי ("ya salió"), אבל pluscuamperfecto חיוני בסיפור מסודר ובכתיבה.'
  examples:
  - text: Cuando llegué al aeropuerto, el vuelo ya había salido.
    translation: כשהגעתי לשדה התעופה, הטיסה כבר יצאה.
  - text: No sabía que habías vuelto. ¿Qué habías hecho?
    translation: לא ידעתי שחזרת. מה עשית (קודם)?
  - text: Habría llegado a tiempo si no hubiera perdido el equipaje.
    translation: הייתי מגיעה בזמן לולא איבדתי את המטען.
