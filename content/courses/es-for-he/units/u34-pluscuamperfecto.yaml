  exercises:
  - id: u34-l4-01
    type: reading
    kind: סיפור
    title: El día del vuelo
    text: 'Ese día salí temprano, pero cuando llegué al aeropuerto, el vuelo ya había salido. Yo había olvidado el pasaporte en casa y tuve que volver.

      Mateo ya había llamado a la oficina y había avisado que iba a llegar tarde. Habría sido más fácil si hubiera revisado mi bolsa antes de salir.

      Al final tomé otro vuelo y llegué justo para la reunión.

      '
    translation: 'באותו יום יצאתי מוקדם, אבל כשהגעתי לשדה התעופה, הטיסה כבר יצאה. שכחתי את הדרכון בבית והייתי צריכה לחזור.

      מתאו כבר התקשר למשרד והודיע שאאחר. היה קל יותר אילו בדקתי את התיק לפני שיצאתי.

      בסוף לקחתי טיסה אחרת והגעתי בדיוק לפגישה.

      '
