id: u34-pluscuamperfecto
cefr: B2
scene: travel
title:
  he: 'כבר קרה קודם: pluscuamperfecto'
  en: Past perfect
story: 'יעל מגיעה מאוחר לשדה התעופה בגוואדלחרה: ''Cuando llegué, el vuelo ya había salido''. היא מספרת למתאו מה כבר קרה לפני ומה היה קורה אילו, ולומדת לסדר אירועים בעבר.'
canDo:
- לבנות pluscuamperfecto (había + participio)
- לספר מה קרה לפני אירוע אחר בעבר
- להשתמש בפרטיציפים לא רגילים (escrito, visto, hecho, dicho, puesto)
- 'לדבר על חרטה בעבר: habría ido, habría dicho'
