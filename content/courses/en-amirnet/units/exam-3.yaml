- להתאמן בהשלמת משפטים, בניסוח מחדש ובהבנת הנקרא
lessons:
- id: exam-3-a
  title:
    he: השלמת משפטים
    en: Sentence completion
  kind: test
  exercises:
  - id: exam-3-a-01
    type: multiple_choice
    prompt: The two brothers look alike, but their personalities are completely ______.
    options:
    - familiar
    - different
    - similar
    - identical
    correct: 1
  - id: exam-3-a-02
    type: multiple_choice
    prompt: Please ______ the instructions carefully before you begin the exam.
    options:
    - read
    - reading
    - to read
    - reads
    correct: 0
  - id: exam-3-a-03
    type: multiple_choice
    prompt: The mayor refused to ______ to the demands of the protesters.
    options:
    - give up on
    - give in
    - give out
    - give away
    correct: 1
  - id: exam-3-a-04
    type: multiple_choice
    prompt: She has lived in this city ______ she was a little girl.
