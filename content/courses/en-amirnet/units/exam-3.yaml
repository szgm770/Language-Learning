    type: multiple_choice
    prompt: Hardly ______ the building when the alarm went off.
    options:
    - had we entered
    - we had entered
    - did we entered
    - we entered
    correct: 0
  - id: exam-3-a-09
    type: multiple_choice
    prompt: The restaurant is famous for its ______ service; the waiters are always friendly and fast.
    options:
    - exhausted
