  - id: y01-l1-01
    type: dialogue
    scene: בכביש לטבריה. חנה נוהגת, איתן עם תלמוד ירושלמי על הברכיים.
    lines:
    - speaker: eitan
      text: ״תמן אמרין בשם רב״. רגע, ״תמן״? בגמרא זה ״התם״.
      translation: תמן
    - speaker: yisrael
      text: 'הירושלמי נכתב כאן, בטבריה ובציפורי. אותה שפה, מבטא אחר. ״תמן״ זה ״שם״. ובירושלמי ״תמן״ זה לפעמים פשוט: בבבל.'
      translation: ירושלמי
    - speaker: chana
      text: כמו עברית של ירושלים ועברית של חיפה.
      translation: חנה
