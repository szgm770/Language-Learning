  - id: y01-l2-15
    type: tip
    title: בבלי וירושלמי
    text: '**תמן** = התם. **אמרין** = אמרי. **תנינן** = תנן. **אילין** = הני. **בר נש** = איניש. **חמי** = חזי.


      **כיני מתניתא** = כך צריך לשנות את המשנה. **היך** = איך, כמו.'
