id: y01-tamman
cefr: A1
scene: study
title:
  he: תמן ואמרין
  en: There, and they say
story: איתן, חנה ור׳ ישראל נוסעים לטבריה, לקבר של רבי יוחנן. בדרך ר׳ ישראל מראה להם שבתלמוד הירושלמי, שנכתב כאן בגליל, הארמית נשמעת קצת אחרת.
canDo:
- 'להבין מילים של הירושלמי במקום הבבלי: תמן (התם), אמרין (אמרי), תנינן (תנן)'
- להבין כיני, היך, אילין, בר נש
- לזהות שאת שאר המילים כבר מכירים מהבבלי
vocabulary:
- id: tamman-y
  text: תמן
  translation: 'שם (בבבלי: התם)'
  pos: adverb
  example:
    text: תמן בכהן והכא בבעלים
    translation: שם (מדובר) בכהן, וכאן בבעלים
    source: ירושלמי, עבודה זרה ב, ו
    vocalized: תַּמָּן בְּכֹהֵן וְהָכָא בִּבְעָלִים
- id: amrin
  text: אמרין
  translation: 'אומרים (בבבלי: אמרי)'
  pos: verb
  example:
    text: תמן אמרין בשם רב
    translation: שם (בבבל) אומרים בשם רב
    source: ירושלמי, בבא מציעא ג, ג
    vocalized: תַּמָּן אָמְרִין בְּשֵׁם רַב
- id: tanninan
  text: תנינן
  translation: 'שנינו (בבבלי: תנן)'
  pos: verb
  example:
    text: אנן תנינן אכילת פסחים
    translation: 'אנחנו שנינו: אכילת פסחים'
    source: ירושלמי, ברכות א, א
    vocalized: אֲנָן תַּנִּינָן אֲכִילַת פְּסָחִים
- id: keini
  text: כיני
  translation: כך (״כיני מתניתא״ = כך צריך לגרוס במשנה)
  pos: adverb
  example:
    text: כיני מתניתא הלבן והשעועית
    translation: 'כך (צריך לשנות) את המשנה: הלבן והשעועית'
    source: ירושלמי, כלאים א, א
    vocalized: כֵּינִי מַתְנִיתָא הַלָּבָן וְהַשְּׁעוּעִית
- id: heich
  text: היך
  translation: איך, כמו
  pos: adverb
  example:
    text: חמי היך תנינן הכא
    translation: ראה איך שנינו כאן
    source: ירושלמי, בבא קמא ט, ח
    vocalized: חֲמִי הֵיךְ תַּנִּינָן הָכָא
- id: ilein
  text: אילין
  translation: 'אלה (בבבלי: הני)'
  pos: pronoun
  example:
    text: מאן אינון אילין צופין
    translation: מי הם אלה, ׳צופים׳?
    source: ירושלמי, מגילה א, ט
    vocalized: מָאן אִינּוּן אִילֵּין צוֹפִין
- id: bar-nash
  text: בר נש
  translation: 'אדם (בבבלי: איניש)'
  pos: phrase
  example:
    text: אתא חד בר נש
    translation: בא אדם אחד
    source: ירושלמי, נדה ב, ז
    vocalized: אָתָא חַד בַּר נַשׁ
- id: chamei
  text: חמי
  translation: 'ראה! (בבבלי: חזי)'
  pos: verb
  example:
    text: חמי היך תנינן הכא
    translation: ראה איך שנינו כאן
    source: ירושלמי, בבא קמא ט, ח
    vocalized: חֲמִי הֵיךְ תַּנִּינָן הָכָא
