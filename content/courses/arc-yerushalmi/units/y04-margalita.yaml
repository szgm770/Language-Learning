id: y04-margalita
cefr: B1
scene: study
title:
  he: חמר ומרגלי
  en: A donkey and a pearl
story: 'בחזרה מהגליל, ר׳ ישראל מספר את הסיפור האהוב על סבא: שמעון בן שטח קנה חמור, ומצא מרגלית שלא הייתה שלו.'
canDo:
- לקרוא סיפור רצוף מהירושלמי
- להבין זבנין, ארפי, לעי, מרה
- להבין ״בריך אלההון דיהודאי״
vocabulary:
- id: asik
  text: עסיק
  translation: עוסק
  pos: verb
  example:
    text: שמעון בן שטח הוה עסיק בהדא כיתנא
    translation: שמעון בן שטח היה עוסק בפשתן (מסחר בפשתן)
    source: ירושלמי, בבא מציעא ב, ה
    vocalized: שִׁמְעוֹן בֶּן שֶׁטַח הֲוָה עֲסִיק בְּהָדָא כִיתְנָא
- id: arfei
