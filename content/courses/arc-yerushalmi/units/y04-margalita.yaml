  pos: verb
  example:
    text: רבי ארפי מינך ואנן זבנין לך חדא חמר
    translation: רבי, הרפה מזה (מהעבודה), ואנחנו נקנה לך חמור
    source: ירושלמי, בבא מציעא ב, ה
    vocalized: רִבִּי. אַרְפֵּי מִינָּךְ וַאֲנָן זְבַנִּין לָךְ חָדָא חֲמָר
