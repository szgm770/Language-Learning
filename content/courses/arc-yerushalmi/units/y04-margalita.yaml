  - id: y04-l3-26
    type: reading
    kind: ירושלמי, בבא מציעא פרק ב
    title: המרגלית
    text: 'אזלון זבנון ליה חדא חמר מחד סירקאי ותלי ביה חדא מרגלי


      אתון לגביה אמרין ליה מן כדון לית את צריך לעי תובן


      אמר לון למה'
    translation: 'הלכו וקנו לו חמור מסוחר ערבי, והייתה תלויה בו מרגלית אחת.


      באו אליו ואמרו לו: מעתה אינך צריך לעמול עוד.


      אמר להם: למה?'
    lexemes:
    - zavnin
    - margali
    - lei
    source: ירושלמי, בבא מציעא ב, ה
    vocalized: אַזְלוֹן זְבַנּוֹן לֵיהּ חָדָא חֲמָר מֵחַד סִירְקַאי וּתְלִי בֵיהּ חָדָא מַרְגְּלִי. אֲתוֹן לְגַבֵּיהּ אָמְרִין לֵיהּ. מִן כְּדוֹן לֵית אַתְּ צְרִיךְ לָעֵי תוּבָן. אֲמַר לוֹן. לָמָּה
