  - id: o07-l1-01
    type: tip
    title: מספרים
    text: '**תרין** / **תרתין** = שניים / שתיים (בגמרא: תרי / תרתי).


      **עסרא** = עשרה (בגמרא: עשרה, עסרה). **עסרין** = עשרים. **אלפין** = אלפים.


      סדר: **קדמאה** = ראשון, **תליתאה** = שלישי, **שביעאה** = שביעי.'
