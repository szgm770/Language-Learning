id: o07-minyan
cefr: A2
scene: study
title:
  he: תרין וחמשא
  en: Two and five
story: 'פרשת במדבר: מספרים, חודשים וזמנים. איתן מגלה שהמספרים של אונקלוס דומים לגמרא, עם כמה הבדלים.'
canDo:
- 'להבין מספרים: תרין, תרתין, חמשא, עסרא, עסרין, אלפין'
- 'להבין סדר: קדמאה, תליתאה, שביעאה'
- להבין זמנא, זמנין, ירחא, רמשא
vocabulary:
- id: trein
  text: תרין
  translation: שניים
  pos: number
  example:
    text: כתפן עבדו לה מלפפן על תרין סטרוהי יתלפף
    translation: 'בתורה: כְּתֵפֹת עָשׂוּ־לוֹ חֹבְרֹת עַל־שְׁנֵי קצוותו [קְצוֹתָיו] חֻבָּר'
    source: תרגום אונקלוס, שמות לט, ד
    vocalized: כַּתְפָּן עֲבָדוּ לֵהּ מְלַפְּפָן עַל תְּרֵין סִטְרוֹהִי יִתְלָפֵף
- id: tartein
  text: תרתין
  translation: שתיים
  pos: number
  example:
    text: ועדיאן תרתין בנת לוט מאבוהן
    translation: 'בתורה: וַתַּהֲרֶיןָ שְׁתֵּי בְנוֹת־לוֹט מֵאֲבִיהֶן'
    source: תרגום אונקלוס, בראשית יט, לו
    vocalized: וְעַדִּיאַן תַּרְתֵּין בְּנַת לוֹט מֵאֲבוּהֶן
- id: chamsha
  text: חמשא
  translation: חמישה
  pos: number
  example:
    text: ותעבד עברי דאעי שטין חמשא לדפי סטר משכנא חד
    translation: 'בתורה: וְעָשִׂיתָ בְרִיחִם עֲצֵי שִׁטִּים חֲמִשָּׁה לְקַרְשֵׁי צֶלַע־הַמִּשְׁכָּן הָאֶחָד'
    source: תרגום אונקלוס, שמות כו, כו
    vocalized: וְתַעְבֵּד עַבְּרֵי דְאָעֵי שִׁטִין חַמְשָׁא לְדַפֵּי סְטַּר מַשְׁכְּנָא חָד
- id: asra
  text: עסרא
  translation: עשרה
  pos: number
  example:
    text: ועמרא חד מן עסרא בתלת סאין הוא
    translation: 'בתורה: וְהָעֹמֶר עֲשִׂרִית הָאֵיפָה הוּא'
    source: תרגום אונקלוס, שמות טז, לו
    vocalized: וְעֻמְרָא חַד מִן עַסְרָא בִּתְלָת סְאִין הוּא
- id: asrin
  text: עסרין
  translation: עשרים
  pos: number
  example:
    text: ולסטר משכנא תניתא לרוח צפונא עסרין דפין
    translation: 'בתורה: וּלְצֶלַע הַמִּשְׁכָּן הַשֵּׁנִית לִפְאַת צָפוֹן עֶשְׂרִים קָרֶשׁ'
    source: תרגום אונקלוס, שמות כו, כ
    vocalized: וְלִסְטַר מַשְׁכְּנָא תִּנְיֵתָא לְרוּחַ צִפּוּנָא עֶסְרִין דַפִּין
- id: chamshin
  text: חמשין
  translation: חמישים
  pos: number
  example:
    text: ולרוח קדומא מדינחא חמשין אמין
    translation: 'בתורה: וְלִפְאַת קֵדְמָה מִזְרָחָה חֲמִשִּׁים אַמָּה'
    source: תרגום אונקלוס, שמות לח, יג
    vocalized: וּלְרוּחַ קִדוּמָא מָדִינְחָא חַמְשִׁין אַמִין
- id: alfin
  text: אלפין
  translation: אלפים
  pos: number
  example:
    text: ותורי שבעין ותרין אלפין
    translation: 'בתורה: וּבָקָר שְׁנַיִם וְשִׁבְעִים אָלֶף'
    source: תרגום אונקלוס, במדבר לא, לג
    vocalized: וְתוֹרֵי שַׁבְעִין וּתְרֵין אַלְפִין
- id: kadmaa
  text: קדמאה
  translation: הראשון
  pos: adjective
  example:
    text: והוה בירחא קדמאה בשתא תניתא בחד לירחא אתקם משכנא
    translation: 'בתורה: וַיְהִי בַּחֹדֶשׁ הָרִאשׁוֹן בַּשָּׁנָה הַשֵּׁנִית בְּאֶחָד לַחֹדֶשׁ הוּקַם הַמִּשְׁכָּן'
    source: תרגום אונקלוס, שמות מ, יז
    vocalized: וַהֲוָה בְּיַרְחָא קַדְמָאָה בְּשַׁתָּא תִנְיֵתָא בְּחַד לְיַרְחָא אִתָּקַם מַשְׁכְּנָא
- id: telitaa
  text: תליתאה
  translation: השלישי
  pos: adjective
  example:
    text: וסדרא תליתאה קנכירי טרקיא ועין עגלא
    translation: 'בתורה: וְהַטּוּר הַשְּׁלִישִׁי לֶשֶׁם שְׁבוֹ וְאַחְלָמָה'
    source: תרגום אונקלוס, שמות כח, יט
    vocalized: וְסִדְרָא תְּלִיתָאָה קַנְכִּירֵי טַרְקְיָא וְעֵין עֶגְלָא
- id: shviaa
  text: שביעאה
  translation: השביעי
  pos: adjective
  example:
    text: ונחו עמא ביומא שביעאה
    translation: 'בתורה: וַיִּשְׁבְּתוּ הָעָם בַּיּוֹם הַשְּׁבִעִי'
    source: תרגום אונקלוס, שמות טז, ל
    vocalized: וְנָחוּ עַמָא בְּיוֹמָא שְׁבִיעָאָה
- id: zimna-o
  text: זמנא
  translation: הפעם; זמן
  pos: noun
  example:
    text: ועאל משה ואהרן לקדם משכן זמנא
    translation: 'בתורה: וַיָּבֹא מֹשֶׁה וְאַהֲרֹן אֶל־פְּנֵי אֹהֶל מוֹעֵד'
    source: תרגום אונקלוס, במדבר יז, ח
    vocalized: וְעָאל משֶׁה וְאַהֲרֹן לָקֳדָם מַשְׁכַּן זִמְנָא
- id: yarcha
  text: ירחא
  translation: החודש
  pos: noun
  example:
    text: ירחא הדין לכון ריש ירחין קדמאי הוא לכון לירחי שתא
    translation: 'בתורה: הַחֹדֶשׁ הַזֶּה לָכֶם רֹאשׁ חֳדָשִׁים רִאשׁוֹן הוּא לָכֶם לְחָדְשֵׁי הַשָּׁנָה'
    source: תרגום אונקלוס, שמות יב, ב
    vocalized: יַרְחָא הָדֵין לְכוֹן רֵישׁ יַרְחִין קַדְמַאי הוּא לְכוֹן לְיַרְחֵי שַׁתָּא
- id: ramsha
  text: רמשא
  translation: ערב
  pos: noun
  example:
    text: וכל דיטולמנבלתהון יצבע לבושוהי ויהי מסאב עד רמשא
    translation: 'בתורה: וְכָל־הַנֹּשֵׂא מִנִּבְלָתָם יְכַבֵּס בְּגָדָיו וְטָמֵא עַד־הָעָרֶב'
    source: תרגום אונקלוס, ויקרא יא, כה
    vocalized: וְכָל דְיִטוֹל:מִנְבִלְתְּהוֹן יְצַבַּע לְבוּשׁוֹהִי וִיהֵי מְסָאָב עַד רַמְשָׁא
