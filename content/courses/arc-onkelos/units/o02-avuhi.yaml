    en: His and theirs
  exercises:
  - id: o02-l1-01
    type: tip
    title: סיומות
    text: '**־והי** = שלו: **אבוהי** (אביו), **אחוהי** (אחיו), **בנוהי** (בניו).


      **־הון** = שלהם: **אבוהון**. **־כון** = שלכם: **אחוכון**. **־ך** = שלך: **אבוך**.


      בגמרא: אבוה, בריה. אצל אונקלוס הסיומת ארוכה יותר: ־והי.'
