id: o02-avuhi
cefr: A1
scene: study
title:
  he: אבוהי ואחוהי
  en: His father, his brother
story: 'פרשת ויגש: ״אנא יוסף אחוכון״. איתן לומד את הסיומות של אונקלוס: ־והי (שלו), ־הון (שלהם), ־כון (שלכם), ־ך (שלך).'
canDo:
- 'להבין סיומות שייכות: ־והי, ־הון, ־כון, ־ך'
- להבין שמות של בני משפחה
- לקרוא את ״אנא יוסף אחוכון״
vocabulary:
- id: avuhi
  text: אבוהי
  translation: אביו
  pos: noun
  example:
    text: ודימחי אבוהי ואמה אתקטלא יתקטל
    translation: 'בתורה: וּמַכֵּה אָבִיו וְאִמּוֹ מוֹת יוּמָת'
    source: תרגום אונקלוס, שמות כא, טו
    vocalized: וּדְיִמְחֵי אֲבוּהִי וְאִמֵהּ אִתְקְטָלָא יִתְקְטֵל
- id: achuhi
  text: אחוהי
  translation: אחיו
  pos: noun
  example:
    text: ומית יוסף וכל אחוהי וכל דרא ההוא
    translation: 'בתורה: וַיָּמָת יוֹסֵף וְכָל־אֶחָיו וְכֹל הַדּוֹר הַהוּא'
    source: תרגום אונקלוס, שמות א, ו
    vocalized: וּמִית יוֹסֵף וְכָל אַחוֹהִי וְכֹל דָרָא הַהוּא
- id: benohi
  text: בנוהי
  translation: בניו
  pos: noun
  example:
    text: וית בנוהי תקרב ותלבשנון כתונין
    translation: 'בתורה: וְאֶת־בָּנָיו תַּקְרִיב וְהִלְבַּשְׁתָּם כֻּתֳּנֹת'
    source: תרגום אונקלוס, שמות כט, ח
    vocalized: וְיָת בְּנוֹהִי תְּקָרֵב וְתַלְבֵּשִׁנוּן כִּתּוּנִין
- id: aluhi
  text: עלוהי
  translation: עליו
  pos: pronoun
  example:
    text: ואמרת לעבדיך אחיתוהי לותי ואשוי עיני עלוהי
    translation: 'בתורה: וַתֹּאמֶר אֶל־עֲבָדֶיךָ הוֹרִדֻהוּ אֵלָי וְאָשִׂימָה עֵינִי עָלָיו'
    source: תרגום אונקלוס, בראשית מד, כא
    vocalized: וַאֲמַרְתָּ לְעַבְדָּיךְ אֲחִיתוֹהִי לְוָתִי וֶאֱשַׁוֵּי עֵינִי עֲלוֹהִי
- id: kadamohi
  text: קדמוהי
  translation: לפניו
  pos: preposition
  example:
    text: אקניאו קדמוהי בפלחן טעון בתועבתא ארגיזו קדמוהי
    translation: 'בתורה: יַקְנִאֻהוּ בְּזָרִים בְּתוֹעֵבֹת יַכְעִיסֻהוּ'
    source: תרגום אונקלוס, דברים לב, טז
    vocalized: אַקְנִיאוּ קֳדָמוֹהִי בְּפָלְחַן טַעֲוָן בְּתוֹעֶבְתָּא אַרְגִיזוּ קֳדָמוֹהי
- id: avuhon
  text: אבוהון
  translation: אביהם
  pos: noun
  example:
    text: ואלין תולדת עשו אבוהון דאדומאי בטורא דשעיר
    translation: 'בתורה: וְאֵלֶּה תֹּלְדוֹת עֵשָׂו אֲבִי אֱדוֹם בְּהַר שֵׂעִיר'
    source: תרגום אונקלוס, בראשית לו, ט
    vocalized: וְאִלֵּין תּוּלְדַת עֵשָׂו אֲבוּהוֹן דֶאֱדוֹמָאֵי בְּטוּרָא דְשֵׂעִיר
- id: achuchon
  text: אחוכון
  translation: אחיכם
  pos: noun
  example:
    text: וית אחוכון דברו וקומו תובו לות גברא
    translation: 'בתורה: וְאֶת־אֲחִיכֶם קָחוּ וְקוּמוּ שׁוּבוּ אֶל־הָאִישׁ'
    source: תרגום אונקלוס, בראשית מג, יג
    vocalized: וְיָת אֲחוּכוֹן דְּבָרוּ וְקוּמוּ תּוּבוּ לְוַת גַּבְרָא
- id: avuch
  text: אבוך
  translation: אביך
  pos: noun
  example:
    text: ואמר פרעה ליוסף למימר אבוך ואחיך אתו לותך
    translation: 'בתורה: וַיֹּאמֶר פַּרְעֹה אֶל־יוֹסֵף לֵאמֹר אָבִיךָ וְאַחֶיךָ בָּאוּ אֵלֶיךָ'
    source: תרגום אונקלוס, בראשית מז, ה
    vocalized: וַאֲמַר פַּרְעֹה לְיוֹסֵף לְמֵימָר אֲבוּךְ וְאַחָיךְ אֲתוֹ לְוָתָךְ
- id: achuch
  text: אחוך
  translation: אחיך
  pos: noun
  example:
    text: ואמר על אחוך בחכמתא וקביל ברכתך
    translation: 'בתורה: וַיֹּאמֶר בָּא אָחִיךָ בְּמִרְמָה וַיִּקַּח בִּרְכָתֶךָ'
    source: תרגום אונקלוס, בראשית כז, לה
    vocalized: וַאֲמַר עַל אָחוּךְ בְּחָכְמְתָא וְקַבִּיל בִּרְכְּתָךְ
- id: lotach
  text: לותך
  translation: אליך
  pos: preposition
  example:
    text: ינהר יי שכנתה לותך וירחם יתך
    translation: 'בתורה: יָאֵר יְהוָה פָּנָיו אֵלֶיךָ וִיחֻנֶּךָּ'
    source: תרגום אונקלוס, במדבר ו, כה
    vocalized: יַנְהַר יְיָ שְׁכִנְתֵּהּ לְוָתָךְ וִירַחֵם יָתָךְ
- id: imchon
  text: עמכון
  translation: איתכם
  pos: preposition
  example:
    text: ממלל עם ממלל מליל יי עמכון בטורא מגו אשתא
    translation: 'בתורה: פָּנִים בְּפָנִים דִּבֶּר יְהוָה עִמָּכֶם בָּהָר מִתּוֹךְ הָאֵשׁ'
    source: תרגום אונקלוס, דברים ה, ד
    vocalized: מַמְלָל עִם מַמְלָל מַלִיל יְיָ עִמְכוֹן בְּטוּרָא מִגוֹ אֶשָׁתָא
- id: kodamach
  text: קדמך
  translation: לפניך
  pos: preposition
  example:
    text: ואמר אברהם קדם יי לוי ישמעאל יתקים קדמך
    translation: 'בתורה: וַיֹּאמֶר אַבְרָהָם אֶל־הָאֱלֹהִים לוּ יִשְׁמָעֵאל יִחְיֶה לְפָנֶיךָ'
    source: תרגום אונקלוס, בראשית יז, יח
    vocalized: וַאֲמַר אַבְרָהָם קֳדָם יְיָ לְוַי יִשְׁמָעֵאל יִתְקַיָּם קֳדָמָךְ
