  - id: o06-l3-43
    type: reading
    kind: תרגום אונקלוס, ויקרא א
    title: קורבנא
    text: 'וקרא למשה ומליל יי עמיה ממשכן זמנא למימר


      מליל עם בני ישראל ותימר להון אנש ארי יקרב מנכון קורבנא קדם יי מן בעירא מן תורי ומן ענא תקרבון ית קורבנכון'
    translation: 'וַיִּקְרָא אֶל־מֹשֶׁה וַיְדַבֵּר יְהוָה אֵלָיו מֵאֹהֶל מוֹעֵד לֵאמֹר


      דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל וְאָמַרְתָּ אֲלֵהֶם אָדָם כִּי־יַקְרִיב מִכֶּם קָרְבָּן לַיהוָה מִן־הַבְּהֵמָה מִן־הַבָּקָר וּמִן־הַצֹּאן תַּקְרִיבוּ אֶת־קָרְבַּנְכֶם'
