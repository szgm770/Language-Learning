id: o06-madbecha
cefr: A2
scene: study
title:
  he: מדבחא וקורבנא
  en: Altar and offering
story: 'פרשת ויקרא. מילים של המשכן והקרבנות: מזבח, קרבן, עולה, מנחה, קטורת, ומשכן.'
canDo:
- להבין מדבחא, קורבנא, עלתא, מנחתא, נכסת קודשיא
- להבין משכנא, ארונא, מנרתא, פתורא
- להבין סלתא, משחא, תרבא, בוסמיא
vocabulary:
- id: madbecha
  text: מדבחא
  translation: המזבח
  pos: noun
  example:
    text: ושוי ית מדבחא דדהבא במשכן זמנא קדם פרכתא
    translation: 'בתורה: וַיָּשֶׂם אֶת־מִזְבַּח הַזָּהָב בְּאֹהֶל מוֹעֵד לִפְנֵי הַפָּרֹכֶת'
    source: תרגום אונקלוס, שמות מ, כו
    vocalized: וְשַׁוִי יָת מַדְבְּחָא דְדַהֲבָא בְּמַשְׁכַּן זִמְנָא קֳדָם פָּרֻכְתָּא
- id: kurbana
  text: קורבנא
  translation: הקרבן
  pos: noun
  example:
    text: ויסיק יתהון כהנא למדבחא קורבנא קדם יי אשמא הוא
    translation: 'בתורה: וְהִקְטִיר אֹתָם הַכֹּהֵן הַמִּזְבֵּחָה אִשֶּׁה לַיהוָה אָשָׁם הוּא'
    source: תרגום אונקלוס, ויקרא ז, ה
    vocalized: וְיַסֵיק יָתְהוֹן כַּהֲנָא לְמַדְבְּחָא קוּרְבָּנָא קֳדָם יְיָ אֲשָׁמָא הוּא
- id: alta
  text: עלתא
  translation: העולה
  pos: noun
  example:
    text: וקרב ית עלתא ועבדה כדחזי
    translation: 'בתורה: וַיַּקְרֵב אֶת־הָעֹלָה וַיַּעֲשֶׂהָ כַּמִּשְׁפָּט'
    source: תרגום אונקלוס, ויקרא ט, טז
    vocalized: וְקָרֵב יָת עֲלָתָא וְעָבְדַהּ כִּדְחָזֵי
- id: minchata
  text: מנחתא
  translation: המנחה
  pos: noun
  example:
    text: ואם מנחתא דרדתא קורבנך סולתא במשח תתעבד
    translation: 'בתורה: וְאִם־מִנְחַת מַרְחֶשֶׁת קָרְבָּנֶךָ סֹלֶת בַּשֶּׁמֶן תֵּעָשֶׂה'
    source: תרגום אונקלוס, ויקרא ב, ז
    vocalized: וְאִם מִנְחָתָא דְרַדְתָּא קוּרְבָּנָךְ סוּלְתָּא בִּמְשַׁח תִּתְעֲבֵד
- id: nichsat
  text: נכסת
  translation: זבח (״נכסת קודשיא״ = זבח שלמים)
  pos: noun
  example:
    text: ותכוס נכסת קודשין ותיכול תמן ותחדי קדם יי אלהך
    translation: 'בתורה: וְזָבַחְתָּ שְׁלָמִים וְאָכַלְתָּ שָּׁם וְשָׂמַחְתָּ לִפְנֵי יְהוָה אֱלֹהֶיךָ'
    source: תרגום אונקלוס, דברים כז, ז
    vocalized: וְתִכּוֹס נִכְסַת קוּדְשִׁין וְתֵיכוּל תַּמָן וְתֶחֱדֵי קֳדָם יְיָ אֱלָהָךְ
- id: chatata
  text: חטאתא
  translation: החטאת
  pos: noun
  example:
    text: ויסבון לדמסאב מעפר יקידת חטאתא ויתן עלוהי מי מבוע למן
    translation: 'בתורה: וְלָקְחוּ לַטָּמֵא מֵעֲפַר שְׂרֵפַת הַחַטָּאת וְנָתַן עָלָיו מַיִם חַיִּים אֶל־כֶּלִי'
    source: תרגום אונקלוס, במדבר יט, יז
    vocalized: וְיִסְבוּן לְדִמְסָאָב מֵעֲפַר יְקִידַת חַטָאתָא וְיִתֵּן עֲלוֹהִי מֵי מַבּוּעַ לְמָן
- id: mishkena
  text: משכנא
  translation: המשכן
  pos: noun
  example:
    text: ולסיפי משכנא מערבא תעבד שתא דפין
    translation: 'בתורה: וּלְיַרְכְּתֵי הַמִּשְׁכָּן יָמָּה תַּעֲשֶׂה שִׁשָּׁה קְרָשִׁים'
    source: תרגום אונקלוס, שמות כו, כב
    vocalized: וְלִסְיָפֵי מַשְׁכְּנָא מַעַרְבָא תַּעְבֵּד שִׁתָּא דַפִּין
- id: arona
  text: ארונא
  translation: הארון
  pos: noun
  example:
    text: ית ארונא דסהדותא וית אריחוהי וית כפרתא
    translation: 'בתורה: אֶת־אֲרֹן הָעֵדֻת וְאֶת־בַּדָּיו וְאֵת הַכַּפֹּרֶת'
    source: תרגום אונקלוס, שמות לט, לה
    vocalized: יָת אֲרוֹנָא דְסַהֲדוּתָא וְיָת אֲרִיחוֹהִי וְיָת כַּפֻּרְתָּא
- id: menarta
  text: מנרתא
  translation: המנורה
  pos: noun
  example:
    text: על מנרתא דכיתא יסדר ית בוציניא קדם יי תדירא
    translation: 'בתורה: עַל הַמְּנֹרָה הַטְּהֹרָה יַעֲרֹךְ אֶת־הַנֵּרוֹת לִפְנֵי יְהוָה תָּמִיד'
    source: תרגום אונקלוס, ויקרא כד, ד
    vocalized: עַל מְנַרְתָּא דָכִיתָא יַסְדַר יָת בּוֹצִינַיָא קֳדָם יְיָ תְּדִירָא
- id: patura
  text: פתורא
  translation: השולחן
  pos: noun
  example:
    text: ותתן על פתורא לחם אפיא קדמי תדירא
    translation: 'בתורה: וְנָתַתָּ עַל־הַשֻּׁלְחָן לֶחֶם פָּנִים לְפָנַי תָּמִיד'
    source: תרגום אונקלוס, שמות כה, ל
    vocalized: וְתִתֵּן עַל פָּתוֹרָא לְחֵם אַפַּיָא קֳדָמַי תְּדִירָא
- id: silta
  text: סלתא
  translation: סולת
  pos: noun
  example:
    text: או לדכרא תעבד מנחתא סלתא תרין עשרונין דפילא במשח תלתות הינא
    translation: 'בתורה: אוֹ לָאַיִל תַּעֲשֶׂה מִנְחָה סֹלֶת שְׁנֵי עֶשְׂרֹנִים בְּלוּלָה בַשֶּׁמֶן שְׁלִשִׁית הַהִין'
    source: תרגום אונקלוס, במדבר טו, ו
    vocalized: אוֹ לְדִכְרָא תַּעְבֵּד מִנְחָתָא סֻלְתָּא תְּרֵין עַשְׂרוֹנִין דְפִילָא בִמְשַׁח תַּלְתּוּת הִינָא
- id: meshcha
  text: משחא
  translation: שמן
  pos: noun
  example:
    text: משחא לאנהרותא בוסמיא למשחא דרבותא ולקטורת בוסמיא
    translation: 'בתורה: שֶׁמֶן לַמָּאֹר בְּשָׂמִים לְשֶׁמֶן הַמִּשְׁחָה וְלִקְטֹרֶת הַסַּמִּים'
    source: תרגום אונקלוס, שמות כה, ו
    vocalized: מִשְׁחָא לְאַנְהָרוּתָא בּוּסְמַיָא לְמִשְׁחָא דִרְבוּתָא וְלִקְטוֹרֶת בּוּסְמַיָא
- id: tarba
  text: תרבא
  translation: חלב (שומן)
  pos: noun
  example:
    text: וית תרבא דחטאתא יסק למדבחא
    translation: 'בתורה: וְאֵת חֵלֶב הַחַטָּאת יַקְטִיר הַמִּזְבֵּחָה'
    source: תרגום אונקלוס, ויקרא טז, כה
    vocalized: וְיָת תַּרְבָּא דְחַטָאתָא יַסֵק לְמַדְבְּחָא
