id: o11-tavid
cefr: A2
scene: study
title:
  he: תעבד ותיכלון
  en: You shall do, you shall eat
story: 'פרשת משפטים: ציוויים בעתיד. איתן לומד את צורות העתיד של אונקלוס: תעבד, תעבדון, יעבד, ייכול, ותימר, וגם טמא וטהור.'
canDo:
- 'להבין עתיד: תעבד (תעשה), תעבדון (תעשו), יעבד (יעשה)'
- להבין תיכלון, ייכול, ותימר, ותסב, יהון
- להבין מסאב (טמא), דכי (טהור), טב, תחות, תרע
vocabulary:
- id: taavid
  text: תעבד
  translation: תעשה
  pos: verb
  example:
    text: מסוף שבע שנין תעבד שמטתא
    translation: 'בתורה: מִקֵּץ שֶׁבַע־שָׁנִים תַּעֲשֶׂה שְׁמִטָּה'
    source: תרגום אונקלוס, דברים טו, א
    vocalized: מִסוֹף שְׁבַע שְׁנִין תַּעְבֵּד שְׁמִטְתָא
- id: taavdun
  text: תעבדון
  translation: תעשו
  pos: verb
  example:
    text: לא תעבדון כן קדם יי אלהכון
    translation: 'בתורה: לֹא־תַעֲשׂוּן כֵּן לַיהוָה אֱלֹהֵיכֶם'
    source: תרגום אונקלוס, דברים יב, ד
    vocalized: לָא תַעְבְּדוּן כֵּן קֳדָם יְיָ אֱלָהָכוֹן
- id: yaavid
  text: יעבד
  translation: יעשה
  pos: verb
  example:
    text: ואם לברה יקימנה כהלכת בנת ישראל יעבד לה
    translation: 'בתורה: וְאִם־לִבְנוֹ יִיעָדֶנָּה כְּמִשְׁפַּט הַבָּנוֹת יַעֲשֶׂה־לָּהּ'
    source: תרגום אונקלוס, שמות כא, ט
    vocalized: וְאִם לִבְרֵהּ יְקַיְמִנַהּ כְּהִלְכַת בְּנַת יִשְׂרָאֵל יַעְבֵּד לַהּ
- id: teichlun
  text: תיכלון
  translation: תאכלו
  pos: verb
  example:
    text: כל צפר דכיא תיכלון
    translation: 'בתורה: כָּל־צִפּוֹר טְהֹרָה תֹּאכֵלוּ'
    source: תרגום אונקלוס, דברים יד, יא
    vocalized: כָּל צִפַּר דַכְיָא תֵּיכְלוּן
- id: yeichul
  text: ייכול
  translation: יאכל
  pos: verb
  example:
    text: קרבן אלהה מקדש קודשיא ומן קודשיא ייכול
    translation: 'בתורה: לֶחֶם אֱלֹהָיו מִקָּדְשֵׁי הַקֳּדָשִׁים וּמִן־הַקֳּדָשִׁים יֹאכֵל'
    source: תרגום אונקלוס, ויקרא כא, כב
    vocalized: קֻרְבַּן אֱלָהֵהּ מִקֹדֶשׁ קוּדְשַׁיָא וּמִן קוּדְשַׁיָא יֵיכוּל
- id: veteimar
  text: ותימר
  translation: ותאמר
  pos: verb
  example:
    text: ותימר לות פרעה כדנן אמר יי ברי בוכרי ישראל
    translation: 'בתורה: וְאָמַרְתָּ אֶל־פַּרְעֹה כֹּה אָמַר יְהוָה בְּנִי בְכֹרִי יִשְׂרָאֵל'
    source: תרגום אונקלוס, שמות ד, כב
    vocalized: וְתֵימַר לְוָת פַּרְעֹה כִּדְנַן אֲמַר יְיָ בְּרִי בוּכְרִי יִשְׂרָאֵל
- id: vetisav
  text: ותסב
  translation: ותיקח
  pos: verb
  example:
    text: אלהן לבית אבא תזיל ולזרעיתי ותסב אתתא לברי
    translation: 'בתורה: אִם־לֹא אֶל־בֵּית־אָבִי תֵּלֵךְ וְאֶל־מִשְׁפַּחְתִּי וְלָקַחְתָּ אִשָּׁה לִבְנִי'
    source: תרגום אונקלוס, בראשית כד, לח
    vocalized: אֶלָהֵן לְבֵית אַבָּא תֵּזִיל וּלְזַרְעִיתִי וְתִסַּב אִתְּתָא לִבְרִי
- id: yehon
  text: יהון
  translation: יהיו
  pos: verb
  example:
    text: בעזקתא דארונא יהון אריחיא לא יעדון מנה
    translation: 'בתורה: בְּטַבְּעֹת הָאָרֹן יִהְיוּ הַבַּדִּים לֹא יָסֻרוּ מִמֶּנּוּ'
    source: תרגום אונקלוס, שמות כה, טו
    vocalized: בְּעִזְקְתָא דַאֲרוֹנָא יְהוֹן אֲרִיחַיָא לָא יְעִדוּן מִנֵהּ
- id: yehavit
  text: יהבית
  translation: נתתי
  pos: verb
  example:
    text: ולמכיר יהבית ית גלעד
    translation: 'בתורה: וּלְמָכִיר נָתַתִּי אֶת־הַגִּלְעָד'
    source: תרגום אונקלוס, דברים ג, טו
    vocalized: וּלְמָכִיר יְהָבִית יָת גִלְעָד
- id: mesav
  text: מסאב
  translation: טמא
  pos: adjective
  example:
    text: וביומא דאתחזי בה בסרא חיא יהי מסאב
    translation: 'בתורה: וּבְיוֹם הֵרָאוֹת בּוֹ בָּשָׂר חַי יִטְמָא'
    source: תרגום אונקלוס, ויקרא יג, יד
    vocalized: וּבְיוֹמָא דְאִתַּחֲזִי בֵהּ בִּסְרָא חַיָא יְהֵי מְסָאָב
- id: vidachei
  text: וידכי
  translation: ויטהר
  pos: verb
  example:
    text: ויסק כהנא ית עלתא וית מנחתא למדבחא ויכפר עלוהי כהנא וידכי
    translation: 'בתורה: וְהֶעֱלָה הַכֹּהֵן אֶת־הָעֹלָה וְאֶת־הַמִּנְחָה הַמִּזְבֵּחָה וְכִפֶּר עָלָיו הַכֹּהֵן וְטָהֵר'
    source: תרגום אונקלוס, ויקרא יד, כ
    vocalized: וְיַסֵק כַּהֲנָא יָת עֲלָתָא וְיָת מִנְחָתָא לְמַדְבְּחָא וִיכַפֵּר עֲלוֹהִי כַּהֲנָא וְיִדְכֵּי
- id: tav-o
  text: טב
  translation: טוב
  pos: adjective
  example:
    text: ודהבא דארעא ההיא טב תמן בדלחא ואבני בורלא
    translation: 'בתורה: וּזֲהַב הָאָרֶץ הַהִוא טוֹב שָׁם הַבְּדֹלַח וְאֶבֶן הַשֹּׁהַם'
    source: תרגום אונקלוס, בראשית ב, יב
    vocalized: וְדַהֲבָא דְאַרְעָא הַהִיא טָב תַּמָן בְּדָלְחָא וְאַבְנֵי בוּרְלָא
- id: techot
  text: תחות
  translation: תחת
  pos: preposition
  example:
    text: יסבון כען זעיר מיא ואסחו רגליכון ואסתמיכו תחות אילנא
    translation: 'בתורה: יֻקַּח־נָא מְעַט־מַיִם וְרַחֲצוּ רַגְלֵיכֶם וְהִשָּׁעֲנוּ תַּחַת הָעֵץ'
    source: תרגום אונקלוס, בראשית יח, ד
    vocalized: יִסְּבוּן כְּעַן זְעֵיר מַיָּא וְאַסְחוּ רַגְלֵיכוֹן וְאִסְתְּמִיכוּ תְּחוֹת אִילָנָא
- id: tera
  text: תרע
  translation: שער
  pos: noun
  example:
    text: ותתן ית מדבחא דעלתא קדם תרע משכנא משכן זמנא
    translation: 'בתורה: וְנָתַתָּה אֵת מִזְבַּח הָעֹלָה לִפְנֵי פֶּתַח מִשְׁכַּן אֹהֶל־מוֹעֵד'
    source: תרגום אונקלוס, שמות מ, ו
    vocalized: וְתִתֵּן יָת מַדְבְּחָא דַעֲלָתָא קֳדָם תְּרַע מַשְׁכְּנָא מַשְׁכַּן זִמְנָא
