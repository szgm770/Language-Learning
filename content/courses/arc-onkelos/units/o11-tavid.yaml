    title: עתיד אצל אונקלוס
    text: '**ת־** = אתה / את (**תעבד**, **תיכול**). **ת־ ...ון** = אתם (**תעבדון**, **תיכלון**).


      **י־** = הוא (**יעבד**, **ייכול**). **י־ ...ון** = הם (**יהון**, **יקרבון**).


      בגמרא הבבלית ״הוא יעשה״ נכתב לפעמים בנ״ו (נעביד); אצל אונקלוס תמיד ביו״ד.'
