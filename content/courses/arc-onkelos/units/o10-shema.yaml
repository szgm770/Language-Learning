id: o10-shema
cefr: B1
scene: study
title:
  he: שמע ישראל
  en: Hear, O Israel
story: 'פרשת ואתחנן. איתן קורא את ״שמע ישראל״ ואת ברכת כהנים בתרגום אונקלוס, וממשיך לבד: שניים מקרא ואחד תרגום, כל שבוע.'
canDo:
- לקרוא את ״שמע ישראל״ בתרגום
- לקרוא את ברכת כהנים בתרגום
- להבין רחים, ותתני, ותמליל, ויטר, ויסגי
vocabulary:
- id: terachem
  text: ותרחם
  translation: ואהבת
  pos: verb
  example:
    text: ותרחם ית יי אלהך בכל לבך ובכל נפשך ובכל נכסך
    translation: 'בתורה: וְאָהַבְתָּ אֵת יְהוָה אֱלֹהֶיךָ בְּכָל־לְבָבְךָ וּבְכָל־נַפְשְׁךָ וּבְכָל־מְאֹדֶךָ'
    source: תרגום אונקלוס, דברים ו, ה
    vocalized: וְתִרְחַם יָת יְיָ אֱלָהָךְ בְּכָל לִבָּךְ וּבְכָל נַפְשָׁךְ וּבְכָל נִכְסָךְ
- id: lechalach
  text: לבך
  translation: לבבך
  pos: noun
  example:
    text: ואם יפני לבך ולא תקבל ותטעי ותסגוד לטעות עממיא ותפלחנון
    translation: 'בתורה: וְאִם־יִפְנֶה לְבָבְךָ וְלֹא תִשְׁמָע וְנִדַּחְתָּ וְהִשְׁתַּחֲוִיתָ לֵאלֹהִים אֲחֵרִים וַעֲבַדְתָּם'
    source: תרגום אונקלוס, דברים ל, יז
    vocalized: וְאִם יִפְנֵי לִבָּךְ וְלָא תְקַבֵּל וְתִטְּעֵי וְתִסְגוּד לְטַּעֲוַת עַמְמַיָא וְתִפְלְחִנוּן
- id: teteni
  text: ותתננון
  translation: ושיננתם
  pos: verb
  example:
    text: ותתננון לבניך ותמלל בהון במתבך בביתך ובמהכך בארחא ובמשכבך ובמקימך
    translation: 'בתורה: וְשִׁנַּנְתָּם לְבָנֶיךָ וְדִבַּרְתָּ בָּם בְּשִׁבְתְּךָ בְּבֵיתֶךָ וּבְלֶכְתְּךָ בַדֶּרֶךְ וּבְשָׁכְבְּךָ וּבְקוּמֶךָ'
    source: תרגום אונקלוס, דברים ו, ז
    vocalized: וּתְתָנִנוּן לִבְנָיךְ וּתְמַלֵל בְּהוֹן בְּמִתְּבָךְ בְּבֵיתָךְ וּבִמְהָכָךְ בְּאָרְחָא וּבְמִשְׁכְּבָךְ וּבִמְקִימָךְ
- id: temallel
  text: ותמלל
  translation: ודיברת
  pos: verb
  example:
    text: ותתננון לבניך ותמלל בהון במתבך בביתך ובמהכך בארחא ובמשכבך ובמקימך
    translation: 'בתורה: וְשִׁנַּנְתָּם לְבָנֶיךָ וְדִבַּרְתָּ בָּם בְּשִׁבְתְּךָ בְּבֵיתֶךָ וּבְלֶכְתְּךָ בַדֶּרֶךְ וּבְשָׁכְבְּךָ וּבְקוּמֶךָ'
    source: תרגום אונקלוס, דברים ו, ז
